name: Web

on:
  push:
    branches: [main, upgrade/2026-baseline]
  workflow_dispatch:
    inputs:
      cpu_diagnostics:
        description: Run bounded synthetic browser sampling after container qualification fails
        type: boolean
        required: false
        default: false
      cpu_full_batches:
        description: Sample original full batches after the unchanged strict baseline fails
        type: boolean
        required: false
        default: false
      cpu_phase_metrics:
        description: Observe original resident-entry threadTicks inside approved full-batch diagnostics
        type: boolean
        required: false
        default: false
      compare_ohio_runtimes:
        description: Compare the same focused Ohio journeys in both runtime modes on one runner
        type: boolean
        required: false
        default: false
      ohio_trace_pair:
        description: Compare trace capture modes in one original failing Ohio window after strict qualification
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.ohio_trace_pair && format('web-ohio-trace-pair-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && inputs.compare_ohio_runtimes && format('web-ohio-comparison-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && inputs.cpu_full_batches && format('web-cpu-full-batches-{0}', github.run_id) || format('web-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:web
      - run: pnpm build:web

  browser:
    name: Browser Flows (self-host)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TAX_ENGINE_DEPLOYMENT_MODE: self-host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify original-entry timing contracts
        run: node --test tests/scripts/thread-tick-phase.test.mjs tests/scripts/full-batch-public-cpu-diagnostic.test.mjs
      - run: pnpm test:setup
      - run: pnpm --filter @tax-engine/web exec playwright install --with-deps chromium
      - run: pnpm sample-docs:fetch
      - run: pnpm test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-failures
          path: |
            apps/web/playwright-report/
            apps/web/test-results/

  container:
    name: Container Recovery, Browser Flows and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TAX_ENGINE_DEPLOYMENT_MODE: self-host
      TAX_ENGINE_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm test:setup
      - run: pnpm --filter @tax-engine/web exec playwright install --with-deps chromium
      - run: pnpm sample-docs:fetch
      - name: Install patched PostgreSQL 16 recovery client from PGDG
        id: postgres_client_install
        run: |
          suite="$(lsb_release -cs)-pgdg"
          key=/usr/share/keyrings/tax-engine-pgdg.asc
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee "$key" >/dev/null
          sudo tee /etc/apt/sources.list.d/tax-engine-pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: $suite
          Components: main
          Signed-By: $key B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          EOF
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
      - name: Verify and record PostgreSQL recovery client versions
        id: postgres_client_versions
        run: |
          : > container-postgres-client-versions.txt
          for tool in pg_dump pg_restore; do
            version="$("$TAX_ENGINE_TEST_POSTGRES_BIN/$tool" --version)"
            printf '%s\n' "$version" | tee -a container-postgres-client-versions.txt
            version_pattern="^${tool} [(]PostgreSQL[)] 16[.]([1-9][0-9]*)([[:blank:]]|$)"
            if [[ ! $version =~ $version_pattern ]] || (( BASH_REMATCH[1] < 16 )); then
              echo "$tool must be PostgreSQL 16.16 or a later 16.x release" >&2
              exit 1
            fi
          done
      - run: docker pull node:26.13.1-trixie-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
      - run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag tax-engine:ci .
      - name: Retain native host and immutable candidate provenance
        id: candidate
        run: |
          uname -sm > container-host.txt
          test "$(uname -sm)" = 'Linux x86_64'
          test "$(docker version --format '{{.Server.Os}}')" = linux
          test "$(docker version --format '{{.Server.Arch}}')" = amd64
          docker info --format '{{json .Architecture}} {{json .OSType}} {{json .CgroupVersion}} {{json .NCPU}} {{json .MemTotal}}' >> container-host.txt
          git rev-parse HEAD 'HEAD^{tree}' > container-source.txt
          sha256sum Dockerfile pnpm-lock.yaml .github/workflows/web.yml >> container-source.txt
          git archive "$GITHUB_SHA" | sha256sum >> container-source.txt
          candidate_id=$(docker image inspect --format '{{.Id}}' tax-engine:ci)
          test "${candidate_id#sha256:}" != "$candidate_id"
          docker image inspect "$candidate_id" > container-candidate.json
          printf 'image_id=%s\n' "$candidate_id" >> "$GITHUB_OUTPUT"
          docker image inspect --format '{{json .Id}} {{json .Os}} {{json .Architecture}} {{json .Config.Labels}} {{json .RepoDigests}} {{json .RootFS.Layers}}' "$candidate_id" > container-candidate.txt
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$candidate_id")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{.Architecture}}' "$candidate_id")" = "$(docker version --format '{{.Server.Arch}}')"
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint /usr/bin/ldd "$candidate_id" /usr/local/bin/node > container-ldd.txt
          if grep -F 'not found' container-ldd.txt; then exit 1; fi
      - env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: node scripts/smoke-container.mjs "$CANDIDATE_IMAGE_ID" | tee container-smoke.log
      - name: Build immutable previous application for upgrade and rollback
        id: previous
        run: |
          previous_source=$(mktemp -d)
          trap 'rm -rf "$previous_source"' EXIT
          git archive d32cb8cf3d607c643c4c7f7e1b845fcace61563f | tar -x -C "$previous_source"
          docker build --label org.opencontainers.image.revision=d32cb8cf3d607c643c4c7f7e1b845fcace61563f --tag tax-engine:previous "$previous_source"
          previous_id=$(docker image inspect --format '{{.Id}}' tax-engine:previous)
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$previous_id")" = d32cb8cf3d607c643c4c7f7e1b845fcace61563f
          docker image inspect "$previous_id" > container-previous.json
          printf 'image_id=%s\n' "$previous_id" >> "$GITHUB_OUTPUT"
      - name: Rehearse isolated Compose upgrade, recovery and rollback
        env:
          PREVIOUS_IMAGE_ID: ${{ steps.previous.outputs.image_id }}
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: node --import tsx scripts/rehearse-self-host-release.mjs "$PREVIOUS_IMAGE_ID" "$CANDIDATE_IMAGE_ID" 2>&1 | tee container-recovery.log
      - name: Start isolated runtime for browser flows
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: |
          docker run --detach --name tax-engine-browser-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/apps/web/.next/cache:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --publish 127.0.0.1:3109:3000 --env TAX_ENGINE_DEPLOYMENT_MODE=self-host \
            --env TAX_ENGINE_APP_URL=http://127.0.0.1:3109 "$CANDIDATE_IMAGE_ID"
          test "$(docker inspect --format '{{.Image}}' tax-engine-browser-ci)" = "$CANDIDATE_IMAGE_ID"
          docker inspect tax-engine-browser-ci > container-browser.json
          for ((attempt=1; attempt<=60; attempt++)); do
            if curl --fail --silent http://127.0.0.1:3109/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser flows against the actual runtime image
        id: container_browser
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          PLAYWRIGHT_DISABLE_WEBSERVER: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3109
        run: pnpm test:web --retries=0 --timeout=30000 --trace=retain-on-failure
      - name: Sample the fourteen retained deadline cases
        id: browser_cpu_diagnostic
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.cpu_diagnostics && steps.container_browser.outcome == 'failure' }}
        timeout-minutes: 12
        uses: ./.github/actions/browser-cpu-diagnostics
        with:
          enabled: "true"
          original-outcome: ${{ steps.container_browser.outcome }}
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
      - name: Retain sanitized browser sampling diagnostics
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.cpu_diagnostics && steps.browser_cpu_diagnostic.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-cpu-diagnostics
          path: artifacts/browser-cpu-diagnostics/
          if-no-files-found: warn
      - name: Sample original strict batch 6
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.cpu_full_batches && steps.container_browser.outcome == 'failure' }}
        timeout-minutes: 10
        uses: ./.github/actions/browser-cpu-full-batches
        with:
          enabled: 'true'
          original-outcome: ${{ steps.container_browser.outcome }}
          batch: '6'
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          TAX_BROWSER_PHASE_DIAGNOSTICS: ${{ inputs.cpu_full_batches && inputs.cpu_phase_metrics && '1' || '0' }}
      - name: Sample original strict batch 7
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.cpu_full_batches && steps.container_browser.outcome == 'failure' }}
        timeout-minutes: 10
        uses: ./.github/actions/browser-cpu-full-batches
        with:
          enabled: 'true'
          original-outcome: ${{ steps.container_browser.outcome }}
          batch: '7'
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          TAX_BROWSER_PHASE_DIAGNOSTICS: ${{ inputs.cpu_full_batches && inputs.cpu_phase_metrics && '1' || '0' }}
      - name: Compare trace capture in the original failing Ohio window
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.ohio_trace_pair && !inputs.cpu_diagnostics && !inputs.cpu_full_batches && !inputs.cpu_phase_metrics && !inputs.compare_ohio_runtimes && steps.container_browser.outcome == 'failure' }}
        timeout-minutes: 18
        continue-on-error: true
        uses: ./.github/actions/browser-cpu-full-batches
        with:
          enabled: 'true'
          original-outcome: ${{ steps.container_browser.outcome }}
          batch: '7'
          trace-pair: 'true'
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
      - name: Compare focused Ohio journeys on the same runner
        id: ohio_runtime_comparison
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.compare_ohio_runtimes && (steps.container_browser.outcome == 'success' || steps.container_browser.outcome == 'failure') }}
        timeout-minutes: 18
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: |
          cases=(
            tests/oh-business-part-year-native.spec.ts
            tests/oh-resident-credit-native.spec.ts
            tests/oh-school-district-part-year-native.spec.ts
          )
          args=(--project=chromium --workers=2 --retries=0 --timeout=30000 "${cases[@]}")
          # Let the last full-suite request window expire before reusing the app.
          sleep 65
          strict=0
          PLAYWRIGHT_DISABLE_WEBSERVER=true PLAYWRIGHT_BASE_URL=http://127.0.0.1:3109 \
            pnpm test:web "${args[@]}" 2>&1 | tee ohio-same-runner-container.log || strict=$?
          managed=0
          pnpm test:web "${args[@]}" 2>&1 | tee ohio-same-runner-managed.log || managed=$?
          printf 'container=%s\nmanaged=%s\n' "$strict" "$managed" > ohio-same-runner-status.txt
          test "$strict" -eq 0 && test "$managed" -eq 0
      - name: Verify Docker archive in an independent native image store
        id: archive
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        timeout-minutes: 5
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: bash scripts/verify-container-archive.sh
      - name: Scan and bind immutable AMD64 candidate evidence
        uses: ./.github/actions/container-runtime-scan
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        with:
          candidate-image-id: ${{ steps.candidate.outputs.image_id }}
          expected-architecture: amd64
          archive-outcome: ${{ steps.archive.outcome }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-runtime-evidence
          path: |
            container.cdx.json
            container.syft.json
            container-syft-tool.txt
            container-source-binding.json
            container-archive-verification.json
            container-image-identity.json
            container-candidate.json
            container-previous.json
            container-browser.json
            container-vulnerabilities.json
            container-smoke.log
            container-recovery.log
            container-postgres-client-versions.txt
            container-host.txt
            container-source.txt
            container-candidate.txt
            container-ldd.txt
            ohio-same-runner-*.log
            ohio-same-runner-status.txt
            apps/web/playwright-report/
            apps/web/test-results/
      - name: Remove this job's browser container
        if: always()
        run: docker rm --force tax-engine-browser-ci || true
