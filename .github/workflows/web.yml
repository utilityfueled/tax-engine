name: Web

on:
  push:
    branches: [main, upgrade/2026-baseline]
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:web
      - run: pnpm build:web

  browser:
    name: Browser Flows (self-host)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TAX_ENGINE_DEPLOYMENT_MODE: self-host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tax-engine/web exec playwright install --with-deps chromium
      - run: pnpm sample-docs:fetch
      - run: pnpm test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            apps/web/playwright-report/
            apps/web/test-results/

  container:
    name: Container Smoke and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: docker build --tag tax-engine:ci .
      - run: node scripts/smoke-container.mjs tax-engine:ci
      - uses: anchore/sbom-action@v0
        with:
          image: tax-engine:ci
          format: cyclonedx-json
          output-file: container.cdx.json
          upload-release-assets: false
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: container-sbom
          path: container.cdx.json
