name: Web

on:
  push:
    branches: [main, upgrade/2026-baseline]
  workflow_dispatch:
    inputs:
      cpu_diagnostics:
        description: Run bounded synthetic browser sampling after container qualification fails
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:web
      - run: pnpm build:web

  browser:
    name: Browser Flows (self-host)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TAX_ENGINE_DEPLOYMENT_MODE: self-host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm test:setup
      - run: pnpm --filter @tax-engine/web exec playwright install --with-deps chromium
      - run: pnpm sample-docs:fetch
      - run: pnpm test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-failures
          path: |
            apps/web/playwright-report/
            apps/web/test-results/

  container:
    name: Container Recovery, Browser Flows and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TAX_ENGINE_DEPLOYMENT_MODE: self-host
      TAX_ENGINE_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm test:setup
      - run: pnpm --filter @tax-engine/web exec playwright install --with-deps chromium
      - run: pnpm sample-docs:fetch
      - name: Install patched PostgreSQL 16 recovery client from PGDG
        id: postgres_client_install
        run: |
          suite="$(lsb_release -cs)-pgdg"
          key=/usr/share/keyrings/tax-engine-pgdg.asc
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee "$key" >/dev/null
          sudo tee /etc/apt/sources.list.d/tax-engine-pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: $suite
          Components: main
          Signed-By: $key B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          EOF
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
      - name: Verify and record PostgreSQL recovery client versions
        id: postgres_client_versions
        run: |
          : > container-postgres-client-versions.txt
          for tool in pg_dump pg_restore; do
            version="$("$TAX_ENGINE_TEST_POSTGRES_BIN/$tool" --version)"
            printf '%s\n' "$version" | tee -a container-postgres-client-versions.txt
            version_pattern="^${tool} [(]PostgreSQL[)] 16[.]([1-9][0-9]*)([[:blank:]]|$)"
            if [[ ! $version =~ $version_pattern ]] || (( BASH_REMATCH[1] < 16 )); then
              echo "$tool must be PostgreSQL 16.16 or a later 16.x release" >&2
              exit 1
            fi
          done
      - run: docker pull node:26.13.1-trixie-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
      - run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag tax-engine:ci .
      - name: Retain native host and immutable candidate provenance
        id: candidate
        run: |
          uname -sm > container-host.txt
          test "$(uname -sm)" = 'Linux x86_64'
          test "$(docker version --format '{{.Server.Os}}')" = linux
          test "$(docker version --format '{{.Server.Arch}}')" = amd64
          docker info --format '{{json .Architecture}} {{json .OSType}} {{json .CgroupVersion}} {{json .NCPU}} {{json .MemTotal}}' >> container-host.txt
          git rev-parse HEAD HEAD^{tree} > container-source.txt
          sha256sum Dockerfile pnpm-lock.yaml .github/workflows/web.yml >> container-source.txt
          git archive "$GITHUB_SHA" | sha256sum >> container-source.txt
          candidate_id=$(docker image inspect --format '{{.Id}}' tax-engine:ci)
          test "${candidate_id#sha256:}" != "$candidate_id"
          docker image inspect "$candidate_id" > container-candidate.json
          printf 'image_id=%s\n' "$candidate_id" >> "$GITHUB_OUTPUT"
          docker image inspect --format '{{json .Id}} {{json .Os}} {{json .Architecture}} {{json .Config.Labels}} {{json .RepoDigests}} {{json .RootFS.Layers}}' "$candidate_id" > container-candidate.txt
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$candidate_id")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{.Architecture}}' "$candidate_id")" = "$(docker version --format '{{.Server.Arch}}')"
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint /usr/bin/ldd "$candidate_id" /usr/local/bin/node > container-ldd.txt
          if grep -F 'not found' container-ldd.txt; then exit 1; fi
      - env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: node scripts/smoke-container.mjs "$CANDIDATE_IMAGE_ID" | tee container-smoke.log
      - name: Build immutable previous application for upgrade and rollback
        id: previous
        run: |
          previous_source=$(mktemp -d)
          trap 'rm -rf "$previous_source"' EXIT
          git archive d32cb8cf3d607c643c4c7f7e1b845fcace61563f | tar -x -C "$previous_source"
          docker build --label org.opencontainers.image.revision=d32cb8cf3d607c643c4c7f7e1b845fcace61563f --tag tax-engine:previous "$previous_source"
          previous_id=$(docker image inspect --format '{{.Id}}' tax-engine:previous)
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$previous_id")" = d32cb8cf3d607c643c4c7f7e1b845fcace61563f
          docker image inspect "$previous_id" > container-previous.json
          printf 'image_id=%s\n' "$previous_id" >> "$GITHUB_OUTPUT"
      - name: Rehearse isolated Compose upgrade, recovery and rollback
        env:
          PREVIOUS_IMAGE_ID: ${{ steps.previous.outputs.image_id }}
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: node --import tsx scripts/rehearse-self-host-release.mjs "$PREVIOUS_IMAGE_ID" "$CANDIDATE_IMAGE_ID" 2>&1 | tee container-recovery.log
      - name: Start isolated runtime for browser flows
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: |
          docker run --detach --name tax-engine-browser-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/apps/web/.next/cache:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --publish 127.0.0.1:3109:3000 --env TAX_ENGINE_DEPLOYMENT_MODE=self-host \
            --env TAX_ENGINE_APP_URL=http://127.0.0.1:3109 "$CANDIDATE_IMAGE_ID"
          test "$(docker inspect --format '{{.Image}}' tax-engine-browser-ci)" = "$CANDIDATE_IMAGE_ID"
          docker inspect tax-engine-browser-ci > container-browser.json
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3109/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser flows against the actual runtime image
        id: container_browser
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          PLAYWRIGHT_DISABLE_WEBSERVER: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3109
        run: pnpm test:web --retries=0 --timeout=30000 --trace=retain-on-failure
      - name: Sample the fourteen retained deadline cases
        id: browser_cpu_diagnostic
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.cpu_diagnostics && steps.container_browser.outcome == 'failure' }}
        timeout-minutes: 12
        uses: ./.github/actions/browser-cpu-diagnostics
        with:
          enabled: "true"
          original-outcome: ${{ steps.container_browser.outcome }}
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
      - name: Retain sanitized browser sampling diagnostics
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.cpu_diagnostics && steps.browser_cpu_diagnostic.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-cpu-diagnostics
          path: artifacts/browser-cpu-diagnostics/
          if-no-files-found: warn
      - name: Verify Docker archive in an independent native image store
        id: archive
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        timeout-minutes: 5
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: bash scripts/verify-container-archive.sh
      - uses: anchore/sbom-action/download-syft@v0
        id: syft
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        with:
          syft-version: v1.57.1
      - name: Generate both SBOM formats from the immutable candidate
        id: sbom
        if: ${{ !cancelled() && steps.syft.outcome == 'success' }}
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          "$SYFT_CMD" version > container-syft-tool.txt
          grep -Eq '^Version:[[:space:]]+1[.]57[.]1$' container-syft-tool.txt
          sha256sum "$SYFT_CMD" >> container-syft-tool.txt
          "$SYFT_CMD" scan "docker:$CANDIDATE_IMAGE_ID" -o json=container.syft.json -o cyclonedx-json=container.cdx.json
      - name: Verify immutable SBOM source
        id: source_binding
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          REQUIRE_SCAN: "false"
        run: &verify_container_scanner_binding |
          python3 -E - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path

          def unique_keys(pairs):
              result = dict(pairs)
              if len(result) != len(pairs):
                  raise ValueError("Container evidence contains a duplicate JSON key")
              return result

          hashes = {}

          def read_evidence(path):
              data = Path(path).read_bytes()
              hashes[path] = hashlib.sha256(data).hexdigest()
              return json.loads(data, object_pairs_hook=unique_keys)

          [expected] = read_evidence("container-candidate.json")
          image_id = os.environ["CANDIDATE_IMAGE_ID"]
          revision = os.environ["GITHUB_SHA"]
          revision_label = "org.opencontainers.image.revision"
          assert expected["Id"] == image_id and re.fullmatch(r"sha256:[0-9a-f]{64}", image_id)
          assert expected["Os"] == "linux" and expected["Architecture"] == "amd64"
          assert expected["Config"]["Labels"][revision_label] == revision

          sbom = read_evidence("container.syft.json")
          assert sbom["descriptor"]["name"] == "syft" and sbom["descriptor"]["version"] == "1.57.1"
          source = sbom["source"]
          assert source["type"] == "image"
          syft_metadata = source["metadata"]
          assert syft_metadata["imageID"] == syft_metadata["userInput"] == image_id
          assert syft_metadata["os"] == "linux" and syft_metadata["architecture"] == "amd64"
          assert syft_metadata["labels"][revision_label] == revision
          raw_config = base64.b64decode(syft_metadata["config"], validate=True)
          assert "sha256:" + hashlib.sha256(raw_config).hexdigest() == image_id
          config = json.loads(raw_config, object_pairs_hook=unique_keys)
          assert config["rootfs"]["diff_ids"] == expected["RootFS"]["Layers"]
          assert config["os"] == "linux" and config["architecture"] == "amd64"
          assert config["config"]["Labels"][revision_label] == revision

          cdx = read_evidence("container.cdx.json")
          assert cdx["bomFormat"] == "CycloneDX"
          cdx_metadata = cdx["metadata"]
          component = cdx_metadata["component"]
          assert component["type"] == "container"
          # Syft splits a Docker config ID at the colon in CycloneDX.
          assert (component["name"], component["version"]) == tuple(image_id.split(":", 1))
          revisions = [entry["value"] for entry in cdx_metadata["properties"]
                       if entry["name"] == "syft:image:labels:" + revision_label]
          assert revisions == [revision], "CycloneDX must identify exactly one matching revision"
          syft_versions = [tool["version"] for tool in cdx_metadata["tools"]["components"] if tool["name"] == "syft"]
          assert syft_versions == ["1.57.1"]

          receipt_path = Path("container-source-binding.json")
          receipt = {"imageId": image_id, "source": revision, "platform": "linux/amd64",
                     "rootfs": expected["RootFS"]["Layers"], "scanVerified": False, "sha256": hashes}
          if os.environ["REQUIRE_SCAN"] == "true":
              prior_bytes = receipt_path.read_bytes()
              assert hashlib.sha256(prior_bytes).hexdigest() == os.environ["PRIOR_BINDING_SHA256"]
              prior = json.loads(prior_bytes, object_pairs_hook=unique_keys)
              assert prior == receipt, "The verified candidate or SBOM bytes changed during scanning"
              scan = read_evidence("container-vulnerabilities.json")
              assert scan["descriptor"]["version"] == "0.121.3"
              assert scan["descriptor"]["name"] == "grype" and isinstance(scan["matches"], list)
              assert scan["source"]["type"] == "image" and scan["source"]["target"] == syft_metadata
              archive_verified = os.environ["ARCHIVE_OUTCOME"] == "success"
              if archive_verified:
                  archive = read_evidence("container-archive-verification.json")
                  assert archive["version"] == 1 and archive["stage"] == "verified"
                  assert archive["archiveImportVerified"] is True and archive["scratchRemoved"] is True
                  assert archive["platform"] == "linux/amd64" and archive["imageId"] == image_id
                  assert archive["source"] == revision
                  assert re.fullmatch(r"[0-9a-f]{64}", archive["archiveSha256"])
                  assert 0 < archive["archiveBytes"] <= 1024 ** 3
              receipt.update(scanVerified=True, archiveImportVerified=archive_verified)
          else:
              assert os.environ["REQUIRE_SCAN"] == "false"
              assert not Path("container-vulnerabilities.json").exists(), "Unexpected scan output before running Grype"
          receipt_bytes = (json.dumps(receipt, indent=2) + "\n").encode()
          receipt_path.write_bytes(receipt_bytes)
          if not receipt["scanVerified"]:
              # The scan step cannot replace the earlier step's output value.
              with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
                  output.write(f"receipt_sha256={hashlib.sha256(receipt_bytes).hexdigest()}\n")
          PY
      - uses: anchore/scan-action@v7
        id: scan
        if: ${{ !cancelled() && steps.source_binding.outcome == 'success' }}
        with:
          sbom: container.syft.json
          grype-version: v0.121.3
          output-format: json
          output-file: container-vulnerabilities.json
          # Keep every finding in the report. Noncritical findings still require
          # the separate owned, expiring release disposition; CI is not approval.
          fail-build: true
          severity-cutoff: critical
      - name: Verify scan source against the immutable candidate
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' && steps.source_binding.outcome == 'success' }}
        env:
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          CANDIDATE_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
          REQUIRE_SCAN: "true"
          PRIOR_BINDING_SHA256: ${{ steps.source_binding.outputs.receipt_sha256 }}
        run: *verify_container_scanner_binding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-runtime-evidence
          path: |
            container.cdx.json
            container.syft.json
            container-syft-tool.txt
            container-source-binding.json
            container-archive-verification.json
            container-candidate.json
            container-previous.json
            container-browser.json
            container-vulnerabilities.json
            container-smoke.log
            container-recovery.log
            container-postgres-client-versions.txt
            container-host.txt
            container-source.txt
            container-candidate.txt
            container-ldd.txt
            apps/web/playwright-report/
            apps/web/test-results/
      - name: Remove this job's browser container
        if: always()
        run: docker rm --force tax-engine-browser-ci || true
