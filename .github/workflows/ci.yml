name: CI

on:
  push:
    branches: [main, upgrade/2026-baseline]
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:contracts

  unit-test-shard-1:
    name: Unit Tests (shard 1 of 2)
    uses: ./.github/workflows/unit-tests.yml
    with:
      shard: '1/2'

  unit-test-shard-2:
    name: Unit Tests (shard 2 of 2)
    uses: ./.github/workflows/unit-tests.yml
    with:
      shard: '2/2'

  unit-test:
    name: Unit Tests
    needs: [unit-test-shard-1, unit-test-shard-2]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both shards to pass
        env:
          FIRST_SHARD_RESULT: ${{ needs.unit-test-shard-1.result }}
          SECOND_SHARD_RESULT: ${{ needs.unit-test-shard-2.result }}
        run: |
          printf 'Unit test shard results: %s, %s\n' "$FIRST_SHARD_RESULT" "$SECOND_SHARD_RESULT"
          [[ "$FIRST_SHARD_RESULT" == success && "$SECOND_SHARD_RESULT" == success ]]

  test:
    name: Tests and Coverage
    runs-on: ubuntu-24.04
    # Coverage for the complete single-worker suite exceeded the old 30m job cap.
    # This changes only the job budget, not test deadlines or coverage thresholds.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.16-bookworm@sha256:a49f7438ba03589f9b1ca062f2da82e899b48ea1dc50d2449fa09a70be83ebca
        env:
          POSTGRES_USER: ai_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable loopback-only service; never reuse a deployment DATABASE_URL.
      TAX_ENGINE_TEST_AI_LEDGER_DATABASE_URL: postgresql://ai_test@127.0.0.1:5432/postgres
      # Use the same major as the pinned recovery server, independent of PATH.
      TAX_ENGINE_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL recovery client/server majors
        shell: bash
        run: |
          set -euo pipefail
          for tool in pg_dump pg_restore; do
            version="$("$TAX_ENGINE_TEST_POSTGRES_BIN/$tool" --version)" || exit 1
            printf '%s\n' "$version"
            [[ "$version" =~ ^${tool}[[:space:]]+\(PostgreSQL\)[[:space:]]+16\. ]] || exit 1
          done
          test "$TAX_ENGINE_TEST_AI_LEDGER_DATABASE_URL" = 'postgresql://ai_test@127.0.0.1:5432/postgres' || exit 1
          server_version_num="$(PGCONNECT_TIMEOUT=5 "$TAX_ENGINE_TEST_POSTGRES_BIN/psql" --no-psqlrc --no-password --tuples-only --no-align --command='SHOW server_version_num' "$TAX_ENGINE_TEST_AI_LEDGER_DATABASE_URL")" || exit 1
          [[ "$server_version_num" =~ ^16[0-9]{4}$ ]] || exit 1
          printf 'Loopback PostgreSQL server_version_num=%s\n' "$server_version_num"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pnpm test:setup
      # Match the two-worker full local coverage run while retaining every test,
      # the existing per-test deadlines, coverage thresholds and 60m job limit.
      - run: pnpm test:coverage --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  spec-validate:
    name: Spec Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:validate
      - run: pnpm spec:inventory:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
