name: Native ARM64 Recovery Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-arm64-recovery
  cancel-in-progress: false

jobs:
  recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TAX_ENGINE_DEPLOYMENT_MODE: self-host
      TAX_ENGINE_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
      PREVIOUS_REVISION: d32cb8cf3d607c643c4c7f7e1b845fcace61563f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify native runner and source
        run: |
          test "$(uname -sm)" = 'Linux aarch64'
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = linux/arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}'
          git archive "$GITHUB_SHA" | sha256sum
          df -h .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm test:setup
      - run: pnpm --filter @tax-engine/web exec playwright install --with-deps chromium
      - run: pnpm sample-docs:fetch
      - name: Install archive and PostgreSQL 16 recovery tools
        run: |
          suite="$(lsb_release -cs)-pgdg"
          key=/usr/share/keyrings/tax-engine-pgdg.asc
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee "$key" >/dev/null
          sudo tee /etc/apt/sources.list.d/tax-engine-pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: $suite
          Components: main
          Signed-By: $key B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          EOF
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
          if ! command -v podman >/dev/null; then
            sudo apt-get install --yes --no-install-recommends podman
          fi
          for tool in pg_dump pg_restore; do
            version="$("$TAX_ENGINE_TEST_POSTGRES_BIN/$tool" --version)"
            printf '%s\n' "$version"
            pattern="^${tool} [(]PostgreSQL[)] 16[.]([1-9][0-9]*)([[:blank:]]|$)"
            if [[ ! $version =~ $pattern ]] || (( BASH_REMATCH[1] < 16 )); then
              echo "$tool must be PostgreSQL 16.16 or a later 16.x release" >&2
              exit 1
            fi
          done
      - name: Pull the pinned runtime base used by the smoke test
        run: docker pull node:26.13.1-trixie-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
      - name: Build and verify both native images
        id: images
        run: |
          previous_source=$(mktemp -d)
          trap 'rm -rf -- "$previous_source"' EXIT
          git archive "$PREVIOUS_REVISION" | tar -x -C "$previous_source"
          docker build --label "org.opencontainers.image.revision=$PREVIOUS_REVISION" --tag tax-engine:arm64-previous "$previous_source"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag tax-engine:arm64-candidate .

          verify_image() {
            local tag="$1" revision="$2" image
            image=$(docker image inspect --format '{{.Id}}' "$tag")
            [[ $image =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/arm64 || return 1
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$revision" || return 1
            printf '%s\n' "$image"
          }
          previous=$(verify_image tax-engine:arm64-previous "$PREVIOUS_REVISION")
          candidate=$(verify_image tax-engine:arm64-candidate "$GITHUB_SHA")
          test "$previous" != "$candidate"
          printf 'previous=%s\ncandidate=%s\n' "$previous" "$candidate" >> "$GITHUB_OUTPUT"
          printf 'Previous %s\nCandidate %s\n' "$previous" "$candidate"
      - name: Smoke test the candidate image
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.images.outputs.candidate }}
        run: node scripts/smoke-container.mjs "$CANDIDATE_IMAGE_ID"
      - name: Verify the archive in an independent native ARM64 image store
        id: arm_archive
        continue-on-error: true
        timeout-minutes: 8
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.images.outputs.candidate }}
        run: |
          docker image inspect "$CANDIDATE_IMAGE_ID" > container-candidate.json
          bash scripts/verify-container-archive.sh
      - name: Exercise isolated Compose upgrade and recovery
        env:
          PREVIOUS_IMAGE_ID: ${{ steps.images.outputs.previous }}
          CANDIDATE_IMAGE_ID: ${{ steps.images.outputs.candidate }}
        run: node --import tsx scripts/rehearse-self-host-release.mjs "$PREVIOUS_IMAGE_ID" "$CANDIDATE_IMAGE_ID"
      - name: Start the local candidate for the full browser suite
        id: browser_container
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.images.outputs.candidate }}
        run: |
          container=$(docker run --detach --name tax-engine-browser-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/apps/web/.next/cache:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --publish 127.0.0.1:3109:3000 --env TAX_ENGINE_DEPLOYMENT_MODE=self-host \
            --env TAX_ENGINE_APP_URL=http://127.0.0.1:3109 "$CANDIDATE_IMAGE_ID")
          printf 'container=%s\n' "$container" >> "$GITHUB_OUTPUT"
          test "$(docker inspect --format '{{.Image}}' "$container")" = "$CANDIDATE_IMAGE_ID"
          for ((attempt=1; attempt<=60; attempt++)); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3109/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run strict browser flows against the ARM64 runtime image
        id: strict_browser
        timeout-minutes: 75
        env:
          CANDIDATE_IMAGE_ID: ${{ steps.images.outputs.candidate }}
          PLAYWRIGHT_DISABLE_WEBSERVER: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3109
        run: pnpm test:web --retries=0 --timeout=30000 --trace=retain-on-failure
      - name: Stop and remove the rehearsal browser container
        if: ${{ always() && steps.browser_container.outputs.container != '' }}
        env:
          BROWSER_CONTAINER: ${{ steps.browser_container.outputs.container }}
        run: |
          [[ $BROWSER_CONTAINER =~ ^[a-f0-9]{64}$ ]]
          docker stop --timeout 10 "$BROWSER_CONTAINER"
          docker rm "$BROWSER_CONTAINER"
          remaining=$(docker ps --all --quiet --no-trunc --filter "id=$BROWSER_CONTAINER")
          test -z "$remaining"
      - name: Record the browser summary in the run log
        if: ${{ always() && steps.strict_browser.outcome != 'skipped' }}
        env:
          BROWSER_OUTCOME: ${{ steps.strict_browser.outcome }}
        run: |
          summaries=()
          if [[ -d apps/web/test-results ]]; then
            mapfile -d '' -t summaries < <(find apps/web/test-results -maxdepth 2 -name summary.json -print0)
          fi
          if (( ${#summaries[@]} != 1 )); then
            echo 'Exactly one browser summary was required for successful qualification.'
            test "$BROWSER_OUTCOME" != success
            exit
          fi
          jq -c '{status, cleanup, batchesCompleted, caseCount, failed, skipped}' "${summaries[0]}"
          sha256sum "${summaries[0]}"
      - name: Scan and bind immutable ARM64 candidate evidence
        uses: ./.github/actions/container-runtime-scan
        if: ${{ !cancelled() && (steps.arm_archive.outcome == 'success' || steps.arm_archive.outcome == 'failure') }}
        with:
          candidate-image-id: ${{ steps.images.outputs.candidate }}
          expected-architecture: arm64
          archive-outcome: ${{ steps.arm_archive.outcome }}
      - name: Upload the ARM64 archive verification receipts
        if: ${{ !cancelled() && (steps.arm_archive.outcome == 'success' || steps.arm_archive.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: native-arm64-archive-evidence
          retention-days: 7
          path: |
            container.cdx.json
            container.syft.json
            container-syft-tool.txt
            container-source-binding.json
            container-image-identity.json
            container-archive-verification.json
            container-candidate.json
            container-vulnerabilities.json
      - name: Enforce the ARM64 archive result
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        env:
          ARCHIVE_OUTCOME: ${{ steps.arm_archive.outcome }}
        run: test "$ARCHIVE_OUTCOME" = success
