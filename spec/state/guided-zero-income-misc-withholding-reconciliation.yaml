form: "Guided-Zero-Income-MISC-Withholding-Reconciliation"
fullName: "Once-only reconciliation of saved claims to actual finite MISC originals"
taxYear: 2025
reference: "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40in.pdf"
notes: |
  This source-only successor does not add tax credit or cash. The old saved .20
  MISC claim identifies the same Separate actual payer original; it is not another
  payment. All original and actual remittance records must replay before claims
  reconcile. PA/OH whole returns retain their actual-source eligibility gates.
  No government1099G or arbitrary ledger admission. Exact money uses Decimal.
lines:
  - line: "once"
    formula: "Retained .20 saved claim matches exactly one actual current MISC original; actual2000W2+.10OID+.20MISC appears once, .30 estimate separate; no input mutation."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::saved MISC claims reconcile actual originals once in both state previews"
  - line: "no-original"
    formula: "Generic claim cannot create a missing actual original or replace PA/core and OH/currentpayment source replay."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::missing original and missing source proof retain current source guards"
  - line: "identity"
    formula: "Wrong payer/state/year/amount and duplicate saved rows cannot qualify current canonical source claims."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::unmatched and duplicate saved claims cannot invent another original"
  - line: "stale"
    formula: "Equal-dollar raw original/remittance identity changes invalidate confirmed source packets without read repair."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::equal-dollar actual remittance edits remain stale and private"
  - line: "ohio-independent-positive"
    formula: "Actual complete Ohio original W22000 plus OID0.10 plus same MISC0.20 saved claim reconciles once; separate estimate0.30 retains cash2000.60. Whole-dollar withholding2000 and estimate0 produce reportedpayments2000, tax1217 and refund783."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::saved Ohio MISC claim independently reconciles actual original once"
  - line: "canonical-identity"
    formula: "Current canonical owner/year/source identifier/payerTIN/account must match the explicitly confirmed native original; equal cash cannot substitute identity."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::canonical MISC identity changes cannot qualify retained saved claims"
  - line: "ambiguity"
    formula: "Two complete actual same-payer same-state same-year same-cent originals with distinct real accounts remain ambiguous for a generic saved claim; source order cannot choose one."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::distinct complete same-payer originals cannot be selected by source order"
  - line: "mixed-retirement"
    formula: "Actual qualified pension withholding500 and actual zero-incomeMISC0.20 saved claims identify separate originals once; W2withholding2000 produces printedPA2500, tax1842 and refund658. Full raw ledger500.20 and actual originals remain unchanged."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::mixed actual PA pension and MISC claims reconcile once without replacing either source"
  - line: "unsupported"
    formula: "A positive saved government1099G or other unsupported claim is not admitted by finite MISC reconciliation; actual Ohio retirement claims retain their separate-method guard."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::unsupported positive saved source types remain outside finite MISC reconciliation"
  - line: "exact-match-result"
    formula: "Reconciliation returns a unique existing canonical original index and exact public Decimal0.20; it returns no payment override or tax authority and never mutates the original ledger."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::finite matching reports an existing index and exact public Decimal without adding cash"
  - line: "mixed-earlier-retirement-validator"
    formula: "Earlier federal original validation must preserve exact whole-ledger500.20 while reconciling only actual R500 against the existing retirement matcher. Actual MISC0.20 belongs to native/current-canonical MISC replay and cannot be misclassified as retirement."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::earlier retirement validation separates actual mixed source claims without changing their total"
  - line: "mixed-earlier-denials"
    formula: "Partitioning retirement validation does not admit positive governmentG/other claims or missing/edited MISC source originals; whole bridge remains closed until actual source validation passes."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::earlier mixed retirement validation preserves unsupported and missing original denials"
  - line: "mixed-schedule-a-dispatch"
    formula: "Schedule A conversion first validates the entire saved ledger and rejects unsupported source types, then passes only actual R claims and their exact Decimal subtotal to the unchanged R matcher. The original full500.20 ledger remains untouched; native MISC original replay and current-canonical PA/OH validation remain required later. The matched R500 is removed once from additional itemized tax inputs because its original form already supplies that tax; this dispatch never creates money or qualifies MISC itself."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::mixed actual PA pension and MISC claims reconcile once without replacing either source"
  - line: "itemized-misc-pa"
    formula: "PA actual original W2 state2000 + local0 + TreasuryOID0.10 + MISC0.20 + distinct in-year estimate0.30 = exact ScheduleA source worksheet2000.60. The saved same-original MISC claim adds no separate tax payment; no double deduction. State tax1842/refund158 remain unchanged."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::itemized PA MISC saved claim preserves exact once-only federal income tax payments"
  - line: "itemized-misc-oh"
    formula: "Ohio actual original W2 state2000 + local0 + TreasuryOID0.10 + MISC0.20 + distinct in-year estimate0.30 = exact ScheduleA source worksheet2000.60. The saved same-original MISC claim adds no separate tax payment. State tax1217/refund783 remain unchanged."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::itemized Ohio MISC saved claim preserves exact once-only federal income tax payments"
  - line: "itemized-mixed-r-misc"
    formula: "Actual PA W2state2000 + local0 + qualified pension withholding500 + MISC0.20 + no estimate = exact ScheduleA source worksheet2500.20. Saved R500 and MISC0.20 are duplicate descriptions of their original source taxes; combined saved500.20 adds zero extra payment. PA tax1842/refund658 remain unchanged."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::itemized mixed pension and MISC saved claims preserve exact once-only federal income tax payments"
  - line: "itemized-source-context"
    formula: "A finite native MISC saved claim requires the actual current full interview and constructed original array before removing its duplicate source tax from ScheduleA. A caller-provided amount or missing context is not source authority. Current canonical state packet replay remains mandatory later for state results."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::itemized finite MISC source removal rejects missing original context"
  - line: "itemized-source-stale"
    formula: "Equal-dollar edited actual remittance source remains stale and cannot remove a saved claim from ScheduleA until explicit native source confirmation. No read refresh or fake canonical packet."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::itemized finite MISC source removal rejects stale actual remittance"
  - line: "itemized-source-duplicate"
    formula: "Two saved claims cannot use the same single actual MISC original twice, even if full saved ledger total equals their exact0.40 sum. Raw originals and saved ledger remain immutable."
    testRef: "tests/guided-interview/guided-zero-income-misc-withholding-reconciliation.test.ts::itemized finite MISC source removal rejects duplicated saved claims"
