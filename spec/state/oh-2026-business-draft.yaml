lines:
  - line: "source-dispatch"
    description: "Complete original admission and current dispatcher integration"
    formula: "Current single primary NR/PY ordinary cash-service C with all34 expense classifications explicitly known zero and actual dated deduction originals; mandatory original-bound no-other-adjustment/A34/credit assertions. Recompute C/SE, exact existing factor rules; unknown is not zero."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::dispatches actual current $row.0 $status originals"
  - line: "business-tax"
    description: "Enacted2026 business deduction and tax with actual eligibility proof"
    formula: "BID=min(250000,max(0,min(netC,federalAGI))); MAGI=OhioAGI+BID+actual known-zero A34; actual eligible single exemption count; 2026 no-child completed EIC cutoff19540; no-child AGI cutoff proves zero EIC. Single joint credit zero; personal exemption credit statutory threshold. Business tax round(max(0,taxableBusiness-unusedExemptions)*.03)."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::dispatches actual current $row.0 $status originals"
  - line: "nrc"
    description: "Actual domicile-date deduction allocation and truncated nonresident ratio"
    formula: "Actual original source and resident half-SE allocation; existing NRC line19=min(1,max(0,OhioAGI-OhioIncome)/OhioAGI), truncate4 decimals; line20=round(actual preceding tax*line19). Published2025 form is structural source, not a qualified2026 form."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::allocates an actual PY personal deduction from its original domicile date"
  - line: "residency-declaration"
    description: "Reconcile the primary Ohio declaration with the admitted business domicile timeline"
    formula: |
      The nonresident or part-year business draft requires actual Ohio domicile
      records and source allocations. Hold a conflicting explicit primary Ohio
      declaration with the standard original-source error before returning any
      result. A matching or omitted declaration preserves the original domicile
      allocation, apportionment, IT NRC lines, and calculated tax. Filing and
      export qualification remain closed.
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.01"
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::holds an Ohio business draft with a conflicting $status declaration"
    testRefs:
      - "tests/engine/state/oh-2026-business-draft.test.ts::preserves qualified $status allocations with a matching or omitted declaration"
  - line: "unknown-financials"
    description: "Explicitly incomplete financial settlement and protected gates"
    formula: "Absent the separately admitted actual balance receipt, withholding, payments, school financials, underpayment, late interest, due and refund remain null. School financials stay null in both branches. No final return, filing, native, full federal or form qualification."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::keeps every unimplemented financial field null, never zero"
  - line: "source-category-reconciliation"
    description: "Every actual source category must reconcile, not merely its offsetting total"
    formula: "The completed finite current C-only source review proves no other federal income categories. Pass expected categories to the existing NRC validator; opposing invented wages and capital loss cannot cancel into admissibility."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::rejects opposing nonexistent federal source categories even when their total cancels"
  - line: "actual-payment-admission"
    description: "Current original IT1040 receipt and complete business-only payment inventory"
    formula: "After every existing complete C-only federal, withholding, factor and residency admission, require confirmed no taxing-school-district residency throughout relevant periods. Bind Ohio payment originalFederalSources to the same current payment-free federal originals; reuse the verified2026 actual-payment validator for matching primary identity/year, original IT1040 balance receipt, actual timely payment and filing chronology, confirmed complete inventory, no estimated/extension/prior-credit payments, use tax, donations or carry elections. A timely filed and paid account may be observed after the deadline. Unknown is never zero."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::settles a source-confirmed business balance for $status without changing return due"
  - line: "actual-payment-settlement"
    description: "Separate return balance due, actual settlement and outstanding balance"
    formula: "Existing business-only inventory proves original/reportable withholding zero. Income tax is unchanged after NRC. Admit only 0<incomeTax<=500 and exact unrounded receipt amount=incomeTax through the shared helper. Return amountDue=incomeTax, actualBalancePaymentApplied=receipt amount, outstandingTaxBalance=0; prepayments, withholding, installment penalty, late-payment interest and refund=0. Payments means estimated/extension/prior-credit prepayments only; actual balance payment is separate. School tax remains null; no export or filing qualification. RC5747.09(A),(B),(C),5747.08(G)."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::settles a source-confirmed business balance for $status without changing return due"
  - line: "actual-payment-rejections"
    description: "Fail closed outside the finite timely small-balance method"
    formula: "Reject unknown or actual school-district sources, wrong owner/year/return/kind, late or future receipt, expected/partial/overpayment/rounded-cent receipt, zero balance or balance above500, estimates, prior carry, balance elections, stale federal snapshots, unconfirmed inventories and added income/withholding. Do not infer installments, credits, refunds or settlement."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::rejects actual business payment $label"
  - line: "actual-payment-source-exclusivity"
    description: "A settled C-only draft excludes competing residency packets"
    formula: "Reject actual-payment admission if a separate resident credit or reciprocal wage packet is supplied, even when the C-only numbers otherwise reconcile. Those packets require their own current source composition."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::rejects competing residency facts for a settled business draft: $label"
  - line: "actual-payment-gates-and-privacy"
    description: "Finite draft only, with original privacy and financial unknowns retained"
    formula: "Keep calculationStatus incomplete, review pending and filingQualified false. No input mutation, raw source references, name, SSN or receipt confirmation in results; input/source changes bind sourceCommitment. Existing no-payment draft values and limitations remain unchanged."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::settles a source-confirmed business balance for $status without changing return due"
  - line: "actual-payment-threshold"
    description: "Inclusive500 statutory threshold and positive-balance restriction"
    formula: "Independent equal .266648 property/sales factors give Ohio business16648 after BID, NRC ratio.9770 and credit21255 against21755 tax: exact500 admitted. Equal.27 gives600 and equal.25 gives0; both rejected by this payment branch while unchanged tax-only drafts remain available. NR and PY covered."
    testRef: "tests/engine/state/oh-2026-business-draft.test.ts::admits exact500 but retains zero and above500 balances outside the payment method for %s"
