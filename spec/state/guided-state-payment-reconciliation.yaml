form: "Guided-State-Payment-Reconciliation"
fullName: Reconcile saved generic state ledger with actual source receipts
taxYear: 2025
reference: docs/upgrade-2026-execution-brief.md
notes: |
  Actual original-bound state payment sources are authoritative; legacy saved
  rows remain visible and require reconciliation or explicit removal. Match each
  saved estimate once to an actual receipt by exact date, state and Decimal amount.
  Matching records never produce an extra scalar credit. Additional withholding
  needs its actual canonical source method; do not convert free totals to proof.
lines:
  - line: "match"
    description: Ohio actual estimated100 and matching saved100 remain one receipt and no estimated overlay.
    testRef: "tests/guided-interview/state-payment-source-reconciliation.test.ts::state actual payment ledger does not double add matching legacy Ohio receipt"
  - line: "conflict"
    description: Reject mismatched100.01, wrong actualdate and duplicate saved claims; never silently discard amounts.
    testRef: "tests/guided-interview/state-payment-source-reconciliation.test.ts::state actual payment ledger rejects unmatched and duplicate legacy Ohio claims"
  - line: "withholding"
    description: Retain actual saved50.01 additional withholding metadata but require canonical original reconciliation, never use an override.
    testRef: "tests/guided-interview/state-payment-source-reconciliation.test.ts::state actual payment ledger preserves unsupported additional withholding claims for reconciliation"
  - line: "pa"
    description: A saved PA estimate100.01 absent from actual original receipts must block instead of silently disappearing from state computation.
    testRef: "tests/guided-interview/state-payment-source-reconciliation.test.ts::state actual payment ledger cannot silently discard saved PA estimated amounts"
  - line: "pa-navigation"
    description: On 2025 single-filer resident, part-year and nonresident PA returns, a saved estimate without a distinct actual receipt requires review before Continue even after both PA packets are reconfirmed. An actual receipt matching the saved date and exact Decimal amount, or explicit removal of the saved entry and reconfirmation, clears the navigation error without creating a second payment.
    testRef: "tests/guided-interview/state-payment-source-reconciliation.test.ts::2025 PA navigation reconciles saved estimates before Continue"
  - line: "oh-navigation"
    description: Require reconciliation of saved estimated payments before Continue on a 2025 Ohio return with confirmed actual IT 1040 payment originals.
    formula: After validating current Ohio payment originals, match each saved Ohio estimate to one distinct actual estimated receipt by date and exact Decimal amount. A missing receipt, a mismatch in cents, or a second claim on the same receipt requires review. Matching records, including confirmed zero, or removal of the saved claim clear the navigation error. The actual receipts remain the only source of credited payments.
    testRef: "tests/guided-interview/state-payment-source-reconciliation.test.ts::2025 Ohio navigation reconciles saved estimates before Continue"
  - line: "oh-navigation-estimate-validation"
    formula: Validate saved estimate fields once within Ohio navigation and use the same result to decide whether to match actual receipts. Keep malformed-field errors, receipt mismatches and the saved withholding checks in their existing order.
    testRef: "tests/guided-interview/state-payment-source-reconciliation.test.ts::checks each saved Ohio estimate once during navigation"
    testRefs:
      - "tests/guided-interview/state-payment-source-reconciliation.test.ts::retains saved payment and withholding error priority"
  - line: "oh-prior-credit-schedule-a"
    description: Include the verified amount of the 2024 Ohio IT 1040 refund that the taxpayer elected and the current account credits to 2025 on federal Schedule A line 5a.
    reference: "https://www.irs.gov/pub/irs-prior/i1040sca--2025.pdf#page=3"
    formula: Replay complete current Ohio originals, including the timely prior original, owner, election and actual current credit. Add the available credit at exact cents in the applied year and preserve Ohio return payment totals.
    testRef: "tests/guided-interview/guided-ohio-prior-credit-schedule-a.test.ts::uses the verified 2024 Ohio credit on 2025 Schedule A in guided and reopened returns"
  - line: "oh-prior-credit-schedule-a-mirrors"
    description: Reconcile canonical Ohio applied-credit mirrors independently of dated estimated payment receipts.
    formula: Match a mirror once by jurisdiction, prior tax year and exact Decimal amount. Hold ambiguous, conflicting or duplicate claims and any additional state and local income tax aggregate that could overlap this positive credit. Add the credit alongside independently dated receipts.
    testRef: "tests/guided-interview/guided-ohio-prior-credit-schedule-a.test.ts::keeps actual cash receipts and canonical applied-credit mirrors separate"
  - line: "oh-prior-credit-schedule-a-reconfirmation"
    description: Require renewed proof of a previously confirmed positive Ohio refund credit or deductible balance principal before publishing another federal preview for that year.
    formula: Keep the 2025 confirmation requirement when a previously verified deductible payment packet is removed, edited or reopens without its original snapshot. A current-year supported confirmation or complete proof of known none resolves the hold. Earlier returns and never-confirmed drafts do not receive inferred payments.
    testRef: "tests/guided-interview/guided-ohio-prior-credit-schedule-a.test.ts::holds a changed or missing previously confirmed Ohio credit until reconfirmed"
  - line: "oh-balance-schedule-a-reconfirmation"
    description: Clear a historical Ohio estimated-credit or balance deduction hold only after the replacement inventory and actual IT 1040 settlement both reconcile.
    formula: A confirmed replacement asserting no remaining tax leaves the year pending until the state liability, payments and independent settlement facts reconcile. Save and reopen retain a pending contradiction; a genuine, reconciled replacement may release the hold.
    testRef: "tests/guided-interview/guided-ohio-prior-credit-schedule-a.test.ts::keeps the Ohio historical payment hold when confirmed known-none leaves unpaid tax"
  - line: "oh-balance-principal-schedule-a"
    description: Use the independently reconciled Ohio IT 1040 balance receipt amount applied to income tax in the federal cash year.
    reference: "https://www.irs.gov/pub/irs-prior/i1040sca--2025.pdf#page=3"
    formula: Replay the actual current-account receipt and identify its confirmed amount applied to tax separately from the receipt total. Include only the principal paid in 2025, with its actual date, and keep the existing state settlement verification. Hold an additional state and local tax aggregate that could repeat principal. Expected principal and cash paid in 2026 make no contribution to 2025.
    testRef: "tests/guided-interview/guided-ohio-prior-credit-schedule-a.test.ts::uses only actual Ohio balance principal paid during the federal cash year"
  - line: "oh-extension-principal-schedule-a"
    description: Require principal resolution for positive in-year Ohio extension receipts before itemized calculation.
    formula: An in-year Ohio extension receipt provides only a gross amount in current originals, so require separate federal resolution of income tax principal. A receipt actually paid in 2026 makes no contribution to 2025 even when credited to the 2025 account.
    testRef: "tests/guided-interview/guided-ohio-prior-credit-schedule-a.test.ts::holds a cash-year gross-only Ohio extension receipt for principal reconciliation"
  - line: "oh-estimate-applied-year-schedule-a"
    description: Keep verified Ohio estimates applied to another tax year separate from the selected return's receipt mirrors.
    formula: Preserve explicit confirmed application in retained Ohio facts. Reconcile current-year or legacy yearless saved rows with distinct current originals. Include verified other-return amounts in Schedule A using their actual cash year without applying them to the selected Ohio return. Matching dates and amounts do not merge payments applied to distinct return years.
    testRef: "tests/guided-interview/guided-ohio-prior-credit-schedule-a.test.ts::uses explicit prior-year Ohio estimates in the federal cash year without merging current state receipts"
  - line: "oh-school-schedule-a-no-district-reconfirmation"
    description: Reconcile a previously deducted school payment after correcting the Ohio residency records to no taxing district.
    formula: Removing the school packet keeps the prior deduction on hold until the current confirmed federal, Ohio residency and IT 1040 payment originals produce a complete no-district Ohio calculation. Require removal of conflicting district records and preserve any independent IT 1040 payment hold.
    testRef: "tests/guided-interview/oh-sd-100-guided-payment-retention.test.ts::clears the school payment hold only after a verified no-district Ohio correction"
  - line: "oh-school-schedule-a-source-year-routing"
    description: Apply the same accepted school source year to guided preview and to retained school payment proof.
    formula: Use the district source year parser for routing and retention. An accepted 2025 source year with surrounding whitespace follows the same cash-year calculation and confirmation guard as 2025.
    testRef: "tests/guided-interview/oh-sd-100-guided-payment-retention.test.ts::routes accepted whitespace around the school source year through preview and retention"
