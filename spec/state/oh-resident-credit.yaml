form: "Ohio Resident Credit Worksheet"
fullName: "Ohio Resident Credit — Credit for Taxes Paid to Another State"
taxYear: 2025
reference: "https://dam.assets.ohio.gov/image/upload/v1767095693/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf"

notes: |
  The Ohio resident credit allows full-year residents and qualifying actual
  Ohio-resident-period part-year residents to claim a credit
  against Ohio tax for income tax paid to another state on income that is also
  included in Ohio adjusted gross income. This prevents double taxation when
  an Ohio resident earns income sourced to another state.

  Correction source retrieved2026-11-02: actual2025ITRC printedlines1–7,
  https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/itrc-fi.pdf
  SHA256ebd9960d6a8004d6803f0f22238f989043db794e9ebc9aa9fcb3d5588112cb48.
  The return computes ONE aggregate credit, not a sum of per-state minima.
  Sum eligible whole-dollar ColumnA/B bystate; line4 truncates line1/3 to4
  decimalplaces and caps1. Line5 is actualCredits37minus38 floored0.
  Line6 rounds line4*5 to nearestwhole dollar; line7=min(line2,line6).
  No per-state allocated credit is established by this form. Actual source
  rows remain in stateDetails and audit source rows; printed totals use1–7.
  Scalar helper requires actual qualifying resident-period source rows supplied
  by its caller; it does not establish residency, payment proof or absence of
  nonresident-credit overlap, and cannot enable a2026return or filing map.

  Eligibility: another income-taxing U.S. state or DC; qualifying income must
  be included in Ohio AGI while Ohio resident. Reciprocal-state compensation
  (IN/KY/MI/PA/WV) is excluded. Full-year nonresidents cannot claim; actual
  part-year resident-period income must not also receive NRC (§5747.05(C)).
  Every actual amount must be finite/nonnegative; positive eligible ColumnA
  requires positive ColumnB and vice versa. Both-known-zero rows contribute0.
  No implicit missing zero or foreign/local income-tax credit is allowed.
  R.C.5747.05(B),(C),(D) and the actual printed2025ITRC control this method.

packetRules:
  packetBehavior: "reference-summary-pdf"
  includeWhen:
    - "Ohio resident credit result exists for taxes paid to another state"
  suppressWhen:
    - "No resident credit worksheet is needed"
  notes: |
    The packet generator should attach a resident-credit reference-summary page
    only when an Ohio resident credit worksheet result exists.

businessRuleValidation:
  - rule: "reference-summary-packet"
    description: "Inventory support counts this worksheet as business-rule validated only when regression coverage proves the Ohio resident-credit reference summary is attached only when another-state tax data produces a resident-credit worksheet."
    testRef: "tests/pdf/fill-oh-reference-forms.test.ts::fillOhioReferenceForms includes the Ohio resident credit reference summary only when another-state credit worksheet is needed"

lines:
  - line: "1"
    description: "Total eligible income taxed by another state"
    formula: "Group eligible source rows by state; round each state's ColumnA to whole dollars; sum all ColumnA"
    testRef: "tests/engine/state/oh-resident-credit-printed-form.test.ts::Ohio RC aggregates printed columns before the statutory minimum"
  - line: "2"
    description: "Total actual income tax paid to those states"
    formula: "Sum corresponding whole-dollar ColumnB; reciprocity-compensation excluded from both columns"
    testRef: "tests/engine/state/oh-resident-credit-printed-form.test.ts::Ohio RC aggregates printed columns before the statutory minimum"
  - line: "3"
    description: "Ohio AGI from IT1040 line3"
    formula: "Actual reported whole-dollar Ohio AGI; nonpositive AGI produces zero credit"
    testRef: "tests/engine/state/oh-resident-credit-printed-form.test.ts::Ohio RC retains known zero and nonpositive tax-base controls"
  - line: "4"
    description: "Aggregate fraction with printed four-place truncation"
    formula: "For positiveAGI min(1,truncate4(line1/line3)); otherwise0"
    testRef: "tests/engine/state/oh-resident-credit-printed-form.test.ts::Ohio RC truncates the actual aggregate ratio before dollar rounding"
  - line: "5"
    description: "Tax remaining after the earlier nonresident credit"
    formula: "max(0,actual ScheduleCredits37 minus38), supplied by orchestrator; not gross IT1040 liability"
    testRef: "tests/engine/state/oh-resident-credit-printed-form.test.ts::Ohio RC uses actual tax available after earlier credits"
  - line: "6"
    description: "Ohio tax on aggregate eligible other-state income"
    formula: "roundDollar(line4 * line5)"
    testRef: "tests/engine/state/oh-resident-credit-printed-form.test.ts::Ohio RC truncates the actual aggregate ratio before dollar rounding"
  - line: "7"
    description: "Resident credit, ScheduleCredits39"
    formula: "min(line2,line6); no allocated per-state credits are created"
    testRef: "tests/engine/state/oh-resident-credit-printed-form.test.ts::Ohio RC aggregates printed columns before the statutory minimum"
  - line: "actual-input-validation"
    description: "Known zero, missing and unsupported evidence stay distinct"
    formula: "Reject nonfinite/negative actual source amounts, invalid jurisdictions and one-sided positive eligible A/B pairs before zero-base early return; explicit paired0 is known0"
    testRef: "tests/engine/state/oh-resident-credit-printed-form.test.ts::Ohio RC rejects invalid actual source pairs before any zero-base shortcut"
