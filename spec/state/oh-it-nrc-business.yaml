form: "Ohio IT NRC Sections II/III — source-bound ordinary sole proprietorship"
taxYear: 2025
reference: "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/itnrc-fi.pdf"
notes: |
  Source-first actual2025 printed form/booklet26-27,35-38 and R.C.5747.21(B),
  5733.05(B)(2), refreshed2026-11-02. State method/source revision is separate
  from federal rulepack version. Isolated2026 statutory worksheet is not its
  complete year pack or qualified export. Complete current original businesses,
  owners, property/payroll/sales and actual receipt sources are required.
  Finite source currency accepts exact cents and at most15 integer digits;
  bounded source values and80-place Decimal arithmetic permit exact ratio checks.
  Actual original C owner and gross receipts must agree with the fresh source
  projection; derived net profit still requires integrating canonical replay.
  First cohort has ordinary domestic C services and no PTE, lower-tier,
  specialindustry, research/excluded property, alternate apportionment or
  depreciation-history methods. Unknown is not zero. Signed actual C losses
  remain signed; monetary values/factors use Decimal. Full-year resident owner
  must not useII/III; mixed-resident-owner globalBID ordering remains separate.
  No general rounding/truncation rule is invented for 'carrytosixdecimalspaces':
  only exactly representable six-place ratios, weights and weighted factors are
  admitted. Other finite cases remain internally actionable research/method work.
  Pure source worksheet and source projections are not canonical whole-return,
  guided collector, official physical form or human filing qualification.
lines:
  - line: "1a"
    label: "Owned property"
    formula: "Average actual beginning/end original cost, separately Ohio/everywhere; exclude actual statutory excluded/nonbusiness property."
    testRef: "tests/engine/state/oh-it-nrc-business.test.ts::matches actual ordinary C SectionsII/III line identities and source originals"
  - line: "1b"
    label: "Rented property"
    formula: "Eight times actual annual rent paid minus subrent received, separately Ohio/everywhere; admitted full-year unchanged rentals only."
    testRef: "tests/engine/state/oh-it-nrc-business.test.ts::matches actual ordinary C SectionsII/III line identities and source originals"
  - line: "1c"
    label: "Property weighted factor"
    formula: "Owned plus rented property; exact six-decimal ratio multiplied by reweighted property weight."
    testRef: "tests/engine/state/oh-it-nrc-business.test.ts::matches actual ordinary C SectionsII/III line identities and source originals"
  - line: "2"
    label: "Payroll weighted factor"
    formula: "Actual qualifying employee compensation Ohio/everywhere; statutory research/special-industry exclusions confirmed; exact six-decimal ratio times reweighted payroll weight."
    testRef: "tests/engine/state/oh-it-nrc-business.test.ts::matches actual ordinary C SectionsII/III line identities and source originals"
  - line: "3"
    label: "Sales weighted factor"
    formula: "Actual complete ordinary service receipt rows sitused by purchaser benefit; Ohio/everywhere ratio times reweighted sales weight. Reconcile actual complete gross receipts."
    testRef: "tests/engine/state/oh-it-nrc-business.test.ts::matches actual ordinary C SectionsII/III line identities and source originals"
  - line: "4"
    label: "Ohio apportionment ratio"
    formula: "Sum weighted factors. Zero denominator removes original20/20/60 weight; remaining weights reweight proportionately. Only exact six-decimal weights/ratios/results admitted pending general precision method."
    testRef: "tests/engine/state/oh-it-nrc-business.test.ts::matches actual ordinary C SectionsII/III line identities and source originals"
  - line: "5"
    label: "Business interest/dividends"
