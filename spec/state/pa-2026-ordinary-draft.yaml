form: "PA-2026-Ordinary-Draft"
fullName: "Source-bound 2026 ordinary Pennsylvania draft without a full federal return"
taxYear: 2026
reference: "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u302s"
notes: |
  Finite state-only draft for single living unmarried owners in each actual
  FY/PY/NR class, complete ordinary cash W2 originals and source payroll only.
  No original document, missing amount, date, eligibility answer or election is
  inferred. Existing canonical ordinary and full federal APIs keep their gates.
  Enacted sections302/303/304, 61PaCode121.8, final2026REV413(I), Act45/2025
  ArticleXVI-W.2 and IRS RevProc2025-32 section4.06 support this finite method.
  Final2026 annual mappings, filing and full-year qualification remain denied.
lines:
  - line: "dependency-proof"
    description: "Actual wage-only originals independently establish the limited credit dependencies"
    formula: |
      Require selected2026 single living owner, complete actual PA source packets,
      current original W2 coverage, explicit no other classes/adjustments and
      no employer benefits and either confirmed no care payments or the bounded
      full-year resident care method below; deny every retained unsupported source.
      Exact ordinary federal W2 earned wages must be strictly greater than70244,
      the largest official2026 completed EITC phaseout across all four child counts
      and both joint/nonjoint tables. Thus federal EITC and WPTC are exactlyzero
      regardless of unknown EIC child count; never infer EIC children from PA/SP
      dependent count, synthesize a federal result, or alias2025 constants.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft composes all actual residency sources without full federal admission"
  - line: "state-composition"
    description: "Reuse current PA source derivation and ordinary arithmetic"
    formula: |
      Replay complete actual originals, residency, payroll dates/source amounts,
      worldwideSP, source-linked credits/payment/use-tax/local obligations through
      the existing ordinary composer. This first draft requires no other income,
      expenses outside the care method below, benefits, reciprocal or specialized
      packet, and reported PA withholding
      at least fresh PA40 tax, except for the confirmed nonresident balance below.
      Known zero retained; absence never establishes zero.
      Preserve existing per-class roundDollar then PA40 roundDollar(x*0.0307),
      SP statutory unchanged nominal thresholds, one payment disposition, and all
      original source-currentness/owner/year/duplicate/source-precision guards.
      REV1630 zero net tax exits before unsourced2027 interest is needed.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft preserves exact cents known zero and complete withholding"
  - line: "resident-actual-dependent-care"
    description: "Apply the frozen 2022 care percentage in the narrow full-year PA ordinary draft"
    formula: |
      Accept only an actual continuously PA-domiciled full-year living unmarried
      Single owner whose source review rules out head-of-household eligibility,
      whose sole income is reconciled ordinary original W-2 wages strictly above
      $70,244, with the base Single standard deduction and no other federal tax
      reductions except the possible credit for one child under section 24.
      Match the actual claimant birth date to the base-deduction cohort.
      Use exactly one directly claimable under-13 section 152(a)(1) child, after
      custody and dependency exclusions, one eligible unrelated non-household
      provider and one actual current-year work-related receipt. Separately confirm
      the provider relationship under 26 CFR 1.21-4. The provider cannot be a
      claimable dependent, the taxpayer's child under 19, anyone who was the
      taxpayer's spouse during the year, or the qualifying child's other parent.
      This draft also excludes other relatives. The source review
      must bind the claimant's own payment to that receipt and exclude third-party
      payment, reimbursement, duplicate claims, deemed income, section 129 benefits
      and prior-year expense credit. Require confirmation that the same eligible
      expenses are intended for the current federal claim. Replay the original
      payment metadata, dates, person, provider, earned income and exact amounts.
      At this wage floor, ordinary taxable income exceeds $54,143 after the
      $16,100 basic deduction and even a dollar of reporting allowance. Use only
      the first two Single 2026 statutory brackets through $50,400 ($5,800) as a
      conservative regular-tax checkpoint. The 2026 draft section 3 tables' $50
      intervals cannot cross this checkpoint for the accepted incomes. Reserve
      the full $2,200 section 24 amount for one child and confirm the remaining
      $3,600 floor covers the positive current section 21 credit before calculating
      Pennsylvania Schedule DC from the same expenses at the frozen 2022 rate.
      At $74,000 of wages and $1,800 paid for care, current section 21 predicts a
      $630 allowance (35%); the Pennsylvania draft credit is $360 (20%), tax
      before credits is $2,272, and with $2,500 withheld the draft refund is $588.
      Retain amount-only audit and no full federal result. Draft amounts do not
      establish an actual federal claim, a final form transfer, or filing readiness.
      The public stand-alone Schedule DC calculation still requires its actual
      federal liability worksheet.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1929/0/0176.016W000..HTM#19290176u1603-Ws"
      - "https://www.pa.gov/agencies/revenue/resources/tax-types-and-information/personal-income-tax/child-and-dependent-care-credit"
      - "https://www.pa.gov/agencies/revenue/resources/tax-law-policies-bulletins-notices/tax-cuts-and-jobs-one-big-beautiful-bill-acts"
      - "https://uscode.house.gov/us/usc/119-120/t26/s21/"
      - "https://www.ecfr.gov/current/title-26/section-1.21-4"
      - "https://uscode.house.gov/us/usc/t26/s26/"
      - "https://uscode.house.gov/us/usc/t26/s3/"
      - "https://www.irs.gov/irb/2025-45_IRB"
      - "https://www.irs.gov/pub/irs-dft/i1040gi--dft.pdf#page=80"
    testRef: "tests/engine/state/pa-2026-ordinary-care-draft.test.ts::PA2026 actual resident care applies the frozen state rate without a federal return"
  - line: "florida-move-full-year-resident"
    description: "Apply the full-year PA source basis to a complete 2026 Florida-to-Pennsylvania move"
    formula: |
      Require the confirmed single primary owner, exactly one contiguous FL-to-PA
      domicile change, actual qualifying permanent abode records confined to each
      matching period, a PA December 31 principal residence, and an explicit
      resident claim with no conflicting retained residency selection. Sum the
      two actual PA presence counts and require more than
      183. Keep the exact-183 case and every other above-threshold one-move claim
      in the separate-method hold.
      Limit the route to one complete current primary W-2 and original payroll
      reconciled over both domicile periods with every dollar paid for physical
      PA services and documented PA presence in each paid period. Reconcile the
      actual PA Boxes 16 and 17 and reject other
      state rows, outside services, special compensation and other source facts.
      Reuse the existing wage-only draft requirements and original checks for
      no other income, adjustments, eligibility/credit sources, or other-state
      payments, with the complete zero Florida jurisdiction payment record.
      The documented Florida jurisdiction has no personal income tax. Do not
      infer other states' liability from cash paid. Tax reporting includes all
      75,000 of the fixture wages, 2,302.50 raw tax and 2,303 whole-dollar tax.
      Preserve actual withholding separately. No new return or filing readiness.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u301s"
      - "https://www.pa.gov/agencies/revenue/resources/tax-types-and-information/personal-income-tax/determining-residency#when-is-a-person-considered-a-part-year-resident"
      - "https://floridarevenue.com/faq/Pages/FAQDetails.aspx?FAQID=1466"
      - "https://www.irs.gov/pub/irs-pdf/iw2w3.pdf"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 Florida mover derives full-year wages from the actual resident source path"
  - line: "florida-move-guide-replay"
    description: "Replay the same confirmed 2026 Pennsylvania move through guided originals"
    formula: "Guided capture binds the current W-2 and resolver facts, preserves the two original domicile periods, invalidates edits and cannot substitute payroll or bypass the ordinary completion sources."
    testRef: "tests/apps/web/guided-pa-residency-facts.test.ts::PA residency guide - confirms and replays the Florida mover's original full-year resident facts"
  - line: "nonresident-actual-small-balance"
    description: "Reconcile the exact timely PA-40 balance paid by a nonresident wage earner with no estimated installments due"
    formula: |
      Require the existing single living nonresident class, one original
      owner-attributed 2026 W-2 with exact zero PA withholding, and exact
      worldwide wages above $70,244.
      Require a confirmed owner- and year-matched review bound to the unchanged
      PA residency/payroll originals. Retain contemporaneous sources of the
      maximum reasonably expected PA wages during the four determination
      periods ending April 1, June 1, September 1 and December 31, 2026.
      Confirm all periods and changes were reviewed. Treat all expected PA
      wages as unwithheld for this limited review. Each expectation and actual
      PA compensation must be strictly below $14,000. Each projected tax at
      3.07% and the actual return balance must be below $430 before and after
      the applicable whole-dollar calculation. Leave the exact boundary to
      its own method. No estimate, extension, carryforward, use tax or other
      credit sources may affect this balance.
      Require an original timely filed return and the exact matching original
      2026 PA-40 balance receipt dated April 15, 2027. Verify fresh printed tax
      due and zero estimated underpayment interest before settlement. Preserve
      return tax due and report the receipt applied and outstanding balance
      separately. An expected payment never establishes settlement, and the
      receipt does not make this draft filing eligible.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u325s"
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u332s"
      - "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2026/2026_rev-413i.pdf"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft reconciles a timely actual nonresident small balance separately from return tax"
  - line: "review-only-extension-receipts"
    description: "Separately reported extension receipts when withholding independently covers the complete state tax"
    formula: "For the review-only ordinary 2026 draft, accept separately verified extension receipts dated January 1 through April 15, 2027. Withholding independently covers the complete PA tax as before. Report the exact sum rounded once on PA-40 line 16 without affecting REV-1630 or the wage dependency. Require a complete refund disposition. Do not combine these receipts with the nonresident small balance method, prior credit or quarterly estimates. Filing remains disabled."
    sources:
      - "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/rev-276.pdf"
    testRef: "tests/engine/state/pa-ordinary-return.test.ts::PA2026 draft reports early extension receipts with independently sufficient withholding in %s"
  - line: "nonresident-small-balance-source-limits"
    description: "Reject stale projections, unknown or mismatched receipts, and the $14,000 or $430 boundaries"
    formula: "Require affirmative contemporaneous projection coverage, agreement with any retained projection source, exact current originals and a complete timely receipt. Earlier thresholds and the 2025 REV-1630 do not establish this 2026 boundary."
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft rejects unsupported nonresident small balance evidence (%s)"
  - line: "source-currentness"
    description: "Existing actual guided captures bind unchanged originals without creating confirmation"
    formula: |
      Actual guided capture/build APIs must accept current complete2026 originals;
      reference-only, lexical-money, owner, date or source edits invalidate retained
      confirmation until explicit new capture/reconfirmation. Unknown care/credit
      scope and unsupported retained originals deny even when their nominal tax
      result would be zero. No fake completed federal return or trusted client flag.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft preserves actual guided source capture and stale original denial"
  - line: "guided-federal-child-credit-context"
    description: "Allow neutral retained Form 8812 interview context in the PA wage-only draft"
    formula: |
      The native interview can retain an empty or explicitly negative Puerto Rico
      residency answer and zero legacy Form 8812 values. Validate the entire
      current shape. Only absent or false residence and absent or exactly zero
      Form 8812 exclusion/election amounts are neutral to the separate state
      wage and federal EIC phaseout proofs. Reject true residence, any positive
      or malformed amount, and unknown fields. A positive original W-2 Code Q
      requires its separate compensation method regardless of neutral Form 8812
      context. Keep the actual context in the original snapshot and require
      recapture after an edit. Do not compute or imply a federal child credit.
    testRef: "tests/engine/state/pa-2026-childless-eic.test.ts::PA2026 native inventory survives actual guided state handoff save and parent invalidation"
  - line: "guided-federal-child-credit-special-sources"
    description: "Deny specialized income when the neutral Form 8812 route is used"
    formula: "Neutral context never establishes an unknown wage original or converts actual excluded income or combat pay into zero. Sources refreshed 2026-11-13: https://www.irs.gov/instructions/i1040s8 and https://www.irs.gov/instructions/iw2w3."
    testRef: "tests/engine/state/pa-2026-childless-eic.test.ts::PA2026 draft validates retained Form 8812 context without inferring compensation sources"
  - line: "living-owner-currentness"
    description: "Check retained federal death facts before selecting a zero-credit proof"
    formula: |
      The calendar-year wage draft requires the confirmed full-year living owner.
      Reject a retained federal death-date string before any income or age shortcut.
      This draft has no decedent or post-year death method and preserves the actual
      source for review. Omitted or explicitly null federal dates can accompany the
      separate affirmative PA full-year living confirmation. See the Pennsylvania
      DFO-02 deceased-filer and Schedule SP annualization instructions at
      https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/dfo-02.pdf
      and federal reporting at https://www.irs.gov/instructions/i1040gi.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft checks retained death facts before income-based EIC proofs"
  - line: "calendar-year-admission"
    description: "Hold the calendar-year wage draft for a confirmed accounting-period change"
    formula: |
      Pennsylvania Tax Reform Code sections 301(v) and 325(j) recognize the required
      federal taxable period and separate estimated-tax procedures for a taxable
      year shorter than twelve months. Withhold the calendar-year wage draft for
      every residency status when the retained shortTaxYear answer is true. An
      omitted or false answer keeps existing source validation and results.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u301s"
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u325s"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft holds a confirmed short tax year for %s"
  - line: "local-obligation-inventory"
    description: "Keep confirmed local filing decisions separate from PA-40"
    formula: |
      Require current documentary review of each resident and work jurisdiction,
      distinct names, individual source references and an explicit Yes or No for
      each separate return. The admitted separate-return status still requires
      at least one Yes. Preserve the explicit decisions and their original order.
      A W-2 locality may link to either reviewed decision; its original Box 19
      is payroll withholding, never evidence of a filing obligation or state
      withholding. Keep unknown and all-No inventories outside this method.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 carries mixed reviewed local obligations from guided capture"
  - line: "readiness"
    description: "Separately typed state-only draft does not qualify full federal or paper filing"
    formula: |
      Return an explicit state-only draft kind and limited dependency proof, never
      TaxReturnResult or a fake full PA orchestrator result. Existing full federal,
      ordinary2026 default API, guided combined preview, prepared PDF and filing
      guards remain unchanged. Existing2025 normal composition stays unchanged.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft retains actual public federal ordinary and PDF gates"
