form: "PA-2026-Ordinary-Draft"
fullName: "Source-bound 2026 ordinary Pennsylvania draft without a full federal return"
taxYear: 2026
reference: "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u302s"
notes: |
  Finite state-only draft for single living unmarried owners in each actual
  FY/PY/NR class with complete ordinary cash W2 originals and source payroll.
  The finite investment methods below accept one additional original.
  No original document, missing amount, date, eligibility answer or election is
  inferred. Existing canonical ordinary and full federal APIs keep their gates.
  Enacted sections302/303/304, 61PaCode121.8, final2026REV413(I), Act45/2025
  ArticleXVI-W.2 and IRS RevProc2025-32 section4.06 support this finite method.
  Final2026 annual mappings, filing and full-year qualification remain denied.
lines:
  - line: "dependency-proof"
    description: "Actual wage-only originals independently establish the limited credit dependencies"
    formula: |
      Require selected2026 single living owner, complete actual PA source packets,
      current original W2 coverage, explicit no other classes/adjustments
      apart from the separately qualified originals below, and
      no employer benefits and either confirmed no care payments or the bounded
      full-year resident care method below; deny every retained unsupported source.
      Exact ordinary federal W2 earned wages must be strictly greater than70244,
      the largest official2026 completed EITC phaseout across all four child counts
      and both joint/nonjoint tables. Thus federal EITC and WPTC are exactlyzero
      regardless of unknown EIC child count; never infer EIC children from PA/SP
      dependent count, synthesize a federal result, or alias2025 constants.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft composes all actual residency sources without full federal admission"
  - line: "state-composition"
    description: "Reuse current PA source derivation and ordinary arithmetic"
    formula: |
      Replay complete actual originals, residency, payroll dates/source amounts,
      worldwideSP, source-linked credits/payment/use-tax/local obligations through
      the existing ordinary composer. This draft admits other income only through
      a separately qualified source method,
      expenses outside the care method below, benefits, reciprocal or specialized
      packet, and reported PA withholding
      at least fresh PA40 tax, except for the confirmed nonresident and part-year
      balances below.
      Known zero retained; absence never establishes zero.
      Preserve existing per-class roundDollar then PA40 roundDollar(x*0.0307),
      SP statutory unchanged nominal thresholds, one payment disposition, and all
      original source-currentness/owner/year/duplicate/source-precision guards.
      REV1630 zero net tax exits before unsourced2027 interest is needed.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft preserves exact cents known zero and complete withholding"
  - line: "primary-residency-declaration"
    description: "Reconcile the retained Pennsylvania declaration with documented residency on draft replay"
    formula: |
      For the 2026 ordinary wage and private Box 1 government unemployment
      drafts, derive the primary taxpayer's Pennsylvania residency from actual
      domicile, permanent abode and physical-presence records. Reject an
      explicit declaration that differs from the derived full-year, part-year,
      or nonresident status, including when the saved original snapshots are
      current. An omitted declaration leaves the source derivation in control.
      Preserve the existing Florida inbound and New York outbound mover
      requirements, historical year behavior, and draft readiness gates.
    sources:
      - "https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide/brief-overview-and-filing-requirements"
      - "https://www.pacodeandbulletin.gov/secure/pacode/data/061/chapter101/chap101toc.html"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 wage draft reconciles retained Pennsylvania residency for %s"
    testRefs:
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 Box 1 draft reconciles retained Pennsylvania residency for %s"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 declaration reconciliation preserves historical Pennsylvania residency replay"
  - line: "resident-actual-dependent-care"
    description: "Apply the frozen 2022 care percentage in the narrow full-year PA ordinary draft"
    formula: |
      Accept only an actual continuously PA-domiciled full-year living unmarried
      Single owner whose source review rules out head-of-household eligibility,
      whose sole income is reconciled ordinary original W-2 wages strictly above
      $70,244, with the base Single standard deduction and no other federal tax
      reductions except the possible credit for one child under section 24.
      Match the actual claimant birth date to the base-deduction cohort.
      Use exactly one directly claimable under-13 section 152(a)(1) child, after
      custody and dependency exclusions, one eligible unrelated non-household
      provider and one actual current-year work-related receipt. Separately confirm
      the provider relationship under 26 CFR 1.21-4. The provider cannot be a
      claimable dependent, the taxpayer's child under 19, anyone who was the
      taxpayer's spouse during the year, or the qualifying child's other parent.
      This draft also excludes other relatives. The source review
      must bind the claimant's own payment to that receipt and exclude third-party
      payment, reimbursement, duplicate claims, deemed income, section 129 benefits
      and prior-year expense credit. Require confirmation that the same eligible
      expenses are intended for the current federal claim. Replay the original
      payment metadata, dates, person, provider, earned income and exact amounts.
      At this wage floor, ordinary taxable income exceeds $54,143 after the
      $16,100 basic deduction and even a dollar of reporting allowance. Use only
      the first two Single 2026 statutory brackets through $50,400 ($5,800) as a
      conservative regular-tax checkpoint. The 2026 draft section 3 tables' $50
      intervals cannot cross this checkpoint for the accepted incomes. Reserve
      the full $2,200 section 24 amount for one child and confirm the remaining
      $3,600 floor covers the positive current section 21 credit before calculating
      Pennsylvania Schedule DC from the same expenses at the frozen 2022 rate.
      At $74,000 of wages and $1,800 paid for care, current section 21 predicts a
      $630 allowance (35%); the Pennsylvania draft credit is $360 (20%), tax
      before credits is $2,272, and with $2,500 withheld the draft refund is $588.
      Retain amount-only audit and no full federal result. Draft amounts do not
      establish an actual federal claim, a final form transfer, or filing readiness.
      The public stand-alone Schedule DC calculation still requires its actual
      federal liability worksheet.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1929/0/0176.016W000..HTM#19290176u1603-Ws"
      - "https://www.pa.gov/agencies/revenue/resources/tax-types-and-information/personal-income-tax/child-and-dependent-care-credit"
      - "https://www.pa.gov/agencies/revenue/resources/tax-law-policies-bulletins-notices/tax-cuts-and-jobs-one-big-beautiful-bill-acts"
      - "https://uscode.house.gov/us/usc/119-120/t26/s21/"
      - "https://www.ecfr.gov/current/title-26/section-1.21-4"
      - "https://uscode.house.gov/us/usc/t26/s26/"
      - "https://uscode.house.gov/us/usc/t26/s3/"
      - "https://www.irs.gov/irb/2025-45_IRB"
      - "https://www.irs.gov/pub/irs-dft/i1040gi--dft.pdf#page=80"
    testRef: "tests/engine/state/pa-2026-ordinary-care-draft.test.ts::PA2026 actual resident care applies the frozen state rate without a federal return"
  - line: "resident-head-of-household-dependent-care"
    description: "Apply the same state care method with separately proven federal Head of Household status"
    formula: |
      Limit to the 2026 state-only actual-care draft with continuous full-year PA
      domicile, PA filing choice S, and the same reviewed wages and one provider,
      child and own-paid receipt requirements. Keep federal Single proof and the
      separate household proof mutually exclusive. The taxpayer must be unmarried,
      ineligible for qualifying surviving spouse, alive and a U.S. resident all
      year, and unable to be claimed as a dependent. Require exactly one directly
      claimed biological child under 13. Reconcile that same child and claimant by
      identity and the same actual Pennsylvania main home for all 365 nights.
      Replay the annual household worksheet with documented eligible total costs
      and documented actual taxpayer payments from own funds. Compare twice the
      taxpayer's payments exactly to total eligible costs and require strictly more
      than half. Confirm no other claimant, special qualification rule or allocated
      public-benefit, child-benefit, shared-fund or third-party funding applies.
      After the basic $24,150 Head of Household deduction and a $51 whole-table
      interval and reporting margin, wages above $70,244 leave taxable income
      above $46,043. Use the $46,000 statutory checkpoint: $1,770 plus 12% of
      $28,300 is $5,166. Reserve the full one-child section 24 amount of $2,200,
      yielding a $2,966 conservative floor, sufficient for the cohort's maximum
      current section 21 credit of $1,050. No alternative eligibility, deduction,
      other federal credit or liability-discount calculation is assumed.
      At $74,000 wages, $1,800 qualifying paid care and $2,500 PA withholding,
      independently reconcile the $630 federal projection, $360 state care credit,
      $2,272 gross tax and $588 draft refund. Household source references, amounts
      paid for upkeep and identifiers remain private. Preserve all 2025, combined
      return, public liability worksheet and filing gates.
    sources:
      - "https://uscode.house.gov/us/usc/t26/s2/"
      - "https://www.irs.gov/publications/p501"
      - "https://www.irs.gov/irb/2025-45_IRB"
      - "https://www.irs.gov/pub/irs-dft/i1040gi--dft.pdf#page=78"
      - "https://www.irs.gov/pub/irs-dft/i2441--dft.pdf#page=6"
    testRef: "tests/engine/state/pa-2026-ordinary-care-draft.test.ts::PA2026 Head of Household care uses independently proven filing facts and a conservative liability floor"
  - line: "florida-move-full-year-resident"
    description: "Apply the full-year PA source basis to a complete 2026 Florida-to-Pennsylvania move"
    formula: |
      Require the confirmed single primary owner, exactly one contiguous FL-to-PA
      domicile change, actual qualifying permanent abode records confined to each
      matching period, a PA December 31 principal residence, and an explicit
      resident claim with no conflicting retained residency selection. Sum the
      two actual PA presence counts and require more than
      183. Keep the exact-183 case and above-threshold one-move claims outside
      the documented Florida and Texas cohorts in the separate-method hold.
      A legacy Florida outside-abode record may omit the state. A recorded
      state other than Florida requires separate review for this draft.
      Limit the route to one complete current primary W-2 and original payroll
      reconciled over both domicile periods with every dollar paid for physical
      PA services and documented PA presence in each paid period. Reconcile the
      actual PA Boxes 16 and 17 and reject other
      state rows, outside services, special compensation and other source facts.
      Reuse the existing wage-only draft requirements and original checks for
      no other income, adjustments, eligibility/credit sources, or other-state
      payments, with the complete zero Florida jurisdiction payment record.
      The documented Florida jurisdiction has no personal income tax. Do not
      infer other states' liability from cash paid. Tax reporting includes all
      75,000 of the fixture wages, 2,302.50 raw tax and 2,303 whole-dollar tax.
      Preserve actual withholding separately. No new return or filing readiness.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u301s"
      - "https://www.pa.gov/agencies/revenue/resources/tax-types-and-information/personal-income-tax/determining-residency#when-is-a-person-considered-a-part-year-resident"
      - "https://floridarevenue.com/faq/Pages/FAQDetails.aspx?FAQID=1466"
      - "https://www.irs.gov/pub/irs-pdf/iw2w3.pdf"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 Florida mover derives full-year wages from the actual resident source path"
    testRefs:
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 Florida mover holds %s"
  - line: "florida-move-guide-replay"
    description: "Replay the same confirmed 2026 Pennsylvania move through guided originals"
    formula: "Guided capture binds the current W-2 and resolver facts, preserves the two original domicile periods, invalidates edits and cannot substitute payroll or bypass the ordinary completion sources."
    testRef: "tests/apps/web/guided-pa-residency-facts.test.ts::PA residency guide - confirms and replays the Florida mover's original full-year resident facts"
  - line: "texas-move-full-year-resident"
    description: "Apply the full-year PA source basis to a complete 2026 Texas-to-Pennsylvania move"
    formula: |
      Apply the same confirmed living single owner, continuous two-period
      domicile timeline, permanent abode, December 31 residence, more than 183
      actual PA days, one current original W-2 and all-PA payroll requirements
      as in the Florida method. The Texas domicile period must precede the PA
      period. Every outside permanent-abode record covering the former domicile
      must explicitly show Texas, and the sole complete zero-tax jurisdiction
      history must be Texas. An omitted abode state requires completion. An
      additional or different abode jurisdiction requires separate review. This
      checks the finite draft's sources without deciding statutory residency for
      another set of facts. The guided collector shows the actual outside-abode
      state for these inbound moves and requires reconfirmation after a change.
      Article VIII, Section 24-a of the Texas Constitution prohibits individual
      income tax. Do not derive zero liability for any other jurisdiction from
      a zero payment. The 200-day fixture reports 75,000 of PA taxable wages,
      2,302.50 raw tax, 2,303 reported tax and 2,303 actual PA withholding,
      leaving no balance. Preserve the exact-183 hold, outside-service and
      incomplete original holds, and all filing and final form gates.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u301s"
      - "https://www.pa.gov/agencies/revenue/resources/tax-types-and-information/personal-income-tax/determining-residency#when-is-a-person-considered-a-part-year-resident"
      - "https://capitol.texas.gov/tlodocs/86R/billtext/html/HJ00038F.htm"
      - "https://gov.texas.gov/news/post/governor-abbott-issues-proclamation-declaring-the-results-of-the-recent-constitutional-amendment-election"
      - "https://comptroller.texas.gov/economy/fiscal-notes/industry/2025/small-biz-info/"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 Texas mover derives full-year wages from the actual resident source path"
    testRefs:
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 Texas mover holds %s"
      - "tests/apps/web/guided-pa-residency-facts.test.ts::PA residency guide - confirms and replays the Texas mover's original full-year resident facts"
      - "tests/apps/web/pa-residency-details.test.tsx::PA residency UI requires the actual Texas outside-abode state on confirmation"
  - line: "part-year-personal-bank-interest"
    description: "Use dated credits on one complete 2026 Box 1 original in the private part-year draft"
    formula: |
      Admit the existing single living unmarried high-wage owner with confirmed
      part-year Pennsylvania residency, ordinary cash W-2 payroll and sufficient
      actual PA withholding to cover the recomputed state tax. Require exactly
      one current uncorrected 2026 Form 1099-INT for that owner, identified
      by the original payer and actual account, and one matching confirmed
      personal nonbusiness interest source row. Require positive Box 1,
      known-zero other reportable amounts including foreign tax and withholding,
      and no specialized interest or private activity bond facts. Use the
      current original and dated bank credits that sum exactly to Box 1.
      One credit reference cannot substantiate multiple credits after
      normalizing case and whitespace.
      Count personal credits on confirmed PA-resident dates as PA interest.
      Include credits on nonresident dates in worldwide Schedule SP income
      through the existing ordinary outside-income calculation. Preserve exact
      credits and existing within-class reporting. The fixture has $80 before
      the move and $40 afterward, $39,000 of PA compensation, $1,199 of PA
      tax and withholding, and $75,120 in worldwide Schedule SP eligibility
      income. The same above-$70,244 wage floor still proves zero federal EITC
      without a federal return: ordinary positive interest cannot lower AGI.
      Hold the full-year and nonresident cohorts, dependent-care, childless
      EITC, estimated balance, government unemployment and prepayment methods
      when combined with this new source. Require complete ordinary completion
      facts. Preserve pending final 2026 PA form, mapping and filing gates.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u303s"
      - "https://www.pacodeandbulletin.gov/secure/pacode/data/061/chapter103/s103.16.html"
      - "https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide/interest"
      - "https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide/tax-forgiveness"
      - "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2026/2026_rev-413i.pdf"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 part-year bank interest replays one complete original and its dated credits"
    testRefs:
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 part-year bank interest holds %s"
  - line: "part-year-personal-cash-dividend"
    description: "Allocate one complete 2026 Box 1a cash-dividend original for a resident moving into Pennsylvania"
    formula: |
      Admit the existing single living unmarried high-wage owner with one
      confirmed move into Pennsylvania, two consecutive domicile periods, and
      part-year Pennsylvania residency. Require exactly one current uncorrected
      2026 Form 1099-DIV for the primary owner and actual payer and account,
      with a matching confirmed PA source row and a complete dated credit
      ledger. Require a complete unmasked dividend account reference. Equal
      masked or suffix-only values cannot verify the account. Use the same
      mask recognition as for full-year returns and match the complete
      original reference literally. Confirm that Box 1a consists entirely of ordinary cash
      dividends on the taxpayer's personal investment in a domestic corporation
      paid in cash without reinvestment, and that the complete original contains
      no special reportable amounts or classifications. Accept known Box 1b only
      as a subset of Box 1a. Require
      positive Box 1a, known-zero other amounts including Box 2a capital gain
      distributions, federal and state withholding, and foreign tax. Hold
      specialized PA adjustments, REIT, bond, foreign and other special facts.
      Zero Box 2a has no regulated-investment-company capital distribution to
      confirm. Each dated positive cash credit must reconcile exactly to Box 1a.
      Reject duplicate credit references after normalizing case and whitespace.
      Report resident-period credits in the dividend class only. Reduce the
      nationwide Box 1a amount by pre-residency credits using the ordinary
      Schedule B calculation. Include the outside-period amount once in
      worldwide Schedule SP eligibility income through the existing outside
      income calculation. Preserve the existing calculation's reporting precision.
      The fixture has $80 before the move and $40 beginning on the move date,
      $39,000 of PA compensation, $1,199 of PA tax and withholding, and $75,120
      in worldwide Schedule SP eligibility income. The wage floor above $70,244
      still proves zero federal EITC without a federal return.
      Require the same actual withholding coverage as the bank-interest method
      and complete ordinary completion facts. The combined interest and cash
      dividends method below governs a simultaneous bank-interest original.
      Hold other dividend originals, outbound and other mover cohorts, dependent care, childless
      EITC, estimated balance, unemployment and prepayment methods. Preserve
      pending final 2026 PA form, mapping and filing gates.
    sources:
      - "https://www.pacodeandbulletin.gov/secure/pacode/data/061/chapter103/s103.15.html"
      - "https://www.pa.gov/agencies/revenue/resources/tax-types-and-information/personal-income-tax/determining-residency"
      - "https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide/dividends"
      - "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40b.pdf"
      - "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40sp.pdf"
      - "https://www.irs.gov/instructions/i1099div"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 part-year cash dividend replays one complete original and its dated credits"
    testRefs:
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 part-year cash dividend outside the resident period enters Schedule SP only"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 part-year cash dividend holds %s"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 reopened part-year %s holds repeated masked dividend account references"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 reopened part-year %s accepts a complete literal dividend account"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 reopened part-year cash dividends retain literal account matching"
  - line: "part-year-interest-and-cash-dividends"
    description: "Apply the separate income-class and withholding checks when both ordinary originals are present"
    formula: |
      For the confirmed high-wage single inbound part-year method, allow
      one supported Form 1099-INT and one supported Form 1099-DIV together.
      Require the complete matched original and reconcile each dated ledger
      independently under its own source method. Require the same complete
      unmasked dividend account reference as the dividend-only method. Report
      resident-period credits separately on Schedule A and Schedule B. Include each
      nonresident-period amount once in worldwide Schedule SP eligibility
      income. Sum the reported Pennsylvania income classes, apply PA tax,
      and require actual withholding to cover that combined amount. With
      $39,000 of resident compensation, $40 of resident interest and $40 of
      resident dividends, the reported taxable income is $39,080 and the
      rounded tax is $1,200. Each original has $80 of outside income and
      $120 nationwide; worldwide eligibility income is $75,240. Preserve
      the separate-source limits, residency cohorts, and final 2026 holds.
    sources:
      - "https://www.pa.gov/agencies/revenue/resources/tax-types-and-information/personal-income-tax/determining-residency"
      - "https://www.pacodeandbulletin.gov/secure/pacode/data/061/chapter103/s103.16.html"
      - "https://www.pacodeandbulletin.gov/secure/pacode/data/061/chapter103/s103.15.html"
      - "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40sp.pdf"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 part-year combines separately reconciled interest and dividends"
    testRefs:
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 part-year combined interest and dividends require withholding for both classes"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 part-year combined investment sources hold a mismatched %s original"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 reopened part-year %s holds repeated masked dividend account references"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 reopened part-year %s accepts a complete literal dividend account"
  - line: "full-year-personal-cash-dividend"
    description: "Include one verified cash-dividend original for a continuous PA resident or nonresident"
    formula: |
      Apply the same original, filing owner, exact receipt ledger, withholding,
      classification and other ordinary source conditions as for part-year cash
      dividends. Require a single confirmed domicile period covering the entire
      2026 calendar year, in PA for a resident or outside PA for a nonresident,
      with the existing abode, presence and declaration reconciliation. Hold
      statutory residency outside that continuous-domicile cohort and all mover
      methods other than the existing part-year move into Pennsylvania.
      Require a complete account reference for each added residency method.
      Repeated masked or suffix-only values cannot verify the account. Preserve
      literal X characters within ordinary unmasked identifiers. Classify
      separated X masks and fullwidth forms after compatibility normalization.
      Preserve literal agreement of the
      matched original evidence.
      The exact nationwide Box 1a amount contributes once to the source income
      underlying federal AGI and worldwide Schedule SP. Known Box 1b is a subset
      already included in Box 1a. The wage floor still proves zero federal EITC
      without a full federal calculation. Include all Box 1a in PA dividends for
      the full-year resident. For the full-year nonresident, remove all Box 1a
      from PA taxable dividends and include it once in outside income for
      Schedule SP. Use the existing PA tax and settlement calculations. Keep
      public filing, PDF availability and final 2026 form qualification gated.
    sources:
      - "https://www.pa.gov/agencies/revenue/resources/tax-types-and-information/personal-income-tax/determining-residency"
      - "https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide/dividends"
      - "https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide/tax-forgiveness"
      - "https://www.irs.gov/instructions/i1099div"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 cash dividends reconcile annual %s tax and worldwide Schedule SP"
    testRefs:
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 cash dividends still hold the two-period %s method"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 annual %s cash dividends reject repeated masked account references"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 annual %s cash dividends accept literal account references with X characters"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 annual cash dividends reject alternate masks (%s)"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 annual cash dividends still match nonmasked references literally"
  - line: "nonresident-actual-small-balance"
    description: "Reconcile the exact timely PA-40 balance paid by a nonresident wage earner with no estimated installments due"
    formula: |
      Require the existing single living nonresident class, one original
      owner-attributed 2026 W-2 with exact zero PA withholding, and exact
      worldwide wages above $70,244.
      Require a confirmed owner- and year-matched review bound to the unchanged
      PA residency/payroll originals. Retain contemporaneous sources of the
      maximum reasonably expected PA wages during the four determination
      periods ending April 1, June 1, September 1 and December 31, 2026.
      Confirm all periods and changes were reviewed. Treat all expected PA
      wages as unwithheld for this limited review. Each expectation and actual
      PA compensation must be strictly below $14,000. Each projected tax at
      3.07% and the actual return balance must be below $430 before and after
      the applicable whole-dollar calculation. Leave the exact boundary to
      its own method. No estimate, extension, carryforward, use tax or other
      credit sources may affect this balance.
      Require an original timely filed return and the exact matching original
      2026 PA-40 balance receipt dated April 15, 2027. Verify fresh printed tax
      due and zero estimated underpayment interest before settlement. Preserve
      return tax due and report the receipt applied and outstanding balance
      separately. An expected payment never establishes settlement, and the
      receipt does not make this draft filing eligible.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u325s"
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u332s"
      - "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2026/2026_rev-413i.pdf"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft reconciles a timely actual nonresident small balance separately from return tax"
  - line: "part-year-actual-small-balance"
    description: "Apply the same documented no-installment balance method to a part-year resident"
    formula: |
      Establish part-year Pennsylvania residency and actual Pennsylvania-taxable
      compensation under the existing ordinary residence and payroll method.
      The final 2026 REV-413(I) applies the $14,000 income and $430 net-tax
      thresholds to part-year residents. Reuse the nonresident balance method's
      one current W-2, worldwide wage floor, exact zero PA withholding, source
      currentness, four contemporaneous projections, strict thresholds and
      exact original filing and payment receipt requirements. Measure each
      projection and the fresh return against Pennsylvania-taxable wages only.
      For a part-year mover with $66,000 in wages outside Pennsylvania before
      residency and $9,000 of wages during residency, $276.30 rounds to $276.
      With the exact April 15, 2027 receipt, report zero estimated underpayment
      interest and zero outstanding balance separately from the $276 return tax.
      Keep full-year residents outside this method and retain review-only status.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u325s"
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u332s"
      - "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2026/2026_rev-413i.pdf#page=1"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 part-year draft reconciles a timely actual small balance from %s sources"
    testRefs:
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 part-year draft holds stale estimate review after payroll sources are reconfirmed"
      - "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft rejects unsupported small balance evidence (%s)"
  - line: "review-only-extension-receipts"
    description: "Separately reported extension receipts when withholding independently covers the complete state tax"
    formula: "For the review-only ordinary 2026 draft, accept separately verified extension receipts dated January 1 through April 15, 2027. Withholding independently covers the complete PA tax as before. Report the exact sum rounded once on PA-40 line 16 without affecting REV-1630 or the wage dependency. Require a complete refund disposition. Do not combine these receipts with the small balance method, prior credit or quarterly estimates. Filing remains disabled."
    sources:
      - "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/rev-276.pdf"
    testRef: "tests/engine/state/pa-ordinary-return.test.ts::PA2026 draft reports early extension receipts with independently sufficient withholding in %s"
  - line: "small-balance-source-limits"
    description: "Reject stale projections, unknown or mismatched receipts, and the $14,000 or $430 boundaries"
    formula: "Require affirmative contemporaneous projection coverage, agreement with any retained projection source, exact current originals and a complete timely receipt. Earlier thresholds and the 2025 REV-1630 do not establish this 2026 boundary."
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft rejects unsupported small balance evidence (%s)"
  - line: "source-currentness"
    description: "Existing actual guided captures bind unchanged originals without creating confirmation"
    formula: |
      Actual guided capture/build APIs must accept current complete2026 originals;
      reference-only, lexical-money, owner, date or source edits invalidate retained
      confirmation until explicit new capture/reconfirmation. Unknown care/credit
      scope and unsupported retained originals deny even when their nominal tax
      result would be zero. No fake completed federal return or trusted client flag.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft preserves actual guided source capture and stale original denial"
  - line: "guided-federal-child-credit-context"
    description: "Allow neutral retained Form 8812 interview context in the PA wage-only draft"
    formula: |
      The native interview can retain an empty or explicitly negative Puerto Rico
      residency answer and zero legacy Form 8812 values. Validate the entire
      current shape. Only absent or false residence and absent or exactly zero
      Form 8812 exclusion/election amounts are neutral to the separate state
      wage and federal EIC phaseout proofs. Reject true residence, any positive
      or malformed amount, and unknown fields. A positive original W-2 Code Q
      requires its separate compensation method regardless of neutral Form 8812
      context. Keep the actual context in the original snapshot and require
      recapture after an edit. Do not compute or imply a federal child credit.
    testRef: "tests/engine/state/pa-2026-childless-eic.test.ts::PA2026 native inventory survives actual guided state handoff save and parent invalidation"
  - line: "guided-federal-child-credit-special-sources"
    description: "Deny specialized income when the neutral Form 8812 route is used"
    formula: "Neutral context never establishes an unknown wage original or converts actual excluded income or combat pay into zero. Sources refreshed 2026-11-13: https://www.irs.gov/instructions/i1040s8 and https://www.irs.gov/instructions/iw2w3."
    testRef: "tests/engine/state/pa-2026-childless-eic.test.ts::PA2026 draft validates retained Form 8812 context without inferring compensation sources"
  - line: "living-owner-currentness"
    description: "Check retained federal death facts before selecting a zero-credit proof"
    formula: |
      The calendar-year wage draft requires the confirmed full-year living owner.
      Reject a retained federal death-date string before any income or age shortcut.
      This draft has no decedent or post-year death method and preserves the actual
      source for review. Omitted or explicitly null federal dates can accompany the
      separate affirmative PA full-year living confirmation. See the Pennsylvania
      DFO-02 deceased-filer and Schedule SP annualization instructions at
      https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/dfo-02.pdf
      and federal reporting at https://www.irs.gov/instructions/i1040gi.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft checks retained death facts before income-based EIC proofs"
  - line: "calendar-year-admission"
    description: "Hold the calendar-year wage draft for a confirmed accounting-period change"
    formula: |
      Pennsylvania Tax Reform Code sections 301(v) and 325(j) recognize the required
      federal taxable period and separate estimated-tax procedures for a taxable
      year shorter than twelve months. Withhold the calendar-year wage draft for
      every residency status when the retained shortTaxYear answer is true. An
      omitted or false answer keeps existing source validation and results.
    sources:
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u301s"
      - "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1971/0/0002..HTM#19710002u325s"
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft holds a confirmed short tax year for %s"
  - line: "local-obligation-inventory"
    description: "Keep confirmed local filing decisions separate from PA-40"
    formula: |
      Require current documentary review of each resident and work jurisdiction,
      distinct names, individual source references and an explicit Yes or No for
      each separate return. The admitted separate-return status still requires
      at least one Yes. Preserve the explicit decisions and their original order.
      A W-2 locality may link to either reviewed decision; its original Box 19
      is payroll withholding, never evidence of a filing obligation or state
      withholding. Keep unknown and all-No inventories outside this method.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 carries mixed reviewed local obligations from guided capture"
  - line: "readiness"
    description: "Separately typed state-only draft does not qualify full federal or paper filing"
    formula: |
      Return an explicit state-only draft kind and limited dependency proof, never
      TaxReturnResult or a fake full PA orchestrator result. Existing full federal,
      ordinary2026 default API, guided combined preview, prepared PDF and filing
      guards remain unchanged. Existing2025 normal composition stays unchanged.
    testRef: "tests/engine/state/pa-2026-ordinary-draft.test.ts::PA2026 draft retains actual public federal ordinary and PDF gates"
