form: "Guided Ohio actual owner domicile and NRC sources"
taxYear: 2025
reference: "https://dam.assets.ohio.gov/image/upload/v1767095693/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf"
notes: |
  Actual owner status and complete calendar domicile periods are separate from
  home mailing address. No contact-day presumption is inferred. Every source
  allocation is supplied from actual records; blank remains unknown and actual
  zero remains zero. Valid displayed comma-grouped amounts convert losslessly to decimal strings without rounding; blanks remain unknown. Signed capital/rent source fields permit actual negative values. Editing any source invalidates confirmation. Full-year
  resident only households need actual timelines but no fabricated NRC rows.
  The current original snapshot is copied only after actual source confirmation;
  source allocations and eligibility facts are never inferred from this copy.
  Canonical NRC source classification includes the qualified nonbusiness
  wages, bank interest, dividends, and single ordinary unemployment source.
  Ohio adjustment exclusions and district ambiguity require separate methods.
lines:
  - line: "residency"
    label: "Actual owner domicile and allocation facts"
    formula: "Validate current year, source reference, confirmation and complete unique owner timelines. Validate every required actual NRC row with Decimal and retain unknown versus zero."
    testRef: "tests/guided-interview/guided-ohio-residency.test.ts::preserves actual source allocations and copies only confirmed current originals"
  - line: "ordinary-unemployment-payment"
    label: "2025 Ohio IT NRC line 12 guided payment evidence"
    formula: |
      Apply the canonical 2025 one-original, single-filer ordinary Box 1 method.
      For a part-year resident, collect an actual dated payment or a complete
      schedule of distinct original payment references, dates and exact amounts.
      Require confirmation that the entered receipts account for original Box 1.
      Match the sum of positive whole-dollar amounts to the verified current
      Form 1099-G and allocate each receipt using the
      confirmed Ohio domicile dates. For a full-year nonresident, derive known
      zero Ohio unemployment from the complete outside timeline. Derive the NRC
      unemployment row from actual originals instead of collecting the same
      amounts again. Confirm and replay only after the evidence, owner, original,
      and canonical return inputs reconcile. Bind part-year payment evidence to
      the exact original statement and the current owner's tax ID and birth
      date. Persist only the fingerprint for this binding. A replacement for the
      same amount or a different owner cannot reuse it. Removing the primary
      owner clears the payment evidence. Saved evidence replays without
      refreshing the original. Other methods and annual filing gates are held.
      https://codes.ohio.gov/ohio-revised-code/section-5747.20
    testRef: "tests/guided-interview/guided-ohio-residency.test.ts::requires actual unemployment evidence before Ohio wizard progression and replays saved originals"
    testRefs:
      - "tests/guided-interview/guided-ohio-residency.test.ts::replays a complete split unemployment payment schedule through the guided Ohio return"
  - line: "ordinary-2026-unemployment-receipt"
    description: "Retain one actual Box 1 receipt for review on an admitted 2026 Ohio return"
    formula: |
      For one single-filer primary owner with known full-year, part-year, or
      nonresident status, retain one actual dated receipt
      covering all of a verified current December 2026 ordinary Form 1099-G
      Box 1. Use the existing private statement and owner fingerprint and
      require reentry when either changes. Match the positive whole-dollar
      gross payment to Box 1 before assigning it to the actual domicile period.
      Accept no state reporting or one Ohio row with actual payer ID and
      positive state withholding. Hold contradictory or unsupported current
      originals with positive Box 1 even with completed manual category
      answers. Hold future receipts. When a saved schedule is present in the
      2026 single-receipt cohort, offer explicit removal before showing the
      current single-receipt inputs. Replay the confirmed source, receipt, and
      exact Ohio resident amount for the private 2026 method. Keep new
      full-year and nonresident payment proof out of the shared legacy NRC
      input. Preserve 2025 replay, state preview, and filing gates.
    irsRef: "https://www.irs.gov/instructions/i1099g; https://codes.ohio.gov/ohio-revised-code/section-5747.20; https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/DRAFTS/2026/it1040-booklet-draft.pdf#page=42"
    testRef: "tests/apps/web/ohio-residency-interactions.test.tsx::captures and reopens one 2026 Ohio unemployment receipt for review as %s"
    testRefs:
      - "tests/guided-interview/guided-ohio-residency.test.ts::binds a 2026 Ohio receipt to the original and actual domicile date"
      - "tests/guided-interview/guided-ohio-residency.test.ts::holds unsupported positive Box 1 in the 2026 Ohio single receipt cohort"
      - "tests/guided-interview/guided-ohio-residency.test.ts::replays source-bound 2026 Ohio review receipt amounts and private draft for %s"
businessRuleValidation:
  - rule: "actual-collector-confirmation-recovery"
    description: "Visible actual data edits invalidate confirmation; explicit removal preserves missing state instead of inventing full-year residency. No hidden zero defaults."
    testRef: "tests/apps/web/ohio-residency-interactions.test.tsx"
