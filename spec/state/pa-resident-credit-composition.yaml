form: "PA Actual Resident Credit Composition"
fullName: "Verified original resident credit through actual ordinary return composition"
taxYear: 2025
reference: "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/pa-40_pa-41g-l.pdf"
notes: "Sources refreshed2026-11-02: multi-year G-L SectionI4a-e,5,6; current PIT Guide resident credit; actual2025 ScheduleSP PartC. No final2026/filing qualification. Typed nested completion source avoids a new excluded canonical root."
lines:
  - line: "actual-positive"
    description: "Use the actual paid-liability credit rather than a scalar or known-zero history"
    formula: "Fresh actual resident-period W2 source replay computes1535 for resident50000 or614 for partyear20000; PA40 tax1539/799 less resident credit1535/614 yields net4/185. Actual PA withholding1539/799 then produces requested refund1535/614; actual foreign tax never counts as PA payments."
    testRef: "tests/engine/state/pa-resident-credit-composition.test.ts::actual resident credit composition preserves resident and partyear tax payment and refund oracles"
  - line: "actual-withholding"
    description: "Foreign withholding is an actual payment source, not an additional credit or a substitute for liability"
    formula: "Actual DE withholding800 plus actual posted balance1200 reconcile net paid2000; ordinary50000 cap1535 remains. PA withholding1539 alone stays in PA payments."
    testRef: "tests/engine/state/pa-resident-credit-composition.test.ts::actual resident credit composition counts DE withholding800 and payment1200 exactly once"
  - line: "sp-order"
    description: "Apply source-qualified resident credit before ScheduleSP forgiveness"
    formula: "Actual ordinary compensation6000 plus bank120 yields reported PA tax188; validated otherstate tax paid100 gives resident credit100, leaving88 subject to100percent SP forgiveness. PA total credits188 and net liability0; actual PA withholding1539 yields refund1539."
    testRef: "tests/engine/state/pa-resident-credit-composition.test.ts::actual resident credit composition applies ScheduleSP to tax remaining after resident credit"
  - line: "history"
    description: "Coarse complete-history fields reconcile to actual source records"
    formula: "Exact current owner/year/asof and jurisdiction must match, coarse taxPaid equals validated actualNetPayments, coarse incomeTaxWithheld equals actual validated W2 withholding. Missing positive claim, fabricated scalar, wrong date, duplicate/state mismatch or suppressing a positive retained original rejects; known-zero reviewed jurisdictions remain separately necessary."
    testRef: "tests/engine/state/pa-resident-credit-composition.test.ts::actual resident credit composition rejects unreconciled complete-history claims"
  - line: "sources"
    description: "Revalidate current originals, eligibility and unknown histories on each use"
    formula: "Missing/unknown nested source, stale original snapshots, reciprocal employee credit and unsupported original-return methods cannot be accepted by actual_payments or a present nested object; empty claims never establish complete history. Preserve all private original strings and confirmations without mutation; filing remains false."
    testRef: "tests/engine/state/pa-resident-credit-composition.test.ts::actual resident credit composition rejects stale unknown and reciprocal originals without refreshing them"
