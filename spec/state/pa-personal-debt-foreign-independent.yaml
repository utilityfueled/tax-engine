    section: "III and IV.A: actual personal unsecured use; separate property/employment/deduction methods"
    retrieved: "2026-11-03"
  - url: "https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide/interest"
    section: "Gross ordinary interest and actual nonresident/partyear receipt allocation"
