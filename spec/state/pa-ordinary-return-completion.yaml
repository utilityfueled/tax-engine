form: "PA-Ordinary-Return-Completion-Sources"
fullName: "Structured actual completion sources for Pennsylvania ordinary return review"
taxYear: 2026
reference: "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40in.pdf"
notes: "Source transport only; actual2025/2026 sources, all existing review/form/law/filing gates preserved. Positive or unsupported credit/local/relief sources require their actual methods."
lines:
  - line: "empty"
    description: "PA completion empty draft keeps every unknown"
    formula: "No source year, status, amount, owner, local jurisdiction or eligibility fact is inferred."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion empty draft keeps every unknown"
  - line: "snapshot"
    description: "PA completion snapshot excludes exactly four self and replay roots"
    formula: "Snapshot all current canonical originals except paResidencySources, paReciprocitySources, paOrdinaryReturnFacts, paOrdinaryReturnCompletionSources; preserve all other roots."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion snapshot excludes exactly four self and replay roots"
  - line: "confirm"
    description: "PA completion explicit confirmation binds current actual owner and originals"
    formula: "Only explicit confirmation copies current actual primary identity and unchanged canonical originals after actual source-year and source-review checks."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion explicit confirmation binds current actual owner and originals"
  - line: "year"
    description: "PA completion missing year cannot borrow the current year"
    formula: "A missing actual source year remains unknown and cannot be guessed from the current return."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion missing year cannot borrow the current year"
  - line: "unknown"
    description: "PA completion unknown group and review answers block confirmation"
    formula: "Unknown actual eligibility or source-review answers are incomplete, never assumed none."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion unknown group and review answers block confirmation"
  - line: "money"
    description: "PA completion preserves actual other-state amounts and does not create a credit"
    formula: "Exact original amounts remain Decimal strings; a positive actual tax history requires its credit method, never an override or zero."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion preserves actual other-state amounts and does not create a credit"
  - line: "metadata"
    description: "PA completion reported originals stay typed metadata requiring a source method"
    formula: "Retain structured private original-document metadata for awards, transfers, carryforwards, care, NRK1 and relief; metadata is not qualified credit evidence."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion reported originals stay typed metadata requiring a source method"
  - line: "contradiction"
    description: "PA completion none status cannot erase retained reported originals"
    formula: "Changing status preserves existing rows; contradictory none plus originals cannot be confirmed."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion none status cannot erase retained reported originals"
  - line: "stale"
    description: "PA completion reads reject stale originals without refreshing them"
    formula: "A changed canonical original or owner invalidates read validation; no source snapshot or fact is refreshed on reads."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion reads reject stale originals without refreshing them"
  - line: "edit"
    description: "PA completion edits clear confirmation and retain original proof"
    formula: "Actual source edits clear only confirmation; retained original snapshots and rows persist until explicit replacement/removal."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion edits clear confirmation and retain original proof"
  - line: "local"
    description: "PA completion local unknown never means no local tax"
    formula: "Keep explicit actual jurisdiction and obligation facts; no inferred jurisdiction, local liability or completion."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion local unknown never means no local tax"
  - line: "roundtrip"
    description: "PA completion private roundtrip preserves exact source facts"
    formula: "Private JSON save/reopen preserves confirmed actual sources and exact amounts; no public replay or readiness claim."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion private roundtrip preserves exact source facts"
  - line: "panel"
    description: "PA completion panel exposes unknown structured sources without JSON editor"
    formula: "Collect actual sources through typed rows and explicit answers, with no JSON textarea or credit amount override."
    testRef: "tests/apps/web/pa-ordinary-return-completion-details.test.tsx::PA completion panel exposes unknown structured sources without JSON editor"
  - line: "panel-edit"
    description: "PA completion panel edits invalidate confirmation and retain rows"
    formula: "Every actual field/status edit clears header confirmation; status changes do not erase reported evidence."
    testRef: "tests/apps/web/pa-ordinary-return-completion-details.test.tsx::PA completion panel edits invalidate confirmation and retain rows"
  - line: "panel-records"
    description: "PA completion panel retains reported document metadata behind method guard"
    formula: "Reported records have typed fields and a source-method boundary; no arbitrary object editor or inferred credit."
    testRef: "tests/apps/web/pa-ordinary-return-completion-details.test.tsx::PA completion panel retains reported document metadata behind method guard"
  - line: "panel-confirm"
    description: "PA completion panel explicitly confirms and detects stale current originals"
    formula: "Explicit button binds current actual owner and sources; changed current originals cannot keep a success status."
    testRef: "tests/apps/web/pa-ordinary-return-completion-details.test.tsx::PA completion panel explicitly confirms and detects stale current originals"
  - line: "review-privacy"
    description: "PA completion review copy redacts nested source identifiers"
    formula: "Retain full private owner/original/metadata sources; the existing review projection recursively blanks ownerSSN, accountSSN and recipientTIN while preserving exact original money and explicit employerEIN."
    testRef: "tests/apps/web/guided-pa-ordinary-return-completion.test.ts::PA completion review copy redacts nested source identifiers"
