form: "Ohio Schedule of Withholding"
fullName: "Ohio Schedule of Withholding (IT 1040 line 14 support)"
taxYear: 2025
reference: "https://dam.assets.ohio.gov/image/upload/v1767095693/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf"

notes: |
  Ohio IT 1040 line 14 is supported by the Schedule of Ohio Withholding. The
  2025 Ohio IT 1040 booklet instructs taxpayers to include only Ohio state
  income tax withheld from their income statements and to exclude withholding
  reported for other states.

  The booklet's sample income-statement pages specifically call out:
    - W-2 box 17 when the W-2 state is Ohio
    - W-2G box 15 when the W-2G state is Ohio
    - 1099-R box 14 when the 1099-R state is Ohio

  This engine also supports the modeled 1099 variants that carry Ohio state
  withholding in the input schema:
    - 1099-G box 11 when the 1099-G state is Ohio
    - 1099-K box 8 when the 1099-K state is Ohio
    - 1099-NEC box 5 when the 1099-NEC state is Ohio
    - 1099-MISC box 16 when the 1099-MISC state is Ohio
    - 1099-INT box 17, 1099-DIV box 16, and 1099-B box 16 when the state is Ohio

  Investment source boxes refreshed 2026-10-25 from IRS continuous-use
  Instructions for Forms 1099-INT/OID (01/2024), Form 1099-DIV (01/2024), and
  Form 1099-B (2026), State Information sections:
    https://www.irs.gov/instructions/i1099int
    https://www.irs.gov/instructions/i1099div
    https://www.irs.gov/instructions/i1099b
  Ohio booklet page 17, line 14 includes Ohio withholding on 1099 statements.
  These audit categories support its Part A total; they are not official
  numbered rows of a filled Schedule of Ohio Withholding. Human review pending.

  School district withholding is not part of this schedule. W-2 local/school
  district withholding belongs on SD 100, not IT 1040.

packetRules:
  packetBehavior: "reference-summary-pdf"
  includeWhen:
    - "Total Ohio withholding is greater than zero"
  suppressWhen:
    - "Total Ohio withholding is zero"
  notes: |
    The packet generator should emit an Ohio Schedule of Withholding
    reference-summary page only when Ohio withholding exists. Blank withholding
    support pages should be suppressed.

businessRuleValidation:
  - rule: "actual-oid-withholding"
    description: |
      Sum actual 1099-OID Box14 rows only when Box12 is OH; retain exact cents.
      Reject negative/nonfinite amounts, duplicate states in one statement,
      or more than two state rows. Explicit zero remains zero. These are
      internal audit rows, not official printed form line numbers.
    testRef: "tests/engine/state/oh-oid-sources.test.ts::Ohio OID withholding rejects invalid source rows and preserves exact amounts"
  - rule: "reference-summary-packet"
    description: "Inventory support counts this schedule as business-rule validated only when regression coverage proves the Ohio Schedule of Withholding reference summary is emitted when Ohio withholding exists and stays suppressed when the total withholding is zero."
    testRef: "tests/pdf/fill-oh-reference-forms.test.ts::fillOhioReferenceForms includes the Ohio Schedule of Withholding reference summary only when Ohio withholding exists"

lines:
  - line: "actual-jurisdiction"
    description: "Require actual jurisdiction for nonzero withholding and validate source money"
    formula: "Every supplied amount must be finite and nonnegative. Nonzero W2/W2G/1099 withholding requires an actual two-letter source state; unknown state cannot silently become zero Ohio credit. Confirmed other-state amounts are excluded; explicit zero needs no invented state."
    testRef: "tests/engine/state/oh-withholding-source-facts.test.ts::requires actual state for every nonzero source and preserves explicit zero"
    notes: "Ohio2025 IT1040 instructions line14 and withholding schedules pages17,47-48; refreshed2026-10-25. This source gate does not qualify a final2026 form."
  - line: "1"
    description: "Ohio withholding from W-2 statements"
    formula: "Sum W-2 box 17 amounts where W-2 state = 'OH' (case-insensitive)"
    inputs:
      - "W-2 state code"
      - "W-2 box 17 state income tax withheld"
    notes: |
      The 2025 booklet's sample W-2 states that only Ohio amounts from boxes
      16 and 17 belong on the Schedule of Ohio Withholding.
    testRef: "tests/engine/state/oh-schedule-of-withholding.test.ts::Ohio Schedule of Withholding Line 1 - W-2 Ohio withholding"

  - line: "2"
    description: "Ohio withholding from W-2G statements"
    formula: "Sum W-2G box 15 amounts where W-2G state = 'OH' (case-insensitive)"
    inputs:
      - "W-2G state code"
      - "W-2G box 15 state income tax withheld"
    notes: |
      The 2025 booklet's sample W-2G states that only Ohio amounts from box 15
      belong on the Schedule of Ohio Withholding.
    testRef: "tests/engine/state/oh-schedule-of-withholding.test.ts::Ohio Schedule of Withholding Line 2 - W-2G Ohio withholding"

  - line: "3"
    description: "Ohio withholding from 1099-G statements"
    formula: "Sum 1099-G box 11 amounts where 1099-G state = 'OH' (case-insensitive)"
    inputs:
      - "1099-G state code"
      - "1099-G box 11 state income tax withheld"
    notes: |
      The engine accepts 1099-G box 11 state withholding because the Ohio
      input schema models it and Ohio line 14 generally accepts Ohio amounts
      from 1099 income statements.
    testRef: "tests/engine/state/oh-schedule-of-withholding.test.ts::Ohio Schedule of Withholding Line 3 - 1099-G Ohio withholding"

  - line: "4"
    description: "Ohio withholding from 1099-K statements"
    formula: "Sum 1099-K box 8 amounts where 1099-K state = 'OH' (case-insensitive)"
    inputs:
      - "1099-K state code"
      - "1099-K box 8 state income tax withheld"
    notes: |
      The engine accepts 1099-K box 8 state withholding because the Ohio input
      schema models it and Ohio line 14 generally accepts Ohio amounts from
      1099 income statements.
    testRef: "tests/engine/state/oh-schedule-of-withholding.test.ts::Ohio Schedule of Withholding Line 4 - 1099-K Ohio withholding"

  - line: "5"
    description: "Ohio withholding from 1099-R statements"
    formula: "Sum 1099-R box 14 amounts where 1099-R state = 'OH' (case-insensitive)"
    inputs:
      - "1099-R state code"
      - "1099-R box 14 state income tax withheld"
    notes: |
      The 2025 booklet's sample 1099-R states that only Ohio amounts from box
      14 belong on the Schedule of Ohio Withholding.
    testRef: "tests/engine/state/oh-schedule-of-withholding.test.ts::Ohio Schedule of Withholding Line 5 - 1099-R Ohio withholding"

  - line: "5a"
    description: "Ohio withholding from 1099-NEC statements"
    formula: "Sum 1099-NEC box 5 amounts where 1099-NEC state = 'OH' (case-insensitive)"
    inputs:
      - "1099-NEC state code"
      - "1099-NEC box 5 state income tax withheld"
    notes: |
      Ohio line 14 generally accepts Ohio amounts from 1099 income statements.
      The IRS 2025 Instructions for Forms 1099-MISC and 1099-NEC describe box
      5 as the state tax withheld field and box 6 as the state identifier for
      Form 1099-NEC.
    testRef: "tests/engine/state/oh-schedule-of-withholding.test.ts::Ohio Schedule of Withholding Line 5a - 1099-NEC Ohio withholding"

  - line: "5b"
    description: "Ohio withholding from 1099-MISC statements"
    formula: "Sum 1099-MISC box 16 amounts where 1099-MISC state = 'OH' (case-insensitive)"
    inputs:
      - "1099-MISC state code"
      - "1099-MISC box 16 state income tax withheld"
    notes: |
      Ohio line 14 generally accepts Ohio amounts from 1099 income statements.
      The IRS 2025 Instructions for Forms 1099-MISC and 1099-NEC describe box
      16 as the state tax withheld field and box 17 as the state identifier for
      Form 1099-MISC.
    testRef: "tests/engine/state/oh-schedule-of-withholding.test.ts::Ohio Schedule of Withholding Line 5b - 1099-MISC Ohio withholding"

  - line: "5c"
    description: "Ohio withholding from 1099-INT statements"
    formula: "Sum actual 1099-INT box 17 where state box 15 = OH (case-insensitive)"
    testRef: "tests/engine/state/oh-investment-withholding.test.ts::Ohio includes only actual Ohio investment withholding in its audit and total"

  - line: "5d"
    description: "Ohio withholding from 1099-DIV statements"
    formula: "Sum actual 1099-DIV box 16 where state box 14 = OH (case-insensitive)"
    testRef: "tests/engine/state/oh-investment-withholding.test.ts::Ohio includes only actual Ohio investment withholding in its audit and total"

  - line: "5e"
    description: "Ohio withholding from 1099-B statements"
    formula: "Sum actual 1099-B box 16 where state box 14 = OH (case-insensitive)"
    testRef: "tests/engine/state/oh-investment-withholding.test.ts::Ohio includes only actual Ohio investment withholding in its audit and total"

  - line: "6"
    description: "Total Ohio withholding for IT 1040 line 14"
    formula: "Line 1 + Line 2 + Line 3 + Line 4 + Line 5 + Line 5a + Line 5b + Line 5c + Line 5d + Line 5e"
    inputs:
      - "Ohio withholding from supported income statements"
    edgeCases:
      - "Statements for non-Ohio states are excluded"
      - "Statements with no state code are excluded"
      - "Lowercase 'oh' state codes are treated as Ohio"
      - "Ohio withholding on 1099-NEC and 1099-MISC statements is included when the modeled state code is Ohio"
      - "Zero withholding across all statements produces $0"
    testRef: "tests/engine/state/oh-schedule-of-withholding.test.ts::Ohio Schedule of Withholding Line 6 - total Ohio withholding combines supported statements"
