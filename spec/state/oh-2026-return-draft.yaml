notes: |
  Sources refreshed 2026-11-05; implementation remains a labeled internal draft.
  This is a minimum first complete arithmetic/source cohort, not the entire
  remaining Ohio scope. All other factual branches stay unsupported, not zero.
  Explicit 2026 draft entry point in oh-engine.ts calls the source and return methods;
  it cannot remain a test-only scalar composition. No full federal result is
  fabricated. Historical public paths remain unchanged until separately reviewed.
  Require source-complete ordinary employee originals, actual owner/date/allocation
  evidence, known-zero state adjustments/business/A34/A35/other credits, actual
  no-taxing-school-district evidence, current filing-status and exemption facts,
  no actual EITC qualifying children and AGI above the indexed zero-child phaseout, otherwise unsupported, and exact
  actual payments. Scalar caller assertions cannot become source qualification.
  This finite domestic cohort requires actual recognized US state/DC service and
  domicile codes and distinct primary/spouse taxpayer identities. Unknown codes
  or duplicate persons cannot qualify by supplying internally consistent totals.
  Calculation status remains incomplete, filingQualified=false, review pending;
  final2026 form identities/numbering and professional review are separate gates.
lines:
  - line: "part-year-bank-interest"
    description: "Private 2026 ordinary employee draft for one nonbusiness deposit account and actual part-year bank interest"
    formula: >-
      Admit a single primary cash-method part-year Ohio resident under 65 who
      meets the ordinary employee, actual domicile, credits, school and
      withholding-only gates. Require one complete current uncorrected nonvoid
      Form 1099-INT with positive Box 1 interest from an ordinary U.S. bank deposit,
      matched taxpayer, payer and stable account reference. Require dated, complete
      and distinct original bank credits, actually or constructively received on
      the stated dates without other timing or basis adjustments. Each positive
      credit belongs to its actual domicile period. Bind every unchanged original
      and sum exact credits to Box 1 before rounding. Ohio AGI and federal AGI
      include gross wages and all Box 1 interest. Under RC 5747.20(A), (B)(6)
      and (C), only interest received during Ohio domicile enters IT NRC Part B.
      Apply the existing four-place truncated nonresident ratio and whole-dollar
      credit under RC 5747.05(A). No current ordinary paper export, public routing,
      final-form or filing qualification follows from this private calculation.
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.20"
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.05"
      - "https://www.irs.gov/publications/p550"
    testRef: "tests/engine/state/oh-2026-bank-interest-draft.test.ts::allocates actual bank credits on both sides of the Ohio move"
  - line: "full-year-bank-interest"
    description: "Private 2026 full-year Ohio resident ordinary employee draft for one nonbusiness deposit account"
    formula: >-
      Require the full-year bank-interest method ID, a single primary ordinary
      employee under 65 with complete actual W-2 originals, and confirmed Ohio
      domicile timeline covering the year. Apply the same matched current Form
      1099-INT, exact Box 1 and available dated credit reconciliation, and
      ordinary withholding-only gates as the part-year bank-interest method.
      Include all Box 1 interest with wages in both federal and Ohio AGI,
      rounding the combined amounts once. Allocate all interest to Ohio under
      RC 5747.20(A). A full-year Ohio resident has zero nonresident ratio and
      credit, and the return draft omits the nonresident worksheet. Ohio's
      draft 2026 instructions, printed pages 41–42, describe the applicability
      and interest allocation. Final publication remains a separate gate.
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.20"
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.05"
      - "https://www.irs.gov/publications/p550"
      - "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/DRAFTS/2026/it1040-booklet-draft.pdf"
    testRef: "tests/engine/state/oh-2026-bank-interest-draft.test.ts::includes all bank interest for a full-year Ohio resident"
  - line: "nonresident-bank-interest"
    description: "Private 2026 Ohio nonresident ordinary employee draft for one nonbusiness deposit account"
    formula: >-
      Require the nonresident bank-interest method ID, a single primary ordinary
      employee under 65 with complete actual W-2 originals, and confirmed non-Ohio
      domicile timeline covering the year. Apply the same matched current Form
      1099-INT, exact Box 1 and available dated credit reconciliation, and
      ordinary withholding-only gates as the part-year bank-interest method.
      Include all Box 1 interest with wages in both federal and Ohio AGI.
      Under RC 5747.20(B)(6), allocate zero bank interest to Ohio regardless of
      payer or wage service location. Include actual Ohio-source compensation
      in IT NRC Part A. Ohio's draft 2026 instructions, printed pages 41–42,
      limit Part B to part-year residents. Omit Part B worksheet lines 10–15
      from this nonresident draft and trace the verified zero Ohio interest in
      a separate draft audit entry. Apply the four-place truncated ratio of
      non-Ohio income to Ohio AGI and whole-dollar credit under RC 5747.05(A).
      For the existing part-year method, RC 5747.05(C) applies the credit to
      the nonresident allocation without any duplicate resident credit on the
      same income. Final publication remains a separate gate.
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.20"
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.05"
      - "https://www.irs.gov/publications/p550"
      - "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/DRAFTS/2026/it1040-booklet-draft.pdf"
      - "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/itnrc.pdf"
    testRef: "tests/engine/state/oh-2026-bank-interest-draft.test.ts::credits all bank interest away from Ohio for a full-year nonresident"
  - line: "bank-interest-method-residency"
    description: "Bind each private bank-interest method to verified domicile and current source evidence"
    formula: >-
      Select the full-year, part-year or nonresident bank validation only when
      the private packet's explicit method ID agrees with its documented owner
      status. Hold a missing, overlapping or contradictory domicile timeline,
      missing or unavailable credit, or a source snapshot changed after binding.
      Explicitly reconcile the federal, Ohio-resident and Ohio-source
      nonresident category amounts against actual originals across all methods.
      Keep the saved part-year ID and its existing direct and dispatcher calls.
    testRef: "tests/engine/state/oh-2026-bank-interest-draft.test.ts::holds mismatched bank method and primary domicile (%s)"
    testRefs:
      - "tests/engine/state/oh-2026-bank-interest-draft.test.ts::holds unknown or contradictory evidence across the added residency methods (%s)"
      - "tests/engine/state/oh-2026-bank-interest-draft.test.ts::reconciles multiple current W-2 originals for one full-year resident"
  - line: "part-year-bank-interest-dispatch"
    description: "Dispatch a complete bank-interest packet through the private Ohio source-to-return entry"
    formula: >-
      Select the dedicated bank-interest validation and calculation when the
      private source packet specifies its method ID. Require the same documentary
      proof and return the same draft as direct invocation. A bank original on
      a wage-only packet still requires its separate method. Package exports,
      public readiness, ordinary paper output and the distinct Treasury coupon
      method retain their existing boundaries.
    testRef: "tests/engine/state/oh-2026-bank-interest-draft.test.ts::dispatches complete reopened bank evidence through the private Ohio entry"
    testRefs:
      - "tests/engine/state/oh-2026-bank-interest-draft.test.ts::holds incomplete bank evidence through the private Ohio entry"
  - line: "part-year-bank-interest-source-holds"
    description: "Hold unknown, unmatched or contradictory bank records and allocations"
    formula: >-
      Require current original and bank records for exactly one account, explicit
      knowledge of other original boxes, and known absence of other income,
      withholding, adjustments, an alternate interest method, or orphaned
      unemployment payment sources. Reject duplicate source records, missing or
      masked account identity, different institutions, recipients or years,
      zero/unknown or invalid amounts and dates, and any resident or nonresident
      amount that differs from the allocation derived from the original bank
      credits and actual domicile. The existing wage-only draft retains its
      separate admission and the current public gates stay closed.
      For every Box 1 bank-interest residency method and the combined dividend
      method, require recorded Decimal zeros for Boxes 2, 3, 4, 6, 8, 9 and 17
      in the bound original packet and in the return's Box 1 statement. A
      physically blank original box may be recorded as zero when its absence
      of reporting is confirmed. Generic form defaults cannot supply original
      amounts. A previously saved packet without these recorded original
      amounts stays on hold until confirmed. Pennsylvania-only direct-obligation
      metadata remains optional and must equal zero when present.
    sources:
      - "https://www.irs.gov/instructions/i1099int"
      - "https://www.irs.gov/pub/irs-pdf/f1099int.pdf"
    testRef: "tests/engine/state/oh-2026-bank-interest-draft.test.ts::holds incomplete contradictory or unsupported bank evidence (%s)"
    testRefs:
      - "tests/engine/state/oh-2026-bank-interest-draft.test.ts::keeps bank originals out of the wage-only method"
      - "tests/engine/state/oh-2026-bank-interest-draft.test.ts::holds a missing documented zero in %s"
      - "tests/engine/state/oh-2026-bank-interest-draft.test.ts::holds normalized return defaults without recorded amounts on the original"
      - "tests/engine/state/oh-2026-bank-interest-draft.test.ts::holds a zero return amount contradicted by a recorded original box"
      - "tests/engine/state/oh-2026-bank-interest-draft.test.ts::holds an unrecorded state withholding box for %s"
      - "tests/engine/state/oh-2026-bank-interest-draft.test.ts::accepts recorded zero for documented blank boxes without PA-only metadata"
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::holds combined investments with an unknown original bank reporting box"
  - line: "ordinary-cash-dividend"
    description: "Private 2026 Ohio ordinary cash dividend draft for each verified residency status"
    formula: >-
      Bind each residency method to the single primary ordinary employee under
      65, existing W-2, domicile, withholding-only and other verified ordinary
      source gates, and one current uncorrected nonvoid Form 1099-DIV. Require
      matched payer name and TIN, primary recipient identity, a confirmed
      complete literal account reference and actual original facts for a directly held
      domestic corporation's ordinary taxable cash distributions. Repeating a
      masked token or suffix on matching documents cannot prove the full account.
      Classify abbreviation patterns after compatibility normalization, including
      separated X groups and fullwidth masks. Match originals by their literal
      references and preserve ordinary embedded X characters. Require
      positive Box 1a and no qualified-dividend subset, other reportable amounts,
      withholding, nominee, reinvestment or alternative timing or sourcing
      facts. Require distinct original account receipts with actual dates of
      payment or availability in 2026 and independently confirm domicile when
      each credit was available, including any move-date payment. Reconcile
      their exact sum to Box 1a and the source categories before rounding.
      Federal and Ohio AGI include all Box 1a cash dividends. Under RC 5747.20(A), (B)(6) and (C), all
      dividends are Ohio income for residents, none for nonresidents, and only
      those received on dates of Ohio domicile for part-year residents. Use
      the existing NRC allocation and credit under RC 5747.05(A) and (C), with
      no NRC for a resident or Part B for a full-year nonresident. Keep missing,
      contradicted or stale originals held and preserve all review, form,
      public and filing gates.
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.20"
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.05"
      - "https://www.irs.gov/instructions/i1099div"
      - "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/DRAFTS/2026/it1040-booklet-draft.pdf"
    testRef: "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::allocates verified ordinary cash dividends for %s"
    testRefs:
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::reconciles exact cents before rounding combined wages and dividends"
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::holds unsupported or contradictory cash dividend facts (%s)"
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::holds repeated masked references on matched dividend originals (%s)"
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::accepts matching literal account references containing X characters (%s)"
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::holds alternate cash dividend masks across residency statuses (%s)"
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::still matches nonmasked dividend references literally"
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::holds changed originals without rebinding and keeps the wage method separate"
  - line: "part-year-ordinary-interest-and-dividends"
    description: "Private 2026 Ohio ordinary employee draft with both original Form 1099-INT and Form 1099-DIV"
    formula: >-
      For one single primary part-year Ohio employee under 65, require the
      same complete residency, payroll, withholding, and other confirmations
      as the independent bank and cash-dividend methods. Independently bind
      and reconcile each admitted current original and its exact dated
      receipts under the existing Box 1 and Box 1a rules. Federal and Ohio
      AGI include gross wages plus both annual totals, rounded once. Sum
      only the two investment amounts received during confirmed Ohio
      domicile for IT NRC Part B line 10. Apply the current credit calculation
      and require withholding to cover the resulting tax. Reject missing or
      mismatched source evidence and declarations outside the part-year
      method. Keep the draft private, incomplete and filing-ineligible.
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.20"
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.05"
      - "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/DRAFTS/2026/it1040-booklet-draft.pdf"
    testRef: "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::combines independently matched bank interest and cash dividends on the part-year Ohio draft"
    testRefs:
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::rounds the combined Ohio investment totals only after adding both originals"
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::holds the combined investment method if the %s original does not reconcile"
      - "tests/engine/state/oh-2026-cash-dividend-draft.test.ts::holds the combined investment method outside part-year residency"
  - line: "direct-treasury-coupon"
    description: "Private 2026 ordinary employee draft for one directly held conventional Treasury note or bond coupon"
    formula: "Admit a single primary full-year Ohio resident under 65 who meets existing ordinary original, credit, school and withholding-only gates. Require an explicit private Treasury coupon packet with the actual current, complete, uncorrected nonvoid Form 1099-INT, matched owner, custodian name and TIN, account and year, and a distinct original coupon receipt linked by account and CUSIP to the documented direct U.S. Treasury note or bond. Verify the calendar 2026 coupon date and full positive cash amount against Box 3; Box 3 alone is insufficient. Exclude bills, savings bonds, Treasury funds, indirect holdings, and any premium, accrued interest, discount, basis, election, withholding or other reporting that changes the simple coupon treatment. Reconcile all federal and resident source categories against originals. Federal AGI is rounded ordinary wages plus actual coupon combined before rounding. Deduct the exact federally taxable and Ohio-exempt coupon once under RC5747.01(A)(3) and 31 USC3124(a); Ohio AGI is the remaining ordinary wages rounded at the end. No NRC applies to this full-year household. Keep independent review, final state forms, public routing and filing closed."
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.01"
      - "https://uscode.house.gov/us/usc/t31/s3124/"
      - "https://www.irs.gov/instructions/i1099int"
      - "https://www.irs.gov/publications/p550"
    testRef: "tests/engine/state/oh-2026-treasury-coupon-draft.test.ts::deducts only the matched direct Treasury coupon included in federal AGI"
  - line: "direct-treasury-coupon-source-holds"
    description: "Hold incomplete, contradictory and uncommon Treasury coupon originals"
    formula: "The separate method retains and binds unchanged canonical federal income, Ohio residency and payment originals with the documentary 1099-INT and security/receipt proof. Hold missing or mismatched recipient, account, custodian, security, date, amount, year, classifications and unsupported sources. A retained Ohio unemployment payment or payment schedule is incompatible with the wages-and-coupon method even if the canonical Form 1099-G is missing. Preserve ordinary wage-only and historical calculation behavior."
    testRef: "tests/engine/state/oh-2026-treasury-coupon-draft.test.ts::requires separate documentary evidence and leaves ordinary and historical routes unchanged"
  - line: "direct-treasury-coupon-box-evidence"
    description: "Require documented zeros for the other supported reporting boxes on the original Treasury statement"
    formula: >-
      Require recorded Decimal zeros for Boxes 1, 2, 4, 6, 8, 9 and 17 in
      the bound original Treasury packet and in the retained Form 1099-INT.
      A verified blank may be recorded as zero. Canonical form defaults
      are insufficient evidence, so an older packet missing the original
      amounts stays on hold until confirmed. The Ohio exemption remains
      limited to the separately verified Box 3 coupon. Optional
      Pennsylvania direct-obligation metadata must be zero if present.
    sources:
      - "https://www.irs.gov/instructions/i1099int"
      - "https://www.irs.gov/pub/irs-pdf/f1099int.pdf"
    testRef: "tests/engine/state/oh-2026-treasury-coupon-draft.test.ts::holds normalized zeros without recorded Treasury original amounts"
    testRefs:
      - "tests/engine/state/oh-2026-treasury-coupon-draft.test.ts::holds an omitted Treasury reporting amount in %s"
      - "tests/engine/state/oh-2026-treasury-coupon-draft.test.ts::holds a zero contradicted by a recorded Treasury original box"
      - "tests/engine/state/oh-2026-treasury-coupon-draft.test.ts::accepts explicitly confirmed blank Treasury boxes"
  - line: "direct-treasury-coupon-account-identity"
    description: "Bind the Treasury coupon to a stable account reference"
    formula: >-
      A visible account mask, including after a hyphenated label, an explicit
      account-ending label, or a bare number of at most four digits is
      incomplete evidence even if all saved originals display the same suffix.
      Hold the packet for reconciliation. Accept a stable local reference used
      on all of the originals without requiring the taxpayer's full account number.
    testRef: "tests/engine/state/oh-2026-treasury-coupon-draft.test.ts::holds a repeated masked or suffix-only account reference after reopening (%s)"
    testRefs:
      - "tests/engine/state/oh-2026-treasury-coupon-draft.test.ts::accepts an opaque local account identifier with an embedded suffix"
  - line: "ordinary-unemployment-source"
    description: "Private 2026 ordinary employee draft for a single taxpayer with one actual Box 1 unemployment original"
    formula: >-
      Require a recipient-bound, current uncorrected nonvoid original Form 1099-G
      (Rev. December 2026) for ordinary noncontributory state unemployment insurance.
      Verify every original box, known-zero non-Box-1 income and adjustments, no
      repayments or unrecovered contributions, and the original state
      withholding treatment. Require a complete original-bound list of
      actual dates and positive whole-dollar amounts paid or accrued in calendar
      2026. Require one primary owner, the existing ordinary W2 source admission,
      and a complete domicile timeline. Each unique receipt counts at its actual
      paid-or-accrued date. Its exact total with the other receipts must match Box 1.
      Federal and Ohio AGI are ordinary wages plus gross Box 1, without reducing
      gross income by federal withholding. Allocate all qualifying receipts to
      Ohio for a documented full-year Ohio resident, who has no nonresident
      credit. For a part-year resident or nonresident, the Ohio resident amount
      is the sum of receipts during Ohio domicile, regardless of the payer's
      location. Reconcile the assigned amounts with the complete owner categories
      before deriving the NRC credit and withholding-only settlement. Hold missing
      or contradictory originals, unsupported income, deductions, specialized
      benefits, and unsupported residency or credit facts. Filing qualification
      stays false and final annual form/PDF support remains outside this method.
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.01"
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.20"
      - "https://tax.ohio.gov/help-center/faqs/income-allocation-of-compensation-wages-stock-options-etc/income-allocation-of-compensation"
      - "https://www.irs.gov/instructions/i1099g"
    testRef: "tests/engine/state/oh-2026-unemployment-draft.test.ts::assigns gross Box 1 to Ohio only when domiciled there on the receipt date"
    testRefs:
      - "tests/engine/state/oh-2026-unemployment-draft.test.ts::includes all verified Box 1 unemployment for a full-year Ohio resident"
      - "tests/engine/state/oh-2026-unemployment-draft.test.ts::holds contradicted full-year unemployment allocations and incomplete original receipts"
  - line: "unemployment-draft-dispatch"
    description: "Dispatch the verified unemployment cohort through the private Ohio source-to-return entry"
    formula: >-
      Use the dedicated unemployment method only when the source packet
      names its exact method ID. Require the same evidence and opaque source
      validation as the direct calculation for full-year, part-year and
      nonresident returns. Treat optional undefined canonical Form 1099-G
      properties as absent so live and saved originals receive the same
      strict validation. Retain and review supplied unsupported fields.
      Keep missing or wrong method IDs outside this calculation, and retain
      the existing state review, release and filing gates.
    testRef: "tests/engine/state/oh-2026-unemployment-draft.test.ts::dispatches the private unemployment packet for %s"
    testRefs:
      - "tests/engine/state/oh-2026-unemployment-draft.test.ts::replays live and reopened canonical unemployment originals with %s"
      - "tests/engine/state/oh-2026-unemployment-draft.test.ts::keeps joint owners and the existing wage-only entry point outside the method"
  - line: "ordinary-unemployment-ohio-withholding"
    description: "Credit verified Ohio unemployment withholding in the 2026 ordinary draft"
    formula: >-
      Use the existing confirmed absence of state withholding or require one
      confirmed Ohio withholding row from the same current Form 1099-G. Match
      Boxes 11a and 11b to Ohio and the actual payer state identifier, and
      match the positive Box 12 amount exactly to the confirmed original.
      Hold incomplete evidence, inconsistent amounts, multiple or non-Ohio
      rows, and withholding greater than the original gross compensation.
      Sum actual Ohio wage and unemployment withholding in Decimal and round
      the combined annual amount once. Residency and receipt dates determine
      the unemployment allocation, while the full actual Ohio withholding
      enters settlement for each supported residency. The covered draft reports
      no underpayment when the annual withholding covers the current liability
      and records that basis without inferring the actual quarterly timing.
      This is a private review draft.
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.065"
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.09/9-30-2025"
      - "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/DRAFTS/2026/it1040-booklet-draft.pdf#page=21"
      - "https://www.irs.gov/instructions/i1099g"
    testRef: "tests/engine/state/oh-2026-unemployment-draft.test.ts::includes original Ohio unemployment withholding for %s"
    testRefs:
      - "tests/engine/state/oh-2026-unemployment-draft.test.ts::holds unbound Ohio unemployment withholding for %s"
      - "tests/engine/state/oh-2026-unemployment-draft.test.ts::uses Ohio unemployment withholding to cover the remaining annual liability"
  - line: "w2-code-q-admission"
    description: "Require the separate state military compensation method when combat pay is reported"
    formula: "Positive actual W2 Box 12 Code Q identifies nontaxable combat pay from a military employer and contradicts the finite ordinary employee admission. Reject even with matching originals and no retained duty classification. Code Q alone establishes neither duty location nor the treatment of Box 1 or 16. Preserve historical absent Code Q and confirmed zero when all other ordinary facts qualify. Sources verified 2026-11-13: https://www.irs.gov/instructions/iw2w3 and https://tax.ohio.gov/individual/military."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::routes reported combat pay to a separate method for each Ohio residency"
  - line: "source-admission"
    description: "Bind a current ordinary employee packet to all current originals"
    formula: "Require taxYear2026, actual filing/owner identities, all-original-source-family inventory (reject unknown/unhandled even if zero), W2 source validation, complete Ohio residency periods/categories, exact original snapshot and source commitments. Derive wages/withholding from actual W2 rows once; state wages are not a substitute for services allocation. Require all unknown adjustment/credit/payment facts, never optional defaults."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::rejects unknown changed or unsupported actual original sources: %s"
  - line: "primary-residency-declaration"
    description: "Reconcile the 2026 primary taxpayer's Ohio declaration with the confirmed Ohio domicile record"
    formula: |
      In the selected Ohio guide and private ordinary wage-only, Box 1
      unemployment, and Virginia resident-credit employee drafts, reconcile
      any explicit 2026 primary declaration with the same owner's source status
      after validating the domicile timeline. The Virginia resident-credit
      cohort requires actual full-year Ohio domicile. An explicit part-year or
      nonresident Ohio declaration holds that draft for reconciliation. Reject
      a conflict for any of the three statuses during confirmation and replay.
      In the 2026 guide, display
      a review alert and withhold current confirmation for a conflicting
      declaration, absent or mismatched return year, or stale retained originals.
      Keep prior confirmation as historical evidence and require an explicit
      new confirmation when the corrected facts differ from that evidence.
      A missing declaration adds
      no status and leaves qualification to the actual owner evidence. Evaluate
      a joint filer's spouse independently using that spouse's own domicile
      period and source status. This 2026 check does not change historical rules,
      apply a statement from a different selected state, or qualify final forms
      or filing.
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.01"
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.05"
      - "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf"
    testRef: "tests/guided-interview/guided-ohio-residency.test.ts::rejects a 2026 primary Ohio residency conflict at confirmation and after reopening %s"
    testRefs:
      - "tests/guided-interview/guided-ohio-residency.test.ts::matches only the primary Ohio declaration on a mixed-residency joint return"
      - "tests/engine/state/oh-2026-return-draft.test.ts::reconciles the primary declaration against the ordinary Ohio draft for %s"
      - "tests/engine/state/oh-2026-return-draft.test.ts::permits a separate spouse domicile on the ordinary Ohio joint draft"
      - "tests/engine/state/oh-2026-unemployment-draft.test.ts::reconciles the primary declaration against the ordinary Ohio unemployment draft for %s"
      - "tests/engine/state/oh-2026-resident-credit-draft.test.ts::rejects a conflicting Ohio declaration on the Virginia resident-credit draft: %s"
      - "tests/engine/state/oh-2026-resident-credit-draft.test.ts::preserves the recorded Ohio domicile with a matching or omitted declaration"
      - "tests/apps/web/ohio-residency-interactions.test.tsx::shows a retained Ohio residency conflict until the current declaration is reconciled and reconfirmed"
  - line: "AGI"
    description: "Ordinary employee federal and Ohio AGI"
    formula: "For the source-complete ordinary W2-only cohort, federalAGI=sum actual federal W2 wages, with no other federal income or adjustment admitted; OhioAGI=federalAGI because every state adjustment is explicitly source-qualified zero. Other federal components require completed current computation or a separate explicit draft method. No forged TaxReturnResult or 2025 constants."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::derives current ordinary wage AGI without a fabricated federal return"
  - line: "canonical empty source collections"
    description: "Accept the parsed federal contract while retaining original-source proof"
    formula: "Canonical default empty document arrays do not establish additional originals. Admit only the explicit federal document collection keys when their arrays are empty. Keep every retained document and every unsupported source object in scope for rejection even when its monetary fields are zero. Require the exact original snapshot after canonicalization."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::accepts the canonical federal input for %s without admitting a retained zero original"
  - line: "rate-and-exemption"
    description: "Consume the corrected 2026 baseline"
    formula: "Use corrected actual MAGI and completed eligible-person count; use separate business/nonbusiness bases and unchanged explicit Decimal rounding. Compute preceding senior and personal-exemption credits before the joint credit."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::integrates enacted tax and explicit exemptions across all three residencies: %s"
  - line: "senior-credit-originals"
    description: "Qualify complete prior lump-sum credit history for withholding-only ordinary and earned-school drafts"
    formula: "For ordinary withholding-only or single full-year earned-school withholding-only returns with an owner born on or before 1961-12-31, require one private reference per current owner, the same owner role and birth date as the bound current originals, and confirmed complete history without a prior Ohio senior lump-sum election or retirement-credit carryforward. Missing, duplicate, extra, mismatched or inconclusive records, an actual election/carry, and packets for other methods reject. Hold 1962-01-01 births pending confirmation of Ohio age attainment for that date. A later date continues the existing under-65 admission. Authority refreshed 2026-11-13: RC5747.055(C)-(G) and the Ohio Schedule of Credits instructions."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::requires complete owner-bound Ohio senior credit history"
  - line: "senior-credit"
    description: "Apply one nonrefundable senior citizen credit before later credits"
    formula: "When the admitted single or joint return has at least one eligible owner, take min(50, tax before credits) if actual MAGI less exemptions is strictly below 100000; otherwise zero. Apply personal credit to the remaining tax, then joint credit, actual zero EITC and actual IT NRC allocation where applicable. Use one $50 credit on a joint return regardless of how many eligible owners it has. Authority RC5747.055(F) and RC5747.98(A),(B). Keep final state form and filing qualification closed."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::applies the Ohio senior credit before residency relief for %s"
  - line: "senior-credit-limits"
    description: "Enforce remaining tax, income ceiling and joint return treatment"
    formula: "Use exact whole-dollar MAGI and exemption bases, cap nonrefundable credit at available tax, and use remaining tax for the joint percentage."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::uses one senior credit, available tax and the strict Ohio income limit"
  - line: "credit-order"
    description: "Apply senior, personal, joint, EITC, then NRC in statutory order"
    formula: "For the initial single/MFJ household with no dependents and each owner not claimable elsewhere, eligibleCount is actual owner count. Personal=min(tax after senior credit,20*eligibleCount) only if MAGI-exemptions<30000. Joint applies to remaining tax at actual owner qualifying-income tiers/cap. EITC0 is derived only from complete known no-qualifying-child sources and actual AGI at or above19540(single)/26820(MFJ), Rev.Proc.2025-32. Other EITC cases reject. Every other preceding or intervening credit must be source-qualified absent, otherwise reject until separate computation. Then apply actual NRC and finally actual resident-credit method when supported, never double use income."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::retains credit order caps and strict personal-credit boundary"
  - line: "residency"
    description: "Full-year, part-year, and nonresident actual-source computation"
    formula: "Reuse actual owner timeline/category validation and ITNRC allocation with 2026 source-contract evidence. Full-year source totals include all income; PY uses actual resident/nonresident services periods, not calendar ratio. Nonresident services are Ohio only when actually sourced here. Use min(1,truncate4(outsideOhioAGI/OhioAGI)); multiply tax after every preceding credit and roundDollar once. Reciprocal compensation requires separate current agreement/source method and cannot be treated as ordinary taxable OH wages."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::uses actual services amounts rather than residency day counts"
  - line: "nrc-worksheet-applicability"
    description: "Expose the draft IT NRC only for a household with a nonresident period"
    formula: >-
      Omit all IT NRC audit rows when every verified owner is a full-year Ohio
      resident, including ordinary single and joint returns, resident unemployment,
      timely balance payments and paid resident-credit drafts. Retain the full-year
      income, zero nonresident ratio and credit, resident-credit audit and settlement.
      A return with any part-year owner shows Parts A, B and C. All-nonresident
      returns and the admitted wage-only joint return with one full-year resident
      and one full-year nonresident show only Parts A and C. Include the full-year
      resident spouse's compensation in Part A. Keep the existing source validation,
      credit order, payment qualification and closed filing gates.
    sources:
      - "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/DRAFTS/2026/it1040-booklet-draft.pdf#page=41"
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::integrates enacted tax and explicit exemptions across all three residencies: %s"
    testRefs:
      - "tests/engine/state/oh-2026-return-draft.test.ts::retains credit order caps and strict personal-credit boundary"
      - "tests/engine/state/oh-2026-return-draft.test.ts::permits a separate spouse domicile on the ordinary Ohio joint draft"
      - "tests/engine/state/oh-2026-unemployment-draft.test.ts::includes all verified Box 1 unemployment for a full-year Ohio resident"
      - "tests/engine/state/oh-2026-actual-balance-payment.test.ts::reports source-qualified return and paid account separately for %s"
      - "tests/engine/state/oh-2026-resident-credit-draft.test.ts::applies independent literal2026 paid-credit and settlement accounts %s"
  - line: "settlement"
    description: "Finish known ordinary settlement without fabricating penalties"
    formula: "Only admit source-complete calendar original returns with known timely-payment/filing facts. A documented timely filing remains timely if observed after the deadline. The filing must be known by observation, or, if still expected, on or after observation and no later than the deadline. Initial employee cohort uses actual Ohio compensation withholding at least current tax, no school tax, no other payments/refundable credits/use tax/amendment/carryforward/donations. Section5747.09 withholding is equal across installment dates absent actual-date election, covering required current installments; penalty0. Unknown dates/election or other payment methods require a separate current method. Refund=withheld-tax; no late interest if no unpaid tax, otherwise dated method required."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::settles only complete current withholding-covered returns"
  - line: "closed-gates"
    description: "Preserve all qualification boundaries"
    formula: "Return labeled draft taxYear2026 with independent current provenance, incomplete calculation and review status, filingQualified=false, no official2026 form/export qualification. Preserve historical numeric outputs and public unknown/unsupported gates; full selected-state completion stays false until remaining factual branches, human review, forms and operational evidence pass."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::keeps filing and historical gates intact"
  - line: "pa-reciprocal-current-sources"
    description: "Separately qualify actual2026 full-year Pennsylvania employee originals"
    formula: "Require an explicit oh-2026-pa-reciprocal-employee-draft-v1 packet, current original taxpayer/W2/domicile/employer/service/payroll evidence, single primary full-year PA nonresident, one ordinary C-corporation employer and all wages for actual OH employee services. Reconcile complete unique current-year service/pay dates, W2 cash and actual OH withholding. Current reciprocal originals in residency and source packet must match exactly and bind every unchanged input/source. Preserve all ordinary original-family, age, EITC, school, other-credit and timely withholding-only payment gates. Direct ordinary qualifier still rejects reciprocity. Unknown mixed/PY/MFJ/non-PA/special compensation remains unsupported."
    testRef: "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::qualifies only complete current PA employee originals"
  - line: "pa-reciprocal-residency-declaration"
    description: "Reconcile the 2026 Ohio declaration for a full-year Pennsylvania employee"
    formula: >-
      A confirmed full-year Pennsylvania domicile supports the Ohio nonresident
      reciprocal method. If an Ohio residency declaration was retained, require
      nonresident and hold a conflicting full-year or part-year Ohio declaration.
      With an omitted declaration, the same actual domicile and wage evidence
      establishes eligibility for the draft.
    irsRef: "Ohio R.C. 5747.05(A)(2), https://codes.ohio.gov/ohio-revised-code/section-5747.05"
    testRef: "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::holds a conflicting Ohio declaration of %s for full-year Pennsylvania reciprocity"
    testRefs:
      - "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::accepts matching or omitted Ohio declarations for full-year Pennsylvania reciprocity"
  - line: "pa-reciprocal-refund"
    description: "Refund actual Ohio compensation withholding without duplicate relief"
    formula: "RC5747.05(A)(2) compensation reciprocity and historical2025 ScheduleAdjustments reciprocal-wage treatment applied as a labeled2026 statutory draft: federalAGI=roundDollar(actual complete W2 wages); exclusion=the same source-qualified compensation; OhioAGI=federalAGI-exclusion=0. Actual known-zero other sources and complete no-child federal EITC facts imply zero Ohio taxable income and tax/credits, NRC0/resident-credit0 (never reuse excluded wages), refund=roundDollar(sum actual OH state compensation withholding). School/municipal/other-state withholding never enters the Ohio refund. Do not fabricate a federal return or final2026 form lines; current draft filing/review gates remain closed."
    testRef: "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::refunds only actual OH withholding on source-qualified reciprocal wages: %s"
  - line: "pa-reciprocal-commitment"
    description: "Preserve current original commitments, historical behavior and closed gates"
    formula: "Opaque current source context binds untouched original input and complete packet; missing, stale, copied or forged contexts reject. Provenance-only original changes require requalification and a changed source commitment even at equal cash. Existing ordinary outputs and historical2025 source methods/year guards remain unchanged; all final2026 forms/public year/filing activation and full selected-state completion remain false."
    testRef: "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::rejects stale and forged reciprocal contexts without changing historical gates"

  - line: "pa-part-year-reciprocal-sources"
    description: "Qualify an ordinary Ohio employee who moves between Pennsylvania and Ohio"
    formula: >-
      The separate oh-2026-pa-part-year-reciprocal-employee-draft-v1 method
      requires one single primary employee under 65, one current ordinary
      Ohio C-corporation W-2, all services performed in Ohio and two actual
      contiguous PA and OH domicile periods covering calendar 2026. Check two
      distinct documentary domicile originals against the same taxpayer and
      canonical timeline. Reconcile employer and service originals, complete
      unique dated payroll to the W-2, each payroll service period and payment
      within the same documented domicile period, and actual Ohio withholding.
      One separately sourced PA W-2 state row may establish known nonnegative
      PA withholding only on the PA portion, and never contributes to Ohio
      payments. For this same-pay documentary method, the OH Box 16 must
      match either total Ohio-service payroll or Ohio-resident wages exactly.
      A printed PA Box 16 must match the PA-resident wages exactly. Reconcile
      those amounts independently of withholding and hold other printed
      wage patterns for manual reconciliation or a separate method. Hold
      ambiguous boundary payroll, missing dates, unknown
      withholding, stale originals, other income, special employment, school
      tax, other adjustments and unsupported payment or credit methods.
      Preserve the existing full-year PA reciprocal and ordinary routes.
    testRef: "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::reconciles documented Ohio reciprocal wages in both move directions (%s)"
    testRefs:
      - "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::holds incomplete or conflicting part-year reciprocal originals (%s)"
      - "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::accepts full Ohio-service payroll in Box 16 (%s)"
      - "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::holds contradictory rebound state Box 16 wages (%s)"
  - line: "pa-part-year-reciprocal-deduction"
    description: "Deduct the actual Pennsylvania-resident wage portion once"
    formula: >-
      Under RC 5747.01(A)(33) and 5747.05(A)(2), add all original wages to
      federal AGI and deduct the exact Ohio compensation earned and paid
      during Pennsylvania domicile from Ohio AGI. Round each final AGI once.
      Under RC 5747.20, retain only Ohio-resident wages in the draft
      IT NRC allocation. The deducted Pennsylvania-period compensation
      produces no nonresident or resident credit. Apply the existing Ohio
      exemption and rate to the remaining Ohio wages. Compare the tax with
      actual Ohio withholding for the ordinary timely settlement.
      Ohio's draft 2026 booklet printed pages 25 and 41 describes the
      deduction and NRC allocation. Final annual forms, independent tax
      review, public integration and filing qualification remain separate.
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.01"
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.05"
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.20"
      - "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/DRAFTS/2026/it1040-booklet-draft.pdf"
    testRef: "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::applies the exact part-year reciprocity deduction before rounding Ohio AGI"

  - line: "va-paid-resident-credit-current"
    description: "Compose actual paid Virginia liability after preceding credits and NRC"
    formula: "Separate oh-2026-va-resident-credit-employee-draft-v1 source method requires current single full-year Ohio employee originals, one exact OH/VA W2 and matching complete service payroll, original filed2026 VA763 and settled original agency account/receipts. Derive actual net income tax paid after Virginia credits/payments/refunds, never gross withholding or a calculated Virginia return. Strict new confirmations replace contradictory no-other-state-tax/no-other-credit ordinary facts. Apply remaining-tax ratio/cap after every preceding credit and NRC; full-year OH proves NRC0 and no reciprocal overlap. Current opaque context binds complete unchanged originals; historical2025 methods, ordinary/PA reciprocal packets and final2026 gates remain unchanged."
    testRef: "tests/engine/state/oh-2026-resident-credit-draft.test.ts::binds current originals privately and preserves historical and filing gates"
