notes: |
  Sources refreshed 2026-11-05; implementation remains a labeled internal draft.
  This is a minimum first complete arithmetic/source cohort, not the entire
  remaining Ohio scope. All other factual branches stay unsupported, not zero.
  Explicit 2026 draft entry point in oh-engine.ts calls the source and return methods;
  it cannot remain a test-only scalar composition. No full federal result is
  fabricated. Historical public paths remain unchanged until separately reviewed.
  Require source-complete ordinary employee originals, actual owner/date/allocation
  evidence, known-zero state adjustments/business/A34/A35/other credits, actual
  no-taxing-school-district evidence, current filing-status and exemption facts,
  no actual EITC qualifying children and AGI above the indexed zero-child phaseout, otherwise unsupported, and exact
  actual payments. Scalar caller assertions cannot become source qualification.
  This finite domestic cohort requires actual recognized US state/DC service and
  domicile codes and distinct primary/spouse taxpayer identities. Unknown codes
  or duplicate persons cannot qualify by supplying internally consistent totals.
  Calculation status remains incomplete, filingQualified=false, review pending;
  final2026 form identities/numbering and professional review are separate gates.
lines:
  - line: "ordinary-unemployment-source"
    description: "Private 2026 ordinary employee draft with one actual Box 1 unemployment original for a single part-year resident or nonresident"
    formula: "Require a recipient-bound, current uncorrected nonvoid original Form 1099-G (Rev. December 2026) for ordinary noncontributory state unemployment insurance. Verify every original box, known-zero non-Box-1 income and adjustments, no repayments or unrecovered contributions, and no state withholding even if omitted from the recipient copy. Require a complete original-bound list of actual dates and positive whole-dollar amounts paid or accrued in calendar 2026. Require one owner, the existing ordinary W2 source admission, and proved continuous Ohio domicile periods. Each unique receipt counts at its actual paid-or-accrued date. Their exact total must match Box 1. Federal AGI is ordinary wages plus gross Box 1, with federal withholding excluded from the income computation. Ohio IT NRC line 12 resident amount is the sum of receipts with Ohio domicile on that date; no payments are Ohio income during a nonresident period merely because the payer is in Ohio. Reconcile the assigned amounts with the complete owner categories before deriving the NRC credit and withholding-only settlement. Hold missing or contradictory originals, unsupported income, deductions, specialized benefits, and unsupported residency or credit facts. Filing qualification stays false and final annual form/PDF support remains outside this method."
    sources:
      - "https://codes.ohio.gov/ohio-revised-code/section-5747.20"
      - "https://www.irs.gov/instructions/i1099g"
    testRef: "tests/engine/state/oh-2026-unemployment-draft.test.ts::assigns gross Box 1 to Ohio only when domiciled there on the receipt date"
  - line: "w2-code-q-admission"
    description: "Require the separate state military compensation method when combat pay is reported"
    formula: "Positive actual W2 Box 12 Code Q identifies nontaxable combat pay from a military employer and contradicts the finite ordinary employee admission. Reject even with matching originals and no retained duty classification. Code Q alone establishes neither duty location nor the treatment of Box 1 or 16. Preserve historical absent Code Q and confirmed zero when all other ordinary facts qualify. Sources verified 2026-11-13: https://www.irs.gov/instructions/iw2w3 and https://tax.ohio.gov/individual/military."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::routes reported combat pay to a separate method for each Ohio residency"
  - line: "source-admission"
    description: "Bind a current ordinary employee packet to all current originals"
    formula: "Require taxYear2026, actual filing/owner identities, all-original-source-family inventory (reject unknown/unhandled even if zero), W2 source validation, complete Ohio residency periods/categories, exact original snapshot and source commitments. Derive wages/withholding from actual W2 rows once; state wages are not a substitute for services allocation. Require all unknown adjustment/credit/payment facts, never optional defaults."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::rejects unknown changed or unsupported actual original sources: %s"
  - line: "AGI"
    description: "Ordinary employee federal and Ohio AGI"
    formula: "For the source-complete ordinary W2-only cohort, federalAGI=sum actual federal W2 wages, with no other federal income or adjustment admitted; OhioAGI=federalAGI because every state adjustment is explicitly source-qualified zero. Other federal components require completed current computation or a separate explicit draft method. No forged TaxReturnResult or 2025 constants."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::derives current ordinary wage AGI without a fabricated federal return"
  - line: "canonical empty source collections"
    description: "Accept the parsed federal contract while retaining original-source proof"
    formula: "Canonical default empty document arrays do not establish additional originals. Admit only the explicit federal document collection keys when their arrays are empty. Keep every retained document and every unsupported source object in scope for rejection even when its monetary fields are zero. Require the exact original snapshot after canonicalization."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::accepts the canonical federal input for %s without admitting a retained zero original"
  - line: "rate-and-exemption"
    description: "Consume the corrected 2026 baseline"
    formula: "Use corrected actual MAGI and completed eligible-person count; use separate business/nonbusiness bases and unchanged explicit Decimal rounding. Compute preceding senior and personal-exemption credits before the joint credit."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::integrates enacted tax and explicit exemptions across all three residencies: %s"
  - line: "senior-credit-originals"
    description: "Qualify complete prior lump-sum credit history for withholding-only ordinary and earned-school drafts"
    formula: "For ordinary withholding-only or single full-year earned-school withholding-only returns with an owner born on or before 1961-12-31, require one private reference per current owner, the same owner role and birth date as the bound current originals, and confirmed complete history without a prior Ohio senior lump-sum election or retirement-credit carryforward. Missing, duplicate, extra, mismatched or inconclusive records, an actual election/carry, and packets for other methods reject. Hold 1962-01-01 births pending confirmation of Ohio age attainment for that date. A later date continues the existing under-65 admission. Authority refreshed 2026-11-13: RC5747.055(C)-(G) and the Ohio Schedule of Credits instructions."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::requires complete owner-bound Ohio senior credit history"
  - line: "senior-credit"
    description: "Apply one nonrefundable senior citizen credit before later credits"
    formula: "When the admitted single or joint return has at least one eligible owner, take min(50, tax before credits) if actual MAGI less exemptions is strictly below 100000; otherwise zero. Apply personal credit to the remaining tax, then joint credit, actual zero EITC and actual IT NRC allocation where applicable. Use one $50 credit on a joint return regardless of how many eligible owners it has. Authority RC5747.055(F) and RC5747.98(A),(B). Keep final state form and filing qualification closed."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::applies the Ohio senior credit before residency relief for %s"
  - line: "senior-credit-limits"
    description: "Enforce remaining tax, income ceiling and joint return treatment"
    formula: "Use exact whole-dollar MAGI and exemption bases, cap nonrefundable credit at available tax, and use remaining tax for the joint percentage."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::uses one senior credit, available tax and the strict Ohio income limit"
  - line: "credit-order"
    description: "Apply senior, personal, joint, EITC, then NRC in statutory order"
    formula: "For the initial single/MFJ household with no dependents and each owner not claimable elsewhere, eligibleCount is actual owner count. Personal=min(tax after senior credit,20*eligibleCount) only if MAGI-exemptions<30000. Joint applies to remaining tax at actual owner qualifying-income tiers/cap. EITC0 is derived only from complete known no-qualifying-child sources and actual AGI at or above19540(single)/26820(MFJ), Rev.Proc.2025-32. Other EITC cases reject. Every other preceding or intervening credit must be source-qualified absent, otherwise reject until separate computation. Then apply actual NRC and finally actual resident-credit method when supported, never double use income."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::retains credit order caps and strict personal-credit boundary"
  - line: "residency"
    description: "Full-year, part-year, and nonresident actual-source computation"
    formula: "Reuse actual owner timeline/category validation and ITNRC allocation with 2026 source-contract evidence. Full-year source totals include all income; PY uses actual resident/nonresident services periods, not calendar ratio. Nonresident services are Ohio only when actually sourced here. Use min(1,truncate4(outsideOhioAGI/OhioAGI)); multiply tax after every preceding credit and roundDollar once. Reciprocal compensation requires separate current agreement/source method and cannot be treated as ordinary taxable OH wages."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::uses actual services amounts rather than residency day counts"
  - line: "settlement"
    description: "Finish known ordinary settlement without fabricating penalties"
    formula: "Only admit source-complete calendar original returns with known timely-payment/filing facts. Initial employee cohort uses actual Ohio compensation withholding at least current tax, no school tax, no other payments/refundable credits/use tax/amendment/carryforward/donations. Section5747.09 withholding is equal across installment dates absent actual-date election, covering required current installments; penalty0. Unknown dates/election or other payment methods require a separate current method. Refund=withheld-tax; no late interest if no unpaid tax, otherwise dated method required."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::settles only complete current withholding-covered returns"
  - line: "closed-gates"
    description: "Preserve all qualification boundaries"
    formula: "Return labeled draft taxYear2026 with independent current provenance, incomplete calculation and review status, filingQualified=false, no official2026 form/export qualification. Preserve historical numeric outputs and public unknown/unsupported gates; full selected-state completion stays false until remaining factual branches, human review, forms and operational evidence pass."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::keeps filing and historical gates intact"
  - line: "pa-reciprocal-current-sources"
    description: "Separately qualify actual2026 full-year Pennsylvania employee originals"
    formula: "Require an explicit oh-2026-pa-reciprocal-employee-draft-v1 packet, current original taxpayer/W2/domicile/employer/service/payroll evidence, single primary full-year PA nonresident, one ordinary C-corporation employer and all wages for actual OH employee services. Reconcile complete unique current-year service/pay dates, W2 cash and actual OH withholding. Current reciprocal originals in residency and source packet must match exactly and bind every unchanged input/source. Preserve all ordinary original-family, age, EITC, school, other-credit and timely withholding-only payment gates. Direct ordinary qualifier still rejects reciprocity. Unknown mixed/PY/MFJ/non-PA/special compensation remains unsupported."
    testRef: "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::qualifies only complete current PA employee originals"
  - line: "pa-reciprocal-refund"
    description: "Refund actual Ohio compensation withholding without duplicate relief"
    formula: "RC5747.05(A)(2) compensation reciprocity and historical2025 ScheduleAdjustments reciprocal-wage treatment applied as a labeled2026 statutory draft: federalAGI=roundDollar(actual complete W2 wages); exclusion=the same source-qualified compensation; OhioAGI=federalAGI-exclusion=0. Actual known-zero other sources and complete no-child federal EITC facts imply zero Ohio taxable income and tax/credits, NRC0/resident-credit0 (never reuse excluded wages), refund=roundDollar(sum actual OH state compensation withholding). School/municipal/other-state withholding never enters the Ohio refund. Do not fabricate a federal return or final2026 form lines; current draft filing/review gates remain closed."
    testRef: "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::refunds only actual OH withholding on source-qualified reciprocal wages: %s"
  - line: "pa-reciprocal-commitment"
    description: "Preserve current original commitments, historical behavior and closed gates"
    formula: "Opaque current source context binds untouched original input and complete packet; missing, stale, copied or forged contexts reject. Provenance-only original changes require requalification and a changed source commitment even at equal cash. Existing ordinary outputs and historical2025 source methods/year guards remain unchanged; all final2026 forms/public year/filing activation and full selected-state completion remain false."
    testRef: "tests/engine/state/oh-2026-reciprocal-return-draft.test.ts::rejects stale and forged reciprocal contexts without changing historical gates"

  - line: "va-paid-resident-credit-current"
    description: "Compose actual paid Virginia liability after preceding credits and NRC"
    formula: "Separate oh-2026-va-resident-credit-employee-draft-v1 source method requires current single full-year Ohio employee originals, one exact OH/VA W2 and matching complete service payroll, original filed2026 VA763 and settled original agency account/receipts. Derive actual net income tax paid after Virginia credits/payments/refunds, never gross withholding or a calculated Virginia return. Strict new confirmations replace contradictory no-other-state-tax/no-other-credit ordinary facts. Apply remaining-tax ratio/cap after every preceding credit and NRC; full-year OH proves NRC0 and no reciprocal overlap. Current opaque context binds complete unchanged originals; historical2025 methods, ordinary/PA reciprocal packets and final2026 gates remain unchanged."
    testRef: "tests/engine/state/oh-2026-resident-credit-draft.test.ts::binds current originals privately and preserves historical and filing gates"
