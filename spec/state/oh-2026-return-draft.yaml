form: "Ohio 2026 enacted return draft"
fullName: "Source-qualified ordinary employee integration for all three residency statuses"
taxYear: 2026
irsReference: "https://codes.ohio.gov/ohio-revised-code/section-5747.02"
sources:
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.01"
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.05"
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.022"
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.71"
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.98"
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.09"
  - "https://www.irs.gov/pub/irs-drop/rp-25-32.pdf"
notes: |
  Sources refreshed 2026-11-05; implementation remains a labeled internal draft.
  This is a minimum first complete arithmetic/source cohort, not the entire
  remaining Ohio scope. All other factual branches stay unsupported, not zero.
  Explicit 2026 draft entry point in oh-engine.ts calls the source and return methods;
  it cannot remain a test-only scalar composition. No full federal result is
  fabricated. Historical public paths remain unchanged until separately reviewed.
  Require source-complete ordinary employee originals, actual owner/date/allocation
  evidence, known-zero state adjustments/business/A34/A35/other credits, actual
  no-taxing-school-district evidence, current filing-status and exemption facts,
  no actual EITC qualifying children and AGI above the indexed zero-child phaseout, otherwise unsupported, and exact
  actual payments. Scalar caller assertions cannot become source qualification.
  This finite domestic cohort requires actual recognized US state/DC service and
  domicile codes and distinct primary/spouse taxpayer identities. Unknown codes
  or duplicate persons cannot qualify by supplying internally consistent totals.
  Calculation status remains incomplete, filingQualified=false, review pending;
  final2026 form identities/numbering and professional review are separate gates.
lines:
  - line: "source-admission"
    description: "Bind a current ordinary employee packet to all current originals"
    formula: "Require taxYear2026, actual filing/owner identities, all-original-source-family inventory (reject unknown/unhandled even if zero), W2 source validation, complete Ohio residency periods/categories, exact original snapshot and source commitments. Derive wages/withholding from actual W2 rows once; state wages are not a substitute for services allocation. Require all unknown adjustment/credit/payment facts, never optional defaults."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::rejects unknown changed or unsupported actual original sources"
  - line: "AGI"
    description: "Ordinary employee federal and Ohio AGI"
    formula: "For the source-complete ordinary W2-only cohort, federalAGI=sum actual federal W2 wages, with no other federal income or adjustment admitted; OhioAGI=federalAGI because every state adjustment is explicitly source-qualified zero. Other federal components require completed current computation or a separate explicit draft method. No forged TaxReturnResult or 2025 constants."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::derives current ordinary wage AGI without a fabricated federal return"
  - line: "rate-and-exemption"
    description: "Consume the corrected 2026 baseline"
    formula: "Use corrected actual MAGI and completed eligible-person count; use separate business/nonbusiness bases and unchanged explicit Decimal rounding. Compute preceding personal-exemption credit before the joint credit."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::integrates enacted tax and explicit exemptions across all three residencies"
  - line: "credit-order"
    description: "Apply personal, joint, EITC, then NRC in statutory order"
    formula: "For the initial single/MFJ household with no dependents and each owner not claimable elsewhere, eligibleCount is actual owner count. Personal=min(tax,20*eligibleCount) only if MAGI-exemptions<30000. Joint applies to remaining tax at actual owner qualifying-income tiers/cap. EITC0 is derived only from complete known no-qualifying-child sources and actual AGI at or above19540(single)/26820(MFJ), Rev.Proc.2025-32. Other EITC cases reject. Every other preceding or intervening credit must be source-qualified absent, otherwise reject until separate computation. Then apply actual NRC and finally actual resident-credit method when supported, never double use income."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::retains credit order caps and strict personal-credit boundary"
  - line: "residency"
    description: "Full-year, part-year, and nonresident actual-source computation"
    formula: "Reuse actual owner timeline/category validation and ITNRC allocation with 2026 source-contract evidence. Full-year source totals include all income; PY uses actual resident/nonresident services periods, not calendar ratio. Nonresident services are Ohio only when actually sourced here. Use min(1,truncate4(outsideOhioAGI/OhioAGI)); multiply tax after every preceding credit and roundDollar once. Reciprocal compensation requires separate current agreement/source method and cannot be treated as ordinary taxable OH wages."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::uses actual services amounts rather than residency day counts"
  - line: "settlement"
    description: "Finish known ordinary settlement without fabricating penalties"
    formula: "Only admit source-complete calendar original returns with known timely-payment/filing facts. Initial employee cohort uses actual Ohio compensation withholding at least current tax, no school tax, no other payments/refundable credits/use tax/amendment/carryforward/donations. Section5747.09 withholding is equal across installment dates absent actual-date election, covering required current installments; penalty0. Unknown dates/election or other payment methods require a separate current method. Refund=withheld-tax; no late interest if no unpaid tax, otherwise dated method required."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::settles only complete current withholding-covered returns"
  - line: "closed-gates"
    description: "Preserve all qualification boundaries"
    formula: "Return labeled draft taxYear2026 with independent current provenance, incomplete calculation and review status, filingQualified=false, no official2026 form/export qualification. Preserve historical numeric outputs and public unknown/unsupported gates; full selected-state completion stays false until remaining factual branches, human review, forms and operational evidence pass."
    testRef: "tests/engine/state/oh-2026-return-draft.test.ts::keeps filing and historical gates intact"
