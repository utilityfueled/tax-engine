    formula: "With actual complete native reciprocal originals, workspace year derived by the existing real guided documents/fact-answer sync from actual flow2025, and cwd apps/web, buildWorkspaceFilledReturnDownload emits the existing source-required official companions and actual saved PDF. Source packets, original identifiers, money, filing/readiness restrictions and private context are unchanged. No fabricated fallback or disabled physical method."
