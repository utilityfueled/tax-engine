    description: One supplied root is propagated through the public reference helper
    formula: "forms/blank and forms/blank/2025 select the same exact 2025 sources without a double year suffix; no arbitrary current-directory asset search inside physical loaders. Existing root-default callers remain compatible. Reciprocal positive cash emits five official files; known zero emits four, preserving Schedule W omission."
