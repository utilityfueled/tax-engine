  - line: "root-default-compatibility"
    description: Existing public API calls preserve repository-root behavior
    formula: "The old five-argument public reference call retains exact source-required official companions with original packets immutable."
    testRef: "tests/apps/web/oh-review-template-root.test.ts::default public Ohio root remains compatible %s"
  - line: "school-root"
    description: The same root reaches the existing school district physical companion
    formula: "Actual Hillsdale 0302 source cohort under apps/web uses the explicit same 2025 root and emits SD100 plus withholding physical review; source dollars and school source context are unchanged."
