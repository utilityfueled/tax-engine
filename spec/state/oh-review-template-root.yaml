  - line: "assets-before-output"
    description: Direct physical loaders fail closed on missing or changed exact official sources
    formula: "Explicit empty or tampered source directories deny before direct physical output mkdir/write, never search another root or silently omit required companions. Exact published SHA256 and page/widget qualification remain mandatory. Existing public reference helper may create its own temporary summaries first; workspace cleans those in finally."
