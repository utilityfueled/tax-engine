  actual user records or production defaults. W2 Acme Corp wages60000, federal
  withholding8000 and PA withholding2000 retain the predecessor exact amounts.
  Complete source-only state-return records are required even without generic
  payment entries; literal absence/empty prior flows remain explicit negatives.
  Tax60000*.0307=1842; actual withholding2000 gives refund158. Two actual PA2025
  estimate receipts1000 on April15/June15 make4000 payments/refund2158. Each
  saved generic ledger row must reconcile one actual current-owner receipt.
  Example Pension1099R actual PA withholding500 is NOT another W2/INT source.
  A separately fictional employer eligible pension original/gross5000/zero
  contributions/code7/actual retirement after plan age65 requires its actual PA
  source-qualified method. It is not inferred exempt from federal code alone.
  Positive2500 payment and658 refund remain pending until that real method and
  saved-ledger single-count reconciliation exist. No generic ledger authority,
  invented no-source proof, removed guards or weakened source/readiness gates.
  The new qualified-retirement source proposal is not yet a supported product
  schema or human tax opinion. Original all4 positive money/assertions retained.
