form: "PA-Married-Payment-Sources"
fullName: Original individual-account PA married separate payment composition
taxYear: 2025
reference: https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40in.pdf
notes: |
  Actual2025 PA40 instructions printed21 lines14-16; REV1630 printed1 line6.
  61PaCode117.2 keeps separate liabilities and department account offsets distinct.
  This finite method admits only original2025 M individual accounts, unchanged
  posted prior credits and timely original filings. No joint-account transfer,
  priorSP inference, late-payment interest, final2026 or filing qualification.
lines:
  - line: "14-16"
    description: Exact actual separate-owner posted payment originals
    formula: Reconcile every retained original receipt and payment status to the current complete individual account. For each owner sum actual estimate originals then round line15 once; sum actual extension originals then round line16 once; unchanged prior elected credit must equal posted available credit before rounding line14. Keep raw cents and original snapshots immutable. Known zero is explicit; absent payment facts cannot become zero.
    testRef: "tests/engine/state/pa-married-payment-sources.test.ts::PA married payments compose actual separate accounts with exact printed lines"
  - line: "source"
    description: Original owner account inventory and prior credit binding
    formula: Require same actual owner name/SSN,2025 PA40 individual M account, complete posted inventory through actual asOf, no transfers/refunds/offsets/reversals/adjustments. Prior credit requires original same-owner M2024 return election and unchanged2025 available credit. Reject stale originals, unknowns, duplicates, excess elected credit, unsupported accounts and balance payments before totals.
    testRef: "tests/engine/state/pa-married-payment-sources.test.ts::PA married payments reject incomplete or contradictory originals %s"
  - line: "REV1630-6"
    description: Actual timely installments without inferred prior history
    formula: Assign each actual estimate only to its documented due-date period; include unchanged prior credit applied by April15 in Q1. An actual, separately identified extension payment from January 1 through April 15 after year end goes to only its owner's PA-40 line 16 under REV-276, with no estimated installment assignment. A positive receipt before April 15 requires independently established relief for that owner's REV-1630; otherwise require a dated-payment method. Require all current installments sufficient or existing actual withholding-credit exemption; otherwise deny before a positive penalty without actual priorSP eligibility. Preserve the separate calendar-year 2025 scope.
    testRef: "tests/engine/state/pa-married-payment-sources.test.ts::PA married payments fund actual installments without inventing priorSP history"
  - line: "boundaries"
    description: Separate method limits and private source commitment
    formula: Preserve J known-none and legacy M known-none admission. New supplemental payment proof rejects J,2026,joint accounts, off-period or post-asOf receipts, payment extensions, late originals, opposing balances and malformed supplied data. All supplemental originals bind full household source commitment; output audit includes no private identities, confirmation numbers or source references.
    testRef: "tests/engine/state/pa-married-payment-sources.test.ts::PA married payments preserve source commitment privacy and original inputs"
  - line: "prior-credit-chronology"
    description: Finite documented prior filing and credit application chronology
    formula: This first method requires the original separate prior return filed between Jan1 and its April15 due date, no later than the actual unchanged carryover application on April15. A later filed prior return or retroactive/account adjustment requires its own actual dated successor; do not infer a pre-filing election.
    testRef: "tests/engine/state/pa-married-payment-sources.test.ts::PA married payments reject unsupported prior filing after carryover application"
  - line: "federal-schedule-a-5a"
    description: Cash-year estimates and verified prior refunds on the actual joint federal return
    formula: Replay the complete 2025 paired Pennsylvania M original packet and both individual accounts before deriving the federal projection. Include each distinct owner-bound state estimate paid in calendar 2025 at exact cents and each actual 2024 refund independently proved elected and applied to 2025. A January 2026 installment or extension stays in its owner's PA-40 amount and outside the 2025 federal deduction. Equivalent receipt amounts or dates on distinct actual originals do not collapse. Use the same original-bound result for canonical federal calculation, guided preview and saved PDF review. Retained generic adjustment inputs, invalid account proof and stale federal originals remain held.
    irsRef: "2025 Schedule A Instructions, Line 5a, https://www.irs.gov/pub/irs-prior/i1040sca--2025.pdf#page=3"
    testRef: "tests/engine/state/pa-married-payment-schedule-a.test.ts::uses distinct verified owner receipts in the actual joint federal cash year"
    testRefs:
      - "tests/engine/state/pa-married-payment-schedule-a.test.ts::includes a verified prior refund election and excludes the following-year extension"
      - "tests/engine/state/pa-married-payment-schedule-a.test.ts::compares the verified total under automatic itemization and preserves an explicit standard election"
      - "tests/engine/state/pa-married-payment-schedule-a.test.ts::holds stale, duplicate or competing original sources in canonical federal calculation"
      - "tests/apps/web/pa-married-payment-schedule-a.test.ts::uses the verified paid amounts in guided preview and the saved federal review PDF"
  - line: "federal-schedule-a-confirmation"
    description: Retain the selected year of previously confirmed deductible household payments across edits
    formula: The first incomplete payment packet does not add a deduction. A confirmed positive in-year estimate or applied prior refund marks that paired household's year only after replay against the current federal originals. An edit or removal of the known source holds the itemized or automatic federal preview through a saved reopen until the original household accounts are reconciled again. A confirmed replacement with no deductible payments clears the hold only after the current federal originals match and the reviewed household replays. A saved confirmation flag with missing, malformed or stale proof cannot establish zero. Standard deduction preview and the ordinary single-person method retain their original boundaries.
    testRef: "tests/apps/web/pa-married-payment-schedule-a.test.ts::holds a previously used receipt after a saved edit or removal until reconfirmed"
    testRefs:
      - "tests/apps/web/pa-married-payment-schedule-a.test.ts::retains a saved paired payment hold when a known-none confirmation lacks federal originals"
      - "tests/apps/web/pa-married-payment-schedule-a.test.ts::holds a known-none saved packet with stale same-year originals after unrelated changes"
