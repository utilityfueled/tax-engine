form: "Native VA Refund Owner Unknown Transition"
fullName: "Actual owner selection can return to unknown without retaining a confirmed source"
taxYear: 2025
reference: "https://law.lis.virginia.gov/vacode/title58.1/chapter3/section58.1-499/"
notes: |
  Native source completeness control only; no tax method or monetary formula changes.
  An explicit unknown selection cannot keep the old confirmed identity or silently copy the current taxpayer.
