    formula: "After selecting the unknown placeholder, clear only that draft identity, invalidate child/parent confirmation, retain original confirmed source snapshots unchanged, and deny canonical replay/reconfirmation until actual owner is explicitly supplied. No render/read mutation or full SSN input."
