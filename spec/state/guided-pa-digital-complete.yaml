notes: |
  Source-first finite method candidate, subject to independent review; not qualified. Preserve
  original W2 withholding.40, PA original DA.10/.20, VA DA.30 and all original
  federal amount50030.75. PA digital proceeds100.49 less PA basis80.24 each:
  20.25*3=60.75, reported class61; compensation50000; taxround50061*.0307=1537.
  PA withholding.40+.10+.20=.70 raw and1 reported; VA.30 never PA withholding.
  All current W2, dated acquisitions/dispositions and PA remittance proof are
  separately explicit fictional sources. No fields default or infer from WH.
  Additional fictional VA original return independently states finaltax0;
  original VA withholding.30 was actually refunded.30, posted and received;
  complete March1 account netpaid0/unpaid0/overpay0. VA Code58.1-499 requires
  a special written application for a refund below1; fictional written request
  February16, agency award/posting February20 and receipt February21 are
  separately explicit. Whole-dollar VA763 reports withheld/payments/refund0,
  while exact statement/account/application original amounts remain.30.
  These are different source fields, not a rounded-value refund inference.
  PA Code111.4 disallows
  credit for overpayment actually refunded. Neither withholding nor refund
  alone proves final tax; all final return/account/source facts are required.
  Current canonical API has no typed admission for these actual refund facts;
  an actual method gap must be preserved, not replaced by an expected guard.
  No VA liability computation, foreign credit, production guard relaxation,
  PDF operation or2026 filing promotion is authorized by this fixture spec.
