form: "Schedule NR"
fullName: "Illinois Nonresident and Part-Year Resident Computation of Illinois Tax"
taxYear: 2025
reference: "https://tax.illinois.gov/forms/incometax/currentyear/individual/il-1040-schedule-nr-instr.html"

notes: |
  Schedule NR determines how much of a nonresident or part-year resident's
  income is taxable by Illinois. It uses a two-column approach:
    Column A — Federal amounts (total income from all sources)
    Column B — Illinois amounts (income from IL sources or while IL resident)

  The key output is the allocation decimal (Line 48): the ratio of Illinois
  base income to total base income. This decimal is applied to:
    - Exemptions (Line 50)
    - EITC (IL-1040 Line 29)
    - Child Tax Credit (IL-1040 Line 30)

  For part-year residents: Column B includes ALL income received while
  domiciled in IL, plus IL-source income received while nonresident.

  For nonresidents: Column B includes only IL-source income.

  Reciprocal states (IA, KY, MI, WI): Wages from reciprocal states are
  excluded from Column B. The reciprocal agreement only applies to wages;
  business income, rental income, etc., are still sourced normally.

  ISE Decimal (Illinois Self-Employment):
    Self-employment income in Column B / federal Schedule SE (Line 3 + 5a)
    Used to allocate SE tax deduction, SEP/SIMPLE, SE health insurance.
    Capped at 1.0, floored at 0.

  IAF Worksheet (Income Apportionment Formula):
    Used for multi-state business/farm income. The IAF decimal apportions
    business income to Illinois. Accepted as input to the engine.

lines:
  # Step 1 — Residency information (informational, not computed)
  - line: "1"
    description: "Residency status (full-year, part-year, nonresident)"
    formula: "Input"
    reference: "Schedule NR Instructions, Step 1"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Schedule NR accepts residency type"

  # Step 3 — Income (Lines 5-19 Column A and Column B)
  - line: "5"
    description: "Wages, salaries, tips (Column A = federal, Column B = IL-source wages)"
    formula: "Column A from federal; Column B = IL W-2 wages (exclude reciprocal state wages)"
    reference: "Schedule NR Instructions, Step 3, Line 5"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 5 - wages allocation"

  - line: "6"
    description: "Taxable interest"
    formula: "Column B: business interest from IL operations; nonbusiness = $0 for nonresidents"
    reference: "Schedule NR Instructions, Step 3, Line 6"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 6 - interest allocation"

  - line: "7"
    description: "Ordinary dividends"
    formula: "Column B: business dividends from IL operations; nonbusiness = $0 for nonresidents"
    reference: "Schedule NR Instructions, Step 3, Line 7"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 7 - dividends allocation"

  - line: "8"
    description: "Taxable refunds, credits, or offsets"
    formula: "Column B: IL tax refunds included in federal AGI"
    reference: "Schedule NR Instructions, Step 3, Line 8"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 8 - refunds allocation"

  - line: "10"
    description: "Business income or loss"
    formula: "Column B: entirely IL = Column A; multi-state = IAF Worksheet Line 3"
    reference: "Schedule NR Instructions, Step 3, Line 10"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 10 - business income allocation"

  - line: "11"
    description: "Capital gain or loss"
    formula: "Column B: IL real property/tangible property gains; multi-state business = IAF"
    reference: "Schedule NR Instructions, Step 3, Line 11"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 11 - capital gain allocation"

  - line: "12"
    description: "Other gains or losses (Form 4797)"
    formula: "Column B: business gains from IL operations; multi-state = IAF"
    reference: "Schedule NR Instructions, Step 3, Line 12"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 12 - other gains allocation"

  - line: "13"
    description: "Taxable IRA distributions"
    formula: "Column B: nonresidents enter $0; part-year = amount received while IL resident"
    reference: "Schedule NR Instructions, Step 3, Line 13"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 13 - IRA distributions nonresident zero"

  - line: "14"
    description: "Taxable pensions and annuities"
    formula: "Column B: nonresidents enter $0; part-year = amount received while IL resident"
    reference: "Schedule NR Instructions, Step 3, Line 14"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 14 - pensions nonresident zero"

  - line: "15"
    description: "Rental real estate, royalties, partnerships, S corps, trusts"
    formula: "Column B: IL real estate, tangible IL property, IL patents/copyrights; multi-state = IAF"
    reference: "Schedule NR Instructions, Step 3, Line 15"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 15 - rental/partnership allocation"

  - line: "16"
    description: "Farm income or loss"
    formula: "Column B: entirely IL = Column A; multi-state = IAF Worksheet"
    reference: "Schedule NR Instructions, Step 3, Line 16"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 16 - farm income allocation"

  - line: "17"
    description: "Unemployment compensation"
    formula: "Column B: IL Dept of Employment Security benefits only"
    reference: "Schedule NR Instructions, Step 3, Line 17"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 17 - unemployment allocation"

  - line: "18"
    description: "Taxable Social Security benefits"
    formula: "Column B: nonresidents enter $0; part-year = amount received while IL resident"
    reference: "Schedule NR Instructions, Step 3, Line 18"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 18 - SS nonresident zero"

  - line: "19"
    description: "Other income (lottery, gambling, NOL carryforward)"
    formula: "Column B: IL lottery/gambling winnings; business NOL from IL; multi-state NOL = IAF"
    reference: "Schedule NR Instructions, Step 3, Line 19"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 19 - other income allocation (lottery)"

  # Step 3 — Adjustments (Lines 20-38)
  - line: "20"
    description: "Total income (Column A and B)"
    formula: "Sum of Lines 5-19 for each column"
    reference: "Schedule NR Instructions, Step 3"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 20 - total income computation sums all 15 categories"

  - line: "ISE"
    description: "Illinois Self-Employment (ISE) decimal"
    formula: "Self-employment income in Column B / federal Schedule SE Part I (Line 3 + 5a); cap at 1.0, floor at 0"
    reference: "Schedule NR Instructions, Step 3, Lines 26-28"
    notes: "Used to allocate SE tax deduction, SEP/SIMPLE, and SE health insurance"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::ISE decimal computation — basic"

  - line: "26"
    description: "Deductible part of self-employment tax"
    formula: "Column B = ISE decimal × Column A, Line 26"
    reference: "Schedule NR Instructions, Step 3, Line 26"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 26 - SE tax uses ISE decimal"

  - line: "27"
    description: "Self-employed SEP, SIMPLE, qualified plans"
    formula: "Column B = ISE decimal × Column A, Line 27"
    reference: "Schedule NR Instructions, Step 3, Line 27"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 27 - SEP uses ISE decimal"

  - line: "28"
    description: "Self-employed health insurance deduction"
    formula: "Column B = ISE decimal × Column A, Line 28"
    reference: "Schedule NR Instructions, Step 3, Line 28"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 28 - SE health insurance uses ISE decimal"

  - line: "31"
    description: "IRA deduction"
    formula: "Column B = (IL earned income / total earned income) × Column A, Line 31"
    reference: "Schedule NR Instructions, Step 3, Line 31"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 31 - IRA deduction allocation"

  - line: "36"
    description: "Total adjustments (Column A and B)"
    formula: "Sum of Lines 22-35 for each column"
    reference: "Schedule NR Instructions, Step 3"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 36 - total adjustments"

  - line: "37"
    description: "Subtotal (Line 20 - Line 36)"
    formula: "Line 20 - Line 36 for each column"
    reference: "Schedule NR Instructions, Step 3"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 37 - income minus adjustments"

  - line: "38"
    description: "Federal AGI (Column A should match IL-1040 Line 1)"
    formula: "Column A = federal AGI; Column B = IL-source AGI"
    reference: "Schedule NR Instructions, Step 3"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 37 - income minus adjustments"

  # Step 4 — Additions and Subtractions
  - line: "39"
    description: "Federally tax-exempt interest and dividends (IL-1040 Line 2)"
    formula: "Column B: business tax-exempt interest from IL; nonbusiness = $0"
    reference: "Schedule NR Instructions, Step 4, Line 39"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 39 - tax-exempt interest allocation"

  - line: "40"
    description: "Other additions (Schedule M additions)"
    formula: "Column B: additions allocable to IL sources"
    reference: "Schedule NR Instructions, Step 4, Line 40"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 40 - additions allocation"

  - line: "41"
    description: "Total income plus additions"
    formula: "Line 38 + Line 39 + Line 40 for each column"
    reference: "Schedule NR Instructions, Step 4"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 41 - total with additions"

  - line: "42"
    description: "Federally taxed Social Security and retirement income"
    formula: "Column B: nonresidents = $0; part-year = amount received while IL resident"
    reference: "Schedule NR Instructions, Step 4, Line 42"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 42 - retirement subtraction allocation — nonresident $0"

  - line: "43"
    description: "Illinois Income Tax overpayment (IL-1040 Line 6)"
    formula: "Column B: IL overpayment included in Column B Line 8"
    reference: "Schedule NR Instructions, Step 4, Line 43"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 43 - IL refund subtraction"

  - line: "44"
    description: "Other subtractions (Schedule M subtractions)"
    formula: "Column B: subtractions allocable to IL sources"
    reference: "Schedule NR Instructions, Step 4, Line 44"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 44 - subtractions allocation"

  - line: "45"
    description: "Total subtractions"
    formula: "Line 42 + Line 43 + Line 44 for each column"
    reference: "Schedule NR Instructions, Step 4"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 45 - total subtractions"

  # Step 5 — Illinois Income and Tax
  - line: "46"
    description: "Illinois base income"
    formula: "max(Line 41 - Line 45, 0) for Column B"
    reference: "Schedule NR Instructions, Step 5"
    notes: "If negative or zero, skip to Line 52 with $0 tax"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 46 - IL base income floors at zero"

  - line: "47"
    description: "Base income from IL-1040 Line 9"
    formula: "IL-1040 Line 9 (full base income computed as if full-year resident)"
    reference: "Schedule NR Instructions, Step 5"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 47 - full base income from IL-1040"

  - line: "48"
    description: "Allocation decimal (Illinois income ratio)"
    formula: "Line 46 / Line 47, rounded to 3 decimal places; cap at 1.000"
    reference: "Schedule NR Instructions, Step 5"
    notes: |
      This is the key output of Schedule NR. It represents the portion of
      income taxable by Illinois. Used for:
      - Exemption allocation (Line 50)
      - EITC allocation (IL-1040 Line 29)
      - Child Tax Credit allocation (IL-1040 Line 30)
    edgeCases:
      - "Line 47 = 0: allocation decimal = 0"
      - "Line 46 > Line 47: cap at 1.000"
      - "Both zero: decimal = 0"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 48 - allocation decimal computation — 50% IL income"

  - line: "49"
    description: "Exemption allowance from IL-1040 Line 10"
    formula: "IL-1040 Line 10 total exemptions"
    reference: "Schedule NR Instructions, Step 5"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 49 - exemption from IL-1040"

  - line: "50"
    description: "Allocated exemption allowance"
    formula: "Line 49 × Line 48 (round to whole dollars)"
    reference: "Schedule NR Instructions, Step 5"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 50 - allocated exemptions = exemptions × allocation decimal"

  - line: "51"
    description: "Illinois net income"
    formula: "max(Line 46 - Line 50, 0); enters IL-1040 Line 11"
    reference: "Schedule NR Instructions, Step 5"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 51 - IL net income = IL base income minus allocated exemptions"

  - line: "52"
    description: "Illinois income tax"
    formula: "Line 51 × 4.95% (0.0495); enters IL-1040 Line 12"
    reference: "Schedule NR Instructions, Step 5"
    testRef: "tests/engine/state/il-schedule-nr.test.ts::Line 52 - IL income tax at 4.95%"
