form: "Ohio 2026 qualifying capital gain documentary draft"
fullName: "One direct equity sale under R.C. 5747.79"
taxYear: 2026
irsReference: "https://codes.ohio.gov/ohio-revised-code/section-5747.79"
sources:
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.01"
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.06"
  - "https://tax.ohio.gov/individual/who-must-file/whats-new"
  - "https://www.ecfr.gov/current/title-26/section-1.469-5T"
  - "https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XXV/subchapter-B/part-2510/section-2510.3-101#p-2510.3-101(d)(3)"
notes: |
  Authority checked 2026-11-26. 5747.79 effective September30,2021 applies to
  taxable years beginning in2026. ODT2026 What's New identifies A34 as Schedule
  of Adjustments line14; line15/A35 is the separate venture operating company
  deduction. The two A34 documentary methods are mutually exclusive in one
  packet. A35, multiple or indirect sales, and indirect investments are outside
  this worksheet.
  Documentary boundary: source references and explicit completed assessments
  are required inputs, not independently authenticated documents. A completed
  material-participation assessment must establish a permitted (a)(1),(2),(3),
  (4),or(7) criterion and applicable federal restrictions for the exact five
  years immediately before sale. The helper does not infer this from hours or
  prior-year participation, or substitute five calendar years for this period.
  Material-participant payroll is separately the five calendar years2021–2025.
  Venture-investment payroll covers the immediately preceding investment period
  under 5747.79(A)(3)(b). The direct cash investment cohort starts in 2022 or
  later, so the period touches at most five calendar years and needs no cap
  interpretation. Its verified payroll reconciliation covers the funding date
  through the day before sale, with no compensation paid on either closing
  date. Same-day payroll, a longer period, changed holdings or changes in
  management rights require further source handling. These are worksheet
  cohort limits. A completed applicable withholding-base reconciliation under
  5747.06(A) is required; this helper
  does not derive the legally applicable withholding base from gross wages,
  withholding tax amounts, addresses, or an unsupported allocation.
  Recipient IDs must be stable across the original payroll and relationship
  sources. Canonical equality uses NFKC, collapsed whitespace and uppercase;
  spelling aliases cannot turn the owner into a non-enumerated recipient or
  duplicate a recipient. An annual source must explicitly confirm this stable
  identity mapping. A separate originalPayrollRowReference identifies each
  recipient's complete aggregate row uniquely within that year's originals;
  sourceReference identifies its payroll file, which may legitimately be shared.
  Unique row references cannot independently authenticate source documents or
  detect an intentionally fabricated identity and fabricated original row.
  Finite cohort: calendar2026, one owner, one direct sale, one equal-rights
  equity class, integer units, exact finite decimal percentage of the whole
  entity sold, one complete aggregate per compensation recipient per year,
  completed original federal inclusion and exclusion reconciliation. Other
  classes, installment/netting uncertainty and conflicting sources remain
  incomplete. These cohort limits are not additional statutory disqualifiers.
  Exact Decimal arithmetic retains fractional cents. The investment branch
  computes a standalone draft worksheet only. The resident capital-gain
  integration requires material-participation sources and remains separately
  scoped. Annual form rounding, export and filing still require qualification.
lines:
  - line: "A34-source"
    description: "Admit only matching completed current sale and gain sources"
    formula: "Same2026 owner/entity/sale/disposal and reported capital gain; qualifyingGain=includedFederalAgi-otherwiseOhioDeductedOrExcluded, with 0<=excluded<=included<=reported and sale gain=reported; no other sale or uncertain inclusion/netting"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::caps payroll by the source-reconciled gain remaining in federal and Ohio AGI"
  - line: "A34-period"
    description: "Keep immediate five-year entity and material-participation conditions separate from payroll"
    formula: "For both methods, OH organization and headquarters cover saleDate minus five years through saleDate and OH trade/business at sale; for material participation, completed permitted federal assessment covers that exact interval"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::rejects missing conflicting and unsupported documentary sources"
  - line: "A34-venture-investment"
    description: "Admit a documentary direct venture capital investment in the sold operating company"
    formula: "Original matching investor/entity acquisition and cash funding of at least 1000000, acquired units equal unchanged pre-sale units; audited operating-company classification outside VCOC and original direct contract for substantial management participation or influence, in effect at investment and through sale"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::uses a documented one-million-dollar venture investment with the qualifying payroll cap"
  - line: "A34-venture-source-hold"
    description: "Require exact threshold and coherent rights, ownership and company sources"
    formula: "Missing, conflicting or below-threshold cash, unrelated owner/entity, unsupported rights/classification or interrupted holding period returns an incomplete worksheet with null monetary outputs"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::rejects incomplete and contradictory venture-investment evidence"
  - line: "A34-venture-paid-payroll"
    description: "Reconcile paid withholding compensation for the exact qualifying investment period"
    formula: "Start equals completed investment date (2022 or later), through equals day before 2026 sale, with no compensation paid on investment or sale date; one complete aggregate per recipient, same entity; reconciled5747.06(A) base subject to existing identity and family exclusions"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::requires payroll paid only within the documented venture investment window"
  - line: "A34-payroll"
    description: "Reconcile the five preceding calendar years of withholding compensation"
    formula: "Exactly2021,2022,2023,2024,2025, once each; each complete annual5747.06(A) compensation total equals sum of per-recipient qualified withholding bases, each<=gross compensation paid; non-enumerated recipients' qualifying bases summed before percentage"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::uses all five calendar years of withholding compensation rather than gross pay or withholding tax"
  - line: "A34-family"
    description: "Exclude all enumerated family compensation"
    formula: "Exclude taxpayer,spouse,parent,grandparent,child,grandchild; require completed relationship classification for every recipient; no missing relation defaults to non-enumerated"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::excludes every enumerated family relationship"
  - line: "A34-canonical-owner"
    description: "An equivalent owner ID cannot evade the taxpayer compensation exclusion"
    formula: "Canonical owner and recipient equality governs identity matching and taxpayer classification; a case-only taxpayer alias marked non-enumerated is incomplete"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::rejects the taxpayer relabeled as a non-enumerated case alias"
  - line: "A34-original-payroll-row"
    description: "One original recipient row cannot be counted twice under different aliases"
    formula: "Require unique canonical recipient IDs and unique canonical original payroll-row references within each annual record; file references may be shared but do not identify distinct rows"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::rejects an unchanged original payroll row copied under a different recipient alias"
  - line: "A34-canonical-duplicates"
    description: "Canonical duplicate identities cannot create a second payroll amount"
    formula: "Reject recipient or original-row identity duplicates after NFKC normalization, whitespace collapse and uppercase, even when the submitted spelling, other identity or annual reconciled total changes"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::rejects canonical duplicate recipient and original row identities"
  - line: "A34-shared-payroll-file"
    description: "Keep a shared documentary file distinct from unique original recipient rows"
    formula: "Matching canonical owner/entity/sale spellings remain equivalent; different original recipient rows may share one payroll-file reference without losing the family exclusion or changing the deduction"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::reconciles canonical identities and distinct rows from a shared payroll file"
  - line: "A34-percentage"
    description: "Multiply by the percentage of the entire entity sold"
    formula: "totalUnits*percentageOfEntireEntitySold=unitsSold*100; unitsSold<=ownedUnitsBefore<=totalUnits; deductiblePayroll=qualifyingPayroll*percentageOfEntireEntitySold/100, not the fraction of the taxpayer's personal holding disposed"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::uses whole-entity ownership sold and preserves exact fractional cents"
  - line: "A34-cap"
    description: "Apply the per-entity lesser-of cap for this single sale"
    formula: "deduction=min(qualifyingGain,deductiblePayroll); exact known zero remains zero when all source facts are complete"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::preserves known zero and the gain and payroll caps"
  - line: "A34-hold"
    description: "Missing or conflicting sources remain incomplete without invented amounts"
    formula: "Invalid or inconsistent documentary packet returns all money=null, empty audit, fixed incomplete reason; no input echo; every result retains calculationStatus=incomplete,filingQualified=false,exportAllowed=false"
    testRef: "tests/engine/state/oh-2026-qualifying-capital-gain-draft.test.ts::keeps all gates closed and never echoes documentary identities"
