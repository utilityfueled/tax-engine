form: "Guided PA royalty historical MI source projection guards"
taxYear: 2025
reference: "https://www.michigan.gov/-/media/Project/Websites/taxes/Forms/IIT/TY2025/MI-1040-Book.pdf"
sourceRetrieved: "2026-11-03"
notes: "Web-only documentary successor: validate exactly full old/current federal originals, property/use/paid receipt originals, actual filed AGI and complete expense correction evidence before strict B projection. One primary single2025 nonbusiness cash copyright property; no inferred agency review, automatic history refresh or added tax method."
lines:
  - line: "positive"
    formula: "Initial and corrected actual source records admit strict B projection after all independent historical/current evidence matches; saved raw history retained unchanged."
    testRef: "tests/guided-interview/guided-pa-royalty-history-guards.test.ts::projects exact canonical settlement only after validating retained history"
  - line: "guards"
    formula: "Every known false, missing, contradictory, future, stale, wrong-owner/year original or duplicate/unsupported source shape denies rather than inventing a fact. Source references and boolean alone do not prove unchanged MI utilization/tax effect."
    testRef: "tests/guided-interview/guided-pa-royalty-history-guards.test.ts::rejects contradictory or incomplete actual history: %s"
  - line: "confirm"
    formula: "Explicit confirmation binds only current original snapshot fields. It never rewrites filed history, actual award/receipt/account or correction records. Read replay never confirms."
    testRef: "tests/guided-interview/guided-pa-royalty-history-guards.test.ts::explicit confirmation preserves filed and correction originals"
  - line: "read-unknown"
    formula: "Null top confirmation stays unknown on read; only explicit action can set it true after all actual records validate."
    testRef: "tests/guided-interview/guided-pa-royalty-history-guards.test.ts::read never supplies an unknown confirmation"
  - line: "pdf-lineage"
    formula: "Prepared canonical PA ScheduleE lineage replays exact validated canonical composer; its11000/netRentalIncome11000 are asserted on reference export. Existing legacy context remains independently supported. No PDF created by this control."
    testRef: "tests/pdf/pa-royalty-canonical-context.test.ts::prepared canonical royalty context admits exact canonical Schedule E lineage"
  - line: "pdf-stale"
    formula: "Original source changed after preparation denies; prepared context is neither a raw boolean nor a forged source substitute."
    testRef: "tests/pdf/pa-royalty-canonical-context.test.ts::prepared canonical royalty context rejects changed originals"
