form: "PA Ordinary Investment Sources"
fullName: "Actual ordinary personal bank interest and dividend distribution originals through all three residency categories"
taxYear: 2025
reference: "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40b.pdf"
notes: |
  Refreshed actual2025 PA40A/B instructions and PA40IN on2026-11-02; exact public bytes and hashes retained privately.
  A official SHA dd32da96a856d033725e772c9a7dc4339131b4abe776e4caa4e7de722c0cbfce.
  B official SHA c6d8f5cdd63045e1e40b6deeced2c80b23006b7700befe3b8f0c430f2b40a0d4.
  Source-bound extension only: ordinary personal investments for one confirmed primary owner.
  Spouse, business/working-capital investments, return of capital, foreign/repatriation,
