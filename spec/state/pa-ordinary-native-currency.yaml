reference: "https://www.pa.gov/agencies/revenue/resources/tax-types-and-information/personal-income-tax/pennsylvania-personal-income-tax-guide.html"
notes: |
  No tax law, rounding or canonical source schema change. Native CurrencyField
  blur formats thousands with commas; only monetary callbacks in the ordinary
  panel remove UI currency decoration before retaining canonical source strings.
  The existing parseCurrencyInput helper performs string operations, not Number
  or floating-point arithmetic. Blank stays blank, zero stays explicit, invalid
  text is not converted to zero, and edits still clear source confirmation.
  Textual references and strict canonical monetary admission remain unchanged.
