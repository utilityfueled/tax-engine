form: "PA-Married-Native-Browser"
fullName: "Actual desktop/mobile J and separately owned M native source lifecycle"
taxYear: 2025
reference: "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40in.pdf"
notes: |
  Native actual source successor at exact a06b909c. Official2025 instructions
  refreshed before implementation/output. Independent Decimal whole-dollar
  oracles: J80000 tax2456/WH2456; M50000/30000 tax1535/921 and WH1535/921.
  All requested refunds/credits/donations/due zero from actual stated elections.
  Same actual federal MFJ household and80kAGI. No synthetic owner federal input,
  combined M PA40, aggregate M cash, model/service use or filing qualification.
  Production-managed browser config and all prior tests/gates stay unchanged.
lines:
  - line: "blank-origin"
    formula: "Seed only separately supplied unrelated federal originals, never PA married/residency/ordinary/completion roots or completed PA state section. Add the actual married draft through its button; year/choice/owner rows/wages/elections/confirmation start absent or unknown. Actual blank confirmation validation, save and reload cannot fill them."
    testRef: "apps/web/tests/pa-married-native.spec.ts::originates actual married sources and preserves owned results through edit review and reopen"
  - line: "actual-owners"
    formula: "Through visible controls add both actual owner calendars, cohabitation, PA domicile/abode/day/school records, SP2through10 known-none originals and individual complete payment/prior histories; no inferred source facts from a checkbox, owner name or displayed tax."
    testRef: "apps/web/tests/pa-married-native.spec.ts::originates actual married sources and preserves owned results through edit review and reopen"
  - line: "actual-wages"
    formula: "Each native indexed W2 source has an actual owner, known current ordinary original and dated payroll with raw wages50000 or30000, actual PA services same and outside0. Raw withholding1535/921 remains separately owned, never scaled/split from an aggregate."
    testRef: "apps/web/tests/pa-married-native.spec.ts::originates actual married sources and preserves owned results through edit review and reopen"
  - line: "j-m-literals"
    formula: "Explicit J produces one actual return: taxable80000/tax2456/WH2456. Explicit M produces two actual returns: primary50000/tax1535/WH1535 and spouse30000/tax921/WH921. Explicit per-return refund/nextyearcredit/donations/due all0. Federal staysactualMFJ/AGI80000, no aggregate M state tax/refund/due scalar or invented owner federal result."
    testRef: "apps/web/tests/pa-married-native.spec.ts::originates actual married sources and preserves owned results through edit review and reopen"
  - line: "fresh-edit"
    formula: "A real native equal-money primary employer-name edit revokes PA source confirmation. Existing original federal/owner/W2 commitments remain unchanged across read and reload. Only the actual revised source-reference entry and explicit reconfirmation may bind the newly reviewed original; monetary literals and spouse records remain exact. No postedit storage refresh or mocked calculation."
    testRef: "apps/web/tests/pa-married-native.spec.ts::originates actual married sources and preserves owned results through edit review and reopen"
  - line: "review-reopen"
    formula: "Actual review, completion and full-workspace sync/reopen preserve both source rows, current confirmations, raw whole-dollar originals and separately owned elections. Current actual display shows J one return or M two distinct owner results with actual amounts; save never fuses accounts or silently revises a documentary history."
    testRef: "apps/web/tests/pa-married-native.spec.ts::originates actual married sources and preserves owned results through edit review and reopen"
  - line: "physical-denial"
    formula: "Actual synthetic same-origin DownloadReviewPDF request to the same filled-return endpoint returns400 with existing public guard message and zero download/file. Internal source boundary requires actual separately owned PA40/SP review successor; visible draft/no-filing qualification remains truthful. No physical married packet or household PA40 is manufactured."
    testRef: "apps/web/tests/pa-married-native.spec.ts::originates actual married sources and preserves owned results through edit review and reopen"
  - line: "geometry-privacy"
    formula: "Desktop1280x900 and mobile390x844 capture and inspect initial blank source validation, populated/confirmed, actual invalidated edit, review and reopen phases. Measure document plus actual panel/label/control/button horizontal containment; inspect scrolled phase-anchor visibility and screenshots. No JSON textarea, page errors, unexpected HTTP/console errors, private external transmission or provider calls. Exact expected same-origin400 is classified separately."
    testRef: "apps/web/tests/pa-married-native.spec.ts::originates actual married sources and preserves owned results through edit review and reopen"
  - line: "actual-caller-normalized-status"
    formula: "The real shell passes mapFilingStatus(mfj), married_filing_jointly. With no married packet this normalized status must expose the blank native household source action and preserve unknown source facts after creation. Retain raw mfj compatibility; single without a packet keeps ordinary single collectors; retained married originals stay visible for review even if current status differs. No source confirmation or arithmetic changes."
    testRef: "tests/apps/web/pa-married-native-browser-boundary.test.tsx::actual shell normalized MFJ status exposes blank married source origin"
  - line: "legacy-caller-status"
    formula: "Legacy raw mfj callers retain the blank married source origin without synthesizing a packet."
    testRef: "tests/apps/web/pa-married-native-browser-boundary.test.tsx::legacy raw MFJ status retains blank married source origin"
  - line: "single-caller-status"
    formula: "Actual mapped single status with no married source root shows the single residency collector and does not offer married source origin."
    testRef: "tests/apps/web/pa-married-native-browser-boundary.test.tsx::actual single status without married originals retains ordinary collector"
  - line: "retained-married-status"
    formula: "Current single status never hides or replaces an existing actual married source packet; retained original owners and monetary strings remain exact until explicit user review."
    testRef: "tests/apps/web/pa-married-native-browser-boundary.test.tsx::retained married originals remain visible under a changed current status"
  - line: "separate-ticker-scroll-boundary"
    formula: "The actual separately owned M ticker retains both complete owner results and federal result, but its wrapper scrolls with the page so its tall owner panels cannot overlay the interview content. Apply the separate-only nonsticky mode to both ready and computing render branches; current single/J and cleared separate preview retain their existing sticky class. Actual desktop/mobile screenshot and center-uncovered geometry assertions remain unchanged."
    testRef: "tests/apps/web/pa-married-native-ticker-geometry.test.tsx::actual separate M ticker scrolls with the page and retains both accounts"
  - line: "separate-ticker-computing-boundary"
    formula: "The computing branch with retained actual separate results also uses the nonsticky separate-only mode and preserves both original owner amounts."
    testRef: "tests/apps/web/pa-married-native-ticker-geometry.test.tsx::computing separate M ticker retains the same nonsticky owner mode"
  - line: "scalar-ticker-scroll-boundary"
    formula: "An actual J scalar state preview retains the original sticky wrapper and has no separate-mode class or separately owned M panels. No unrelated single/OH ticker mode is changed."
    testRef: "tests/apps/web/pa-married-native-ticker-geometry.test.tsx::actual J scalar preview retains the existing sticky mode"
  - line: "cleared-separate-ticker-scroll-boundary"
    formula: "After current separate metrics become unavailable, the federal-only fallback removes the separate nonsticky mode and all stale owner panels without inventing aggregate M cash."
    testRef: "tests/apps/web/pa-married-native-ticker-geometry.test.tsx::cleared separate preview removes stale owner mode and panels"
  - line: "review-download-live-feedback"
    formula: "The same advanced-workspace Return status polite live region is mounted exactly once in the common top review controls for both completed-review and upload flows. Its unchanged message priority remains storageMessage then documentStatusMessage. Actual rejected married review download shows only the existing public generic400 message, no internal source details or file. Actual prior browser400 followed by missing-region RED is retained; no guard, monetary result or source history changes."
    testRef: "apps/web/tests/pa-married-native.spec.ts::originates actual married sources and preserves owned results through edit review and reopen"
  - line: "actual-guided-ticker-scroll-boundary"
    formula: "The actual guided interview owns its own ticker wrapper in addition to the advanced workspace ticker. Its current separate M owner summary uses the same separate-only nonsticky class, preserving all owner rows and federal/source amounts. Real actual-confirmed desktop M center-uncovered geometry RED remains the control, and every existing nine-phase desktop/mobile geometry, reload, privacy and public400/no-download assertion stays unchanged. No mobile failure is inferred from unrun cases."
    testRef: "apps/web/tests/pa-married-native.spec.ts::originates actual married sources and preserves owned results through edit review and reopen"
