form: "PA dividend collector independent review"
fullName: "Independent current original, exact receipts and native confirmation boundaries"
taxYear: 2025
reference: "https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide/dividends; https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40b.pdf"
notes:
  - "Read-only review of exact collector six; no author source edit or expansion of tax method."
  - "Official PIT guide personal NR exemption and PY actual receipt dates support new independent June30/July1 literal cases. RIC capital distributions remain dividend class; raw cents stay exact before existing printed line rules."
lines:
  - line: "strict-draft"
    formula: "Unknown original/year/classification/credit facts remain unknown; strict schema rejects scalar override and wrong typed year."
    testRef: "tests/apps/web/pa-dividend-independent.test.tsx::independent dividend drafts stay strict fresh and unknown"
  - line: "mixed-confirmation"
    formula: "Mixed fact/confirmation patch revokes confirmation and cannot bind current originals."
    testRef: "tests/apps/web/pa-dividend-independent.test.tsx::independent mixed fact and confirmation patch cannot bind or retain confirmation"
  - line: "raw-strings"
    formula: "Draft editing and JSON keep exact large raw cents without arithmetic."
    testRef: "tests/apps/web/pa-dividend-independent.test.tsx::independent exact raw currency strings survive draft edits and JSON without arithmetic"
  - line: "all-three-receipts"
    formula: "Fictional June30 1.01ordinary+0.50RIC and July1 1.00ordinary+0.51RIC sum3.02; resident raw3.02, PYJuly1 resident raw1.51/excluded1.51, NRraw0/excluded3.02."
    testRef: "tests/apps/web/pa-dividend-independent.test.tsx::independent actual June30 and July1 receipts preserve raw cents in %s"
  - line: "stale-originals"
    formula: "Changed payer, owner, year, duplicate index or unreconciled credits block replay without refreshing saved originals."
    testRef: "tests/apps/web/pa-dividend-independent.test.tsx::independent retained current original rejects %s without read refresh"
  - line: "selection"
    formula: "Selecting an actual original does not infer year, zero, classifications or snapshots; selector omits private IDs; missing original context cannot confirm."
    testRef: "tests/apps/web/pa-dividend-independent.test.tsx::independent original selection never fills unknown facts or exposes private IDs"
  - line: "native-edits"
    formula: "Each existing native fact control resets row and packet confirmations, retains originals and unrelated wages/banks, blocks replay."
    testRef: "tests/apps/web/pa-dividend-independent.test.tsx::independent native edit revokes both confirmations for %s"
  - line: "explicit-binding"
    formula: "Row answer retains stale snapshot; only explicit packet confirmation binds changed current original before replay."
    testRef: "tests/apps/web/pa-dividend-independent.test.tsx::independent row answer cannot refresh changed originals before explicit packet confirmation"
  - line: "zero-reopen"
    formula: "Knownzero ordinary amount survives reopening without filling missing capital amount/date/year or triggering writes."
    testRef: "tests/apps/web/pa-dividend-independent.test.tsx::independent knownzero credit survives reopening while every other unknown remains unknown"
