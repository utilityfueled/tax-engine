form: "IL-1040 Use Tax Worksheet"
fullName: "Illinois Use Tax Worksheet (IL-1040 Line 21)"
taxYear: 2025
reference: "https://tax.illinois.gov/forms/incometax/currentyear/individual/il-1040-instr/step-7---other-taxes.html"

notes: |
  Illinois use tax applies to out-of-state purchases where IL sales tax was not
  collected. Taxpayers can either:
    1. Use the UT Table (standard amount based on federal AGI)
    2. Calculate actual use tax from the UT Worksheet

  UT Table (based on federal AGI):
    $0 – $10,000:         $3
    $10,001 – $20,000:    $8
    $20,001 – $30,000:    $13
    $30,001 – $40,000:    $18
    $40,001 – $50,000:    $23
    $50,001 – $75,000:    $31
    $75,001 – $100,000:   $44
    Over $100,000:        AGI × 0.0005 (rounded to nearest dollar)

  The table provides estimated use tax for minor/unrecorded out-of-state
  purchases. Taxpayers with major out-of-state purchases or receipts should
  use the UT Worksheet instead.

  Actual use tax rates:
    General merchandise: 6.25% (state portion only)
    Qualifying food, drugs, medical appliances: 1.00%

  If total use tax exceeds $600 ($1,200 MFJ), the taxpayer must file Form
  ST-44 separately and enter $0 on IL-1040 Line 21.

  The table has been stable for many years and applies unchanged for 2025.

lines:
  - line: "table"
    description: "UT Table — standard use tax amount based on federal AGI"
    formula: "Lookup AGI in table brackets; over $100K: AGI × 0.0005"
    reference: "IL-1040 Instructions, Step 7, UT Table"
    edgeCases:
      - "Zero or negative AGI: $0"
      - "AGI exactly at bracket boundary uses lower bracket (e.g., $10,000 → $3)"
      - "AGI over $100,000: multiply by 0.05%, round to nearest dollar"
      - "Very high AGI (e.g., $1M): $500"
    testRef: "tests/engine/state/il-use-tax.test.ts::UT Table — AGI $0 returns $3"

  - line: "UT-1"
    description: "UT Worksheet Line 1 — cost of out-of-state purchases (general merchandise)"
    formula: "Input: total purchases of general merchandise from out-of-state retailers"
    reference: "IL-1040 Instructions, UT Worksheet"
    testRef: "tests/engine/state/il-use-tax.test.ts::UT Worksheet — general merchandise at 6.25%"

  - line: "UT-2"
    description: "UT Worksheet Line 2 — general merchandise use tax"
    formula: "Line 1 × 6.25%"
    reference: "IL-1040 Instructions, UT Worksheet"
    testRef: "tests/engine/state/il-use-tax.test.ts::UT Worksheet — general merchandise at 6.25%"

  - line: "UT-3"
    description: "UT Worksheet Line 3 — cost of qualifying food, drugs, medical appliances"
    formula: "Input: total purchases of qualifying items from out-of-state retailers"
    reference: "IL-1040 Instructions, UT Worksheet"
    testRef: "tests/engine/state/il-use-tax.test.ts::UT Worksheet — qualifying food/drugs/medical at 1%"

  - line: "UT-4"
    description: "UT Worksheet Line 4 — qualifying items use tax"
    formula: "Line 3 × 1%"
    reference: "IL-1040 Instructions, UT Worksheet"
    testRef: "tests/engine/state/il-use-tax.test.ts::UT Worksheet — qualifying food/drugs/medical at 1%"

  - line: "UT-5"
    description: "UT Worksheet Line 5 — sales tax already paid to other states"
    formula: "Input: total sales tax paid to out-of-state retailers"
    reference: "IL-1040 Instructions, UT Worksheet"
    notes: "Cannot exceed Line 2 + Line 4"
    testRef: "tests/engine/state/il-use-tax.test.ts::UT Worksheet — sales tax paid to other states reduces net"

  - line: "UT-6"
    description: "UT Worksheet Line 6 — net use tax"
    formula: "max(Line 2 + Line 4 - Line 5, 0)"
    reference: "IL-1040 Instructions, UT Worksheet"
    edgeCases:
      - "Cannot be negative"
      - "If exceeds $600 ($1,200 MFJ), must file ST-44 instead"
    testRef: "tests/engine/state/il-use-tax.test.ts::UT Worksheet — sales tax credit cannot make net negative"

  - line: "21"
    description: "IL-1040 Line 21 — Use tax (from UT Table or UT Worksheet)"
    formula: "UT Table amount OR, if the taxpayer chooses the worksheet, Line 6 unless ST-44 is required"
    reference: "IL-1040 Instructions, Step 7, Line 21"
    notes: |
      If actual use tax is $600 or more ($1,200 or more if married filing jointly),
      do not report the worksheet amount on IL-1040. File Form ST-44 and enter $0
      on IL-1040 Line 21 instead.
      The supported slice returns both the raw worksheet Line 6 amount and the
      reportable IL-1040 Line 21 amount after applying the ST-44 rule.
    edgeCases:
      - "Below the ST-44 threshold, the reportable IL-1040 amount equals worksheet Line 6"
      - "At or above the ST-44 threshold, the reportable IL-1040 amount is 0"
    testRef: "tests/engine/state/il-use-tax.test.ts::UT Worksheet — ST-44 threshold zeroes the IL-1040 reportable amount"
