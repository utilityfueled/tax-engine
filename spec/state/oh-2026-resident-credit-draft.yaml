form: "Ohio2026 paid Virginia resident-credit draft"
fullName: "Current-source ordinary full-year Ohio employee credit for settled Virginia tax"
taxYear: 2026
reference: "https://codes.ohio.gov/ohio-revised-code/section-5747.05"
sources:
  - "https://codes.ohio.gov/ohio-administrative-code/rule-5703-7-03"
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.98"
