form: "Ohio ordinary Schedule C official-form review companions"
taxYear: 2025
reference: "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/itnrc-fi.pdf; https://dam.assets.ohio.gov/image/upload/v1767095693/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf"
notes: |
  Source-first NR5/PY4 finite review package, not filing qualification. Ordinary
  single-primary source method with complete annual and dated originals.
  Independent financial/physical evidence uses C100000/400000 NR/PY fixtures;
  those amounts are not a literal amount allowlist. Every canonical/source and
  zero-remaining-tax guard remains. No independent qualification is claimed
  for every admitted amount. No core/rate/model/collector changes. Full-year VA NR
  has official IT1040 plus NRC I/II/III, BUS, ADJ and Credits; PY receives all
  except IT1040 because actual residential county/district originals are absent.
  Unknown header geography remains unknown. Existing1000000 principal1877 and
  complete date-sensitive penalty facts require a separate physical method.
  Exact source-hash bundle13pages and NRC3pages; canonical source replay and
  opaque prepared identity before any template/output I/O. Raw values/identities
  never recaptured on read or altered by display redaction. Decimal money only.
lines:
  - line: "source"
    formula: "Current C/SE/federal AGI, original annual property/payroll/service receipts, actual December personal halfSE and complete known-zero current payment facts agree before output; never substitute a calculated projection for originals."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper current source preconditions remain independent"
  - line: "inventory"
    formula: "NR exact5 official companions11pages; PY exact4 header-independent companions9pages, all NRC sections included. No ScheduleW without actual statements and no fabricated PY county/district/9999. References remain separate."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper existing public API emits source-required companions %s"
  - line: "BUS1-13"
    formula: "Printed BUS2=C,1 and3-9=known0;10=sum1:9=C;11=max(0,min(10,current federal AGI));12=250000;13=min(11,12). Internal six-line ITBUS IDs are not the printed16-line form."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "BUS14-16"
    formula: "When IT1040L5=0 leave all Part3 fields blank. Otherwise14=11-13;15=min(14,IT5);16=roundDollar(15*.03). Explicit100k Part3 blank;400k133725/131825/3955."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "BUS-sources"
    formula: "List only actual single ordinary primary source; owner-name/actual description and100% sole-proprietor ownership, all SSN/FEINs blank after display redaction, no fictitious spouse/source rows."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "NRCIII-A"
    formula: "Owned average Ohio10000/everywhere20000; rented amounts known0; property ratio.500000. Payroll amounts known0/0 but ratio blank because division undefined; weight0. Property/sales reweight .25/.75; weighted .125000/.187500, factor.312500. Select actual pinned source options0.25/0.00/0.75 (unchanged exact weights), with printed old weights visibly struck, not left as conflicting defaults."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "NRCIII-B-C"
    formula: "Printed6/14=current C;15=roundDollar(4*14);18=15+17;5,7-13,16,17,19-22 actual known0. Source widget3-5 is printed6,3-17 printed18,3-21 printed22; use literal source coordinates/APs, not presumed field IDs."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "NRCII"
    formula: "First ordinary row A=C,B=0,C=III18; totals22 same;23=current BUS13 BID;24=max(0,22C-23)=0. Other rows blank; privacy redacts entity/owner identifiers."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "NRCI"
    formula: "Business5=II24, depreciation6=II22B;9=1+...+7-8; PY14A=actual7065/16275,14B=0 from December deduction outside Jan1-Jun30 Ohio domicile; NR PartB blank.16=OhioAGI;17=max(0,9+15);18=max(0,16-17);19=truncate4(min(1,18/16)) or existing zero-AGI0;20=roundDollar(Credits37*19)."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "IT1040-ADJ-Credits"
    formula: "ADJ13/47=actual BID;IT2a blank(no additions),2b=BID,3=AGI-BID,4=MAGI-based1900,5=max(0,3-4),6=BUS15,7=0,8b=BUS16. Printed Credits40=sum10+36+38+39;IT9 same nominal sum,IT10=max(0,8c-9). Engine applied cap unchanged. Actual MAGI restores BID so neither first-positive case receives nominal20 exemption credit."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "context"
    formula: "Existing optional original-review token remains optional for complete raw originals; fallback still replays canonical source snapshots. Missing canonical federal-source snapshots, forged/serialized tokens, same-cash actual identity/date/currentC edits and stale federal results reject before output. An opaque token cannot be forged, but absence alone is not a source conflict. When recovered original primary SSN is blank, this new physical method safely omits after canonical replay and before template/output IO; it retains five reference companions. This display-provenance guard neither changes tax eligibility nor makes the optional token mandatory."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper rejects source conflict before output %s"
  - line: "finite-source"
    formula: "Duplicate/unknown/unsupported originals remain unavailable even with net-zero cash. No silent signed loss/multiple owner/business/2026/special industry/precision expansion."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper canonical source refuses %s"
  - line: "overlay"
    formula: "Caller money/source overlays cannot override actual originals or create an official business method."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper rejects raw overlay before output %s"
  - line: "privacy"
    formula: "Every actual saved page review-marked, field/widget/action-free, all ordinary/compressed objects and decoded streams scanned for synthetic identifiers/private source references; every selected source field appearance exact including intended blanks and dates/statuses; parse each actual page once and retain all field assertions within unchanged deadline."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "PY-omission"
    formula: "Actual part-year dates qualify NRC/BUS financial source method but cannot invent residential county/district. No official IT1040 or ScheduleW path touched; retained sentinel bytes unchanged."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper PY omits unsupported header and withholding paths"
  - line: "cover"
    formula: "Only exact actual new BUS review basename adds truthful review-copy inventory. Preserve all8 existing recognized basenames, fake near-names denied; statuses stay partial/not-validated/nonfiling."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper cover identifies only known BUS basename %s"
  - line: "gates"
    formula: "2026 public/filing denial unchanged. Canonical1000000 case remains unchanged but does not select this zero-remaining-tax physical method."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper preserves year filing and nonzero liability boundaries"
  - line: "template-root"
    formula: "Same exact pinned year2025 blank sources resolve from pack root, already-selected year directory and actual apps/web cwd with the same explicit resolved root used by the real web caller; direct-call relative default remains compatible. Never append year twice or silently change asset root. Missing/tampered assets fail before output."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper resolves unchanged pinned template scope %s"
  - line: "template-integrity"
    formula: "Absent or hash-altered official sources deny before any output directory is created."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper refuses source templates before output %s"
  - line: "prior-cover-inventory"
    formula: "All8 previously known official-review exact basenames retain recognition and partial/not-validated/nonfiling statuses. Adding BUS cannot replace or broaden them."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper preserves prior exact review basename %s"
  - line: "group-status-completeness"
    formula: "Every selected grouped owner/filing/residency source appearance is exact (a white background fill or hollow outline is not a selected mark): single and NR only, primary business owner only; all other actual grouped choices remain Off, including absent spouse. PY has no official IT1040 status or invented header."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "opaque-projection"
    formula: "Only a locally prepared immutable WeakMap projection stages sources. Forged, JSON-serialized and copied symbol-brand objects reject with source-context error before nonexistent template root access."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper local projection token denies %s before source IO"
  - line: "opaque-staged-bytes"
    formula: "Only locally staged immutable bytes reach output. Forged or wrong-stage prepared tokens reject before mkdir; no publicly supplied scalar/projection/serialized packet is authoritative."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper local staged token denies %s before output IO"
  - line: "opaque-no-source-exposure"
    formula: "Prepared token is frozen, serializes to an empty object and contains no financial/private originals; preparation preserves the full original input."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper opaque preparation retains exact private sources"
  - line: "free-text-private-source-origination"
    formula: "Actual current business description may contain private identifiers. The exact NRC3bn widget directly declares MaxLen35 (get_fields omits it): privacy-only prefix CONSULTING and explicitly supplied short synthetic source/document originals precede confirmation, and each unmasked description must fit35 before rendering. The original58 full benign description remains unchanged. Privacy fixtures explicitly confirm changed current C, child business, parent residency and payment originals through existing native APIs; all canonical cash remains unchanged, so stale-source denial is not privacy proof."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper private description originals remain canonical"
  - line: "free-text-private-source-rendering"
    formula: "After actual source validation, render-only description masks known primary SSN (literal, compact or separator variants), actual business EIN, private source reference and original document identity with [REDACTED]. Preserve benign description text, canonical fields and every original/digest. All saved objects/decoded streams must omit the private marker; a structured-key redactor is not a free-text anonymizer."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved description masks actual private source %s"
  - line: "source-field-display-formats"
    formula: "Exact pinned NRC direct date widgets have MaxLen8 and mm dd yy source format: display actual2025-01-01/2025-06-30 as01 01 25/06 30 25. NRC19 MaxLen5 conflicts with6-character1.0000; exact capped endpoint displays lossless1 while canonical ratio retains1.0000 and other fractional displays retain four decimal digits. All390 source rectangles, dates, monetary values and source snapshots unchanged."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
  - line: "optional-raw-original-review-context"
    formula: "Existing public API accepts complete raw originals without a separately prepared token, then freshly verifies current federal/C/owner/source snapshots. Do not invent a blanket token or personSSN guard for this review-only method. The absent-token negative was an author-control erratum, replaced by missing actual canonical federal-original snapshot."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper complete raw originals retain optional review context"
  - line: "physical-description-private-original-provenance"
    formula: "Only this finite official-business physical method requires recovered original primary SSN to be nonblank for known-private description masking provenance. After canonical/current federal, business, owner, payment and financial source replay, blank or whitespace recovered original SSN safely omits this method before template/output IO; exact existing five reference companions remain available. A separately prepared token is optional for complete RAW originals, and a valid original-context token preserves masked physical output. No new tax eligibility, global identifier requirement, source acceptance, cash or filing rule. Independent formatted/compact redacted-no-token and token-from-redacted saved controls reproduce the missing provenance; source malformation/staleness still rejects before this omission."
    testRef: "tests/pdf/oh-business-private-description-provenance.test.ts::Ohio business private description provenance remains private %s"
  - line: "printed-credits-tax-before-and-first-carry"
    formula: "Printed ScheduleCredits1 transfers actual IT1040 8c. With actual C400000 less halfSE16275, BID250000 and exemption1900, taxable business131825 times Decimal0.03 rounds3955; actual first credit group0 means printed11=max(0,3955-0)=3955. For both NR400k and PY400k, lines1/11/37/38/40 are3955 and42 other numeric rows are0. Both100k cases retain all47 numeric rows0. Four omitted own literal overrides for400k lines1/11 were an oracle erratum; preserve failed66/188PDF history, all390 rectangles and product/canonical amounts unchanged."
    testRef: "tests/pdf/oh-business-official-review.test.ts::actual business paper saved physical cells privacy and weights %s"
