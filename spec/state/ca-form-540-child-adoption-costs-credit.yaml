form: "California Form 540 Child Adoption Costs Credit"
fullName: "California Form 540 Child Adoption Costs Credit (Code 197)"
taxYear: 2025
irsReference: "https://www.ftb.ca.gov/forms/2025/2025-540-instructions.html"

notes: |
  California allows the Child Adoption Costs credit, code 197, for tax year
  2025 when all of the following are true:
  - The taxpayer adopted an eligible child during 2025.
  - The adoption decree became final during 2025.
  - The child was a citizen or legal resident of the United States.
  - The child was in the custody of a California public agency or California
    political subdivision.
  The 2025 Form 540 instructions direct taxpayers to use whole dollars only and
  compute the credit as follows:
  - Line 1: Qualified adoption costs
  - Line 2: 50%
  - Line 3: round(Line 1 × Line 2)
  - Line 4: min(Line 3, $2,500) current-year credit
  - Line 5: max(0, Line 3 - $2,500) carryover to future years
  Qualified costs include the total qualifying adoption costs for the child,
  including qualifying costs from an earlier unsuccessful attempt if they later
  resulted in a successful adoption of a different eligible child.

lines:
  - line: "1"
    description: "Qualified adoption costs"
    formula: "Supported input for total qualified adoption costs for the eligible child"
    inputs:
      - "Qualified adoption costs"
    testRef: "tests/engine/state/ca-form-540-child-adoption-costs-credit.test.ts::CA Form 540 Child Adoption Costs credit Line 1 - the worksheet starts from the total qualified adoption costs"

  - line: "2"
    description: "Credit percentage"
    formula: "Use the published 2025 Child Adoption Costs credit percentage of 50%"
    inputs:
      - "Tax year"
    testRef: "tests/engine/state/ca-form-540-child-adoption-costs-credit.test.ts::CA Form 540 Child Adoption Costs credit Line 2 - the 2025 worksheet uses a 50% credit rate"

  - line: "3"
    description: "Credit before the annual cap"
    formula: "If the adoption became final during 2025, the child was a citizen or legal resident of the United States, and the child was in the custody of a California public agency or political subdivision, enter round(Line 1 × Line 2); otherwise 0"
    inputs:
      - "Child Adoption Costs credit Line 1"
      - "Child Adoption Costs credit Line 2"
      - "Adoption decree became final during 2025"
      - "Child is a citizen or legal resident of the United States"
      - "Child was in the custody of a California public agency or political subdivision"
    edgeCases:
      - "A taxpayer who does not meet every qualification requirement receives 0"
      - "$4,999 of qualified costs rounds up to a $2,500 current-year credit with no carryover"
      - "$5,001 of qualified costs rounds to $2,501 before the cap"
    testRef: "tests/engine/state/ca-form-540-child-adoption-costs-credit.test.ts::CA Form 540 Child Adoption Costs credit Line 3 - qualified costs are multiplied by 50 percent and rounded to whole dollars"

  - line: "4"
    description: "Current-year credit"
    formula: "min(Line 3, $2,500)"
    inputs:
      - "Child Adoption Costs credit Line 3"
    edgeCases:
      - "The current-year credit is capped at $2,500 per eligible child"
    testRef: "tests/engine/state/ca-form-540-child-adoption-costs-credit.test.ts::CA Form 540 Child Adoption Costs credit Line 4 - the current-year credit is capped at $2,500"

  - line: "5"
    description: "Carryover to future years"
    formula: "max(0, Line 3 - $2,500)"
    inputs:
      - "Child Adoption Costs credit Line 3"
    edgeCases:
      - "Qualified costs that round above the $2,500 annual cap carry forward"
    testRef: "tests/engine/state/ca-form-540-child-adoption-costs-credit.test.ts::CA Form 540 Child Adoption Costs credit Line 5 - costs above the annual cap generate a carryover"
