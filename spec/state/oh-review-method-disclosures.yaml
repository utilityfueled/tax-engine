reference: "https://tax.ohio.gov/individual/resources/school-district-income-tax"
notes: |
  Copy only. Existing independently reviewed source methods control availability.
  Full-year Hillsdale0302 and separately qualified212OH153VA specific payroll
  admit experimental SD100/school withholding review copies only. The PY method
  requires actual Ashland/Hillsdale header originals; no-header remains omitted.
  Full-year and212-day ordinary-business headers use Columbus2503/Franklin;
  PY payroll uses Hillsdale0302/Ashland. No inferred jurisdiction or all-method
  qualification. Other scenarios require their separate supported source method.
  This package changes no arithmetic/source validation/privacy/readiness/year gates.
  Actual UI school/source/header/state-review/final-review and public support
  slots must agree. Existing full-year browser money/privacy checks are retained;
  only its obsolete physical-unavailable text assertion changes after genuine RED.
