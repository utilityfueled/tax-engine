form: "Ohio source-qualified review method disclosures"
fullName: "Truthful 2025 school and header review copy without filing promotion"
taxYear: 2025
reference: "https://tax.ohio.gov/individual/resources/school-district-income-tax"
notes: |
  Copy only. Existing independently reviewed source methods control availability.
  Full-year Hillsdale0302 and separately qualified212OH153VA specific payroll
  admit experimental SD100/school withholding review copies only. The PY method
  requires actual Ashland/Hillsdale header originals; no-header remains omitted.
  The single-location full-year header covers Columbus2503/Franklin and
  Akron7701/Summit. The 212-day ordinary-business header uses Columbus2503/Franklin
  and part-year payroll uses Hillsdale0302/Ashland. No inferred jurisdiction or all-method
  qualification. Other scenarios require their separate supported source method.
  This package changes no arithmetic/source validation/privacy/readiness/year gates.
  Actual UI school/source/header/state-review/final-review and public support
  slots must agree. Existing full-year browser money/privacy checks are retained;
  only its obsolete physical-unavailable text assertion changes after genuine RED.
lines:
  - line: "source-boundary"
    description: "Existing independently supplied PY header proves the distinct jurisdiction"
    formula: "Existing actual header API reports ASHL/0302/part_year_resident and212days from retained source originals, not mailing inference."
    testRef: "tests/apps/web/oh-review-method-disclosures.test.tsx::Ohio copy source precondition retains the actual Ashland Hillsdale212 method"
  - line: "school-native"
    description: "School source panel qualifies experimental paper review narrowly"
    formula: "Full-year0302 or212OH153VA specific payroll only; PY header required; broader/incomplete paper unavailable; filing unavailable; unknown/zero/year warnings retained."
    testRef: "tests/apps/web/oh-review-method-disclosures.test.tsx::Ohio school source copy distinguishes qualified review and unavailable broader methods %s"
  - line: "header-native"
    description: "Header source panel distinguishes actual jurisdictions"
    formula: "A single resident at one full-year location in Columbus2503/Franklin or Akron7701/Summit. The 212OH153VA ordinary-business method uses Columbus and payroll uses Hillsdale0302/Ashland. Actual source documents are required and filing is unavailable."
    testRef: "tests/apps/web/oh-review-method-disclosures.test.tsx::Ohio header source copy distinguishes actual business and payroll jurisdictions"
  - line: "state-review"
    description: "Actual state preview displays current qualified review limits"
    formula: "School amounts remain1000tax/1100withheld/100refund separate from IT1040; truthful review-only availability appears in the school region."
    testRef: "tests/apps/web/oh-review-method-disclosures.test.tsx::Ohio state review copy retains actual school amounts and source-qualified paper limits"
  - line: "final-review"
    description: "Actual final summary displays the same limits"
    formula: "Same qualified experimental review scope and filing denial, actual school amounts/unknown privacy behavior unchanged."
    testRef: "tests/apps/web/oh-review-method-disclosures.test.tsx::Ohio final review copy retains actual school amounts and source-qualified paper limits"
  - line: "public-support"
    description: "Public 2025 support accurately bounds PY paper"
    formula: "Only qualified212OH153VA payroll with actual Ashland/Hillsdale header; no-header/other methods unavailable;2025filing remains unavailable."
    testRef: "tests/apps/web/oh-review-method-disclosures.test.tsx::Ohio public support discloses the finite payroll paper method without year or filing promotion"
  - line: "public-support-2026-sources"
    description: "Public 2026 support discloses available guided source work in Pennsylvania and Ohio"
    formula: |
      Disclose capture and confirmation of a Pennsylvania earned income
      credit child inventory with no qualifying children, as scoped in
      state/pa-2026-childless-eic-dependency.yaml. Disclose confirmation of Ohio
      earned-income school district sources and the district rate, resident
      compensation and school withholding preview for supported full-year
      employee cases, as scoped in state/oh-2026-school-sources.yaml. All 2026
      rows retain fact saving and encrypted local backup availability and disclose
      that full return calculations, PDFs and filing are unavailable.
    testRef: "tests/apps/web/oh-review-method-disclosures.test.tsx::public 2026 support discloses Pennsylvania and Ohio source work without promoting returns"
  - line: "public-support-2026-state-residency"
    description: "State draft methods and public availability appear separately in the 2026 support matrix"
    formula: |
      Identify Pennsylvania PA-40 and Ohio IT 1040 draft methods under review
      for full-year resident, part-year resident and nonresident returns. Describe
      ordinary wages, bank interest and ordinary dividends as selected draft
      scenarios. Scope Ohio IT NRC credit work to selected part-year and
      nonresident cases. Preserve the existing guided fact previews and show that
      full calculation, PDF and filing outputs remain unavailable across both states.
    testRef: "tests/apps/web/tax-year-support.test.tsx::publishes the selected 2026 state forms and draft residency methods without offering return outputs"
