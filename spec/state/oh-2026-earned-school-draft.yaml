form: "Ohio2026 distinct earned-school employee parent draft"
fullName: "Original-bound state and earned-school withholding-covered composition"
taxYear: 2026
reference: "https://codes.ohio.gov/ohio-revised-code/section-5748.01/1-1-2026"
sources:
  - "https://codes.ohio.gov/ohio-revised-code/section-5703.055"
  - "https://codes.ohio.gov/ohio-revised-code/section-5748.06"
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.09"
  - "https://dam.assets.ohio.gov/image/upload/v1735926149/tax.ohio.gov/forms/school_district_income/2026/sd100es-instructions-fi.pdf"
notes: "Finite single full-year under65 ordinary wages only, actual annual earned district and no-child EIC phaseout proof. Separate parent method; original no-school method and source-only packet remain unchanged. No final2026 SD100 identity/numbering, federal return, filing or human qualification."
lines:
  - line: "current-parent"
    description: "Full actual current sources and separate opaque school proof"
    formula: "Bind whole original input, owner/year/address/Finder/local original rows/payroll/employment and state payments. Same exact employment inventory in parent and school packet; never rewrite a no-school assertion. Ordinary source qualifier admits school status and local rows only through validated opaque school branch."
    testRef: "tests/engine/state/oh-2026-earned-school-draft.test.ts::composes independent literal school and state drafts"
  - line: "earned-base"
    description: "Full resident compensation rather than Ohio exemption-reduced income"
    formula: "RC5748.01(E)(2),(F),(G): sum actual resident ordinary wages included in MAGI, no personal exemption deduction. School original context supplies exact annual district rate and actual withholding; under65 establishes senior credit0 under5748.06."
    testRef: "tests/engine/state/oh-2026-earned-school-draft.test.ts::uses literal independent base and rounding boundaries %s"
  - line: "rounding-election"
    description: "Explicit whole-dollar document election with raw originals preserved"
    formula: "RC5703.055: actual roundingElection whole_dollars and confirmation required; aggregate each cash category before HALF_UP nearest-dollar reporting. Round wage base, multiply reported base by exact annual rate then round tax, aggregate school withholding then round. Preserve exact raw wages*rate and raw withholding for separate conservative coverage checks; no floating point or caller precision change."
    testRef: "tests/engine/state/oh-2026-earned-school-draft.test.ts::uses literal independent base and rounding boundaries %s"
  - line: "separate-payments"
    description: "Actual independent school account and chronology without state cash mixing"
    formula: "Complete separate owner/SSN/year/SD100/district account and input/school snapshots, all payments known, no estimates/prior return/carry, credited amounts0, outgoing0, original regular calendar return, no extension. Account asOf=current asOf, actual timely Jan1-Apr15,2027 expected/filed chronology; no inferred absent amount/date zero. State IT1040 sources remain complete and separately cover state tax."
    testRef: "tests/engine/state/oh-2026-earned-school-draft.test.ts::rejects incomplete contradictory school payment originals %s"
  - line: "coverage-and-settlement"
    description: "Conservative actual separate and combined withholding coverage"
    formula: "Require raw school withholding>=raw wage*rate and reported school withholding>=reported school tax, plus independently covered state liability. Under5747.09 equal-quarter compensation withholding covers each and combined current tax, so installment penalty0. Timely fully covered original return yields late interest0 and amountDue0; reported schoolrefund=reported schoolwithholding-schooltax, separate from state refund. External account settlement remains unobserved/null, no balance receipt or cross-account netting."
    testRef: "tests/engine/state/oh-2026-earned-school-draft.test.ts::keeps school withholding separate from state tax and rejects cross netting"
  - line: "privacy-and-currentness"
    description: "Current source-bound capabilities and no identity or references in public result"
    formula: "Opaque context validates original lexical/source changes, cloned capabilities and changed input before calculation. New payment snapshots replay all originals; no taxpayer SSN/name/address/payroll/employer reference/account confirmation in result/audit. Input and caller Decimal configuration immutable."
    testRef: "tests/engine/state/oh-2026-earned-school-draft.test.ts::rejects same cash stale originals and protects private source identities"
  - line: "compatibility-and-gates"
    description: "No promotion of old source-only or broad year paths"
    formula: "Plain school packet still denied by ordinary composer. Historical2025, old no-school ordinary/reciprocal/VAcredit/business paths and public final2026 refusal unchanged. Single FY earned under65 withholding-covered only; all other methods require separate actual originals."
    testRef: "tests/engine/state/oh-2026-earned-school-draft.test.ts::preserves original ordinary and school source-only gates"
