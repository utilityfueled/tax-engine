form: "Ohio IT NRC Section I — actual owner residency and nonbusiness sources"
taxYear: 2025
reference: "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/itnrc-fi.pdf"
notes: |
  Source-first finite Section I method, refreshed 2026-11-02. Current official
  final form is2025. The same isolated statutory allocation method can be tested
  for2026, without enabling its complete Ohio return or unqualified form map.
  Each owner has actual complete nonoverlapping calendar domicile periods and
  separately identified source amounts. Missing is unknown; explicit0 survives.
  Full-year resident spouse must include all their income in columnB on a joint
  return with a nonresident/partyear spouse, including PartB categories.
  State adjustment original totals are named fullAmount, distinct from federal
  income-category federalAmount; an addition need not be federally included.
  Nonnegative ordinary wage/pension/interest sources cannot allocate more than
  their actual full source amount; signed capital/rent remain exempt from this
  blanket inequality. Public canonical allocation cannot ignore any actual Ohio
  addition or deduction; unsupported nonzero exclusion allocations reject.
  Business SectionsII/III are a separate internal successor. Actual C/F/K1/SE,
  business rents, and20percent PTE compensation are not silently treated as0.
  Official sources:2025booklet pp13,33,35-40; R.C.5747.05(A),(C),(D),5747.20.
lines:
  - line: "1"
    label: "Compensation and guaranteed payments"
    formula: "Sum actual resident compensation + Ohio-service nonresident compensation, excluding amounts already deducted on adjustment lines14,21,32,33,38. No address/stateWages inference."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "2"
    label: "Nonbusiness capital gains/losses"
    formula: "Resident receipts plus actual Ohio real/tangible property gains/losses while nonresident; preserve finite signed amounts."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "3"
    label: "Nonbusiness rents and royalties"
    formula: "Actual resident receipts plus Ohio-property/utilization allocated nonresident receipts. Canonical rental classification needs a separate admitted method."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "4"
    label: "Lottery casino and sports gaming"
    formula: "Actual resident receipts plus qualifying Ohio gambling sources."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "5"
    label: "Ohio business income"
    formula: "SectionII result only; initial actual-nonbusiness cohort requires corroborated no business sources and knownzero."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "6"
    label: "Ohio apportioned depreciation adjustment"
    formula: "SectionII22B only; zero only from explicit no-business-source facts in initial cohort."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "7"
    label: "Ohio additions allocation"
    formula: "Actual resident/Ohio activity additions, excluding actual2025 depreciation addition line9 already in6. Actual nonqualified529 addition line4 remains a distinct allowed addition. Only actual addition lines1through11 except9 are accepted; every full addition reconciles its current state source."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "8"
    label: "Ohio deductions allocation"
    formula: "Only actual portions of ScheduleAdjustments18,19,20,30,31,37,39,44,45,46; preserve signed source values, never fabricate residual."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "9"
    label: "PartA total"
    formula: "Sum lines1through7 minus8."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "10"
    label: "Nonbusiness interest/dividends"
    formula: "Actual resident portion only; no nonresident intangible allocation; exclude ScheduleAdjustments18,26,45 deductions. Mixedjoint resident owner allA isB."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "11"
    label: "Pensions annuities IRA distributions"
    formula: "Actual resident portion only; exclude deductions16,17,34,42,43."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "12"
    label: "Unemployment"
    formula: "Actual resident portion only."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "13"
    label: "Other nonbusiness income"
    formula: "Actual resident portion only; exclude deductions15,18,28,29."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "14"
    label: "Federal above-the-line deductions"
    formula: "Actual resident portion of federal AGI deductions, from current actual sources."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "15"
    label: "PartB total"
    formula: "Sum10through13 minus14, only actual resident owner portions."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "16"
    label: "Ohio AGI"
    formula: "Actual IT1040line3, finite signed; not taxable income less exemptions."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "17"
    label: "Total Ohio allocation"
    formula: "max(0,line9+line15)."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "18"
    label: "Nonresident Ohio AGI"
    formula: "max(0,line16-line17)."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "19"
    label: "Nonresident ratio"
    formula: "For positive16 min(1,line18/line16 truncated4decimalplaces without rounding). Nonpositive16 with no positive tax gives0, not division byzero or guessed credit."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - line: "20"
    label: "Ohio nonresident credit"
    formula: "RoundDollar(line19 * actual ScheduleCredits37), capped actual available tax. Fullresident-only owners have no nonresident credit."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
businessRuleValidation:
  - rule: "actual-owner-source-allocation"
    description: "Complete owner/date/source reconciliation, unknown/zero/signed boundaries and no free credit override."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - rule: "credit-order-and-joint-resident"
    description: "Owner-specific mixedjoint and actual prior credit remainder; no householdstatus shortcut."
    testRef: "tests/engine/state/oh-it-nrc.test.ts::matches independently sourced complete20line actual nonbusiness worksheet"
  - rule: "canonical-public-source-and-gates"
    description: "Actual canonical sources bind beforeI/O; raw business/credit overrides unsupported;2026 fullgate unchanged."
    testRef: "tests/engine/state/oh-residency-source.test.ts"
