form: "California Form 540 Senior Head of Household Credit"
fullName: "California Form 540 Credit for Senior Head of Household (Code 163)"
taxYear: 2025
irsReference: "https://www.ftb.ca.gov/forms/2025/2025-540-instructions.html"

notes: |
  California allows the Senior Head of Household credit, code 163, when all of
  the following are true for tax year 2025:
  - The taxpayer was age 65 or older on December 31, 2025. A taxpayer whose
    65th birthday is January 1, 2026 is treated as age 65 on December 31, 2025.
  - The taxpayer qualified as head of household in 2023 or 2024 by providing a
    household for a qualifying individual who died during 2023 or 2024.
  - The taxpayer did not have AGI over $98,652 for 2025.
  If qualified, use the worksheet in the 2025 Form 540 instructions using whole
  dollars only:
  - Line 1: Form 540 line 19 taxable income
  - Line 2: 2%
  - Line 3: min(round(Line 1 × Line 2), $1,860)
  The official FTB credit page confirms that the credit amount is entered on
  Form 540 line 43 or line 44.

lines:
  - line: "1"
    description: "Form 540 line 19 taxable income"
    formula: "Supported input for Form 540 line 19 taxable income"
    inputs:
      - "Form 540 line 19 taxable income"
    testRef: "tests/engine/state/ca-form-540-senior-head-of-household-credit.test.ts::CA Form 540 Senior Head of Household credit Line 1 - the worksheet starts from Form 540 line 19 taxable income"

  - line: "2"
    description: "Credit percentage"
    formula: "Use the published 2025 Senior Head of Household credit percentage of 2%"
    inputs:
      - "Tax year"
    testRef: "tests/engine/state/ca-form-540-senior-head-of-household-credit.test.ts::CA Form 540 Senior Head of Household credit Line 2 - the 2025 worksheet uses a 2% credit rate"

  - line: "3"
    description: "Credit amount"
    formula: "If the taxpayer is age 65 or older on December 31, 2025, qualified as head of household in 2023 or 2024 because the qualifying individual died in 2023 or 2024, and AGI is $98,652 or less, enter min(round(Line 1 × Line 2), $1,860); otherwise 0"
    inputs:
      - "Senior Head of Household credit Line 1"
      - "Senior Head of Household credit Line 2"
      - "Age 65 or older on December 31, 2025"
      - "Qualified as head of household in 2023 or 2024 because the qualifying individual died in 2023 or 2024"
      - "AGI for qualification"
    edgeCases:
      - "AGI of exactly $98,652 still qualifies"
      - "AGI of $98,653 does not qualify"
      - "The credit is capped at $1,860"
      - "A taxpayer who does not meet every qualification requirement receives 0"
    testRef: "tests/engine/state/ca-form-540-senior-head-of-household-credit.test.ts::CA Form 540 Senior Head of Household credit Line 3 - AGI at the threshold still qualifies and the credit is capped at $1,860"
