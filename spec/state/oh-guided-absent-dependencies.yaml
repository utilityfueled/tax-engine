form: Ohio guided inactive source dependency work
fullName: Preserve confirmation semantics while skipping unused packet projections
taxYear: 2026
reference: docs/upgrade-2026-execution-brief.md
notes: |
  UI dependency scheduling only. No tax formula, Decimal arithmetic, source
  validation, readiness or confirmation rule changes. Business and resident-credit
  dependency projections are used only to invalidate their respective current
  incoming child packets. Evaluate those child-only projections lazily behind
  the same current-packet condition. General residency/payment/school/reciprocal
  and header comparisons continue unchanged, including packet removal.
  Keep active, stale and malformed packet comparisons and all original snapshots.
  No retained cache, object identity shortcut or automatic source confirmation.
