form: "Guided-PA-Complete-Zero-Business"
fullName: "Explicit fictional current PA business sources preserving the existing zero-income withholding positive"
taxYear: 2025
reference: "https://www.pacodeandbulletin.gov/secure/pacode/data/061/chapter111/s111.4.html"
notes: |
  Fixture-only source completion; no new calculation, source method, defaults or legal qualification.
  Preserve the old eight titles, twenty-seven assertion lines, raw zero NEC income,
  PA.10/NY.20 then PA.10/PA.20, original payer/TIN/primary owner and returnyear2025.
  New independently explicit fictional original-year documents supply2025 ONLY in the
  complete positive setup. Original unknown-year/raw incomplete case remains retained.
  New actual complete resident PA books, no NY domicile/operations, original IT2030,
  remittance.20, refundreceived0/outstanding.20, complete ordinary dates/payments/local/
  eligibility sources are separately supplied, never inferred from zero income or WH.
  After the explicit NY→PA original correction, independently supplied allPA originals,
  completeNYknownzero account history and no pendingNY packet are newly confirmed.
  Reads never confirm/rebind; pending actual cash is not zero liability/refund receipt.
  Current normal bridge must replay exact sources. If it cannot, retain the actual failure
  and request a bounded product successor; never work around the production path.
