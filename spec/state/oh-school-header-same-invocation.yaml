form: "Ohio current school-to-header source replay"
taxYear: 2025
source: spec/state/oh-return-header-sources.yaml
notes: >-
  Source validation performance only. One actual completed full school adapter may
  supply an opaque synchronous input-and-federal-material-bound school method proof
  to the immediately following header adapter guard. Every prior guard and header
  fresh federal calculation remains. A separate finite guided render case can
  consume the original no-header school adapter result once. Changed or expired
  contexts run the original full adapter; final header-added preview input is distinct.
lines:
  - line: "same-invocation"
    description: Complete original replay and immutable proof scope
    formula: exact current canonical input and fresh federal material equality, then validated school method; otherwise original full replay
    testRef: "tests/guided-interview/oh-school-header-same-invocation.test.ts::complete current school header replay %s"
  - line: "observed-work"
    description: Original complete guided render work-count assertion preserves all expected outputs
    formula: OH school header fresh federal seven and school two; unrelated PA four and zero unchanged
    testRef: "tests/guided-interview/guided-render-evaluation.test.ts::shares only one actual current source evaluation %s"
  - line: "header-school-current-parents"
    description: Validate the current residency and payment records once during header entry or confirmation
    formula: "For one header replay with the native school district, validate the original residency and payment drafts once and use those base results in the same synchronous school replay. Validate any header resident-credit child before using the school result, preserve the standalone school replay, and keep the incomplete header out of the state totals while its separately confirmed school display remains available. Only the explicit confirmation action captures header originals."
    testRef: "tests/guided-interview/oh-school-header-same-invocation.test.ts::replays each current parent once during incomplete entry and confirmation %s"
  - line: "pending-header-school-federal"
    description: Reuse the current federal calculation for the exact school and residency adapter input during pending guided rendering
    formula: >-
      Within one guided render of a 2025 single part-year payroll return with
      an explicitly unconfirmed header and no resident-credit child, calculate
      federal tax once from the privately owned, immutable canonical Ohio school
      input, including its actual residency and payment packets. Preserve both
      stale-result checks at their original positions. Each check serializes the
      complete redacted federal result once when its comparison operands are the
      identical privately generated pending-header result. Distinct results and
      Schedule A preliminary calculations retain the original two-operand
      comparison. Preserve the full school and
      residency validation, the existing school method proof and the separate
      base federal preview. Standalone actions, nonplain material and inputs
      outside this scope retain independent federal replays. The next render
      repeats all validation using the newly projected input.
    testRef: "tests/guided-interview/oh-school-header-same-invocation.test.ts::calculates federal tax once for the same pending school and residency input %s"
  - line: "schedule-a-preliminary-result"
    description: Keep both canonical reads of a supplied Schedule A preliminary result
    formula: Only the pending-header adapter owns its result. The preliminary callback path retains both reads and rejects a result that changes between them.
    testRef: "tests/guided-interview/oh-school-header-same-invocation.test.ts::rejects a changing Schedule A preliminary result even with the same object identity"
  - line: "pending-header-school-fallback"
    description: Preserve admission order and method proof during pending guided rendering
    formula: >-
      Reject invalid or unconfirmed school facts before observing the school or
      reporting the pending header. A successful school replay still builds the
      existing adapter proof before the header rejection. Unsupported canonical
      material uses the original independent calculations and existing proof rules.
    testRef: "tests/guided-interview/oh-school-header-same-invocation.test.ts::keeps pending header rejection and the earlier invalid school guard in order"
  - line: "pending-header-schema-rejection"
    description: Skip redundant parsing of a still-unconfirmed header during the existing part-year school render replay
    formula: >-
      In the existing pending guided render case, finish current school
      validation and report its acceptance to the caller first. If the header
      still has its own data property set to null for explicit confirmation,
      return the established incomplete-header error before normalizing and
      parsing the whole header. Preserve an earlier school error, the accepted
      school display, and the ordinary header schema path for confirmed,
      legacy, changed, and standalone inputs.
    testRef: "tests/guided-interview/oh-school-header-same-invocation.test.ts::skips only pending header parsing after verifying the current school"
  - line: "unsupported-material"
    description: A source proof cannot omit unsupported defined values or normalize distinct material into an existing proof
    formula: after the original full adapter, only finite primitives, explicit finite Decimal values with original data descriptors and dense finite integer digit arrays, exact plain objects with defined data properties and exact dense ordered arrays can capture or consume authority; unsupported types, symbol keys, accessors (never invoked by proof admission), extended Decimal metadata and nonfinite numbers fall back to original full validation without an earlier error; undefined object data properties remain omitted
    testRef: "tests/guided-interview/oh-school-header-material-boundary.test.ts::unsupported capture follows the actual adapter and leaves original fallback authority absent"
  - line: "standalone-school-render-adapter"
    description: Reuse the first accepted adapter result in the ordinary no-header Ohio school render
    formula: >-
      Replay actual current 2025 single ordinary residency, school and state
      payment sources in their original validation order, including the first
      full adapter. The current guided render may use its result for the second
      identical canonical input and fresh federal result only when the render's
      own overlay builder yields a plain empty object. Keep the two independent
      calls for standalone preview, nonempty overlays, changed or stale sources,
      retained canonical sources, header or separate credit methods. No saved
      input, review or filing gate is changed.
    testRef: "tests/guided-interview/oh-school-header-same-invocation.test.ts::reuses one current standalone adapter only during guided rendering %s"
  - line: "standalone-school-render-expiry"
    description: Keep the ordinary school result single-use within its exact current render
    formula: >-
      Compare equivalent exact plain canonical material and independently
      calculated federal results before consumption. A changed input, distinct
      federal result, header token, or unsupported representation cannot use
      this result. Remove the result from the proof scope before yielding it
      once. If another read already consumed the result during comparison, the
      current read yields no result. Expire any unconsumed value on normal and
      exceptional scope exit.
    testRef: "tests/guided-interview/oh-school-header-same-invocation.test.ts::consumes an exact standalone adapter result once and expires unused authority"
  - line: "standalone-school-render-nested-read"
    description: Consume the accepted result at most once across nested reads
    formula: Verify successful removal from the active scope after comparison before returning the accepted adapter result.
    testRef: "tests/guided-interview/oh-school-header-same-invocation.test.ts::allows one successful standalone adapter read across nested comparison"
  - line: "standalone-school-render-signed-zero"
    description: Preserve the sign of each finite Decimal value in the exact proof material
    formula: Positive and negative Decimal zero are distinct. A changed zero sign requires original replay and does not consume the accepted result for a later exact match.
    testRef: "tests/guided-interview/oh-school-header-same-invocation.test.ts::keeps distinct Decimal zero signs outside the same adapter proof"
