form: "Ohio actual payment and prior-return sources"
fullName: "Actual-account payment records and regular 2025 IT/SD2210 sources"
taxYear: 2025
reference: "https://dam.assets.ohio.gov/image/upload/v1762982551/tax.ohio.gov/forms/ohio_individual/individual/2025/itsd2210.pdf"
notes: |
  Official 2025 revision11/25 retrieved2026-11-02. This is the regular-calendar
  IT1040 method, not school-district/combined, annualized, fiscal, farmer/fish,
  military/disaster or discretionary abatement qualification. Unknown source
  answers never become zero, no-return, timely-return, or estimated dates.
  Current and prior liability uses actual printed line10 minus16 after credits.
  Filing extension is distinct from payment extension (OAC5703-7-05(C)).
  Exact original privately owned source records bind current federal/residency
  and payment facts. Output includes only year/method and raw-original digest.
  No filing or 2026 full-return gate changes.
lines:
  - line: "source-packet"
    description: "source-packet"
    formula: "Actual current raw original/payment source binding; confirmed year, owner identity, raw receipts and complete payment coverage required"
    testRef: "tests/engine/state/oh-payment-source.test.ts::requires complete payment records and preserves unknown versus actual zero"
  - line: "source-dates"
    description: "source-dates"
    formula: "Real calendar dates and discriminated filed versus expected timing; filedDate <= asOf, expectedDate >= asOf; actual receipts <= asOf"
    testRef: "tests/engine/state/oh-payment-source.test.ts::rejects unknown or contradictory actual source %s"
  - line: "source-dedup"
    description: "source-dedup"
    formula: "Unique actual source IDs and semantic receipt identity, account/name/SSN/type/year/date/amount; changing references cannot duplicate a payment"
    testRef: "tests/engine/state/oh-payment-source.test.ts::rejects reference-renamed duplicate payment originals"
  - line: "prior-return"
    description: "prior-return"
    formula: "No-return is distinct from current-owner original twelve-month timely-return with actual line10/16 and original filed date; no positive tax implies timely default"
    testRef: "tests/engine/state/oh-payment-source.test.ts::preserves prior zero return versus actual no return"
  - line: "carryforward"
    description: "carryforward"
    formula: "Prior original timely-return election and actual available current-owner credit; apply first quarterly installment, never duplicate estimated receipts"
    testRef: "tests/engine/state/oh-payment-source.test.ts::applies actual eligible carryforward once in first installment"
  - line: "credit-net-liability"
    description: "credit-net-liability"
    formula: "Use actual IT1040 line10 minus actual line16 refundable credits for current/prior2210 liability, preserving source-derived signed subtraction"
    testRef: "tests/engine/state/oh-payment-source.test.ts::subtracts refundable credits before the actual penalty calculation"
  - line: "actual-all-three"
    description: "actual-all-three"
    formula: "Actual NRC/credit order precedes payment-method calculation; original100k resident/PY/NR fixtures retain existing income tax and add actual penalty"
    testRef: "tests/engine/state/oh-payment-source.test.ts::calculates actual %s regular payment and balance sources"
  - line: "overlay-conflict"
    description: "overlay-conflict"
    formula: "Source-qualified original packet rejects unbound penalty/prior/timing/estimated/payment scalar overrides and contradictions"
    testRef: "tests/engine/state/oh-payment-source.test.ts::rejects unknown or contradictory actual source %s"
  - line: "private-source"
    description: "private-source"
    formula: "Complete raw original identity and receipt fields affect digest while raw private IDs and references stay off public audit"
    testRef: "tests/engine/state/oh-payment-source.test.ts::binds complete original payment identity in digest-only audit"
  - line: "pre-io"
    description: "pre-io"
    formula: "Current original payment/residency/federal source checks run before any reference PDF output; original context is unforgeable and permitted redaction resolves current private originals"
    testRef: "tests/pdf/oh-payment-reference.test.ts::rejects stale payment originals before reference PDF I/O"

  - line: "prior-untimely-unqualified"
    description: "Unresolved late-filed prior12month source treatment"
    formula: "Reject late-filed actual prior original pending reconciliation of statutory filed-return wording and printed timely-return question; do not impose a stricter charge by guessing"
    testRef: "tests/engine/state/oh-payment-source.test.ts::requires separate qualification for a late-filed prior twelve-month return"
  - line: "source-withholding-complete"
    description: "Actual source amounts preserve unknown withholding"
    formula: "Actual current-year owner and state Ohio statement withholding must be present; absence cannot become zero under source-qualified payment flow"
    testRef: "tests/engine/state/oh-payment-source.test.ts::rejects missing actual Ohio withholding rather than defaulting zero"
  - line: "refund-election-conservation"
    description: "Do not silently alter actual carryforward or donation election"
    formula: "Actual outgoing carryforward plus donations cannot exceed actual return overpayment; reject source conflict rather than silently cap original election"
    testRef: "tests/engine/state/oh-payment-source.test.ts::rejects refund elections exceeding the actual overpayment"

  - line: "statement-withholding-fields"
    description: "Use actual modeled field names for every accepted statement class"
    formula: "W2 uses stateTaxWithheld; W2G/1099G/K/R/NEC/MISC/INT/DIV/B/OID use stateWithheld. For Ohio-tagged records require actual owner/year and explicit finite nonnegative field, trim state presentation. Never substitute a different field or infer zero."
    testRef: "tests/engine/state/oh-payment-source.test.ts::preserves actual modeled Ohio withholding metadata %s"
  - line: "payment-reference-reopen"
    description: "Actual current original-bound redacted reference packets"
    formula: "Save and strict reopen each actual resident/PY/NR reference summary; independently pinned tax/penalty/balance values and review-only notices remain, raw IDs and payment references absent. This is reference-summary evidence, not official physical form qualification."
    testRef: "tests/pdf/oh-payment-reference.test.ts::saves current original-bound redacted payment reference %s"

  - line: "remaining-tax-payment-proof"
    description: "Payment timing is independent from return filing timing"
    formula: "Actual no remaining tax requires fresh <=0 remaining tax; otherwise explicit actual or expected remaining-tax payment date/amount/source required. Actual payment reconciles private owner/account/year/date/amount original. Never infer tax payment from filed/expected return date."
    testRef: "tests/engine/state/oh-payment-source.test.ts::requires remaining-tax payment facts independently from filing timing"
  - line: "endpoint-method-boundary"
    description: "Select the qualified printed endpoint method from actual facts"
    formula: "Finite first projector accepts positive estimated receipts at actual four printed endpoints and remaining-tax payoff Apr15 only. Between-column and earlier payoff require real dated interval/allocation successor; do not silently apply full-period factors or ask taxpayer to select a legal formula."
    testRef: "tests/engine/state/oh-payment-source.test.ts::requires dated interval qualification for nonendpoint actual payments %s"

  - line: "payment-source-coverage"
    description: "Actual endpoint payoff and known no balance are distinct"
    formula: "Fresh remainingtax=max(IT1040line10-line16-line14-line15,0). Actual/expected payment source amount covers that tax; no_remaining_tax only if nonpositive. Actual paid date/account/year/receipt gross reconcile. Settlement proof is not double-counted as estimated payment or as a filing-date inference."
    testRef: "tests/engine/state/oh-payment-source.test.ts::reconciles explicit actual or no-remaining-tax payment facts"

  - line: "reference-payment-projection-label"
    description: "Reference output identifies expected payment projection"
    formula: "Reference2210 includes current nonsecret method/year/source commitment and actual-versus-expected remaining-tax payment date; expected-payment projection must not appear as actual payment evidence. Original receipt references and account IDs remain private."
    testRef: "tests/pdf/oh-payment-reference.test.ts::saves current original-bound redacted payment reference %s"

  - line: "withholding-before-state-allocation"
    description: "Unknown state and missing source amount do not establish zero Ohio withholding"
    formula: "For complete source method each modeled statement requires actual owner/year and explicit known nonnegative withholding before state allocation. Explicit zero may accompany actual blank state; nonzero requires actual state. An absent amount plus blank/nonOhio state is not proof of zero."
    testRef: "tests/engine/state/oh-payment-source.test.ts::rejects unknown withholding before state allocation"

  - line: "catchup-not-timely-harbor"
    description: "An annual aggregate catch-up is not earlier installment timeliness"
    formula: "When actual dated payments show missed prior installments, a final-quarter catchup cannot establish PartI timely estimated payment safe harbor solely because annual cash reaches90%current or100%prior. Operative5747.09C/D/E and actual PartI1 timely-paid wording require period-specific reconciliation before stop. Distinguishing printedPartII specimens69 and33 remain pinned before output; first source method rejects this unqualified annual-only stop pending actualdated/PartI1 projection successor. No financial result is invented."
    testRef: "tests/engine/state/oh-payment-source.test.ts::requires separate timely installment qualification for final-quarter catchup %s"

  - line: "filing-does-not-end-account-records"
    description: "Original filing and actual payment are separate events"
    formula: "An actual current-year payment after the return's filed date but by actual as-of date is not unknown or future solely because the return was already filed. Select admitted payment method from actual payment date; never terminate account records at filing date."
    testRef: "tests/engine/state/oh-payment-source.test.ts::preserves actual endpoint account payments made after an earlier filing"
