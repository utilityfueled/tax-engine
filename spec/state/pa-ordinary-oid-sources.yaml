form: PA-Ordinary-OID-Sources
fullName: Source-bound personal OID and original-form Pennsylvania withholding after reviewed A/B
status: internal-source-method-review-only
taxYear: 2025
reference: https://www.pa.gov/agencies/revenue/forms-and-publications/pa-personal-income-tax-guide/interest
sources:
  - https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40a.pdf
  - https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40in.pdf
  - https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/taxlawpoliciesbulletinsnotices/taxbulletins/pit/documents/pit_bulletin_2024-01.pdf
  - https://www.pacodeandbulletin.gov/Display/pacode?file=/secure/pacode/data/061/chapter103/s103.16.html&d=reduce
  - https://uscode.house.gov/view.xhtml?edition=prelim&num=0&req=granuleid%3AUSC-prelim-title31-section3124
