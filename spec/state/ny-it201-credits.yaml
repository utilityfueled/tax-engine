form: "New York IT-201 Credits"
fullName: "New York State Form IT-201 Credits, Net Tax, and Refundable Credits"
taxYear: 2025
irsReference: "https://www.tax.ny.gov/pdf/current_forms/it/it201i.pdf"

notes: |
  After computing the NY State tax on line 39, the IT-201 applies various credits
  and additional taxes to arrive at the total NY State tax liability.

  This module covers:
  - Line 40: NY State household credit (non-refundable)
  - Lines 41-42: Resident credit and other credits (passthrough from supporting forms)
  - Line 43: Total NY State credits
  - Line 44: Net NY State tax (line 39 minus line 43, minimum zero)
  - Line 45: Net other New York State taxes
  - Line 46: Total New York State taxes
  - Line 59: Sales or use tax
  - Line 65: NY earned income credit (refundable, from IT-215 resident line 16)
  - Line 63: Empire State child credit (refundable, from IT-213)

  The household credit is a non-refundable credit based on federal AGI and filing status.
  It uses a lookup table with different credit amounts for different federal AGI
  ranges and household-size columns defined in the IT-201 instructions.
  The total household credit cannot exceed the tax on line 39.

  The regular NY earned income credit starts with 30% of the federal earned
  income credit on IT-215 line 12. The 2025 resident IT-215 then limits the
  household-credit subtraction through Worksheet B before transferring the
  allowable credit from line 16 to IT-201 line 65.

  For noncustodial parents qualifying under NY's program, the supported line 66
  path remains the existing 2.5x passthrough-style multiplier handled by the
  full-return orchestration rather than a complete IT-209 worksheet.

  The NY EIC remains fully refundable after this household-credit adjustment.

lines:
  - line: "40"
    description: "NY State household credit"
    formula: "Lookup 2025 household credit table using federal AGI, filing status, and household-size column; cap at line 39 tax"
    inputs:
      - "Federal adjusted gross income (line 19, adjusted for special condition code A6 if applicable)"
      - "Filing status"
      - "Number of dependents"
      - "NY State tax (line 39)"
    notes: |
      Non-refundable credit. Cannot exceed tax on line 39.

      Filing status 1 (Single) uses household credit table 1:
        NY AGI ≤ $5,000:      $75
        $5,001 - $6,000:      $60
        $6,001 - $7,000:      $50
        $7,001 - $11,000:     $45
        $11,001 - $15,000:    $40
        $15,001 - $25,000:    $25
        $25,001 - $28,000:    $20
        Over $28,000:         $0

      Filing statuses 2, 4, and 5 (MFJ, HoH, QSS) use household credit table 2.
      The table columns are based on household size equal to:
      - 1 for the taxpayer, plus
      - 1 more only if filing jointly, plus
      - dependents from IT-201 item H.

      Table 2 credit amounts by federal AGI row and household-size column:
      - Up to $5,000:        1=$90, 2=$105, 3=$120, 4=$135, 5=$150, 6=$165, 7=$180, add $15 for each person over 7
      - $5,001-$6,000:       1=$75, 2=$90, 3=$105, 4=$120, 5=$135, 6=$150, 7=$165, add $15 for each person over 7
      - $6,001-$7,000:       1=$65, 2=$80, 3=$95, 4=$110, 5=$125, 6=$140, 7=$155, add $15 for each person over 7
      - $7,001-$20,000:      1=$60, 2=$75, 3=$90, 4=$105, 5=$120, 6=$135, 7=$150, add $15 for each person over 7
      - $20,001-$22,000:     1=$60, 2=$70, 3=$80, 4=$90, 5=$100, 6=$110, 7=$120, add $10 for each person over 7
      - $22,001-$25,000:     1=$50, 2=$60, 3=$70, 4=$80, 5=$90, 6=$100, 7=$110, add $10 for each person over 7
      - $25,001-$28,000:     1=$40, 2=$45, 3=$50, 4=$55, 5=$60, 6=$65, 7=$70, add $5 for each person over 7
      - $28,001-$32,000:     1=$20, 2=$25, 3=$30, 4=$35, 5=$40, 6=$45, 7=$50, add $5 for each person over 7
      - Over $32,000:        $0

      Filing status 3 (Married filing separate return) uses household credit table 3.
      The table columns are based on:
      - dependents from both returns, plus
      - 1 for the taxpayer, plus
      - 1 for the spouse.

      Table 3 credit amounts by combined federal AGI row and household-size column:
      - Up to $5,000:        1=$45, 2=$53, 3=$60, 4=$68, 5=$75, 6=$83, 7=$90, add $8 for each person over 7
      - $5,001-$6,000:       1=$38, 2=$45, 3=$53, 4=$60, 5=$68, 6=$75, 7=$83, add $8 for each person over 7
      - $6,001-$7,000:       1=$33, 2=$40, 3=$48, 4=$55, 5=$63, 6=$70, 7=$78, add $8 for each person over 7
      - $7,001-$20,000:      1=$30, 2=$38, 3=$45, 4=$53, 5=$60, 6=$68, 7=$75, add $8 for each person over 7
      - $20,001-$22,000:     1=$30, 2=$35, 3=$40, 4=$45, 5=$50, 6=$55, 7=$60, add $5 for each person over 7
      - $22,001-$25,000:     1=$25, 2=$30, 3=$35, 4=$40, 5=$45, 6=$50, 7=$55, add $5 for each person over 7
      - $25,001-$28,000:     1=$20, 2=$23, 3=$25, 4=$28, 5=$30, 6=$33, 7=$35, add $3 for each person over 7
      - $28,001-$32,000:     1=$10, 2=$13, 3=$15, 4=$18, 5=$20, 6=$23, 7=$25, add $3 for each person over 7
      - Over $32,000:        $0
    edgeCases:
      - "Federal AGI, not New York AGI, controls the table lookup"
      - "AGI exactly at a boundary stays in the lower row"
      - "Single status uses table 1 with no household-size column"
      - "Married filing separately uses table 3, not the single table"
      - "For statuses 2, 4, and 5, household size is taxpayer + dependents, plus spouse only on a joint return"
      - "For status 3, household size includes both spouses and dependents from both returns"
      - "Household sizes over 7 use the column 7 amount plus the per-person increment from the instructions"
      - "Credit is zero above the table ceiling"
      - "Credit limited to tax on line 39"
    testRef: "tests/engine/state/ny-it201-credits.test.ts::Line 40 - household credit uses federal AGI table rows and filing-status-specific household size rules"

  - line: "41"
    description: "Resident credit (taxes paid to other states)"
    formula: "From Form IT-112-R (passthrough)"
    inputs:
      - "Resident credit amount from IT-112-R"
    notes: |
      If the taxpayer paid income tax to another state, local government of another
      state, the District of Columbia, or a province of Canada, compute the credit
      on Form IT-112-R and, if applicable, IT-112-C, then transfer the total to line 41.
    testRef: "tests/engine/state/ny-it201-credits.test.ts::Line 41 - resident credit passes through"

  - line: "42"
    description: "Other NY State credits"
    formula: "From Form IT-201-ATT, line 7 (passthrough)"
    inputs:
      - "Other credits from IT-201-ATT"
    notes: "Transfer the total nonrefundable credits from the supporting credit forms and Form IT-201-ATT line 7."
    testRef: "tests/engine/state/ny-it201-credits.test.ts::Line 42 - other credits pass through"

  - line: "43"
    description: "Total NY State credits"
    formula: "Line 40 + Line 41 + Line 42"
    inputs:
      - "Household credit (line 40)"
      - "Resident credit (line 41)"
      - "Other credits (line 42)"
    testRef: "tests/engine/state/ny-it201-credits.test.ts::Line 43 - total credits is sum of lines 40-42"

  - line: "44"
    description: "Net NY State tax"
    formula: "max(0, Line 39 - Line 43)"
    inputs:
      - "NY State tax (line 39)"
      - "Total credits (line 43)"
    notes: "Credits cannot reduce tax below zero."
    edgeCases:
      - "Credits exceed tax: net tax is zero"
    testRef: "tests/engine/state/ny-it201-credits.test.ts::Line 44 - net tax is zero when credits exceed tax"

  - line: "45"
    description: "Net other NY State taxes"
    formula: "From Form IT-201-ATT, line 30 (passthrough)"
    inputs:
      - "Other state taxes from IT-201-ATT"
    notes: "Transfer the total net other New York State taxes from Form IT-201-ATT line 30."
    testRef: "tests/engine/state/ny-it201-credits.test.ts::Line 45 - other state taxes pass through"

  - line: "46"
    description: "Total New York State taxes"
    formula: "Line 44 + Line 45"
    inputs:
      - "Net NY State tax (line 44)"
      - "Net other New York State taxes (line 45)"
    notes: |
      On the 2025 IT-201, line 46 is the New York State subtotal before any
      New York City, Yonkers, MCTMT, sales/use tax, or voluntary contributions.
    testRef: "tests/engine/state/ny-it201-credits.test.ts::Line 46 - total New York State taxes includes net tax plus other taxes"

  - line: "59"
    description: "Sales or use tax"
    formula: "Exact sales/use tax amount, or 2025 chart lookup based on federal AGI prorated by months of NY abode"
    inputs:
      - "Exact sales or use tax amount, if computed separately"
      - "Federal adjusted gross income (for chart lookup)"
      - "Months maintaining a permanent place of abode in New York for sales/use tax purposes"
    notes: |
      Taxpayers may either:
      - Enter an exact amount computed separately (for example from Form ST-141), or
      - Use the 2025 IT-201-I sales and use tax chart for eligible purchases.

      2025 chart amounts:
        Federal AGI up to $15,000: $3
        $15,001 - $30,000: $6
        $30,001 - $50,000: $10
        $50,001 - $75,000: $15
        $75,001 - $100,000: $18
        $100,001 - $150,000: $26
        $150,001 - $200,000: $34
        $200,001 and greater: lesser of 0.0175% of federal AGI or $125

      If the taxpayer maintained a permanent place of abode in New York for only
      part of the year for sales and use tax purposes, prorate the chart amount:
      chart amount × months / 12, rounded to the nearest dollar.

      The chart is only for personal purchases of items or services costing less
      than $1,000 each and not related to business, rental real estate, or royalty
      activities. Taxpayers owing exact tax on larger or ineligible purchases must
      compute the amount separately and provide the exact amount instead.
    edgeCases:
      - "Explicit exact amount overrides chart lookup"
      - "Chart mode requires federal AGI from either the IT-201 line 19 input or the chart override input"
      - "Federal AGI of $200,001 uses the percentage formula instead of the $34 bracket"
      - "High-income chart amount is capped at $125"
      - "Negative federal AGI still uses the $3 minimum chart row when chart mode is selected"
      - "Partial-year abode months prorate the chart amount and round to the nearest dollar"
    testRef: "tests/engine/state/ny-it201-credits.test.ts::Line 59 - chart lookup uses federal AGI brackets and month proration"

  - line: "63"
    description: "Empire State child credit"
    formula: "From Form IT-213 line 5 (passthrough)"
    inputs:
      - "Empire State child credit from IT-213"
    notes: |
      Refundable credit computed on Form IT-213.
      Equal to the greater of 33% of the federal child tax credit or $100 per qualifying child.
      Full computation is in the IT-213 module (ny-it213-empire-state-child-credit).
    testRef: "tests/engine/state/ny-it201-credits.test.ts::Line 63 - Empire State child credit passes through from IT-213"

  - line: "65"
    description: "NY earned income credit"
    formula: |
      For the regular resident path:
        combinedLine16 = max(0, round(Federal EIC × 30%) - min(household credit, max(0, NY tax - resident credit - accumulation distribution credit)))
        If the filer is Married filing separately on New York after a joint federal return:
          claimedLine65 = any non-negative portion of combinedLine16 entered on IT-215 line 17, not above combinedLine16
        Otherwise:
          claimedLine65 = combinedLine16
      Supported noncustodial path continues to use the existing 2.5x multiplier
    inputs:
      - "Federal earned income credit amount"
      - "Household credit allowed on line 40"
      - "Resident credit on line 41"
      - "Accumulation distribution credit used on IT-215 Worksheet B line 3"
      - "Joint-federal / NY-MFS line 17 claimed allocation, when applicable"
      - "Whether noncustodial parent EIC applies"
    notes: |
      Refundable credit. The NY EIC is:
      - For the regular IT-215 resident path: the whole-dollar line 12 amount
        equal to 30% of the federal earned income credit, reduced by the
        smaller of line 14 household credit or Worksheet B line 5 remaining tax
        after resident and accumulation distribution credits. If the New York
        return is Married filing separately after a joint federal return, the
        IT-201 line 65 amount is the claimed share entered on IT-215 line 17.
      - 2.5 times the federal EIC for noncustodial parents qualifying under NY's program

      The federal EIC is computed on the federal return and flows through.
      For the regular NYS EIC, New York does not recompute the federal credit,
      but it does cap the household-credit subtraction using IT-215 Worksheet B.
    edgeCases:
      - "No federal EIC: NY EIC is zero"
      - "Household credit can reduce the regular NY EIC to zero"
      - "Regular NY EIC rounds the 30% base to whole dollars before subtracting the capped household-credit amount"
      - "Resident and accumulation distribution credits can reduce the line 15 subtraction below the household credit"
      - "Joint-federal / NY-MFS filer may claim less than the combined line 16 amount through IT-215 line 17"
      - "Noncustodial parent: uses 2.5x multiplier instead of 30%"
      - "Credit is refundable (not limited by tax)"
    testRef: "tests/engine/state/ny-it201-credits.test.ts::Line 65 - joint federal NY-MFS allocation limits the claimed credit to line 17"
