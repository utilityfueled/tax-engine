form: PA-Business-Independent
fullName: Independent actual source business and printed-line controls
taxYear: 2025
reference: https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/pa-40c.pdf
notes: |
  Independent controls frozen before any candidate runtime. Official PA guide permits
  actual business meals at100percent and separate independent-center accounting only
  with complete records. Printed line31 aggregates travel and meals before rounding.
  Literal oracles independently derived using Python Decimal; no product output used.
