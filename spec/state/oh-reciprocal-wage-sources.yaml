  - line: "IT1040-income-withholding-refund"
    label: "Source-bound zero Ohio income and withholding refund"
    formula: "Fresh raw federalAGI60000.25 retained; official printedline1roundDollar60000 minus reportedline14deduction60000=OhioAGI0; tax0, actualWH2000.60 reported2001, actualotherpayments/refundallocations0 -> requestedrefund2001. No actualrefundpayment is asserted."
