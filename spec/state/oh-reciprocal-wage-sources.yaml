  - line: "finite-cash-projection"
    label: "The genuine local context does not authorize different cash facts"
    formula: "Actual finite source/use tax/donations/outgoing carry/late interest/estimates are independently known0, no prior overpayment or refundable credit originals; changing any cash/refundable component100 while retaining a genuine context must reject. No cash source facts are discarded or silently zeroed."
