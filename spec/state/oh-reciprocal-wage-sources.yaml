  - line: "actual-pa-withholding-separate"
    label: "Actual separately printed PA withholding does not establish Ohio cash"
    formula: "Additive finite actual2025 source-support method: independently validated nonnegative PA withholding with at mosttwo significant decimalplaces may coexist with original OhioWH. Actual60000.25/OHWH2000.60/PAWH1842.01 reportsOhioWH/refund2001;60000.50/OHWH0.00/PAWH1842.02 reports0. PAfirst/OHfirstboth preserve all raw originals and same qualifiedreciprocitydeduction, never crosscountPA cash. This finite cent precision is an engineering cohort boundary, not a claim that moreprecise tax originals are legallyinvalid."
    testRef: "tests/engine/state/oh-reciprocal-pa-withholding.test.ts::reciprocal separate PA cash preserves literal Ohio values %s"
  - line: "pa-cash-independence"
    label: "Changing independently supplied PA cash cannot change Ohio results"
    formula: "Separately supplied coherent actualPAWH3999.99 changes rawsourcecommitment but not current federalAGI/ADJ14/OhioWH/refund; actualOhioWH never includes PA or legacyfirstrow twice. KnownPAzero remains valid."
    testRef: "tests/engine/state/oh-reciprocal-pa-withholding.test.ts::reciprocal separate PA cash is independent of Ohio cash %s"
  - line: "pa-original-unknown-malformed"
