  - line: "rounding-zero"
    label: "Raw cents and known zero remain distinct from missing source"
    formula: "WH2000.49 ->2000;2000.50 ->2001; actual0 ->0, never unknown ->0; wages60000.49/60000.50 ->60000/60001 respectively and matching qualified deduction leaves0OhioAGI."
