  - line: "current-originals"
    label: "Complete current source identity and confirmation"
    formula: "Require currentowner/year/fullW2/stateRows/payroll/service/entity/domicile/payment proofs and exactsnapshot; savedresults/referencealone/unknown facts never satisfy sourceadmission. Allretainedunsupported originals remainguarded evenzero ornetzero."
