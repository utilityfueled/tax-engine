  - line: "current-binding"
    label: "Explicit same-money source change and no read-time mutation"
    formula: "Without updated actual originals and explicitsourcebinding, equal-money currentsource replacements reject. Explicitly supplied coherent replacements change digest; no inputmutation, identifiersinaudit or globalDecimalconfiguration."
