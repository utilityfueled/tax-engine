    formula: "Missing/blank/negative/nonfinite/overprecisionPAWH rejects, in either actualstateorder. Actualoriginals require distinctPA/OHrows, correctprintedorder/fullsnapshot/sourceidentity. Additionalor duplicated stateoriginals and changedcurrentidentity cannot be ignored."
    testRef: "tests/engine/state/oh-reciprocal-pa-withholding.test.ts::reciprocal separate PA cash refuses malformed original %s"
  - line: "pa-stale-identity"
