form: Ohio actual ordinary nonresident official review
taxYear: 2025
reference: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf
notes: |
  Source-first November3 2026. Finite actual2025 single primary full-year VA
  domicile, one ordinary current W2, nonbusiness wage allocation and complete
  current IT1040 payment originals. No reciprocal/business/SD/other-income source
  or actual dependent. Existing actual-source calculations are not changed.
  Official IT1040 bundle SHA4e6432e23df3bf181a8e9d7ee5d5bb7e2e96a6a21dd65fa39c625fb8a7e2f57c;
  NRC SHA7e2f83559370510e129a6d720e090ae08aeefffcc75083c0b91561df85639c52.
  Complete physical review needs IT1040 pages1-2, Credits pages1-2,
  Withholding pages1-2, NRC SectionI page1. No filing or global template gate
  promotion. Every page marked review-only; privacy removes identifiers and
  private source references. Render facts come from original-bound existing
  Ohio review context; saved scalars cannot replace originals.
  Booklet printed15: full-year nonresident county blank, school district9999;
  no Ohio nonresident-presumption box without actual five-criteria source method.
  Actual Single on-widget has reversed source y bounds419.275/406.407;
  normalize that same rectangle before flattening so its original selected
  appearance is painted inside the printed Single cell, not over its heading.
  Printed16-17 and actual return: report rounded source amounts, attach Credits
  for claimed NRC and Withholding for actual line14. IT1040 page2 L7a transfers the same actual line7 taxable
  nonbusiness income98100 already printed on page1. NRC ratio four decimals. Exact official field19 raw MaxLen5 requires .8000,
  preserving all four fractional digits without changing the engine ratio or
  widening the source field. Original-only current payment sources leave
  amended-only IT1040 L18 blank. When actual netpayments exceed liability,
  the printed skip from line19 to23 leaves20/21/22 blank; zeros remain
  known actual ledger values and are not missing money facts. Its source AFNumber_Format requests four decimals.
  Inactive broad candidates remain inactive; only this source-bound cohort may
  emit new physical review forms after independent source/physical qualification.
lines:
  - line: "literal-calculation"
    description: Independent source originals establish finite review values
    formula: Actual federal/Ohio AGI100000, exemption1900, taxable98100; current tax2323. Actual Ohio wage20000/nonOhio80000 gives NRC ratio.8000, creditroundDollar(2323*.8)=1858, Ohio tax465; actual withholding1000 and otherpayments0 gives requestedrefund535. Requested is not cash received. No source cash is inferred from outputs.
    testRef: "tests/pdf/oh-ordinary-official-review.test.ts::Ohio ordinary paper source preconditions preserve independently pinned values"
  - line: "actual-output"
    description: Actual existing Ohio review entry emits required official pages
    formula: Existing fillOhioReferenceForms returns four additional review files for the complete finite cohort, seven official pages total. Review summaries remain distinct. Each output has exactly the expected physical pages and all pages carry the review notice.
    testRef: "tests/pdf/oh-ordinary-official-review.test.ts::Ohio ordinary actual source review emits all four official companions"
  - line: "source-binding"
    description: Original and federal result replay before output
    formula: Forged context, changed actual W2 identity or stale federal result rejects before creating output. No fake reconstructed result or private-original string may be emitted as paper proof. Existing public2026 and filing gates remain closed.
    testRef: "tests/pdf/oh-ordinary-official-review.test.ts::Ohio ordinary paper rejects conflicting source before output %s"
  - line: "physical-values"
    description: Saved actual paper values and static privacy
    formula: Reopen saved outputs with strict pypdf; validate every expected numeric/form-status physical appearance, zero widgets/AcroForm after approved review flattening, no private SSN/EIN/source-reference in fields, metadata, xref objects or page streams. Inspect actual-size rendered pages separately before qualification.
    testRef: "tests/pdf/oh-ordinary-official-review.test.ts::Ohio ordinary actual source review emits all four official companions"
  - line: "legacy-source-boundary"
    description: Existing source-complete payment reference remains available without actual W2 printed-row packet
    formula: Canonical nonresident legacy scalar W2 inputs still emit existing redacted reference summaries with tax465 and balance465. The narrower official companion needs its complete actual printed-row source packet; absent packet returns no new physical companions, never guesses rows and never blocks the existing summary. Forged or stale retained sources still reject before output.
    testRef: "tests/pdf/oh-ordinary-official-review.test.ts::Ohio ordinary physical boundary preserves legacy reference without inventing actual rows"
