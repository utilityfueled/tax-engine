  - line: "private-output"
    description: "Paper review retains childcount without private originals"
    formula: "Each saved interactive official2025 form preserves canonical field tree/appearance semantics and exact actual literals while text fields and extracted pages contain no owner/child/parent SSNs nor source references. Strict reopen and visual inspection required separately; no flattening or template substitution."
