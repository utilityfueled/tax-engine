  still outstanding.20. Complete evidence of no refunds, offsets, transfers, forfeiture or writeoff.
  Current taxpayer cash net-paid.20 is never replaced by liability0 or a received refund.
  No voluntary decline-credit switch, generic foreign-withholding bypass or fakeW2/payment kind.
  Actual field statuses start unknown. Positive fictional records below are separately authored proof,
  never inferred from rawNEC0/withholding.20. Source UI/disclosure remain later scope.
