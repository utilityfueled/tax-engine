      remaining after lines 2-38. See R.C. 5747.05(D) and R.C. 5747.98.
    testRef: "tests/engine/state/oh-schedule-credits.test.ts::OH Schedule of Credits Line 39 - resident credit capped by remaining tax after line 38"

