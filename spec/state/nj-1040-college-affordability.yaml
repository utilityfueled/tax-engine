form: "NJ-1040 New Jersey College Affordability Deductions"
fullName: "New Jersey NJ-1040 Lines 37a-37c — New Jersey College Affordability Deductions"
taxYear: 2025
reference: "https://www.nj.gov/treasury/taxation/pdf/current/1040i.pdf"

notes: |
  The 2025 NJ-1040 instructions add three New Jersey College Affordability
  deductions on lines 37a through 37c. These deductions are available only
  when NJ gross income (line 29) is $200,000 or less.

  The three deduction categories are:
  - Line 37a: up to $10,000 of NJBEST account contributions made during the year
  - Line 37b: up to $2,500 of principal and interest paid during the year on an NJCLASS loan
  - Line 37c: up to $10,000 of tuition paid during the year to attend a New Jersey institution of higher education

  Part-year residents determine eligibility using full-year NJ gross income, then
  prorate each deduction by months of New Jersey residency. Married filing
  separately filers may not claim combined deductions above the statutory cap
  for each line.

lines:
  - line: "eligibility"
    description: "Gross income eligibility gate for lines 37a-37c"
    formula: "Eligible when NJ gross income (line 29) is less than or equal to $200,000; otherwise all three deductions are zero"
    inputs:
      - "NJ gross income (line 29)"
    edgeCases:
      - "$200,000 of NJ gross income qualifies"
      - "$200,001 of NJ gross income disqualifies all three deductions"
    testRef: "tests/engine/state/nj-1040-college-affordability.test.ts::NJ-1040 college affordability - income above $200,000 disallows all deductions"

  - line: "37a"
    description: "NJBEST account contribution deduction"
    formula: |
      If eligible:
        base deduction = min(NJBEST contributions paid during the year, $10,000)
        part-year deduction = round(base deduction × monthsOfResidency / 12)
      Else:
        0
    inputs:
      - "NJBEST contributions paid during the year"
      - "NJ gross income (line 29)"
      - "Months of NJ residency"
    edgeCases:
      - "$12,000 contribution is capped at $10,000"
      - "Part-year resident with 6 months receives half of the capped deduction"
    testRef: "tests/engine/state/nj-1040-college-affordability.test.ts::NJ-1040 college affordability Line 37a - NJBEST contributions cap at $10,000"

  - line: "37b"
    description: "NJCLASS principal and interest deduction"
    formula: |
      If eligible:
        base deduction = min(NJCLASS principal and interest paid during the year, $2,500)
        part-year deduction = round(base deduction × monthsOfResidency / 12)
      Else:
        0
    inputs:
      - "NJCLASS principal and interest paid during the year"
      - "NJ gross income (line 29)"
      - "Months of NJ residency"
    edgeCases:
      - "$3,000 of NJCLASS payments is capped at $2,500"
      - "Part-year proration applies after the statutory cap"
    testRef: "tests/engine/state/nj-1040-college-affordability.test.ts::NJ-1040 college affordability Line 37b - NJCLASS payments cap at $2,500"

  - line: "37c"
    description: "New Jersey higher education tuition deduction"
    formula: |
      If eligible:
        base deduction = min(qualified tuition paid during the year, $10,000)
        part-year deduction = round(base deduction × monthsOfResidency / 12)
      Else:
        0
    inputs:
      - "Qualified tuition paid during the year to a New Jersey institution"
      - "NJ gross income (line 29)"
      - "Months of NJ residency"
    edgeCases:
      - "$18,000 of tuition is capped at $10,000"
      - "7-month resident prorates capped tuition deduction and rounds to the nearest dollar"
    testRef: "tests/engine/state/nj-1040-college-affordability.test.ts::NJ-1040 college affordability Line 37c - tuition deduction is prorated for part-year residents"

  - line: "37-total"
    description: "Total New Jersey College Affordability deductions"
    formula: "Line 37a + Line 37b + Line 37c"
    inputs:
      - "Line 37a NJBEST deduction"
      - "Line 37b NJCLASS deduction"
      - "Line 37c tuition deduction"
    testRef: "tests/engine/state/nj-1040-college-affordability.test.ts::NJ-1040 college affordability total - all three deductions add together"
