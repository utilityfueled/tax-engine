form: "Pennsylvania REV-414(I) 2026 original pre-April estimate"
fullName: "Pennsylvania original calendar-year estimated income tax worksheet and first declaration schedule"
taxYear: 2026
reference: "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2026/2026_rev-414i.pdf"
