form: "PA Ordinary Source-Bound Review PDF"
fullName: "Actual ordinary PA result transport and source-bound PA-40 review projection"
taxYear: 2025
reference: "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40in.pdf"
notes: |
  Distinct PAOrdinaryReturnResult remains a real union member, never a fictitious legacy
  PA orchestrator. A new original-bound unforgeable prepared review context replays
  complete ordinary facts, completion and residency before identifier redaction.
  Complete result and originals must match fresh replay before template I/O.
  This preserves existing legacy mapping APIs and diagnoses no source from free render facts.
  Actual2025 review only; no final2026 form or human/filing qualification.
lines:
  - line: "actual-result"
    description: "Transport a real ordinary result and exact all-three residency tax"
    formula: "Actual resident/part-year/nonresident source compositions retain paper PA tax1539/799/184 and the actual result method/source commitment. No fake legacy cast or lost source fields."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF prints all three actual residency tax oracles"
  - line: "residency-and-school"
    description: "Actual R N P selection and school/PY residence originals"
    formula: "Map actual resident R/on1,nonresident N/on2,part-year P/on3; actual school district source name/code, with99999 outsidePA Dec31 and blank PA district name; actual validated PA domicile from/through MM/DD for partyear only."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF prints all three actual residency tax oracles"
  - line: "filing-and-sp"
    description: "Actual S or F and actual Schedule SP dependent children"
    formula: "Map exact actual filingChoice S/on1 or F/on4, final reason text (official recovered max15: longer complete reason goes on labelled review reference and field SEE REFERENCE, never truncated), and actual source-qualified SPdependentChildren rather than count all federal dependents. Keep actual ScheduleSP eligibility and forgiveness lines; field rendering cannot originate a credit."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF uses actual final choice and SP child count"
  - line: "payments-and-elections"
    description: "Keep exact original paper lines and taxpayer refund allocation"
    formula: "Use fresh composer pa40 actual printed lines1-29; actual line30refund,line31nextyear credit and lines32-36 amount/code donation elections. Timely example overpayment1000=refund700+credit200+donationA100; actual one-day late example net995=refund695+credit200+donationA100, line27L5. Never infer full refund from overpayment."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF prints actual refund credit donations and late timing"
  - line: "working-credit"
    description: "Keep unchanged2025paper and separately labelled processing reference"
    formula: "OfficialFAQ4255: WPTC has no2025paper field; actual printed24/29/30 exclude it. Positive freshly recomputed federalEITC-based workingCredit/wptcProcessing gets separate review reference page, no assumed DOR settlement."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF separates verified working credit processing from paper totals"
  - line: "source-context"
    description: "Unforgeable pre-redaction preparation and exact current source/result replay"
    formula: "Private WeakMap opaque token binds cloned original full input and allowed exact redacted input. Unknown/forged/token-other-owner or changed original/result/source commitment rejects before template read. Missing or malformed present ordinary/completion originals never fall back to legacy calculation."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF prepared context rejects forgeries stale originals and tampered results before I O"
  - line: "packet-and-privacy"
    description: "Honest packet union, existing privacy and readiness boundaries"
    formula: "fillReturn admits actual ordinary result only via source context, handles available scheduleSP/REV1630 without assuming absent legacy schedules, preserves review notice and redacted identity. No original source refs/TINs/payment IDs rendered; original context cannot be reconstructed from diagnostic facts.2026final mappings remain gated."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF packet uses honest type and preserves privacy review and year gates"
  - line: "legacy-context-guard"
    description: "Keep wrong context from accepting a distinct ordinary source result"
    formula: "Direct legacy WPTC review API rejects the distinct actual ordinary method, including zero workingcredit. New source context required; old sourcequalified legacy APIs unchanged. Readiness ScheduleGL access only after actual property-presence guard, never fake absent legacy schedule."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF legacy working context rejects distinct ordinary zero credit"
  - line: "route-markers-not-authority"
    description: "Actual present ordinary originals cannot fall through a stripped-result marker"
    formula: "Presence of either actual ordinary canonical source root or prepared ordinary context requires genuine distinct ordinary replay. Missing ordinary method markers or missing source roots reject before I/O, rather than reusing legacy zero-credit rendering or accepting fielddiagnostics."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF actual roots prevent stripped result or missing source fallback"
  - line: "known-private-identifiers-in-source-text"
    description: "Opaque original contexts cannot reintroduce known private identifiers in render text"
    formula: "Keep complete original final-return reason and source commitments unchanged. Derive render-only reason and district name by replacing every known canonical private identifier (same SSN/TIN/taxId/identifyingNumber/accountReference keys and ssns arrays as existing review redaction) with a readable REDACTED marker; match original spelling and numeric identifiers with digits or ordinary spacing/hyphen/dot separators. Full readable nonprivate reason survives its reference page. Do not truncate saved facts, mutate private originals, relax replay/digest checks, or treat opaque tokens as permission to render private identifiers."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF known private source identifiers stay out of final reason reference"
  - line: "school-name-physical-reference"
    description: "Preserve complete privacy-safe school source beyond official fifteen-character name field"
    formula: "Actual recovered school-name field maxLength15 also applies after known-identifier redaction. For a longer complete sanitized source, print SEE REFERENCE in the unchanged official field and retain the entire sanitized school name on a labelled review-only reference page. Keep exact original private name/digest, actual school code, geometry, full nonprivate text and every source/readiness/privacy gate. Never truncate a source name or change template limits."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF full sanitized school source survives official fifteen character field"
  - line: "school-reference-appearance-fit"
    description: "The physical reference marker must fit its unchanged official widget"
    formula: "Logical SEE REFERENCE is insufficient if its appearance clips. Original school widget width77.619pt/height12.270pt has1pt inset each side; Helvetica10 text width84.46pt exceeds75.619pt inner width. Use automatic fitting text size as existing occupation fields do, preserve exact full marker and labelled full sanitized reference, and keep original rectangle/template/source unchanged. Saved appearance glyph width and height must fit the original clipping area."
    testRef: "tests/pdf/pa-ordinary-source-pdf.test.ts::PA ordinary PDF school reference marker fits its original appearance clipping area"
