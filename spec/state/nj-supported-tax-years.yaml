form: "NJ Resident Engine Supported Tax Years"
fullName: "New Jersey Resident Income Tax Engine — Supported Tax Year Validation"
taxYear: 2025
reference: "https://www.nj.gov/treasury/taxation/new2025.shtml"

notes: |
  The supported NJ resident-return slice is keyed to the published 2025 New
  Jersey resident return instructions and schedules. Until a later iteration
  adds constants, specs, and tests for additional filing years, the resident
  modules must reject unsupported tax years with clear errors instead of
  silently computing a partially valid return.

lines:
