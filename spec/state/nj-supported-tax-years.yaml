    description: "Gross income module supports only the validated 2025 resident rules"
    formula: "Reject tax years other than 2025 with a clear error"
    inputs:
      - "Tax year"
    testRef: "tests/engine/state/nj-supported-tax-year.test.ts::NJ supported tax years - gross income rejects unsupported years"

