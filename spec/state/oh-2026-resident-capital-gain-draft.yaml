form: "Ohio 2026 resident equity-sale draft"
fullName: "Source-bound single full-year resident A34 before business deduction"
taxYear: 2026
irsReference: "https://codes.ohio.gov/ohio-revised-code/section-5747.01"
sources:
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.79"
  - "https://codes.ohio.gov/ohio-revised-code/section-5747.02"
  - "https://codes.ohio.gov/ohio-revised-code/section-5748.01"
  - "https://codes.ohio.gov/ohio-revised-code/section-5703.055"
  - "https://tax.ohio.gov/business/ohio-business-taxes/online-services/thefinderschooldistrict"
  - "https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/employer_withholding/2025-2026%20NYP%20Updates/School_Districts_2026.pdf"
