form: "PA-Working-Pennsylvanians-Tax-Credit"
fullName: "Pennsylvania Working Pennsylvanians Tax Credit"
taxYear: 2026
reference: "https://www.legis.state.pa.us/WU01/LI/LI/US/HTM/1929/0/0176..HTM"
notes: |
  Fiscal Code Article XVI-W.2 sections1603/1604 apply after2024:10% of
  actual same-year federal EITC, refundable; no fixed805 statutorycap.
  DORFAQ4256 requires actual PA earned income and both returns/attached1040
  in this finite route. The helper consumes an already validated federal
  credit; it does not redetermine federal eligibility from a PA/SP flag.
  IRSRevProc2025-32 section4.06 establishes2026 federalmaximum8231;
  2025 federalmaximum8046. Greater values are invalid sources, not capped
  allowed credits. PA40IN rounding is nearest dollar,.50up.
  DORFAQ4255 updated2026-08-24 says2025paperPA40 has no WPTC change;
  DOR adds it duringprocessing. Actualpaper totals exclude it; a separately
  labelled reference estimates the processing adjustment. No final2026map
  or filing/humanreview qualification is enabled.
lines:
  - line: "eligibility"
    description: "Use actual federal EITC, not a separate PA dependency bar"
    formula: "Actual PA earned income>0 and valid same-year federal EITC>0; apply actual statutory separate-PA claimant rule when supplied"
    notes: "Existing PA/SP dependent flag does not independently disallow a valid federal EITC. No earned-income or source-year fact is inferred."
    testRef: "tests/engine/state/pa-working-pennsylvanians-tax-credit.test.ts::PA WPTC eligibility follows the federal EITC amount"
  - line: "credit"
    description: "Ten percent without a fixed805cap"
    formula: "roundDollar(actualFederalEITC*0.10), if eligible; otherwise0"
    notes: "8046 produces805 in2025;8231 produces823 in2026. Values above actual federal maximum or negative/nonfinite actual amounts reject rather than become guessed allowance."
    testRef: "tests/engine/state/pa-working-pennsylvanians-tax-credit.test.ts::PA WPTC credit equals 10 percent of federal EITC rounded to the nearest dollar"
  - line: "2026-indexed-source-and-rounding"
    description: "Preserve indexed source and half-dollar boundaries"
    formula: "2026 valid federalEITC8231*0.1=823.1->823;649/654/655/656 produce65/65/66/66"
    testRef: "tests/engine/state/pa-working-pennsylvanians-tax-credit.test.ts::WPTC uses the actual year maximum and whole-dollar boundaries"
  - line: "joint-federal-separate-pa"
    description: "Only spouse with greater actual pre-WPTC PA tax claims joint-federal credit"
    formula: "Actual confirmed joint federal original+both separately eligible PA owners and originals for sameyear; compare taxafterothercredits beforepayments;greater claimant getscredit,lower gets0"
    notes: "Source references are unique; actual owner names/SSNs/year and federalEIC match. Eachowner actualpositivePAearned amount+originalref+eligibility confirmation is required, and currentowner amount matches outerinput. Unknown/false/missingproof or not-both-eligible is explicitly unavailable, not an inferred soleeligible entitlement. Equal-tax tie has no supplied greater-tax claimant and is explicitly unavailable; no split or paymentbalance comparison. Current canonical common-filing-status route does not originate mixed filings."
    testRef: "tests/engine/state/pa-working-pennsylvanians-tax-credit.test.ts::WPTC separate PA claims require both actual owner tax sources"
  - line: "both-spouses-eligible-sources"
    description: "Greater-tax spouse rule requires actual eligibility of both spouses"
    formula: "Each actualowner needs positivePAearned amount/reference and confirmed eligibility; unknown/false/otherzero unavailable, not inferred from jointEIC+PA tax"
    testRef: "tests/engine/state/pa-working-pennsylvanians-tax-credit.test.ts::WPTC does not infer the other spouse eligibility from tax sources"
  - line: "paper-and-processing-separation"
    description: "Actual2025paper totals exclude processing-stage WPTC"
    formula: "PaperPA40.hiddenRefundableCredits=0; paper24=sum printed13+18+21+22+23; processingreferencecredit separately applies against paper taxprincipal"
    notes: "FAQ4255 controls2025paper; no fictitious field18a/24. Processingreference is not actual DORdisbursement or finalbalance."
    testRef: "tests/pdf/fill-pa-40.test.ts::fillPA40 keeps WPTC separate from actual 2025 paper totals"
  - line: "processing-reference-appendix"
    description: "Keep the processing credit visible on a separate review page"
    formula: "Positive verifiedWPTC -> separately labelled amount/sourceyear/referencepage, after actual2025PA40; allpagesretain reviewonlynotice"
    notes: "No private source references or raw identifiers are rendered; this is not a new official PA40field, filing attachment or actualDORpayment."
    testRef: "tests/pdf/fill-pa-40.test.ts::fillPA40 keeps WPTC separate from actual 2025 paper totals"
packetRules:
  packetBehavior: "reference-only"
  includeWhen:
    - "A verified same-year federal EITC and actual PA earned-source computation produce a processing-reference amount."
  suppressWhen:
    - "No qualifying same-year source credit is established."
  notes: "WPTC is not inserted into2025PA40 printedpayments/refund; no separate qualified filingform or2026physicalmap is claimed."
businessRuleValidation:
  - rule: "pa-working-pennsylvanians-tax-credit-paper-boundary"
    description: "Actual2025paper totals remain the printed formula; WPTC processingreference is separate and source-bound beforeI/O."
    testRef: "tests/pdf/fill-pa-40.test.ts::fillPA40 keeps WPTC separate from actual 2025 paper totals"
