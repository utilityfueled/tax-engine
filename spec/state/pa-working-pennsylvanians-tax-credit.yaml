form: "PA-Working-Pennsylvanians-Tax-Credit"
fullName: "Pennsylvania Working Pennsylvanians Tax Credit"
taxYear: 2025
reference: "https://www.pa.gov/agencies/revenue/resources/tax-types-and-information/personal-income-tax/working-pennsylvanians-tax-credit"

notes: |
  The Working Pennsylvanians Tax Credit (WPTC) is a new Pennsylvania resident
  credit effective beginning in tax year 2025. Pennsylvania describes it as a
  state-level credit modeled after the federal Earned Income Tax Credit (EITC).

  Official 2025 PA materials state:
    - taxpayers who qualify for the federal EITC automatically qualify for the
      state credit;
    - the state credit equals 10% of the federal credit; and
    - the credit is refundable, meaning it can increase the taxpayer's refund.

  The PA preparation guide states the Department of Revenue calculates the
  credit automatically when a copy of federal Form 1040 is included with the
  PA-40 return. The engine computes the amount directly so the PA return is
  fully determined without depending on a filing-service post-process.

  Rounding rule:
    - The sources state the credit is 10% of the federal EITC and list a
      maximum state credit of $805 for tax year 2025.
    - This implies rounding to the nearest dollar because 10% of the maximum
      federal EITC ($8,046) is $804.60.
    - This rounding step is an inference from the official published maximum.

lines:
  - line: "eligibility"
    description: "Resident qualifies when federal EITC is allowed"
    formula: |
      Eligible if:
        - Pennsylvania earned income > $0, where supported earned income means
          PA wages/salary/compensation plus positive PA self-employment income
        - federal earned income credit > $0 for the return, and
        - the taxpayer is not claimed as a dependent on another person's federal return
    notes: |
      The 2025 PA preparation guide says taxpayers who qualify for the federal
      EITC automatically qualify for the state credit, but it also says the
      taxpayer must have earned income in Pennsylvania consisting of wages,
      salary, and/or self-employment income. This resident engine therefore
      requires positive supported PA earned income in addition to a positive
      computed federal EITC amount.
      When validated resident-return input explicitly says the taxpayer is
      claimed as a dependent on another person's federal return, the state
      engine forces WPTC ineligibility even if the embedded federal result is
      positive, because IRS Publication 596 says a taxpayer who can be claimed
      as a dependent cannot claim the earned income credit.
    edgeCases:
      - "Federal EITC is $0: no WPTC"
      - "Federal EITC is positive but Pennsylvania earned income is $0: no WPTC"
      - "Federal EITC disallowed: no WPTC"
      - "Positive federal EITC: WPTC allowed"
      - "Claimed as a dependent on another federal return: no WPTC even when the embedded federal EITC result is positive"
    testRef: "tests/engine/state/pa-working-pennsylvanians-tax-credit.test.ts::PA WPTC eligibility follows the federal EITC amount"

  - line: "credit"
    description: "Working Pennsylvanians Tax Credit amount"
    formula: "min($805, round to nearest dollar: federal EITC × 10%)"
    notes: |
      The credit is refundable and flows through the PA payment side rather
      than being capped by current-year PA tax liability. For tax year 2025,
      official PA materials also state the maximum state credit is $805, so
      the engine caps the computed 10-percent amount at that published limit.
    edgeCases:
      - "Federal EITC $649 produces $65 of WPTC"
      - "Federal EITC $4,328 produces $433 of WPTC"
      - "Federal EITC $8,046 produces $805 of WPTC"
      - "Federal EITC above the official 2025 maximum still caps WPTC at $805"
      - "Federal EITC $0 produces $0"
    testRef: "tests/engine/state/pa-working-pennsylvanians-tax-credit.test.ts::PA WPTC credit equals 10 percent of federal EITC rounded to the nearest dollar"

packetRules:
  packetBehavior: "included-on-pa-40"
  includeWhen:
    - "A Pennsylvania resident return packet is being assembled and the supported resident orchestrator computes a positive Working Pennsylvanians Tax Credit."
  suppressWhen:
    - "No resident Pennsylvania return packet is being assembled."
    - "The supported resident return computes zero Working Pennsylvanians Tax Credit."
  notes: |
    The current packet path does not emit a separate Working Pennsylvanians
    Tax Credit worksheet. The supported resident packet carries the credit
    through official PA-40 payment and refund totals, so packet validation for
    this slice is tied to the PA-40 total-payments and overpayment fields.

businessRuleValidation:
  - rule: "pa-working-pennsylvanians-tax-credit-pa40-totals"
    description: "Inventory support counts the Pennsylvania Working Pennsylvanians Tax Credit packet path as validated only when regression coverage proves the supported credit increases official PA-40 payment and overpayment totals."
    testRef: "tests/pdf/fill-pa-40.test.ts::fillPA40 carries the Working Pennsylvanians Tax Credit through PA-40 total payments and overpayment"
