form: "Full-Batch-Public-CPU-Diagnostic"
taxYear: 2025
status: "nonqualifying-opt-in-diagnostic"
notes: "Sampling wall weights are not process CPU accounting. Original full qualification and the unsampled PA gap remain."
lines:
  - line: "frozen-source-digests"
    description: "Check every frozen replay source before a CI diagnostic is needed"
    formula: "Compare each source file's SHA-256 with the individually reviewed frozen manifest. Any new source must retain the original approved case collection and request limits before updating its pin."
    testRef: "tests/scripts/full-batch-public-cpu-diagnostic.test.mjs::each frozen replay source digest still matches the checkout"
  - line: "explicit-same-job-admission"
    description: "Remain inert unless an exact public default-branch first-attempt manual job opts in"
    formula: "Require explicit cpu_full_batches=true, full source SHA equal to checkout, original complete failed strict run in the same job, and exact current protected container. No provider credentials or Node options cross into browser children."
    testRef: "tests/scripts/full-batch-public-cpu-diagnostic.test.mjs::explicit-same-job-admission"
  - line: "original-whole-batch-selection"
    description: "Keep original batch6 and batch7 rows and ordering"
    formula: "Validate the full655-case collection and unchanged audit, then select only original batch6(10cases) or batch7(15cases) with exact row identities, ordering, deadlines and bounds. Do not repack. Existing fixture wrappers sample6 and8targets respectively; other original neighbors execute unchanged and PA remains unsampled."
    testRef: "tests/scripts/full-batch-public-cpu-diagnostic.test.mjs::original-whole-batch-selection"
  - line: "original-browser-contract"
    description: "Execute each whole batch under the original two-worker contract"
    formula: "Preserve configured2workers/0retries/30000ms, chromium and retain-on-failure tracing including snapshotsfalse. Recollect and reconcile every original row before execution; preserve actions, assertions, source guards and request bounds. Record observed workers from actual results without assuming two workers ran."
    testRef: "tests/scripts/full-batch-public-cpu-diagnostic.test.mjs::original-browser-contract"
  - line: "remaining-job-budget"
    description: "Hold rather than extend the original job or controller deadline"
    formula: "Derive the current90-minute job deadline from identity-checked public same-run job metadata. Require600seconds for each separate controller plus600seconds reserved for remaining job steps. Refuse foreign/stale/future/completed job metadata. If insufficient, write fixed HOLD; never extend any limit."
    testRef: "tests/scripts/full-batch-public-cpu-diagnostic.test.mjs::remaining-job-budget"
  - line: "sanitized-only-artifacts"
    description: "Reuse the reviewed public-JavaScript projection and retain no raw payload"
    formula: "Reuse inventory and profile validators, record only sanitized public chunk projections and fixed outcome metadata. Temporary original trace/PW/raw profile files never enter uploaded artifacts. Preserve original failure and PA gap, normal owned-child cleanup and all image protections. Composite remains default-off, accepts one fixed batch per call, and requires separate10-minute parent workflow steps."
    testRef: "tests/scripts/full-batch-public-cpu-diagnostic.test.mjs::sanitized-only-artifacts"
  - line: "job-budget-unavailable-stage"
    description: Record which public job-budget check stopped the diagnostic
    formula: Distinguish request failure, HTTP status, malformed response and rejected job identity. Record only a fixed reason and the HTTP status when present. Stop before browser replay if the exact job budget is unavailable. Never retain the response body or exception text.
    testRef: "tests/scripts/full-batch-public-cpu-diagnostic.test.mjs::public job budget reports only bounded failure reasons"
  - line: "pinned-pdf-test-prerequisite"
    description: Run both optional browser paths with the verified PDF test interpreter
    formula: >-
      Use the ordinary test runner's explicit Python override or checkout test
      environment. Resolve relative paths from the checkout and preserve bare
      commands for PATH lookup, anchoring relative PATH entries at the checkout
      for both the probe and its children. Verify pypdf 6.10.0 before collection or
      execution,
      including under Python optimization. Supply the validated interpreter to
      each Playwright child. If it is unavailable, stop
      with fixed diagnostic metadata. Retain the existing original-run, timing,
      and qualification gates.
    testRef: "tests/scripts/full-batch-public-cpu-diagnostic.test.mjs::binds pinned PDF test Python before optional browser children with no host fallback"
  - line: "school-pre-export-phases"
    description: Compare Ohio part-year school and header entry and first confirmations before review download
    formula: >-
      In both admitted trace-pair legs only, add fixed begin and end marks around
      the original school entry, first school confirmation and first header
      confirmation. Use the existing header entry and review download marks
      from the same reconciled school case. Accept only whole marker strings in
      that phase order and record the observed prefix. Each phase is completed
      with bounded milliseconds, started without a duration, or unavailable.
      Ambiguous or over-limit marker input makes the phases unavailable without
      changing the case outcome. Never retain raw stdout, test payloads or added
      source paths. Preserve original actions, assertions, case identities,
      request budgets, workers, retries, deadlines and image.
    testRef: "tests/scripts/full-batch-public-cpu-diagnostic.test.mjs::projects only fixed school phase markers from reconciled paired cases"
