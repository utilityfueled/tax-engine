form: "NEW212-Container-Timing-Replay"
taxYear: 2025
status: "nonqualifying-opt-in-diagnostic"
notes: "Keep original deadline failures and all tax/PDF/privacy oracles; elapsed intervals are not CPU accounting or readiness evidence."
lines:
  - line: "explicit-source-admission"
    description: "Default-off exact-source public first-attempt manual replay"
    formula: "Require exact probe value1 and explicit enabled dispatch, public nonfork default branch, full source SHA equal to checkout and event, first attempt, native Linux AMD64 job and exact protected local runtime image. Invalid or absent opt-in never executes a browser case."
    testRef: "tests/scripts/new212-container-timing-replay.test.mjs::explicit-source-admission"
  - line: "exact-two-original-cases"
    description: "Preflight the unchanged desktop and mobile originals before executing"
    formula: "Select only the two existing NEW212 lifecycle cases at1280px and390px. Require chromium, expected passed and30000ms each. Retain the original selected Python interpreter and pypdf6.10.0 prerequisite before collection. Invoke the existing source/request-budget-admitted rate-window runner, configured2workers/0retries/30000ms; preserve all original actions, assertions, PDF child arguments and natural-window budgets."
    testRef: "tests/scripts/new212-container-timing-replay.test.mjs::exact-two-original-cases"
  - line: "fixed-timing-projection"
    description: "Retain only the existing ten fixed phases and their observed boundaries"
    formula: "Project validated v1 fixed phase/boundary/elapsedMs/ok records from actual per-case stdout. Reject extra fields or malformed diagnostic records; preserve incomplete evidence and real case outcomes. Never infer CPU, server/network cause, complete suites or qualification from diagnostic success."
    testRef: "tests/scripts/new212-container-timing-replay.test.mjs::fixed-timing-projection"
  - line: "bounded-isolated-workflow"
    description: "Use the same strict runtime protections without default workflow cancellation"
    formula: "Separate manual default-off workflow, unique run-id concurrency with cancellation disabled, pinned read-only actions,35minute job and8minute browser step. Build original Dockerfile; retain exact source/image proof and normal owned stop/remove. No production, secrets, paid providers, image publication, cap additions or runtime protection relaxation."
    testRef: "tests/scripts/new212-container-timing-replay.test.mjs::bounded-isolated-workflow"
