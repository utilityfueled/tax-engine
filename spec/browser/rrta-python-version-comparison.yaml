form: "RRTA-Python-Version-Comparison"
taxYear: 2025
status: "opt-in-nonqualifying-experiment"
lines:
  - line: "exact-public-synthetic-inputs"
    description: "Use only the two exact previously retained synthetic RRTA PDFs"
    formula: "Require exact public repository/run/source/artifact identity, ZIP digest and bounded exact PDF members. Do not upload PDFs, markers, ZIPs, raw stdout/stderr or arbitrary artifact files."
    testRef: "tests/scripts/rrta-python-version-comparison.test.mjs::exact-public-synthetic-inputs"
  - line: "fixed-version-protocol"
    description: "Compare regular-GIL Linux x64 CPython 3.13.18 and 3.14.10 without changing the privacy helper"
    formula: "Same pinned pypdf wheel/package source, helper, markers and two PDFs. Four warmups per PDF then twelve ABBA blocks per PDF: 104 comparison children, 96 measured, 48 pairs. Each original -I -B invocation keeps 4000ms and 65536-byte bounds; all eight result fields must equal the pinned expected result. Retain every failure without retry or exclusion."
    testRef: "tests/scripts/rrta-python-version-comparison.test.mjs::fixed-version-protocol"
  - line: "failure-and-parity-hold"
    description: "No censored speedup or changed privacy behavior may pass"
    formula: "Require complete fixed attempts and both interpreter synthetic privacy/geometry/malformed/first-error controls. Any failed/timeout/overflow/unknown attempt holds. Require paired median improvement at least 10 percent independently for both PDFs. No current strict-runtime, CPU-cause or readiness claim."
    testRef: "tests/scripts/rrta-python-version-comparison.test.mjs::failure-and-parity-hold"
  - line: "standalone-private-workspace"
    description: "Manual experiment cannot cancel normal qualification or expose artifact inputs"
    formula: "Manual-only standalone workflow, unique run-id group, fixed 20-minute job, 16-minute experiment, read-only Actions permission. Temporary archive/PDF/venvs are removed in finally. Upload only explicit JSON result files for three days; no shared CI/Web changes."
    testRef: "tests/scripts/rrta-python-version-comparison.test.mjs::standalone-private-workspace"
