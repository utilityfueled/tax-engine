    description: "Form8949 categories transfer to their printed ScheduleD rows"
    formula: "8949 A/B/D/E totals go to ScheduleD1b/2/8b/9 respectively, including proceeds, basis, adjustments and gain; 1a/8a remain blank when those transactions are reported on8949"
