    description: "Separate other-form, pass-through and capital-loss carryover subtotals"
    formula: "4=6252ST+6781ST;5=K1ST+1041K1ST;6=priorST+final1041STloss;11=4797line9+6252LT+6781LT+8824capital;12=K1LT+1041K1LT;14=priorLT+final1041LTloss. Loss carryovers print as positive amounts within preprinted parentheses."
