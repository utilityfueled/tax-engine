    testRef: "tests/pdf/schedule-d-actual-subtotals.test.ts::prints pass-through and prior carryover components separately"
  - line: "QOF"
    description: "Unknown QOF disposition answer stays unknown"
    formula: "Do not derive a QOF investment disposition answer from presence of Form8949 or capital gain; absent an actual confirmed QOF source, leave both boxes blank"
    irsRef: "Final2025 ScheduleD page1 question above PartI; retrieved2026-10-25"
    testRef: "tests/pdf/schedule-d-actual-subtotals.test.ts::leaves the QOF answer unknown instead of inventing a disposition"
  - line: "17-22"
    description: "Follow the printed summary routing and actual qualified dividend question"
    formula: "Net loss/zero skips17-20; net gain answers17. If15and16are bothgains, skip21and22;20uses known18/19and4952 facts only. Otherwise22answers whether1040line3aqualified dividends are positive."
