form: "Form 8962"
fullName: "Premium Tax Credit (PTC)"
taxYear: [2025, 2026]
irsReference: "https://www.irs.gov/instructions/i8962"
references:
  - "https://www.irs.gov/publications/p974"
  - "https://www.irs.gov/irb/2025-32_IRB"
  - "https://www.govinfo.gov/content/pkg/FR-2025-01-17/html/2025-01377.htm"
  - "https://www.govinfo.gov/content/pkg/PLAW-119publ21/html/PLAW-119publ21.htm"
  - "https://www.ecfr.gov/current/title-26/section-1.36B-2"
notes: >-
  Refreshed 2026-10-25. Final IRS instructions available are for 2025; their
  physical line identifiers describe the audit, not a qualified 2026 form.
  Apply enacted 2026 law and indexed percentages without applying the 2027
  noncitizen restrictions or 2028 verification changes early. The October 15,
  2026 proposed regulations are not final law. All monetary operations use
  Decimal. Historical aggregate inputs remain explicitly unverified; they cannot
  establish coverage, residency, below-poverty or separate-filing exceptions.
  A verified 2026 computation requires the actual facts in ptc-source-facts.yaml.
lines:
  - line: "1"
    description: "Actual tax family size"
    formula: "Use confirmed Form 8962 tax-family worksheet, never count all household members or every entered dependent automatically."
    irsRef: "Form 8962 line 1"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::uses actual household income and regional prior-year poverty guidelines"
  - line: "2a"
    description: "Taxpayer modified AGI"
    formula: "Actual Worksheet 1-1: AGI plus tax-exempt interest, Form 2555 lines 45 and 50, and nontaxable Social Security, with Form 8814 coordination. Preserve signed MAGI."
    irsRef: "Form 8962 Worksheet 1-1"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::uses actual household income and regional prior-year poverty guidelines"
  - line: "2b"
    description: "Required-filing dependents modified AGI"
    formula: "Actual Worksheet 1-2 combined signed MAGI only for dependents required to file, including applicable Form 8814 adjustments. Known zero is explicit."
    irsRef: "Form 8962 Worksheet 1-2"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::combines signed taxpayer and required-filing dependent MAGI before flooring household income"
  - line: "3"
    description: "Household income"
    formula: "max(0, line 2a + line 2b)"
    irsRef: "Form 8962 line 3"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::combines signed taxpayer and required-filing dependent MAGI before flooring household income"
  - line: "4"
    description: "Federal poverty line"
    formula: >-
      Base plus increment times (actual family size minus one). TY2025 uses 2024
      HHS guidelines: contiguous 15060/5380, Alaska 18810/6730, Hawaii 17310/6190.
      TY2026 uses 2025 guidelines: contiguous 15650/5500, Alaska 19550/6880,
      Hawaii 17990/6330. Confirm applicable residence region; where more than
      one regional guideline applies use the greatest applicable guideline.
    irsRef: "Form 8962 Tables 1-1 through 1-3; 2025 HHS guidelines"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::uses actual household income and regional prior-year poverty guidelines"
  - line: "5"
    description: "Household income percentage used by the applicable figure table"
    formula: "If line 3 > 4 times line 4, enter 401; otherwise floor(line 3 / line 4 times 100). Retain the unrounded percentage only as a diagnostic, never as the table input."
    irsRef: "Form 8962 Worksheet 2"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::drops the percentage fraction and rounds the applicable figure to four decimals"
  - line: "7"
    description: "Applicable figure and taxpayer eligibility"
    formula: >-
      Interpolate only within the selected bracket using Decimal and round the
      resulting decimal rate to four places. TY2025 enhanced rates remain 0 below
      150, 0 to .02 at 150-200, .02 to .04 at 200-250, .04 to .06 at 250-300,
      .06 to .085 at 300-400, and .085 above 400. TY2026 rates: .021 below 133,
      .0314 to .0419 at 133-150, .0419 to .066 at 150-200, .066 to .0844 at
      200-250, .0844 to .0996 at 250-300, and .0996 at 300-400. No 2026 PTC
      when actual household income exceeds 400 percent. Below 100 requires an
      actual applicable exception; the lawful-presence/Medicaid exception ends
      in 2026. The marketplace-estimate exception requires actual qualifying
      estimate, accurate information and positive APTC. Claimed-as-dependent
      taxpayers are ineligible. MFS requires confirmed applicable abuse or
      abandonment exception, including its three-year limitation.
    irsRef: "Form 8962 Table 2; Rev. Proc. 2025-25; PL 119-21 section 71302; 26 CFR 1.36B-2(b)"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::applies 2026 income limits and only actual eligibility exceptions"
  - line: "8a"
    description: "Annual contribution"
    formula: "Round line 3 times line 7 to nearest dollar."
    irsRef: "Form 8962 line 8a"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::drops the percentage fraction and rounds the applicable figure to four decimals"
  - line: "8b"
    description: "Monthly contribution"
    formula: "Round line 8a divided by 12 to nearest dollar, once per tax family and month."
    irsRef: "Form 8962 line 8b"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::uses one rounded monthly contribution for multiple policies"
  - line: "9"
    description: "Special worksheets"
    formula: >-
      Allocation between tax families, elected alternative marriage calculation,
      unlawful-presence mixed coverage, and circular self-employed insurance
      deduction coordination require completed source worksheets. Reject these
      scenarios while their dedicated worksheet integration is unavailable;
      never substitute ordinary unallocated figures.
    irsRef: "Form 8962 line 9; Pub. 974"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::rejects unresolved special worksheets and missing source facts"
  - line: "10"
    description: "Annual versus monthly calculation"
    formula: >-
      Use annual line 11 only if every source policy covered all twelve months
      with unchanged enrollment and benchmark premiums, and actual corrected
      monthly premium/benchmark/coverage eligibility is unchanged. Otherwise
      use monthly lines 12-23. QSEHRA adjustments follow Worksheet N/Q under
      the selected method. APTC changes alone do not prevent annual calculation.
    irsRef: "Form 8962 line 10; Pub. 974 Worksheets N/Q"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::selects the annual method only for unchanged full-year source policies"
  - line: "11a-11f"
    description: "Annual reconciliation columns"
    formula: >-
      a=sum actual eligible enrollment premiums, b=sum corrected household SLCSP,
      c=line 8a, d=max(0,b-c), e=min(a,d) adjusted for actual QSEHRA,
      f=sum actual APTC. A duplicate household benchmark on multiple source
      policies is included only once in corrected monthly reconciliation.
      Do not emit monthly audit lines when using annual calculation.
    irsRef: "Form 8962 line 11; Pub. 974 Worksheet Q Parts II and III"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::selects the annual method only for unchanged full-year source policies"
  - line: "12-23"
    description: "Monthly reconciliation columns for January through December"
    formula: >-
      For each actual covered month: a=eligible enrollment premiums,
      b=corrected coverage-family benchmark, c=line 8b, d=max(0,b-c),
      e=min(a,d) adjusted by QSEHRA, f=actual combined APTC. Known ineligible
      coverage has zero allowed PTC and retains APTC for repayment. Starting
      with 2026, coverage enrolled solely through an income-based special
      enrollment period without a qualifying life event is not eligible.
      Require one complete monthly reconciliation row per source month.
    irsRef: "Form 8962 lines 12-23; PL 119-21 section 71304"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::uses one rounded monthly contribution for multiple policies"
  - line: "qsehra"
    description: "QSEHRA adjustment"
    formula: >-
      Actual Worksheet N affordability determines zero PTC for an affordable
      QSEHRA month. Otherwise subtract actual monthly permitted benefit, floored
      at zero. Under annual calculation allocate the tentative annual credit
      equally over twelve months before this adjustment; retain Decimal precision
      and round the resulting annual credit. No inferred employer benefit or
      affordability. All rows explicitly report zero benefit for unaffected months.
    irsRef: "Pub. 974 Worksheets N and Q"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::reconciles actual QSEHRA benefits using the selected calculation method"
  - line: "24"
    description: "Allowed premium tax credit"
    formula: "Annual column e or sum monthly column e, rounded to nearest dollar."
    irsRef: "Form 8962 line 24"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::selects the annual method only for unchanged full-year source policies"
  - line: "25"
    description: "Advance premium tax credit"
    formula: "Annual column f or sum monthly column f; reconcile every source statement."
    irsRef: "Form 8962 line 25"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::rejects inconsistent duplicate or incomplete source reconciliation"
  - line: "26"
    description: "Net refundable premium tax credit"
    formula: "max(0,line 24-line 25); route to Schedule 3 line 9."
    irsRef: "Form 8962 line 26"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::records distinct excess, repayment limit and repayment lines"
  - line: "27"
    description: "Excess advance premium tax credit before limitation"
    formula: "max(0,line 25-line 24), before any repayment cap."
    irsRef: "Form 8962 line 27"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::records distinct excess, repayment limit and repayment lines"
  - line: "28"
    description: "Repayment limitation"
    formula: >-
      TY2025 only: below 200 percent 375 single / 750 other; 200 to below 300
      975 / 1950; 300 to below 400 1625 / 3250; 400 or more no limitation.
      TY2026 no repayment limitation at any income under PL 119-21 section
      71305; retain null for no limit, never misrepresent zero as a zero cap.
    irsRef: "Form 8962 Table 5; PL 119-21 section 71305"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::repays all excess 2026 advances without the historical income-based caps"
  - line: "29"
    description: "Excess APTC repayment tax"
    formula: "min(line27,line28) where a cap applies, otherwise line27; route to Schedule 2 line 1a."
    irsRef: "Form 8962 line 29"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::records distinct excess, repayment limit and repayment lines"
  - line: "30-33"
    description: "Allocation of policy amounts"
    formula: "Preserve an explicit allocationRequired fact and reject ordinary calculation pending completed Part IV source allocations and agreements; no inferred 50-percent or zero allocation."
    irsRef: "Form 8962 Part IV"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::rejects unresolved special worksheets and missing source facts"
  - line: "34-35"
    description: "Alternative calculation for year of marriage"
    formula: "Preserve actual election and reject ordinary calculation pending Part V/Pub. 974 worksheet integration; do not silently discard an election."
    irsRef: "Form 8962 Part V"
    testRef: "tests/engine/forms/form-8962-2026.test.ts::rejects unresolved special worksheets and missing source facts"
  - line: "packet"
    description: "Non-filing reference summary"
    formula: "Copy distinct audited household, contribution, monthly or annual reconciliation and repayment values. Label unverified historical inputs and every PDF page review-only; do not recreate or qualify an official 2026 form."
    irsRef: "Form 8962 Parts I-III"
    testRef: "tests/pdf/fill-form-8962.test.ts::fillForm8962Reference keeps the packet artifact reference-only and limited to supported Form 1095-A and Form 8962 reconciliation outputs"
