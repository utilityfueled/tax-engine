form: "Publication974 passive-first coordination"
fullName: "Actual rental allowance before subsequent ordered Marketplace deductions"
taxYear: 2025
irsReference: "https://www.irs.gov/publications/p974"
notes: |
  Where Form8582 lines1d and3 are losses, WorksheetX and the first Simplified
  pass omit rental real estate losses. Compute Form8582 using the preceding
  Step3 health deduction, retain that allowance, and repeat the method before
  IRA, savings bond and student loan worksheets. Current positive rental income
  remains present. WorksheetY line2 uses the actual newly allowed loss once.
  This bounded source path covers actual ordinary rental pools; unresolved K1
  active-participation and disposition histories must not be inferred.
