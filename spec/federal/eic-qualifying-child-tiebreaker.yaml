form: "EIC qualifying-child tie-breakers"
fullName: "Married child and nonparent competing-claim rules on actual child sources"
taxYear: 2025
irsReference: "https://www.irs.gov/publications/p596"
notes: |
  Retrieved 2026-10-31. IRC152(c)(1)(E), (c)(4)(A) and (C), (b)(2); IRC32(c)(3)(B);
  Pub596 Rules 8 and 9 and the Married child paragraph; Pub501 Qualifying Child of
  More Than One Person. These rows apply on the actual child-source routes used by
  Form8862 and separated-spouse claims.
  A married child is a qualifying child only if the filer can claim the child as a
  dependent, or could but released the claim to the other parent. A parent's rule
  is unchanged. A filer who is not the child's parent loses the child to any parent
  who claims, and otherwise needs AGI above every other eligible claimant. A filer
  who loses may still claim the credit with no qualifying child.
  Limits: no IRS source reviewed says how to compare AGI on a joint return, or what
  happens at equal AGI, so both reject for a reviewer. The filer's AGI is entered on
  the child record and must match the return.
lines:
  - line: "married-child"
    description: "Apply the dependency test to a married child"
    formula: "Married with can_claim or released_to_other_parent qualifies, cannot_claim does not, and an unknown answer rejects. An answer for an unmarried child rejects. The joint-return test still applies."
    irsRef: "Pub596 Married child; IRC32(c)(3)(B); IRC152(c)(1)(E)"
    testRef: "tests/engine/eic-qualifying-child-tiebreaker.test.ts::applies the dependency test to a married child"
  - line: "nonparent-tiebreaker"
    description: "Apply the nonparent competing-claim order"
    formula: "A parent who claims takes the child. A parent who may claim but does not leaves the child only with a filer whose AGI exceeds every parent's. With no parent, the highest AGI takes the child. A parent filer keeps the existing rule."
    irsRef: "IRC152(c)(4)(A)(i),(ii) and (C); Pub596 Rule 9 Tiebreaker rules"
    testRef: "tests/engine/eic-qualifying-child-tiebreaker.test.ts::applies the nonparent competing-claim order"
  - line: "unsettled"
    description: "Reject comparisons with no published method"
    formula: "A joint-return filer who is not the parent, and an AGI equal to the highest other claimant's, reject for a reviewer. Missing AGI or parent answers reject. Entered AGI with no comparison to make rejects."
    irsRef: "Pub501 Qualifying Child of More Than One Person has no joint-return or equal-AGI rule"
    testRef: "tests/engine/eic-qualifying-child-tiebreaker.test.ts::rejects comparisons with no published method"
  - line: "return-agi"
    description: "Tie the entered AGI to the completed return"
    formula: "The AGI entered on a child record must equal Form1040 line11 in whole dollars, and a filer who loses every child is left with no qualifying child on the return."
    irsRef: "IRC152(c)(4); Form1040 line11"
    testRef: "tests/engine/eic-qualifying-child-tiebreaker.test.ts::ties the entered AGI to the completed return"
