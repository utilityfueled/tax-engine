lines:
  - line: "revision"
    description: "Pin the actual final annual PDF bytes"
    formula: "SHA256 a42f5a19c0e84a966a49b5f4ca021d3f49c4fda2e087da0b00bf2003525f8655; 77739 bytes; two pages; printed 2026 and Created 4/27/26. No substitution of 2025 bytes."
    testRef: "tests/pdf/schedule-se-2026-candidate.test.ts::pins the exact final annual source"
  - line: "physical-locations"
    description: "Bind every original leaf to its printed location"
    formula: "Require a bijection for all 27 leaf widgets (26 text, one checkbox), with original full field name, type, page and four rectangle coordinates. Group nodes are not leaves; the two fixed printed-amount anchors remain empty."
    testRef: "tests/pdf/schedule-se-2026-candidate.test.ts::maps every leaf to its original physical location"
  - line: "saved-values"
    description: "Save and reopen fictional field probes"
    formula: "Preserve every writable text value and both minister-checkbox states, nonempty saved appearances, empty printed-amount anchors and a review notice on both pages. Use REDACTED instead of any SSN; no tax calculation is invoked."
    testRef: "tests/pdf/schedule-se-2026-candidate.test.ts::retains diagnostic values and both checkbox states after save"
  - line: "regular-method-source"
    description: "Project one 2026 wagering business and carry the printed tax and deduction"
    formula: |
      Replay the complete current primary-owner professional wagering Schedule C
      ledger. Require explicit review of all self-employment and covered payroll
      sources and confirmation of no exemption, church income or optional method.
      Reconcile any linked Form W-2G originals through the same Schedule C ledger.
      W-2G withholding and gross amounts do not transfer independently to Schedule SE.
      Farm, partnerships, other SE sources and state returns require separate methods.
      Lines 2 and 3 transfer rounded Schedule C line 31. Determine
      eligibility using exact line 3 times 0.9235 and the $400 threshold. Print
      lines 4a, 4c and 6 only if they reconcile to the rounded line 3. Round
      line 11 at 2.9% of line 6, line 12 as the sum of applicable tax and line
      13 at 50% of line 12. Verify fresh Schedule SE outputs.
      Keep both identities, unavailable line inputs and Part II blank.
    testRef: "tests/pdf/schedule-se-2026-wagering-candidate.test.ts::projects the current wagering profit into the final regular Schedule SE"
  - line: "8a-10"
    description: "Apply the wage-base limit using actual primary W-2 payroll"
    formula: |
      Require confirmation that every current primary W-2 original is included
      once, with no Tier 1 railroad compensation or Form 4137 or 8919 amounts.
      Each original explicitly supplies its year, owner and exact nonnegative
      Boxes 3 and 7, including known zeroes. Their sum per original cannot
      exceed the wage base. Require one ordinary original per distinct Box b
      employer EIN for this candidate. Nonzero allocated tips require a
      separate source method. Add Boxes 3 and 7 across all originals before
      rounding to line 8a. With no covered wages, lines 8a and 8d are zero.
      At or above $184,500 skip lines 8b through 10 and enter only Medicare tax
      on line 11. Below the limit, line 8d equals line 8a, line 9 is $184,500
      less line 8d, and line 10 is 12.4% of the smaller of lines 6 and 9,
      rounded to dollars. Refuse when exact and displayed wages select different
      branches. Keep lines 8b and 8c blank for this source slice.
    testRef: "tests/pdf/schedule-se-2026-wagering-candidate.test.ts::projects covered wages from original W-2 boxes and omits lines at the wage base"
  - line: "regular-method-refusal"
    description: "Hold threshold, unrelated sources and inconsistent whole-dollar arithmetic"
    formula: "Deny incomplete or contradictory confirmations, a retained unhandled source even at zero, under-threshold profit and a rounded result that cannot reproduce the printed line calculations."
    testRef: "tests/pdf/schedule-se-2026-wagering-candidate.test.ts::refuses other sources and a nonreconciling regular-method projection"
  - line: "closed-exports"
    description: "Keep physical availability separate from qualification"
    formula: "The frozen candidate is absent from qualified review and filing template packs; both public 2026 export modes continue to refuse, and 2026 bytes are rejected by the 2025 hash allowlist."
    testRef: "tests/pdf/schedule-se-2026-candidate.test.ts::keeps every export gate closed"
