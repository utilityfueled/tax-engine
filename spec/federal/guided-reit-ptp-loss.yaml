form: "Guided Form 8995 and 8995-A REIT and PTP loss sources"
fullName: "Filed preceding-year section 199A REIT and PTP loss carryforward"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i8995"
lines:
  - line: "filed-original"
    description: "Collect the actual carryforward from the preceding filed return"
    formula: "Accept Form 8995 line 17 or Form 8995-A Part IV line 40, with a source reference, the immediately preceding tax year, and explicit confirmation of the filed original. Retain an explicit zero and forward the nonnegative Decimal loss magnitude independently of current K-1s and ordinary QBI losses. Keep untouched amounts unknown. Block an incomplete started source."
    irsRef: "https://www.irs.gov/pub/irs-prior/f8995--2025.pdf; https://www.irs.gov/pub/irs-prior/f8995a--2025.pdf"
    testRef: "tests/guided-interview/guided-reit-ptp-loss.test.ts::passes filed REIT and PTP carry independently and preserves zero"
  - line: "filing-unit"
    description: "Match the names and last four tax ID digits of the same filers"
    formula: "Require the same filing status recorded on the filed source. For a joint current return require both prior filers and explicit confirmation of the same joint filing unit; for a nonjoint return bind the source to the primary filer. Source, return-year and owner edits revoke confirmation while retaining the records. Saved drafts still require matching year, filing status and filers on reopen."
    irsRef: "Section 199A REIT and PTP carryforward; Form 8995 and Form 8995-A filer identification"
    testRef: "tests/guided-interview/guided-reit-ptp-loss.test.ts::requires the same filing unit and review after source or taxpayer changes"
  - line: "standalone-interview"
    description: "Route and retain actual carry sources independently of current K-1s"
    formula: "A REIT or PTP loss carryforward selection or a saved source adds the Adjustments route. An affirmative selection requires the filed source before proceeding, even after removing incomplete or incorrect source records. The taxpayer can explicitly correct the selection when no filed source remains. Draft storage preserves untouched, incomplete and confirmed answers without manufacturing a zero. The source feeds the existing section 199A input without changing filing readiness or e-file gates."
    irsRef: "Form 8995 lines 6-9 and 17; Form 8995-A Part IV lines 28-31 and 40"
    testRef: "tests/guided-interview/guided-reit-ptp-loss.test.ts::routes and reopens original carry sources with no current K-1"
  - line: "filed-form-controls"
    description: "Show the selected form's actual carryforward line and collect confirmation"
    formula: "An empty new source keeps the amount and confirmation unanswered. A form selection identifies the original line. An explicit zero remains visible and changing the amount requires review before transfer. Removing the source while applicability remains affirmative offers an explicit correction control and otherwise holds the return."
    irsRef: "Form 8995 line 17; Form 8995-A Part IV line 40"
    testRef: "tests/apps/web/reit-ptp-loss-interactions.test.tsx::collects a filed zero and revokes confirmation on amount changes"
