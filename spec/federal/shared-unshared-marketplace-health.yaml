form: "Shared and unshared Marketplace health source coordination"
fullName: "Actual allocated and unallocated original policies in one health plan"
taxYear: 2025
irsReference: "https://www.irs.gov/publications/p974"
retrievedAt: "2026-10-26"
notes: |
  Pub974 Specified Premiums applies the actual tax-family policy allocation
  before coverage-family attribution. Final i8962 column (b) combines allocated
  and unallocated original policy amounts using its applicable benchmark rules.
  The existing source allocator validates unshared original identities, actual
  household membership, correct benchmarks and all overlapping coverage groups.
  A validated not_shared source contributes its full original amounts, without
  a fabricated Part IV percentage. A plan marked as including an outside
  family must retain an actual linked outside-family covered person; merely
  having another shared policy elsewhere on the return does not establish that. The health binder keeps full receipts and
  independently supplied owner cash, other-family cash and individual advances.
  This route uses one owner/business, complete coverage-family membership and
  the existing payment/allocated-share reconciliation; no outside-family cash,
  partial-family allocation or owner repayment split is inferred. Final 2026
  filing qualification is separate. These examples are derived statutory
  controls, not published numerical or human-qualified oracles.
