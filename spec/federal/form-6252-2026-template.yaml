form: "Form 6252 final 2026 physical candidate"
fullName: "Final 2026 Installment Sale Income form physical fields"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-prior/f6252--2026.pdf"
revision: "Created 6/16/26, IRS final index posted 10/16/2026"
retrievedAt: "2026-11-13"
reviewStatus: "independent-qualified-tax-review-pending"
notes: |
  The final annual IRS PDF includes the instructions on pages 2 through 4.
  The physical map and the bounded original-source projection remain disabled
  in public review and filing exports.
lines:
  - line: "source"
    description: "Pin the final annual form and integral instructions"
    formula: >-
      Require the 119676-byte official blank with SHA-256
      efecc62a9ed84ba8328eaceecc71305b7176ffa072ad24a30bb9cb4d5ded9310,
      the 2026 form title and four pages. Pages 2 through 4 are the official
      instructions and contain no form widgets.
    testRef: "tests/pdf/form-6252-2026-candidate.test.ts::pins the final blank and its integral instructions"
  - line: "1–37"
    description: "Bind the installment sale and related-party widgets"
    formula: >-
      Identify name and identification number, description and both dates,
      three yes/no pairs, line amounts, the decimal entry on line 19, both
      rows on line 27, five exception checkboxes on line 29 and its distinct
      disposition date. Preserve the exact physical positions, types and
      checkbox appearance states for all 49 widgets on page 1.
    testRef: "tests/pdf/form-6252-2026-candidate.test.ts::matches every official page-one field and widget location"
  - line: "19, 27–29"
    description: "Keep nearby controls separately addressable"
    formula: >-
      Preserve the physical decimal entry for the gross profit percentage,
      both rows for the combined related-party details, the yes/no pair, and
      each exception box apart from the separate date under 29a.
    testRef: "tests/pdf/form-6252-2026-candidate.test.ts::binds the decimal, related-party rows and exception date separately"
  - line: "1–26 ordinary current sale"
    description: "Project a confirmed current installment sale of domestic investment land"
    formula: >-
      Require the actual closing, basis and payment records for a fixed-price,
      unrelated-buyer sale in calendar year 2026. The land was held for investment
      more than one year and was never depreciated, held for customers, or used
      as a home or in a business. Confirm the ordinary installment method, no
      special interest, deemed payment or recapture methods, no assumed debt,
      and the complete current principal separate from interest. Prove at least
      one positive scheduled principal payment after 2026 from the original
      agreement. Its date must follow the sale and its amount must fit the
      outstanding principal. Zero current principal is allowed. Use actual
      dates and the line 1 category code 4 with the neutral description
      Investment land. Lines 3 and 4 select
      No and Yes. Preserve the line 14 gain gate and confirm an open contract
      balance. Lines 5 through 18 derive from the closing/basis amounts; line 19
      is the line 16/18 ratio shown as a decimal with at least four places. Line
      20 is zero, line 21 is actual 2026 principal, line 22 is its sum with line
      20, and line 23 is zero. Line 24 is line 22 times line 19, rounded to
      dollars. Line 25 is zero and line 26 equals line 24, a long-term capital
      gain. Round the printed money and check that the printed whole-dollar
      arithmetic and bounded-precision ratio reproduce the fresh exact-source
      calculation. Refuse contradictory, unconfirmed or nonreconciling inputs.
      Identity, related-party fields, source references and instructions are
      outside the writable projection.
    testRef: "tests/pdf/form-6252-2026-candidate.test.ts::projects a confirmed current investment-land installment sale"
  - line: "1–26 ordinary subsequent year"
    description: "Project a later year of a confirmed domestic investment-land installment contract"
    formula: >-
      Bind a pre-2026 long-term sale to the actual original closing, basis,
      gross profit percentage, complete dated ledger and unchanged fixed-price
      contract. The original sale year must have deferred principal. Each prior
      payment year must be present explicitly from the sale through 2025, even
      when no principal was paid. Line 19 carries the original sale-year
      percentage as reported with four to six places, including any trailing
      zero. Verify that the retained percentage agrees at its precision with
      both the exact and printed gross-profit/contract-price amounts. Line 20
      is zero. Enter actual 2026 principal on line 21 and earlier principal on
      line 23. Exclude interest. Require a positive balance entering 2026;
      admit no-payment years and the final principal payment in 2026. Reject
      missing years, excess principal, recapture, new contract terms and a
      carried ratio that would change the printed recognized gain. Leave all
      identity and related-party fields blank and keep public exports disabled.
    reference: "Final 2026 Form 6252 instructions, Which Parts To Complete and Lines 19, 21, 23–26"
    testRef: "tests/pdf/form-6252-2026-candidate.test.ts::projects a confirmed later investment-land installment year and retains the original ratio"
    testRefs:
      - "tests/pdf/form-6252-2026-candidate.test.ts::admits zero and final installments and rejects inconsistent prior sale and ledger evidence"
  - line: "diagnostic"
    description: "Reopen a review-marked synthetic diagnostic"
    formula: >-
      Verify synthetic dates, text, checkbox selections and a decimal
      appearance after reopening. Keep all identity fields blank and retain
      the integral instructions. Remove inherited executable content and the
      obsolete signature from the edited diagnostic only.
    testRef: "tests/pdf/form-6252-2026-candidate.test.ts::reopens the marked diagnostic without identity data or inherited active content"
  - line: "release"
    description: "Keep annual review and filing exports unavailable"
    formula: "The final blank and physical candidate map stay outside the public review and filing paths."
    testRef: "tests/pdf/form-6252-2026-candidate.test.ts::keeps annual review and filing exports unavailable"
