form: "Form 8919"
fullName: "Uncollected Social Security and Medicare Tax on Wages"
taxYear: 2025
irsReference: "https://www.irs.gov/pub/irs-prior/f8919--2025.pdf"

notes: |
  This supported slice accepts validated Form 8919 summary totals instead of
  rebuilding every employer and reason-code worksheet entry. It covers the
  amounts that materially affect the individual federal return: the wages on
  Form 8919 line 6 that must be included in Form 1040 line 1, the Social
  Security wage-base computation on lines 8 through 10, the Medicare tax on the
  supported wages, the Schedule 2 tax carryforward, the Form 8959 Additional
  Medicare Tax interaction, and the Schedule SE wage-base interaction. When a
  validated override for Form 8919 line 8 is absent, the supported path
  defaults that line to the sum of W-2 Box 3 Social Security wages, W-2 Box 7
  Social Security tips, any supported Form 4137 line 10 Social
  Security-taxable tips already subject to Social Security tax, and any
  validated RRTA compensation subject to the 6.2% Social Security rate, with
  the RRTA component itself limited to the applicable Social Security wage base
  before it is added to the line 8 default.

lines:
  - line: "1040-1"
    description: "Form 8919 wages added to Form 1040 line 1"
    formula: "Validated Form 8919 line 6 wages that must be included in Form 1040 line 1"
    irsRef: "Form 8919 Instructions, Line 6; Form 1040 Instructions, Line 1"
    inputs:
      - "Validated wages not reported on Form W-2 but treated as employee wages"
    notes: "This supported slice carries the validated Form 8919 wage amount directly into the simplified Form 1040 line 1 wage aggregation."
    testRef: "tests/engine/federal.test.ts::Form 1040 Line 1 - supported Form 8919 wages increase wages, Schedule 2 tax, and Additional Medicare exposure"

  - line: "6"
    description: "Employee wages subject to Form 8919 tax"
    formula: "Use the validated wages not reported on Form W-2 that are treated as employee wages for Form 8919"
    irsRef: "Form 8919 Instructions, Line 6"
    inputs:
      - "Validated wages not reported on Form W-2 but treated as employee wages"
    testRef: "tests/engine/forms/form-8919.test.ts::Form 8919 Line 13 - computes Social Security and Medicare tax from supported summary inputs"

  - line: "8"
    description: "Social Security wages and tips already subject to tax"
    formula: "Use the validated Form 8919 line 8 override when provided; otherwise default to the sum of W-2 Box 3 Social Security wages, W-2 Box 7 Social Security tips, any supported Form 4137 Line 10 Social Security-taxable tips already subject to Social Security tax, and any validated RRTA compensation subject to the 6.2% Social Security rate, limiting the RRTA component itself to the applicable Social Security wage base before adding it to the default total"
    irsRef: "Form 8919 Instructions, Line 8"
    inputs:
      - "Validated Form 8919 line 8 override"
      - "W-2 Box 3 Social Security wages"
      - "W-2 Box 7 Social Security tips"
      - "Supported Form 4137 Line 10 Social Security-taxable tips"
      - "Validated RRTA compensation subject to the 6.2% Social Security rate"
    notes: "The supported RRTA amount is capped at the annual Social Security wage base before being added to the default Line 8 total because the instructions tell filers not to include RRTA compensation above that amount on Line 8. A validated direct Line 8 override remains authoritative over the supported W-2, Form 4137, and RRTA default components."
    testRef: "tests/engine/forms/form-8919.test.ts::Form 8919 Line 8 - validated RRTA compensation defaults into the wage-base room calculation and is capped at the annual Social Security wage base"

  - line: "9"
    description: "Remaining Social Security wage-base room"
    formula: "Subtract Line 8 from the tax year's Social Security wage base and floor the result at $0. The wage base and its audit input use the same calculation year. The published amount is $176,100 for 2025 and $184,500 for 2026."
    irsRef: "Form 8919 lines 7–10; https://www.irs.gov/pub/irs-prior/f8919--2025.pdf and https://www.irs.gov/pub/irs-prior/f8919--2026.pdf"
    inputs:
      - "Form 8919 Line 8"
      - "Social Security wage base for the calculation year"
    edgeCases:
      - "Wages already meet or exceed the Social Security wage base"
      - "Validated line 8 override exceeds the wage base"
      - "A validated Line 8 override above the wage base wins over lower default W-2 or Form 4137 totals and leaves no Social Security wage-base room"
    testRef: "tests/engine/forms/form-8919.test.ts::Form 8919 Line 9 - records the actual tax-year wage base and subtracts the confirmed amounts"

  - line: "10"
    description: "Wages subject to Social Security tax"
    formula: "Smaller of Line 6 or Line 9"
    irsRef: "Form 8919 Instructions, Line 10; Schedule SE Instructions, Line 8c"
    inputs:
      - "Form 8919 Line 6"
      - "Form 8919 Line 9"
    notes: "This is the supported amount that reduces the remaining Social Security wage-base room before Schedule SE computes the Social Security portion."
    edgeCases:
      - "Remaining wage-base room caps the Social Security-taxable wage amount"
      - "Supported Form 4137 tips already subject to Social Security tax reduce the remaining room before Form 8919 computes Line 10"
    testRef: "tests/engine/forms/form-8919.test.ts::Form 8919 Line 10 - Social Security-taxable wages are capped by the remaining wage base"

  - line: "11"
    description: "Social Security tax on Form 8919 wages"
    formula: "Line 10 multiplied by 6.2%, rounded to the nearest dollar"
    irsRef: "Form 8919 Instructions, Line 11"
    inputs:
      - "Form 8919 Line 10"
    edgeCases:
      - "When only $1 of wage-base room remains, Line 11 rounds down to $0"
      - "When the capped Line 10 amount is $9, Line 11 rounds up to $1"
    testRef: "tests/engine/forms/form-8919.test.ts::Form 8919 Line 11 - one dollar of remaining wage-base room rounds the Social Security tax down to zero"

  - line: "12"
    description: "Medicare tax on Form 8919 wages"
    formula: "Line 6 multiplied by 1.45%, rounded to the nearest dollar"
    irsRef: "Form 8919 Instructions, Line 12"
    inputs:
      - "Form 8919 Line 6"
    testRef: "tests/engine/forms/form-8919.test.ts::Form 8919 Line 13 - computes Social Security and Medicare tax from supported summary inputs"

  - line: "13"
    description: "Total Social Security and Medicare tax on Form 8919 wages"
    formula: "Line 11 plus Line 12"
    irsRef: "Form 8919 Instructions, Line 13; Schedule 2 Instructions, Line 6"
    inputs:
      - "Form 8919 Line 11"
      - "Form 8919 Line 12"
    notes: "The supported result flows to Schedule 2 line 6."
    testRef: "tests/engine/forms/form-8919.test.ts::Form 8919 Line 13 - computes Social Security and Medicare tax from supported summary inputs"

  - line: "2026-transfer-audit"
    description: "Annual Form 8919 wage-base boundary and source-form transfers"
    formula: "In 2026, subtract line 8 from the $184,500 wage base and floor at zero. Apply 6.2% to the lesser of line 6 and the remaining base, and 1.45% to all line 6 wages. Line 6 supplies Form 1040 line 1g and Form 8959 line 3 when required. Line 13 adds the two taxes and identifies Schedule 2 line 16b as its destination in the Form 8919 audit."
    notes: "The final 2026 Form 8919 authorizes these source references. Calculation uses the isolated 2026 constants. The 2025 Schedule 2 calculation and physical map continue to use line 6. Full 2026 Schedule 2 routing requires its final layout and annual qualification."
    irsRef: "https://www.irs.gov/pub/irs-pdf/f8919.pdf"
    testRef: "tests/engine/forms/form-8919.test.ts::records the final 2026 Form 8919 destinations at the annual wage-base boundary"

  - line: "2026-reason-a-nec-wages"
    description: "Reconcile one original Form 1099-NEC to confirmed Reason A wages"
    formula: >-
      Require an actual 2026 Form 1099-NEC received in place of Form W-2 for one firm,
      a confirmed IRS SS-8 employee determination reference and issued and received dates, and confirmation
      of no employee Social Security or Medicare withholding. Bind the original by its
      canonical source index, original statement reference, employer EIN and recipient
      TIN, matching the documented return owner. Require full positive Box 1a to agree
      exactly with Form 8919 line 6. Carry the wages to Form 1040 line 1g once and preserve
      original federal income tax withholding. Exclude the linked Box 1a from Schedule C,
      net self-employment earnings and QBI. Box 1d remains part of Box 1a and supplies
      separately verified FLSA overtime to draft Schedule 1-A line 16.
    irsRef: "https://www.irs.gov/pub/irs-pdf/f8919.pdf; https://www.irs.gov/instructions/i1099mec; https://www.irs.gov/pub/irs-dft/i1040gi--dft.pdf#page=110; IRC section 225(a) and (c)"
    testRef: "tests/engine/federal-form-8919-nec-2026.test.ts::carries the original NEC as Form 8919 wages and deducts qualified overtime once"

  - line: "2026-reason-a-nec-overlap"
    description: "Hold unmatched or unsupported overlap before income calculation"
    formula: >-
      Hold a same-owner or unattributed 2026 original with positive NEC compensation
      and positive Form 8919 wages if its original linkage is missing or unconfirmed.
      Amount equality and a reported overtime box do not establish worker classification.
      This source method requires one current original and holds same-firm W-2s, other
      or corrected originals, tips from the linked original, original NEC Boxes 2 and 3
      indicating separate direct-sale or parachute-payment facts, and business or
      state-source overlaps requiring separate attribution. Preserve historical summary
      inputs and returns that have only a separate household owner's original.
    irsRef: "https://www.irs.gov/pub/irs-pdf/f8919.pdf; https://www.irs.gov/instructions/i1099mec; https://www.irs.gov/pub/taxpros/fs-2026-13.pdf#page=4"
    testRef: "tests/engine/federal-form-8919-nec-2026.test.ts::holds an original 2026 NEC overlap without a verified Form 8919 link"

  - line: "2026-reason-a-nec-identification"
    description: "Validate original owner, identity, and amount before business classification"
    formula: >-
      Verify the original statement and determination against the return year, filer,
      recipient TIN, firm name, EIN, and exact wages from the taxpayer's records. Require
      actual W-2 issuer EINs to establish the linked firm is absent from the W-2s. Preserve
      the original input for federal withholding and overtime, and return a business
      calculation input without the linked statement. Never render identifiers or
      document references in the audit lines.
    irsRef: "https://www.irs.gov/pub/irs-pdf/f8919.pdf#page=2"
    testRef: "tests/engine/forms/form-8919-nec-sources.test.ts::filters only the documented original from the business calculation input"

  - line: "2026-reason-a-determination-date"
    description: "Observe the received IRS classification before using Reason A"
    formula: >-
      Require real calendar dates for the determination and its receipt. Use the IRS
      issuance date for column (d), and hold the calculation until receipt. Require
      issue date no later than receipt date and receipt date no later than the calculation
      observation date. The determination may follow the wage year. Apply the same bound
      when replaying the federal calculation as of an earlier date.
    irsRef: "https://www.irs.gov/pub/irs-pdf/f8919.pdf#page=2"
    testRef: "tests/engine/federal-form-8919-nec-2026.test.ts::holds a determination until its observed date"

  - line: "2026-reason-a-nec-boxes-2-and-3"
    description: "Require the original to rule out direct sales and excess golden parachute payments"
    formula: "Confirm original Form 1099-NEC Box 2 is unchecked and Box 3 is blank or zero before applying the single wage source method. Hold those additional facts for their separate calculation."
    irsRef: "https://www.irs.gov/instructions/i1099mec"
    testRef: "tests/engine/forms/form-8919-nec-sources.test.ts::requires the original to rule out reported direct sales or parachute payments"
