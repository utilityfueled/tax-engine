form: "Hosted-Webhook-Delivery"
fullName: "Authenticated Stripe delivery retries and immutable event creation"
taxYear: 2026
reference: "https://docs.stripe.com/webhooks#automatic-retries; https://docs.stripe.com/webhooks#preventing-replay-attacks; docs/upgrade-2026-execution-brief.md"
notes: |
  Stripe retries an event using a new signed delivery timestamp. Immutable
  event.created may legitimately precede delivery by days. Authenticate the raw
  payload using Stripe's SDK and its nonzero 300 second signed-header tolerance.
  Preserve the existing 60 second future-event guard, shape validation and ledger
  idempotency. No provider call or staging qualification is inferred by tests.
lines:
  - line: "delayed-delivery"
    description: "A freshly signed delivery can contain an old original event"
    formula: "Accept an authenticated30 day old event; preserve its original eventCreatedAt in subscription persistence."
    testRef: "tests/apps/web/hosted-webhook-delivery.test.ts::accepts a freshly signed 30 day old subscription event"
  - line: "outage-recovery"
    description: "Persistence failure does not permanently strand a retried event"
    formula: "Return a generic no-store 503 for a subscription reconciliation failure. Do not mark before successful persistence. After a 1 day outage a fresh signature can retry the same original event."
    testRef: "tests/apps/web/hosted-webhook-delivery.test.ts::recovers a subscription after a day long database outage"
  - line: "sandbox-delivery-receipt"
    description: "Correlate individual sandbox responses with Preview runtime invocations"
    formula: "After signature, mode and isolated hosted database admission, an explicit test Preview opt-in can attach a new random UUID to each persistent subscription update's 200 or 503 response and its fixed runtime log. Exclude Stripe IDs, account facts, raw requests and dependency errors. Require separate Workbench delivery evidence to establish automatic retry."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::joins distinct signed deliveries by opaque receipts and redacts transient failures"
  - line: "sandbox-delivery-receipt-scope"
    description: "Keep sandbox receipt capability out of all other routes and modes"
    formula: "Ordinary responses, unsigned or mismatched events, live or production mode, other event types and an omitted opt-in remain outside this evidence path."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::omits receipts outside explicitly enabled, verified Preview subscription updates"
  - line: "credit-recovery"
    description: "Delayed credit delivery keeps unique checkout idempotency"
    formula: "Preserve exact 1500 paid/1000 credited cents and original creation time. A single persistence operation reconciles the event and paid Checkout session even when the same event is delivered twice."
    testRef: "tests/apps/web/hosted-webhook-delivery.test.ts::persists delayed credit deliveries through the existing idempotent checkout ledger"
  - line: "credit-payment-facts"
    description: "Only a paid Stripe Checkout payment can add purchased credits"
    formula: "Accept a signed checkout.session.completed or checkout.session.async_payment_succeeded only for an identified payment-mode Checkout session with explicit paid status, USD and exact positive integral paid and credit cents. Preserve older paid sessions with the original signed checkout credit terms. A completed unpaid session acknowledges without granting or marking a purchase so a later signed paid success can fulfill it. Invalid paid facts cannot write or fall into subscription handling. Stripe fulfillment https://docs.stripe.com/checkout/fulfillment.md?ui=full-page."
    testRef: "tests/apps/web/hosted-webhook-delivery.test.ts::waits for a paid Stripe Checkout before settling credits"
  - line: "credit-checkout-storage-bounds"
    description: "Reject credit offers that the settlement ledger cannot store"
    formula: "Block a configured nonpositive, fractional or out-of-range USD price or credit budget before creating a Checkout Session or calling a checkout adapter. An absent optional setting uses the existing default. Preserve the original signed terms on subsequent payment delivery even if the current offer has changed."
    testRef: "tests/apps/web/hosted-billing-failure-boundaries.test.ts::blocks AI credit offers the settlement ledger cannot store (%s)"
  - line: "credit-transaction"
    description: "Purchase and event receipt are committed together"
    formula: "Claim the authenticated event receipt and record the unique checkout grant in the same PostgreSQL transaction. Compare immutable owner, customer, paid cents, credited cents and currency on checkout replay. When an event has an existing receipt or a second paid event identifies the same checkout, preserve only one grant. If a legacy session matches but has no receipt, add the missing receipt without another grant. Roll back both writes on error and return a redacted retryable response."
    testRef: "tests/apps/web/hosted-ai-credit-transaction.test.ts::rolls back both credit and receipt on a deferred PostgreSQL failure"
  - line: "signed-replay"
    description: "A stale delivery signature is rejected before persistence"
    formula: "Reject an otherwise authentic delivery signed 301 seconds ago even when event.created is current."
    testRef: "tests/apps/web/hosted-webhook-delivery.test.ts::rejects a stale signed delivery before persistence"
  - line: "signed-boundary"
    description: "The existing nonzero tolerance boundary remains inclusive"
    formula: "Accept a signed delivery exactly 300 seconds old; do not turn off SDK recency validation."
    testRef: "tests/apps/web/hosted-webhook-delivery.test.ts::accepts a signed delivery at the 300 second boundary"
  - line: "signature-integrity"
    description: "Old events are still authenticated without bypassing SDK checks"
    formula: "Changing a signed original payload rejects before any subscription write."
    testRef: "tests/apps/web/hosted-webhook-delivery.test.ts::rejects a changed original payload before persistence"
  - line: "future-event"
    description: "The existing future-event clock control remains separate"
    formula: "Reject signed event.created 61 seconds in the future; accept 60 seconds of future skew."
    testRef: "tests/apps/web/hosted-webhook-delivery.test.ts::preserves the separate future event clock guard"
  - line: "created-shape"
    description: "An old original event still requires a valid Unix creation timestamp"
    formula: "Require event.created to be a nonnegative safe integer in seconds before any Date conversion or persistence; reject negative, fractional and unsafe timestamps without weakening legitimate old retry admission."
    testRef: "tests/apps/web/hosted-webhook-delivery.test.ts::rejects malformed original creation timestamps before persistence (%j)"
