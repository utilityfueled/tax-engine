form: "Guided educator eligibility"
fullName: "Actual school and expense eligibility sources"
taxYear: 2026
irsReference: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section62&num=0&edition=prelim"
notes: |
  Collect the selected year's actual school classification. An omitted historical
  classification must not become K-12 when the return is changed to 2026.
  Calculation eligibility is governed by the separately sourced educator module.
lines:
  - line: "actual-school-level"
    description: "Preserve actual school classification and unknown values"
    formula: "Forward the actual school level without a default. The 2026 actual-source path requires it; supplied other-school classification remains known ineligible rather than missing."
    irsRef: "IRC 62(d), eligible educator and school definitions"
    testRef: "tests/guided-interview/guided-educator-facts.test.ts::preserves the actual school level and leaves missing 2026 classification unknown"
  - line: "school-level-control"
    description: "Collect the school classification from actual records"
    formula: "The selector starts unknown; selecting a level preserves the actual value and invalidates source confirmation. Historical saved records remain visible without an inferred classification."
    irsRef: "IRC 62(d), actual school eligibility"
    testRef: "tests/apps/web/educator-source-interactions.test.tsx::collects educator source facts without manufacturing zero or confirmation"
  - line: "early-childhood-facility"
    description: "Collect the actual expanded facility requirements"
    formula: "For an early-childhood school collect the actual nonresident children under six and each funding condition. Known zero, two children, or no public expense and no fee/payment/grant remains known ineligible; missing answers stay unknown. Do not apply the 2026 expansion to 2025."
    irsRef: "IRC 62(d)(1)(B); PL119-111 division B section 1"
    testRef: "tests/guided-interview/guided-educator-facts.test.ts::collects actual early childhood qualification and keeps the effective year distinct"
  - line: "expanded-itemized-uses"
    description: "Keep the broader itemized roles and expense uses distinct"
    formula: "Preserve actual coach/sports-administrator role and instructional use. The broader itemized path does not turn those facts into eligibility for the capped income adjustment. Material receipt funding remains incomplete until actual reimbursements and tax-free funding reconcile; exact zero differs from missing."
    irsRef: "IRC 67(b)(13),(g); IRC 62(a) final sentence; Pub5052026 educator deduction sequence"
    testRef: "tests/guided-interview/guided-educator-facts.test.ts::requires actual broader use and receipt funding before completing itemized educator facts"
  - line: "expanded-source-controls"
    description: "Collect source eligibility and allocated expense funding"
    formula: "Show actual early-childhood facility questions, broader roles and instructional uses, and separate receipt reimbursement and tax-free-funding amounts without prefilled answers. Substantive edits revoke source confirmation and preserve saved zero and false."
    irsRef: "IRC 62(d)(1); IRC 67(g); no duplicate expense deduction"
    testRef: "tests/apps/web/educator-source-interactions.test.tsx::collects expanded educator roles facility facts and receipt funding without guesses"
