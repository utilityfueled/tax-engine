form: "K1 Form461 Classification"
fullName: "Actual ordinary K-1 classification after basis, at-risk and passive limits"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i461"
retrievedAt: "2026-11-02"
notes: |
  Form461 Ordering Rules applies at-risk then passive then excess business
  losses. Line5 is actual ScheduleE income/loss after those limits. Form8582
  PartII and its MAGI apply to active rental real estate, not ordinary nonrental
  PartI. The scoped PartI computation accepts no AGI and emits no MAGI source
  or audit. Its results must equal the later full canonical passive computation.
  This source method requires every K1, ordinary continuing activity, explicit
  current-year classification and known-zero other business amounts. Actual
  capital items are nonbusiness. No taxpayer enters current allowance, QBI,
  Form461 net business income or an allocation of the excess loss.
  The method derives SE/health/retirement deductions from calculated context.
  Existing unique-loss-pool and mixed-origin Form461 boundaries still apply.
  i1065sk1 Box14 directs a negative amount to the deductible loss after the
  linked basis/at-risk/passive limitations, and excludes a health-insurance
  reduction from partner SE earnings. Reg1.1402(a)-2(a),(d) links the deduction
  and section704 partnership computation. The new ordinary-current SE method
  requires no other partner adjustments and an independent preceding-year
  zero suspended-SE record. A negative original Box14 must equal the original
  ordinary loss, with no prior passive loss to allocate; no fraction is guessed.
  The explicit profitable C-plus-partnership method below is a separate source
  answer; the older ordinary_k1_only method continues to exclude C sources.
  The calculated pre-461 income remains the existing ScheduleSE source basis;
  positive461 mixed-source SE coordination is not broadened by this method.
lines:
  - line: "passive-part-i"
    description: "Calculate ordinary nonrental passive allowances without synthetic MAGI"
    formula: "Current passive loss30000 plus filed prior20000 and separate passive income15000 allow15000 and suspend35000; the same actual rows with any finite full-return MAGI yield identical PartI and allocation totals. No MAGI property or line6 is created by the scoped route."
    testRef: "tests/engine/forms/k1-form461-classification.test.ts::calculates ordinary nonrental Part I without inventing MAGI"
  - line: "passive-boundary"
    description: "Reject rental, PTP and unmatched prior-source paths in the scoped route"
    formula: "Actual nonrental activity identity must bind every prior source; any rental/active-rental/PTP/disposition or supplied MAGI requires the full corresponding source method. Unknown or unmatched classification is not treated as ordinary."
    testRef: "tests/engine/forms/k1-form461-classification.test.ts::rejects every rental PTP and unexplained prior source in the no-MAGI path"
  - line: "derived-current"
    description: "Derive Form461 from actual K1 records rather than an entered worksheet result"
    formula: "Current ordinary330000/QBI264000 with sufficient actual basis/risk and nonpassive classification gives313000 allowance,17000EBL and250400current qualified loss. No form461 input or passive MAGI input is supplied."
    testRef: "tests/engine/federal-k1-form461-classification.test.ts::derives the unique current loss from source classification without entered Form461 totals"
  - line: "passive-before-ebl"
    description: "Apply actual passive allowances before the aggregate business limit"
    formula: "Passive ordinary330000 loss and10000 passive income allow10000 current loss, suspend320000 under469 and yield0ScheduleE/EBL/AGI. Final8582 source rows and every allowance reconcile with the preceding scoped calculation."
    testRef: "tests/engine/federal-k1-form461-classification.test.ts::uses calculated passive allowances before Form461 without a MAGI override"
  - line: "source-boundaries"
    description: "Preserve unknown classification and reject conflicting source methods"
    formula: "Missing/false source confirmation, absent/false nonbusiness capital classification, wrong year, nonzero other business sources, known ScheduleC/F/rental/PTP/1041/business asset/crypto conflicts and a simultaneous entered Form461 require their separately reconciled source method."
    testRef: "tests/engine/federal-k1-form461-classification.test.ts::rejects unknown and conflicting ordinary-only classification sources"
  - line: "original-se"
    description: "Reject actual NFT creator business sources from ordinary K1-only classification"
    formula: "A known NFT creator business remains a separate business source even when its receipts are computed without a scheduleC input. Actual10000 mint-sale proceeds with ordinaryK1 loss100000/risk60000 cannot produce a source-verified Form461 with ScheduleC0. Preserve the original source and require its separate classification method."
    testRef: "tests/engine/federal-k1-form461-classification.test.ts::rejects actual NFT creator business sources from ordinary K1 classification"
  - line: "original-se-loss"
    description: "Derive ordinary current partner SE earnings from actual original sources"
    formula: "Original Box14A equals ordinary loss100000; actual basis100000/risk60000 permits60000 current SE loss. Another same-owner ordinary/SE100000 gives40000 combined SE earnings and5652SEtax. Keep raw-100000 unchanged; do not request an allowed-loss field. Original positive or zero Box14 is retained after explicit no-other-adjustments facts."
    testRef: "tests/engine/federal-k1-form461-classification.test.ts::derives matching current Box14 loss from actual limits and preserves the original"
  - line: "se-character"
    description: "Reject unexplained partner deductions and mismatched SE loss character"
    formula: "Unknown current adjustment facts, absent/wrong-year/nonzero prior SE history, a differing negative Box14/ordinary loss, positive prior passive loss in the negative-current route or a conflicting supplied adjusted amount reject. Separate SE histories cannot be inferred from QBI or regular passive history."
    testRef: "tests/engine/federal-k1-form461-classification.test.ts::rejects missing SE history and unsupported negative Box14 characterization"
  - line: "se-consumers"
    description: "Use identical source-derived earnings for health deductions and review validation"
    formula: "Actual positive partnership100000 yields92350net earnings: rounded11451Social Security plus2678Medicare =14129SEtax/7065half. Actual owner-paid600.10 medical costs transfer600 once; AGI92335. The review recalculates the same original source limits and rejects changed sources."
    testRef: "tests/engine/federal-k1-form461-classification.test.ts::uses calculated partner earnings consistently in health and review sources"
  - line: "profitable-c-k1"
    description: "Explicit profitable ordinary domestic C plus partnership K1 classification"
    formula: "A separate profitable_ordinary_c_and_k1 method binds actual current ScheduleC owner, original name/EIN line status and recipient identity to confirmed original domestic ordinary records. Add canonical ScheduleC40000 to post-limitation ordinary partnership ScheduleE40000; computed owner halfSE536+2826 enters line8=-3362, line9/14=76638, MFJ2025 line15=626000, signed16=702638, EBL0. Employee wages176100 stay excluded. Actual negative C/K1 or any resulting EBL requires a separate loss-allocation method. The old ordinary_k1_only answer never admits C."
    testRef: "tests/engine/federal-c-k1-classification.test.ts::derives profitable C and K1 from actual sources without entered computed totals"
  - line: "profitable-c-k1-proof"
    description: "Preserve unknown ordinary domestic identity and existing source boundaries"
    formula: "Missing false stale year owner business name/EIN or recipient identity and reference confirmation reject. Actual C net comes from the canonical federal ScheduleC context after its adjustments, never from an entered source-proof amount. All other business amounts remain explicit zero, no competing entered461, no ScheduleF/rental/businesscapital/PTP/crypto composition."
    testRef: "tests/engine/forms/k1-form461-c-k1.test.ts::requires actual C proof and preserves K1-only and loss boundaries"
  - line: "profitable-c-k1-guide"
    description: "Guide originates explicit C classification without guessing proof"
    formula: "Actual complete self-employment and K1 source controls build the same canonical C/K1 return as typed sources. A new method exposes actual source fields with unknown initial values; edits invalidate confirmations recursively. No domestic proof is inferred from absent foreign forms or an existing K1-only answer."
    testRef: "tests/guided-interview/guided-c-k1-classification.test.ts::builds actual guide C and K1 canonical parity and preserves unknown proof"
  - line: "profitable-c-k1-review"
    description: "Original-bound prepared redacted review rejects stale C and K1 sources before template I/O"
    formula: "Existing opaque prepared QBI context binds complete actual original and fresh canonical result. Valid permitted redaction renders; equal-dollar source identity or reference mutation, forged context and saved-result mutation reject before template access. Positive no-EBL calculation does not claim automatic official Form461 attachment."
    testRef: "tests/pdf/c-k1-classification-review.test.ts::binds prepared C and K1 originals before template I O"
  - line: "profitable-c-k1-blank-identity"
    description: "Actual sole proprietor original name and EIN line status"
    formula: "ScheduleC lineC is blank when no separate name and lineD blank when no EIN issued. Explicit reported or blank_original name status and reported or not_issued EIN status corroborate actual owner identity. Known blank originals preserve missing identifiers; unknown status or contradiction with canonical reported name/EIN reject. No invented business name or taxID."
    testRef: "tests/engine/forms/k1-form461-c-k1.test.ts::accepts an explicitly known blank sole proprietor name and no EIN without inventing identifiers"
  - line: "profitable-c-k1-isolated-2026"
    description: "Isolated 2026 profitable C/K1 classification preserves the return gate"
    formula: "With actual current2026 C40000 and ordinary partnership40000, independent owner SE2113/5652 and reported half1057+2826=3883, Form461 line14=76117 and current joint512000 threshold produce signed16=588117, EBL0. This source-level law control does not qualify a 2026 full return; production gate remains closed."
    testRef: "tests/engine/forms/k1-form461-c-k1.test.ts::calculates isolated 2026 sources while preserving the full return readiness gate"
  - line: "profitable-c-k1-nec-boundary"
    description: "Do not admit an unlinked actual NEC source under ordinary C classification"
    formula: "The finite C/K1 proof identifies original C character and owner, not a second NEC receipt reconciliation. Actual nonzero NEC100000 alongside canonical C gross40000 rejects even for the same owner. Existing explicit zero NEC remains harmless. A nonzero NEC route needs actual receipt and business linkage; do not assume receipts are included merely because owners match."
    testRef: "tests/engine/forms/k1-form461-c-k1.test.ts::rejects unlinked nonzero NEC while preserving explicit zero sources"
  - line: "profitable-c-k1-guide-nec"
    description: "Guide reports the bounded nonzero NEC method before canonical calculation"
    formula: "An unlinked actual nonzero NEC entry is retained as source data but cannot use this finite C/K1 classification without the complete nec-linked-originals packet below. The guide adapter rejects missing linkage; manual C receipts and explicit zero NEC remain available."
    testRef: "tests/guided-interview/guided-c-k1-classification.test.ts::rejects an actual nonzero NEC composition in the guide adapter without discarding it"
  - line: "nec-linked-originals"
    description: "Actual complete same-business NEC receipts reconcile C gross exactly"
    formula: "Within profitable_ordinary_c_and_k1, a separate actual current NEC receipt packet binds every original once by index and complete canonical source snapshot (actual year/payer/TIN status/owner/Box1/retained boxes), actual reference and explicit same-business/included-once/current-uncorrected facts. Exact Decimal sum(Box1)+actual other gross not already NEC equals canonical C gross before rounding. 25000.10+14999.90=40000, never65000.10; C/K1 tax remains41851. Explicit zero other gross is allowed. No relationship or missing monetary zero is inferred."
    testRef: "tests/engine/federal-c-k1-classification.test.ts::reconciles actual linked NEC receipts once without changing ordinary C K1 tax"
  - line: "nec-source-boundaries"
    description: "Reject incomplete ambiguous corrected or inconsistent NEC receipt proofs"
    formula: "Every retained NEC including zeroBox1 appears exactly once when a packet is supplied. Unknown/wrong actual year/owner/payerTIN status/source reference/relationship/confirmed current original facts or missing actual source withholding values reject; nonzero NEC without packet remains rejected. Duplicate IDs, missing rows, absent originals, stale/reordered snapshots and semantically identical original commitments even with different refs/numeric formatting/name case or spacing/TIN punctuation reject; raw originals remain fully bound. Unknown actual other gross is not a residual; one-cent difference and NEC100000/C40000 require actual separate difference/explanation method. Corrections/voids/unmodeled nonordinary boxes and multiple businesses remain named boundaries."
    testRef: "tests/engine/forms/k1-form461-c-k1.test.ts::rejects missing stale duplicate and unreconciled actual NEC receipt sources"
  - line: "nec-guide-originals"
    description: "Guide copies actual NEC records after explicit business and inclusion confirmation"
    formula: "Reuse original NEC source controls and exact existing NEC+manual receipt converter. Actual source year is required; current return year is not a substitute. Copying confirmed original fields never asserts samebusiness, includedonce or no corrections. Original blank payerTIN requires explicit blank_original status, not a fabricated TIN. Source edits including gross-preserving NEC/manual or identity changes invalidate the receipt confirmations and saved result. Returns/allowances stay separate C line2."
    testRef: "tests/guided-interview/guided-c-k1-classification.test.ts::builds actual NEC guide parity and invalidates gross preserving source edits"
  - line: "nec-source-controls"
    description: "Explicit NEC receipt controls preserve unknown source facts"
    formula: "Adding receipt proof and original-row linkage creates no checked booleans or payerTIN/source status. User supplies actual relationship/reference/current-original proof. Removing or editing a source preserves other facts and invalidates confirmations. No JSON or fabricated source facts enter the product flow."
    testRef: "tests/apps/web/c-k1-classification-interactions.test.tsx::collects actual NEC linkage with unknown relationship and source status"
  - line: "nec-original-review"
    description: "Private full original source binding and digest-only exported audit"
    formula: "Fresh complete receipt source commitment is part of the retained calculation audit and existing opaque QBI original context. Prepared permitted redaction renders; payer/TIN/reference/other-box/wholepacket changes with equal gross and a newly prepared token still reject stale result before template I/O. Raw payerTIN and private references do not print. This does not qualify official461/default2210 attachments."
    testRef: "tests/pdf/c-k1-classification-review.test.ts::binds complete actual NEC source originals and stale results before template I O"
  - line: "nec-original-monetary-boundaries"
    description: "Actual original withholding and state amounts cannot be negative or silently stripped"
    formula: "This finite current uncorrected ordinary method requires every present original monetary field nonnegative and all required source fields explicit before defaults. Negative federal/state withholding or state compensation requires the actual separate correction/source method. Full original comparison rejects extra contradictory corrected/void/unmodeled properties rather than stripping them before source validation."
    testRef: "tests/engine/forms/k1-form461-c-k1.test.ts::rejects negative monetary and extra contradictory original NEC facts"
  - line: "nec-reported-payer-tin"
    description: "Actual reported payer TIN has nine digits; known blank remains separate"
    formula: "Reported payerTIN must contain nine actual digits after permitted SSN/EIN punctuation and spacing normalization. Nonempty unknown/short/alphabetic text is not a reported TIN. Explicit original blank status accepts only actual blank or omitted TIN; it never invents an identifier or claims payer issuance verification."
    testRef: "tests/engine/forms/k1-form461-c-k1.test.ts::rejects malformed reported payer TIN while preserving actual original blank"
  - line: "nec-semantic-occupation-metadata"
    description: "Optional occupation-array presentation cannot create a second NEC original"
    formula: "Duplicate-only semantic fingerprint treats absent and empty occupation arrays identically and sorts/deduplicates code metadata. Array presentation/order cannot establish a second actual original; complete raw source commitments keep the exact source array. The ordinary canonical schema still rejects repeated raw reported codes and is not weakened."
    testRef: "tests/engine/forms/k1-form461-c-k1.test.ts::rejects duplicate originals differing only by empty or reordered occupation arrays"

  - line: "nec-entered-source-numbering"
    description: "Map actual receipt originals using entered-source order"
    formula: "Receipt linkage numbers count nonblank NEC entries in business-income order, skipping entirely blank cards, and can differ from displayed raw card numbers. Never infer source facts or change canonical original indices to match a blank card."
    testRef: "tests/apps/web/c-k1-classification-interactions.test.tsx::collects actual NEC linkage with unknown relationship and source status"
  - line: "nec-blank-card-projection"
    description: "Preserve blank cards while projecting only entered actual originals"
    formula: "An entirely blank preceding guide NEC card is preserved in the draft but is not an original NEC source. The first entered actual original remains canonical source zero with unchanged gross and tax."
    testRef: "tests/guided-interview/guided-c-k1-classification.test.ts::maps actual entered NEC sources while preserving entirely blank preceding cards"
  - line: "nec-2025-paper-identity"
    description: "Supplemental compensation metadata cannot establish a second 2025 paper original"
    formula: "For duplicate detection only, 2025 NEC identity excludes supplemental cash tips, overtime and occupation codes that are not printed 2025 form boxes. Full raw source commitments retain every actual supplemental field. Actual 2026 printed fields remain part of its form identity; no global schema or financial calculation changes."
    testRef: "tests/engine/forms/k1-form461-c-k1.test.ts::rejects duplicate 2025 paper originals differing only by supplemental compensation metadata"

  - line: "nec-2026-paper-identity"
    description: "Retain actual 2026 NEC printed compensation source fields in isolated identity"
    formula: "Official December2026 NEC CopyB prints cash tips1b, occupation codes1c and overtime1d, so distinct actual printed values remain source identity. Array order alone does not establish another original. This source-helper control grants no production2026 or filing readiness."
    testRef: "tests/engine/forms/k1-form461-c-k1.test.ts::retains actual 2026 printed compensation boxes in isolated original identity without opening readiness"
