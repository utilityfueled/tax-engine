  - line: "positive-multiple"
    description: "Reject a positive aggregate benefit requiring an unstated attribution"
    formula: "If more than one eligible origin has positive normal excess and actual succeedingNOL exceeds the simultaneous comparison, reject before publishing any per-origin carry. Original source order cannot select which origin loses carry."
