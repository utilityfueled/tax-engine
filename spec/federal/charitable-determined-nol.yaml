form: "Determined charitable NOL origins"
fullName: "Original-source charitable carry with zero or uniquely attributable succeeding NOL benefit"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i172"
retrievedAt: "2026-10-26"
notes: |
  Corrected2026 carry premise: nonitemized-allowable-charitable-carry.yaml
  applies IRC63(e)(1) and170(d)(1)(C) before actual deduction selection.
  Prior no-floor-selection expectations remain historical evidence only.
  IRC170(d)(1)(B), Reg1.170A-10(d)(1), Reg1.172-5(a)(2)(ii) and
  Form172 line26 require reducing charitable excess only to the extent it
  preserves a succeeding NOL. Each actual current category/medium and each
  original prior vintage remains a separate source. Normal percentage use,
  original expiry and the current deduction are not an entered allocation.
  One internal comparison removes all normal-year carry excess simultaneously.
  A zero aggregate benefit requires no attribution. A positive benefit is
  admitted only when exactly one eligible original source has excess; a
  positive benefit with multiple excess origins remains an explicit method
  boundary. No marginal replay order, pro-rata allocation or new vintage is
  inferred. The regulation's public-before-other order remains in the ordinary
  category calculation, but does not supply an unstated within-category order.
  Original regular and AMT histories are independently complete and validated,
  including known-empty packets. Current qualified amounts retain original
  direct/K1/crypto valuation and entity basis. The AMT ledger uses regular AGI,
  actual regular selection and actual regular199A under Reg1.55-1 and
  Reg1.199A-1(e)(5). The AMT comparison preserves actual current ATNOLD.
  Source values, category capacities, normal use and excess remain exact under
  IRC6102(c). Completed ScheduleA and Form172 lines keep their existing reporting
  rules; no source value is rounded before the charitable carry computation.
  In2026 only the independently established current-category floor condition
  is admitted. A positive floor hit involving prior use, partial B cash/property
  attribution and the amended prior-C treated-paid offset remain separate.
  These controls are derived from primary sources, not a matching published
  numeric oracle, independent human qualification or an opening of2026 gates.
lines:
  - line: "complete-sources"
    description: "Bind all original current and independent prior charitable sources"
    formula: "Validate original recipient/year/value and each regular/AMT identity/history before any zero-benefit shortcut. The internal vector includes every current category/medium and original prior source exactly once; missing, changed, duplicate, cross-ledger or stale entries reject."
    testRef: "tests/engine/forms/charitable-determined-nol.test.ts::binds complete independent charitable origins and internal comparison limits"
  - line: "unique-current"
    description: "Reduce only the sole current excess origin"
    formula: "2025 income100000,currentA10000,currentC60000,priorNOL100000: NOLD48000,regularAGI52000,currentA10000/currentC15600. SoleCexcess44400 minus (actualNOL52000-comparison40480)=32880; originalA remains fully used."
    testRef: "tests/engine/forms/charitable-determined-nol.test.ts::reduces one current excess without assigning benefit to fully used categories"
  - line: "unique-prior"
    description: "Preserve the original prior year through a unique excess reduction"
    formula: "Replacing currentC60000 with actual2024C60000 keeps A10000/C15600 and reduction11520, leaving32880 in2024. IndependentAMTC5000 is fully used with currentA10000; it is not copied from regularC. Fifth-year remainder expires after its own reduction."
    testRef: "tests/engine/forms/charitable-determined-nol.test.ts::retains original prior expiry and independent alternative use"
  - line: "zero-benefit"
    description: "Conserve multiple actual excess origins when no succeeding NOL is preserved"
    formula: "2025 normalbase60000/currentG80000/C60000 gives Guse36000/Cuse0 and exact excess44000/60000. A completed succeedingNOL0 proves no reduction; a positive actual succeedingNOL with equal simultaneous comparison also has zero benefit. Source validation still runs."
