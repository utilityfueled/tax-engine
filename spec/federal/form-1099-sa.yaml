form: "Form 1099-SA"
fullName: "Distributions From an HSA, Archer MSA, or Medicare Advantage MSA"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1099sa"

notes: |
  This worksheet aggregates Form 1099-SA data into the existing HSA flow. It
  is currently limited to HSA-box-5 records and the ordinary account-holder
  cases that flow into Form 8889 Part II plus Form 1040 other income.
  When a year-of-death HSA distribution is reported to a validated surviving
  spouse beneficiary, or when validated surviving-spouse beneficiary metadata
  is attached to a later supported HSA distribution after the account has
  become the spouse's HSA, this slice follows the Form 8889 instructions and
  treats the account as the spouse's HSA rather than using the nonspouse death
  branch. That means the spouse path keeps the ordinary Box 1 distribution
  amount, ignores Box 4 for Form 8889 Line 14a support, and does not create
  the automatic death exception or post-death-earnings other-income amounts
  that apply to nonspouse beneficiaries and estates. In the supported local
  input model, surviving-spouse beneficiary metadata can therefore continue to
  infer the spouse Form 8889 owner for later valid HSA codes such as 1, 2, 3,
  4, and 5, while code 6 stays invalid for a surviving spouse.
  A surviving-spouse HSA record also cannot be explicitly tagged to the
  primary owner in the local owner-attribution metadata, because the Form 8889
  spouse-owner path must stay aligned with the beneficiary rule instead of
  silently routing the spouse's inherited HSA activity onto the primary
  taxpayer.
  Nonspouse-beneficiary and estate metadata also stay limited to death-
  distribution reporting codes 4 and 6 in the supported parser, because the
  ordinary HSA owner codes 1, 2, 3, and 5 are reserved for the account owner
  or a surviving spouse after the account becomes the spouse's HSA.
  If a local draft still points the downstream Form 8889 at the spouse owner
  but the current taxpayer payload no longer includes spouse taxpayer context,
  the merge helper now remaps that supported HSA activity back onto the
  primary owner before building the supported Form 8889 input so the engine
  does not emit an internally inconsistent spouse-owned form it cannot
  validate.

  In the federal engine, these aggregated HSA values also seed a default
  Form 8889 Part II input when the return includes HSA Form 1099-SA data but
  no explicit `form8889` payload, so document-driven HSA distributions still
  route into Schedule 1 and Schedule 2 for the supported slice. When the
  attached HSA records include a consistent validated account-holder indicator,
  that same metadata now defaults the generated Form 8889 account owner so the
  downstream age-55 and age-65 tests use the correct taxpayer or spouse. A
  validated surviving-spouse year-of-death Box 3 code 4 record can also infer
  the spouse owner for that generated Form 8889 path when no separate local
  account-holder tag is supplied. When attached HSA records span both spouses,
  the engine now preserves each owner's distribution-side HSA activity by
  either building separate supported Form 8889 statement forms when no
  explicit `form8889` payload is present or by supplementing the selected
  explicit Form 8889 with owner-specific statement forms for the other
  spouse's tagged HSA records. That lets
  Schedule 1 Line 8f and Schedule 2 Lines 17c/17d aggregate both spouses'
  supported HSA distribution effects instead of dropping the unselected owner.
  When any attached HSA record carries an explicit taxpayer-versus-spouse
  account-holder tag, only those explicitly tagged records and the validated
  surviving-spouse inference branch are treated as owner-attributable for the
  owner-specific Form 8889 support totals. Remaining ordinary untagged HSA
  records stay manual instead of silently defaulting onto the primary owner in
  that mixed tagged-or-untagged path.
  It still avoids collapsing mixed spouse-owned HSA records into one combined
  Form 8889, and it still leaves contribution-side deduction defaults manual
  in the mixed-owner document-only auto-build path because W-2 Box 12 code W
  amounts do not identify which spouse's HSA received the employer
  contributions.
  It also keeps fully untagged ordinary HSA Form 1099-SA records manual when
  the downstream taxpayer context includes a spouse but no validated owner tag
  or surviving-spouse inference identifies which spouse owns the HSA, because
  the Form 8889 instructions require spouse-specific forms instead of a single
  combined auto-built distribution form.

  Implemented in this slice:
  - Box 1 HSA distributions flowing into Form 8889 Line 14a for ordinary HSA distributions
  - Box 3 code 2 returned excess contributions flowing into Form 8889 Line 14b
  - Box 2 earnings on returned excess contributions flowing to Form 1040 other income
  - Box 3 code 3 disability distributions as an automatic Form 8889 Line 17a/17b exception base
  - Box 4 fair market value at date of death for Box 3 codes 4 and 6 flowing into Form 8889 Line 14a and the automatic death exception base
  - Explicit preservation of the validated `other_beneficiary` Box 4 subtotal so Form 8889 Line 15 only applies the 1-year-after-death medical-expense offset to records that are confirmed to belong to a non-estate beneficiary
  - Post-death earnings on Box 3 codes 4 and 6 flowing to Form 1040 other income
  - Year-of-death Box 3 code 4 HSA records for a surviving spouse beneficiary staying on the ordinary Box 1 HSA path instead of the nonspouse death branch
  - After-year-of-death supported HSA records for a surviving spouse beneficiary inferring the spouse Form 8889 owner when no explicit local account-holder tag is supplied
  - Box 3 code 5 prohibited transactions flowing into Form 8889 Line 14a and a separate deemed-distribution bucket that cannot be offset by qualified medical expenses on Line 15
  - Input guardrails that reject nonspouse-beneficiary or estate metadata on unsupported ordinary HSA codes 1, 2, 3, and 5
  - Consistent validated HSA account-holder metadata defaulting the generated Form 8889 account owner when the engine builds Form 8889 directly from Form 1099-SA support
  - Validated surviving-spouse year-of-death Box 3 code 4 records inferring the spouse owner for the generated Form 8889 path when no separate local account-holder tag is supplied
  - Mixed primary/spouse HSA document sets refusing to auto-build a single combined Form 8889, while either an explicit Form 8889 account owner plus supplemental owner-specific statement forms or the supported mixed-owner statement-form auto-build path can still keep each owner's HSA subtotals separate
  - Mixed primary/spouse HSA document sets preserving Box 2 returned-excess-contribution earnings per owner for auditability even though those earnings still aggregate into Form 1040 other income outside Form 8889
  - Mixed primary/spouse HSA document sets preserving post-death earnings per owner for auditability even though those earnings still aggregate into Form 1040 other income outside Form 8889
  - Optional death-distribution timing metadata (`year_of_death` versus `after_year_of_death`) preserving the Form 1099-SA instruction distinction that year-of-death beneficiary distributions use Box 3 code 4, while after-year-of-death beneficiary distributions use code 4 for estates, code 6 for nonspouse beneficiaries other than estates, and ordinary HSA owner codes for surviving spouses once the account becomes the spouse's HSA
  - Input guardrails that reject Box 4 fair-market-value values on ordinary non-death HSA distribution codes while still allowing the Form 1099-SA instructions' after-year-of-death surviving-spouse code 1 branch, when explicitly identified with after-year-of-death timing metadata, to carry Box 4 date-of-death value for auditability
  - Input guardrails that reject trustee-to-trustee transfer markers on local Form 1099-SA records because the 2025 Instructions for Forms 1099-SA and 5498-SA say those transfers are not reported, and the 2025 Form 8889 instructions say they are not rollovers and do not go on Line 14a

  Deferred in this slice:
  - Archer MSA and Medicare Advantage MSA return branches
  - Remaining beneficiary edge cases beyond supported death-timing metadata
  - Mixed-owner contribution-side defaulting when no explicit owner-specific Form 8889 inputs are present to supply each spouse's own coverage and contribution facts

businessRuleValidation:
  - rule: "reference-summary-packet"
    description: "Inventory support counts this form as business-rule validated only when regression coverage proves the emitted packet artifact stays labeled as a non-filing reference summary, surfaces only the supported HSA statement fields, and limits the computed routing totals to the supported Form 8889 and Form 1040 other-income outputs."
    testRef: "tests/pdf/fill-form-1099-sa.test.ts::buildForm1099SAReferenceSummary keeps the packet artifact reference-only and limited to supported HSA outputs"

lines:
  - line: "1"
    description: "HSA gross distributions reported on Form 8889 Line 14a"
    formula: "Sum Form 1099-SA Box 1 for HSA records other than nonspouse or estate Box 3 codes 4 and 6 death distributions, then add Form 1099-SA Box 4 fair market value at date of death for HSA records with Box 3 code 4 or 6 only when the beneficiary is not a validated surviving spouse; surviving-spouse year-of-death code 4 records and later surviving-spouse HSA records with otherwise valid HSA codes stay on the ordinary Box 1 HSA path because the Form 8889 instructions treat the inherited account as the spouse's HSA, and when the federal engine must build or supplement Form 8889 from attached Form 1099-SA support it either carries forward a consistent validated HSA account-holder indicator, infers the spouse owner from a validated surviving-spouse HSA record when no local owner tag is supplied, filters the supported subtotals to the explicitly selected Form 8889 account owner, leaves fully untagged married-return HSA records manual when no owner can be identified safely, or builds separate owner-specific statement forms for mixed spouse-owned HSA distributions instead of collapsing them into one form"
    irsRef: "Form 1099-SA Instructions, Boxes 1, 3, 4, and 5; Form 8889 Instructions, Line 14a"
    inputs:
      - "Form 1099-SA Box 1"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 4 fair market value on date of death"
      - "Form 1099-SA Box 5 account type"
      - "Validated surviving-spouse beneficiary indicator"
      - "Validated death-distribution timing metadata when the record documents year-of-death versus after-year-of-death reporting"
      - "Validated HSA account-holder indicator for taxpayer or spouse when the federal engine must infer the downstream Form 8889 account owner"
    notes: "Nonspouse-beneficiary and estate death distributions use Box 4 fair market value instead of Box 1 gross distributions for the Form 8889 Line 14a support total. A validated surviving-spouse year-of-death code 4 record stays on the ordinary Box 1 path, and validated surviving-spouse metadata can also infer the spouse owner for later supported HSA codes that belong on the spouse's HSA path. Validated surviving-spouse code 6 records stay invalid in the supported parser because the instructions route post-year-of-death spouse HSA activity through the ordinary code 1 path instead of the nonspouse death-distribution branch. When optional death-distribution timing metadata is present, the supported parser preserves the IRS coding rules for auditability: year-of-death beneficiary distributions use code 4, after-year-of-death estate distributions use code 4, after-year-of-death nonspouse beneficiary distributions use code 6, and after-year-of-death surviving-spouse records stay on the spouse-owned ordinary-code path. The supported parser therefore allows Box 4 on a code 1 HSA record only when validated surviving-spouse metadata plus `after_year_of_death` timing identifies that specific inherited-HSA branch; otherwise Box 4 stays invalid on ordinary code 1 records. A local record flagged as a trustee-to-trustee transfer is invalid in this supported parser because the 2025 Instructions for Forms 1099-SA and 5498-SA say those transfers are not reported on Form 1099-SA, and the 2025 Form 8889 instructions say not to include them on Line 14a. If primary-owned and spouse-owned HSA documents are mixed, the engine still does not auto-build a single combined Form 8889 because the instructions require separate spouse-specific forms; instead it can build separate owner-specific distribution-side statement forms when no explicit Form 8889 payload is present. Once any explicit owner tag exists in that mixed path, remaining ordinary untagged HSA records stay manual instead of defaulting to the primary owner. Even when no owner tags exist at all, a married return with spouse taxpayer context keeps ordinary untagged HSA records manual unless a validated surviving-spouse branch identifies the owner, so the engine does not fabricate a single spouse-agnostic Form 8889. The audit trail should preserve a concrete owner-attribution status for this line, distinguishing single-owner defaults from all-unattributed records, mixed tagged owners, and mixed tagged-plus-untagged records so document-only owner suppression stays reviewable. If the return already has an explicit primary-owner Form 8889 draft and attached HSA support is inferred exclusively to the spouse from validated surviving-spouse metadata, the merge helper keeps that explicit draft on the primary path so higher-level Schedule 1 and federal orchestration can surface the spouse HSA activity as a separate owner-specific statement form instead of folding it into the wrong owner. If a stale local draft requests the spouse owner after the spouse taxpayer context is no longer present, the supported merge helper remaps that spouse-only HSA support onto a primary-owned draft while preserving the spouse-inferred HSA amounts instead of returning an invalid spouse-owned draft."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 1 - surviving-spouse inferred owner remaps to primary when the current taxpayer payload no longer includes a spouse"

  - line: "2"
    description: "Returned excess contributions excluded on Form 8889 Line 14b"
    formula: "Sum Form 1099-SA Box 1 for HSA records with Box 3 distribution code 2 because those returned excess contributions are excluded from taxable HSA distributions"
    irsRef: "Form 1099-SA Instructions, Box 3 code 2; Form 8889 Instructions, Line 14b"
    inputs:
      - "Form 1099-SA Box 1"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 5 account type"
    notes: "The returned excess contribution amount is still clamped by Form 8889 Line 14a after aggregation, including when the federal engine constructs the supported Form 8889 Part II input directly from Form 1099-SA data. When validated surviving-spouse beneficiary metadata is attached to a supported code 2 HSA record and no separate local account-holder tag is supplied, the supported merge path can still infer the spouse Form 8889 owner instead of defaulting the returned-excess branch onto the primary taxpayer."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 2 - surviving-spouse code 2 records infer the spouse Form 8889 owner when explicit owner tags are absent"

  - line: "3"
    description: "Earnings on returned excess contributions reported as other income"
    formula: "Sum Form 1099-SA Box 2 for HSA records with Box 3 distribution code 2"
    irsRef: "Form 1099-SA Instructions, Box 2 and Box 3 code 2; Form 8889 Instructions, Line 14b"
    inputs:
      - "Form 1099-SA Box 2 earnings on excess contributions"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 5 account type"
    notes: "The Form 8889 instructions direct the Box 2 earnings to other income for the year the excess contribution is withdrawn. When mixed primary-owned and spouse-owned HSA records are tagged locally, the supported aggregation also preserves the Box 2 earnings subtotal per owner and any unattributed remainder in the emitted audit trail so downstream review can trace which owner's HSA generated the other-income amount even though those earnings do not flow through Form 8889 itself."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 3 - code 2 Box 2 earnings become taxable other income"

  - line: "4"
    description: "Disability distributions exempt from the 20% additional tax"
    formula: "Sum Form 1099-SA Box 1 for HSA records with Box 3 distribution code 3 and use that amount as an automatic exception base for Form 8889 Line 17a and Line 17b"
    irsRef: "Form 1099-SA Instructions, Box 3 code 3; Form 8889 Instructions, Lines 17a and 17b"
    inputs:
      - "Form 1099-SA Box 1"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 5 account type"
    notes: "The engine still caps the final exempt amount at Form 8889 Line 16 so the automatic exception cannot exceed the taxable HSA distributions remaining after medical-expense offsets. When validated surviving-spouse beneficiary metadata is attached to a supported code 3 HSA record and no separate local account-holder tag is supplied, the supported merge path can still infer the spouse Form 8889 owner so the downstream age tests run against the spouse, not the primary taxpayer."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 4 - surviving-spouse code 3 records infer the spouse Form 8889 owner when explicit owner tags are absent"

  - line: "5"
    description: "Death-distribution fair market value routed into Form 8889"
    formula: "Sum Form 1099-SA Box 4 fair market value on date of death for HSA records with Box 3 distribution code 4 or 6 only when the beneficiary is not a validated surviving spouse, use that amount as both the Form 8889 Line 14a death-distribution amount and the automatic Form 8889 Line 17a/17b death exception base, preserve the estate-beneficiary portion separately so the downstream Form 8889 Line 15 medical-expense cap can keep estate death distributions out of the beneficiary-only post-death medical-expense branch described in the instructions, and preserve the other-beneficiary portion separately for either an explicitly validated `other_beneficiary` record or any Box 3 code 6 record because the Form 1099-SA instructions define code 6 as a nonspouse beneficiary other than an estate"
    irsRef: "Form 1099-SA Instructions, Box 3 codes 4 and 6 and Box 4; Form 8889 Instructions, Line 14a and Lines 17a-17b"
    inputs:
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 4 fair market value on date of death"
      - "Form 1099-SA Box 5 account type"
      - "Validated surviving-spouse beneficiary indicator"
      - "Validated death-distribution timing metadata when the record documents year-of-death versus after-year-of-death reporting"
    notes: "This slice covers the nonspouse-beneficiary and estate death-distribution amount routed through Form 8889 Part II. Validated surviving-spouse year-of-death code 4 records do not contribute to this death branch because the spouse treats the HSA as their own account. Estate-beneficiary death distributions remain traceable as a separate subtotal because the Form 8889 instructions reserve the special post-death Line 15 medical-expense entry for a beneficiary other than the estate. The engine preserves a separate non-estate-beneficiary subtotal for death distributions explicitly tagged as `other_beneficiary`, and it also infers that same subtotal from any Box 3 code 6 record because the Form 1099-SA instructions say code 6 is used only for a nonspouse beneficiary other than an estate after the year of death. Unlabeled code 4 death distributions still remain conservative because they could belong to either an estate or another beneficiary. When optional death-distribution timing metadata is present, the supported parser preserves the IRS distinction between year-of-death code 4 distributions and after-year-of-death estate-versus-other-beneficiary coding so statement-form reviews can reconcile why an estate stays on code 4 while a nonspouse beneficiary other than the estate moves to code 6. Because the instructions reserve Box 4 for death-of-account-holder reporting, the supported parser rejects Box 4 fair-market-value input on ordinary non-death distribution codes instead of silently ignoring it, while still allowing the instructions' after-year-of-death surviving-spouse code 1 branch to carry Box 4. The audit trail for this line should expose both the estate-only subtotal and the other-beneficiary subtotal, including any inferred code 6 amount, so reviewers can reconcile the Line 15 cap."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 5 - code 6 death distributions infer the non-estate beneficiary subtotal for downstream Form 8889 Line 15 support"

  - line: "6"
    description: "Post-death earnings reported as other income"
    formula: "For each HSA record with Box 3 distribution code 4 or 6 and a beneficiary other than a validated surviving spouse, compute the excess of Form 1099-SA Box 1 gross distribution over Box 4 fair market value on date of death, not below zero, and sum the result"
    irsRef: "Form 1099-SA Instructions, Box 3 codes 4 and 6 and Box 4"
    inputs:
      - "Form 1099-SA Box 1"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 4 fair market value on date of death"
      - "Form 1099-SA Box 5 account type"
      - "Validated surviving-spouse beneficiary indicator"
    notes: "The instructions treat earnings after the account holder's death as separate income to a nonspouse beneficiary or estate instead of part of the Form 8889 death-distribution amount. A validated surviving spouse does not use this branch because the HSA becomes the spouse's account. When mixed primary-owned and spouse-owned HSA death-distribution records are tagged locally, the supported aggregation also preserves the post-death-earnings subtotal per owner and any unattributed remainder in the emitted audit trail so downstream review can trace which owner's HSA generated the other-income amount even though those earnings do not flow through Form 8889 itself."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 6 - code 4 and code 6 post-death earnings become taxable other income"

  - line: "7"
    description: "Prohibited-transaction deemed distributions that cannot be matched with qualified medical expenses"
    formula: "Sum Form 1099-SA Box 1 for HSA records with Box 3 distribution code 5 and carry that amount into Form 8889 Line 14a plus a separate deemed-distribution amount that remains taxable even when the taxpayer reports qualified medical expenses"
    irsRef: "Form 1099-SA Instructions, Box 3 code 5; Form 8889 Instructions, Line 14a and Line 15"
    inputs:
      - "Form 1099-SA Box 1"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 5 account type"
    notes: "The Form 8889 instructions say a deemed distribution from a prohibited transaction is not treated as used to pay qualified medical expenses, so the federal engine preserves a separate no-offset amount instead of letting Line 15 absorb it. When mixed primary-owned, spouse-owned, and unattributed code 5 HSA records are present, the audit trail should preserve those deemed-distribution subtotals separately so owner-specific statement forms and manual owner-attribution gaps remain reviewable."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 7 - code 5 prohibited transactions build a deemed-distribution amount that cannot be offset by medical expenses"

  - line: "packet"
    description: "Draft packet inclusion rule for supported Form 1099-SA HSA statements"
    formula: "When one or more supported HSA Form 1099-SA statements are present, include a non-filing reference-summary PDF in the packet that lists each supported payer statement's Box 1 through Box 5 data and any supported beneficiary or owner metadata, then summarizes the computed HSA routing totals for Form 8889 Lines 14a, 14b, 16, 17a, and 17b plus the other-income amounts sourced from Box 2 earnings and post-death earnings."
    irsRef: "Form 1099-SA Instructions, Boxes 1-5; Form 8889 Instructions, Lines 14a, 14b, 16, 17a, and 17b"
    notes: "This packet slice intentionally emits a deterministic reference summary instead of attempting to recreate the payer-issued Form 1099-SA. Unsupported Archer MSA and Medicare Advantage MSA statements must stay out of this HSA-only reference packet so the draft output remains honest about the supported scope."
    testRef: "tests/pdf/fill-form-1099-sa.test.ts::fillReturn includes a Form 1099-SA reference summary when supported HSA statements are present"
