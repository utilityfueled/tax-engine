form: "Form 1099-SA"
fullName: "Distributions From an HSA, Archer MSA, or Medicare Advantage MSA"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1099sa"

retrievedAt: "2026-10-25"
reviewStatus: "independent-review-pending"
notes: |
  HSA Box 5 sources route to Form 8889 and other income. Actual beneficiary
  relationship and the owner position on this return are separate facts.
  A surviving spouse treats the inherited HSA as their own: the survivor can
  be primary or spouse on the current return. Never infer the local spouse
  owner from surviving-spouse status, or silently move an explicit spouse
  source to primary when the spouse is removed from the return.
  Actual primary/spouse tags determine separate owner support and age tests.
  Missing tags remain visible as unattributed. All document-only previews and
  2026 return calculation require actual owners; older untagged 2025 core
  single-filer compatibility remains unqualified legacy behavior.
  Surviving-spouse records retain ordinary Box 1 distribution treatment and
  do not gain the nonspouse death exemption or post-death income split.
  Codes 4/6 for nonspouse and estate distributions use actual Box 4; code 6
  is not valid for a surviving spouse. Preserve the separate estate and
  other-beneficiary subtotals and actual timing restrictions.
  Mixed owners use separate Form 8889 statements. Document offsets must be
  attributed to the actual owner and cannot combine a partial set of confirmed
  sources with unknown amounts. Trustee-to-trustee transfers are not reportable.
  Archer MSA/Medicare Advantage MSA branches, contribution eligibility and
  other special source worksheets remain separately qualified scope.

businessRuleValidation:
  - rule: "reference-summary-packet"
    description: "Inventory support counts this form as business-rule validated only when regression coverage proves the emitted packet artifact stays labeled as a non-filing reference summary, surfaces only the supported HSA statement fields, and limits the computed routing totals to the supported Form 8889 and Form 1040 other-income outputs."
    testRef: "tests/pdf/fill-form-1099-sa.test.ts::buildForm1099SAReferenceSummary keeps the packet artifact reference-only and limited to supported HSA outputs"

lines:
  - line: "1"
    description: "HSA gross distributions reported on Form 8889 Line 14a"
    formula: "Sum ordinary HSA Box 1, including surviving-spouse inherited accounts, plus Box 4 for nonspouse/estate death distributions. Attribute only through actual primary/spouse source tags; beneficiary relationship never establishes the return owner. Preserve missing tags as unattributed and require actual owners for 2026 calculations and document previews. Reject stale spouse ownership when no spouse exists rather than moving amounts to primary."
    irsRef: "Form 1099-SA Instructions, Boxes 1, 3, 4, and 5; Form 8889 Instructions, Line 14a"
    inputs:
      - "Form 1099-SA Box 1"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 4 fair market value on date of death"
      - "Form 1099-SA Box 5 account type"
      - "Validated surviving-spouse beneficiary indicator"
      - "Validated death-distribution timing metadata when the record documents year-of-death versus after-year-of-death reporting"
      - "Validated HSA account-holder indicator for taxpayer or spouse when the federal engine must infer the downstream Form 8889 account owner"
    notes: "Form 8889 Death of Account Beneficiary treats the surviving spouse as the account beneficiary, regardless of their primary/spouse position on this return. Separate owner statements preserve each actual age and source amount. Legacy untagged 2025 core behavior is not filing qualification. Codes/timing, Box 4 and trustee-transfer restrictions remain independent."
    testRef: "tests/engine/forms/form-1099-sa-ownership.test.ts::uses actual primary ownership for a surviving spouse and applies that person age"

  - line: "2"
    description: "Returned excess contributions excluded on Form 8889 Line 14b"
    formula: "Sum Form 1099-SA Box 1 for HSA records with Box 3 distribution code 2 because those returned excess contributions are excluded from taxable HSA distributions"
    irsRef: "Form 1099-SA Instructions, Box 3 code 2; Form 8889 Instructions, Line 14b"
    inputs:
      - "Form 1099-SA Box 1"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 5 account type"
    notes: "Returned excess is capped by Form 8889 line 14a. An inherited account uses its actual primary/spouse source owner; beneficiary relationship is not an owner tag."
    testRef: "tests/engine/forms/form-1099-sa-ownership.test.ts::retains actual owner attribution for returned excess and disability distributions"

  - line: "3"
    description: "Earnings on returned excess contributions reported as other income"
    formula: "Sum Form 1099-SA Box 2 for HSA records with Box 3 distribution code 2"
    irsRef: "Form 1099-SA Instructions, Box 2 and Box 3 code 2; Form 8889 Instructions, Line 14b"
    inputs:
      - "Form 1099-SA Box 2 earnings on excess contributions"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 5 account type"
    notes: "The Form 8889 instructions direct the Box 2 earnings to other income for the year the excess contribution is withdrawn. When mixed primary-owned and spouse-owned HSA records are tagged locally, the supported aggregation also preserves the Box 2 earnings subtotal per owner and any unattributed remainder in the emitted audit trail so downstream review can trace which owner's HSA generated the other-income amount even though those earnings do not flow through Form 8889 itself."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 3 - code 2 Box 2 earnings become taxable other income"

  - line: "4"
    description: "Disability distributions exempt from the 20% additional tax"
    formula: "Sum Form 1099-SA Box 1 for HSA records with Box 3 distribution code 3 and use that amount as an automatic exception base for Form 8889 Line 17a and Line 17b"
    irsRef: "Form 1099-SA Instructions, Box 3 code 3; Form 8889 Instructions, Lines 17a and 17b"
    inputs:
      - "Form 1099-SA Box 1"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 5 account type"
    notes: "Cap the exempt amount at Form 8889 line 16. Preserve actual owner attribution so age and disability facts apply to that person; do not infer a spouse owner from surviving-spouse relationship."
    testRef: "tests/engine/forms/form-1099-sa-ownership.test.ts::retains actual owner attribution for returned excess and disability distributions"

  - line: "5"
    description: "Death-distribution fair market value routed into Form 8889"
    formula: "Sum Form 1099-SA Box 4 fair market value on date of death for HSA records with Box 3 distribution code 4 or 6 only when the beneficiary is not a validated surviving spouse, use that amount as both the Form 8889 Line 14a death-distribution amount and the automatic Form 8889 Line 17a/17b death exception base, preserve the estate-beneficiary portion separately so the downstream Form 8889 Line 15 medical-expense cap can keep estate death distributions out of the beneficiary-only post-death medical-expense branch described in the instructions, and preserve the other-beneficiary portion separately for either an explicitly validated `other_beneficiary` record or any Box 3 code 6 record because the Form 1099-SA instructions define code 6 as a nonspouse beneficiary other than an estate"
    irsRef: "Form 1099-SA Instructions, Box 3 codes 4 and 6 and Box 4; Form 8889 Instructions, Line 14a and Lines 17a-17b"
    inputs:
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 4 fair market value on date of death"
      - "Form 1099-SA Box 5 account type"
      - "Validated surviving-spouse beneficiary indicator"
      - "Validated death-distribution timing metadata when the record documents year-of-death versus after-year-of-death reporting"
    notes: "This slice covers the nonspouse-beneficiary and estate death-distribution amount routed through Form 8889 Part II. Validated surviving-spouse year-of-death code 4 records do not contribute to this death branch because the spouse treats the HSA as their own account. Estate-beneficiary death distributions remain traceable as a separate subtotal because the Form 8889 instructions reserve the special post-death Line 15 medical-expense entry for a beneficiary other than the estate. The engine preserves a separate non-estate-beneficiary subtotal for death distributions explicitly tagged as `other_beneficiary`, and it also infers that same subtotal from any Box 3 code 6 record because the Form 1099-SA instructions say code 6 is used only for a nonspouse beneficiary other than an estate after the year of death. Unlabeled code 4 death distributions still remain conservative because they could belong to either an estate or another beneficiary. When optional death-distribution timing metadata is present, the supported parser preserves the IRS distinction between year-of-death code 4 distributions and after-year-of-death estate-versus-other-beneficiary coding so statement-form reviews can reconcile why an estate stays on code 4 while a nonspouse beneficiary other than the estate moves to code 6. Because the instructions reserve Box 4 for death-of-account-holder reporting, the supported parser rejects Box 4 fair-market-value input on ordinary non-death distribution codes instead of silently ignoring it, while still allowing the instructions' after-year-of-death surviving-spouse code 1 branch to carry Box 4. The audit trail for this line should expose both the estate-only subtotal and the other-beneficiary subtotal, including any inferred code 6 amount, so reviewers can reconcile the Line 15 cap."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 5 - code 6 death distributions infer the non-estate beneficiary subtotal for downstream Form 8889 Line 15 support"

  - line: "6"
    description: "Post-death earnings reported as other income"
    formula: "For each HSA record with Box 3 distribution code 4 or 6 and a beneficiary other than a validated surviving spouse, compute the excess of Form 1099-SA Box 1 gross distribution over Box 4 fair market value on date of death, not below zero, and sum the result"
    irsRef: "Form 1099-SA Instructions, Box 3 codes 4 and 6 and Box 4"
    inputs:
      - "Form 1099-SA Box 1"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 4 fair market value on date of death"
      - "Form 1099-SA Box 5 account type"
      - "Validated surviving-spouse beneficiary indicator"
    notes: "The instructions treat earnings after the account holder's death as separate income to a nonspouse beneficiary or estate instead of part of the Form 8889 death-distribution amount. A validated surviving spouse does not use this branch because the HSA becomes the spouse's account. When mixed primary-owned and spouse-owned HSA death-distribution records are tagged locally, the supported aggregation also preserves the post-death-earnings subtotal per owner and any unattributed remainder in the emitted audit trail so downstream review can trace which owner's HSA generated the other-income amount even though those earnings do not flow through Form 8889 itself."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 6 - code 4 and code 6 post-death earnings become taxable other income"

  - line: "7"
    description: "Prohibited-transaction deemed distributions that cannot be matched with qualified medical expenses"
    formula: "Sum Form 1099-SA Box 1 for HSA records with Box 3 distribution code 5 and carry that amount into Form 8889 Line 14a plus a separate deemed-distribution amount that remains taxable even when the taxpayer reports qualified medical expenses"
    irsRef: "Form 1099-SA Instructions, Box 3 code 5; Form 8889 Instructions, Line 14a and Line 15"
    inputs:
      - "Form 1099-SA Box 1"
      - "Form 1099-SA Box 3 distribution code"
      - "Form 1099-SA Box 5 account type"
    notes: "The Form 8889 instructions say a deemed distribution from a prohibited transaction is not treated as used to pay qualified medical expenses, so the federal engine preserves a separate no-offset amount instead of letting Line 15 absorb it. When mixed primary-owned, spouse-owned, and unattributed code 5 HSA records are present, the audit trail should preserve those deemed-distribution subtotals separately so owner-specific statement forms and manual owner-attribution gaps remain reviewable."
    testRef: "tests/engine/forms/form-1099-sa.test.ts::Form 1099-SA Line 7 - code 5 prohibited transactions build a deemed-distribution amount that cannot be offset by medical expenses"

  - line: "packet"
    description: "Draft packet inclusion rule for supported Form 1099-SA HSA statements"
    formula: "When one or more supported HSA Form 1099-SA statements are present, include a non-filing reference-summary PDF in the packet that lists each supported payer statement's Box 1 through Box 5 data and any supported beneficiary or owner metadata, then summarizes the computed HSA routing totals for Form 8889 Lines 14a, 14b, 16, 17a, and 17b plus the other-income amounts sourced from Box 2 earnings and post-death earnings."
    irsRef: "Form 1099-SA Instructions, Boxes 1-5; Form 8889 Instructions, Lines 14a, 14b, 16, 17a, and 17b"
    notes: "This packet slice intentionally emits a deterministic reference summary instead of attempting to recreate the payer-issued Form 1099-SA. Unsupported Archer MSA and Medicare Advantage MSA statements must stay out of this HSA-only reference packet so the draft output remains honest about the supported scope."
    testRef: "tests/pdf/fill-form-1099-sa.test.ts::fillReturn includes a Form 1099-SA reference summary when supported HSA statements are present"
