form: "Schedule B"
fullName: "Interest and Ordinary Dividends"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1040sb"

notes: |
  Schedule B is required if the taxpayer has:
  - Over $1,500 of taxable interest (Part I)
  - Over $1,500 of ordinary dividends (Part II)
  - A claimed education savings-bond interest exclusion (Part I, line 3)
  - A supported recipient OID adjustment or taxable amortizable bond premium reduction from a gross Form 1099-OID (Part I, line 1)
  - Any financial interest in or signature authority over a foreign financial account (Part III)
  - A foreign trust distribution or grantor or transferor status during the return year (Part III)

lines:
  - line: "1-and-5-statement-year"
    description: "Reconcile the calendar years of interest and dividend statements before summing them"
    formula: "Hold Forms 1099-INT and 1099-DIV with a supplied calendar year different from the return year before including any of their amounts. Sum matching and legacy undated statements under the existing line rules. The printed revision date does not establish the statement calendar year."
    irsRef: "Schedule B Instructions, Lines 1 and 5; Forms 1099-INT and 1099-DIV, For calendar year"
    sources:
      - "https://www.irs.gov/instructions/i1040sb"
      - "https://www.irs.gov/pub/irs-pdf/f1099int.pdf"
      - "https://www.irs.gov/pub/irs-pdf/f1099div.pdf"
    testRef: "tests/engine/schedules/schedule-b.test.ts::holds wrong-year interest and dividend statements in standalone Schedule B"
    testRefs:
      - "tests/engine/schedules/schedule-b.test.ts::includes matching and legacy undated statements in standalone Schedule B"

  - line: "prior-interest-source"
    description: "Deduct actual previously reported interest included in current Treasury statements"
    formula: "Subtract confirmed priorYearInterestIncludedInCurrentStatements once on the line1 subtotal; preserve gross original Box3 and reject an adjustment above it. Verified Form8815 then reconciles its source history and remaining current interest."
    irsRef: "ScheduleB instructions, US savings bond interest; Form8815 line6 worksheet"
    testRef: "tests/engine/federal-bond-source-integration.test.ts::reconciles previously reported interest once before the current exclusion"
  - line: "box3-source"
    description: "Include Treasury and savings-bond interest separately reported in Box 3"
    formula: "1099-INT listed interest = Box 1 + Box 3; apply any separately calculated Form 8815 exclusion only on Schedule B line 3"
    irsRef: "https://www.irs.gov/instructions/i1099int#en_US_202401_publink1000275377"
    notes: "Box 3 is expressly excluded from Box 1 on Form 1099-INT. Preserve both original source amounts, including for state exemptions; never subtract Box 3 from Box 1 or assume Box 1 already includes it."
    testRef: "tests/engine/schedules/schedule-b.test.ts::includes separate Box 3 interest before the savings bond exclusion"
  # ── Part I: Interest ─────────────────────────────────────
  - line: "1"
    description: "List each payer's name and interest amount"
    formula: "Enumerate each 1099-INT Box 1 plus Box 3 amount, each source-classified Form 1099-OID taxable amount after actual recipient adjustments and elections, each Schedule K-1 Box 5 interest amount, and each Schedule K-1 (Form 1041) Box 1 interest amount"
    irsRef: "Schedule B Instructions, Part I"
    inputs:
      - "1099-INT Box 1 (each payer)"
      - "1099-INT Box 3 (each payer; separately reported from Box 1)"
      - "1099-OID Box 1 net of Box 6 acquisition premium (each payer)"
      - "1099-OID Box 2 net of Box 10 bond premium (each payer)"
      - "K-1 Box 5 (each partnership)"
      - "K-1 (Form 1041) Box 1 (each estate or trust)"
      - "Seller-financed mortgage interest received"
    notes: "Preserve net interest by payer for downstream calculations and the separate source-calculator audit. Use the Part I reporting rows for confirmed changes to gross statements."
    edgeCases:
      - "Nominee interest — received on behalf of another"
      - "OID (Original Issue Discount) adjustments"
      - "Tax-exempt interest NOT included here (goes to 1040 Line 2a)"
    testRef: "tests/engine/schedules/schedule-b.test.ts::Schedule B Line 1 - list interest payers"

  - line: "1-oid-premium-adjustments"
    description: "Disclose changes from verified gross Form 1099-OID for ordinary taxable and Treasury obligations"
    formula: "Use the original Box 1 or Box 8 OID as the payer's OID when gross OID is refigured. The signed OID adjustment is the recipient calculator's OID after actual worksheet changes and acquisition premium, minus that original box. Put the subtotal after the payers and show positive and negative OID Adjustment amounts separately. Subtract any separately reported ABP Adjustment using the taxable coupon reduction from the existing calculation. Schedule B is required for supported adjustments even below the monetary thresholds. Already-net OID does not produce an OID adjustment here. Preserve historical statements, other recipient components, TIPS, and net state and federal interest. Continue Part I rows when they exceed the form's available space."
    irsRef: "Publication 1212, How To Report OID; 2025 and 2026 Schedule B General Instructions and Part I"
    sources:
      - "https://www.irs.gov/pub/irs-prior/i1040sb--2025.pdf"
      - "https://www.irs.gov/pub/irs-pdf/i1040sb.pdf"
      - "https://www.irs.gov/pub/irs-prior/p1212--2025.pdf#page=10"
    testRef: "tests/engine/federal-oid-source-integration.test.ts::reports verified gross OID and elected premium reductions without changing net interest"
    testRefs:
      - "tests/engine/federal-oid-source-integration.test.ts::keeps already-net and historical OID on their existing Schedule B paths"
      - "tests/engine/federal-oid-source-integration.test.ts::discloses the applied source reductions after reconciling recipient and accrual records"
      - "tests/engine/federal-oid-source-integration.test.ts::includes Schedule B gross amounts and reductions in a 2025 review packet below $1,500"
      - "tests/engine/federal-oid-source-integration.test.ts::carries the Schedule B subtotal and adjustments after all interest payer rows"
      - "tests/engine/federal-oid-source-integration.test.ts::reports upward and downward OID worksheet changes from original boxes in 2025 and 2026"
      - "tests/engine/federal-oid-source-integration.test.ts::keeps opposing OID statement changes separate below the Schedule B subtotal"
      - "tests/engine/federal-oid-source-integration.test.ts::prints original zero OID and its positive adjustment on the 2025 review PDF"

  - line: "2"
    description: "Add amounts from Line 1"
    formula: "Sum of all interest amounts listed in Line 1"
    irsRef: "Schedule B Instructions, Line 2"
    testRef: "tests/engine/schedules/schedule-b.test.ts::Schedule B Line 2 - total interest"

  - line: "3"
    description: "Excludable interest on Series EE and I US savings bonds issued after 1989"
    formula: "Form 8815 amount (education savings bond exclusion)"
    irsRef: "Schedule B Instructions, Line 3"
    notes: "Must file Form 8815 to claim. Subject to income phase-out."
    edgeCases:
      - "MFJ MAGI phase-out: $149,250–$179,250 (2025)"
      - "Single MAGI phase-out: $99,500–$114,500 (2025)"
      - "Bond must be used for qualified higher education expenses"
    testRef: "tests/engine/schedules/schedule-b.test.ts::Schedule B Line 3 - savings bond exclusion (Form 8815)"

  - line: "3-attachment"
    description: "Require Schedule B for a claimed education savings-bond interest exclusion"
    formula: "A positive Form 8815 exclusion on Schedule B line 3 requires Schedule B even if interest and dividends are both at most $1,500. A zero line 3 adds no attachment requirement. Check the separate Part III conditions after calculating taxable interest on line 4."
    irsRef: "2025 and 2026 Schedule B General Instructions and line 3"
    sources:
      - "https://www.irs.gov/pub/irs-prior/i1040sb--2025.pdf#page=1"
      - "https://www.irs.gov/pub/irs-pdf/i1040sb.pdf#page=1"
    testRef: "tests/engine/schedules/schedule-b.test.ts::requires Schedule B for a positive education savings-bond exclusion in 2025 and 2026"
    testRefs:
      - "tests/utils/return-readiness.test.ts::keeps a low savings-bond exclusion attached without a Part III review finding"
      - "tests/pdf/savings-bond-reissue-review.test.ts::includes the required Schedule B when a source-backed savings-bond exclusion is under $1,500"

  - line: "4"
    description: "Taxable interest"
    formula: "Line 2 - Line 3"
    irsRef: "Schedule B Instructions, Line 4"
    notes: "This amount goes to Form 1040 Line 2b"
    testRef: "tests/engine/schedules/schedule-b.test.ts::Schedule B Line 4 - taxable interest to 1040"

  # ── Part II: Ordinary Dividends ──────────────────────────
  - line: "5"
    description: "List each payer's name and ordinary dividend amount"
    formula: "Enumerate each 1099-DIV Box 1a amount, each Schedule K-1 Box 6a amount, and each Schedule K-1 (Form 1041) Box 2a amount"
    irsRef: "Schedule B Instructions, Part II"
    inputs:
      - "1099-DIV Box 1a (each payer)"
      - "K-1 Box 6a (each partnership)"
      - "K-1 (Form 1041) Box 2a (each estate or trust)"
    notes: "The audit trail should preserve payer-level dividend entries so each Schedule B amount remains traceable to the reporting statement."
    edgeCases:
      - "Nominee dividends — received on behalf of another"
      - "Capital gain distributions from 1099-DIV Box 2a go to Schedule D, not here"
    testRef: "tests/engine/schedules/schedule-b.test.ts::Schedule B Line 5 - list dividend payers"

  - line: "5-child-election"
    description: "List the qualified dividends transferred from valid child elections"
    formula: "Add the sum of the elected Form 8814 Line 9 amounts as a Form 8814 payer on Line 5. Include the amount in Line 6 and compare those full ordinary dividends to the strict $1,500 filing threshold. Carry Line 6 to Form 1040 Line 3b once. Form 1040 Line 3a includes the same child amount as qualified dividends."
    irsRef: "Form 8814 Additional Instructions, Line 9; Schedule B Lines 5 and 6"
    sources:
      - "https://www.irs.gov/instructions/i8814"
      - "https://www.irs.gov/pub/irs-prior/f1040sb--2025.pdf"
    testRef: "tests/engine/forms/form-8814.test.ts::reports the elected qualified dividends once on Schedule B and Form 1040"
    testRefs:
      - "tests/engine/forms/form-8814.test.ts::applies the $1,500 Schedule B threshold to parent and elected dividends together"

  - line: "5-child-election-2025-review-pdf"
    description: "Place elected dividends and the full total in the official 2025 review template"
    formula: "The 2025 Schedule B template has 15 distinct dividend payer name and amount pairs. The last pair is f1_62 and f1_63, and the separate Line 6 total is f1_64. Preserve each parent payer and the Form 8814 entry when all fit. When an election-bearing Schedule B has more than 15 dividend payers in total, retain all engine rows and the computed total and explicitly reject this review PDF export before writing packet files."
    irsRef: "2025 Schedule B, Part II, Lines 5 and 6; Form 8814 Additional Instructions, Line 9"
    sources:
      - "https://www.irs.gov/pub/irs-prior/f1040sb--2025.pdf"
      - "https://www.irs.gov/instructions/i8814"
    testRef: "tests/pdf/fill-schedule-b-d-se.test.ts::writes the Form 8814 payer and full Line 6 in distinct saved PDF fields at capacity"
    testRefs:
      - "tests/pdf/fill-schedule-b-d-se.test.ts::rejects a review PDF when Form 8814 exceeds dividend row capacity and preserves every calculated payer"

  - line: "6"
    description: "Total ordinary dividends"
    formula: "Sum of all dividend amounts listed in Line 5"
    irsRef: "Schedule B Instructions, Line 6"
    notes: "This amount goes to Form 1040 Line 3b"
    testRef: "tests/engine/schedules/schedule-b.test.ts::Schedule B Line 6 - total dividends to 1040"

  - line: "1-and-5-2025-review-continuations"
    description: "Retain interest and ordinary dividend payer detail beyond the 2025 review template's available rows"
    formula: "Keep the first 14 Line 1 and first 15 Line 5 payer rows on the official template. When a line exceeds its capacity, point to the following pages and append its remaining payer names and matching whole-dollar amounts in engine order. Give each overflowing line its own statement pages and keep the full calculated totals on the official Schedule B lines."
    irsRef: "2025 Schedule B General Instructions, separate statements for Lines 1 and 5"
    sources:
      - "https://www.irs.gov/pub/irs-prior/i1040sb--2025.pdf"
      - "https://www.irs.gov/pub/irs-prior/f1040sb--2025.pdf"
    notes: "Bundle continuation pages with the existing Schedule B review PDF so they are included when the workspace merges the packet. Print the return name and existing review notice on the continuation pages, with no SSN field. Apply the separate Form 8814 dividend-capacity rule before rendering."
    testRef: "tests/pdf/fill-schedule-b-d-se.test.ts::retains every overflow payer in the 2025 Schedule B review packet"
    testRefs:
      - "tests/pdf/fill-schedule-b-d-se.test.ts::keeps a single Schedule B page at the exact ordinary payer capacities"
      - "tests/pdf/fill-schedule-b-d-se.test.ts::continues only the Schedule B line that exceeds capacity"
      - "tests/pdf/fill-schedule-b-d-se.test.ts::wraps a long continuation payer name and prints its rounded amount once"
      - "tests/pdf/fill-schedule-b-d-se.test.ts::fits the complete return name within the statement header"

  # ── Part III: Foreign Accounts and Trusts ────────────────
  - line: "7a"
    description: "Foreign financial account and separate FinCEN Form 114 answers"
    formula: "Preserve the taxpayer's reported financial interest or signature authority and the separate reported FBAR filing requirement when question 1 is yes. Leave omitted answers unknown. A dividend statement's foreign tax or country does not establish an account or signature authority."
    irsRef: "2025 and 2026 Schedule B Instructions, Part III Line 7a Questions 1 and 2"
    sources:
      - "https://www.irs.gov/pub/irs-prior/i1040sb--2025.pdf#page=2"
      - "https://www.irs.gov/pub/irs-pdf/i1040sb.pdf#page=2"
    testRef: "tests/engine/schedules/schedule-b.test.ts::leaves the account answer unknown when a dividend statement reports foreign tax"
    testRefs:
      - "tests/engine/schedules/schedule-b.test.ts::retains a confirmed account answer and a separate FBAR answer"
      - "tests/engine/schedules/schedule-b.test.ts::keeps the Part III requirement unresolved until all applicable facts are supplied"
      - "tests/apps/web/guided-schedule-b-part-three.test.tsx::keeps unanswered Schedule B disclosures unknown when restoring older workspaces with foreign-source income"
      - "tests/apps/web/guided-schedule-b-part-three.test.tsx::records actual Schedule B disclosures by year and clears inapplicable follow-ups"
      - "tests/pdf/fill-schedule-b-d-se.test.ts::writes explicit Schedule B Part III answers to their printed PDF fields"

  - line: "part-three-readiness"
    description: "Require the answers that establish the Schedule B filing requirement"
    formula: "Part III applies when taxable interest on line 4 or ordinary dividends on line 6 exceed $1,500, or a taxpayer reports a foreign financial account or a foreign trust. Review reports also flag a partially entered foreign disclosure. A complete Part III has explicit foreign account and trust answers, the FBAR answer after an affirmative account answer, and one or more nonblank countries when FBAR is required. An independently qualified filing export requires complete Part III to establish applicability even below the monetary thresholds."
    irsRef: "Final 2025 Schedule B and draft 2026 Schedule B, lines 4, 6, and Part III"
    sources:
      - "https://www.irs.gov/pub/irs-prior/f1040sb--2025.pdf"
      - "https://www.irs.gov/pub/irs-dft/f1040sb--dft.pdf#page=2"
    testRef: "tests/utils/return-readiness.test.ts::flags incomplete required Schedule B Part III on the review cover"
    testRefs:
      - "tests/pdf/filing-return.test.ts::rejects unresolved Schedule B applicability before selecting forms"
      - "tests/engine/schedules/schedule-b.test.ts::rejects contradictory Part III declarations from the direct parser"
      - "tests/utils/return-readiness.test.ts::keeps a low savings-bond exclusion attached without a Part III review finding"
      - "tests/utils/return-readiness.test.ts::uses the taxable interest after exclusion for the Part III review threshold"
      - "tests/utils/return-readiness.test.ts::uses ordinary dividends for the Part III review threshold"

  - line: "7b"
    description: "Foreign account countries when the taxpayer must file FBAR"
    formula: "Report the supplied foreign account countries only after both line 7a answers are yes. The countries on dividend statements do not supply this list."
    irsRef: "2025 and 2026 Schedule B Instructions, Part III Line 7b"
    testRef: "tests/engine/schedules/schedule-b.test.ts::uses only the taxpayer's reported FBAR countries"

  - line: "8"
    description: "Foreign trust indicator"
    formula: "Preserve the taxpayer's reported receipt of a foreign trust distribution or grantor or transferor status during the return year. Leave omission unknown. A foreign partnership K-1 does not establish this fact."
    irsRef: "2025 and 2026 Schedule B Instructions, Part III Line 8"
    notes: "An affirmative answer may require Forms 3520 and 3520-A."
    testRef: "tests/engine/schedules/schedule-b.test.ts::leaves the trust answer unknown for a foreign partnership K-1"

  - line: "part-three-state-originals"
    description: "Keep federal Part III reporting answers independent of state worksheet originals"
    formula: "The federal foreign account, FBAR, country and trust answers are reporting facts. PA and Ohio originals and source confirmations derive from their affected return facts and exclude this federal-only disclosure."
    testRef: "tests/apps/web/guided-schedule-b-state-replay.test.ts::keeps confirmed Pennsylvania originals usable after editing Schedule B Part III"
    testRefs:
      - "tests/apps/web/guided-schedule-b-state-replay.test.ts::keeps confirmed Ohio originals usable after editing Schedule B Part III"
      - "tests/apps/web/guided-schedule-b-state-replay.test.ts::keeps confirmed 2026 ordinary state drafts usable after editing Schedule B Part III"
      - "tests/apps/web/guided-schedule-b-state-replay.test.ts::keeps confirmed 2026 Ohio school sources usable after editing Schedule B Part III"
      - "tests/apps/web/guided-schedule-b-state-replay.test.ts::keeps confirmed Ohio reciprocal wages and resident credit usable after editing Schedule B Part III"
      - "tests/apps/web/guided-schedule-b-state-replay.test.ts::preserves Pennsylvania residency and reciprocity commitments after editing Schedule B Part III"
      - "tests/engine/state/pa-married-prior-history.test.ts::keeps confirmed Pennsylvania prior-year household originals usable after editing Schedule B Part III"
      - "tests/apps/web/guided-schedule-b-state-replay.test.ts::preserves the Ohio business source commitment after editing Schedule B Part III"

  - line: "oid-return-sources"
    description: "Verified OID source routing"
    formula: "Use source calculator taxableInterest exactly once; municipal coupon/OID stays exempt, separately reported Treasury OID is taxable, and actual source withholding, penalties and private-activity preference keep their own destinations."
    testRef: "tests/engine/federal-oid-source-integration.test.ts::routes verified OID amounts to their actual federal lines once"
