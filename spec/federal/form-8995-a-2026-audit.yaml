form: "Form 8995-A"
fullName: "2026 Qualified Business Income Deduction Draft Audit"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-dft/f8995a--dft.pdf"
sourceRevision: "2026 draft form and Instructions for Form 8995-A posted November 24, 2026"
retrievedAt: "2026-11-26"
reviewStatus: "independent-qualified-tax-review-pending"
notes: |
  This supplement documents the 2026 draft audit for calculations without
  cooperative patronage. Historical identifiers and deduction arithmetic are
  preserved. The interaction of the subsection (a) minimum and the separate
  subsection (g) deduction requires qualified review before adopting the draft
  form's cooperative routing. This supplement does not qualify an export.
lines:
  - line: "12 and 17 through 26"
    description: "Printed phase-in audit and per-business transfer"
    formula: "For a business whose Line 10 is below Line 3, audit Part III only when pre-QBI taxable income exceeds the threshold and is at or below the upper end of the phase-in range. Show Lines 17–19 and 25–26 for each affected business. Show the shared taxable income, threshold, excess, range, and ratio on Lines 20–24. Transfer Line 26 to Part II Line 12 for that same business. The numeric Part II audit starts at Line 2 because printed Line 1 identifies the business. Identify businesses in the numeric audit by the ordinal of the form calculation row without repeating business names."
    irsRef: "https://www.irs.gov/pub/irs-dft/f8995a--dft.pdf#page=3"
    testRef: "tests/engine/forms/form-8995-a-2026-audit.test.ts::audits the printed phase-in calculation and transfers"
    testRefs:
      - "tests/engine/forms/form-8995-a-2026-audit.test.ts::skips Part III when the income or wage limit does not require it"
      - "tests/engine/forms/form-8995-a-2026-audit.test.ts::uses distinct business rows when only one business needs Part III"
  - line: "16, 27 and 32"
    description: "Transfer the ordinary component and combine it with the REIT/PTP component"
    formula: "Sum the business components on Line 16, carry Line 16 to Line 27, and show Line 32 as the sum of Lines 27 and 31. The existing amounts and method gates are preserved."
    irsRef: "https://www.irs.gov/pub/irs-dft/f8995a--dft.pdf#page=3"
    testRef: "tests/engine/forms/form-8995-a-2026-audit.test.ts::audits the printed phase-in calculation and transfers"
  - line: "Supporting business and PTP detail"
    description: "Ordinal descriptions in the draft audit"
    formula: "Identify supplemental Schedule C business, aggregation, and PTP audit details by position in their calculation order. Keep group and source names in the typed calculation results."
    irsRef: "https://www.irs.gov/pub/irs-dft/i8995a--dft.pdf#page=7"
    testRef: "tests/engine/forms/form-8995-a-2026-audit.test.ts::keeps business labels in named results and uses ordinals throughout the draft audit"
  - line: "29 and 42"
    description: "Signed prior and outgoing qualified REIT/PTP losses"
    formula: "Display the negative prior loss on Line 29 and min(0, Line 28 + Line 29) on Line 42. Preserve the positive loss magnitudes in internal results and keep the ordinary Schedule C loss separate."
    irsRef: "https://www.irs.gov/pub/irs-dft/f8995a--dft.pdf#page=3"
    testRef: "tests/engine/forms/form-8995-a-2026-audit.test.ts::audits signed REIT and PTP losses while preserving stored magnitudes"
  - line: "33"
    description: "Taxable income figured before the QBI deduction and without regard to section 68"
    formula: "Audit the supplied income before QBI. For a 1040 nonitemizer it is AGI less Lines 12e, 12f, and 13a. For a 1040 itemizer it is AGI less the itemized amounts before the section 68 limitation and Line 13a."
    irsRef: "https://www.irs.gov/pub/irs-dft/i8995a--dft.pdf#page=7"
    testRef: "tests/engine/forms/form-8995-a-2026-audit.test.ts::describes the actual deductions in the pre-QBI taxable income"
  - line: "37 and 39 through 41"
    description: "Ordinary deduction, separately determined minimum, and transfer to Form 1040"
    formula: "Line 37 is the ordinary deduction before DPAD. With no qualifying cooperative input, Line 39 equals Line 37. When supportable from the known active QBI facts, Line 40 is $400 for at least $1,000 of aggregate active QBI and zero otherwise. When eligibility is unresolved and cannot change the existing deduction, omit Line 40 rather than infer a value or reject the calculation. Line 41 is the final deduction after section 199A(i) and transfers to Form 1040 Line 13b."
    irsRef: "https://www.irs.gov/pub/irs-dft/i8995a--dft.pdf#page=8"
    testRef: "tests/engine/forms/form-8995-a-2026-audit.test.ts::routes the ordinary and minimum deductions separately in the draft audit"
    testRefs:
      - "tests/engine/forms/form-8995-a-2026-audit.test.ts::omits an undetermined minimum without changing the deduction"
