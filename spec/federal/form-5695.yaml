form: "Form 5695"
fullName: "Residential Energy Credits"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i5695"

notes: |
  Form 5695 computes two residential energy credits:
  Part I: Residential Clean Energy Credit (30% of qualified costs, no cap)
  Part II: Energy Efficient Home Improvement Credit (30%, capped at $3,200/year)

lines:
  # ── Part I: Residential Clean Energy Credit ─────────────
  - line: "1-6"
    description: "Qualified clean energy property costs"
    formula: "Sum of solar electric + solar water + fuel cell + small wind + geothermal + battery storage"
    irsRef: "Form 5695 Instructions, Lines 1-6"
    edgeCases:
      - "Undefined energy credit input yields $0 total clean energy costs with an audit line"
    testRef: "tests/engine/forms/form-5695.test.ts::Form 5695 Part I - total qualified costs"

  - line: "14"
    description: "Residential clean energy credit"
    formula: "Total qualified costs × 30%"
    irsRef: "Form 5695 Instructions, Line 14"
    notes: "No annual dollar cap for Part I (unlike Part II)"
    edgeCases:
      - "Zero costs produce zero credit"
      - "Large solar installation ($50K+) gets full 30%"
    testRef: "tests/engine/forms/form-5695.test.ts::Form 5695 Part I - 30% credit rate"

  # ── Part II: Energy Efficient Home Improvement Credit ────
  - line: "18-20"
    description: "Qualified energy improvement costs"
    formula: "Sum of insulation + energy property + home energy audit"
    irsRef: "Form 5695 Instructions, Lines 18-20"
    edgeCases:
      - "Undefined energy credit input yields $0 total improvement costs with an audit line"
    testRef: "tests/engine/forms/form-5695.test.ts::Form 5695 Part II - total improvement costs"

  - line: "24"
    description: "Energy improvement credit before limits"
    formula: "Qualified costs × 30%"
    irsRef: "Form 5695 Instructions, Line 24"
    edgeCases:
      - "Undefined energy credit input yields $0 pre-limit improvement credit with an audit line"
    testRef: "tests/engine/forms/form-5695.test.ts::Form 5695 Part II - 30% credit rate"

  - line: "30"
    description: "Energy improvement credit after annual limit"
    formula: "min(generalPool, $1,200) + min(heatPumpCredit, $2,000) where generalPool = insulation/doors/windows/AC/furnace credit + min(auditCredit, $150)"
    irsRef: "IRS Energy Efficient Home Improvement Credit page; IRC §25C(b)(1)"
    notes: |
      $3,200 total annual limit = $1,200 general + $2,000 heat pump.
      The $1,200 general pool INCLUDES the home energy audit ($150 cap) per IRS:
      "A total combined credit limit of $1,200 for energy efficient property costs
      and certain energy efficient home improvements, with limits on exterior doors
      ($250 per door and $500 total), exterior windows and skylights ($600) and
      home energy audits ($150)."
      The $2,000 sub-limit covers heat pumps, HP water heaters, and biomass stoves.
      Since $1,200 + $2,000 = $3,200, the overall cap is the sum of the two pools.
    edgeCases:
      - "Under $3,200 total — full credit"
      - "Over $3,200 — capped"
      - "Audit alone capped at $150"
      - "Audit ($150) + general improvements near $1,200 — audit counts within $1,200 pool, not in addition"
      - "Insulation at $1,200 cap + audit $150 — total general pool still $1,200, not $1,350"
    testRef: "tests/engine/forms/form-5695.test.ts::Form 5695 Part II - capped at $3,200"

edgeCases:
  - description: "Undefined energy credit input still emits zero-value audit lines for every documented Form 5695 line"
    testRef: "tests/engine/forms/form-5695.test.ts::Form 5695 audit - undefined input still emits zero-value lines for 1-6, 14, 18-20, 24, and 30"
