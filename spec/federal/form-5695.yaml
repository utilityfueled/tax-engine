form: "Form 5695"
fullName: "Residential Energy Credits"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i5695"
notes: "Sources refreshed 2026-10-25: IRC 25D(c), (e)(8), (h),

  https://uscode.house.gov/us/usc/119-118/t26/s25D/ and IRS final 2025 instructions.

  The 2026 draft form/instructions are calculation corroboration, never filing approval:

  https://www.irs.gov/pub/irs-dft/f5695--dft.pdf

  https://www.irs.gov/pub/irs-dft/i5695--dft.pdf

  For 2026, new 25C/25D expenses generate no credit; a prepayment in 2025 for

  an installation completed in 2026 does not create a new 25D credit. Only the

  actual prior-year Form 5695 carryforward is available, with no new five-year expiry.

  2026 supplied energy inputs require a confirmed carryforward, immediate-prior-year

  source and actual tax-liability limit; zero is a known value, not missing.

  For 2025, the historical calculation computes two residential energy credits:

  Part I: Residential Clean Energy Credit (30% of qualified costs, no cap)

  Part II: Energy Efficient Home Improvement Credit (30%, capped at $3,200/year)\n"
lines:
  - line: "1"
    description: "Prior-year residential clean energy carryforward"
    formula: "Actual confirmed 2025 Form 5695 line 16; reject unknown/source-year mismatch and negative amounts"
    testRef: "tests/engine/forms/form-5695.test.ts::2026 applies only the confirmed prior-year carryforward"
    taxYear: 2026
  - line: "2"
    description: "Remaining tax-liability limit"
    formula: "max(0, Form 1040 line 18 less actual allowed credits listed in the IRS worksheet), supplied by orchestrator"
    testRef: "tests/engine/forms/form-5695.test.ts::2026 applies only the confirmed prior-year carryforward"
    taxYear: 2026
  - line: "3"
    description: "Allowed residential clean energy credit"
    formula: "min(line 1,line 2); flows to Schedule 3 line 5a"
    testRef: "tests/engine/forms/form-5695.test.ts::2026 applies only the confirmed prior-year carryforward"
    taxYear: 2026
  - line: "4"
    description: "Carryforward to 2027"
    formula: "max(0,line 1-line 3); preserve the entire unused amount without inventing an expiry"
