form: "Saved guided return year"
fullName: "Reconcile actual local guided facts with workspace display and readiness"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i1040gi"
notes: "No calculation or filing gate is opened by restoring display metadata. Original document years and saved guided facts remain separate evidence."
lines:
  - line: "marketplace-upload-year"
    description: "Retain an explicit Form1095-A original year without authorizing its tax facts"
    formula: "Recognize the actual Marketplace statement title and Form1095-A cover. Accept at least one exact printed four-digit form-year anchor, including the original catalog-number footer on a page-one-only upload or the page-two form header, with all present anchors and explicit source year labels agreeing; contradictory or missing source years remain unknown. Never use a filename, creation date or split decorative year as evidence. Actual detected Marketplace metadata overrides an explicit historical f1095a--2025 filename alias when its kind or year differs or its year is unknown. A matching actual2025 statement retains the existing2025 fixture handling and manual premium-tax-credit-review prompt, as do explicit-year filename-only fixtures. Bare f1095a with no readable statement stays unknown. Otherwise retain needs-review coverage and no seeded or detected facts; printed VOID and CORRECTED labels do not establish checkbox status. Existing year conflicts and manual Marketplace source confirmation still block calculation."
    testRef: "tests/apps/web/pdf-text-extraction.test.ts::keeps Marketplace PDF source years and statement designations manual through normal upload"
  - line: "marketplace-upload-year-boundaries"
    description: "Reject absent and contradictory Marketplace year evidence"
    formula: "A recognized statement with absent or conflicting printed form-year anchors retains an unknown year and manual review, independently of filename dates and years. A page-one-only statement retains its actual explicitly printed year. A preceding official informational page does not hide a later original statement's title or year anchors. Other document types and filename-only official samples retain their existing behavior."
    testRef: "tests/apps/web/uploaded-document-detection.test.ts::retains explicit Marketplace statement years without inferring checked status"
  - line: "marketplace-sample-year"
    description: "Pin the historical Marketplace sample to the actual official2025 archive"
    formula: "Fetch the official2025 Form1095-A sample from its explicit prior-year IRS URL. Match only the sample ID and explicit f1095a--2025 filename alias, never the ambiguous rolling bare f1095a name. Keep the existing historical manual premium-tax-credit review prompt without treating filename metadata as verified source amounts or checkbox status."
    testRef: "tests/sample-documents-registry.test.ts::pins the 2025 Marketplace sample and aliases to the explicit prior year"
  - line: "marketplace-upload-facts"
    description: "Keep Marketplace amounts separate from historical sample matching"
    formula: "A Form 1095-A registry match can add the manual review question. The official blank archive and any uploaded file matching its historical alias or legacy fixture ID contribute no synthetic premiums, policy identity, or advance credit. Rebuilding structured facts for a saved upload follows the same rule, including after a response to the manual review question."
    testRef: "tests/engine/workspace-engine-input.test.ts::keeps the historical Form 1095-A alias and saved fixture match free of invented financial facts"
  - line: "information-return-sample-facts"
    description: "Keep manual 1098-E, 1099-R and SSA-1099 prompts without fabricated financial summaries"
    formula: "Matching an official1098-E,1099-R orSSA-1099 reference sample retains its existing manual review question only. Neither the blank sample nor a same-name upload supplies interest, benefits, distributions, withholding, a payer or recipient identity, a distribution code or a capitalized-interest answer. Answering a prose review question cannot create those amounts. Loading and saving old workspaces rebuilds without the removed synthetic summaries; genuine independently supplied detected source facts remain intact and still require the complete canonical context and exact confirmed source bindings. Other fixture mappings remain unchanged."
    testRef: "tests/engine/workspace-information-return-facts.test.ts::keeps all three manual prompts without inventing source amounts on upload or reload"
  - line: "information-return-actual-facts"
    description: "Preserve independently supplied information-return source facts"
    formula: "Removing synthetic fixture summaries leaves actual document-detected1098-E,1099-R andSSA-1099 records unchanged. Explicit fictional test sources can reconcile to their separately supplied complete calculation context; omitting that context or changing a source amount still rejects."
    testRef: "tests/engine/workspace-information-return-facts.test.ts::preserves genuine detected information-return amounts and the calculation context gate"
  - line: "wage-nec-sample-facts"
    description: "Keep W-2 and NEC sample aliases manual without fabricated money"
    formula: "The registered 2025 and 2026 W-2 and 2025 Form1099-NEC blank or unreadable aliases retain their manual review prompts, but contribute no synthetic wages, compensation, withholding, payer, employer or payroll amounts. Reopening a persisted workspace rebuilds without those old financial templates; a prose review answer cannot restore them. Other fixture mappings remain unchanged."
    testRef: "tests/apps/web/uploaded-document-detection.test.ts::keeps W-2 and NEC aliases manual without monetary templates on upload and persisted reopen"
  - line: "wage-nec-original-precedence"
    description: "Retain actual W-2 and NEC source identity and amounts over sample basenames"
    formula: "A recognized W-2 or NEC original retains its actual parsed amounts, coverage, kind and explicit printed year, including an unknown or conflicting year, instead of the registered filename hint. A recognized different document uploaded with a W-2 or NEC basename retains its actual identity. A source-year decision for these originals also takes precedence in the future-year upload gate. No source or amount is inferred from a filename. Complete independent canonical context and confirmed exact source bindings remain mandatory for calculation."
    testRef: "tests/apps/web/uploaded-document-detection.test.ts::preserves actual W-2 and NEC original facts over registered basenames"
  - line: "wage-nec-pdf-upload"
    description: "Preserve normal PDF.js original evidence without sample money"
    formula: "Normal File-to-PDF.js-to-workspace import keeps blank W-2 and NEC samples nonfinancial. Explicit filled boxes survive a matching basename without substitution, and contradictory printed years remain unknown. No provider or filename year can fill absent source evidence."
    testRef: "tests/apps/web/pdf-text-extraction.test.ts::retains actual W-2 and NEC PDF text amounts without filename demo substitution"
  - line: "nec-copy-b-box-1a-pdf"
    description: "Bind a separated Box 1a value to its printed Form 1099-NEC region"
    formula: "For the single-page unrotated letter-size December 2026 Copy B layout, require the printed form, revision, recipient, Box 1a and adjacent Box 1b anchors. Read only one complete horizontal cents value beside the printed dollar mark and entirely within the official Box 1a field. Blank, conflicting and ambiguous values stay manual. Leave other boxes for manual confirmation, preserve older inline layouts, and never use the revision date as a source tax year or preconfirm business facts."
    irsRef: "Form 1099-NEC (Rev. December 2026), Copy B, Box 1a; https://www.irs.gov/pub/irs-pdf/f1099nec.pdf"
    testRef: "tests/apps/web/pdf-text-extraction.test.ts::binds the separated printed NEC Copy B amount to Box 1a"
  - line: "nec-copy-b-calendar-year-pdf"
    description: "Read the NEC recipient copy year from the printed calendar-year field"
    formula: "For flattened text on the recognized December 2026 Copy B layout, require the printed calendar-year label and one horizontal four-digit text item with its width and baseline inside the year field. Ignore bare numbers elsewhere on the page, including adjacent payer text, and the revision date. Keep the year unknown for blank, ambiguous or conflicting evidence, including an explicit incompatible year elsewhere or more than one printed statement. Keep the separate Box 1a source suggestion and confirmation boundary."
    irsRef: "Form 1099-NEC (Rev. December 2026), Copy B, calendar-year field; https://www.irs.gov/pub/irs-pdf/f1099nec.pdf"
    testRef: "tests/apps/web/pdf-text-extraction.test.ts::binds the printed NEC Copy B calendar year to its box ($name)"
  - line: "nec-copy-b-acroform-pdf"
    description: "Read the official NEC Copy B year and Box 1a text widgets"
    formula: "On the recognized single-page, upright December 2026 Copy B layout, bind each nonempty value to its exact official text-widget name and rectangle. The widget must be visible and upright with one complete appearance value that agrees with its saved value and any positioned page text in that field. Canonicalize whole-dollar Box 1a widget values and matching printed amounts to exact cents, including zero. An absent widget or a blank widget with no appearance text preserves the flattened-text path. Missing appearance for a populated widget, stale, malformed, overlapping or conflicting evidence leaves that field manual. Preserve the independently supported field, legacy layouts and existing confirmation requirements."
    irsRef: "Form 1099-NEC (Rev. December 2026), Copy B, calendar-year field and Box 1a; https://www.irs.gov/pub/irs-pdf/f1099nec.pdf"
    testRef: "tests/apps/web/pdf-text-extraction.test.ts::binds NEC Copy B AcroForm widget values to visible original fields ($name)"
  - line: "guided-2026-original-uploads"
    description: "Save actual 2026 wage and NEC originals for guided facts-only review"
    formula: "A guided upload uses the currently selected interview year. Admit a 2026 W-2 or NEC with an explicit matching source year and an independently parsed financial fact when there is no conflicting dated original. Keep advanced and mismatched future-year requests, filename-only samples and training material under the existing gate. Retain unknown source years for manual review and preserve original document custody, source confirmation, engine, PDF and filing gates."
    testRef: "tests/apps/web/guided-original-upload-year.test.tsx::saves a matching original only for the selected guided facts-only year"
  - line: "w2-2026-copy-b-acroform-pdf"
    description: "Read separate Box 1 and Box 2 evidence from the official 2026 W-2 Copy B"
    formula: "Identify the printed wages, withholding, year and Copy B labels at both statement rows on a single upright official-layout page. Require each panel's intact widget set. Admit one populated statement only. Read each original Box 1 and Box 2 independently by widget name, location, matching saved value and appearance. Explicit zero is a value. Empty, conflicting, partly flattened or unobtainable evidence remains manual. Never combine the two statements or infer the employer, employee, other wages, withholding, payroll or state details. Mark the printed year for guided intake only when a single statement yields at least one accepted financial fact. Keep filing and calculation gates closed."
    irsRef: "2026 Form W-2, Copy B, printed year and boxes 1 and 2; https://www.irs.gov/pub/irs-pdf/fw2.pdf"
    testRef: "tests/apps/web/pdf-text-extraction.test.ts::keeps 2026 W-2 Copy B statements separate ($name)"
  - line: "w2-2026-informational-packet"
    description: "Keep the complete IRS W-2 informational packet under the future-year guard"
    formula: "A multipage upload with the IRS informational cover and an independently matched printed 2026 Copy B layout is an official information-copy packet. Use its printed year and canonical warning without importing any facts, including when a copy inside the packet was filled. A single ambiguous Copy B page and a multipage file without the informational cover continue to require manual confirmation."
    irsRef: "2026 Form W-2 informational cover and Copy B; https://www.irs.gov/pub/irs-pdf/fw2.pdf"
    testRef: "tests/apps/web/pdf-text-extraction.test.ts::recognizes the official 2026 W-2 informational packet before original intake"
  - line: "guided-2026-current-year-selection"
    description: "Use the live guided selection for original uploads"
    formula: "Check existing original source dates for conflict with the guided year. A prior draft supplies neither an original source date nor authority to override the live selection."
    testRef: "tests/apps/web/guided-original-upload-year.test.tsx::uses the live 2026 selection after reopening a 2025 draft with no originals"
  - line: "guided-2026-review-statement-uploads"
    description: "Save source-identified 1098-E and 1099-R originals for review"
    formula: "A source-proven 2026 Form 1098-E or Form 1099-R Copy B with review-only evidence can be saved only in the explicitly selected 2026 guided interview. Its source class and year take precedence over a historical filename alias. A conflicting dated original prevents the batch from being stored. Show original box evidence in the guided document list. It carries no calculation input, fixture seed or filing permission. A recognized copy with no reliable calendar year, a rotated page or a multipage upload stays unknown and manual."
    irsRef: "Official Form 1098-E and Form 1099-R, Copy B"
    testRef: "tests/apps/web/guided-original-upload-year.test.tsx::keeps a %s original in the selected 2026 guided review only"
    testRefs:
      - "tests/apps/web/pdf-text-extraction.test.ts::keeps a mixed 1099-R and W-2 packet manual without wage seeds"
  - line: "guided-2026-upload-concurrent-conflict"
    description: "Recheck current original source dates before an upload is committed"
    formula: "For local uploads, evaluate dated originals against the current stored return after document parsing and before original bytes are saved. If the return changes while those original bytes are being saved, discard the new byte batch and leave the latest metadata intact. Hosted uploads use the current revision and its existing rejected-write cleanup."
    testRef: "tests/apps/web/guided-original-upload-year.test.tsx::does not merge a 2026 guided upload with a new 2025 original (%s)"
  - line: "guided-2026-upload-batch-conflict"
    description: "Reject conflicting source years in a 2026 original upload batch"
    formula: "Before writing documents from a batch admitted under the guided 2026 exception, reject the entire batch when any other recognized original has a definite source year different from 2026. A missing or ambiguous source year still requires manual review."
    testRef: "tests/apps/web/guided-original-upload-year.test.tsx::rejects a conflicting original in the same guided upload batch before writes"
  - line: "saved-year"
    description: "Restore the actual guided year without inventing document facts"
    formula: "A valid explicitly saved guided year supplies the workspace target year on sync and reopen, including a return with no uploads. Original source years remain unchanged. Unknown or legacy omitted guided years stay unknown."
    irsRef: "Form1040 actual tax year and records"
    testRef: "tests/apps/web/workspace-guided-year.test.ts::restores the actual guided year and completed facts after a cached workspace was read"
  - line: "guided-active-workspace-review"
    description: "Build the advanced review only when it is visible"
    formula: "During the guided interview, the workspace uses the guided shell for draft recovery and estimates. Build the advanced issue summary, fallback estimate and return bundle only in advanced mode. On entry to advanced mode, derive them from the current workspace and draft before exposing draft-dependent review actions, and apply the existing year and readiness checks."
    testRef: "tests/apps/web/guided-original-upload-year.test.tsx::builds advanced review only when the workspace is in advanced mode"
    testRefs:
      - "tests/apps/web/guided-original-upload-year.test.tsx::restores the current guided fallback estimate in an advanced workspace"
  - line: "conflicts"
    description: "Retain source-year conflicts and unknown documents"
    formula: "A guided year cannot overwrite a different or missing original document year. Conflicting years and unresolved original years retain explicit blockers and cannot produce a preview. Unsupported2026 remains gated even with completed actual facts."
    irsRef: "Form1040 actual year-specific records and existing readiness rules"
    testRef: "tests/apps/web/workspace-guided-year.test.ts::preserves conflicting and unknown original document years instead of adopting the guided year"
  - line: "completion"
    description: "Reflect actual guided completion separately from uploads"
    formula: "Revalidate every routed guided section, including unvisited and changed sections. A completed phase alone cannot establish ready status. Guided-only checklist labels describe entered facts, and source review/coverage blockers remain unchanged."
    irsRef: "Form1040 complete household and source facts"
    testRef: "tests/apps/web/workspace-guided-year.test.ts::keeps incomplete changed and unsupported-year guided returns blocked"
  - line: "unvisited"
    description: "Count unvisited sections without claiming the user skipped them"
    formula: "Pending work includes total sections less completed sections. Preserve the separate actual skipped and needs-review counts; copy must not mark unvisited sections complete or silently omit them."
    testRef: "tests/apps/web/workspace-guided-year.test.ts::counts unvisited sections as pending without claiming they were skipped"
  - line: "generated-summaries"
    description: "Keep generated guided summaries distinct from original sources"
    formula: "Guided-prefixed summary records do not supply or contradict original document years. Revalidate the saved interview's actual source facts; original uploaded documents retain their own year checks."
    testRef: "tests/apps/web/workspace-guided-year.test.ts::restores completed actual W2 facts after syncing generated guided summaries"
  - line: "stale-preview"
    description: "Do not reuse a calculation with unbound saved guided facts"
    formula: "Restored guided facts invalidate an existing workspace financial preview, even for the same year. A subsequent guided calculation must use the saved actual facts; year equality alone cannot establish calculation provenance."
    irsRef: "Form1040 actual complete return records"
    testRef: "tests/apps/web/workspace-guided-year.test.ts::invalidates a prior calculation when same-year guided facts change"
  - line: "in-progress-display"
    description: "Distinguish saved progress from a completed interview needing review"
    formula: "Interview-phase facts retain pending counts and readiness blockers, but no completed-interview review summary. Display actual saved progress and the next section; do not classify future unvisited sections as a completed interview."
    testRef: "tests/apps/web/workspace-guided-year.test.ts::keeps saved interview progress separate from completed review metadata"
  - line: "finish-review"
    description: "Persist the final review visit before returning to the workspace"
    formula: "The explicit final-review Open full return action advances and saves that actual visit before syncing the completed flow. A switch to advanced mode from an earlier section does not complete it. Earlier missing facts and year conflicts remain blocked."
    testRef: "apps/web/tests/guided-interview.spec.ts::completed guided W-2 flow preserves its estimate and review-only output in the advanced workspace"
