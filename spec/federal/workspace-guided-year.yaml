form: "Saved guided return year"
fullName: "Reconcile actual local guided facts with workspace display and readiness"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i1040gi"
notes: "No calculation or filing gate is opened by restoring display metadata. Original document years and saved guided facts remain separate evidence."
lines:
  - line: "saved-year"
    description: "Restore the actual guided year without inventing document facts"
    formula: "A valid explicitly saved guided year supplies the workspace target year on sync and reopen, including a return with no uploads. Original source years remain unchanged. Unknown or legacy omitted guided years stay unknown."
    irsRef: "Form1040 actual tax year and records"
    testRef: "tests/apps/web/workspace-guided-year.test.ts::restores the actual guided year and completed facts after a cached workspace was read"
  - line: "conflicts"
    description: "Retain source-year conflicts and unknown documents"
    formula: "A guided year cannot overwrite a different or missing original document year. Conflicting years and unresolved original years retain explicit blockers and cannot produce a preview. Unsupported2026 remains gated even with completed actual facts."
    irsRef: "Form1040 actual year-specific records and existing readiness rules"
    testRef: "tests/apps/web/workspace-guided-year.test.ts::preserves conflicting and unknown original document years instead of adopting the guided year"
  - line: "completion"
    description: "Reflect actual guided completion separately from uploads"
    formula: "Revalidate every routed guided section, including unvisited and changed sections. A completed phase alone cannot establish ready status. Guided-only checklist labels describe entered facts, and source review/coverage blockers remain unchanged."
    irsRef: "Form1040 complete household and source facts"
    testRef: "tests/apps/web/workspace-guided-year.test.ts::keeps incomplete changed and unsupported-year guided returns blocked"
  - line: "unvisited"
    description: "Count unvisited sections without claiming the user skipped them"
    formula: "Pending work includes total sections less completed sections. Preserve the separate actual skipped and needs-review counts; copy must not mark unvisited sections complete or silently omit them."
    testRef: "tests/apps/web/workspace-guided-year.test.ts::counts unvisited sections as pending without claiming they were skipped"
  - line: "generated-summaries"
    description: "Keep generated guided summaries distinct from original sources"
    formula: "Guided-prefixed summary records do not supply or contradict original document years. Revalidate the saved interview's actual source facts; original uploaded documents retain their own year checks."
    testRef: "tests/apps/web/workspace-guided-year.test.ts::restores completed actual W2 facts after syncing generated guided summaries"
  - line: "stale-preview"
    description: "Do not reuse a calculation with unbound saved guided facts"
    formula: "Restored guided facts invalidate an existing workspace financial preview, even for the same year. A subsequent guided calculation must use the saved actual facts; year equality alone cannot establish calculation provenance."
    irsRef: "Form1040 actual complete return records"
    testRef: "tests/apps/web/workspace-guided-year.test.ts::invalidates a prior calculation when same-year guided facts change"
  - line: "in-progress-display"
    description: "Distinguish saved progress from a completed interview needing review"
    formula: "Interview-phase facts retain pending counts and readiness blockers, but no completed-interview review summary. Display actual saved progress and the next section; do not classify future unvisited sections as a completed interview."
    testRef: "tests/apps/web/workspace-guided-year.test.ts::keeps saved interview progress separate from completed review metadata"
  - line: "finish-review"
    description: "Persist the final review visit before returning to the workspace"
    formula: "The explicit final-review Open full return action advances and saves that actual visit before syncing the completed flow. A switch to advanced mode from an earlier section does not complete it. Earlier missing facts and year conflicts remain blocked."
    testRef: "apps/web/tests/guided-interview.spec.ts::completed guided W-2 flow preserves its estimate and review-only output in the advanced workspace"
