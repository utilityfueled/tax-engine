form: "Pub974 explicit multiple-business credit allocation"
fullName: "Actual consistent monthly eligible-plan method and signed combined health deduction"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p974"
sources:
  - "https://www.irs.gov/pub/irs-drop/rp-25-25.pdf"
  - "https://www.ecfr.gov/current/title-26/section-1.162(l)-1"
  - "https://uscode.house.gov/us/usc/119-118/t26/s280C/"
  - "https://www.ecfr.gov/current/title-26/section-1.199A-3"
notes: |
  Source interpretation under review, not a published numeric IRS example.
  Pub974 permits any reasonable method to allocate credit between businesses,
  requires separate signed lines1-7 and common lines8-11, and requires consistency
  through iteration. This taxpayer-recorded method uses the full actual eligible
  plan enrollment premium over actual household enrollment by month; no computed
  credit amount or percentage is an input. Actual benchmark ratios split health
  specified/nonspecified costs only. Final premiums/credit/deduction conserve.
  The combined allowable same-owner deduction uses actual business gross income
  for section199A attribution; a signed intermediate is never a negative QBI
  deduction. No binding joint2025 capped-repayment attribution is inferred.
lines:
  - line: "signed-businesses"
    description: "Apply the actual chosen method and combine signed business rows"
    formula: "Actual full premiums9000/6000, specified3000/6000 and Step2credit12000 allocate7200/4800. Signed line7 -4200/+1200 plus6000 nonspecified gives3000 total. With two equal actual business gross incomes, section199A receives1500 each, no negative deduction."
    testRef: "tests/engine/federal-marketplace-business-credit-method.test.ts::combines signed business worksheets using the recorded monthly premium method"
  - line: "choice-sources"
    description: "Require an actual current consistent allocation choice and full original sources"
    formula: "Missing choice, unknown confirmation, wrong year, missing reference or no consistency confirmation reject. Originals and zero advances remain unchanged."
    testRef: "tests/engine/federal-marketplace-business-credit-method.test.ts::does not invent an allocation choice or missing method facts"
  - line: "source-order"
    description: "Bind every policy and receipt independently of input order"
    formula: "Reorder actual plan sources with unchanged original policy indexes; final deduction and both per-business allocated credits remain unchanged."
    testRef: "tests/engine/federal-marketplace-business-credit-method.test.ts::preserves original policy and payment order independence"
  - line: "owner-limits"
    description: "Keep signed credits within each actual owner's combined claim"
    formula: "Same source plans with farm owned by spouse give primary1800 and spouse1200 combined claims, total3000 in2025 without APTC. Isolated2026 Step2 AGI22174 times .0210 rounds466, credit11534, owner claims2079.60/1386.40 transfer2080/1386 once. No binding joint2025 repayment allocation is introduced."
    testRef: "tests/engine/federal-marketplace-business-credit-method.test.ts::attributes the combined signed claim to its actual owner without borrowing spouse income"
  - line: "excluded-plan-income"
    description: "A health-ineligible plan cannot supply earned income or a QBI deduction"
    formula: "An actually nonbusiness second plan retains its original Form8962 premiums/credit denominator, but supplies0 health numerator/income capacity/QBI claim. The first actual business gets1800, the other0."
    testRef: "tests/engine/federal-marketplace-business-credit-method.test.ts::excludes a known health-ineligible business from income limits and QBI attribution"
  - line: "three-plans-cents"
    description: "Conserve cents across three originals and unequal coverage periods"
    formula: "Add a third250/month plan forJuly-December to the first business. First policyJanuary750.01, othermonths750; second500/month. Full premiums16500.01 and credit12000 give4500.01 before the single4500 transfer. Exact monthly source ratios yield business credits7600.0031999744/4399.9968000256 to10decimalplaces; equal gross income gives2250 each regardless of plan/payment order."
    testRef: "tests/engine/federal-marketplace-business-credit-method.test.ts::conserves three partial-year policy sources and original cents independent of order"
  - line: "printed-conservation"
    description: "Keep the single whole-dollar transfer stable when proportional shares include half dollars"
    formula: "Actual total15001 and credit12000 give3001; equal same-owner gross income yields exact1500.50 each. Single printed transfer3001 is allocated1501/1500 in stable canonical source order, never by input plan order; exact worksheet amounts remain unchanged."
    testRef: "tests/engine/federal-marketplace-business-credit-method.test.ts::keeps rounded QBI attribution stable when actual plan order changes"
  - line: "guide-method"
    description: "Collect the actual choice without defaulting or losing its confirmation"
    formula: "Actual source year/reference/method/consistent-use answer transfers once. Missing or false facts reject; policy, payment, household and method edits revoke confirmation. No current allowance is collected."
    testRef: "tests/guided-interview/guided-marketplace-business-credit-method.test.ts::retains the actual method choice and invalidates it after consumed edits"
  - line: "binding-owner"
    description: "Apply each owner's actual income bound after signed premium allocation"
    formula: "Actual primaryC30000/spouseF1000/interest10000 gives SE deductions2119/71, spouse income929. In2025 Step2credit12000 gives1800 primary+929 spouse=2729. Isolated2026 Step2AGI28881/21150=136%, rate.0333 gives962 contribution, credit11038; primary2377.20+spouse929 transfers3306 once. Actual2026 advances do not change this deduction; binding historical2025 capped owner attribution remains separate."
    testRef: "tests/engine/federal-marketplace-business-credit-method.test.ts::limits each actual owner after signed allocation and preserves independent advances"
  - line: "guide-return"
    description: "Reach the multiple-owner method through actual business and shareholder sources"
    formula: "Actual primaryC20000/spouseW2wages20000(includes6000health) gives income40000 less1413SEhalf and3000health=35587AGI. Credit Step2=12000; final174%/.0096 contribution342 gives11658PTC. Primary QBI health1800; shareholder1200 is not a QBI deduction."
    testRef: "tests/guided-interview/guided-marketplace-business-credit-method.test.ts::calculates separate actual business owners from the saved method and original plans"
  - line: "guide-controls"
    description: "Make the explicit method reachable in the existing health source panel"
    formula: "Adding a choice starts with blank method/year/reference and unknown confirmations; original plans remain unchanged. Edit and reconfirm the actual method using existing controls."
    testRef: "tests/apps/web/marketplace-business-credit-method-interactions.test.tsx::collects the actual allocation choice without filling or retaining stale answers"
  - line: "review"
    description: "Preserve signed source rows and the recorded choice in the private review context"
    formula: "Actual3000 transfer,7200/4800 credit and-4200/+1200 intermediate are reviewed against original method and sources. Changed/removed method or balanced result tampering rejects before I/O; identifiers are redacted and every page bears the review notice."
    testRef: "tests/pdf/marketplace-business-credit-method-review.test.ts::binds the chosen method and signed business rows before redacted PDF output"
  - line: "review-redistribution"
    description: "Reconcile original calculated allocation even when forged totals and audits agree"
    formula: "A balanced7201/4799 credit rewrite with matching signed rows and both audit containers must reject before I/O. An actual selected method prepares an original context even without shared or partial-coverage policy sources."
    testRef: "tests/pdf/marketplace-business-credit-method-review.test.ts::rejects balanced allocation rewrites and prepares ordinary selected-method sources"
  - line: "browser"
    description: "Exercise the source choice through the production interview at desktop and mobile widths"
    formula: "Actual primary business and spouse shareholder produce35587AGI. Source edits revoke both family confirmations, chosen-method confirmation, health and credit checks; reconfirmation restores the same result. Reload retains originals and unknowns without sending private data."
    testRef: "apps/web/tests/guided-marketplace-business-credit-method.spec.ts::preserves the recorded method and independent owner sources through edits and reload"
  - line: "shared-policy"
    description: "Apply the same recorded method after independently derived shared and unshared policy sources"
    formula: "Original shared1500/200advance with actual50% agreement or original1125 with independent1000/500 no-advance benchmarks each yields750 family enrollment. Together with a distinct500 unshared original, the actual method still allocates7200/4800 and transfers3000; unchanged full originals and independent paid shares remain bound."
    testRef: "tests/engine/federal-marketplace-business-credit-method.test.ts::composes original shared allocation sources before the recorded business method"
  - line: "workspace"
    description: "Prepare the original business choice before redacting the actual guided workspace packet"
    formula: "The actual35587AGI/3000health/11658PTC return exports one shared3000 transfer with separate7200/4800 business components. Missing method confirmation blocks output; every saved page bears the review notice without original tax identifiers."
    testRef: "tests/apps/web/workspace-marketplace-business-method.test.ts::exports the recorded business method through the original guided workspace context"
