form: "Guided student-loan source facts"
fullName: "Actual Schedule 1 loan facts, source conservation and confirmation"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p970"
notes: |
  Refreshed 2026-10-25. Source collection uses the actual borrower and original
  loan facts, with current-year paid interest and exclusions. It never substitutes
  a raw Form1098E total for eligibility or a missing MAGI with zero.
lines:
  - line: "source-input"
    description: "Forward actual source facts and preserve unknowns"
    formula: "Require actual year, claimant answers and each loan's known source amounts and eligibility. Parse money with Decimal. Emit original Form1098E records only from actual statement details. Reconcile any saved gross-interest total without emitting it as additional interest."
    irsRef: "Pub970 chapter4; Instructions Form1098E"
    testRef: "tests/guided-interview/guided-student-loan-facts.test.ts::preserves actual loan facts and reconciles the saved gross amount"
  - line: "source-links"
    description: "Reconcile education allocations and original statements"
    formula: "Use the calculated per-expense Form1099Q vector, actual borrower and owner, and exact source labels. Split loans may share a statement only when original details agree and allocations equal Box1. Unknown records, duplicate allocations and contradictory owners remain incomplete."
    irsRef: "IRC221(e)(6); Pub970 No Double Benefit Allowed"
    testRef: "tests/guided-interview/guided-student-loan-facts.test.ts::reconciles original lender statements and linked education interest"
  - line: "guided-flow"
    description: "Require source completion without fabricating a deduction"
    formula: "Selected student-loan routes require actual source facts; legacy aggregates stay saved but incomplete until reconciled. Source-only validation does not compute a deduction before canonical MAGI."
    irsRef: "Schedule1 line21; Pub970 Worksheet4-1"
    testRef: "tests/guided-interview/guided-student-loan-facts.test.ts::requires actual loan sources in the guided return and forwards them once"
  - line: "confirmation"
    description: "Invalidate changed source facts without confirmation cycles"
    formula: "Substantive household, payroll or education-source edits invalidate linked student-loan and educator confirmations. Changing only sourceFactsConfirmed metadata does not invalidate another source confirmation. Actual eligibility answers always count as substantive."
    irsRef: "Source reconciliation requirement; Pub970 multiple benefits"
    testRef: "tests/guided-interview/guided-student-loan-facts.test.ts::invalidates substantive source changes without cycling confirmations"
  - line: "source-controls"
    description: "Collect actual facts through interaction and preserve saved evidence"
    formula: "New controls start unknown, allow explicit zero or false, retain saved legacy values and clear confirmation on source edits. Review shows source interest separately from an allowed deduction."
    irsRef: "Pub970 chapter4"
    testRef: "tests/apps/web/student-loan-source-interactions.test.tsx::collects actual loan facts and revokes confirmation after source changes"
  - line: "household-consistency"
    description: "Reconcile actual claimant answers across worksheets"
    formula: "An actual claimed-dependent answer must agree between student-loan and education-credit worksheets. A known claimed dependent cannot simultaneously have a known inability to be claimed in the household worksheet. Unknown related facts remain unknown."
    irsRef: "Topic456 claimant eligibility; Pub970 chapter4"
    testRef: "tests/guided-interview/guided-student-loan-facts.test.ts::checks actual household dependency and calculated education links before completion"
  - line: "canonical-calculation"
    description: "Calculate the actual source deduction through the full return"
    formula: "The guided bridge supplies actual loan facts once; canonical federal MAGI and the source worksheet determine Schedule1 line21. A lender-statement source without Form1098E still reaches the return and never becomes a dropped adjustment."
    irsRef: "Schedule1 line21; Pub970 Worksheet4-1"
    testRef: "tests/guided-interview/guided-student-loan-facts.test.ts::calculates the actual guided loan deduction through canonical federal income"
