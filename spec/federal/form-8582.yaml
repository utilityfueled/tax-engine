form: "Form 8582"
fullName: "Passive Activity Loss Limitations"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i8582"
notes: |
  Official 2025 Form 8582 Parts I-VIII. Source activity amounts have already
  passed basis and at-risk limitations. Current income, current losses and
  prior unallowed losses remain separate. Amounts from different forms may
  coexist for one activity; the overall activity net controls allocation.
  PTPs remain separate under section 469(k), including their nonpassive net gains.
  No CRD or invented multi-form Part IX allocation is represented by this input.
  The helper retains original source cents and uses whole-dollar activity rows.
  Proportional dollar allocations use largest fractional remainders, with stable
  original-order ties, solely to reconcile the printed column totals. This is
  an implementation rounding choice satisfying IRS total constraints, not an
  IRS-prescribed ownership allocation or taxpayer election.
  An unmatched historical carryforward lacks rental classification and report
  location; compatibility preview keeps it in the other-passive bucket and
  the review copy identifies that source limitation.
lines:
  - line: "1a"
    description: "Active rental current income"
    formula: "Sum Part IV column a"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::keeps actual current and prior loss columns on the official lines"

  - line: "1b"
    description: "Active rental current losses"
    formula: "Sum Part IV column b; audit retains negative sign"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::keeps actual current and prior loss columns on the official lines"

  - line: "1c"
    description: "Active rental prior unallowed losses"
    formula: "Sum Part IV column c; audit retains negative sign"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::keeps actual current and prior loss columns on the official lines"

  - line: "1d"
    description: "Net active rental"
    formula: "1a + 1b + 1c"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::keeps actual current and prior loss columns on the official lines"

  - line: "2a"
    description: "Other passive current income"
    formula: "Sum Part V column a; no PTP income"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::keeps PTP net gains outside the regular passive loss pool"

  - line: "2b"
    description: "Other passive current losses"
    formula: "Sum Part V column b"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::keeps actual current and prior loss columns on the official lines"

  - line: "2c"
    description: "Other passive prior unallowed losses"
    formula: "Sum Part V column c"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::retains fully allowed prior losses when combined activities have a gain"

  - line: "2d"
    description: "Net other passive"
    formula: "2a + 2b + 2c"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::retains fully allowed prior losses when combined activities have a gain"

  - line: "3"
    description: "Combined net"
    formula: "1d + 2d; if nonnegative all losses including prior losses are allowed and Parts II-III are skipped"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::retains fully allowed prior losses when combined activities have a gain"

  - line: "4"
    description: "Loss eligible for special allowance"
    formula: "min(abs(1d),abs(3)) only when both negative"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::caps the special allowance at the combined loss in the IRS line 4 example"

  - line: "5"
    description: "Phaseout ceiling"
    formula: "150000; 75000 MFS lived apart all year"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::uses the MFS capacity before limiting the actual loss and skips Part II when ineligible"

  - line: "6"
    description: "Modified AGI"
    formula: "max(0, actual Form8582 MAGI); never substitute final1040 AGI"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::phases out the allowance capacity before limiting the actual rental loss"

  - line: "7"
    description: "Income capacity"
    formula: "5 - 6; skip when6 >=5"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::phases out the allowance capacity before limiting the actual rental loss"

  - line: "8"
    description: "Special allowance capacity"
    formula: "round(min(25000,(5-6)*0.5)); MFS apart cap12500; skipped when6 >=5"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::phases out the allowance capacity before limiting the actual rental loss"

  - line: "9"
    description: "Allowed special rental loss"
    formula: "min(4,8); zero if6 >=5"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::phases out the allowance capacity before limiting the actual rental loss"

  - line: "10"
    description: "Passive income offset"
    formula: "1a + 2a; only when3 is negative"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::allocates unallowed loss by overall activity loss after the special allowance"

  - line: "11"
    description: "Total allowed losses"
    formula: "9 + 10 when3 negative; otherwise losses fully allowed via line3"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::allocates unallowed loss by overall activity loss after the special allowance"

  - line: "IV-V"
    description: "Activity source rows"
    formula: "Preserve current income, current loss and prior loss; overall net determines columns d/e and stable original source index"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::keeps actual current and prior loss columns on the official lines"

  - line: "VI-VIII"
    description: "Activity allocation"
    formula: "Allocate line9 to overall active rental losses; allocate abs(line3)-line9 to remaining overall losses; an overall gain activity retains all its current/prior losses"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::allocates unallowed loss by overall activity loss after the special allowance"

  - line: "rounding"
    description: "Reconcile printed dollar totals"
    formula: "Largest fractional remainder with original-order ties; exact totals, nonnegative and within source loss capacity"
    irsRef: "Form 8582 and Instructions, Parts I-VIII"
    testRef: "tests/engine/forms/form-8582-source.test.ts::reconciles proportional dollar rounding while preserving original source cents"

  # ── PTP segregation (IRC §469(k)) ─────────────────────────
  - line: "ptp-segregation"
    description: "Publicly traded partnership loss segregation"
    formula: |
      Per IRC §469(k), passive activity rules apply separately to each PTP.
      PTP losses can only offset income from the SAME PTP, never other passive income.
      For each PTP:
        1. Compute current-year net income or loss
        2. Add prior-year unallowed PTP losses for the same PTP
        3. If net income: treat as nonpassive income outside Form 8582; do not offset another activity loss
        4. If net loss: entire net loss is suspended per-PTP (NOT included in Lines 1-10)
      Suspended PTP losses carry forward per-PTP indefinitely.
      When a PTP interest is fully disposed of in a taxable transaction,
      all suspended PTP losses become deductible as nonpassive losses per IRC §469(g)(1).
    irsRef: "IRC §469(k); Form 8582 Instructions, Publicly Traded Partnerships"
    edgeCases:
      - "PTP losses cannot offset non-PTP passive income"
      - "PTP losses cannot offset income from a different PTP"
      - "PTP net income is nonpassive and excluded from every regular Form 8582 line"
      - "Prior-year suspended PTP losses only offset current-year income from the SAME PTP"
      - "Multiple PTPs are handled independently — each has its own income/loss netting"
      - "A PTP with both income and loss items nets to a single amount per IRC §469(k)"
      - "PTP losses are subject to basis and at-risk limitations BEFORE the §469(k) segregation"
    testRef: "tests/engine/forms/form-8582.test.ts::PTP with net loss — entire loss is suspended, not included in Lines 1-10"

  - line: "ptp-carryforward"
    description: "Per-PTP suspended loss carryforward"
    formula: "Suspended PTP losses carry forward by PTP name until offset by future income from the same PTP or until the PTP interest is fully disposed of"
    irsRef: "IRC §469(k)(2)"
    testRef: "tests/engine/forms/form-8582.test.ts::PTP prior-year carryforward offsets current-year PTP income from same PTP"

  - line: "ptp-disposition"
    description: "PTP disposition — release of suspended losses (IRC §469(g)(1))"
    formula: |
      When a taxpayer fully disposes of an entire interest in a PTP in a
      fully taxable transaction, ALL accumulated suspended PTP losses
      become deductible as losses that are NOT from a passive activity.
      For each disposed PTP:
        1. Compute current-year net from K-1 activity (income minus loss)
        2. Add gain/loss recognized on the disposition of the PTP interest
           (treated as passive activity income/loss from the PTP per IRC §469(g)(1)(A))
        3. Apply prior-year suspended PTP losses
        4. If net loss remains: the entire net loss is released as a nonpassive loss
        5. If net income: all suspended losses have been absorbed; no release needed
      Released losses flow to Schedule E / Schedule 1 as nonpassive losses,
      reducing AGI directly rather than being subject to passive loss limitation.
    irsRef: "IRC §469(g)(1); IRC §469(k); Pub 925"
    edgeCases:
      - "Only applies to FULLY taxable dispositions — gifts, bequests, and related-party sales do not qualify"
      - "Disposition gain from selling the PTP interest is itself passive activity income from that PTP for netting purposes"
      - "If disposition gain fully absorbs suspended losses, no loss is released"
      - "A PTP with no current-year K-1 activity but prior-year suspended losses can still release those losses on disposition"
      - "Partial dispositions do not trigger §469(g)(1) — the taxpayer must dispose of their ENTIRE interest"
      - "For MFJ returns, disposition applies per the disposing spouse's PTP interest only"
      - "Released losses are NOT subject to Form 8582 passive limitation — they are nonpassive by operation of §469(g)(1)"
      - "The disposed PTP should not appear in the ptpSuspendedLosses carryforward output"
    testRef: "tests/engine/forms/form-8582.test.ts::PTP disposition releases all suspended losses as nonpassive"


  - line: "return-magi"
    description: "Canonical Form8582 modified AGI"
    formula: "Remove preliminary rental/K1 passive amounts; include positive net regular passive income after prior losses and separate PTP income; add actually deducted IRA/student-loan/half-SE and excluded bond/adoption amounts; remove taxable Social Security"
    irsRef: "Form8582 Instructions line6 and section469(d)(1)"
    testRef: "tests/engine/federal-passive-loss-source.test.ts::uses net passive loss and actual line 6 addbacks rather than gross rental losses"

  - line: "return-loss-transfer"
    description: "Canonical allowed current and prior losses"
    formula: "Replace preliminary regular ScheduleE passive income with current passive income minus actual total allowed current and prior losses; preserve original activity indices rather than loss-only array positions"
    irsRef: "Form8582 line3 and PartsVII-VIII; ScheduleE lines22/28"
    testRef: "tests/engine/federal-passive-loss-source.test.ts::transfers allowed losses by actual activity index and releases prior losses once"

  - line: "review-copy"
    description: "Audited review form and complete activity rows"
    formula: "Copy applicable official audited lines1a-11; retain actual current/prior and allocation rows including continuation sources, never recalculate MAGI or infer report locations"
    irsRef: "Final2025 Form8582 PartsI-VIII"
    testRef: "tests/pdf/fill-form-8582-source.test.ts::copies actual audited MAGI and prior losses with every source row"

  - line: "review-source-check"
    description: "Source and audit consistency"
    formula: "Reject changed current/prior activity sources and missing, duplicate or altered applicable audits before rendering"
    irsRef: "Final2025 Form8582 PartsI-VIII"
    testRef: "tests/pdf/fill-form-8582-source.test.ts::refuses changed activity sources and altered intermediate passive audits"

  - line: "attachment"
    description: "Required form with fully allowed losses"
    formula: "Attach when current/prior losses require the retained form, including a line3 stop with no suspended loss"
    irsRef: "Final2025 Form8582 line3; Instructions Who Must File"
    testRef: "tests/pdf/fill-form-8582-source.test.ts::attaches the passive worksheet when all losses are allowed"

  - line: "review-ratio-rounding"
    description: "Printed ratio precision and stop branches"
    formula: "Displayed six-place ratios sum to1 with stable largest remainders; exact core dollar allocations are unchanged. Skipped lines stay blank and actual applicable zero is printed."
    irsRef: "Form8582 PartsVI-VII ratios total1.00; official lines3/6 stop instructions"
    testRef: "tests/pdf/fill-form-8582-source.test.ts::reconciles printed ratios and preserves official stop branches"

  - line: "return-ptp-prior-loss"
    description: "Continuing PTP net income after its actual prior unallowed losses"
    formula: "Canonical AGI, Schedule1 and Form8582 MAGI include the same per-PTP net income after prior carry used by the pure PTP worksheet; no unrelated regular loss offsets that income"
    irsRef: "Form8582 Instructions Special Instructions for PTPs rules1-3"
    testRef: "tests/engine/federal-passive-loss-source.test.ts::transfers continuing PTP prior losses into canonical income and rental MAGI once"

  - line: "ptp-source-integrity"
    description: "Actual PTP prior loss identity and amount"
    formula: "Finite nonnegative prior amounts and actual nonempty unambiguous current PTP identities are required; missing names reject with a source diagnostic, never fabricated identity"
    irsRef: "Form8582 Instructions Special Instructions for PTPs separate per-partnership computation"
    testRef: "tests/engine/forms/form-8582-source.test.ts::rejects invalid or ambiguous PTP prior-loss sources"
