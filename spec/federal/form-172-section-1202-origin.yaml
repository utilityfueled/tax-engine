form: "Current Form172 section1202 sources"
fullName: "Source-bound QSBS restoration in current regular, alternative and investment NOL origins"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i172"
notes: |
  Refreshed2026-10-25: IRC172(d)(2)(B),56(d)(2),57(a)(7), Reg1.172-3(a)
  and1.1411-4(h)(2), current Form172PartI and i6251Line2h.
  https://uscode.house.gov/us/usc/119-120/t26/s172/
  https://uscode.house.gov/us/usc/119-120/t26/s56/
  https://www.ecfr.gov/current/title-26/section-1.172-3
  https://www.ecfr.gov/current/title-26/section-1.1411-4
  https://www.irs.gov/pub/irs-pdf/f172.pdf
  https://www.irs.gov/instructions/i6251
  Actual issuer/lot history determines the exclusion before origin computation.
  Form172 line3 retains gross investment gains before exclusion, line16 retains
  the actual ScheduleD net-loss magnitude, and line17 restores the exclusion.
  With nonnegative post-exclusion net capital, lines16,18-22 are zero for the
  supported nonbusiness cohort; the exclusion is restored once at line24.
  This matches the statutory computation without a1202 exclusion. These literal
  examples are derived statutory/form controls, not published IRS oracles.

  A negative post-exclusion capital net remains explicitly unresolved. Example:
  gain1000-loss700-exclusion500 gives ScheduleD-200. Literal printed lines17/21
  restore500+200, whereas recomputation without1202 changes-200 to300, a500
  adjustment. No primary worked example resolving this conflict was located.
  Do not substitute a pre-exclusion net on printed line16, drop its line21,
  fabricate a residual, or represent this interpretation as settled. Such cases
  retain a named boundary pending authoritative qualified tax interpretation.
  Complete independent overlap trace, active business loss100000, wages0,
  nonbusiness gross gain1000/loss700, exclusion500, standard15750 and no other
  items: AGI=-100200; lines1..24=[-115950,700,1000,0,300,15750,0,300,15450,
  0,0,0,0,0,0,200,500,0,200,0,200,0,0,-99800]. Statutory recomputation
  without1202 leaves300 nonbusiness capital income offset by only300 allowable
  nonbusiness deductions, yielding100000 NOL. The200 difference is unresolved;
  the source gate remains, and neither trace is presented as a published oracle.

  Under56(d)(2), the current alternative loss applies the172 modifications to
  the AMT sources. Actual6251 includes its rounded7percent pre2010 preference;
  remove that same included amount before restoring the full actual exclusion
  once. This avoids retaining both full restoration and the partial preference.
  Keep all original cents, source/printed Form172 amounts and separate regular,
  AMT and1411 origins. Source validation never accepts an exclusion override.
  Current source support does not open2026 readiness or establish human review.
