notes: |
  Presentation of the already implemented bounded ordinary calendar-year method only.
  No new calculation,400test interpretation, preferential/special tax method, filing or2026 gate.
  Pinned f2210 SHA6899ce672648b280bf00ab47200f1b0fbf40368cfbf137df507b945b8577159a.
  Page3 has144 actual widgets:120 normal-width writable cells and24 one-point placeholders
  beside printed constants. Print source values only; keep skipped/inactive/constant cells blank.
  Complete RAW direct mapper inputs remain compatible without a new token; source-qualified redacted
  Schedule AI physical presentation requires a context prepared from actual complete originals before redaction.
  No original identity or source history is recaptured from redacted display input.
  Existing direct mapper API remains compatible; public attachment is only current original-source
  required annualized ScheduleAI, never a generic Form2210 auto-attach. Public output stays
  review-only/partial/nonfiling. Original identities/opaque tokens are validation evidence only.
  Single, ordinary itemizer and two-owner literals are independently derived with Decimal before outputs.
  Itemizer actual cash gifts5000/3500/6500/5000 on March15/May15/August15/December15
  cumulatively5000/8500/15000/20000; annual qualified cash20000 below applicable cap.
  Owner labels use audited blank left-footer margin x36/y26/size7: table line36 baseline38.551,
  lowest actual widget y35.977, source Form2210 footer x514.336/y26.829, review notice rectangle y3-18.
  Initial proposed y40/size8 would overlap line36; corrected before tests/products/runtime.
