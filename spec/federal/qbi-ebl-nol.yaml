form: "QBI EBL NOL Character"
fullName: "Actual section461-origin regular NOL qualified character"
taxYear: 2025
irsReference: "https://www.ecfr.gov/current/title-26/section-1.199A-3; https://www.irs.gov/instructions/i8995"
lines:
  - line: "original-history"
    description: "Bind qualified character to the actual regular originating NOL and filed history"
    formula: "Actual preceding-year source records identify each regular excess-business-loss vintage, owner, original qualified amount, qualified opening carry and every actual historical absorption/attribute reduction. Original and nonqualified amounts separately conserve; changed identity, origin, original NOL snapshot or missing history rejects. Ordinary individual NOL and independent AMT NOL never establish qualified character."
    testRef: "tests/engine/forms/qbi-ebl-nol.test.ts::binds qualified EBL history to the original regular NOL without changing sources"
  - line: "deduction"
    description: "Only the actual current regular NOL deduction enters current QBI"
    formula: "Reg1.199A-3(b)(1)(v) permits the461-origin NOL when deducted. Use each completed actual regular vintage deduction times its fixed original qualified/original loss fraction, with whole-dollar transfer and final available qualified remainder conserved. Original100000/qualified80000, opening75000/qualified60000 and current deduction30000 produce24000 current qualified loss. Independent modified absorption40000 removes32000 qualified carry, leaving28000 qualified of35000 regular, without a further8000 current QBI deduction."
    testRef: "tests/engine/forms/qbi-ebl-nol.test.ts::separates actual deduction from modified absorption and preserves immutable replay"
  - line: "attribute-reduction"
    description: "Apply actual current COD vintage reductions after current tax"
    formula: "Current COD cannot change the current regular deduction or its QBI transfer. Bind actual regular before/reduction/after balances. Wholly qualified or wholly nonqualified remaining pools close directly. A partial mixed-character attribute reduction has no established allocation method here and rejects explicitly; full elimination consumes the entire known qualified remainder."
    testRef: "tests/engine/forms/qbi-ebl-nol.test.ts::keeps current COD reduction separate and rejects an unestablished mixed allocation"
  - line: "boundaries"
    description: "Preserve source completeness and separate regular AMT and ordinary QBI carry"
    formula: "Every actual regular EBL vintage must have exactly one original character history. Missing source amounts and unknown lists do not mean zero. A stale completed result, duplicate source, incompatible original ratio/history or AMT-vintage substitution rejects. Actual post2020 EBL has no statutory expiration; a contradictory expiry result rejects."
    testRef: "tests/engine/forms/qbi-ebl-nol.test.ts::rejects missing or contradictory histories and stale canonical balances"
  - line: "canonical-replay"
    description: "Pass the completed actual regular vintage result into final and AMT replay"
    formula: "Wages100000 less standard15750 give actual regular NOL limit84250;80percent deduction67400 from100000 qualified80percent EBL yields53920 current QBI loss and26080 qualified closing carry. Actual regular AGI32600 and independent AMT source history remain unchanged. Adding original K1 profit/QBI100000 consumes the100000NOL, leaving20000QBI/4000deduction. AMTI beforeATNOL is200000-4000=196000 after restoring the regular100000NOLD; independentATNOL20000 yields176000. Internal actual-AMT replay receives the completed regular deduction by vintage; modified replay does not invent QBI from hypothetical absorption."
    testRef: "tests/engine/federal-qbi-ebl-nol.test.ts::transfers only actual regular EBL deductions into current QBI through final and AMT replay"
  - line: "legacy-unknown"
    description: "An omitted legacy EBL aggregate is unknown, not a contradictory zero"
    formula: "Preserve the omitted optional priorYear aggregate. An explicitly supplied aggregate, including zero, must still match the actual remaining regular EBL vintages. No current claim or opening source is inferred from the omission."
    testRef: "tests/engine/federal-qbi-ebl-nol.test.ts::preserves omitted legacy EBL totals while rejecting an explicit contradictory zero"
