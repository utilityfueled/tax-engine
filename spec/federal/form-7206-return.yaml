form: "Form7206 canonical return sources"
fullName: "Actual owner and business health-insurance deduction handoff"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i7206"
notes: |
  Refreshed2026-10-25 against final2025 Form7206 lines4-14 and instructions,
  IRC162(l), Reg1.199A-3(b)(1)(vi) and actual source helper724f95c.
  Source profits are computed by the return, not entered overrides. Health
  insurance does not reduce ScheduleSE income. Final2026 qualification remains closed.
lines:
  - line: "17"
    description: "Actual completed source deduction enters Schedule1 once"
    formula: "Calculate Form7206 with canonical source business income, same-owner positive income and SE deduction; retain exact source cents, round each completed business Form7206line14 for its transfer and sum those form amounts once into Schedule1line17. Carry the same transferred amounts into QBI. Do not also add a legacy aggregate or worksheet."
    testRef: "tests/engine/federal-form7206.test.ts::uses the actual health source once without reducing SE tax"
  - line: "person"
    description: "Bind covered taxpayer identity and attained age to the return"
    formula: "Match primary/spouse names and actual attained year-end age to canonical household DOB; matching dependents also reconcile. Reject aliases, ambiguous household identity and unknown or contradictory age rather than allowing an inflated LTC cap."
    testRef: "tests/engine/federal-form7206.test.ts::rejects a substituted household age and unknown business source"
  - line: "11"
    description: "Bind shareholder health deduction to actual W2 source"
    formula: "An actual Scorp source uses that owner's bound W2Box5 income limit; paid or reimbursed shares claimed included in wages must fit actualBox1. The deduction does not reduce unrelated ScheduleC QBI."
    testRef: "tests/engine/federal-form7206.test.ts::uses actual shareholder wages without allocating the deduction to another business"
  - line: "owner"
    description: "Separate owner net-profit limits"
    formula: "Canonical C/F/crypto/K1 sources retain actual owners, exclude the other spouse's profit and sum only positive income for line5. A loss business does not borrow its spouse's positive income."
    testRef: "tests/engine/forms/form-7206-return.test.ts::separates owner income and ignores loss sources in the positive denominator"
  - line: "9-12"
    description: "Reconcile actual retirement and foreign-exclusion allocations"
    formula: "When either aggregate is positive, require confirmed source-referenced per-business deductions. Exact retirement allocations equal allowed Schedule1line16 and foreign allocations plus actual otherForeignExclusion equal Form2555line45. Source IDs and owners match canonical business context; do not allow profit overrides."
    testRef: "tests/engine/forms/form-7206-return.test.ts::requires reconciled retirement and foreign allocations without inventing zero"
  - line: "qbi"
    description: "Carry calculated health deduction to its actual trade"
    formula: "Actual business health deductions remain bound to that trade for QBI. Shareholder-wage amounts are nonQBI. Explicit mixed-income allocation may not move a health deduction into another trade; residual nonQBI amounts reconcile by owner."
    irsRef: "Reg1.199A-3(b)(1)(vi)"
    testRef: "tests/engine/forms/qbi-source-deductions.test.ts::keeps actual health deductions on their source business and reconciles mixed allocations"
  - line: "source-gate"
    description: "Never ignore actual worksheets or replace2026 eligibility with an aggregate"
    formula: "Standalone Schedule1 requires completed canonical context when actual Form7206 is present. Positive2026 legacy health amounts require actual sources; no silent legacy override. Verified actual payroll and business sources must support the SE deduction used in the limit."
    testRef: "tests/engine/federal-form7206.test.ts::requires actual2026 sources and a completed standalone handoff"
  - line: "source-identity"
    description: "Each original shareholder W2 supplies one income limit"
    formula: "Canonical source IDs use one unique index spelling. Two textual aliases of the same original W2 cannot create separate plans with duplicate business income limits."
    testRef: "tests/engine/federal-form7206.test.ts::rejects two index aliases for one shareholder income source"
  - line: "foreign-source"
    description: "Preserve the actual source class of excluded foreign income"
    formula: "A positive canonical Form2555 exclusion requires its confirmed gross source mapping. Aggregate Form7206 line12 allocations to self-employed, partnership, and shareholder businesses may not exceed the corresponding actual foreign business, partnership, and W2 employment receipts. A wage-only exclusion cannot be moved to a domestic business. This is a source-conservation bound, not an inferred allocation method."
    irsRef: "Form7206 line12; Form2555 PartIV and line45"
    testRef: "tests/engine/forms/form-7206-return.test.ts::rejects foreign allocations contradicting the actual income source class"

  - line: "signed-form2555-attribution-method"
    description: "Keep negative actual Form2555line45 separate from nonnegative business attribution"
    formula: "A negative source-confirmed Form2555line45 is a valid signed amount. Except the independently proven domestic-F-only route below, current Form7206 business exclusion allocations accept only nonnegative exclusions and have no signed per-business source method. Reject that precise composition with a named separate-method requirement; never describe the actual source as invalid or silently clamp it."
    testRef: "tests/engine/forms/form-2555-actual-expense-allocation.test.ts::names the separate signed Form7206 business attribution method"

  - line: "signed-domestic-f-source"
    description: "Prove zero foreign exclusion attributable to a separate domestic farm plan"
    formula: "For a positive wholly foreign capital-material Schedule C and positive same-owner Schedule F only, retain actual signed Form2555line45 entirely on its sole confirmed C source. Require canonical signed Form2555 audit, complete actual C source binding, a source-year/reference/owner/activity/EIN-bound domesticFarmSources packet with explicit allIncomeDomesticConfirmed and noSelfEmployedRetirementDeductionConfirmed, and actual zero Schedule1 retirement amount. Only exclusively F-established nonmarketplace medical plans enter this route. Their Form7206line12 is known zero from actual domestic source facts; do not clamp the signed household aggregate, invent a signed allocation, or alter C-plan/mixed-owner/Marketplace guards. Fline4 is actual F profit; line5 includes same-owner positive C+F; line7 is actual SE-half times F/(C+F); line13 is max(0,F-line7); line14 is min(actual eligible premium,line13). Retain source-proven Fzero, unchanged signed C amount and original C/F source identities (including both business EINs and original references) through a SHA256 commitment in audit and recompute before review export. Commit actual C/F original source blocks, complete original Form2555 and domestic proof, and actual complete active health-source ledger (including outer reference, persons, months and payment dates). Normalize structured personal tax identifiers under the established render-redaction contract in the commitment; recursively sort object keys, retain array order and exact source text; never render newly collected raw source references. Equal amounts from a different C or F identity do not validate a saved calculation."
    irsRef: "Final2025 Form7206 note and lines4-14; i7206 More than one health plan and business; Reg1.911-6(a); Reg1.199A-3(b)(1)(vi), retrieved2026-11-01. This bounded source-combination inference is not a published combined IRS example or human qualification."
    testRef: "tests/engine/forms/form-7206-domestic-f-signed.test.ts::uses proven domestic F zero without clamping signed C"
  - line: "signed-domestic-f-facts"
    description: "Preserve unknown and false actual domestic farm facts"
    formula: "Never infer domestic farm income from its absence in Form2555 mapping. Missing/false confirmation, stale year, unknown or conflicting source identity/owner, missing original reference, negative or zero F/C profit, positive/unknown retirement, additional business/foreign sources, non-F plan or Marketplace composition retain a precise separate-method or source requirement. Collector source edits and upstream income edits revoke nested proof confirmations, retain entered records, and never create a missing farm. Ordinary interview cannot originate ScheduleF; this method is enabled for canonical typed/imported actual F sources."
    testRef: "tests/engine/forms/form-7206-domestic-f-signed.test.ts::requires independent actual domestic farm evidence"
