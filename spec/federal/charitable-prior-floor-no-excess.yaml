form: "Charitable Prior Floor Without Surviving Excess"
fullName: "A sole prior source in a floor-hit category with complete percentage consumption"
taxYear: 2026
irsReference: "https://uscode.house.gov/us/usc/119-136/t26/s170/"
retrievedAt: "2026-11-06"
reviewStatus: "agent-source-and-software-reviewed-human-review-pending"
notes: |
  Source-derived finite endpoint, not a matching published numerical example.
  IRC170(b)(1)(I) applies the 0.5% floor in D,C,B,E,A,G order. A prior
  contribution treated as paid in the current year is not exempt merely because
  its original receipt predates2026. IRC170(d)(1)(C) permits additional floor
  carry only when an excess carries without the floor. Final regulation
  1.170A-10(b)(2),(c)(2) distinguishes amount treated as paid from deduction
  and reduces the original available excess by treated-paid use. Current
  before prior and oldest original year first remain unchanged. Sources:
  https://www.ecfr.gov/current/title-26/section-1.170A-10 ; final2025 Pub526
  https://www.irs.gov/publications/p526 ; PL119-21 section70425.
  Admit a positive prior floor only when the hit category has no allowed current
  contribution and exactly one positive prior source, without pooled filing-unit
  ownership. That source's entire opening is treated as paid, with no expired or
  remaining portion. The complete percentage ledger must have no surviving
  current or prior excess and no NOL-origin-limit context. No entered allocation,
  treated-paid amount, current deductible amount, or new contribution year is
  accepted. No original clock is restarted. Other original expiry is preserved.
  Competing current/prior contributions in the hit category, multiple positive
  prior vintages there, partial prior consumption, surviving percentage excess,
  pooled ownership and NOL-linked floor attribution retain existing rejection.
  This does not resolve which old/new vintage could retain floor where excess
  survives. Treating the prior floor as permanently exempt, or carrying it solely
  because it reduces the deduction, are contrary alternatives for this finite
  endpoint: neither follows the amended floor and conditional carry provisions.
  Itemized prior deduction is treated-paid use less the noncarryable prior floor;
  standard/explicit nonitemized prior deduction stays zero. Current170(p) remains
  separate. The2026 production and PDF gates stay closed.
