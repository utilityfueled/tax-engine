form: "Section170 2025 K1 basis-release NOL sources"
fullName: "Actual released charitable basis through current section170 and independent NOL limits"
taxYear: 2025
irsReference: "https://www.ecfr.gov/current/title-26/section-1.1366-2"
notes: |
  IRC704(d)(2)-(3), Reg1.704-1(d)(1)-(2) and the IRS partner-basis FAQ
  permit the prior basis-limited amount when later actual basis is available.
  IRC1366(d)(2),(4) and Reg1.1366-2(a)(3) preserve character and treat an
  S-corporation disallowance as incurred in succeeding entity years.
  RevRul2008-16 explicitly retains36 of charitable basis after154 is allowed;
  its stated historical effective period is not used as current-law authority.
  Current704/1366 and the regulations supply the2025 rule. No appreciation
  already taken into account is repeated, and unreleased basis is not a170(d)
  carry. Actual2025 released amounts retain their recipient/category/medium
  and enter the existing2025 percentage limits and NOL comparison. Any170
  excess first arising on release is a2025 excess, separately from the original
  payment/basis year. Original basis records and sources remain unchanged.
  This is a source handoff, not new percentage/NOL arithmetic. Form172 line26
  and Reg1.170A-10(d) still reduce a determined charitable excess by the old
  succeeding-NOL benefit. Current Form172 uses only actually selected charity
  and actual nonbusiness income. Independent regular/AMT histories and same
  original entity treatment remain required; hypothetical170 caps never alter
  basis release. Operating K1 classification, binding465, positive-benefit COD
  and multiple positive-origin attribution remain separate internal methods.
  A positive2026 prior-basis release retains the separate170(p)/floor-year
  guard for cash or automatic/itemized choice. Explicit nonitemized property
  follows k1-prior-property-nonitemized-2026.yaml and the existing source-bound
  nonitemized NOL comparison; no new priority or monetary formula is inferred.
  Missing records are not known zero and do not become current gifts.
  Sources refreshed2026-10-26. Derived NOL literals are not published examples.
