form: "Schedule 1 Return Reconciliation"
fullName: "Final additional income and adjustment lines after source worksheets"
taxYear: 2025
irsReference: "https://www.irs.gov/pub/irs-pdf/f1040s1.pdf"
retrievedAt: "2026-10-25"
notes: |
  Final 2025 Schedule1 provides canonical line identities used for historical
  review. The arithmetic source routing also applies to the draft2026 return;
  it does not qualify a 2026 filing template. Existing unsupported source
  classifications and NOL/passive worksheet limitations remain unqualified.
lines:
  - line: "10-capital-separation"
    description: "Schedule D stays on1040line7 and is excluded fromSchedule1line10"
    formula: "Line10=sum1,2a,3,4,5,6,7,9; capitalGainLoss is only a compatibility passthrough"
    testRef: "tests/engine/federal-schedule-1-source.test.ts::excludes capital gains from Schedule1 and includes housing in line25"
  - line: "9-and-10"
    description: "Final additional income includes all supported source components once"
    formula: "9=sum8a through8z;10=sum1 through7 plus9;1040line8=10, including C/F/E"
    testRef: "tests/engine/federal-schedule-1-source.test.ts::reconciles business farm rental and other sources to one1040line8"
  - line: "8v-and-8z"
    description: "Ordinary digital receipts and education distributions retain distinct routes"
    formula: "Ordinary digital asset receipts enter8v; taxable529/Coverdell earnings enter8z, not8q which is reserved forABLE"
    irsRef: "https://www.irs.gov/publications/p970"
    testRef: "tests/engine/federal-schedule-1-source.test.ts::reconciles business farm rental and other sources to one1040line8"
  - line: "24k-25-26"
    description: "Estate termination deduction is positive and reaches both adjustment totals"
    formula: "Actual finalK1Box11A enterspositive24k;25 includes24j+24k+other actual24amounts;26=sum11through23+25"
    irsRef: "https://www.irs.gov/instructions/i1041sk1"
    testRef: "tests/engine/federal-schedule-1-source.test.ts::reconciles business farm rental and other sources to one1040line8"
  - line: "5-passive"
    description: "Retained income totals use the same allowed rental result as AGI"
    formula: "Final5=preliminaryE minus163j deduction plus suspended rental losses minus actual releasedPTP losses;1040line9 must equal AGI plus adjustments"
    testRef: "tests/engine/federal-schedule-1-source.test.ts::retains suspended rental losses consistently in income and AGI"
  - line: "8a-nol"
    description: "The final actual NOL value updates one canonical Schedule1 audit"
    formula: "8a=-completedNOL;9 and10 incorporate it once;1040lines8/9/11 and retained results reconcile"
    testRef: "tests/engine/federal-schedule-1-source.test.ts::retains one final NOL line in both Schedule1 and1040"
  - line: "review-mapping"
    description: "Review fields copy unique reconciled canonical audits"
    formula: "Copy actual1through26 audits, including8v/8z/24k; require10=1040line8 and26=1040line10 and reject inconsistent values; manual unclassified24totals remain disclosed"
    testRef: "tests/pdf/schedule-1-source-mapping.test.ts::prints canonical source totals and rejects a contradictory audit"
  - line: "25-magi-coordination"
    description: "Printed housing adjustment does not alter the required MAGI addback"
    formula: "Student-loan/IRA standalone MAGI excludes the foreign housing deduction; placing it in25 preserves that source exclusion"
    irsRef: "https://www.irs.gov/publications/p970"
    testRef: "tests/engine/federal-schedule-1-source.test.ts::preserves the housing deduction addback while completing line25"
