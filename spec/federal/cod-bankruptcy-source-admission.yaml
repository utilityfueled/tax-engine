    description: "Reject a legacy bankruptcy flag without actual records"
    formula: "Public parseInput accepts syntax, but calculateFederalTax rejects bankruptcy=true without form982NolSources for codeA, codeG or absent event code, including zero/no statements. The50000 source formerly excluded silently; no chapter/court/history may be invented."
    testRef: "tests/engine/federal-cod-bankruptcy-source-admission.test.ts::requires complete original sources for every affirmative public bankruptcy claim"
  - line: "complete-successor"
    description: "Retain actual supported chapter12/13 results"
    formula: "Actual personal50000 discharge, full court/history and regular/AMT attribute sources, both chapter12 and13: taxableCOD0, reported exclusion50000, original no-loss/capital carry remains0. Removing source packet or actual case history rejects."
    testRef: "tests/engine/federal-cod-bankruptcy-source-admission.test.ts::preserves fully sourced non-estate bankruptcy results and rejects source removal"
  - line: "other-claimed-exclusions"
    description: "Apply the same real-source boundary to adjacent exclusion claims"
    formula: "Without actual source records, positive residence/farm/real-property amounts and insolvency+basis-first each formerly excluded50000 with inferred zero attributes; reject them. Nonzero negative amounts formerly increased taxableCOD to50001; reject them as unsupported claims too. Existing complete source validator still rejects unsupported special debt/election methods."
    testRef: "tests/engine/federal-cod-bankruptcy-source-admission.test.ts::requires actual sources for other claimed exclusions and basis-first elections"
  - line: "ordinary-and-low-level"
    description: "Preserve taxable full-return and low-level arithmetic contracts"
    formula: "Without a claim the actual50000 recourse discharge is taxable50000. False flags and explicit zero farm/real-property/residence amounts remain taxable. Standalone1099C arithmetic supplied true bankruptcy still excludes50000, without claiming return eligibility."
    testRef: "tests/engine/federal-cod-bankruptcy-source-admission.test.ts::keeps ordinary taxable debt and explicit low-level arithmetic unchanged"
  - line: "server-audit"
    description: "Deny source-incomplete calculation receipts"
    formula: "Server calculateVerifiedAiAudit must not create an available1040AGI0/tax0 receipt from the legacy flag-only50000 discharge."
    testRef: "tests/apps/web/cod-bankruptcy-source-admission.test.ts::rejects an incomplete bankruptcy claim before a server-verified audit exists"
  - line: "enabled-http"
    description: "Reject through the actual private calculation POST"
    formula: "Same-origin valid private envelope with complete taxpayer syntax but flag-only bankruptcy, basis-first or special nonzero exclusion claim returns400 private/no-store before provider/accounting; ordinary verified2025 W2 calculation still returns200 deterministic fallback with no model calls."
    testRef: "tests/apps/web/cod-bankruptcy-source-admission.test.ts::rejects source-incomplete bankruptcy through actual calculation POST before provider or accounting"
