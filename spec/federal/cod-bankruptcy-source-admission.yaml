form: "Canceled-debt exclusion source admission for complete federal returns"
fullName: "Require actual original records before canonical exclusion or server-verified audit"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i982"
retrievedAt: "2026-11-14"
notes: |
  This is enforcement of the existing cod-title-11-chapter-13 and
  cod-title-11-chapter-12-personal source contracts, not a new exclusion formula.
  Form982 instructions (12/2021), Definitions, require actual court jurisdiction
  and a court discharge or approved plan; PartII requires actual attributes and
  property basis. Pub908 (2025), Individuals in Chapter12 or13 and conversion,
  distinguishes the separate chapter7/11 estate from non-estate cases.
  https://www.irs.gov/publications/p908 ; IRC108(d)(2),1398(a),1399.
  An affirmative legacy codExclusion.bankruptcy flag is an exclusion claim, not
  proof of a chapter, court order, case history, owner, or zero tax attributes.
  Full-return orchestration must require the actual form982NolSources packet
  before any Schedule1 exclusion or legacy Form982 reduction. Its existing
  validator continues to require complete regular/AMT NOL and attribute sources,
  original debt statements, court facts and no chapter7/11 estate history.
  This applies to parsed public inputs and server-owned transient calculation;
  schema validity and user confirmation alone cannot establish eligibility.
  No debt or a known-zero statement does not make an affirmative unknown
  bankruptcy claim verified. With no bankruptcy claim, ordinary taxable COD
  remains unchanged. The same boundary applies to an affirmative basis-first
  election, a positive represented insolvency balance, or any nonzero claimed
  principal-residence, farm or real-property-business exclusion amount. Negative
  claimed amounts cannot manufacture negative exclusions and increase income.
  Explicit zero numeric claims and false election flags alone do not require
  invented records: they preserve ordinary taxable COD. Positive farm/residence/
  business claims retain explicit rejection by the existing source validator;
  their missing full-return eligibility method is not supplied by this guard.
  Standalone calculateForm1099C remains arithmetic on
  supplied eligibility; its lower-level tests are not full-return eligibility.
  Keep incomplete original integration fixtures as rejection evidence; complete
  qualified12/13 successors retain their original zero-COD/zero-carry outcomes.
  No final2026, estate, farming/business, filing or model-promotion gate changes.
lines:
