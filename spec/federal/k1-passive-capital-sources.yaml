form: "K1 Passive Capital Sources"
tax_year: 2025
title: "Original K-1 capital character and Form8582 PartIX allocation"
sources:
  - url: "https://www.irs.gov/instructions/i1065sk1"
    description: "2025 portfolio-income instructions and boxes8/9a distinguish portfolio capital from passive activity income; original statements remain necessary for another actual character."
  - url: "https://www.irs.gov/instructions/i8582"
    description: "2025 PartsVII andIX retain separately reportable ordinary, short-term and long-term items; PartIX lines1a/1b and columnsb-e allocate each activity's unallowed loss. Basis and465 precede469;1211 follows it."
  - url: "https://www.ecfr.gov/current/title-26/section-1.469-1T"
    description: "Paragraph(f)(2) identifies disallowed activity deductions and preserves character when a different classification changes tax liability."
  - url: "https://www.ecfr.gov/current/title-26/section-1.469-2T"
    description: "Paragraphs(c)(2),(c)(3),(d)(2),(d)(5),(d)(6) distinguish actual activity disposition, portfolio exclusions, charitable exclusions and prior basis/at-risk limitations."
  - url: "https://www.irs.gov/instructions/i1040gi"
    description: "Rounding Off: preserve cents while adding sources for one line, then round its total. PartIX's published example expressly retains217.50/652.50 character amounts. No residual-dollar character priority is supplied."
scope: >-
  Bounded continuing ordinary nonrental, non-PTP source method. PartIX consumes a validated
  activity's derived unallowed loss and actual deductions/income grouped by their
  separate tax character. It is not a user-entered allowance. Canonical and guided
  source integration require original character, exact owner/activity,
  independent prior469 capital balances and all existing basis/465/QBI histories.
  A passive K1 flag never changes a portfolio item's character. Special28percent
  amounts below are the published pure-worksheet control, not canonical admission.
  Production2026 gates remain unchanged; the 2026 control isolates this method.
lines:
  - line: "isolated-2026"
    description: "The same capital character method preserves the independently selected current charitable treatment"
    formula: "Under isolated2026 constants only, original wages100000/ordinary-40000/ST10000/LT-20000/priorST8000 retain AGI100000 and the same exact ordinary/ST/LT passive histories. Actual current cash10000 gives itemized9500 after the500 floor or nonitemized1000 when standard is selected. No passive capital amount enters170(p), and the production2026 readiness gate remains unchanged."
    testRef: "tests/engine/federal-k1-passive-capital-2026.test.ts::preserves original capital allocation and actual charitable selection under isolated2026 rules"
  - line: "browser-originals"
    description: "Production desktop and mobile flows retain actual capital statements through reload and download"
    formula: "Actual linked original ST10000/LT-20000 and independent priorST8000 remain unchanged through source confirmation, save/reload and the complete review download. The estimate remains unavailable while confirmation is unknown and after a source-reference edit. The review preserves actual ordinary/ST/LT amounts, review notices and personal-identifier redaction; no calculated allowance is collected."
    testRef: "apps/web/tests/k1-passive-capital.spec.ts::retains actual capital sources through confirmation reload and review download"
  - line: "review-physical"
    description: "Physical ScheduleE and separate capital worksheet retain their actual characters"
    formula: "Own-income original E-40000/ST10000/LT-20000 gives printed ScheduleE passive loss6667 and ScheduleD6667. Form8582 PartV loss50000/PartIII allowednet0 stays distinct from exact PartIX ordinary6666.666... and LT3333.333... deductions. The multiple-form source uses a PartIX reference, not a false ordinary-only PartVIII allowance. Exact source/carry values are printed separately and are never changed to reconcile separately rounded destination lines."
    testRef: "tests/pdf/k1-passive-capital-review.test.ts::prints ordinary and capital destinations with exact separate PartIX records"
  - line: "review-binding"
    description: "Original capital identity and all retained character results bind before template access"
    formula: "Private review context binds full originals and exact permitted redaction, final ordinary/ST/LT balances and PartIX audits. Changed equal-money classification/history reference, removed original packet, forged token, altered carry or altered PartIX audit rejects before template I/O; no original private reference or identifier is rendered."
    testRef: "tests/pdf/k1-passive-capital-review.test.ts::rejects stale source character carry and worksheet audits before template access"
  - line: "workspace-review"
    description: "Actual guided sources export through the unmocked complete review packet"
    formula: "The actual guided source state passes through validation, canonical calculation, original private preparation and redacted rendering. The packet retains exact ordinary and capital histories with one review-only notice on every page, source identifiers absent and original state unchanged. False source confirmation blocks export."
    testRef: "tests/apps/web/workspace-k1-passive-capital.test.ts::exports actual guided capital records with separate ordinary and capital amounts"
  - line: "guided-originals"
    description: "Actual linked capital statements remain reachable without calculated inputs"
    formula: "The guide retains each original signed amount, original portfolio/passive character, independent ordinary QBI history and separately copied prior ST/LT469 balances. Actual prior capital8000 is aggregated with independently known ordinary0 only for the legacy opening total. Decimal comma removal preserves exact spelling; no allowance, income assumption or nonbusiness capital assertion is added."
    testRef: "tests/apps/web/guided-k1-passive-capital.test.ts::builds linked actual capital originals and independent prior balances once"
  - line: "guided-unknown"
    description: "Unknown source character and history never become zero or portfolio"
    formula: "Unknown/false capital confirmations, omitted original or filed opening amounts, wrong original activity link and changed source references reject. Editing any original revokes nested confirmations while retaining the exact original records. The retained historical browser original independently lacks prior ordinaryQBI facts and assigns its ordinary gift to465; the original activity contradiction rejects first. A separate otherwise-complete current original with only the priorQBI packet removed still rejects that missing history. Neither absence is filled with zero."
    testRef: "tests/apps/web/guided-k1-passive-capital.test.ts::preserves unknown false and original edit invalidation"
  - line: "guided-controls"
    description: "Capital source controls collect original facts only"
    formula: "Adding an attachment or prior capital classification creates blank records. Explicit zero, false and unknown stay distinct; negative signed original amounts and exact decimals remain strings. Add/edit/remove and known-empty history remain available without fabricated original identity or calculation."
    testRef: "tests/apps/web/k1-passive-capital-interactions.test.tsx::collects original capital character and separate histories without defaults"
  - line: "canonical-complete-source"
    description: "Every passive opening and capital source must retain its actual method"
    formula: "An unmatched positive or zero legacy prior passive record cannot be silently dropped. A source-confirmed same-passive-business capital item cannot also claim the different ordinary-only Form461 capital-is-nonbusiness method. Separate actual source methods remain necessary; no entered classification overrides the original capital record."
    testRef: "tests/engine/federal-k1-passive-capital.test.ts::rejects unmatched prior sources"
  - line: "canonical-business-source"
    description: "Actual passive business capital cannot claim an ordinary-only nonbusiness method"
    formula: "Reject the ordinary-only Form461 capital-is-nonbusiness assertion when original capital records identify this same passive business. Do not invent a replacement Form461 classification."
    testRef: "tests/engine/federal-k1-passive-capital.test.ts::rejects contradictory business classification"
  - line: "original-precision"
    description: "Internal ordinary nonrental source calculation preserves actual cents"
    formula: "Source-bound ordinary nonrental PartI currentloss4000.20 and separateincome1000.10 retain1000.10 allowance/3000.10 suspension. The existing default reported-dollar path remains1000/3000. Exact source mode rejects rentals, PTPs and an unscoped request; income and losses on different reporting forms can coexist. There is no taxpayer-entered precision or allowance override."
    testRef: "tests/engine/forms/form-8582-capital-source-precision.test.ts::retains exact ordinary nonrental source values without changing the default reporting path"
  - line: "part-v-net-source"
    description: "PartV retains separate reporting-form nets while PartIX keeps separate capital terms"
    formula: "Derived from PartV's PartIV column instructions: ScheduleE-40000 and ScheduleD(ST10000-LT20000)=-10000 give PartV currentloss50000; with no other income its allowednetloss0/unallowed50000. PartIX still allows ordinary6666.666.../LT3333.333..., retaining ST10000. A distinct E+10000/D(ST-40000+LT20000)=-20000 case retains PartV income10000/loss20000 because they are on different forms. It allows ST30000, retains LT20000, and reports Dnet-10000/current1211deduction3000, so wages100000 plus E10000 less3000 gives AGI107000. This is a derived source interpretation, not a published matching ST/LT example. Exact closing character balances are never altered to absorb printed-dollar differences."
    testRef: "tests/engine/federal-k1-passive-capital.test.ts::retains current activity net and exact character balances before destination rounding"
  - line: "part-ix-published"
    description: "Published PartIX capital character example"
    formula: "ActivityI prior28percent loss1000 and current non28percent loss3000 with derived unallowed3130: ratios.25/.75; unallowed782.50/2347.50; allowed217.50/652.50. Their sum870 agrees with the activity allowance."
    testRef: "tests/engine/forms/form-8582-character-allocation.test.ts::reproduces the published separate capital character example"
  - line: "part-ix-separate-parts"
    description: "Short-term and long-term amounts keep separately reportable character"
    formula: "Ordinary deduction40000, short-term income10000 and long-term deduction20000 with unallowed30000: ordinary and long-term weights40000/60000 and20000/60000 yield suspended20000/10000 and allowed20000/10000. Retained short-term income10000 is not subtracted from the long-term loss group; ScheduleD receives its separately allowed amounts."
    testRef: "tests/engine/forms/form-8582-character-allocation.test.ts::keeps separate short term long term and ordinary groups"
  - line: "part-ix-same-part-income"
    description: "Same-part income reduces the allocation weight before other deductions"
    formula: "Ordinary deduction20000 plus prior short-term loss10000 and current short-term income6000 with unallowed12000: weights20000/24000 and4000/24000 produce suspended10000/2000, allowed10000/8000. Original short-term income6000 remains reportable separately."
    testRef: "tests/engine/forms/form-8582-character-allocation.test.ts::offsets income only in its own reporting group before allocating the unallowed loss"
  - line: "part-ix-full-zero"
    description: "Zero and full disallowance conserve actual deductions and income"
    formula: "Zero unallowed loss retains every deduction and original income. With ordinary4000/short-term1000 and full5000 disallowance, no deduction is allowed. A positive-income group has zero allocation weight and cannot absorb another group's suspension."
    testRef: "tests/engine/forms/form-8582-character-allocation.test.ts::conserves zero full and zero weight cases without changing retained income"
  - line: "part-ix-original-order"
    description: "Source order has no allocation priority"
    formula: "Reordering distinct reporting groups preserves every keyed allowance, suspension, original amount and total. Exact finite source cents are retained before downstream form rounding."
    testRef: "tests/engine/forms/form-8582-character-allocation.test.ts::preserves exact cents and keyed results when source groups are reordered"
  - line: "part-ix-invalid"
    description: "Incomplete or contradictory calculated worksheet inputs cannot authorize output"
    formula: "Reject missing identity/group, duplicate character, nonfinite or negative source amounts, unsupported character, current income and current loss simultaneously within one net reporting group, and an unallowed amount above the total net-loss allocation weight. No unknown value is replaced with zero."
    testRef: "tests/engine/forms/form-8582-character-allocation.test.ts::rejects missing duplicate contradictory and overallocated worksheet sources"
  - line: "original-character"
    description: "Original capital classification is independent from the passive K1 flag"
    formula: "Bind actual return year, indexed original owner/entity, original signed short/long term amounts and every prior465 capital source ID. Preserve each original portfolio or separately identified same-passive-activity character. Known zero original boxes need no invented character; a nonzero original requires actual character. No calculated current allowance is collected."
    testRef: "tests/engine/forms/k1-capital-character-sources.test.ts::validates actual portfolio and passive classification without deriving it from the activity flag"
  - line: "original-capital-history"
    description: "Prior469 capital balances remain distinct from prior465 and ordinary QBI history"
    formula: "Require actual preceding-year same-owner/activity capital worksheet with independently known short-term and long-term balances, including zero. Every prior465 capital record retains its own source ID and character; no current classification replaces it. The supplied prior469 amounts are filed opening balances, never a current calculated allowance."
    testRef: "tests/engine/forms/k1-capital-character-sources.test.ts::preserves original prior risk character and known prior passive capital balances"
  - line: "original-character-boundaries"
    description: "Unknown contradictory or stale original character cannot pass as portfolio"
    formula: "Missing/false confirmation, omitted zero balance, changed original amount or owner/entity/year, absent prior capital record, duplicate source and unsupported activity/character all reject. Actual original classification remains unchanged when input records are reordered."
    testRef: "tests/engine/forms/k1-capital-character-sources.test.ts::rejects unknown false missing conflicting and stale original classification"
  - line: "canonical-capital-character"
    description: "Capital and ordinary amounts reach their proper returns once after passive allocation"
    formula: "Actual wages100000, activity ordinaryloss40000/STgain10000/LTloss20000, charity10000, sufficient basis/risk, and separate passive ordinaryincome20000: Form8582 unallowed30000; PartIX ordinaryallowed20000/LTallowed10000; ST10000 retained. ScheduleD net0 and ScheduleE net0 give AGI100000, charity10000. Closing passive ordinary20000 and LT10000 remain distinct; QBI loss20000 excludes capital. Same original capital amounts classified portfolio give Dnet-10000/current1211deduction3000, ordinaryallowed20000, AGI97000, ordinarypassivecarry20000 and no capital469carry."
    testRef: "tests/engine/federal-k1-passive-capital.test.ts::routes actual passive capital through PartIX once and preserves the portfolio distinction"
  - line: "canonical-own-income"
    description: "Own short-term income releases ratable ordinary and long-term deductions"
    formula: "Without the separate20000 ordinary income, source activity ordinary40000/LT20000 deduction and ST10000 income has50000 unallowed. PartIX leaves ordinary6666.6666666666667 and LT3333.3333333333333 allowed, ST10000 retained. ReportedD6667 and ordinaryE-6667 give AGI100000. No capital loss is silently transformed into an ordinary deduction or QBI."
    testRef: "tests/engine/federal-k1-passive-capital.test.ts::uses actual own capital income without combining the short and long term reporting groups"
  - line: "canonical-prior-capital"
    description: "Actual prior passive capital uses same-part income without becoming ordinary history"
    formula: "Add actual priorST8000 to the own-income case and retain actual ordinaryQBI history0. Same-part STincome10000 fully releases that8000. Remaining2000 income allows ordinary1333.3333333333333 and LT666.6666666666667; reportedD1333 and E-1333 give AGI100000. PriorSTclosing0; ordinary andLT closing retain their separate amounts; oldST does not enterQBI."
    testRef: "tests/engine/federal-k1-passive-capital.test.ts::retains independent prior passive capital balances outside ordinary QBI history"
  - line: "canonical-downstream"
    description: "Capital remains outside ordinary QBI, SE and ScheduleE investment transfers"
    formula: "Own-income case retains exact current ordinary allowance6666.666... and ordinary469 suspension33333.333...; capital suspension16666.666... is separate. Existing QBI reporting rounds its own destination, without altering actual passive character history. Actual entire current Box14 ordinaryloss40000 transfers only the exact ordinary allowance. At wages250000 and other passive ordinaryincome60000, all40000 ordinary and20000 LT deductions are allowed: ScheduleE20000, ScheduleD-10000/current1211deduction3000; Form8960line5a uses the reported1040line7a-3000, producing net17000/tax646. EIC capital and ordinary passive components use their corresponding final characters once."
    testRef: "tests/engine/federal-k1-passive-capital.test.ts::keeps capital outside ordinary QBI self employment and investment transfers"
  - line: "canonical-prior-risk"
    description: "Prior465 capital enters its actual capital reporting group after risk release"
    formula: "Original current ordinary40000/LT20000 deductions, STincome10000, actual prior465 LT10000 and other passive ordinaryincome20000: full risk release gives ordinary40000/LT30000 PartIX deductions;40000 unallowed allocates4/7 and3/7. Exact closingordinary22857.142857.../LT17142.857142..., allowedordinary17142.857142.../LT12857.142857.... Independently reported D-2857/E2857 give AGI100000. Prior465 source remaining0 is not released again; no capital reaches ordinaryQBI."
    testRef: "tests/engine/federal-k1-passive-capital.test.ts::uses each original prior risk capital record once before passive allocation"
  - line: "canonical-basis-risk"
    description: "Basis and risk precede passive character allocation"
    formula: "Original ordinary40000/LT20000/charity10000 and STgain10000: openingbasis25000 plusgain10000 allows half each deduction, suspending20000 ordinary/10000LT/5000charity atbasis. Complete6198 has ordinary-20000, disposition0 and otherdeductions0 because the ordinary5000gift stays separate. Fullrisk and passiveincome20000 allow postbasis ordinary/LT amounts, D0/E0/AGI100000, charity5000. With fullbasis and actualrisk25000, activitydeductions60000 lessSTincome10000 gives50000loss/25000disallowed; risk ordinary50000/3 andLT25000/3 remain. Later469 leavesordinary10000/3 andLT5000/3 suspended; allowedordinary20000/LT10000 givesD0/E0/AGI100000. All10000ordinarygift remains outside465/469 with zero new risk suspension. Exact25-place assertions use independently derived existing20-significant-digit ROUND_HALF_UP stage literals:465ordinary16666.666666666666667/LT8333.3333333333333333;469ordinary3333.3333333333333334/LT1666.6666666666666667. The ordinary469 multiplication tie rounds116666666.666666666665 to116666666.66666666667 before division by35000. No fraction tolerance or runtime precision change."
    testRef: "tests/engine/federal-k1-passive-capital.test.ts::preserves distinct basis risk and passive character suspensions"
