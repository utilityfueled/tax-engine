form: "Schedule R"
fullName: "Credit for the Elderly or the Disabled"
taxYear: 2025
irsReference: "https://www.irs.gov/pub/irs-prior/i1040sr--2025.pdf"
statute: "IRC §22"

notes: |
  Schedule R computes a nonrefundable credit for taxpayers who are:
  - Age 65 or older, OR
  - Under 65, retired on permanent and total disability, and received taxable disability income.

  The credit flows to Schedule 3 Line 6d → Form 1040 Line 20.

  MFS filers must have lived apart from their spouse for the entire tax year.
  The base amounts and AGI thresholds are set by statute (IRC §22) and are NOT
  inflation-adjusted — they have been unchanged since 1984.

  The credit is 15% of the initial amount after subtracting nontaxable Social
  Security/pension benefits and half the excess AGI over filing-status thresholds.

lines:
  # ── Part I: Filing Status and Eligibility ─────────────────
  - line: "Part I"
    description: "Filing status eligibility determination"
    formula: "Determine qualifying box (1-9) based on filing status, age (65+), and disability status"
    irsRef: "Schedule R Instructions, Part I"
    edgeCases:
      - "MFS filers must have lived apart from spouse for the entire tax year"
      - "Under-65 filers must have retired on permanent and total disability"
      - "Under-65 disabled filers must have received taxable disability income"
      - "MFJ: both spouses can independently qualify via age or disability"
    testRef: "tests/engine/forms/schedule-r.test.ts::Part I — eligibility"

  # ── Part III: Figure Your Credit ──────────────────────────
  - line: "10"
    description: "Initial amount based on filing status box"
    formula: |
      Box 1 (single/HoH/QSS, 65+): $5,000
      Box 2 (single/HoH/QSS, under 65, disabled): $5,000
      Box 3 (MFJ, both 65+): $7,500
      Box 4 (MFJ, both under 65, one disabled): $5,000
      Box 5 (MFJ, both under 65, both disabled): $7,500
      Box 7 (MFJ, one 65+, other under 65 and not disabled): $5,000
      Box 6 (MFJ, one 65+, other under 65 and disabled): $7,500
      Box 8 (MFS, 65+): $3,750
      Box 9 (MFS, under 65, disabled): $3,750
    irsRef: "Schedule R Instructions, Line 10; IRC §22(c)(1)"
    notes: "One qualifying person = $5,000 ($3,750 MFS). Both qualifying = $7,500."
    testRef: "tests/engine/forms/schedule-r.test.ts::Line 10 — initial amount"

  - line: "11"
    description: "Taxable disability income (for under-65 disabled filers)"
    formula: "Boxes 2/4/9: actual qualifying disability income; Box 5: sum both actual disability incomes; Box 6: $5,000 plus actual younger disabled spouse income"
    irsRef: "Schedule R Instructions, Line 11; IRC §22(c)(2)(B)(iii)"
    edgeCases:
      - "Only applies if Box 2, 4, 5, 6, or 9 is checked (disability-based eligibility)"
      - "If 65+, disability income is not a limiting factor"
      - "MFJ Box 5: sum both actual disability incomes; Box 6: $5,000 plus actual under-65 disabled spouse income"
    testRef: "tests/engine/forms/schedule-r.test.ts::Line 11-12 — disability income cap"

  - line: "12"
    description: "Adjusted initial amount"
    formula: |
      If Box 2, 4, 5, 6, or 9: min(Line 10, Line 11)
      Otherwise (Box 1, 3, 7, 8): Line 10
    irsRef: "Schedule R Instructions, Line 12; IRC §22(c)(2)(B)"
    notes: "Disability income caps the credit base for under-65 disabled filers"
    testRef: "tests/engine/forms/schedule-r.test.ts::Line 11-12 — disability income cap"

  - line: "13a"
    description: "Nontaxable Social Security benefits"
    formula: "Form 1040 Line 6a minus Line 6b (gross SS benefits minus taxable SS benefits)"
    irsRef: "Schedule R Instructions, Line 13a; IRC §22(c)(3)(A)"
    testRef: "tests/engine/forms/schedule-r.test.ts::Lines 13-14 — nontaxable benefits reduction"

  - line: "13b"
    description: "Nontaxable pensions, annuities, or disability income"
    formula: "Nontaxable portion of pensions/annuities/disability not included in income"
    irsRef: "Schedule R Instructions, Line 13b; IRC §22(c)(3)(A)"
    notes: "Includes tax-exempt pensions, VA disability, etc."
    testRef: "tests/engine/forms/schedule-r.test.ts::Lines 13-14 — nontaxable benefits reduction"

  - line: "13c"
    description: "Total nontaxable benefits"
    formula: "Line 13a + Line 13b"
    irsRef: "Schedule R Instructions, Line 13c"
    testRef: "tests/engine/forms/schedule-r.test.ts::Lines 13-14 — nontaxable benefits reduction"

  - line: "14"
    description: "Adjusted gross income"
    formula: "Actual Form 1040 line 11a (2025) or 11b (2026)"
    irsRef: "Final 2025 and 2026 Schedule R, line 14"
    testRef: "tests/engine/forms/schedule-r-published-examples.test.ts::preserves printed audit identities and actual worksheet credit limit"

  - line: "15"
    description: "Statutory AGI threshold"
    formula: "Single/HoH/QSS 7500; MFJ 10000; MFS 5000"
    irsRef: "Schedule R line 15"
    testRef: "tests/engine/forms/schedule-r-published-examples.test.ts::preserves printed audit identities and actual worksheet credit limit"

  - line: "16"
    description: "Excess AGI"
    formula: "max(0, line 14 minus line 15)"
    irsRef: "Schedule R line 16"
    testRef: "tests/engine/forms/schedule-r-published-examples.test.ts::preserves printed audit identities and actual worksheet credit limit"

  - line: "17"
    description: "Half excess AGI"
    formula: "roundDollar(line 16 times 0.5)"
    irsRef: "Schedule R line 17"
    testRef: "tests/engine/forms/schedule-r-published-examples.test.ts::preserves printed audit identities and actual worksheet credit limit"

  - line: "18"
    description: "Total reduction"
    formula: "line 13c plus line 17"
    irsRef: "Schedule R line 18"
    testRef: "tests/engine/forms/schedule-r-published-examples.test.ts::preserves printed audit identities and actual worksheet credit limit"

  - line: "19"
    description: "Credit base"
    formula: "max(0, line 12 minus line 18)"
    irsRef: "Schedule R line 19"
    testRef: "tests/engine/forms/schedule-r.test.ts::Line 20 — credit calculation"

  - line: "20"
    description: "Tentative credit"
    formula: "Line 19 × 0.15"
    irsRef: "Schedule R Instructions, Line 20; IRC §22(a)"
    notes: "The 15% rate is set by statute"
    testRef: "tests/engine/forms/schedule-r.test.ts::Line 20 — credit calculation"

  - line: "21"
    description: "Actual Credit Limit Worksheet"
    formula: "max(0, actual Form1040 line18 minus actual Schedule3 lines1,2,6l)"
    irsRef: "2025 and 2026 Schedule R instructions, Line21 Credit Limit Worksheet"
    notes: "Optional standalone worksheet context must contain all four actual components. Missing context stays unknown, never defaults to zero or tentative credit. Federal supplies its actual calculated components; no Form8978/line6l return input is implemented. PDF rejects missing/stale worksheet before I/O."
    testRef: "tests/engine/forms/schedule-r-published-examples.test.ts::preserves printed audit identities and actual worksheet credit limit"

  - line: "22"
    description: "Allowed nonrefundable credit"
    formula: "min(line20, line21), only when actual worksheet context exists"
    irsRef: "Schedule R line22"
    testRef: "tests/engine/forms/schedule-r-published-examples.test.ts::published Jesse examples preserve year-specific tentative and allowed credit (%j)"

  - line: "published-mixed-age"
    description: "Published mixed-age disability example, both final years"
    formula: "Age63 disabled4000 plus age67 spouse: box6, line10=7500, line11=5000+4000=9000, line12=7500"
    irsRef: "2025 archived instructions and current 2026 instructions, Initial Amounts Example1"
    notes: "Does not qualify physician statement, citizenship, eligibility source facts, full2026 return or filing. Existing year/export gates remain closed. Physical2026 exercise is isolated only."
    testRef: "tests/engine/forms/schedule-r-published-examples.test.ts::published mixed-age example uses box6 and the full uncapped line11 (%j)"

  # ── Edge Cases ──────────────────────────────────────────────
  - line: "phase-out"
    description: "Credit phases out via AGI reduction and nontaxable benefits"
    formula: "Credit reaches zero when nontaxable benefits + 0.5 × excess AGI >= initial amount"
    irsRef: "IRC §22(c)(3), §22(d)"
    edgeCases:
      - "Single filer, 65+, AGI $17,500, no SS: credit = 15% × max(0, $5,000 - 0.5 × ($17,500 - $7,500)) = 15% × $0 = $0"
      - "Single filer, 65+, AGI $7,500 or below: full credit $750 (before nontaxable SS reduction)"
      - "MFJ, both 65+, AGI $25,000, no SS: credit = 15% × max(0, $7,500 - 0.5 × ($25,000 - $10,000)) = 15% × $0 = $0"
      - "MFS filer who lived with spouse: ineligible"
    testRef: "tests/engine/forms/schedule-r.test.ts::Single filer, 65+, AGI $17,500 phases out completely"

  - line: "disability-cap"
    description: "Under-65 disabled filers capped by disability income"
    formula: "If disability income < initial amount, credit base is reduced to disability income"
    irsRef: "IRC §22(c)(2)(B)(iii)"
    edgeCases:
      - "Disability income of $3,000 caps base to $3,000 even though initial amount is $5,000"
      - "Disability income of $0 means no credit even if otherwise eligible"
    testRef: "tests/engine/forms/schedule-r.test.ts::Disabled filer with disability income less than initial amount is capped"

  - line: "physical-source-binding"
    description: "Actual disability worksheet and current original Schedule R facts before PDF I/O"
    formula: "2025 fields11/21/22 use actual uncapped11 and source-bound worksheet21/allowed22; reject missing/stale core or worksheet"
    irsRef: "Final2025 Schedule R lines11,21,22"
    testRef: "tests/pdf/fill-schedule-r.test.ts::prints actual uncapped disability line11 and actual zero tax limit"

  - line: "canonical-published-credit-limit"
    description: "Actual2025 Jesse return versus published worksheet"
    formula: "Actual disability15900 + interest100 and nontaxSS700 => AGI16000; taxable250; tax-table26; R tentative8, limit26, allowed8"
    irsRef: "Archived2025 Schedule R instructions, Jesse Example1"
    testRef: "tests/pdf/fill-schedule-r.test.ts::prints the actual canonical published2025 Jesse credit limit and allowed credit"

  - line: "actual-source-validation"
    description: "Validate actual monetary originals before eligibility or arithmetic"
    formula: "Actual disability income and nontaxable pension/Social Security benefits must be finite and nonnegative; actual AGI must be finite and may be negative. Optional absent disability amounts remain zero."
    irsRef: "Schedule R lines11,13a,13b,14; final2025 and2026 instructions"
    testRef: "tests/engine/forms/schedule-r-published-examples.test.ts::rejects invalid actual benefit and disability sources"

  - line: "export-source-consistency"
    description: "Reject stale eligibility and every rendered monetary field before template I/O"
    formula: "Replay current original R facts with current federal AGI, Social Security and unique line18 worksheet; require matching eligibility, all returned amounts and audit lines. Apply at full packet entry even when saved R is absent, ineligible or zero-credit. Consistent ineligible sources remain blank-compatible."
    irsRef: "Final2025 Schedule R PartI and lines10-22"
    testRef: "tests/pdf/fill-schedule-r.test.ts::rejects changed eligibility and rendered amounts before any export I/O"

  - line: "no-claim-credit-signal"
    description: "No observable Schedule3 credit without an eligible actual R claim"
    formula: "When R originals are absent or ineligible, any provided Schedule3 line6d must be actual finite zero; reject a nonzero saved credit before standalone or full packet I/O. An absent Schedule3 is not invented."
    irsRef: "Schedule R PartI and line22; Schedule3 line6d"
    testRef: "tests/pdf/fill-schedule-r.test.ts::rejects a nonzero saved credit without an eligible original claim"

  - line: "required-printed-zero"
    description: "Retain explicit printed zero required on lines13c and16"
    formula: "No nontaxable benefits means actual line13c=0 printed as0; nonpositive AGI excess means actual line16=0 printed as0. Individual zero13a/13b may remain blank. Preserve saved/reopened field values."
    irsRef: "Final2025 Schedule R printed lines13c and16"
    testRef: "tests/pdf/fill-schedule-r.test.ts::prints required zero totals on lines13c and16 after reopening"
