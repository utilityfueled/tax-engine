form: "Federal rule packs"
fullName: "Version and qualification boundary for federal tax rules"
taxYear: 2026
irsReference: "https://www.irs.gov/irb/2025-45_IRB"
reviewStatus: "independent-review-pending"
retrievedAt: "2026-10-24"
lines:
  - line: "year-selection"
    description: "Select only an explicitly implemented rule pack"
    formula: "Use the exact input tax year. Reject unknown years and known but incomplete packs before calculating. Never alias 2026 to 2025."
    irsRef: "Rev. Proc. 2025-32, section 4, 2026 adjusted items"
    testRef: "tests/models/rule-packs.test.ts::rejects incomplete 2026 and unknown years before calculating"
  - line: "immutability"
    description: "Preserve historical calculations"
    formula: "Freeze each versioned pack and its constants, including nested Decimal coefficients. Changing one year must not change another."
    irsRef: "Rev. Proc. 2025-32, sections 3 and 4 distinguish 2025 modifications from 2026 adjusted items"
    testRef: "tests/models/rule-packs.test.ts::protects historical constants against nested mutations"
  - line: "filing-qualification"
    description: "Calculation availability does not qualify a filing artifact"
    formula: "Filing exports require independently reviewed scenarios and final, year-matching forms. No current pack has completed this qualification."
    irsRef: "Form 1040 instructions for the applicable tax year"
    testRef: "tests/models/rule-packs.test.ts::records sources and unfinished review without claiming filing readiness"
  - line: "annual-payroll-source"
    description: "Bind Form 4137 evidence to the published form year"
    formula: "Keep the archived 2025 source in both packs for the established computation. Record the separate archived 2026 template and its printed Schedule 2 line 16a destination in the incomplete 2026 pack. Publishing the template does not qualify the annual calculation or export."
    irsRef: "https://www.irs.gov/pub/irs-prior/f4137--2026.pdf"
    testRef: "tests/models/rule-packs.test.ts::pins historic Form 4137 evidence and records the annual review template separately"
  - line: "annual-form-2210-source"
    description: "Version the 2026 estimated-tax rate publication"
    formula: "Record the January 1 through April 15, 2027 rate authority in the revised 2026 draft rule pack. The 2025 pack retains its separate authorities. Keep 2026 eligibility for calculation and filing under the existing readiness gates."
    irsRef: "Rev. Rul. 2026-25 and IRC6621(b)(2)(B)"
    testRef: "tests/models/rule-packs.test.ts::records the new Form 2210 rate for 2026 without qualifying the annual return"
