    irsRef: "i8962 Exception 2 and line A"
    testRef: "tests/pdf/form-8962-separate-return.test.ts::leaves line A clear for Exception 1"
  - line: "matching-sources"
    description: "Accept the matching spouse and a blank reported benchmark"
