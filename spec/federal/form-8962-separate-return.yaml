    irsRef: "i8962 Allocation Situation 2"
    testRef: "tests/engine/forms/form-8962-separate-return.test.ts::allocates a policy with no advance credit"
  - line: "required-sources"
    description: "Require the spouse, the year-end marriage and the own-family benchmark"
