    irsRef: "i8962 applicable SLCSP premium; no corrected Form 1095-A is required"
    testRef: "tests/engine/forms/form-8962-separate-return.test.ts::needs a source for an own benchmark above the reported figure"
  - line: "audit"
    description: "Explain each allocated amount in the review record"
