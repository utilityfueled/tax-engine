form: "Form 8606 final 2026 physical candidate"
fullName: "Final 2026 Form 8606 physical field source contract"
taxYear: 2026
reference: "https://www.irs.gov/pub/irs-pdf/f8606.pdf"
revision: "Created 4/21/26, IRS final index posted 11/10/2026"
retrievedAt: "2026-11-13T02:27:21Z"
notes: |
  Existing Form 8606 line calculations are specified in form-8606.yaml.
  The English instructions endpoint still served 2025. The 2026 instructions
  were a draft. The ordinary source projection is an internal candidate.
  Final 2026 instructions, special methods, account exclusions and the
  parent-return transfer remain outside its scope.
lines:
  - line: "revision"
    description: "Pin the official final annual PDF"
    formula: "Require SHA-256 eeb2c5a11da6903e30c468572da0242c28f19ee135b9853562d7ce9fc037cb56, 92889 bytes, two pages, 2026 title and printed Created 4/21/26."
    testRef: "tests/pdf/form-8606-2026-candidate.test.ts::pins the exact final annual source"
  - line: "physical-locations"
    description: "Match original widgets to the printed annual cells"
    formula: "Require all 47 unique widgets, including ten page-one header cells, split ratio fields for line 10, and the page-two preparer checkbox and cells. The taxpayer signature/date and preparer signature/date areas have no interactive fields. Verify exact full names, pages, types, rectangles and the native checkbox state."
    testRef: "tests/pdf/form-8606-2026-candidate.test.ts::maps every leaf to its exact annual physical location"
  - line: "annual-printed-references"
    description: "Record printed dates, basis ratio format and transfer destinations"
    formula: >-
      Lines 1 and 4 reference the January 1 through April 15, 2027 contribution
      interval. Line 10 prints a ratio to at least three decimal places, capped
      at 1.000. Line 15b refers to 2026 Form 8915-F line 18 and line 25b to
      line 19. Lines 15c, 18 and 25c refer to Form 1040 line 4b.
    testRef: "tests/pdf/form-8606-2026-candidate.test.ts::records the printed dates and transfer destinations"
  - line: "saved-diagnostics"
    description: "Save and reopen fictional physical probes"
    formula: "Require exact saved values and appearances for the calculation cells, both parts of line 10, a fictional owner label and redacted identifier. Address and standalone filing/preparer controls remain blank. Every page has the review notice."
    testRef: "tests/pdf/form-8606-2026-candidate.test.ts::retains diagnostic fields and blank standalone controls after save"
  - line: "1–15c ordinary distributions"
    description: "Project one owner's actual ordinary traditional IRA basis and distributions"
    formula: >-
      Require confirmed 2026 owner, all traditional, SEP and SIMPLE account
      values, matching current original code 7 IRA 1099-R statements and a
      positive basis from the most recent earlier Form 8606 line 14. Require
      an explicit zero prior repayment worksheet adjustment and no current
      contributions, conversions, repayments, account exclusions, inherited
      basis or other special methods. Require a positive rounded distribution.
      Compute each owner separately using the existing source reconciliation
      and the fresh Form 8606 calculation. Lines 1, 4, 8, 11 and 15b are zero.
      Line 2 is prior basis, line 3 its sum with line 1, and line 5 is line 3
      minus line 4. Lines 6 and 7 use the separately aggregated account value
      and distributions. Line 9 is the sum of lines 6 through 8. Split the
      three-place capped ratio from line 10 across its two widgets. Apply it
      to line 7 on line 12. Line 13 equals line 12, line 14 is line 3 minus
      line 13, and lines 15a and 15c equal line 7 minus line 12. Refuse a
      ratio whose printed amount would use more basis than exists. Leave
      Part II, Part III, identity and preparer fields blank. Preserve separate
      spouse amounts and never write source references or account identifiers.
      Remove the official blank's obsolete Reader signature before saving the
      marked synthetic specimen.
    testRef: "tests/pdf/form-8606-2026-candidate.test.ts::projects separate owners from the confirmed ordinary IRA originals"
  - line: "closed-exports"
    description: "Keep the diagnostic source outside the public and filing registries"
    formula: "Reject the final 2026 source in the historical Form 8606 template slot and leave annual review and filing blocked."
    testRef: "tests/pdf/form-8606-2026-candidate.test.ts::keeps every export gate closed"
