    description: "Require actual full original tests, named paired upstream allocator regression and strict shared ABI evidence"
    formula: "Completed script exit0; both full suites no unexpected results; baseline named FAIL/driver1 plus exact mcheck tail-corruption diagnostic and actual allocator command; candidate named PASS/driver0 and actual allocator command; all ABI-provider logs plus zero status. Six consumers/runtime/scan/release remain unexecuted."
