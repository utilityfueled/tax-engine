form: "Form 461"
fullName: "Limitation on Business Losses"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i461"
retrievedAt: "2026-10-25"
statute: "IRC461(l); IRC164(f)(2); RevProc2025-32 section4.31"
notes: "Final2025 form identities and current-law2026 indexed calculation; OBBBA makes limitation permanent. Employee services excluded. At-risk then passive then461. Final2026 filing qualification and independent review remain pending. Legacy summary field names remain compatibility aliases, never printed line identities."
lines:
  - line: "1"
    description: "Reserved; employee wages excluded"
    formula: "Leave blank. IRC461(l)(3)(A) excludes employee-service income and deductions."
    testRef: "tests/engine/forms/form-461-sources.test.ts::excludes employee wages and preserves Schedule1 source conservation"
  - line: "2"
    description: "Business income or loss"
    formula: "Actual Schedule1line3 after source limitations."
    testRef: "tests/engine/forms/form-461-sources.test.ts::emits the official sixteen-line arithmetic"
  - line: "3"
    description: "Capital gain or loss"
    formula: "Actual Form1040line7a. Capital losses are removed on11; capital gains beyond min(total capital gain net income,business capital gain net income) are removed on10."
    testRef: "tests/engine/forms/form-461-sources.test.ts::limits business capital gains and removes all capital losses"
  - line: "4"
    description: "Other gains or losses"
    formula: "Actual Schedule1line4."
    testRef: "tests/engine/forms/form-461-sources.test.ts::emits the official sixteen-line arithmetic"
  - line: "5"
    description: "Supplemental income or loss"
    formula: "Actual Schedule1line5 after at-risk and passive limitations; nonbusiness portions removed in PartII. Passive status alone does not exclude an allowed business loss."
    testRef: "tests/engine/forms/form-461-sources.test.ts::emits the official sixteen-line arithmetic"
  - line: "6"
    description: "Farm income or loss"
    formula: "Actual Schedule1line6."
    testRef: "tests/engine/forms/form-461-sources.test.ts::emits the official sixteen-line arithmetic"
  - line: "7"
    description: "Reserved"
    formula: "Leave blank."
    testRef: "tests/engine/forms/form-461-sources.test.ts::emits the official sixteen-line arithmetic"
  - line: "8"
    description: "Other business income and deductions"
    formula: "Other actual business income/gain/loss on return minus separately deductible actual business adjustments not included on2–6. Exclude NOL,199A and employee deductions."
    testRef: "tests/engine/forms/form-461-sources.test.ts::emits the official sixteen-line arithmetic"
  - line: "9"
    description: "Combined income or loss"
    formula: "Sum2,3,4,5,6,8, signed."
    testRef: "tests/engine/forms/form-461-sources.test.ts::emits the official sixteen-line arithmetic"
  - line: "10"
    description: "Nonbusiness income and gain"
    formula: "Actual noncapital nonbusiness income included in PartI plus disallowed nonbusiness capital gain."
    testRef: "tests/engine/forms/form-461-sources.test.ts::limits business capital gains and removes all capital losses"
  - line: "11"
    description: "Nonbusiness losses and deductions"
    formula: "Actual noncapital nonbusiness losses included in PartI plus all capital losses, entered positive."
    testRef: "tests/engine/forms/form-461-sources.test.ts::limits business capital gains and removes all capital losses"
  - line: "12"
    description: "Nonbusiness net"
    formula: "10 minus11, signed."
    testRef: "tests/engine/forms/form-461-sources.test.ts::emits the official sixteen-line arithmetic"
  - line: "13"
    description: "Adjustment"
    formula: "Negative of12."
    testRef: "tests/engine/forms/form-461-sources.test.ts::emits the official sixteen-line arithmetic"
  - line: "14"
    description: "Business net"
    formula: "9 plus13."
    testRef: "tests/engine/forms/form-461-sources.test.ts::emits the official sixteen-line arithmetic"
  - line: "15"
    description: "Indexed threshold"
    formula: "2025:313000 or626000MFJ.2026:256000 or512000MFJ per RevProc2025-32 section4.31."
    testRef: "tests/engine/forms/form-461-sources.test.ts::applies year thresholds and the separate return-attachment boundary"
  - line: "16"
    description: "Signed result and positive addback"
    formula: "14 plus15, signed. Only a negative result produces positive Schedule1line8p and current EBL NOL. Employee wages remain on1040line1z and cannot absorb this loss."
    testRef: "tests/engine/forms/form-461-sources.test.ts::excludes employee wages and preserves Schedule1 source conservation"
  - line: "source"
    description: "Actual classification"
    formula: "Current actual source worksheets preserve year, source confirmation, completed prior at-risk/passive limitations, actual capital and noncapital business classifications, other business amounts and separate deductions. Unknown source is not zero; post-passive line5 must reconcile with Schedule1."
    testRef: "tests/engine/forms/form-461-sources.test.ts::rejects incomplete and contradictory source classifications"
  - line: "required"
    description: "Attachment requirement"
    formula: "Attach when net business loss exceeds indexed threshold or any PartI line has a loss greater than half the single-filer threshold (156500 for2025), including a zero-addback joint return."
    testRef: "tests/engine/forms/form-461-sources.test.ts::applies year thresholds and the separate return-attachment boundary"
  - line: "packet"
    description: "Reference-only canonical audit"
    formula: "Copy unique official nonreserved2–6,8–16 and retained NOL; reject missing/tampered audit values. Every page stays reference-only."
    testRef: "tests/pdf/fill-form-461.test.ts::buildForm461ReferenceSummary keeps the packet artifact reference-only and limited to supported excess-business-loss outputs"
  - line: "return-sources"
    description: "Completed source and final return reconciliation"
    formula: "Retain actual return-year source classification and require source line5 to equal final Schedule1 supplemental income after passive loss processing. Other business receipts must reconcile to actual other-income sources; deductions must be separately deducted on return."
    testRef: "tests/engine/forms/form-461-sources.test.ts::reconciles completed supplemental business classification with the return"
  - line: "packet-integrity"
    description: "Reference audit integrity"
    formula: "Every supported canonical audit line must occur exactly once, be finite and equal retained result; no missing component is made up for display."
    testRef: "tests/pdf/fill-form-461.test.ts::rejects missing or tampered canonical Form461 audit values"
  - line: "packet-required"
    description: "Required form with no excess loss"
    formula: "Use requiresForm461 independently of a positive addback."
    testRef: "tests/pdf/fill-form-461.test.ts::includes a required zero-addback Form461 attachment"
  - line: "passive-ordering"
    description: "Actual passive-loss coordination before material business limitation"
    formula: "A material supplemental-loss scenario requires the completed Form8582 MAGI worksheet and final allowed ScheduleE amount; do not reuse post461AGI to invent the earlier limitation."
    testRef: "tests/engine/forms/form-461-sources.test.ts::requires actual passive worksheet sources before material business limitation"
  - line: "mixed-source-netting"
    description: "Offsetting business and nonbusiness source components"
    formula: "Reconcile the actual noncapital business net plus nonbusiness income minus nonbusiness losses to the combined noncapital PartI lines. Gross nonbusiness components may exceed a net printed amount when an opposite business component offsets them; never cap these classifications by the signs of net printed lines. Verified sources require the actual noncapital business net."
    testRef: "tests/engine/forms/form-461-sources.test.ts::reconciles offsetting business and nonbusiness components within one printed line"
