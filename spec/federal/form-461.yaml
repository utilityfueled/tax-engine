form: "Form 461"
fullName: "Limitation on Business Losses"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i461"
statute: "IRC §461(l)"

notes: |
  IRC §461(l) limits the amount of aggregate business losses that
  a non-corporate taxpayer can use to offset nonbusiness income.
  For 2025, the threshold is $313,000 ($626,000 MFJ) per
  Rev. Proc. 2024-40 §3.36. Any excess business loss is disallowed
  and treated as a net operating loss (NOL) carryforward.

  This limitation was enacted by TCJA (2017), suspended for 2018-2020
  by CARES Act, reinstated for 2021, and extended through 2028 by
  the Inflation Reduction Act (2022).

  The excess business loss add-back flows to Schedule 1 Line 8p.

businessRuleValidation:
  - rule: "reference-summary-packet"
    description: "Inventory support counts this form as business-rule validated only when regression coverage proves the emitted packet artifact stays labeled as a non-filing reference summary and only surfaces the supported Form 461 Lines 1 through 5, 7 through 16, the Schedule 1 Line 8p add-back amount, and the tracked excess-business-loss NOL carryforward."
    testRef: "tests/pdf/fill-form-461.test.ts::buildForm461ReferenceSummary keeps the packet artifact reference-only and limited to supported excess-business-loss outputs"

lines:
  # ── Part I: Total Business Income or Loss ────────────────────
  - line: "1"
    description: "Taxable income from all W-2 wages"
    formula: "Sum of W-2 Box 1 wages"
    irsRef: "Form 461 Instructions, Line 1"
    notes: "Wages are treated as income attributable to a trade or business for EBL purposes."
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 1 - W-2 wages count as business income"

  - line: "2"
    description: "Net profit or loss from Schedule C"
    formula: "Schedule C Line 31"
    irsRef: "Form 461 Instructions, Line 2"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 2 - Schedule C net profit or loss"

  - line: "3"
    description: "Net farm profit or loss from Schedule F"
    formula: "Schedule F Line 34"
    irsRef: "Form 461 Instructions, Line 3"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 3 - Schedule F net farm profit or loss"

  - line: "4"
    description: "Other gains or losses from Form 4797"
    formula: "Form 4797 ordinary gain or loss"
    irsRef: "Form 461 Instructions, Line 4"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 4 - Form 4797 ordinary gain or loss"

  - line: "5"
    description: "Nonpassive income or loss from partnerships and S corporations"
    formula: "Schedule E Page 2 nonpassive income or loss from K-1s"
    irsRef: "Form 461 Instructions, Line 5"
    notes: "Only nonpassive business amounts are included. Passive amounts subject to Form 8582 are excluded."
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 5 - nonpassive K-1 income or loss"

  - line: "7"
    description: "Other business income or loss"
    formula: "Business income not captured on lines 1-5, including 1099-MISC business rents and other business income"
    irsRef: "Form 461 Instructions, Line 7"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 7 - other business income"

  - line: "8"
    description: "Total business income"
    formula: "Sum of positive amounts from Lines 1-7"
    irsRef: "Form 461 Instructions, Line 8"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 8 - total business income aggregates positive lines"

  - line: "9"
    description: "Total business deductions from lines above"
    formula: "Sum of absolute values of negative amounts from Lines 1-7"
    irsRef: "Form 461 Instructions, Line 9"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 9 - total business deductions from negative lines"

  # ── Part I continued: Above-the-line business deductions ────
  - line: "10"
    description: "Deductible part of self-employment tax"
    formula: "Schedule SE Line 13 (deductible half of SE tax)"
    irsRef: "Form 461 Instructions, Line 10; Schedule SE"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 10 - deductible SE tax"

  - line: "11"
    description: "Self-employed health insurance deduction"
    formula: "Schedule 1 Line 17"
    irsRef: "Form 461 Instructions, Line 11"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 11 - SE health insurance"

  - line: "12"
    description: "Self-employed SEP, SIMPLE, and qualified plan contributions"
    formula: "Schedule 1 Line 16"
    irsRef: "Form 461 Instructions, Line 12"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 12 - SE retirement contributions"

  - line: "13"
    description: "Total business deductions"
    formula: "Line 9 + Line 10 + Line 11 + Line 12"
    irsRef: "Form 461 Instructions, Line 13"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 13 - total business deductions"

  # ── Part II: Excess Business Loss ───────────────────────────
  - line: "14"
    description: "Net business income or loss"
    formula: "Line 8 - Line 13"
    irsRef: "Form 461 Instructions, Line 14"
    notes: "If positive, there is no excess business loss. If negative, compare to threshold."
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 14 - net business income or loss"

  - line: "15"
    description: "Threshold amount"
    formula: "$313,000 (single/HoH/MFS/QSS) or $626,000 (MFJ) for 2025"
    irsRef: "Form 461 Instructions, Line 15; Rev. Proc. 2024-40 §3.36; IRC §461(l)(3)(A)(ii)"
    edgeCases:
      - "MFJ threshold is double the single threshold"
      - "MFS filers use the single threshold, not half the MFJ threshold"
      - "QSS filers use the single threshold"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 15 - threshold by filing status"

  - line: "16"
    description: "Excess business loss"
    formula: "If Line 14 is negative: max(0, |Line 14| - Line 15). If Line 14 >= 0: $0"
    irsRef: "Form 461 Instructions, Line 16; IRC §461(l)(1)"
    notes: |
      The excess business loss is the amount by which aggregate business
      deductions exceed aggregate business income plus the threshold.
      This amount is disallowed as a current-year deduction and instead
      treated as a net operating loss (NOL) carryforward under IRC §172.
    edgeCases:
      - "No excess when business income exceeds business deductions"
      - "No excess when business loss is within threshold"
      - "Loss exactly at threshold produces $0 excess"
      - "Loss $1 over threshold produces $1 excess"
      - "Large business losses above threshold produce proportionally large excess"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 Line 16 - excess business loss computation"

  - line: "schedule1-addback"
    description: "Excess business loss add-back to Schedule 1"
    formula: "Line 16 → Schedule 1 Line 8p (added back as other income)"
    irsRef: "Schedule 1 Instructions, Line 8p; IRC §461(l)(2)"
    notes: |
      The disallowed excess is added back to income on Schedule 1 Line 8p,
      effectively limiting the business loss deduction. The net effect is
      that the taxpayer can only deduct business losses up to total business
      income plus the threshold amount against nonbusiness income.
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 - excess business loss flows to Schedule 1 as income add-back"

  - line: "nol-carryforward"
    description: "NOL carryforward from excess business loss"
    formula: "Line 16 becomes an NOL carryforward to the next tax year"
    irsRef: "IRC §461(l)(2), §172"
    notes: |
      The excess business loss is treated as a net operating loss for
      the tax year, which carries forward under IRC §172. The NOL can
      offset up to 80% of taxable income in future years. Prior-year
      EBL NOL carryforward is added to the current year's NOL.
    edgeCases:
      - "Carryforward accumulates across years"
      - "Prior-year NOL carryforward from EBL is tracked separately"
    testRef: "tests/engine/forms/form-461.test.ts::Form 461 - excess business loss produces NOL carryforward"

  - line: "packet"
    description: "Draft packet inclusion rule for supported Form 461 excess-business-loss outputs"
    formula: "When Form 461 applies for the return, include a non-filing reference-summary PDF in the packet that lists the supported Form 461 Lines 1 through 5 and 7 through 16 outputs, plus the resulting Schedule 1 Line 8p add-back amount and tracked excess-business-loss NOL carryforward."
    irsRef: "Form 461 Instructions, Lines 1-16; Schedule 1 Instructions, Line 8p; IRC §461(l)(2)"
    notes: "This packet slice intentionally emits a deterministic reference summary instead of attempting to recreate a filed Form 461, so the draft packet stays honest about the supported excess-business-loss limitation scope while still surfacing the computed federal effects."
    testRef: "tests/pdf/fill-form-461.test.ts::fillReturn includes a Form 461 reference summary when the excess business loss limitation applies"
