form: "Schedule A Charity Reporting"
taxYear: 2025
sources:
  - url: "https://www.irs.gov/pub/irs-pdf/f1040sa.pdf"
    description: "Final2025 ScheduleA lines11 current cash,12 current noncash,13 prior carry and14 their sum; line17 adds reported right-column subtotals."
    retrievedAt: "2026-10-25"
  - url: "https://www.irs.gov/instructions/i1040gi"
    description: "Rounding Off to Whole Dollars: preserve cents while adding sources for one line, then round that line; apply the same reporting convention throughout the form."
    retrievedAt: "2026-10-25"
  - url: "https://uscode.house.gov/us/usc/119-118/t26/s6102/"
    description: "Section6102(c) applies whole-dollar reporting to the final reported amount, not the intermediate items needed to compute it."
    retrievedAt: "2026-10-25"
lines:
  - line: "11-14"
    description: "Separate current gifts from actual prior-year use"
    formula: "After category limits and floors, retain exact computational amounts. Report11=round(current cash),12=round(current noncash),13=round(actual prior carry used),14=11+12+13. Do not classify prior gifts as current cash in the audit or PDF."
    irsRef: "Final2025 ScheduleA11–14; IRC6102(c); i1040 Rounding Off to Whole Dollars"
    testRef: "tests/engine/schedules/schedule-a-charity-reporting.test.ts::reports current and prior charity groups separately after exact computation"
  - line: "rounding"
    description: "Source cents survive percentage limits and group aggregation"
    formula: "Two current cash sources0.49+0.49 report1, not0. Separate current cash100.49 and noncash200.49 report100+200=300 on14, not rounded exact301. ScheduleA17 and canonical NOL/AMT deduction consumers use the reported14 while exact source/category values remain available."
    irsRef: "i1040 Rounding Off to Whole Dollars; finalScheduleA14/17; Form6251 deduction transfer"
    testRef: "tests/engine/schedules/schedule-a-charity-reporting.test.ts::rounds each completed charity line without changing original source cents"
  - line: "review-source"
    description: "Review output uses unique canonical audits bound to original charitable facts"
    formula: "Require unique finite nonnegative whole-dollar audits11–14 matching retained reported fields and14=sum11–13 before template I/O. Reconcile exact groups and original charitable source digest, excluding render-only tax identifiers. Changed source cents or current/prior mix rejects even when total14 is unchanged."
    irsRef: "FinalScheduleA source grouping; review-only source-conservation policy"
    testRef: "tests/pdf/schedule-a-charity-reporting.test.ts::rejects missing conflicting and stale same-total charity sources before rendering"
  - line: "saved-review"
    description: "Saved fields and appearances retain the canonical charitable grouping"
    formula: "Independently derived20000.49 currentcash+10000.51 currentnoncash+1234.49 actualprioruse reports20000/10001/1234/31235. Saved canonical fields/widgets match; one visible review notice remains, redacted identifiers stay absent and physical2026 qualification remains closed."
    irsRef: "Final2025 ScheduleA printed11–14 and repository PDF review policy"
    testRef: "tests/pdf/schedule-a-charity-reporting.test.ts::preserves source-separated charity lines in reopened review fields and appearances"
  - line: "source-omission"
    description: "Historical absent charitable source collections remain absent"
    formula: "The source digest tolerates an omitted historical crypto-donation collection and preserves omission as distinct from an explicitly empty collection; it neither creates a gift nor infers source confirmation."
    irsRef: "Original-source preservation and historical preview compatibility policy"
    testRef: "tests/engine/schedules/schedule-a-charity-reporting.test.ts::preserves omitted legacy crypto donations without inventing confirmed sources"
  - line: "exact-category-result"
    description: "Retain exact category amounts before physical-line reporting"
    formula: "The current category worksheet already retains exact allowedAfterFloor values. Derive the computational cash/noncash groups from those values, not its already rounded reporting aliases. With2026 base10000, currentcash100.49 and ordinaryproperty200.49, the50floor leaves100.49 cash and150.49 noncash; physical11/12 report100/150."
    irsRef: "IRC170(b)(1)(I) floor and category ordering; i1040 completed-line rounding; no final2026 form qualification"
    testRef: "tests/engine/schedules/schedule-a-charity-reporting.test.ts::retains current category worksheet cents separately from reported charity lines"
  - line: "exact-percentage-capacity"
    description: "Intermediate percentage capacities retain their exact Decimal value"
    formula: "With actual contribution base1000.49 and public cash10000.99, the60% capacity is600.294 and the excess carry is9400.696. Physical line11 reports600. The historical30%,20%,50% and60% intermediate capacities must not be rounded before limits, headroom or carry are computed."
    irsRef: "IRC6102(c); Pub526 Worksheet2 multiplication and carry formulas; i1040 completed-line reporting"
    testRef: "tests/engine/schedules/schedule-a-charity-reporting.test.ts::preserves exact percentage capacities and carry before reported line rounding"
  - line: "exact-review-conservation"
    description: "Retained computational values reconcile to their original audit evidence"
    formula: "Require the unique cash and noncash computational audits and exact inputs on physical11,12,13 to equal the retained cash/noncash/prior-use groups without rounding. Missing, duplicate, invalid or changed exact evidence rejects before template I/O even when physical reported amounts and original-source digest are unchanged."
    irsRef: "IRC6102(c); original-source and canonical-audit conservation policy"
    testRef: "tests/pdf/schedule-a-charity-reporting.test.ts::rejects changed retained cents and missing exact audit evidence before rendering"
