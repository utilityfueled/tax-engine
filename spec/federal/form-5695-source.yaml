form: "Form 5695 actual property sources"
taxYear: 2026
supportedTaxYears: [2025, 2026]
irsReference: "https://www.irs.gov/instructions/i5695"
reviewStatus: "implementation in progress; independent human qualification pending"
sources:
  - url: "https://www.irs.gov/instructions/i5695"
    revision: "Final 2025, refreshed 2026-10-25; current official form remains 2025"
  - url: "https://www.irs.gov/pub/irs-pdf/f5695.pdf"
    revision: "Final 2025; no 2026 filing qualification"
  - url: "https://uscode.house.gov/us/usc/119-118/t26/s25C/"
  - url: "https://uscode.house.gov/us/usc/119-118/t26/s25D/"
notes: |
  Each property is bound to an actual installation home, not a mailing address.
  Net qualified cost means the taxpayer's cost after subsidies, disallowed labor,
  and applicable nonbusiness-use allocation. Complete source confirmation never
  creates a missing eligibility fact. Historical arrays without the new source
  contract remain explicitly unverified; review PDF qualification remains closed.
lines:
  - line: "source-contract"
    description: "Preserve actual homes, property identities and unanswered questions"
    formula: "No defaults for physical facts; source IDs are unique and refer to actual homes and enabling relationships"
    irsRef: "Form 5695 lines 5a,7,17,21,25,26,32 and specific instructions"
    testRef: "tests/engine/forms/form-5695-source.test.ts::preserves unknown physical source facts and rejects incomplete confirmed records"
  - line: "physical-eligibility"
    description: "Apply actual category-specific residence and product answers"
    formula: "Only eligible residence/property use produces credit; known false answers retain disallowed cost; unknown required answers reject"
    irsRef: "Form 5695 instructions lines 5a,7a,17a-c/e,21a-b,26a"
    testRef: "tests/engine/forms/form-5695-source.test.ts::uses actual home and category facts without treating an aggregate confirmation as an answer"
  - line: "fuel-capacity"
    description: "Fuel-cell half-kilowatt increments and joint source allocation"
    formula: "capacityForCredit = floor(actualKW*2)/2; joint qualifying cost = min(taxpayerCost,1667*floor(actualKW*2)*taxpayerCost/allOccupantCost)"
    irsRef: "Form 5695 instructions line10 and Part I Joint occupancy example"
    testRef: "tests/engine/forms/form-5695-source.test.ts::uses half-kilowatt increments and the IRS joint fuel-cell cost example"
  - line: "joint-credit"
    description: "Allocate property and annual caps from actual shared occupancy costs"
    formula: "When aggregate credit exceeds a category cap, taxpayer allocation is cap*taxpayerCost/allOccupantCost; apply individual-door and category limits from complete occupant costs; further general1200 allocation triggers only when the taxpayer's resulting printed line27 exceeds1200, not from an all-occupant hypothetical line27"
    irsRef: "Form 5695 instructions Part II Joint occupancy; IRC25C(f)(1)"
    testRef: "tests/engine/forms/form-5695-source.test.ts::allocates shared category and annual caps from complete occupant costs"
  - line: "association-share"
    description: "Actual condominium or cooperative cost share"
    formula: "Verify taxpayer net cost against the actual association eligible cost times actual ownership fraction, reconciled to cents; retain the fraction and source statement"
    irsRef: "Form 5695 instructions Association or cooperative costs and line32b"
    testRef: "tests/engine/forms/form-5695-source.test.ts::reconciles actual association shares and preserves unsupported or unknown ownership facts"
  - line: "panel-source"
    description: "Bind enabling property to actual eligible enabled property"
    formula: "Require actual same-home enabled IDs, 200amp load and code compliance; current year pair qualifies, or actual consecutive-year election moves the pair to the later year with no prior credit claimed"
    irsRef: "Form 5695 instructions lines25a-e and consecutive-year example"
    testRef: "tests/engine/forms/form-5695-source.test.ts::binds electrical panels to eligible property and the actual consecutive-year election"
  - line: "separate-main-homes"
    description: "Separate spousal main-home improvement limits"
    formula: "Confirmed MFJ spouses owning and living apart in separate main homes receive separate17-30 computations; combine actual line30 amounts once before the shared liability limit"
    irsRef: "Form 5695 instructions Married taxpayers with more than one home"
    testRef: "tests/engine/forms/form-5695-source.test.ts::keeps separate spousal main-home computations and applies the shared tax limit once"
  - line: "18b-printed"
    description: "Printed insulation category cap before the shared annual limit"
    formula: "For a sole household, line18b = min(round(line18a*30%),1200); the combined 1200 general cap also applies at line28"
    irsRef: "Form5695 printed lines18b,27,28"
    testRef: "tests/engine/forms/form-5695-source.test.ts::caps the printed insulation amount before the annual pool limit"
  - line: "joint-annual-trigger"
    description: "Apply the printed line27 trigger after category allocation"
    formula: "After category shares, line28 = line27 when line27<=1200; if line27>1200, allocate1200 by actual corresponding taxpayer/all-occupant costs, subject to the taxpayer annual cap"
    irsRef: "Form5695 instructions PartII Joint occupancy paragraph3; line27 is the actual taxpayer form"
    testRef: "tests/engine/forms/form-5695-source.test.ts::uses the taxpayer printed line27 for the further shared annual allocation"
  - line: "invalid-panel-pair"
    description: "An ineligible panel cannot shift an earlier enabled property into a later year"
    formula: "Consecutive-year treatment requires an eligible panel with actual200amp and code-compliance facts; preserve the enabled property's actual year if those conditions fail"
    irsRef: "Form5695 instructions lines25a-c"
    testRef: "tests/engine/forms/form-5695-source.test.ts::does not shift prior-year property through an ineligible panel"
  - line: "actual-main-home-periods"
    description: "Apply actual main-home dates and the return's spouse relationship"
    formula: "One main home per person at a time; sequential home periods must be explicit, valid and nonoverlapping; a spouse-only main home requires a joint return for that person's property credit"
    irsRef: "Form5695 instructions Main home, PartI line7 and PartII17"
    testRef: "tests/engine/forms/form-5695-source.test.ts::requires actual nonoverlapping main-home periods and joint spouse eligibility"
  - line: "source-boundaries"
    description: "Reject contradictory identities, costs and ownership statements"
    formula: "Actual source IDs and home addresses are nonempty; fractions and occupant costs reconcile; no aggregate flag supplies missing fields"
    irsRef: "Form5695 instructions substantiation, joint occupancy and actual home/property lines"
    testRef: "tests/engine/forms/form-5695-source.test.ts::rejects contradictory source identities and allocation amounts"
  - line: "qualification-boundaries"
    description: "Distinguish known ineligibility from missing evidence"
    formula: "False residence/property answers produce no credit; actual eligible non-main residence energy property remains allowed, while envelope and audit need the actual main home"
    irsRef: "Form5695 instructions PartI and PartII specific residence requirements"
    testRef: "tests/engine/forms/form-5695-source.test.ts::distinguishes residence and audit requirements by property category"
  - line: "source-rounding"
    description: "Keep exact source cents and apply dollar rounding at printed aggregate lines"
    formula: "Sum same-category actual costs before rounding the printed amount; source audit retains exact cents; tax limit applied once after separate-home credits"
    irsRef: "Form1040 whole-dollar rounding and Form5695 printed aggregation"
    testRef: "tests/engine/forms/form-5695-source.test.ts::preserves source cents while rounding the printed category aggregate"
  - line: "carryforward-source"
    description: "Complete source records include the actual prior return carryforward"
    formula: "Require confirmed immediately prior-year carryforward including explicit zero; reject conflicting options instead of replacing an actual source amount"
    irsRef: "Form5695 line12 and prior-year Form5695 line16"
    testRef: "tests/engine/forms/form-5695-source.test.ts::requires actual carryforward facts and rejects contradictory overrides"
  - line: "guided-physical-sources"
    description: "Collect complete actual energy source facts before a2025 preview"
    formula: "Guided home/property IDs, eligibility answers, allocations, dates and carryforward map exactly to source inputs; missing source facts block instead of reverting to the legacy aggregate calculation"
    irsRef: "Form5695 physical home, qualification, allocation and enabled-property fields"
    testRef: "tests/guided-interview/guided-energy-physical-facts.test.ts::preserves complete actual physical sources and blocks partial records"
  - line: "guided-panel-allocation"
    description: "Preserve actual panel election and association fractions through guided conversion"
    formula: "Only explicit dates, linked source IDs and actual shares can establish the coordinated credit; known false answers remain false"
    irsRef: "Form5695 instructions lines25 and32"
    testRef: "tests/guided-interview/guided-energy-physical-facts.test.ts::preserves panel and association source relationships without inferring answers"
  - line: "guided-physical-controls"
    description: "Interactive controls collect physical facts and invalidate stale confirmation"
    formula: "New homes/items start unanswered; only local record IDs are generated; edited source facts clear the prior confirmation without replacing actual dates/costs"
    irsRef: "Form5695 actual home and property records"
    testRef: "tests/apps/web/energy-physical-interactions.test.tsx::collects actual installation homes without copying a mailing address"
  - line: "guided-panel-controls"
    description: "Collect actual enabled-property links and consecutive-year elections"
    formula: "Link selected actual records and retain original dates; editing or removing a relationship clears prior source confirmation; no price, date or qualification answer is generated"
    irsRef: "Form5695 instructions lines25a-e"
    testRef: "tests/apps/web/energy-physical-interactions.test.tsx::collects panel links and keeps source dates when the election changes"
  - line: "guided-cancelled-entry"
    description: "Removing an uncompleted new entry does not manufacture a credit source"
    formula: "With no property/home/carryforward records and no completed source confirmation, return no energy input; a null stale-confirmation marker is not a tax fact"
    irsRef: "Form5695 actual expenditure and carryforward requirements"
    testRef: "tests/apps/web/energy-physical-interactions.test.tsx::keeps new clean-property capacities and association fractions unanswered"
