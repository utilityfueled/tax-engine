form: "Form 8812"
fullName: "Credits for Qualifying Children and Other Dependents"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1040s8"

notes: |
  Revision: 2025 instructions; retrieved 2026-10-24; rule version 2025.2.
  Independent tax review remains pending. Eligible-child counts must be validated
  upstream, including timely employment-valid SSNs under the 2025 rules.
  Schedule 8812 calculates both the nonrefundable CTC (Line 14 → 1040 Line 19)
  and the Additional Child Tax Credit (ACTC), the refundable portion (Line 27 → 1040 Line 28).
  ACTC = 15% of earned income over $2,500, capped at the unused CTC amount.
  Maximum refundable per child: $1,700 (2025).

lines:
  - line: "9"
    description: "Phase-out threshold"
    formula: "$400,000 if MFJ; $200,000 for all other filing statuses (single, HoH, MFS, QSS)"
    irsRef: "IRC §24(b)(2); Schedule 8812 Instructions, Line 5"
    notes: |
      IRC §24(b)(2): "increased to $400,000 in the case of a joint return."
      QSS (IRC §2(a)) is NOT a joint return — uses $200,000 threshold.
      IRS confirms: "$400,000 if married filing jointly; $200,000 for all other filing statuses."
    edgeCases:
      - "QSS uses $200K, not $400K — QSS is not a joint return per IRC §6013"
    testRef: "tests/edge-cases/filing-status-edge-cases.test.ts::CTC phase-out: MFJ at $400K, all others (incl QSS) at $200K — IRC §24(b)(2)"

  - line: "12"
    description: "CTC and ODC before limitation"
    formula: "$2,200 × qualifying children + $500 × other dependents, after phase-out"
    irsRef: "Schedule 8812 Instructions, Line 12"
    testRef: "tests/regression/obbba-2025.test.ts::2025 CTC independent worksheet fixtures"

  - line: "14"
    description: "Nonrefundable CTC (limited to tax liability)"
    formula: "min(Line 12, tax liability after other credits)"
    irsRef: "Schedule 8812 Instructions, Line 14"
    notes: "This amount goes to Form 1040 Line 19"
    testRef: "tests/engine/forms/form-8812.test.ts::Form 8812 Line 14 - nonrefundable limited to tax"

  - line: "16a"
    description: "Unused CTC"
    formula: "Line 12 - Line 14"
    irsRef: "Schedule 8812 Instructions, Line 15"
    testRef: "tests/engine/forms/form-8812.test.ts::Form 8812 Line 15 - unused CTC"

  - line: "18a"
    description: "Earned income for ACTC"
    formula: "W-2 wages + net SE earnings - deductible half of SE tax (Schedule 1, Line 15)"
    irsRef: "Schedule 8812 Instructions, Lines 18a-18f; IRC §24(d)(1)(B)(i) → §32(c)(2)(A)(i)(II)"
    notes: |
      Per IRC §32(c)(2)(A)(i)(II), earned income includes "net earnings from self-employment
      (within the meaning of section 1402(a)), but such net earnings shall be determined with
      regard to the deduction allowed to the taxpayer by section 164(f)."
      §164(f) = deductible half of SE tax. Per IRS Form 8812 Lines 18a-18f:
        18a = wages (1040 Line 1z)
        18c = Schedule 1 lines 3+6 (Schedule C/F profit or loss — can be negative)
        18e = Schedule 1 line 15 (deductible half of SE tax)
        Earned income = 18a + 18c - 18e
      SE losses reduce earned income (no zero-floor on SE component).
    edgeCases:
      - "Schedule C loss reduces earned income — SE losses are NOT floored at zero"
      - "Deductible half of SE tax subtracted from earned income per §164(f)"
      - "If SE < $400 post-multiplier, no SE tax → deductible half = $0, but SE income (or loss) still counts"
    testRef: "tests/edge-cases/ctc-actc-edge-cases.test.ts::ACTC earned income subtracts deductible half of SE tax — IRC §32(c)(2)"

  - line: "19"
    description: "Earned income excess over $2,500"
    formula: "max(0, earned income - $2,500)"
    irsRef: "Schedule 8812 Instructions, Line 21"
    edgeCases:
      - "Earned income ≤ $2,500: no ACTC"
      - "$2,501 earned income: $0.15 ACTC"
    testRef: "tests/engine/forms/form-8812.test.ts::Form 8812 Line 21 - earned income excess"

  - line: "20"
    description: "15% of earned income excess"
    formula: "Line 19 × 15%"
    irsRef: "Schedule 8812 Instructions, Line 24"
    testRef: "tests/engine/forms/form-8812.test.ts::Form 8812 Line 24 - 15% calculation"

  - line: "27"
    description: "Additional Child Tax Credit (refundable)"
    formula: "min(Line 16a unused, Line 16b refundable cap, max(Line 20 earned-income amount, eligible Line 25 payroll alternative))"
    irsRef: "Schedule 8812 Instructions, Line 27; IRC §24(d)(1)"
    notes: |
      Goes to Form 1040 Line 28. Max $1,700 per child refundable (2025).
      Line 16a is the TOTAL unused credit (CTC + ODC combined, after phase-out
      and nonrefundable limitation). The $1,700 per child cap (Line 16b) is
      the mechanism that prevents ODC from being refunded in normal cases.
      When phase-out exceeds the per-child CTC amount, any remaining combined
      credit (partly ODC-sourced) can still flow into ACTC, limited by the cap.
    edgeCases:
      - "No qualifying children: no ACTC ($1,700 × 0 = $0 cap)"
      - "High earners with full CTC used: no ACTC needed (Line 16a = $0)"
      - "Very low income: ACTC limited by 15% earned income formula"
      - "Phase-out > CTC, ODC remains: ACTC uses Line 16a total, not CTC-only subset"
    testRef: "tests/engine/forms/form-8812.test.ts::Form 8812 Line 27 - ACTC refundable amount"

  - line: "payroll-alternative-and-credit-reservation"
    description: "Three-child/PR payroll alternative, Form 2555 exclusion and Worksheet B reservation"
    formula: "For three or more qualifying children, or a bona fide Puerto Rico resident with a child, alternate=max(0, payroll worksheet line21 + deductible-half-SE/unreported-tax line22 - EIC - excess SS). ACTC=min(unused CTC, indexed refundable cap per child, max(15% of earned income above2500, alternate)). Form2555 disallows ACTC. Worksheet B line14 reserves max(0, line12 - potential ACTC) before adoption/clean-energy limitations. 2026 alternate facts must be known."
    irsRef: "https://www.irs.gov/pub/irs-pdf/f1040s8.pdf, Part II; https://www.irs.gov/instructions/i1040s8, Credit Limit Worksheet B"
    testRef: "tests/engine/forms/form-8812-2026.test.ts::Schedule 8812 payroll and reservation worksheets"

  - line: "2026-irs-ats-14"
    description: "Reproduce the Schedule 8812 amounts published in 2026 IRS ATS scenario 14, pages 6 and 7"
    formula: "Two qualifying children, AGI and earned income of $35,000, and the published Worksheet A limit of $2,023 give $4,400 before limitation, $2,023 nonrefundable, and $2,377 refundable. The $3,400 per-child ceiling and $4,875 earned-income limit exceed unused credit. This checks the worksheet using its supplied tax limit. The scenario uses draft form pages and leaves final form, EIC table, and filing qualification open."
    irsRef: "https://www.irs.gov/pub/irs-efile/ty26-1040-ats-scenario-14.pdf"
    testRef: "tests/engine/forms/form-8812-2026.test.ts::matches the IRS 2026 ATS scenario 14 child credit worksheet"

  - line: "2026-identity-and-magi-facts"
    description: "Preserve actual taxpayer/dependent tax identifiers and federal integration facts"
    formula: "2026 CTC requires actual timely employment-valid SSN eligibility of a parent (at least one on a joint return), timely TINs for both joint filers, and qualifying-child SSN facts. ODC requires actual timely TIN eligibility. A disqualified parent or child receives no CTC, and no ODC is inferred. MAGI adds actual foreign/possession exclusions; Form2555 blocks ACTC; actual payroll sources feed Part II."
    irsRef: "https://www.irs.gov/instructions/i1040s8, Taxpayer Identification Number Requirements, Credit Limit Worksheet B, Earned Income Worksheet"
    testRef: "tests/engine/federal-ctc-facts.test.ts::Schedule 8812 actual identity and payroll facts"

  - line: "2026-qualifying-child-age"
    description: "Validate the actual date of birth before counting a claimed child on line 4"
    formula: "A 2026 CTC or ACTC claim needs a real calendar birth date no later than December 31, 2026. Rev. Rul. 2003-72 applies age attainment on the child's birthday for section 24. A child born December 31, 2009 has reached age 17 by year end and conflicts with an affirmative CTC claim. A child born January 1, 2010 reaches age 17 in 2027. Reject missing, impossible and future dates and conflicting affirmative claims. Do not infer an ODC claim. Continue to recognize an independently confirmed ODC claim with a timely TIN and preserve the child SSN and newborn exception requirements. Historical calculation is unchanged."
    irsRef: "https://uscode.house.gov/us/usc/t26/s24/; https://www.irs.gov/pub/irs-drop/rr-03-72.pdf; https://www.irs.gov/pub/irs-prior/f1040s8--2026.pdf, lines 4 and 6"
    testRef: "tests/engine/federal-ctc-facts.test.ts::Schedule 8812 2026 claimed child's age"

  - line: "claimed-child-relationship"
    description: "Reject an explicit application relationship category that conflicts with line 4"
    formula: "For 2025 and 2026, the exact application categories parent and other identify a parent, grandparent, or other qualifying relative. Reject an affirmative CTC claim with either category before counting qualifying children. Keep existing free-form relationship handling and independently confirmed ODC claims."
    irsRef: "IRC 24(c)(1) and 152(c)(2); https://uscode.house.gov/us/usc/t26/s24/; https://uscode.house.gov/us/usc/t26/s152/"
    testRef: "tests/engine/forms/child-credit-household-admission.test.ts::rejects explicit relative categories before 2025 line 19 and 2026 Schedule 8812"

  - line: "source-nontaxable-combat-pay"
    description: "Add actual section 112 combat pay to line 18a and record it separately on line 18b"
    formula: "For a qualifying-child claim in 2025 or 2026, use the sum of actual original W-2 Box 12 code Q amounts when the return reports combat pay, has a military combat-pay indicator, or carries a positive legacy ACTC election amount. Confirm the amount or absence on every W-2 in that case. A positive code Q needs the matching return year and a valid recipient for the filing status. Use the full exact section 112 amount once in ACTC earned income, including when the EIC calculation excludes it. Keep it out of wages and AGI. A positive legacy election amount requires actual code Q sources that reconcile to it, or correction of the old amount. A legacy zero does not override original code Q. Leave line 18b unaudited when no source is available."
    irsRef: "https://uscode.house.gov/us/usc/t26/s24/, §24(d)(1); https://www.irs.gov/instructions/i1040s8, Earned Income Chart and Worksheet; https://www.irs.gov/pub/irs-dft/i1040s8--dft.pdf, lines 18a and 18b; https://www.irs.gov/pub/irs-prior/iw2w3--2026.pdf, code Q"
    testRef: "tests/engine/federal-ctc-facts.test.ts::Schedule 8812 original W-2 combat pay"

  - line: "source-magi-lines"
    description: "Audit actual source amounts on lines1 and2a-2d without fabricating a possession-income split"
    formula: "Line1=AGI;2a=actual PuertoRico excluded income;2b=Form2555lines45+50;2c=Form4563line15;2d=sum2a-2c;3=1+2d. Known nonnegative possession total0 implies both components0; positive total requires actual source split for2026. Unknown legacy components stay absent from audit."
    irsRef: "https://www.irs.gov/pub/irs-pdf/f1040s8.pdf, Lines1-3"
    testRef: "tests/engine/federal-ctc-facts.test.ts::audits actual Puerto Rico and Form4563 MAGI sources"

  - line: "signed-form2555-source"
    description: "Copy actual signed Form2555 lines45+50 into MAGI"
    formula: "Use the complete confirmed calculated Form2555 source with audit and prior-statement conservation when45 is negative. Preserve signed45+50; reject unbound negative legacy addbacks. The original amount remains visible in the worksheet."
    irsRef: "2025Schedule8812line2b; Instructions8839line7; Instructions8962Worksheet1-1line3; retrieved2026-11-01"
    testRef: "tests/engine/forms/form-2555-actual-expense-allocation.test.ts::copies signed source amounts into child adoption and premium-credit MAGI worksheets"
