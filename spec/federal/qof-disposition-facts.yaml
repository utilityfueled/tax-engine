form: "ScheduleD QOF source question"
fullName: "Actual qualified-opportunity-fund disposition source boundary"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i1040sd"
notes: "The ScheduleD header asks about an actual QOF investment disposition, not whether Form8949 was filed. A positive event requires the separate Form8997 and Form8949 investment-history method; collecting a header answer does not implement that method. Unknown remains unasserted."
lines:
  - line: "actual-answer"
    description: "Preserve source year and actual Yes or No"
    formula: "An omitted QOF source record remains unknown. A supplied record requires the actual return year, original source reference, all-investments review and confirmation; explicit false is a known No. No gain or Form8949 count implies an answer."
    irsRef: "ScheduleD page1 QOF question and Disposal of QOF Investment"
    testRef: "tests/engine/forms/qof-disposition-facts.test.ts::preserves actual QOF answers without inventing an omitted No"
  - line: "positive-method"
    description: "Do not silently calculate a known QOF event as an ordinary disposal"
    formula: "A known positive QOF disposition with no actual sale record is retained but the canonical return rejects. Complete sale records use spec/federal/qof-deferred-gain-inclusion.yaml."
    irsRef: "ScheduleD Disposal of QOF Investment; Form8949 How To Report Gain Previously Deferred; Form8997 PartIII"
    testRef: "tests/engine/forms/qof-disposition-facts.test.ts::keeps positive QOF history outside the ordinary return calculation"
  - line: "review-checkbox"
    description: "Map only the actually confirmed ScheduleD answer"
    formula: "A confirmed current-year No checks only the physical No widget. An omitted answer leaves both widgets blank. Invalid, stale or positive-event sources cannot produce a misleading ordinary review packet."
    irsRef: "Final2025 ScheduleD page1 QOF checkbox"
    testRef: "tests/pdf/qof-disposition-facts.test.ts::maps only the actual confirmed QOF answer on ScheduleD"
  - line: "guided-source"
    description: "Collect the original QOF disposition answer without a default"
    formula: "The investment interview retains the original source year/reference and tri-state answer. Current-year confirmed No forwards unchanged; Yes preserves the source and explains the missing positive-event method. Household, investment and business-source edits revoke confirmation, while confirmation-only edits preserve it."
    irsRef: "ScheduleD header and Disposal of QOF Investment"
    testRef: "tests/guided-interview/guided-qof-facts.test.ts::preserves actual QOF facts and revokes changed investment confirmation"
  - line: "guided-controls"
    description: "Keep unknown and false distinct in actual investment controls"
    formula: "Adding a worksheet starts with unknown year, review and answer; edits retain its source reference and revoke confirmation. Removing it restores unknown rather than No. No source is sent by these controls."
    irsRef: "Source integrity"
    testRef: "tests/apps/web/qof-facts-interactions.test.tsx::collects the actual QOF answer and keeps unanswered sources unknown"
