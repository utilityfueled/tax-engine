form: "AI-Application-Bindings"
fullName: "Actual source proposals and grounded assistance contracts"
taxYear: 2026
reference: "docs/upgrade-2026-execution-brief.md; https://developers.openai.com/api/docs/guides/structured-outputs"
notes: |
  Model output is a proposal for confirmation, never authoritative tax input.
  Application schemas include explicit abstention, source citations and unknown
  facts. Signed monetary values use decimal strings. Evaluation must use these
  same schemas and grounding rules, deriving observations from actual output.
  Structured output validates shape, not factual correctness or human approval.
lines:
  - line: "source-facts"
    description: "Source facts preserve signed amounts, zero and unknown"
    formula: "Require actual field kind and literal source quote; null remains unknown; match money using Decimal and date using an unambiguous ISO date."
    testRef: "tests/engine/ai-application-bindings.test.ts::preserves exact signed source amounts and explicit unknowns"
  - line: "grounding"
    description: "Changed values, source identity and ambiguous dates fail closed"
    formula: "Known fact values require a quote in the cited actual source; money must retain sign and cents; ISO dates must be present exactly; requested field kinds cannot change."
    testRef: "tests/engine/ai-application-bindings.test.ts::rejects fabricated values and source references before accepting proposals"
  - line: "confirmation"
    description: "Business categorization never confirms business purpose"
    formula: "Retain not-business or needs-review; all proposed business-use flags remain false and confidence low. Abstention cannot carry actionable suggestions."
    testRef: "tests/engine/ai-application-bindings.test.ts::keeps extraction proposals unconfirmed and abstention nonactionable"
  - line: "task-schema"
    description: "Every actual assistance task has one versioned contract"
    formula: "Reject extra normalized evaluation fields and another task's shape; unsupported messages can only abstain; no filing-ready claims."
    testRef: "tests/engine/ai-application-bindings.test.ts::binds each task to its actual schema without an evaluation sidecar"
  - line: "verified-audit"
    description: "Explanation and reconciliation preserve actual verified audit values"
    formula: "Require matching-year source/audit context, valid citations and exact audit amounts. Reconciliation remains one explicit cancellable escalation."
    testRef: "tests/engine/ai-application-bindings.test.ts::requires verified matching-year context and unchanged engine values"
  - line: "actual-callers"
    description: "Application callers consume the same source contract"
    formula: "Document callers use shared schema and grounding, keep opt-out/default deterministic behavior, and reject source failures through the billed-failure path."
    testRef: "tests/apps/web/document-ai-tasks.test.ts::uses the actual source-fact contract and bills rejected grounding once"
  - line: "bounded-escalation"
    description: "Reconciliation cannot run implicitly or without cancellation"
    formula: "Require one explicit escalation, actual verified context and a caller signal; no retry or implicit provider switch."
    testRef: "tests/apps/web/ai-evidence-tasks.test.ts::requires an explicit cancellable reconciliation with verified sources"
  - line: "source-review"
    description: "Actual source proposals survive application normalization for review"
    formula: "Preserve signed decimal strings, explicit nulls and quotes in sourceFacts without changing suggestions or tax totals; display the proposals as unconfirmed."
    testRef: "tests/apps/web/document-source-facts.test.tsx::retains source proposals through normalization without accepting income or expenses"
  - line: "literal-text"
    description: "Known text facts cannot be invented or semantically inferred"
    formula: "Require a nonempty literal text value inside the actual quoted source; absent or inferred text remains null."
    testRef: "tests/engine/ai-application-bindings.test.ts::rejects invented and empty text values despite a valid quote"
  - line: "unsupported-message"
    description: "Unsupported-route messages cannot generate permission to file"
    formula: "Model may choose only a bounded reason code; server renders deterministic review copy without accepting arbitrary message text."
    testRef: "tests/engine/ai-application-bindings.test.ts::renders unsupported messages only from constrained reason codes"
