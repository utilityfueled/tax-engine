form: "Hosted-Workspace-Cache-Policy"
fullName: "Owner-scoped workspace API returned responses are private and not stored by caches"
taxYear: 2025
reference: "docs/upgrade-2026-execution-brief.md"
notes: "Actual80bc two independent authenticated Starter200 ready workspace lists returned public,max-age0,must-revalidate while session/billing were private/no-store. No observed cross-tenant cache leak is claimed. Decorate only existing five handler returned Response objects; preserve all body/status/non-cache headers, existing transient raw processing and source/auth/owner/rate/storage behavior. Middleware CORS short-circuit and framework exceptions are separate boundaries, not silently included. Source-first controls use only existing APIs and synthetic isolated dependencies; no network or product yet."
lines:
  - line: "success"
    description: "All five successful workspace handler results carry explicit sensitive cache policy"
    formula: "list/get/save/delete/uploadDocument retain200 and actual expected owner-scoped body, then require Cache-Control exactly private,no-store,max-age0. No body parse/rewriting by decorator."
    testRef: "tests/apps/web/hosted-workspace-cache-policy.test.ts::keeps successful %s responses private and uncached"
  - line: "early-response"
    description: "Authentication, entitlement, mode, limits and adapter failures retain semantics with same policy"
    formula: "Existing401/403/404/429/503 responses retain exact JSON and Retry-After where present for all five handlers; invalid IDs retain400 on all four ID handlers. Invalid-ID controls use their separate named existing-API test. No returned response category in this finite matrix is missed."
    testRef: "tests/apps/web/hosted-workspace-cache-policy.test.ts::keeps %s for %s private without changing status body or retry headers"
  - line: "payload"
    description: "Save and multipart validation denial responses remain private"
    formula: "Actual existing malformed JSON/mismatchedID/missingContentType/overlimit/cancelled save and missingfile/unsupportedMIME/oversized upload checks reject with original statuses; no private error reflection or upload-policy change."
    testRef: "tests/apps/web/hosted-workspace-cache-policy.test.ts::keeps %s validation private without changing denial"
  - line: "store-failure"
    description: "Sanitized store/blob errors retain generic original responses and private policy"
    formula: "Each supported actual store failure becomes existing generic503; cache decorator does not introduce catches or leak private error text."
    testRef: "tests/apps/web/hosted-workspace-cache-policy.test.ts::keeps %s store failure private and generic"
  - line: "invalid-identifier"
    description: "Invalid workspace IDs reject before persistence with private policy"
    formula: "All four ID handlers retain exact400 Invalid workspace identifier. and do not query the store; list has no route ID."
    testRef: "tests/apps/web/hosted-workspace-cache-policy.test.ts::keeps %s invalid identifier private without persistence"
