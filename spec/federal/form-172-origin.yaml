form: "172 Part I"
fullName: "Current-year individual net operating loss"
taxYear: 2025
irsReference: "https://www.irs.gov/pub/irs-pdf/f172.pdf"
notes: |
  The December 2024 continuous-use form has 24 Part I lines. Its input amounts
  are completed canonical form-dollar income and source-classification totals,
  not a user override of AGI, profit or loss. Original receipts remain upstream.
  Sections 172(c) and (d) remove other-year NOL deductions, excess nonbusiness
  deductions and disallowed capital losses. This computation is separate from
  current-year Form 461 excess business loss, which is added to the new carry
  only once after the return has already included its income addback.
  The published 2023 Publication 536 page 6 example is a historical arithmetic
  oracle only; its 13,850 standard deduction is not a current-year constant.
  No root input or canonical route is added by this standalone package. Separate
  regular/AMT/1411 source classification and current-year carry assembly remain
  integration work. Positive section 1202 exclusion with capital netting requires
  resolution of the Part I lines 16-21 source convention before this route can
  calculate it; it must not duplicate the restored exclusion.
  Current i172's EBL worksheet still refers to Form 172 line 33, whereas the
  current physical Part I origin loss is line 24. Do not use Part II line 33,
  which is an itemized-deduction adjustment, as the current-year original loss.
lines:
  - line: "1"
    description: "Signed income less the standard or itemized deduction"
    formula: "Actual AGI minus standard or itemized deduction, before QBI, section 250 or disallowed personal exemptions. Retain a negative result."
    irsRef: "Form172 Part I line1; IRC172(d)(3),(8),(9)"
    testRef: "tests/engine/forms/form-172-origin.test.ts::reproduces the published historical 1775 origin loss"
  - line: "2"
    description: "Nonbusiness capital losses before limitation"
    formula: "Actual positive nonbusiness capital losses, excluding any section1202 exclusion."
    irsRef: "Form172 line2; i172 line2"
    testRef: "tests/engine/forms/form-172-origin.test.ts::reproduces the published historical 1775 origin loss"
  - line: "3"
    description: "Nonbusiness capital gains before exclusion"
    formula: "Actual nonbusiness capital gains before any section1202 exclusion."
    irsRef: "Form172 line3; IRC172(d)(2)"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "4"
    description: "Excess nonbusiness capital loss"
    formula: "max(0, line2-line3)."
    irsRef: "Form172 line4"
    testRef: "tests/engine/forms/form-172-origin.test.ts::reproduces the published historical 1775 origin loss"
  - line: "5"
    description: "Excess nonbusiness capital gain"
    formula: "max(0, line3-line2)."
    irsRef: "Form172 line5"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "6"
    description: "Nonbusiness deductions"
    formula: "Actual allowed nonbusiness deductions, including standard deduction or the nonbusiness itemized share and applicable above-line amounts. Business deductions stay outside this amount."
    irsRef: "i172 line6; IRC172(d)(4)"
    testRef: "tests/engine/forms/form-172-origin.test.ts::does not turn a standard deduction or an older loss into a new loss"
  - line: "7"
    description: "Nonbusiness income other than capital gains"
    formula: "Actual nonbusiness ordinary income, including taxable investment interest, dividends, retirement and Social Security amounts. Wages, unemployment and business income are not this line."
    irsRef: "i172 line7"
    testRef: "tests/engine/forms/form-172-origin.test.ts::reproduces the published historical 1775 origin loss"
  - line: "8"
    description: "Income available for nonbusiness deductions"
    formula: "line5+line7."
    irsRef: "Form172 line8"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "9"
    description: "Disallowed excess nonbusiness deductions"
    formula: "max(0, line6-line8)."
    irsRef: "Form172 line9"
    testRef: "tests/engine/forms/form-172-origin.test.ts::reproduces the published historical 1775 origin loss"
  - line: "10"
    description: "Remaining nonbusiness gain for business capital losses"
    formula: "min(line5,max(0,line8-line6))."
    irsRef: "Form172 line10"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "11"
    description: "Business capital losses"
    formula: "Actual business capital losses before limitation, positive."
    irsRef: "Form172 line11"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "12"
    description: "Business capital gains"
    formula: "Actual business capital gains before any section1202 exclusion."
    irsRef: "Form172 line12"
    testRef: "tests/engine/forms/form-172-origin.test.ts::reproduces the published historical 1775 origin loss"
  - line: "13"
    description: "Capital gain available for business capital losses"
    formula: "line10+line12."
    irsRef: "Form172 line13"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "14"
    description: "Excess business capital losses"
    formula: "max(0,line11-line13)."
    irsRef: "Form172 line14"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "15"
    description: "Total excess capital losses"
    formula: "line4+line14."
    irsRef: "Form172 line15"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "16"
    description: "Schedule D combined net capital loss"
    formula: "max(0,-actual ScheduleD net gain/loss). Capital source classifications must conserve that net amount. If no loss and no1202 exclusion, omit printed16-21."
    irsRef: "Form172 line16"
    testRef: "tests/engine/forms/form-172-origin.test.ts::requires conserved canonical whole-dollar amounts and explicit classification"
  - line: "17"
    description: "Section 1202 exclusion"
    formula: "The form directs the positive excluded amount here. Positive exclusion is currently a specific source-convention gate pending resolution of overlapping16-21 adjustments; explicit zero is supported."
    irsRef: "Form172 line17; IRC172(d)(2)(B)"
    testRef: "tests/engine/forms/form-172-origin.test.ts::requires conserved canonical whole-dollar amounts and explicit classification"
  - line: "18"
    description: "Capital loss less section 1202 exclusion"
    formula: "max(0,line16-line17), subject to the positive1202 source-convention boundary."
    irsRef: "Form172 line18"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "19"
    description: "Current capital loss deduction"
    formula: "min(line16,1500 if MFS else3000)."
    irsRef: "Form172 line19; IRC1211(b)"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "20"
    description: "Capital loss already excluded from current income"
    formula: "max(0,line18-line19)."
    irsRef: "Form172 line20"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "21"
    description: "Exclusion-related adjustment to current capital loss"
    formula: "max(0,line19-line18), subject to the positive1202 source-convention boundary."
    irsRef: "Form172 line21"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "22"
    description: "Additional disallowed capital loss"
    formula: "max(0,line15-line20)."
    irsRef: "Form172 line22"
    testRef: "tests/engine/forms/form-172-origin.test.ts::limits business capital losses after nonbusiness deductions"
  - line: "23"
    description: "Deduction for NOLs from other years"
    formula: "Actual other-year NOL deduction already included in AGI, restored once."
    irsRef: "Form172 line23; IRC172(d)(1)"
    testRef: "tests/engine/forms/form-172-origin.test.ts::does not turn a standard deduction or an older loss into a new loss"
  - line: "24"
    description: "Current-year original NOL"
    formula: "Signed sum of1+9+17+21+22+23; a negative amount is the new NOL. A nonnegative result establishes no new NOL. EBL is not added inside PartI."
    irsRef: "Form172 line24; i172 Excess Business Loss worksheet"
    testRef: "tests/engine/forms/form-172-origin.test.ts::reproduces the published historical 1775 origin loss"
