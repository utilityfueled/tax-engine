    formula: "ActualAMTI100000 and modified103000 give90000claimed and92700absorbed: first100000vintage retains7300, next100000retains100000. An unused2005carry expires after2025."
    irsRef: "IRC56(d)(1)(B)(ii),172(b)(2); Form6251line2f"
    testRef: "tests/engine/forms/alternative-tax-net-operating-loss.test.ts::conserves oldest-first source balances and actual expiry"
  - line: "canonical"
