    formula: "ScheduleC100000 less7065halfSE gives92935business AGI before capital loss/NOL. Regularclaim59348 leaves30587AGI and2967QBI. Current AMTI before ATNOLD86968 allows78271. Modified carry removes capital loss and199A, yielding92935AMTI and83642absorption."
    irsRef: "IRC172(d)(8),56(d)(1)(B)(ii); Form172PartIIline5; Reg1.55-1(b)"
    testRef: "tests/engine/federal-nol-return.test.ts::removes QBI from modified alternative carry income without removing it from current AMTI"
  - line: "current-and-carry"
