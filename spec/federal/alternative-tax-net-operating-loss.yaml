form: "Alternative tax NOL carry worksheets"
fullName: "Separate current ATNOLD and modified-AMTI carry absorption"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i6251"
notes: |
  Form6251 line2f and IRC56(a)(4),(d) replace the regular deduction with the
  separate alternative-tax deduction. Ordinary ATNOL carry is limited to90%
  of AMTI before ATNOLD. Section56(d)(1)(B)(ii) requires the corresponding
  modified-income carry adjustment. Reg1.55-1(b) retains regular-tax AGI/MAGI
  for individual AGI-based items. Separate source histories are required;
  regular carry is never copied into the AMT ledger. Exceptional historical
  disaster/extended-carryback amounts and unrepresented AMT basis/loss-limit
  differences require their actual separate method.
  These numerical examples are derived applications of the sources, not
  published IRS worked examples. The90% limit is rounded once; the complementary
  reserve is the modified base less that rounded limit, conserving form dollars.
lines:
