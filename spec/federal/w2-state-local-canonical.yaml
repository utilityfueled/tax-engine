form: "W2-State-Local-Canonical"
fullName: "Actual original W2 rows through canonical source input"
taxYear: 2026
reference: "https://www.irs.gov/instructions/iw2w3"
notes: "This schema admission supports2025/2026 sources without enabling incomplete2026 law or filing."
lines:
  - line: "retain-original"
    description: "Preserve the complete current per-W2 state/local source packet"
    formula: "Parse stateLocalSources with its dedicated strict source model, retaining exact original owner/year/printed rows and actual zero amounts. Do not silently strip a present packet. Source validation and jurisdiction/eligibility checks remain separate."
    testRef: "tests/engine/w2-state-local-canonical.test.ts::canonical W2 actual rows retain original facts through input parsing"
  - line: "reject-malformed"
    description: "Stop malformed actual packets before calculation"
    formula: "Reject malformed per-W2 source structures, instead of discarding the evidence and using an incomplete legacy scalar result."
    testRef: "tests/engine/w2-state-local-canonical.test.ts::canonical W2 actual rows reject malformed source packets"
  - line: "independent-exact"
    description: "Exact original cents above binary integer range"
    formula: "Sum9007199254740993.01+0.02 state and0.04+0.05local gives9007199254740993.12 using Decimal."
    testRef: "tests/engine/w2-state-local-independent.test.ts::independent W2 retains exact cents above binary integer range"
  - line: "independent-zero"
    description: "Known zero preserves one federal economic original"
    formula: "Actual all-row zero withholding remains0; one Box1=50000 and Box2=5000 remain counted once."
    testRef: "tests/engine/w2-state-local-independent.test.ts::independent W2 known zero retains federal original once"
  - line: "independent-unknown"
    description: "Unknown row withholding stops federal output"
    formula: "A present blank amount is unknown, never a second-row zero."
    testRef: "tests/engine/w2-state-local-independent.test.ts::independent W2 rejects missing known row amount before any federal result"
  - line: "independent-duplicate"
    description: "Copied state pages do not create federal economic income"
    formula: "An indistinguishable copied W2 federal original with altered scalar state row must reject."
    testRef: "tests/engine/w2-state-local-independent.test.ts::independent W2 rejects duplicate federal economic source with altered state row"
  - line: "independent-private"
    description: "Source commitments keep private identifiers out of published projections"
    formula: "Output includes SHA256 and actual row positions/amounts, without raw owner/EIN/stateID/locality identity."
    testRef: "tests/engine/w2-state-local-independent.test.ts::independent W2 output exposes digest and row positions without private identifiers"
  - line: "independent-pa"
    description: "Actual PA printed wages reconcile once"
    formula: "OHfirst/PAsecond with overlapping50000 wages yields PAcompensation50000 and tax1535; PArow49999.99 contradicting actualpayroll rejects."
    testRef: "tests/engine/w2-state-local-independent.test.ts::independent W2 selects actual PA row without adding overlapping wages"
