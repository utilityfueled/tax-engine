form: "Schedule 1-A vehicle refinancing"
fullName: "Actual original and refinanced vehicle indebtedness"
taxYear: 2025
irsReference: "https://www.irs.gov/irb/2026-39_irb"
retrievedAt: "2026-10-25"
reviewStatus: "independent-review-pending"
notes: "T.D.10054 final1.163-16(d)(2),(4),(6) and(g); publishedSeptember2026, effectiveNovember9,2026, applicable2025-2028 under(i). Both2025/2026 calculation methods remain subject to independent qualification; no year or filing gate is enabled."
lines:
  - line: "original-financing"
    description: "Compute the original qualifying financed portion from actual purchase records"
    formula: "Require actual purchase-qualified costs, other purchase costs, down payment and principal; principal=qualified+other-downPayment>0. Apply the down payment first to nonqualifying costs. Original SPVL=min(principal, qualified purchase costs), provided the original actual first lien, unrelated lender and original obligor requirements hold. Preserve actual unknown and zero; no loan or source amount is inferred."
    irsRef: "1.163-16(d)(2), examples4 and5; 26USC163(h)(4)"
    testRef: "tests/engine/schedules/vehicle-refinancing.test.ts::uses the published original financing allocations before refinancing"
  - line: "refinancing-chain"
    description: "Carry only the actual qualifying outstanding debt into each refinancing"
    formula: "With no further advances or capitalized-interest additions and pro-rata principal payments, outstanding SPVL=actual prior balance*prior SPVL/prior principal. New SPVL=min(actual new principal, outstanding SPVL); unrelated borrowing or fees added in refinancing do not increase this amount. Allocate each loan's current-year interest pro rata to its SPVL portion, then subtract actual independently deducted and other excluded interest from that qualifying portion. Sum exact amounts before the existing Schedule1A rounding,10000cap and MAGI phase-down."
    irsRef: "1.163-16(d)(4),d(2)(iii),g; 26USC163(h)(4)(E)(ii)"
    testRef: "tests/engine/schedules/vehicle-refinancing.test.ts::conserves actual interest through cash-out and repeated refinancings"
  - line: "source-boundary"
    description: "Require complete chronological loan and payment sources"
    formula: "Require actual year,VIN,source references,all-loans confirmation,ordinary pro-rata principal method and original-borrower continuity. Link each refinancing to the preceding source exactly once, with valid dates and actual balances no greater than the preceding principal. A paid-off loan before the receipt year has zero current-year interest. Source interest and independent exclusions reconcile exactly to the original Schedule1A source totals; latest lender/account,first-lien and related-party facts match the selected loan. Reject missing,conflicting,negative or nonfinite facts."
    irsRef: "1.163-16(c)(2),(3),(5),d(4)-(5); original documents and accounting-year requirements"
    testRef: "tests/engine/schedules/vehicle-refinancing.test.ts::rejects incomplete or contradictory original loan sources"
  - line: "qualification-and-return"
    description: "Retain per-loan eligibility and canonical return effects"
    formula: "Unknown qualification rejects; an actually ineligible loan contributes zero and cannot create a qualifying balance in a later refinance. Earlier eligible interest remains separate from an ineligible later loan. Retain actual owner and vehicle qualification and apply the existing per-return cap and phase-down once. Deduction reduces taxable income after AGI and does not change payroll/withholding;2026 entry gates stay closed."
    irsRef: "26USC163(h)(4); Schedule1A lines22-30;1.163-16(d)(3)-(5),h"
    testRef: "tests/engine/schedules/vehicle-refinancing.test.ts::retains earlier eligible interest and applies the return limit once"
  - line: "rounding-and-limits"
    description: "Apply one return cap and exact dollar rounding after allocation"
    formula: "Keep exact Decimal source amounts and ratios through all loans. Sum eligible interest, apply the10000per-return cap and the200per1000or-fraction MAGI reduction at100000(200000joint), floor at zero, then round to nearest whole dollar with halves up. Actual zero interest remains zero. MFS is not the separate tips/overtime prohibition."
    irsRef: "Schedule1A lines23-30;26USC163(h)(4)(C)"
    testRef: "tests/engine/schedules/vehicle-refinancing.test.ts::retains cents zero and exact cap and filing-status boundaries"
