lines:
  - line: "worksheet-1-line-5-source"
    description: "Preserve actual Puerto Rico and American Samoa excluded income"
    formula: "Store each actual nonnegative excluded income amount, including zero, and separate source confirmation. Omission remains unknown; never infer the source amounts from another credit's eligibility or from an omitted exclusion form. Federal orchestration adds these actual exclusions to Publication 915 Worksheet 1 line 5 once."
    irsRef: "Publication 915 Worksheet 1 line 5: certain income of bona fide residents of American Samoa (Form 4563 line 15) or Puerto Rico"
    testRef: "tests/engine/forms/social-security-source-facts-schema.test.ts::preserves unknown versus zero Social Security possession exclusion facts"
  - line: "worksheet-1-line-5-return"
    description: "Add actual possession exclusions once in the Social Security worksheet"
    formula: "Add confirmed Puerto Rico and American Samoa source amounts to known foreign/adoption exclusions. A supplied facts object, or a 2026 return with positive benefits, requires both actual amounts and source confirmation. A lump-sum aggregate replaces this complete amount and must not be smaller; never add the aggregate a second time."
    irsRef: "Publication915 Worksheet1 line5 and Worksheet4 current-year computation"
    testRef: "tests/engine/federal-income-exclusion-addbacks.test.ts::adds actual possession exclusions once and reconciles lump-sum aggregates"
  - line: "unknown-possession-source"
    description: "Do not replace a missing possession exclusion source with zero"
    formula: "Reject unconfirmed, incomplete, negative or nonfinite supplied possession sources before calculating taxable benefits; explicit0/0 remains supported."
    testRef: "tests/engine/federal-income-exclusion-addbacks.test.ts::rejects unknown possession exclusion facts and preserves explicit zero"
