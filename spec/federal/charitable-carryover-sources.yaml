form: "Charitable carryover source worksheet"
fullName: "Actual individual charitable category and vintage history"
taxYear: 2025
irsReference: "https://www.irs.gov/publications/p526"
retrievedAt: "2026-10-25"
reviewStatus: "independent-review-pending"
notes: |
  Separate actual prior sources from current-only Publication526 Worksheet2.
  Controlling carry methods are IRC170(b)(1)(B/C/D/G),170(d)(1), and
  Reg1.170A-10(b)/(c). The older regulation's cash50 and private-no-carry
  statements do not supersede subsequent statutes. This package initially
  implements ordinary2025 category history;2026 floor/nonitemizer coordination,
  changed filing units, conservation/election changes and binding prior-G with
  current public property remain separate methods, with all source facts retained.
lines:
  - line: "history"
    description: "Actual source history conserves original excess"
    formula: "Require actual year, return identity, unchanged calendar-year filing unit, complete confirmed ledger and each vintage's category/medium/original excess/origin NOL reduction. Every intervening year has actual treated-paid and NOL-reduction amounts including explicit zero. Opening=original excess-origin reduction-sum(history amounts), exactly and without negative remainder. No aggregate is assigned an origin year or cash category."
    testRef: "tests/engine/forms/charitable-carryover.test.ts::validates actual category history without inventing missing years or amounts"
  - line: "public-cash"
    description: "Published public cash current and carry example"
    formula: "Pub526 Carryovers Example1: base20000,currentG9500,priorG1000 gives9500current+1000prior=10500. Current category precedes carry; prior vintages use FIFO. Exact cents survive all intermediate capacities."
    testRef: "tests/engine/forms/charitable-carryover.test.ts::matches published public cash carryover and exact FIFO capacities"
  - line: "public-capital-private"
    description: "Prior public capital property before current private ordinary gifts"
    formula: "Pub526 Carryovers Example2: base24000,currentG6000,currentB3000,priorC5000 gives currentG6000,currentB1000,priorC5000,total12000 and currentBcarry2000. Current private gifts cannot consume capacity reserved for actual prior public gifts."
    testRef: "tests/engine/forms/charitable-carryover.test.ts::matches published public capital carry before current private contributions"
  - line: "a-c"
    description: "Distinct prior ordinary public and capital-gain capacities"
    formula: "Reg1.170A-10(b)(2)/(c)(2): currentC is first limited to30percent for the public carry capacity. PriorA uses remaining50percent after current public gifts; priorC uses the lesser remaining30percent and50percent after current public gifts and priorA. Actual category FIFO is preserved. Derived base50000,currentC40000,priorA10000 gives15000currentC+10000priorA, not an invented40000 reservation."
    testRef: "tests/engine/forms/charitable-carryover.test.ts::limits current capital property before reserving ordinary public carry capacity"
  - line: "expiry"
    description: "Fifth succeeding year is the last deduction year"
    formula: "Use actual eligible capacity in origin+5, then expire that vintage's unused remainder; older balances never deduct. Opening=treated-paid+expired+remaining. A same-category later vintage cannot displace an earlier eligible vintage."
    testRef: "tests/engine/forms/charitable-carryover.test.ts::uses the fifth year then expires its remainder with exact conservation"
  - line: "standard"
    description: "Standard deduction consumes prior carry capacity without a deduction"
    formula: "Reg1.170A-10(b)(2)/(c)(2) treat the available capacity as paid in a standard-deduction carry year. Retain separate treated-paid and deductible values; original category/year never reset."
    testRef: "tests/engine/forms/charitable-carryover.test.ts::distinguishes carry absorption from a standard-deduction charitable deduction"
  - line: "selected-return"
    description: "Final deduction choice separates candidate use from actual deduction"
    formula: "Retain ScheduleA as the itemized candidate. After the canonical final choice, expose a separate actual treatment: standard2025 deduction0, prior amountUsed0 but actual treated-paid unchanged and remaining/expired balances unchanged; itemizing uses the canonical candidate deduction and actual prior use. Derived base24000/currentcash7000/priorproperty5000 with no other itemized amounts selects standard15750, absorbs5000 and retains currentprivatecash2000 carry."
    testRef: "tests/engine/schedules/schedule-a-charity-history.test.ts::retains actual standard-year absorption after the final deduction choice"
  - line: "unknown-methods"
    description: "Preserve unsupported source methods"
    formula: "Unknown/changed membership, missing source confirmations, unsupported category/election/2026 floor transition, or binding prior G with current public property must reject with an actual-source requirement. When every public contribution fits within50percent and all public capital fits30percent, all are fully allowed without a disputed priority. No category is inferred from a monetary total."
    testRef: "tests/engine/forms/charitable-carryover.test.ts::rejects unsupported methods and contradictory legacy balances"
  - line: "nonbinding-public"
    description: "Full allowance does not require an invented category priority"
    formula: "If current plus eligible prior public cash and property together fit within50percent of base and public capital fits30percent, every public amount is allowed. Derived base100000,currentG20000.49,currentA10000.51,priorG1234.49 preserves all exact amounts. Binding mixed-G methods remain rejected."
    testRef: "tests/engine/forms/charitable-carryover.test.ts::preserves fully allowed public gifts without inventing a binding priority"
  - line: "review"
    description: "Prior property review uses actual physical13 and exact source groups"
    formula: "Copy only unique canonical reported11/12/13/14 after original-source digest and exact cash/noncash/prior group reconciliation. Prior medium is actual, never inferred from the physical line. Changed source category, missing medium or changed exact retained use rejects before template I/O."
    testRef: "tests/pdf/schedule-a-charity-history.test.ts::maps prior noncash to line13 and rejects stale source grouping"
  - line: "review-identifiers"
    description: "Taxpayer identity suffixes remain in the encrypted original only"
    formula: "After actual source identity validation, render-only copies clear primaryTaxpayerIdLast4 and spouseTaxpayerIdLast4 recursively, including prior charitable and NOL source histories. Preserve original facts and exact money; prepared source contexts still bind only original or exact redacted copies."
    testRef: "tests/pdf/review-identifier-redaction.test.ts::removes taxpayer last-four source identifiers without changing original histories"
  - line: "prepared-source-identity"
    description: "Original taxpayer identity is validated before render-only redaction"
    formula: "A server-local opaque token validates the complete original charitable history, binds its actual taxpayer/source identity and accepts only that exact original or fully redacted projection. A changed identity suffix, partial redaction, fabricated token or changed history rejects before template access. Without a token, validate the complete original source directly; never reconstruct omitted identifiers."
    testRef: "tests/pdf/schedule-a-charity-history.test.ts::requires original prepared charity identity for redacted rendering"
  - line: "schema"
    description: "Optional source fields remain unknown until calculation"
    formula: "Parsing an incomplete source packet preserves omissions and explicit false, does not generate an empty ledger, zero amount, category or identity."
    testRef: "tests/engine/forms/charitable-carryover.test.ts::preserves unknown and explicit false source facts on parsing"
  - line: "prepared-packet"
    description: "Packet rendering forwards the original charity context"
    formula: "Prepare original history before render redaction, then pass the opaque token through the packet to ScheduleA. Original source facts remain unchanged; reopened physical13 retains the actual prior amount and the render taxpayer identifier is blank."
    testRef: "tests/pdf/schedule-a-charity-history.test.ts::forwards prepared charity history through the redacted review packet"
  - line: "facts-only-validation"
    description: "Intake and review share original history validation without an income estimate"
    formula: "Validate actual taxpayer identity, source year, category, medium, complete intervening use/reduction history and exact opening conservation using only source facts. The source validator computes no deduction and accepts no fabricated contribution base.2026 source validation does not open the separate calculation gate."
    testRef: "tests/engine/forms/charitable-carryover-source-validation.test.ts::validates complete source histories without an income or deduction context"
  - line: "schedule-a"
    description: "Actual prior property stays on physical line13"
    formula: "ScheduleA consumes the separate actual history worksheet. Current cash/noncash print on11/12; all prior actual use prints on13. Computational aliases retain their actual cash/noncash medium; exact source groups remain bound before14 reporting. A positive legacy aggregate or category/year list without the actual history packet rejects instead of becoming current cash."
    testRef: "tests/engine/schedules/schedule-a-charity-history.test.ts::uses actual prior property history without relabeling it as current cash"
  - line: "legacy-migration"
    description: "Preserve unsupported old balances for source completion"
    formula: "A saved prior aggregate or year list remains unchanged while calculation requests the actual origin/category/history. Omission of the source packet cannot manufacture prior-year cash or reset an expiration date."
    testRef: "tests/engine/schedules/schedule-a-charity-history.test.ts::rejects unclassified legacy prior balances without mutating them"
  - line: "legacy-reconciliation"
    description: "A complete actual ledger can reconcile an older unclassified saved balance"
    formula: "A legacy year row without category reconciles that whole year's actual sourced opening; a row with category reconciles only that actual category. Reject overlap, duplicates, inconsistent totals or omitted actual positive categories. The source packet supplies the category; legacy totals never supply an inferred category."
    testRef: "tests/engine/forms/charitable-carryover.test.ts::reconciles saved unknown categories only against complete actual source history"
