form: "Guided interview annual source amounts"
fullName: "Alimony and Schedule H confirmation after a guided return-year change"
taxYear: 2025
reference: "https://www.irs.gov/instructions/i1040sh"
notes: "Selecting paid alimony opens Adjustments. Selecting household employment opens Other Taxes. Changing confirmed facts revokes the confirmation. Formatting the same amount preserves it. A converter must receive the matching return year before using year-bound amounts."
lines:
  - line: "retained-alimony-payments"
    description: "Confirm which return year the retained alimony payments belong to"
    formula: "After changing or clearing an existing return year, retain the entered amount and instrument and payment eligibility facts. Keep the Adjustments section available and require explicit confirmation that the amount and payment facts apply to the selected year before using them. Preserve blank versus explicit zero. A same-year legacy draft may still use its existing facts. An omitted amount does not require confirmation."
    irsRef: "Final 2025 Publication 504, How To Deduct Alimony (https://www.irs.gov/publications/p504); final 2025 Form 1040 instructions, Schedule 1 lines 19a through 19c (https://www.irs.gov/instructions/i1040gi)"
    testRef: "tests/guided-interview/guided-alimony-household-return-year.test.ts::requires renewed alimony confirmation after changing the return year"
    testRefs:
      - "tests/guided-interview/guided-alimony-household-return-year.test.ts::renews both confirmations when the reducer edits actual facts"
      - "tests/guided-interview/guided-alimony-household-return-year.test.ts::keeps dormant qualification and FUTA facts pending when new amounts are entered"
      - "tests/guided-interview/guided-alimony-household-return-year.test.ts::routes initial alimony and household employment from their own life events"
      - "tests/guided-interview/guided-alimony-household-return-year.test.ts::confirms each section through its own control and requires review again after edits"
  - line: "retained-household-amounts"
    description: "Confirm which return year the retained household payroll facts belong to"
    formula: "After changing or clearing an existing return year, retain actual employee wages, withholding, exclusion answers, and unemployment records. Keep the Other Taxes section available and require explicit confirmation that the retained facts apply to the selected year. Review the FUTA test using qualifying wages for the selected or preceding year, and continue to require state unemployment periods to match the selected year. Preserve entered amounts exactly, including zero. Omitted amounts do not require confirmation."
    irsRef: "Final 2025 Schedule H instructions, lines 1, 3, 7 and 9 (https://www.irs.gov/instructions/i1040sh); 2026 Publication 926 (https://www.irs.gov/publications/p926); draft 2026 Schedule H (https://www.irs.gov/pub/irs-dft/f1040sh--dft.pdf)"
    testRef: "tests/guided-interview/guided-alimony-household-return-year.test.ts::requires renewed household confirmation and keeps the FUTA source history"
    testRefs:
      - "tests/guided-interview/guided-alimony-household-return-year.test.ts::renews both confirmations when the reducer edits actual facts"
      - "tests/guided-interview/guided-alimony-household-return-year.test.ts::keeps dormant qualification and FUTA facts pending when new amounts are entered"
      - "tests/guided-interview/guided-alimony-household-return-year.test.ts::routes initial alimony and household employment from their own life events"
      - "tests/guided-interview/guided-alimony-household-return-year.test.ts::distinguishes omitted amounts from explicit zero"
      - "tests/guided-interview/guided-alimony-household-return-year.test.ts::confirms each section through its own control and requires review again after edits"
