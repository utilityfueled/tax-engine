form: "Form 8949"
fullName: "Sales and Other Dispositions of Capital Assets"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i8949"

notes: |
  Form 8949 reports individual capital asset transactions. Transactions are
  categorized by holding period (Part I: short-term, Part II: long-term) and
  by original reporting document and basis reporting.1099-B uses A/B/D/E;
  1099-DA uses G/H/J/K. Transactions with neither use C/F for other capital
  assets and I/L for digital assets. See form-8949-digital-reporting.yaml for
  the source guards, complete category conservation and physical review maps.
  Totals flow to Schedule D. Original source facts are never inferred from
  basis reporting or from a digital-asset flag alone.

lines:
  - line: "original-b-disposition-year"
    description: "Reconcile every explicit original1099-B Box1c disposition date before calculating capital gain"
    formula: "For each original form1099B transaction whose sourceDocumentType is1099-b or historically omitted, an explicit YYYY-MM-DD dateSold must have the selected return year. Inspect every row, including zero gains and matching statement headers; an absent header does not erase an explicit disposition date. Hold either year mismatch for actual source reconciliation; never drop a row or infer a year from furnishing/correction. Compare a trimmed date view without rewriting the original. Acquisition dates may be earlier years or VARIOUS."
    irsRef: "2025 Instructions1099-B Box1c and Instructions8949 Column(c)"
    testRef: "tests/engine/forms/form-8949-disposition-year.test.ts::holds every explicit original broker disposition outside the return year"
  - line: "original-b-disposition-preservation"
    description: "Preserve current-year closing dates and legacy unknown or summary dates without manufacturing facts"
    formula: "Matching valid canonical disposition dates retain exact proceeds/basis/adjustments and source immutability. Box1c is a short sale closing delivery date, not its opening/acquisition year. An absent legacy disposition date, a blank value, or named summary/unknown text remains the existing unverified representation, including named summary text with a year, leading transaction count or month word without adjacent date components. This guard does not qualify summaries or infer an actual date. Original statement-year and withholding admission checks remain unchanged."
    irsRef: "2025 Instructions1099-B Short sales and Box1c; Instructions8949 Exceptions1/2 and Column(c)"
    testRef: "tests/engine/forms/form-8949-disposition-year.test.ts::preserves matching closings cross-year acquisitions and unknown summary dates"
  - line: "original-b-disposition-calendar"
    description: "Hold invalid or noncanonical date-like Box1c originals for reconciliation"
    formula: "A date-like original B value must be exactly YYYY-MM-DD in its trimmed view and round-trip as the same finite UTC calendar day. Hold alternate numeric formats (including compact or whitespace-delimited dates), timestamps, unpadded dates, and impossible month/day/leap dates. Hold named-month dates with adjacent day/month/year components, including compact values such as 31DEC2024, or a standalone month and day or year. Canonical-shaped different-year dates retain the earlier disposition-year diagnostic. Calendar validation does not alter the original or acquisition-date semantics, and is not applied to separate reporting methods."
    irsRef: "2025 Instructions1099-B Box1c; Instructions8949 Column(c)"
    testRef: "tests/engine/forms/form-8949-disposition-year.test.ts::holds noncanonical and impossible date-like original broker dispositions"
  - line: "legacy-direct-broker-disposition-absence"
    description: "Preserve older direct state-calculation inputs without a Box 1c value"
    formula: "A legacy broker transaction with an absent dateSold property remains undated when Pennsylvania calls the federal projection. Use the existing amounts without marking the missing date as confirmed. Explicitly supplied date-like values still require reconciliation."
    irsRef: "2025 Instructions1099-B Box1c; Instructions8949 Exceptions1/2 and Column(c)"
    testRef: "tests/engine/state/pa-orchestrator.test.ts::PA orchestrator end-to-end: diversified income across all 8 classes"
  - line: "separate-capital-source-methods"
    description: "Keep digital-asset nonstatement and Section1256 source methods separate"
    formula: "Do not apply the original1099-B date check to explicitly1099-DA or not-reported rows, derived QOF inclusion or Form6781 mark-to-market aggregates. Their existing source/actual-event validators and annual gates remain intact; no new exemption or trust flag is accepted."
    irsRef: "2025 Instructions1099-B Boxes8–11; Instructions8949 ScheduleD and original reporting categories"
    testRef: "tests/engine/forms/form-8949-disposition-year.test.ts::preserves separate digital nonstatement and section1256 methods"
  # ── Part I: Short-Term ───────────────────────────────────
  - line: "Part I Box A"
    description: "Short-term transactions with basis reported to IRS"
    formula: "Filter 1099-B transactions: holdingPeriod=short AND basisReportedToIRS=true"
    irsRef: "Form 8949 Instructions, Part I"
    inputs:
      - "1099-B transactions (short-term, basis reported)"
    testRef: "tests/engine/forms/form-8949.test.ts::Form 8949 Part I Box A - short-term basis reported"

  - line: "Part I Box B"
    description: "Short-term transactions with basis NOT reported to IRS"
    formula: "Filter 1099-B transactions: holdingPeriod=short AND basisReportedToIRS=false"
    irsRef: "Form 8949 Instructions, Part I"
    testRef: "tests/engine/forms/form-8949.test.ts::Form 8949 Part I Box B - short-term basis not reported"

  - line: "Part I totals"
    description: "Short-term totals (proceeds, cost basis, adjustments, gain/loss)"
    formula: "Sum of all Part I transactions: proceeds, cost, adjustments, gain/loss columns"
    irsRef: "Form 8949 Instructions, Part I Line 2"
    testRef: "tests/engine/forms/form-8949.test.ts::Form 8949 Part I totals - short-term summary"

  # ── Part II: Long-Term ───────────────────────────────────
  - line: "Part II Box D"
    description: "Long-term transactions with basis reported to IRS"
    formula: "Filter 1099-B transactions: holdingPeriod=long AND basisReportedToIRS=true"
    irsRef: "Form 8949 Instructions, Part II"
    testRef: "tests/engine/forms/form-8949.test.ts::Form 8949 Part II Box D - long-term basis reported"

  - line: "Part II Box E"
    description: "Long-term transactions with basis NOT reported to IRS"
    formula: "Filter 1099-B transactions: holdingPeriod=long AND basisReportedToIRS=false"
    irsRef: "Form 8949 Instructions, Part II"
    testRef: "tests/engine/forms/form-8949.test.ts::Form 8949 Part II Box E - long-term basis not reported"

  - line: "Part II totals"
    description: "Long-term totals (proceeds, cost basis, adjustments, gain/loss)"
    formula: "Sum of all Part II transactions"
    irsRef: "Form 8949 Instructions, Part II Line 2"
    testRef: "tests/engine/forms/form-8949.test.ts::Form 8949 Part II totals - long-term summary"

  # ── Wash Sale Handling ───────────────────────────────────
  - line: "adjustment-W"
    description: "Wash sale loss disallowed (Code W)"
    formula: "If wash sale, adjustment = washSaleDisallowed (positive, added back to reduce loss)"
    irsRef: "Form 8949 Instructions, Column (g) Code W"
    edgeCases:
      - "Disallowed loss added to cost basis of replacement shares"
      - "Wash sale: substantially identical security bought within 30 days before/after sale"
      - "Applies to both short-term and long-term transactions"
    testRef: "tests/engine/forms/form-8949.test.ts::Form 8949 wash sale adjustment"

  # ── Flow to Schedule D ──────────────────────────────────
  - line: "to-schedule-d"
    description: "Totals flow to Schedule D"
    formula: |
      Part I A+G → Schedule D1b; B+H →2; C+I →3
      Part II D+J → Schedule D8b; E+K →9; F+L →10
      Current transactions appear on8949; the optional1a/8a bypass is not used.
    irsRef: "Schedule D Instructions, Lines 1-3 and 8-10"
    testRef: "tests/engine/forms/form-8949.test.ts::Form 8949 totals flow to Schedule D"
