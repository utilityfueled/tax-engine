form: "Guided Form2210 actual sources"
fullName: "Actual prior-return and dated-payment history"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i2210"
notes: "Regular calendar-year resident method only. Current tax and withholding are canonical calculations, never user overrides. Unpublished future interest rates and unsupported relief/annualization methods remain explicit calculation boundaries."
lines:
  - line: "actual-history"
    description: "Preserve actual source year and prior-return eligibility"
    formula: "Require actual matching source year, reference, confirmation, method and applicable prior-year status/full-year/tax/AGI/residence/joint facts. Collect prior-year tax before the high-income110% multiplier; the canonical calculation applies it once. No return does not create a prior-year zero tax. Explicit known zero and negative actual prior AGI remain exact."
    irsRef: "Form2210 Instructions PartI line8; Exceptions; Higher income taxpayers"
    testRef: "tests/guided-interview/guided-estimated-tax-facts.test.ts::preserves actual prior history and known zero without creating missing facts"
  - line: "payment-origin"
    description: "Applied credits retain actual IRS-effective dates"
    formula: "Each dated applied-credit entry links an actual prior-return credit; exact linked amounts must conserve that original source. Never derive an effective date from the originating tax year. Estimated/extension/return payments retain their distinct categories and dates."
    irsRef: "Form2210 Instructions PartIII line11 and Table1"
    testRef: "tests/guided-interview/guided-estimated-tax-facts.test.ts::reconciles actual effective credit dates per original source"
  - line: "scope"
    description: "Unknown and unsupported methods do not become regular-method assumptions"
    formula: "Keep fiscal/nonresident/farmer/relief/waiver/annualized answers and entered histories intact while reporting the missing separate method. Validate actual date windows and finite nonnegative payments, including zero. Full-payment and filing dates are paired actual facts."
    irsRef: "Form2210 Instructions Special rules, Waiver, PartIII and ScheduleAI"
    testRef: "tests/guided-interview/guided-estimated-tax-facts.test.ts::rejects unsupported or contradictory source history without guessing"
  - line: "canonical"
    description: "Dated facts reach the actual return penalty"
    formula: "Use canonical tax/withholding and actual dated payments. Synthetic2025 single50000 wages gives3875 table tax,3488 required annual payment and102 penalty for4000 paid the next January15; a late catch-up does not erase earlier underpayments."
    irsRef: "Form2210 Instructions PartIII;2025 Tax Table34250-34300 single"
    testRef: "tests/guided-interview/guided-estimated-tax-facts.test.ts::calculates the dated penalty from guided sources without a tax override"
  - line: "confirmation"
    description: "Source changes revoke confirmation without erasing history"
    formula: "Substantive household, income, credit, deduction or payment edits revoke the worksheet confirmation. Confirmation-only edits do not create cycles. Legacy absent worksheets stay absent and retain their explicit calculation boundary."
    irsRef: "Form2210 Instructions PartI and PartIII source reconciliation"
    testRef: "tests/guided-interview/guided-estimated-tax-facts.test.ts::revokes stale confirmation while preserving source history"
  - line: "interactive"
    description: "Actual unknown-zero-date controls"
    formula: "Provide explicit unanswered controls and real source-record additions/changes/removals. Preserve exact monetary strings and never send source facts during local entry."
    irsRef: "Form2210 Instructions PartI line8 and PartIII line11"
    testRef: "tests/apps/web/estimated-tax-source-interactions.test.tsx::collects actual history and dates while preserving unknowns and exact amounts"
  - line: "withholding-and-proven-zero"
    description: "Actual timing must reconcile and actual zero can prove a safe harbor"
    formula: "The statutory tax-minus-withholding under1000 exception applies regardless of timing. Otherwise canonical withholding sources reconcile every elected dated amount:2025 single85000 wages has10155 table tax and9140 withholding on December31 gives248 penalty. An actual no-tax-liability/full-year citizenship or residence history can establish zero penalty for2026 without inventing an unpublished future rate."
    irsRef: "Form2210 Instructions Exceptions and PartIII line11"
    testRef: "tests/guided-interview/guided-estimated-tax-facts.test.ts::binds actual withholding dates to canonical withholding and supports proven2026 zero"
  - line: "prior-tax-multiplier"
    description: "Collect prior tax before the high-income multiplier"
    formula: "Actual prior-year tax5000 and prior AGI150001 establish a5500 prior-year comparison for a2025 single filer, applying110% exactly once. Timely actual payments of1375 per installment establish zero penalty."
    irsRef: "Form2210 Instructions PartI line8 and Higher income taxpayers"
    testRef: "tests/guided-interview/guided-estimated-tax-facts.test.ts::applies the prior-tax high-income multiplier once to the original amount"
