notes: |
  IRC465(a)(2) treats a disallowed activity loss as an activity deduction in the
  succeeding year. Final i6198 PartI includes prior nondeductible amounts in their
  original ordinary, capital or other-deduction character. Reg1.469-2T(d)(6)(iii)
  apportions disallowed loss among deductions; (iv) removes basis-disallowed
  items first. An already basis-allowed historical465 amount is not subjected to
  basis again or included in the current K1 original charitable boxes.
  https://uscode.house.gov/us/usc/119-120/t26/s465/
  https://www.ecfr.gov/current/title-26/section-1.469-2T
  https://www.irs.gov/publications/p925
  The existing vintage totals are preserved and reconciled to complete original
  character records. Each original post-basis deduction, closing disallowance,
  subsequent annual actual use and source year remains distinct. Original gift
  payment, basis origin, category, recipient and valuation are not overwritten by
  the year an amount is released from465. No current allowance is an input.
  Positive current income must stay separate from current and prior deductions
  before applying the common disallowed fraction. Charity remains outside469.
  Reg1.199A-3(b)(1)(iv) separately preserves original qualified/nonqualified and
  pre2018 character and applies QBI FIFO when deductions are finally allowed;
  QBI FIFO is not a new priority for the section465 or469 deduction allocation.
  https://www.ecfr.gov/current/title-26/section-1.199A-3
  This source contract supports the continuing ordinary activity method. The
  separate2026 prior-gift contribution-year/floor interpretation is not inferred.
  The bounded source, canonical, guided and saved-review paths preserve these
  distinctions. Agent source/software review does not establish human tax-law
  qualification or support for the separate named interpretation boundaries.
  The2025 Form8995 QBI Loss Tracking Worksheet ColumnC uses actual prior
  deductions allowed under the current provision. FIFO does not replace465
  tax allocation between current and prior deductions. ColumnD and Row3 then
  allocate any later disallowance by the utilized qualified/nonqualified ratio;
  the later provision records a new suspension year while original source
  provenance remains retained. https://www.irs.gov/instructions/i8995
  Passive deduction allocation is ratable under1.469-1T(f)(2)(ii), distinct
  from the QBI FIFO character ledger.
