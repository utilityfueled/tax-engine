notes: |
  Retrieved final2025 Schedule EIC and instructions on2026-10-26. Refreshed
  https://www.irs.gov/publications/p596 and https://www.irs.gov/instructions/i1040gi.
  Schedule EIC requires the Child1 attachment for a source-qualified child
  without a timely valid SSN when the parent claims the self-only EIC. Its
  original ITIN/ATIN/nonwork SSN is retained; an actual blank stays blank.
  Source-derived child presence also governs the1040 childless checkbox path.
  The649/3409 controls are independent final2025 EIC table values at10000.
  This changes review mapping only, not tax computation or public readiness.
  Special residence periods and contested claims retain existing source gates.
