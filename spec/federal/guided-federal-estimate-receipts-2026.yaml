lines:
  - line: "2026 estimated tax payments"
    description: Admit each actual 2026 federal estimated payment once
    formula: >-
      Hold 2026 guided federal estimates that reuse the same actual payment
      reference. When positive estimates share the same calendar date and exact
      Decimal amount, require distinct references from actual processed
      payments. Preserve each admitted estimate and its original date and amount.
      This intake change leaves 2026 extension payments, annual calculations,
      and export qualification unchanged.
    irsRef: "Final 2026 Form 1040-ES (https://www.irs.gov/pub/irs-pdf/f1040es.pdf); payment-specific confirmations and processing in IRS Direct Pay (https://www.irs.gov/payments/direct-pay-help)"
