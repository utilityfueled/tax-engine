lines:
  - line: "published-rows"
    description: "Use the applicable income interval and filing-status column below $100,000"
    formula: "Round actual form taxable income to whole dollars. For final 2022–2025 tables, intervals are [0,5), [5,15), [15,25), then $25 bands through $3,000 and $50 bands through $100,000. Tax equals the rounded progressive tax at the interval midpoint; every output cell is independently compared with the published IRS table. QSS uses the MFJ column."
    notes: "The test fixture is extracted from the actual IRS PDFs, not generated by the tax implementation. All 32,992 published status amounts across four years must match."
    testRef: "tests/utils/federal-tax-table.test.ts::matches every published IRS row for all four final years"
  - line: "boundaries"
    description: "Table boundaries and Tax Computation Worksheet transition"
    formula: "A lower interval bound is inclusive and its upper bound exclusive. At taxable income $100,000 and above use the actual year's progressive rate schedule. Reject nonfinite amounts and unavailable years."
    testRef: "tests/utils/federal-tax-table.test.ts::uses printed intervals and changes to the computation worksheet at one hundred thousand"
  - line: "year-source"
    description: "Keep unpublished 2026 calculations distinct from a final Tax Table"
    formula: "2026 uses statutory indexed rate arithmetic only as an expressly labeled preview. No generated interval amounts are represented as published 2026 tax. Unknown years reject. getConstants(2026), filing and final qualification remain blocked."
    notes: "The current IRS publication is final 2025; the 2026 Tax Table was unavailable at refresh. This source gate remains open even when rate calculations pass."
    testRef: "tests/utils/federal-tax-table.test.ts::labels the unpublished 2026 calculation as a statutory preview"
  - line: "return-integration"
    description: "Form1040 uses actual table and publishes source status"
    formula: "Line16 ordinary, QDCG ordinary and lesser-of amounts consume actual-year table. Return source status explicitly distinguishes statutory-rate-preview. FEI line5 uses the table below100000."
    testRef: "tests/engine/federal-tax-table-integration.test.ts::uses the published table for Form1040 and foreign exclusions"
  - line: "kiddie"
    description: "Form8615 ordinary tax steps use actual-year table"
    formula: "Parent and child ordinary-tax steps use the table below100000, with the applicable filing status."
    testRef: "tests/engine/federal-tax-table-integration.test.ts::uses the published table for parent and child kiddie tax"
  - line: "farm"
    description: "ScheduleJ distinguishes current table from base-year rate schedules"
    formula: "Current-year line4 uses the TaxTable; base-year recomputation explicitly uses TaxRateSchedules, including its preferential worksheets. Base years are actual current year minus3/minus2/minus1. The2026 calculation remains preview."
    irsRef: "https://www.irs.gov/instructions/i1040sj, lines4/8/12/16"
    testRef: "tests/engine/federal-tax-table-integration.test.ts::keeps ScheduleJ base years on actual rate schedules"
