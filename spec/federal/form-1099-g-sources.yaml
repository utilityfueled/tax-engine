form: "Form 1099-G source treatment"
fullName: "Government unemployment, repayments and separate government payment income"
taxYear: 2026
reference: "https://www.irs.gov/instructions/i1099g"
revision: "December 2026 source revision; Publication 525 (2025); Rev. Rul. 2025-4"
retrievedAt: "2026-10-25"
sources:
  - "https://www.irs.gov/publications/p525"
  - "https://www.irs.gov/pub/irs-drop/rr-25-04.pdf"
notes: |
  The December 2026 statement revision applies to 2026 information, not earlier
  years. Box 10 family leave is new; old state boxes 10a/10b/11 become 11a/11b/12.
  Rev. Rul. 2025-4 distinguishes state-administered family leave from medical
  leave, private plans, unemployment and wages. This source worksheet keeps
  current-year unemployment repayments separate from prior-year claim-of-right
  relief. Legacy 2025 aggregate preview remains explicitly unverified. No source
  package changes return-year, human-review, final-form or filing readiness gates.
lines:
  - line: "legacy-absent-boxes"
    description: "Historical direct-call compatibility remains unverified"
    formula: "Only an explicitly unverified 2022–2025 legacy record may retain the historical zero fallback for absent Box1 or Box4. Supplied malformed amounts still reject; actual-source and 2026 paths require original complete source facts and never use this fallback as verification."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::retains unverified historical absent-box compatibility without bypassing actual facts"
  - line: "source-contract"
    description: "Preserve actual government statement facts before historical defaults"
    formula: "Require source ID, year/revision, payer/recipient owner, program classification, actual receipt and source confirmation. Unknown monetary facts remain unknown; existing defaulted fields cannot establish source completeness. Any newly supplied source adjustment requires the complete source route and cannot be ignored as legacy input."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::preserves unknown source facts and distinguishes historical previews"
  - line: "1"
    description: "Government unemployment compensation"
    formula: "Use actual Box1 before withholding; confirm government unemployment classification. Do not treat employer supplemental, private/union or state family leave benefits as unemployment."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::keeps unemployment income separate from withholding and other government income"
  - line: "1-repayment"
    description: "Current-year repayment of current-year benefits"
    formula: "From actual gross receipts subtract actual same-year repayment once; require repayment records and reconciliation whether Box1 already reflects repayment. Preserve the Repaid annotation amount separately. Prior-year repayment cannot reduce current unemployment."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::subtracts same-year repayments once for gross and already-net statements"
  - line: "1-contributions"
    description: "Actual nondeductible unemployment-program contribution recovery"
    formula: "Pool reconciled net benefits by recipient, payer and actual program identity. Recover min(net benefits, actual unrecovered nondeductible contributions) once, taxable unemployment=max(0,net benefits-balance), ending balance=max(0,balance-net benefits). Repeated program statements must report the same actual starting balance and complete program history."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::recovers a shared actual program balance once and preserves unused contributions"
  - line: "2-3-8"
    description: "Refund amounts and actual origin year"
    formula: "Retain Box2 once, reconcile legacy aliases, require actual Box3 origin year, separate refundExpenseTaxYear and Box8 status. Return the source for the separate tax-benefit worksheet; do not assume all refunds are taxable or derive the origin year. Business refunds require separate business-source treatment."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::preserves refund source years without inventing taxable refunds"
  - line: "4"
    description: "Federal withholding"
    formula: "Sum actual Box4 separately, with Decimal and no income reduction; preserve withholding even when contribution recovery eliminates taxable unemployment."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::keeps unemployment income separate from withholding and other government income"
  - line: "5"
    description: "RTAA payments"
    formula: "Include actual RTAA payments as separate Schedule1 other income, not unemployment or self-employment income."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::keeps unemployment income separate from withholding and other government income"
  - line: "6"
    description: "Taxable grants"
    formula: "Require actual nonbusiness classification before using taxable Box6 as other income; business and farm grants require their linked schedules and cannot silently take this route."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::rejects unclassified or separately routed payments and unsupported repayments"
  - line: "7-9"
    description: "Agriculture payments and CCC market gain"
    formula: "Preserve known zero. Positive agriculture payments or market gain require actual farm/CCC sources and fail this nonfarm worksheet explicitly."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::rejects unclassified or separately routed payments and unsupported repayments"
  - line: "10"
    description: "State PFML family benefits"
    formula: "For the actual 2026 revision require Box10 and confirmed state-administered family-leave classification. Include the full gross amount as other income, without unemployment contribution recovery or wage/SE classification. Rev.Rul.2025-4 situations 2/5 family benefits of19200 are fully included regardless of employer pickup. Medical/private benefits require their distinct sources."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::matches the revenue ruling family leave example without reducing it by unemployment contributions"
  - line: "11a-12"
    description: "State information"
    formula: "Keep each source state, payer state ID and withholding distinct. An explicit no-state-reporting answer supplies known zero only when saved state fields agree."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::retains actual state withholding and validates state absence"
  - line: "validation"
    description: "Source owner, year and exact aggregation"
    formula: "Reject duplicate source identity, unconfirmed/contradictory year or owner, negative/nonfinite source amounts, repayment exceeding actual receipts, inconsistent contribution pools and missing confirmations. Aggregate cents exactly before any downstream whole-dollar return-line rounding."
    testRef: "tests/engine/forms/form-1099-g-sources.test.ts::rejects contradictory sources and retains exact cents across owners"
