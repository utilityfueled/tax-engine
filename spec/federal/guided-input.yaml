form: "Guided input adapter"
fullName: "Preservation of taxpayer facts before federal calculation"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1040s8"
retrievedAt: "2026-10-24"
reviewStatus: "independent-review-pending"
lines:
  - line: "retirement-source-records"
    description: "Require actual retirement ownership, source and taxability facts"
    formula: "Retain zero and incomplete 1099-R records. Require actual source year, payer/TIN/account reference, recipient, tri-state IRA and Box 2b answers, source amounts and confirmed ordinary taxability. State/local identity and withholding come from the source, never the mailing address; reconcile duplicate sources and amounts already entered elsewhere. Preserve original taxable-amount unknowns without gross-distribution substitution. Collect 2026 Boxes 7c/7d; unsupported special amounts/codes/basis histories remain saved and blocked. Source edits revoke confirmation; legacy defaults cannot establish source completeness."
    irsRef: "2026 Form 1099-R instructions Boxes 1-11 and 14-19; Publication 575 taxable amount and cost recovery; https://www.irs.gov/instructions/i1099r; https://www.irs.gov/publications/p575"
    testRef: "tests/guided-interview/guided-retirement-source-facts.test.ts::requires actual retirement source ownership and preserves zero and unknown amounts"
  - line: "retirement-ira-checkbox"
    description: "Route the actual IRA checkbox through the engine's validated field"
    formula: "Map the supplied IRA/SEP/SIMPLE source checkbox to Form1099R.iraSepSimple. Do not emit a discarded alias or classify a true IRA source as pension income. Validate the mapped engine record and verify separate Form 1040 IRA/pension income routing."
    irsRef: "Form 1099-R instructions IRA/SEP/SIMPLE checkbox (Box 7b in 2026) and Form 1040 lines 4/5; https://www.irs.gov/instructions/i1099r; https://www.irs.gov/instructions/i1040gi"
    testRef: "tests/guided-interview/guided-retirement-source-facts.test.ts::retains the actual IRA checkbox through schema validation and IRA income routing"
  - line: "mortgage-source-qualification"
    description: "Keep mortgage source boxes separate from actual debt and payment eligibility"
    formula: "Collect actual source year, owner, property, loan identity/type/use, source Boxes 1-6, qualified taxes paid and maximum debt balance. Box 2 is a point-in-time source balance, never an average or all-year debt-limit fact. The ordinary guided path requires confirmed secured acquisition debt on an owned qualified home, actual current-year payments by this return, no outside allocation or special use, and actual maximum balances within a conservative acquisition-debt limit. Unverified/refinanced/HELOC/reverse/mixed-use, interest refunds, debt-limit worksheets and unresolved payment allocations remain saved but blocked. Positive purchase points require every current-year full-deduction criterion and election; other amortization remains unsupported. For 2026 insurance, preserve actual contract/provider/acquisition/residence and annual allocation facts; do not equate Box 5 to the annual deduction. Unknown stays unknown, explicit zero survives, and edits revoke source confirmation."
    irsRef: "Publication 936 Part I, Fully Deductible Interest, Points and Refunds; Form 1098 instructions Boxes 1-6; Publication 505 (2026) mortgage insurance; https://www.irs.gov/publications/p936; https://www.irs.gov/instructions/i1098; https://www.irs.gov/publications/p505"
    testRef: "tests/guided-interview/guided-mortgage-source-facts.test.ts::requires actual mortgage qualification rather than interpreting statement amounts as eligibility"
  - line: "nonw2-tax-allocation"
    description: "Collect actual non-W-2 withholding already deducted elsewhere"
    formula: "Preserve and forward actual non-W-2 source withholding once. Collect the amount already deducted on another schedule, including explicit zero; do not add source withholding again to other income taxes. Positive supported non-W-2 withholding with missing allocation blocks guided calculation in either year. Reject negative/malformed allocations or amounts exceeding actual source withholding. Keep the fact through either deduction election because the engine compares allowed deductions."
    irsRef: "Schedule A instructions line 5a: do not include taxes deducted elsewhere on the return, such as Schedule C, E, or F; https://www.irs.gov/instructions/i1040sca"
    testRef: "tests/guided-interview/guided-salt-source-facts.test.ts::requires actual non-W-2 deduction allocation and preserves explicit zero"
  - line: "w2-tips-and-se-owner"
    description: "Preserve actual W-2 tips and separate each spouse payroll base"
    formula: "Collect actual Box 7 Social Security tips, including confirmed zero, separately from Box 3 wages. Missing Box 7 stays unknown and blocks guided calculation. Extracted tips need source confirmation. Forward only actual source amounts; neither wages nor withholding proves zero tips. Each spouse's W-2 wages and tips reduce only that owner's Schedule SE wage base, using the actual W-2 and business owners."
    irsRef: "General Instructions for Forms W-2 and W-3, boxes 3 and 7; Schedule SE instructions, Joint Returns and line 8a; https://www.irs.gov/instructions/iw2w3; https://www.irs.gov/instructions/i1040sse"
    testRef: "tests/guided-interview/guided-w2-source-facts.test.ts::preserves actual Social Security tips and keeps missing tips unknown"
  - line: "rental-source-records"
    description: "Preserve actual rental ownership, use and expense qualification"
    formula: "Keep started zero-rent and expense-only properties. Require actual address/type, owner, percentage, fair-rental/personal days, ordinary rental classification, full-property source amounts and deductible expense worksheets. Unknown days, participation, at-risk and QBI facts are not defaults. Source confirmation is renewed after edits. Validate duplicate properties and applicable spouse ownership; use Decimal for money and ownership ratios. Personal-use allocation, prior loss/credit, professional/service/self-rental and unsupported limitation facts stay explicit and block the ordinary passive route until their worksheets are supported."
    irsRef: "Schedule E instructions lines 1-3,5-22 and at-risk/passive rules; Publication 527 personal-use and rental deduction rules; https://www.irs.gov/instructions/i1040se; https://www.irs.gov/publications/p527"
    testRef: "tests/guided-interview/guided-rental-source-facts.test.ts::preserves zero and expense-only properties without inventing source identity"
  - line: "nec-document-source-boundary"
    description: "Parse supplied NEC boxes without inventing complete business facts"
    formula: "Use only actual labeled NEC amounts and source identity; unknown withholding, recipient ownership and absent state labels stay unknown. Multiple forms need separate records. A source NEC and prose expense answer do not establish qualified Schedule C costs, owner, participation or loss limits; the document-only adapter must require the complete guided business path before calculating."
    irsRef: "Schedule C instructions, separate source receipts and actual deductible expenses; Form 1099-NEC boxes 1,4-7; https://www.irs.gov/instructions/i1040sc; https://www.irs.gov/instructions/i1099mec"
    testRef: "tests/apps/web/nec-document-source.test.ts::keeps absent source withholding ownership and state facts unknown"
  - line: "business-source-records"
    description: "Collect actual business ownership, source income and deductible expense facts"
    formula: "A started NEC or business activity requires actual source payer, owner, withholding, state reporting and zero amounts; no representative client or inferred state. A single Schedule C needs an identified activity and actual owner, accounting method, reconciled receipts excluding duplicate Forms 1099, returns, cost of goods sold, other income, qualified expense amounts and QBI facts. Preserve unknown versus false and zero. Multiple activities, joint ownership, unsupported loss limits and spouse-mixed SE wage bases remain blocked until separate calculation support exists."
    irsRef: "Schedule C instructions, lines A-G, 1-7, 24b, 31-32; Forms 1099-NEC instructions, boxes 1/4/5-7; https://www.irs.gov/instructions/i1040sc; https://www.irs.gov/instructions/i1099mec"
    testRef: "tests/guided-interview/guided-business-source-facts.test.ts::preserves actual NEC owners state amounts and explicit zero"
  - line: "investment-source-records"
    description: "Keep actual investment identity, classifications, dates and zero amounts"
    formula: "A started 1099 record needs actual payer/broker, ownership and each supported amount. Zero records survive; missing boxes remain unknown. Review summaries and fact ledgers total known source amounts with Decimal and label incomplete or malformed amounts for review. Collect actual tax-exempt, Treasury, capital-distribution, withholding and state details. Separate source state from residence and reject duplicate additional withholding. Sales require actual property, acquisition/sale dates, basis, proceeds, holding period, reporting, digital-asset and wash-sale answers. Legacy classification defaults need fresh source confirmation. Unsupported bond adjustments, return-of-capital basis, special distributions and broker withholding block calculation when nonzero."
    irsRef: "Forms 1099-INT, 1099-DIV and 1099-B instructions; Form 8949 actual dates, basis, holding period and adjustments; https://www.irs.gov/instructions/i1099int; https://www.irs.gov/instructions/i1099div; https://www.irs.gov/instructions/i1099b"
    testRef: "tests/guided-interview/guided-investment-source-facts.test.ts::preserves explicit zero records and actual investment amounts without invented payers"
  - line: "w2-owner-and-source-state"
    description: "Keep actual W-2 owners, payroll boxes and source states distinct"
    formula: "Require actual employer identity and payroll boxes, including explicit zero, before calculation. A joint return needs the actual primary/spouse owner. The source state comes from Box 15, never the mailing address. A confirmed absent state section contributes no state wages or withholding; a single-state section requires its actual state and both amounts. Unknown or multiple-state sections cannot be collapsed into one state. Preserve missing optional values and zero through adapters and require confirmation of extracted ownership/state suggestions. Cancelled or late local parsing cannot publish suggestions after a return change."
    irsRef: "General Instructions for Forms W-2 and W-3, employee identification and boxes 1-6 and 15-17; https://www.irs.gov/instructions/iw2w3"
    testRef: "tests/guided-interview/guided-w2-source-facts.test.ts::preserves actual owners and source states without borrowing the mailing state"
  - line: "standard-deduction-source-facts"
    description: "Collect actual standard-deduction qualification and honor the selected method"
    formula: "Require actual blindness, claimable dependency, residency/short-year status and alive/death status. Use actual earned-income worksheet amounts for a dependent limitation; preserve signed Decimal amounts. Joint/MFS spouse facts and extra-box elections remain separate. Unknown is never converted to false or alive. A known death date must be in the return year and after birth. Forward a supplied standard/itemized selection to deductionElection."
    irsRef: "Publication 501, Standard Deduction, Persons Not Eligible, Higher Standard Deduction and Standard Deduction for Dependents; https://www.irs.gov/publications/p501"
    testRef: "tests/guided-interview/guided-standard-deduction-facts.test.ts::preserves actual blindness dependency signed worksheet and alive answers"
  - line: "education-student-source-records"
    description: "Collect per-student education and refund eligibility evidence"
    formula: "AOC and LLC use actual student identifiers and household roles, net paid qualified costs, institution records, receipt/exception qualification, and year-specific timely TIN or employment-SSN answers. Reconcile any saved LLC aggregate to exact individual costs. Reject duplicate credit claims for one student. Collect taxpayer dependency/residency, prior disallowance, possession exclusion and actual under-24 refund support facts. Unknown remains unknown and a known false answer remains false."
    irsRef: "Form 8863 instructions Parts I-III and Table 1; https://www.irs.gov/instructions/i8863; Publication 505 (2026), education credit SSN requirements"
    testRef: "tests/guided-interview/guided-education-source-facts.test.ts::reconciles actual LLC students and preserves zero and false qualification"
  - line: "business-analysis-cancellation"
    description: "Bind optional business-document AI review to current consent and return"
    formula: "No analysis starts without explicit current-return opt-in. Cancellation, consent withdrawal, unmount or return change aborts the same request signal; cancelled cache reads and late responses cannot publish suggestions. Successful analysis appends to current facts without overwriting edits made while waiting."
    irsRef: "Application privacy contract: business documents remain local except explicitly requested redacted AI analysis"
    testRef: "tests/apps/web/self-employment-analysis-cancellation.test.tsx::requires opt-in and discards a cancelled late income response"
  - line: "adoption-source-records"
    description: "Collect actual adoption identity, expense years and benefit history"
    formula: "Require actual child identity, birth year, disability, domestic/foreign and special-needs answers, adoption finality, annual unreimbursed expenses, prior credit/exclusion usage and employer-plan facts. Preserve unknown separately from false and zero. Require reviewed carryforward history and actual origin years; never invent an empty history. Positive historical foreign employer benefits require the unsupported historical exclusion worksheet. Forward exact Decimal amounts and actual MAGI adjustments."
    irsRef: "Form 8839 instructions Part I, qualified adoption expenses, credit/exclusion timing and carryforward worksheet; https://www.irs.gov/instructions/i8839"
    testRef: "tests/guided-interview/guided-adoption-facts.test.ts::requires actual adoption history and preserves exact source amounts"
  - line: "money"
    description: "Aggregate monetary source amounts exactly"
    formula: "Parse validated decimal strings; add using Decimal; preserve cents, zero and negative values. Reject malformed nonempty amounts. Apply form-line rounding in the engine, never binary floating point in the adapter."
    irsRef: "Form 1040 instructions, rounding off to whole dollars; sum amounts before rounding"
    testRef: "tests/guided-interview/guided-input-accuracy.test.ts::aggregates cents and large monetary values exactly"
  - line: "facts"
    description: "Never fabricate missing taxpayer facts"
    formula: "Missing year, birth date, residency, spouse facts or dependent eligibility prevents calculation. Preserve explicit zero months and explicit negative eligibility answers. A dependent count is not evidence of a qualifying child."
    irsRef: "Schedule 8812 instructions, Taxpayer Identification Number Requirements and Credits for Qualifying Children"
    testRef: "tests/guided-interview/guided-input-accuracy.test.ts::rejects a dependent count without actual dependent facts"
  - line: "saved-year"
    description: "Preserve the saved year during migration"
    formula: "Do not replace an explicit saved year with a workspace default. A legacy interview without a recorded year needs confirmation before calculation."
    irsRef: "Rev. Proc. 2025-32 distinguishes 2025 and 2026 rules"
    testRef: "tests/guided-interview/guided-input-accuracy.test.ts::requires confirmation for a legacy interview without a year"
  - line: "document-facts"
    description: "Require source facts instead of supplying representative defaults"
    formula: "Mortgage lender, principal and origination date; donation recipient, type, date and applicable basis/classification; estimated payment date; retirement distribution code and taxable amount; and AOTC prior claim history are actual facts. Blank does not mean zero. Preserve explicit zero. Incomplete entries or legacy aggregate-only deductions require correction before calculation."
    irsRef: "Form 1098 instructions boxes 1-3; Form 1099-R instructions boxes 2a, 2b and 7; Publications 526, 505 and 970"
    testRef: "tests/guided-interview/guided-required-facts.test.ts::does not manufacture mortgage or donation details from legacy totals"
  - line: "document-year"
    description: "Use actual document dates within the selected return year"
    formula: "Donation dates must fall in the selected tax year; estimated payment dates may fall in that year or the following year. Validate calendar dates, not just their format. Reject duplicate household taxpayer identifiers and contradictory selected state facts."
    irsRef: "Publication 526, When To Deduct; Publication 505, When To Pay Estimated Tax"
    testRef: "tests/guided-interview/guided-required-facts.test.ts::rejects impossible and conflicting source dates"
  - line: "display-money"
    description: "Keep source totals exact through review and UI presentation"
    formula: "Sum and compare income, expenses, payments and review totals using Decimal; stringify without a binary-number conversion. Malformed UI input displays unknown rather than a numeric zero. Other-tax indicators use verified engine amounts, not total-income threshold guesses."
    irsRef: "Form 1040 instructions, rounding off to whole dollars"
    testRef: "tests/guided-interview/guided-display-money.test.ts::retains exact source cents in deduction comparison and formatting"
  - line: "eligibility-and-migration"
    description: "Preserve actual eligibility and require confirmation of old defaults"
    formula: "Capture AOTC enrollment, degree, prior study, conviction and refundable-eligibility answers explicitly. Preserve residency months including zero. Saved pre-version-2 code 7 and prior-claim count 0 remain stored but require reconfirmation because their provenance is unknown."
    irsRef: "Publication 970, Who Can Claim the Credit and Refundable Part of Credit; Form 1099-R box 7"
    testRef: "tests/guided-interview/guided-required-facts.test.ts::requires reconfirmation of legacy prefilled facts without changing their values"
  - line: "parsed-source-fidelity"
    description: "Do not infer missing dates, payroll boxes or return years from adjacent values"
    formula: "Preserve missing source facts. A tax year is extracted only from explicit source-year context, never the filename or an unrelated transaction date. Summary-only securities need actual sale dates. Reject source-year conflicts, duplicate document/fact identifiers, multi-document machine facts and spouse ownership without spouse facts."
    irsRef: "Form W-2 instructions boxes 1, 3, 5 and 16; Form 8949 columns b and c; Form 1040 tax-year identification"
    testRef: "tests/guided-interview/document-fact-fidelity.test.ts::does not infer document year from a filename or transaction date"
  - line: "2026-eligibility-facts"
    description: "Preserve explicit organization and education identity eligibility facts"
    formula: "For 2026 nonitemizer gifts collect qualified recipient, supporting organization and donor-advised-fund answers. Preserve qualified-appreciated-stock status for private-foundation property. Education captures taxpayer/spouse/student SSN eligibility and institutional EIN; unknown remains unknown and blocks the affected calculation. A positive 2026 Lifetime Learning aggregate without student identity and eligibility is incomplete; an explicit zero is not a credit claim."
    irsRef: "Publication 505 (2026), education credit SSN requirements and nonitemizer charitable contributions; IRC 170"
    testRef: "tests/guided-interview/guided-required-facts.test.ts::requires actual 2026 charity and education eligibility facts"
  - line: "payment-categories"
    description: "Classify payments by their actual source and year"
    formula: "Keep federal estimated payments, extension payments and prior-year refund credits separate. Require actual payment dates and the immediately preceding source tax year for applied refunds. Preserve explicit zero. Reconcile a saved other-payment total to classified entries before using it; never silently drop it or infer a payment type."
    irsRef: "Form 1040 instructions line 26; Schedule 3 extension-payment instructions"
    testRef: "tests/guided-interview/guided-payment-facts.test.ts::preserves extension dates and prior-year credits with exact amounts and zero"
  - line: "adjustment-source-facts"
    description: "Require actual contribution and alimony eligibility facts"
    formula: "An IRA deduction estimate cannot stand in for actual contributions and employer-plan coverage. Use the IRA worksheet with actual contribution owners, known coverage and age from confirmed birth dates. A positive alimony amount requires a real instrument date, transition modification status, recipient tax ID and all supported post-1984 alimony requirements. Known ineligibility produces no deduction; unknown or pre-1985 treatment blocks the calculation."
    irsRef: "Publication 590-A employer-plan coverage and contribution rules; Publication 504 pre-2019 alimony requirements"
    testRef: "tests/guided-interview/guided-adjustment-facts.test.ts::uses actual IRA contributions and preserves false coverage facts"
  - line: "household-employee-facts"
    description: "Preserve individual household employee and FUTA facts"
    formula: "Do not replace a household wage total with a fictional employee. Require actual employee names, cash wages, withholding and exclusion facts; require actual FUTA applicability, credit eligibility and Section B amounts when applicable. Reconcile any saved total to individual wages using Decimal."
    irsRef: "Schedule H instructions employee exclusions, Parts I and II"
    testRef: "tests/guided-interview/guided-adjustment-facts.test.ts::requires each household employee and actual FUTA facts"
  - line: "deduction-categories"
    description: "Preserve actual itemized deduction categories"
    formula: "Keep additional income taxes, real estate taxes and annually assessed value-based personal property taxes separate. Never map a mixed other-deduction total to investment interest. Reconcile that legacy total to actual investment interest and wagering losses; casualty amounts need the specific Form 4684 facts. Report known gambling winnings regardless of deduction method. Preserve explicit zero and reject malformed amounts without crashing the interview."
    irsRef: "Schedule A instructions lines 5a-5c, 9, 16 and 17; Form 4952; Form 4684"
    testRef: "tests/guided-interview/guided-deduction-state-facts.test.ts::preserves tax and investment categories instead of combining unrelated deductions"
  - line: "state-payment-sources"
    description: "Use actual state payment and withholding sources"
    formula: "State estimated payments retain actual date, amount and state; source withholding retains payer, form, source tax year and state. Require reconciliation of legacy additional-withholding totals. Missing or conflicting state/year facts block calculation. Carry dated state estimates into the engine separately from federal payments; additional withholding enters income-tax SALT only once. Sum monetary overlays with Decimal."
    irsRef: "Schedule A line 5a instructions, state and local income taxes paid during the tax year; Form 1040 line 26 instructions"
    testRef: "tests/guided-interview/guided-deduction-state-facts.test.ts::forwards dated state estimates and classified withholding with exact zero-preserving amounts"
  - line: "care-and-qbi-qualification"
    description: "Preserve care-credit and QBI participation facts"
    formula: "A care expense claim requires actual qualifying count, eligibility, separately determined primary/spouse earned income and excluded benefits from the Form 2441 worksheet. Do not infer spouse income from combined wages or treat unknown excluded benefits as zero. QBI material participation is a separate actual answer for each activity; false remains false and omission remains unknown for the engine's conditional 2026 minimum test."
    irsRef: "Form 2441 instructions lines 4-5 and Part III; IRC 199A(i) and 469 material participation"
    testRef: "tests/guided-interview/guided-credit-business-facts.test.ts::preserves actual care earned income benefits and ineligibility without household-income inference"
  - line: "energy-source-facts"
    description: "Collect individual energy improvement and carryforward records"
    formula: "Preserve actual category, net qualified cost, completion date, residence eligibility, qualification, applicable manufacturer identifier and fuel-cell capacity. Reconcile saved aggregates to individual records without emitting both representations. General roofing is ineligible; a recorded qualified solar-roof component requires actual solar records and must not be counted twice. Preserve confirmed prior-year carryforward source year and zero; omit no missing fact by assumption."
    irsRef: "Form 5695 instructions Parts I and II; Public Law 119-21 sections 70505 and 70506"
    testRef: "tests/guided-interview/guided-energy-facts.test.ts::preserves individual categories dates qualification and confirmed carryforward"
  - line: "sparse-document-facts"
    description: "Keep missing uploaded boxes and classifications unknown"
    formula: "Only extract a box amount from its own labeled field and section. Missing payer identity, monetary boxes, acquisition/sale dates, adjustments, basis reporting, holding period and wash-sale treatment stay unknown. Explicit source zero remains zero. Reject incomplete or legacy parser-inferred facts before schema defaults can create a calculation."
    irsRef: "Instructions for Forms 1099-INT boxes 1-4 and 8; 1099-DIV boxes 1a-7; 1099-DA basis and transaction reporting"
    testRef: "tests/guided-interview/document-fact-fidelity.test.ts::keeps sparse interest boxes unknown and never uses the filename as payer identity"
  - line: "child-credit-identity"
    description: "Actual timely identification and possession facts for claimed dependent credits"
    formula: "For either guided tax year, collect timely employment-valid filer SSN and timely filer TIN facts, each claimed child's CTC SSN or ODC TIN eligibility, Puerto Rico bona fide residence and possession income exclusion. A formatted tax ID is not eligibility evidence. Missing facts block the claim; actual false and zero remain facts, not inferred eligibility. One joint filer's valid SSN can establish the SSN condition, with both filers' timely TIN requirements retained."
    irsRef: "Schedule 8812 instructions taxpayer identification requirements and lines 1-3; IRC 24(h)(7) and 24(h)(9)"
    testRef: "tests/guided-interview/guided-child-credit-facts.test.ts::requires actual identity facts for claimed child credits in either guided year"
  - line: "vehicle-source-records"
    description: "Actual vehicle, seller report, transition and MAGI records"
    formula: "Collect individual new or used vehicle identity, actual owner, source dates, binding contract/payment qualification, seller report, component and buyer eligibility, personal-use percentage, transfer election/amount and return/resale facts. Missing source facts block calculation, while known false and zero survive. Prior AGI remains unknown unless supplied with actual status and confirmed adjustment amounts; owner-specific prior MAGI is separate. Reject duplicate VINs, impossible date ordering and inconsistent transfer amounts."
    irsRef: "Form 8936 instructions and Schedule A (Form 8936); IRC 30D and 25E transition under Public Law 119-21"
    testRef: "tests/guided-interview/guided-vehicle-facts.test.ts::requires individual seller report and actual transition facts"
