form: "Guided input adapter"
fullName: "Preservation of taxpayer facts before federal calculation"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1040s8"
retrievedAt: "2026-10-24"
reviewStatus: "independent-review-pending"
lines:
  - line: "money"
    description: "Aggregate monetary source amounts exactly"
    formula: "Parse validated decimal strings; add using Decimal; preserve cents, zero and negative values. Reject malformed nonempty amounts. Apply form-line rounding in the engine, never binary floating point in the adapter."
    irsRef: "Form 1040 instructions, rounding off to whole dollars; sum amounts before rounding"
    testRef: "tests/guided-interview/guided-input-accuracy.test.ts::aggregates cents and large monetary values exactly"
  - line: "facts"
    description: "Never fabricate missing taxpayer facts"
    formula: "Missing year, birth date, residency, spouse facts or dependent eligibility prevents calculation. Preserve explicit zero months and explicit negative eligibility answers. A dependent count is not evidence of a qualifying child."
    irsRef: "Schedule 8812 instructions, Taxpayer Identification Number Requirements and Credits for Qualifying Children"
    testRef: "tests/guided-interview/guided-input-accuracy.test.ts::rejects a dependent count without actual dependent facts"
  - line: "saved-year"
    description: "Preserve the saved year during migration"
    formula: "Do not replace an explicit saved year with a workspace default. A legacy interview without a recorded year needs confirmation before calculation."
    irsRef: "Rev. Proc. 2025-32 distinguishes 2025 and 2026 rules"
    testRef: "tests/guided-interview/guided-input-accuracy.test.ts::requires confirmation for a legacy interview without a year"
  - line: "document-facts"
    description: "Require source facts instead of supplying representative defaults"
    formula: "Mortgage lender, principal and origination date; donation recipient, type, date and applicable basis/classification; estimated payment date; retirement distribution code and taxable amount; and AOTC prior claim history are actual facts. Blank does not mean zero. Preserve explicit zero. Incomplete entries or legacy aggregate-only deductions require correction before calculation."
    irsRef: "Form 1098 instructions boxes 1-3; Form 1099-R instructions boxes 2a, 2b and 7; Publications 526, 505 and 970"
    testRef: "tests/guided-interview/guided-required-facts.test.ts::does not manufacture mortgage or donation details from legacy totals"
  - line: "document-year"
    description: "Use actual document dates within the selected return year"
    formula: "Donation dates must fall in the selected tax year; estimated payment dates may fall in that year or the following year. Validate calendar dates, not just their format. Reject duplicate household taxpayer identifiers and contradictory selected state facts."
    irsRef: "Publication 526, When To Deduct; Publication 505, When To Pay Estimated Tax"
    testRef: "tests/guided-interview/guided-required-facts.test.ts::rejects impossible and conflicting source dates"
  - line: "display-money"
    description: "Keep source totals exact through review and UI presentation"
    formula: "Sum and compare income, expenses, payments and review totals using Decimal; stringify without a binary-number conversion. Malformed UI input displays unknown rather than a numeric zero. Other-tax indicators use verified engine amounts, not total-income threshold guesses."
    irsRef: "Form 1040 instructions, rounding off to whole dollars"
    testRef: "tests/guided-interview/guided-display-money.test.ts::retains exact source cents in deduction comparison and formatting"
  - line: "eligibility-and-migration"
    description: "Preserve actual eligibility and require confirmation of old defaults"
    formula: "Capture AOTC enrollment, degree, prior study, conviction and refundable-eligibility answers explicitly. Preserve residency months including zero. Saved pre-version-2 code 7 and prior-claim count 0 remain stored but require reconfirmation because their provenance is unknown."
    irsRef: "Publication 970, Who Can Claim the Credit and Refundable Part of Credit; Form 1099-R box 7"
    testRef: "tests/guided-interview/guided-required-facts.test.ts::requires reconfirmation of legacy prefilled facts without changing their values"
  - line: "parsed-source-fidelity"
    description: "Do not infer missing dates, payroll boxes or return years from adjacent values"
    formula: "Preserve missing source facts. A tax year is extracted only from explicit source-year context, never the filename or an unrelated transaction date. Summary-only securities need actual sale dates. Reject source-year conflicts, duplicate document/fact identifiers, multi-document machine facts and spouse ownership without spouse facts."
    irsRef: "Form W-2 instructions boxes 1, 3, 5 and 16; Form 8949 columns b and c; Form 1040 tax-year identification"
    testRef: "tests/guided-interview/document-fact-fidelity.test.ts::does not infer document year from a filename or transaction date"
  - line: "2026-eligibility-facts"
    description: "Preserve explicit organization and education identity eligibility facts"
    formula: "For 2026 nonitemizer gifts collect qualified recipient, supporting organization and donor-advised-fund answers. Preserve qualified-appreciated-stock status for private-foundation property. Education captures taxpayer/spouse/student SSN eligibility and institutional EIN; unknown remains unknown and blocks the affected calculation. A positive 2026 Lifetime Learning aggregate without student identity and eligibility is incomplete; an explicit zero is not a credit claim."
    irsRef: "Publication 505 (2026), education credit SSN requirements and nonitemizer charitable contributions; IRC 170"
    testRef: "tests/guided-interview/guided-required-facts.test.ts::requires actual 2026 charity and education eligibility facts"
  - line: "payment-categories"
    description: "Classify payments by their actual source and year"
    formula: "Keep federal estimated payments, extension payments and prior-year refund credits separate. Require actual payment dates and the immediately preceding source tax year for applied refunds. Preserve explicit zero. Reconcile a saved other-payment total to classified entries before using it; never silently drop it or infer a payment type."
    irsRef: "Form 1040 instructions line 26; Schedule 3 extension-payment instructions"
    testRef: "tests/guided-interview/guided-payment-facts.test.ts::preserves extension dates and prior-year credits with exact amounts and zero"
  - line: "adjustment-source-facts"
    description: "Require actual contribution and alimony eligibility facts"
    formula: "An IRA deduction estimate cannot stand in for actual contributions and employer-plan coverage. Use the IRA worksheet with actual contribution owners, known coverage and age from confirmed birth dates. A positive alimony amount requires a real instrument date, transition modification status, recipient tax ID and all supported post-1984 alimony requirements. Known ineligibility produces no deduction; unknown or pre-1985 treatment blocks the calculation."
    irsRef: "Publication 590-A employer-plan coverage and contribution rules; Publication 504 pre-2019 alimony requirements"
    testRef: "tests/guided-interview/guided-adjustment-facts.test.ts::uses actual IRA contributions and preserves false coverage facts"
  - line: "household-employee-facts"
    description: "Preserve individual household employee and FUTA facts"
    formula: "Do not replace a household wage total with a fictional employee. Require actual employee names, cash wages, withholding and exclusion facts; require actual FUTA applicability, credit eligibility and Section B amounts when applicable. Reconcile any saved total to individual wages using Decimal."
    irsRef: "Schedule H instructions employee exclusions, Parts I and II"
    testRef: "tests/guided-interview/guided-adjustment-facts.test.ts::requires each household employee and actual FUTA facts"
  - line: "deduction-categories"
    description: "Preserve actual itemized deduction categories"
    formula: "Keep additional income taxes, real estate taxes and annually assessed value-based personal property taxes separate. Never map a mixed other-deduction total to investment interest. Reconcile that legacy total to actual investment interest and wagering losses; casualty amounts need the specific Form 4684 facts. Report known gambling winnings regardless of deduction method. Preserve explicit zero and reject malformed amounts without crashing the interview."
    irsRef: "Schedule A instructions lines 5a-5c, 9, 16 and 17; Form 4952; Form 4684"
    testRef: "tests/guided-interview/guided-deduction-state-facts.test.ts::preserves tax and investment categories instead of combining unrelated deductions"
  - line: "state-payment-sources"
    description: "Use actual state payment and withholding sources"
    formula: "State estimated payments retain actual date, amount and state; source withholding retains payer, form, source tax year and state. Require reconciliation of legacy additional-withholding totals. Missing or conflicting state/year facts block calculation. Carry dated state estimates into the engine separately from federal payments; additional withholding enters income-tax SALT only once. Sum monetary overlays with Decimal."
    irsRef: "Schedule A line 5a instructions, state and local income taxes paid during the tax year; Form 1040 line 26 instructions"
    testRef: "tests/guided-interview/guided-deduction-state-facts.test.ts::forwards dated state estimates and classified withholding with exact zero-preserving amounts"
  - line: "care-and-qbi-qualification"
    description: "Preserve care-credit and QBI participation facts"
    formula: "A care expense claim requires actual qualifying count, eligibility, separately determined primary/spouse earned income and excluded benefits from the Form 2441 worksheet. Do not infer spouse income from combined wages or treat unknown excluded benefits as zero. QBI material participation is a separate actual answer for each activity; false remains false and omission remains unknown for the engine's conditional 2026 minimum test."
    irsRef: "Form 2441 instructions lines 4-5 and Part III; IRC 199A(i) and 469 material participation"
    testRef: "tests/guided-interview/guided-credit-business-facts.test.ts::preserves actual care earned income benefits and ineligibility without household-income inference"
