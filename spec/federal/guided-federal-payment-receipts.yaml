form: "2025 guided federal payment receipt reconciliation"
taxYear: 2025
reference: https://www.irs.gov/instructions/i1040gi
lines:
  - line: "Form 1040 line 26, Schedule 3 line 10, Form 2210 line 11"
    description: Admit each actual 2025 federal estimate or extension once
    formula: >-
      Hold 2025 guided estimates and extension payments that reuse the same
      actual confirmation or receipt reference, even when the entered dates,
      amounts, or categories differ. Whenever positive rows across these
      categories share the exact calendar date and Decimal amount, require
      distinct actual receipt references. Never discard a row automatically.
      Transfer each distinct admitted payment with its original date, exact
      amount and category. Preserve ordinary noncolliding legacy rows, the
      existing federal application-year checks, other years and state payments.
    irsRef: "2025 Form 1040 line 26 and Schedule 3 line 10 instructions (https://www.irs.gov/instructions/i1040gi); Form 2210 line 11 and the penalty worksheet (https://www.irs.gov/instructions/i2210); IRS Direct Pay payment-specific confirmations (https://www.irs.gov/payments/direct-pay-help)"
    testRef: "tests/guided-interview/guided-federal-payment-receipts.test.ts::holds an ambiguous repeated estimated payment and admits two actual originals"
    testRefs:
      - "tests/guided-interview/guided-federal-payment-receipts.test.ts::holds reused and ambiguous receipt evidence across estimates and extensions"
      - "tests/guided-interview/guided-federal-payment-receipts.test.ts::keeps exact cents and the existing return-year admission"
      - "tests/guided-interview/guided-federal-payment-receipts.test.ts::admits a saved extension-only draft through Continue and the bridge"
      - "tests/apps/web/guided-federal-payment-receipts.test.tsx::reconciles matching payment rows through the 2025 and 2026 Payments panel"

  - line: "2026-calculation-reference"
    description: Pass distinct receipt evidence to the 2026 calculation without original references
    formula: >-
      Validate the actual private receipt references across estimates and
      extensions before conversion. For 2026, give each admitted positive row
      in a group with the same calendar date and exact Decimal amount a distinct
      calculation reference based on its category and position. Never transfer
      original taxpayer receipt references. Unique and zero-amount rows keep
      their existing calculation shape. Dates, exact amounts, payment
      categories, confirmed applications and the 2025 conversion retain their
      existing treatment.
    irsRef: "Payment history (https://www.irs.gov/payments/online-account-for-individuals); IRS Direct Pay payment-specific confirmations (https://www.irs.gov/payments/direct-pay-help)"
    testRef: "tests/guided-interview/guided-federal-payment-receipts.test.ts::reconciles matching 2026 extension payments before transfer"
    testRefs:
      - "tests/guided-interview/guided-federal-payment-receipts.test.ts::requires distinct actual references for matching 2026 estimates"
      - "tests/guided-interview/guided-federal-payment-receipts.test.ts::keeps unique and zero 2026 payment references out of calculation input"
      - "tests/guided-interview/guided-estimated-tax-facts.test.ts::accepts separately confirmed original payment references and holds stale or repeated proof"

  - line: "2026-edited-receipt-application"
    description: Reconfirm the applied return year after replacing a known 2026 payment receipt
    formula: >-
      Replacing or removing the known receipt reference for a 2026 estimate or
      extension clears that payment's return-year confirmation. Keep the
      entered date, exact amount, payment category and applied year visible.
      Pending confirmation persists through reopen and holds guided input
      until explicitly restored. Keep initial reference entry, equivalent
      reference formatting, unchanged payment originals and 2025 behavior.
      The 2026 estimate and extension editors apply a completed receipt
      edit when the user leaves the field or presses Enter. Intermediate
      keystrokes cannot change the original used for comparison.
    irsRef: "IRS Direct Pay payment-specific confirmations and the tax period for a payment; https://www.irs.gov/payments/direct-pay-help"
    testRef: "tests/guided-interview/guided-federal-payment-return-year.test.ts::requires new application confirmation when a known 2026 receipt changes"
    testRefs:
      - "tests/apps/web/guided-federal-payment-receipts.test.tsx::commits only the completed 2026 estimate and extension receipt edits"
