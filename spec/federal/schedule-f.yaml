form: "Schedule F"
fullName: "Profit or Loss From Farming"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1040sf"

notes: |
  Schedule F reports income and expenses from farming operations where the
  taxpayer materially participates. Net farm profit or loss (Line 34) flows
  to Schedule 1 Line 6 and Schedule SE Line 1a/4a for self-employment tax.
  This slice implements the cash-method path (Part I and Part II). The
  accrual method (Part III) is documented but not yet computed. Form 4835
  (Farm Rental Income) is a separate form reported on Schedule E for
  landlords who do NOT materially participate.

  Conservation expenses (Line 12) are capped at 25% of gross farm income
  per IRC section 175. Excess carries forward to future years.

  Farm income is subject to SE tax (Schedule SE) and qualifies for farm
  income averaging (Schedule J, IRC section 1301) — implemented.

  The farm optional method for SE tax (IRC section 1402(a)) allows low-
  income farmers to use 2/3 of gross farm income as deemed SE earnings —
  handled in Schedule SE, not here.

lines:
  # ── Part I: Farm Income — Cash Method ────────────────────
  - line: "1a"
    description: "Sales of purchased livestock and other resale items"
    formula: "Gross sales of purchased livestock and other items bought for resale"
    irsRef: "Schedule F Instructions, Line 1a"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 1c - net purchased livestock equals sales minus cost"

  - line: "1b"
    description: "Cost or other basis of purchased livestock and other items on line 1a"
    formula: "Cost basis of resale items"
    irsRef: "Schedule F Instructions, Line 1b"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 1c - net purchased livestock equals sales minus cost"

  - line: "1c"
    description: "Subtract line 1b from line 1a"
    formula: "Line 1a - Line 1b"
    irsRef: "Schedule F Instructions, Line 1c"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 1c - net purchased livestock equals sales minus cost"

  - line: "2"
    description: "Sales of livestock, produce, grains, and other products you raised"
    formula: "Direct input — gross sales of products the farmer raised"
    irsRef: "Schedule F Instructions, Line 2"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 9 - gross farm income sums all income lines"

  - line: "3b"
    description: "Cooperative distributions — taxable amount"
    formula: "Taxable portion of cooperative distributions (Form 1099-PATR)"
    irsRef: "Schedule F Instructions, Line 3b"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 9 - gross farm income sums all income lines"

  - line: "4b"
    description: "Agricultural program payments — taxable amount"
    formula: "Taxable agricultural program payments (PLC, ARC, MFP, etc.)"
    irsRef: "Schedule F Instructions, Line 4b"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 9 - gross farm income sums all income lines"

  - line: "5a"
    description: "Commodity Credit Corporation (CCC) loans reported under election"
    formula: "CCC loan proceeds elected as income in year received"
    irsRef: "Schedule F Instructions, Line 5a"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 9 - gross farm income sums all income lines"

  - line: "5c"
    description: "CCC loans forfeited — taxable amount"
    formula: "Taxable amount from forfeited CCC loans"
    irsRef: "Schedule F Instructions, Line 5c"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 9 - gross farm income sums all income lines"

  - line: "6b"
    description: "Crop insurance proceeds — taxable amount"
    formula: "Taxable crop insurance and disaster payments (after deferral election)"
    irsRef: "Schedule F Instructions, Line 6b"
    edgeCases:
      - "All-or-nothing deferral election: if any eligible proceeds are deferred, all must be"
      - "Deferred amounts from prior year (Line 6d) are included in current-year income"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 9 - gross farm income includes crop insurance and prior-year deferred amounts"

  - line: "6d"
    description: "Amount deferred from prior year"
    formula: "Prior-year crop insurance proceeds deferred to current year"
    irsRef: "Schedule F Instructions, Line 6d"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 9 - gross farm income includes crop insurance and prior-year deferred amounts"

  - line: "7"
    description: "Custom hire (machine work) income"
    formula: "Income from providing custom farming services with own equipment"
    irsRef: "Schedule F Instructions, Line 7"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 9 - gross farm income sums all income lines"

  - line: "8"
    description: "Other farm income"
    formula: "Includes bartering, canceled debt, commodity futures, fuel tax credits"
    irsRef: "Schedule F Instructions, Line 8"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 9 - gross farm income sums all income lines"

  - line: "9"
    description: "Gross farm income"
    formula: "Line 1c + Line 2 + Line 3b + Line 4b + Line 5a + Line 5c + Line 6b + Line 6d + Line 7 + Line 8"
    irsRef: "Schedule F Instructions, Line 9"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 9 - gross farm income sums all income lines"

  # ── Part II: Farm Expenses ──────────────────────────────
  - line: "10"
    description: "Car and truck expenses"
    formula: "Actual expenses or standard mileage ($0.70/mile for 2025)"
    irsRef: "Schedule F Instructions, Line 10"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 33 - total farm expenses sums all expense lines"

  - line: "11"
    description: "Chemicals"
    formula: "Pesticides, herbicides, fungicides, and other agricultural chemicals"
    irsRef: "Schedule F Instructions, Line 11"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 33 - total farm expenses sums all expense lines"

  - line: "12"
    description: "Conservation expenses"
    formula: "Capped at 25% of gross farm income per IRC section 175; excess carries forward"
    irsRef: "Schedule F Instructions, Line 12; IRC section 175"
    edgeCases:
      - "Cannot exceed 25% of gross farm income"
      - "Excess over cap carries forward to future years"
      - "Requires NRCS-approved soil and water conservation plan"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 12 - conservation expenses capped at 25% gross income"

  - line: "13"
    description: "Custom hire (machine work)"
    formula: "Payments for custom farming services using operator-furnished equipment"
    irsRef: "Schedule F Instructions, Line 13"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 33 - total farm expenses sums all expense lines"

