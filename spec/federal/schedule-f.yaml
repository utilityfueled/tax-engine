    description: "Feed"
    formula: "Cost of feed for livestock"
    irsRef: "Schedule F Instructions, Line 16"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 33 - total farm expenses sums all expense lines"

  - line: "17"
    description: "Fertilizers and lime"
    formula: "Cost of fertilizers, lime, and soil conditioners"
