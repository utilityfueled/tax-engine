    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 33 - total farm expenses sums all expense lines"

  - line: "18"
    description: "Freight and trucking"
    formula: "Shipping costs for farm products and supplies"
    irsRef: "Schedule F Instructions, Line 18"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 33 - total farm expenses sums all expense lines"

  - line: "19"
    description: "Gasoline, fuel, and oil"
    formula: "Fuel costs for farm equipment and vehicles"
    irsRef: "Schedule F Instructions, Line 19"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 33 - total farm expenses sums all expense lines"

  - line: "20"
