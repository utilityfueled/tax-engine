    formula: "Lease payments for farm equipment and vehicles"
    irsRef: "Schedule F Instructions, Line 24a"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 33 - total farm expenses sums all expense lines"

  - line: "24b"
    description: "Rent or lease — other (land, animals, etc.)"
    formula: "Lease payments for land, pasture, and other farm property"
    irsRef: "Schedule F Instructions, Line 24b"
    testRef: "tests/engine/schedules/schedule-f.test.ts::Schedule F Line 33 - total farm expenses sums all expense lines"

  - line: "25"
    description: "Repairs and maintenance"
    formula: "Repair costs for farm buildings, equipment, and fences"
