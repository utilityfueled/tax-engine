notes: |
  Source-bound successor to the known-no-later-activity code6 method. Admit only
  an actual January1 prohibited event and actual same-day custodian conversion
  of all cash into a domestic ordinary deposit owned by the primary taxpayer,
  who is the actual designated beneficiary. No attribution of continued trust
  income is inferred. Require full-year complete original bank/custody ledger,
  opening cash equal actual January1 deemed amount, positive actual bank interest,
  closing cash=opening cash+interest, and knownzero other income/gains/losses and
  all other flows. The complete original same-year/owner/payer/account Box1 INT
  statement must already be present exactly once and match its captured snapshot.
  Existing ScheduleB reports that interest once; Form1099Q does not add it again.
  Missing original arrays, identities, history or amounts are unknown. All other
  original INT boxes must be knownzero in this finite method; no partial original
  allocation, foreign/US-government/exempt interest, securities or retained trust.
  Keep original zero qualified education expenses/QTP contributions, no credit,
  no penalty exception, no pledge and no basis-loss method. A zero-interest case
  uses the existing verified-no-activity method, not this positive-interest packet.
  Current Pub970 is titled2025 and contains no identified worked example of this
  exact account conversion. Cases below are independently derived synthetic facts.
  No UI, state classification, annual export or human approval is enabled.
lines:
  - line: "deemed-distribution"
    description: "Separate actual original deemed earnings from later bank interest"
    formula: "Actual January1 cash1000 minus basis700 gives taxable deemed earnings300 and additional tax30; later original bank interest100 remains separate"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::admits source-proven January1 cash conversion without changing deemed earnings"
  - line: "interest-once"
    description: "Count the actual bank original once through the existing ScheduleB"
    formula: "Canonical2025 actual bank Box1 interest100 plus original deemed earnings300 gives AGI400, not500; additional education tax30"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::requires actual canonical originals and reports ordinary interest exactly once"
  - line: "complete-source-proof"
    description: "Require actual ownership, conversion, identities and all flow/category zeros"
    formula: "Missing, unknown, stale, conflicting, foreign-year, nonprimary, other-flow and non-January1 conversion reject; no source inference"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::rejects incomplete changed or unsupported conversion sources"
  - line: "no-statement-reuse"
    description: "Do not allocate one original across separate terminated accounts"
    formula: "The same actual INT index or same owner/payer/account/year cannot serve two terminated accounts; partial amounts remain unsupported"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::rejects duplicate original assignment and partial original allocations"
  - line: "exact-cash-conservation"
    description: "Preserve source precision before existing annual form rounding"
    formula: "Opening1000.00000000000000000001 plus bank interest0.00000000000000000001 equals closing1000.00000000000000000002; no rounded ledger match"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::validates exact source cash conservation before form rounding"
  - line: "private-source-boundary"
    description: "Keep original bank ownership and custody sources outside hosted metadata and provider context"
    formula: "New nested private sources cannot enlarge explicit hosted/provider allowlists"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::keeps nested custodian and bank originals outside hosted and provider metadata"
  - line: "distinct-originals"
    description: "Allow independently proved accounts without reusing their original interest"
    formula: "Two actual distinct bank accounts with100 and200 interest and independent300 deemed earnings each give ScheduleB300, education earnings600, AGI900 and education additional tax60"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::preserves two independently sourced cash accounts without merging their originals"
  - line: "known-zero-history"
    description: "Retain the existing known-no-activity method without accepting unknown history"
    formula: "Known no later activity retains deemed earnings300 and tax30; absent confirmation remains unknown and zero interest does not qualify the new positive-interest packet"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::retains known-zero no-activity history without using the new positive-interest method"
  - line: "accurate-later-interest-audit"
    description: "Describe actual separate interest without claiming no later income"
    formula: "Validated converted-deposit rows report original ScheduleB interest separately with no other activity and no second inclusion; legacy no-activity rows retain their actual no-later-income wording"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::describes actual later bank interest accurately in both distribution audit trails"
  - line: "actual-domestic-deposit"
    description: "Require actual domestic deposit classification rather than infer it from TIN or Box7"
    formula: "Missing or false domesticBankDepositConfirmed remains unsupported despite complete otherwise matching INT original and empty foreign-tax country"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::rejects unknown actual domestic deposit classification"
  - line: "ambiguous-duplicate-original"
    description: "Do not let optional original year or owner erase a duplicate bank account"
    formula: "Same actual bank payerTIN/account original with missing year, owner, TIN or account remains ambiguous and rejects, never bank interest200/AGI500 instead of100/400"
    testRef: "tests/engine/forms/form-1099-q-post-disqualification-interest.test.ts::rejects bank-account duplicates with missing optional original identity"
