notes: |
  Return year on a training publication is documentary metadata only, never an
  actual taxpayer fact, qualified final form, completed return or readiness.
  Revision year is not return year. Keep15sample IDs and all current gates/caps.
  Preserve explicitly saved historical document/workspace years without migration.
lines:
