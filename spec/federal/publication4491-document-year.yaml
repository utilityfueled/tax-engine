    formula: 'Retain4491legacy2025ID at exact accessible2025body; X revision2026ID has2025hint. Generic rolling filenames establish no year.'
    testRef: 'tests/apps/web/publication4491-year.test.ts::catalog keeps fifteen historical sample IDs and separates revision from return year'
  - line: cover
    formula: 'Actual Publication4491/-X cover detected before sample form parsers; single unique YYYY RETURNS in bounded cover prefix establishes metadata. Missing/conflicting staysnull; no financial facts seeded.'
    testRef: 'tests/apps/web/publication4491-year.test.ts::actual official covers and conflicting or missing cover years remain documentary only'
  - line: upload
    formula: 'Actual local PDF extraction preserves training cover kind/year over any filename hint; generic name alone unknown. Existing unsupported-year/manual-review gates remain.'
    testRef: 'tests/apps/web/publication4491-year.test.ts::real PDF uploads propagate cover metadata without filename promotion or facts'
  - line: history
    formula: 'Explicit saved historical source/workspace years remain unchanged on reload.'
    testRef: 'tests/apps/web/publication4491-year.test.ts::reload preserves explicit historical document and workspace years'
  - line: origin
