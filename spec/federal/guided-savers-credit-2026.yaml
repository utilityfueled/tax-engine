form: "Form 8880 guided ordinary Roth IRA contribution"
taxYear: 2026
reference: https://www.irs.gov/pub/irs-prior/f8880--2026.pdf
instructions: https://www.irs.gov/publications/p590a
notes: >-
  This source packet covers one primary holder on a single federal return,
  with regular Roth IRA contributions only. Existing federal rules control
  the credit and its transfer. Annual calculation, export and filing gates
  continue to apply independently.
lines:
  - line: "1–3"
    description: Reconcile the primary holder's actual Roth IRA contribution
    formula: >-
      Use the amount designated for 2026 on the referenced contribution record.
      Require the exact same amount in the confirmed, timely ordinary IRA
      worksheet and require actual eligible IRA compensation at least equal
      to the contribution. Confirm the absence of other qualifying contributions
      and income exclusions. Hold conflicting employer, owner or contribution facts.
    testRef: "tests/guided-interview/guided-savers-credit-2026.test.ts::transfers the ordinary Roth contribution into Form 8880 and Schedule 3"
  - line: "4"
    description: Derive the primary holder's reduction from actual distribution records
    formula: >-
      Require the reviewed testing period through the applicable ordinary or
      extended due date. Sum each distinct, confirmed includible primary-owner
      distribution after 2023 and before that due date. An explicitly confirmed
      empty list supplies zero. Distributions received in 2026 or positive
      current-return Form 1099-R originals require separate source reconciliation.
    testRef: "tests/guided-interview/guided-savers-credit-2026.test.ts::sums distinct actual testing-period distributions without rounding cents"
  - line: "4, historical original proof"
    description: Reconcile a single fully taxable 2024 or 2025 traditional IRA payment from two historical issuer records
    formula: >-
      When the taxpayer chooses to provide historical proof for the sole
      includible distribution, keep the 2024 or 2025 Form 1099-R and matching issuer
      payment out of current-year income. Use the receipt date, reference and
      actual amount already entered on that row. Match the independently entered
      original form year to the receipt date and confirm the original's
      owner, Code 7, IRA checkbox, and determined taxable amount equal to
      gross; match both records' issuer EINs and redacted account references.
      Compare the recipient's last four digits and age at receipt to the
      existing taxpayer information. Require separately referenced records,
      no current Form 1099-R originals or line 4 exclusions, and actual
      completion of the full testing period. Hold incomplete or inconsistent
      proof; preserve separately affirmed distributions without proof. Retain
      saved evidence through autosave and year or owner edits, requiring fresh
      confirmation when the proof, return year, owner or testing period changes.
    testRef: "tests/guided-interview/guided-savers-credit-2026.test.ts::reopens guided %i historical proof and transfers the exact reduction only to Form 8880"
  - line: "4, historical record collection"
    description: Collect the historical proof from a single distribution row
    formula: >-
      For a single valid 2024 or 2025 receipt date, offer the corresponding
      historical records. Leave the year printed on Form 1099-R blank until
      the taxpayer copies it from the original.
    testRef: "tests/apps/web/savers-credit-details.test.tsx::collects %i historical records without prefilling the original year"
  - line: "6–12"
    description: Carry owner-specific annual eligibility facts to the existing calculation
    formula: >-
      Require the actual number of qualifying full-time student calendar months and
      the primary holder's dependency answer. Reconcile a saved dependency answer
      and use the return's actual date of birth. Hold missing, conflicting or
      out-of-scope evidence. Preserve the engine's eligibility, amount cap, rate
      and tax-liability limit.
    testRef: "tests/guided-interview/guided-savers-credit-2026.test.ts::requires complete and consistent return-year proof"
  - line: "Schedule 3, line 4"
    description: Transfer the confirmed guided worksheet through the ordinary return bridge
    formula: >-
      Pass the reconciled packet from Credits to the federal calculation and
      hold the return when confirmation becomes stale. Reveal Adjustments for
      a saved credit worksheet so taxpayers can enter the linked IRA facts.
      Preserve the worksheet across year edits while requiring fresh confirmation.
    testRef: "tests/guided-interview/guided-savers-credit-2026.test.ts::projects through the guided return and reconfirms after source changes"
