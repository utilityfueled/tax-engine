form: "Section170(d)(1)(B) charitable carry adjustment"
fullName: "Current public-cash contribution carry and actual NOL carry coordination"
taxYear: 2025
irsReference: "https://www.ecfr.gov/current/title-26/section-1.170A-10"
notes: |
  IRC170(d)(1)(B) and Reg1.170A-10(d)(1) reduce tentative current charitable
  carry only to the extent the excess contribution increases NOL carry to a
  succeeding year. The regular NOL claim and actual absorption do not change.
  Recompute modified172 income without the excess contribution, including
  percentage limits, earlier permitted NOLs, deduction choice and expiration.
  Cash170(b)(1)(G)(ii) applies the same coordination. For2026,170(d)(1)(C)
  adds eligible floor disallowance before(B); the counterfactual removes source
  contributions, not merely a post-floor deduction. No original receipt is
  edited. Counterfactual amounts are internal calculation data, not user inputs.
  This bounded route requires actual current public cash gifts and no prior or
  mixed-category carry. Positive independent AMT carry and actual2026 standard
  deduction carry coordination require their separately established methods.
  Current-year formulas below are derived statutory examples, not published IRS
  numeric examples. The historical regulation example retains its old50percent
  amounts only as a test of the carry-difference rule, not current-year limits.
lines:
  - line: "historical-rule"
    description: "Apply the published historical carry difference without importing its rates"
    formula: "Reg1.170A-10(d)(1) Example1: tentative30000 less25000 increase in NOL carry leaves5000. A zero increase leaves tentative carry unchanged; reduction cannot exceed tentative excess."
    irsRef: "Reg1.170A-10(d)(1) Example1; IRC170(d)(1)(B)"
    testRef: "tests/engine/forms/charitable-net-operating-loss.test.ts::applies the published historical carry difference without importing its rates"
  - line: "current-post2017"
    description: "Recompute the modified percentage limit using only nonexcess contributions"
    formula: "2025wages100000/cash60000/NOL100000: claim32000, finalAGI68000, charity40800/tentative19200. ActualNOLcarry68000; without excess gift40800 modifiedTI59200 gives47360absorption/52640carry. Reduce charity15360 to3840. With two100000vintages, later modifiedAGI68000/charity40800/TI27200 less8000reserve absorbs19200 more; actualcarry148800. Counterfactual laterAGI52640/charity31584/TI21056 less11840reserve absorbs9216 more; comparisoncarry143424. Difference5376 leaves13824charity carry. These are derived examples, not IRS published numerical oracles."
    irsRef: "IRC170(b)(1)(G)(ii),170(d)(1)(B),172(b)(2); Reg1.172-5(a)(2)(ii)"
    testRef: "tests/engine/federal-charitable-nol.test.ts::reduces current charity carry by the separately refigured succeeding NOL carry increase"
  - line: "deduction-choice-expiry"
    description: "Respect the actual deduction election and whether a loss survives"
    formula: "2025wages50000/cash30000/pre2018NOL50000: actualclaim50000/absorption20000. Automatic counterfactual uses15750standard, leaving15750NOLcarry; actual30000carry increase14250 reduces charity to15750. Explicit itemized counterfactual absorbs50000 and reduces charity to0. A2005loss expires after2025, creates no succeeding carry and leaves30000charity carry."
    irsRef: "Reg1.170A-10(a)(2),(d)(1); IRC172(b)(1)(A) pre2018 expiration"
    testRef: "tests/engine/federal-charitable-nol.test.ts::recomputes deduction choice and does not exchange an expiring NOL for charity carry"
  - line: "floor"
    description: "Remove excess source contributions before reapplying the modified floor"
    formula: "Isolated2026itemized wages100000/cash60000: currentlimit40500/claim32400, finalAGI67600/charity40222/tentative19778. Counterfactual gift40222 minus500modifiedfloor gives39722deduction/60278TI/48222absorption/51778NOLcarry. Actual67600NOLcarry increases15822, leaving3956charity carry. Full-year readiness remains closed."
    irsRef: "IRC170(b)(1)(I),170(d)(1)(C) before(B); derived source-removal counterfactual"
    testRef: "tests/engine/federal-charitable-nol.test.ts::reapplies the isolated2026 floor to the nonexcess source contribution"
  - line: "sources"
    description: "Preserve receipts and reject unknown carry character"
    formula: "Aggregate source cents before form-dollar carry reconciliation. Require known current date, actual public qualification, explicit non-private classification and no prior/pass-through/property gifts. Do not copy regular carry to an unknown or positive independent AMT-charity ledger."
    irsRef: "IRC170(a),(b),(d); Reg1.170A-10(d); Form172 recordkeeping"
    testRef: "tests/engine/federal-charitable-nol.test.ts::preserves original cents and requires actual current public-cash carry sources"
  - line: "alternative-carry"
    description: "Retain independent charitable carry for known-empty alternative NOL history"
    formula: "Reg1.55-1(a) applies170 and56 substitutes the alternative loss ledger. The supported confirmed no-ATNOL source packet leaves tentative19200 AMT charitable carry, independently of regular3840. Positive ATNOL requires the unfinished separate charity coordination method; no regular carry copy."
    irsRef: "Reg1.55-1(a),(b); IRC56(a)(4),(d),170(d)(1)(B); derived separate-computation reading"
    testRef: "tests/engine/federal-charitable-nol.test.ts::reduces current charity carry by the separately refigured succeeding NOL carry increase"
  - line: "review"
    description: "Show both carries and reject stale review sources"
    formula: "Review statement identifies tentative19200, reduction15360 and remaining3840; preserves actual NOL68000 and comparison52640. Retain separately recomputed counterfactual income and each vintage absorption; never replace the actual current claim. Receipt aggregate, final carry, comparison ledger and unique audited adjustment must reconcile after identifier redaction."
    irsRef: "Form172 deduction statement and source recordkeeping; IRC170(d)(1)(B)"
    testRef: "tests/pdf/charitable-nol-review.test.ts::retains the source-bound charity adjustment separately from actual NOL carry"
