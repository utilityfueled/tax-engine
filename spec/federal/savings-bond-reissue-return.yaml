  - line: "current-half-dollar-review"
    description: "Save the actual half-dollar source distinction and reported Form1040 values"
    formula: "The saved source-bound reference preserves exact current transfer1/2 and eligible redemption1/2 while reporting line6/exclusion1; physical1040line2b is blank for zero under the existing mapper convention and AGI80000. The raw originalBox3 remains1 and no per-source penny allocation is manufactured."
    testRef: "tests/pdf/savings-bond-reissue-review.test.ts::saves half-dollar source amounts before reported exclusion rounding"
  - line: "source-precision"
    description: "Keep every original digit through the reported worksheet and interest total"
    formula: "Four redemptions each yield0.125 minus10^-65, so exact aggregate interest is0.5 minus4*10^-65 and reports0. The complete current statements retain all actual digits; Form8815 and ScheduleB each report0 rather than rounding intermediate sums up. Do not mutate global Decimal precision."
    testRef: "tests/engine/savings-bond-reissue-return.test.ts::preserves original precision below an aggregate reporting boundary"
  - line: "aggregate-cents"
