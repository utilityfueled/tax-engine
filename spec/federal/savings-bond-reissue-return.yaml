form: "Savings-bond reissue return reporting"
fullName: "Original reissue and redemption interest through Schedule B and Form 8815"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p550"
retrievedAt: "2026-10-27"
notes: |
  Consumes the actual source method in savings-bond-reissue-sources.yaml.
  Pub550 separates current transferor recognition, later redemption interest,
  and previously recognized amounts included in a current Form1099-INT. The
  actual original Box3 and its original account/owner are retained. Each linked
  redemption and current transfer belongs to exactly one statement source.
  IRC135(a) excludes only eligible redemption interest, not interest recognized
  on reissue. The Form8815 source worksheet labels the current-transfer amount
  separately; it is never described as prior-year interest. Actual statement
  inclusion, including an explicit zero, is required rather than inferred from
  a paper/electronic classification. Current taxable interest enters through
  original Box3 once; the calculated recognition is not added again.
  The retained published worksheet rounds its individual printed lines. Exact
  history fractions are accumulated before reporting a line; actual originals
  are never replaced by a constructed cent allocation. Current-transfer
  separation uses exact source amounts before reporting line6; the separately
  displayed transfer subtotal is not an extra rounded subtraction. This
  source-derived additional worksheet is not a published IRS
  numerical example. For every supplied actual reissue packet, including a
  historical-only packet or accompanying ordinary non-reissue redemptions,
  final line6 aggregates the exact eligible source amounts before rounding.
  The retained printed worksheet1-8 audit shows independently rounded line
  values; subtracting those displayed subtotals can differ from that final
  exact-source total. No displayed rounded subtotal replaces an original.
  Final2026 physical qualification remains separate.
lines:
