    formula: "Two actual current transfers of0.50 report1, not2; their combined eligible redemption interest1 remains separate. Two proportional reissue originals each with0.49 redemption interest give combined0.98 and reported exclusion1; compare the bound to reported remainingBox3=1 while preserving the two actual0.49 statements. Reverse the originals without changing the result or Decimal global precision."
    testRef: "tests/engine/savings-bond-reissue-return.test.ts::aggregates exact source fractions and compares reported statement bounds"
  - line: "private-review"
    description: "Bind the complete original return and exact history before any PDF I/O"
    formula: "Only the original return or its exact identifier-redacted copy may use the opaque prepared token. Recompute current/prior history, statement interest, Form8815 and MAGI; reject changed income, owner, history, reported amount, audit or serialized token before creating output. Saved1040line2b=100,AGI80100; reference separates transfer100 from eligible redemption400 without original IDs."
