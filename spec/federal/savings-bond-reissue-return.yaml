  - line: "canonical-current-reissue"
    description: "Keep current transfer recognition taxable after a current redemption"
    formula: "The same original reissued and redeemed in the current year has100 taxable transfer interest plus400 eligible redemption interest. ActualBox3=500 is reported once, prior adjustment0, Form8815 interest/exclusion400, ScheduleB taxable100."
