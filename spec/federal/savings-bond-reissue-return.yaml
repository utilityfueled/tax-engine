    description: "Separate exact current transfer recognition before rounding eligible redemption interest"
    formula: "Actual principal500 and reissuevalue501, followed by two actual250.50 redemptions, give originalBox3=1. Current transfer0.50 and eligible redemption0.50 are distinct exact source amounts. Report eligible Form8815line6=1 at its own boundary; do not subtract the separately displayed rounded transfer1 from rounded worksheetinterest1. Complete expenses5000 yield exclusion1, ScheduleB taxable0 and AGI80000. Below/above controls retain actual0.49/0.51 and unchanged input/global precision."
