    formula: "Original3000principal funded1000/2000, value4000 at whole current reissue to spouse, final proceeds5000. Current transfer1000/3 and redemption5000/3 sum2000 exactly. Retain both fractions, report the worksheet's transfer333 and current eligible interest1667; originalBox3=2000 yields333 taxable after full exclusion."
