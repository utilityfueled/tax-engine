  # ── Part VII: Additional Tax on Excess Contributions to HSAs ──

  - line: "42"
    description: "Prior year HSA excess contributions carryforward"
    formula: "Enter excess contributions from Line 48 of your prior-year Form 5329; if zero, skip to Line 47"
    irsRef: "Form 5329 Instructions, Part VII, Line 42"
    inputs:
      - "Prior-year Form 5329 Line 48 HSA excess contribution carryforward"
    notes: "This is the total uncorrected HSA excess that was carried forward from the prior tax year. If this is zero, only current-year excess contributions on Line 47 are relevant."
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VII Line 42 - prior-year HSA excess carryforward enters the excess contribution pipeline"

  - line: "43"
    description: "Available HSA contribution room to absorb prior-year excess"
    formula: "If HSA contributions for 2025 are less than the maximum allowable contribution, enter the difference; otherwise enter 0"
    irsRef: "Form 5329 Instructions, Part VII, Line 43"
    inputs:
      - "Maximum allowable HSA contribution for 2025 (Form 8889 Line 8)"
      - "Actual 2025 HSA contributions (Form 8889 Line 2 + Line 11)"
    notes: "The actual-source path in form-5329-hsa-owner.yaml keeps each taxpayer separate and also adds absorbed prior excess to that owner's Form8889line13. Only the historical unqualified compatibility path aggregates room across spouses; it must not be used as a source-qualified joint form. The contribution room equals max(0, Form 8889 Line12 - Line2). When the federal orchestrator has computed Form 8889, these values are auto-derived from the Form 8889 results unless the caller provides an explicit manual override. The manual override remains available for cases where Form 8889 is not attached or the caller has corrected the room externally."
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VII Line 43 - unused HSA contribution room absorbs prior-year excess"

  - line: "44"
    description: "HSA distributions included in income"
    formula: "2025 HSA distributions from Form 8889 Line 16"
    irsRef: "Form 5329 Instructions, Part VII, Line 44"
    inputs:
      - "2025 taxable HSA distributions (Form 8889 Line 16)"
    notes: "Taxable HSA distributions for the year reduce prior-year excess. This uses Form 8889 Line 16, which is the net taxable amount after qualified medical expense offsets, not the gross distribution amount. The actual-source path uses only the same owner's Line16; historical aggregate compatibility remains unqualified and must not establish joint-source correctness."
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VII Line 44 - HSA distributions reduce prior-year excess"

  - line: "45"
    description: "Total reductions to prior-year HSA excess"
    formula: "Line 43 + Line 44"
    irsRef: "Form 5329 Instructions, Part VII, Line 45"
    inputs:
      - "Form 5329 Line 43"
      - "Form 5329 Line 44"
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VII Line 45 - sum of reductions to prior-year HSA excess"

  - line: "46"
    description: "Remaining prior-year HSA excess contributions"
    formula: "max(0, Line 42 - Line 45)"
    irsRef: "Form 5329 Instructions, Part VII, Line 46"
    inputs:
      - "Form 5329 Line 42"
      - "Form 5329 Line 45"
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VII Line 46 - remaining prior-year HSA excess after reductions floors at zero"

  - line: "47"
    description: "Current-year HSA excess contributions"
    formula: "Excess HSA contributions for 2025: when entered directly, use the validated current-year HSA excess amount; when auto-derived from supported Form 8889 results, compute max(0, Form 8889 Line 2 + Line 11 - Line 8) per owner and then reduce that owner's excess, not below zero, by any supported Form 1099-SA Box 1 code 2 returned excess contributions withdrawn by the due date with earnings reported in Box 2, plus any separately validated 2025 excess contributions withdrawn under the section 301.9100-2 6-month amended-return relief window after the original due date but still treated as not contributed on the amended 2025 return when the correction can be attributed to the same HSA owner; on a married-filing-jointly return with multiple owner-specific Form 8889 results, a single aggregate section 301.9100-2 correction amount is owner-ambiguous and is therefore suppressed from the auto-derived reduction until owner-specific attribution is validated"
    irsRef: "Form 5329 Instructions, Part VII, Line 47"
    inputs:
      - "2025 HSA contributions that exceed the allowable limit (Form 8889 Line 2 + Line 11 - Line 8)"
      - "Supported Form 1099-SA Box 1 code 2 returned excess contributions withdrawn by the due date with associated Box 2 earnings"
      - "Validated 2025 HSA excess contributions withdrawn under the section 301.9100-2 amended-return relief window (timely filed original return, withdrawal within 6 months after the original due date excluding extensions)"
    notes: "Current-year HSA contributions (personal plus employer plus qualified funding distributions) that exceed the 2025 statutory limit. When the federal orchestrator has computed Form 8889, this value is auto-derived from the Form 8889 results unless the caller provides an explicit manual override. In that auto-derived path, supported Form 1099-SA Box 3 code 2 records reduce only the corresponding owner's current-year excess amount, not below zero, because timely returned excess contributions with associated earnings are treated as not contributed for the excise-tax computation. The supported slice now also accepts a separately validated section 301.9100-2 amended-return correction amount for excess contributions that were not withdrawn by the original due date but were withdrawn within 6 months after that due date on a timely filed original return; those corrected contributions are likewise treated as not contributed on the amended 2025 return. On MFJ returns this reduction remains owner-scoped before the owner-level excess amounts are aggregated, so one spouse's timely returned excess correction does not offset the other spouse's HSA excess, and an aggregate section 301.9100-2 correction amount is conservatively suppressed whenever multiple spouse-specific Form 8889 results make the owner attribution ambiguous. The related section 301.9100-2 correction earnings belong in current-year other income on the amended return and are tracked separately from this line even when the owner-specific excess reduction is suppressed."
    testRef: "tests/engine/federal.test.ts::Form 5329 Part VII - aggregate section 301.9100-2 HSA relief stays manual on MFJ owner-specific Form 8889 paths"

  - line: "48"
    description: "Total HSA excess contributions"
    formula: "Line 46 + Line 47"
    irsRef: "Form 5329 Instructions, Part VII, Line 48"
    inputs:
      - "Form 5329 Line 46"
      - "Form 5329 Line 47"
    notes: "This is the total HSA excess carried into the 6% tax calculation and also the amount that carries forward to next year's Line 42."
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VII Line 48 - total HSA excess is sum of remaining prior-year and current-year excess"

  - line: "49"
    description: "Additional tax on excess contributions to HSAs"
    formula: "6% × min(Line 48, value of HSAs on December 31, 2025 including 2025 contributions made in 2026)"
    irsRef: "Form 5329 Instructions, Part VII, Line 49"
    inputs:
      - "Form 5329 Line 48"
      - "Value of all HSAs on December 31, 2025"
    notes: "The 6% excise tax applies to the smaller of the total HSA excess contributions or the year-end fair market value of all HSAs. The FMV includes 2025 contributions made in early 2026 before the filing deadline. This amount is included on Schedule 2 (Form 1040), Line 8."
    edgeCases:
      - "When the year-end HSA value is less than the total excess, the tax is capped at 6% of the HSA value"
      - "Zero-value HSA on December 31 results in no tax even if Line 48 is positive"
      - "FMV includes 2025 contributions made in 2026 before the filing due date"
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VII Line 49 - 6% tax on the smaller of total HSA excess or year-end HSA value"

  # ── Part VIII: Additional Tax on Excess Contributions to ABLE Accounts ──

  - line: "50"
    description: "Prior year ABLE account excess contributions carryforward"
    formula: "Enter excess contributions from Line 53 of your prior-year Form 5329; if zero, skip to Line 52"
    irsRef: "Form 5329 Instructions, Part VIII, Line 50"
    inputs:
      - "Prior-year Form 5329 Line 53 ABLE excess contribution carryforward"
    notes: "This is the total uncorrected ABLE account excess that was carried forward from the prior tax year. ABLE accounts are tax-advantaged savings accounts for individuals with qualifying disabilities under IRC §529A."
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VIII Line 50 - prior-year ABLE excess carryforward"

  - line: "51"
    description: "Reductions to prior-year ABLE excess (contribution room plus distributions)"
    formula: "Available ABLE contribution room for 2025 plus 2025 ABLE distributions"
    irsRef: "Form 5329 Instructions, Part VIII, Line 51"
    inputs:
      - "Available ABLE account contribution room for 2025"
      - "2025 ABLE account distributions"
    notes: "The standard ABLE contribution limit is the annual gift tax exclusion ($18,000 for 2025). Working ABLE account holders can contribute an additional amount up to the lesser of their compensation or the federal poverty line amount ($15,060 for 2025, 48 contiguous states). Contribution room is the limit minus actual contributions. Distributions from ABLE accounts also reduce prior-year excess."
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VIII Line 51 - contribution room and distributions reduce ABLE excess"

  - line: "52"
    description: "Current-year ABLE excess contributions"
    formula: "Excess ABLE contributions for 2025"
    irsRef: "Form 5329 Instructions, Part VIII, Line 52"
    inputs:
      - "2025 ABLE contributions that exceed the allowable limit"
    notes: "Current-year ABLE contributions that exceed the 2025 limit. Contributions withdrawn by the filing due date (including extensions) with associated earnings are treated as not contributed."
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VIII Line 52 - current-year ABLE excess contributions"

  - line: "53"
    description: "Additional tax on excess contributions to ABLE accounts"
    formula: "6% × max(0, (Line 50 - Line 51) + Line 52), capped at 6% of the year-end ABLE account value"
    irsRef: "Form 5329 Instructions, Part VIII, Line 53"
    inputs:
      - "Form 5329 Line 50"
      - "Form 5329 Line 51"
      - "Form 5329 Line 52"
      - "Value of all ABLE accounts on December 31, 2025"
    notes: "The 6% excise tax applies to the smaller of the total ABLE excess (remaining prior-year excess plus current-year excess) or the year-end value of all ABLE accounts. This amount is included on Schedule 2 (Form 1040), Line 8."
    edgeCases:
      - "When the year-end ABLE value is less than the total excess, the tax is capped at 6% of the ABLE value"
      - "Zero-value ABLE account on December 31 results in no tax"
      - "Working ABLE beneficiaries have a higher contribution limit"
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part VIII Line 53 - 6% tax on ABLE excess contributions"

  # ── Part IX: Additional Tax on Excess Accumulations in Qualified Retirement Plans ──
  - line: "54"
    description: "Minimum required distribution for 2025"
    formula: "The required minimum distribution for the tax year from qualified retirement plans (including IRAs), computed using the Uniform Lifetime Table, Joint Life and Last Survivor Table, or Single Life Table from IRS Publication 590-B, or using the plan administrator's calculated amount for employer-sponsored plans"
    irsRef: "Form 5329 Instructions, Part IX, Line 54; IRS Publication 590-B"
    inputs:
      - "Required minimum distribution amount for the tax year"
    notes: "The taxpayer must determine their RMD separately for each qualified retirement plan and IRA. For traditional, SEP, and SIMPLE IRAs, the RMD is based on the prior December 31 account balance divided by the applicable life-expectancy divisor. For employer-sponsored plans, the plan administrator generally calculates the RMD. The engine accepts a pre-computed aggregate RMD amount. Under SECURE 2.0, the RMD beginning age is 73 for taxpayers born 1951-1959 and 75 for taxpayers born 1960 or later."
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part IX Line 54 - required minimum distribution"

  - line: "55"
    description: "Amount actually distributed for 2025"
    formula: "Total distributions actually taken from qualified retirement plans and IRAs for the tax year to satisfy the RMD requirement"
    irsRef: "Form 5329 Instructions, Part IX, Line 55"
    inputs:
      - "Actual distributions taken to satisfy RMD"
    notes: "This includes all distributions that count toward satisfying the RMD, including distributions from one IRA that satisfy the RMD for another IRA. It does not include amounts rolled over, converted to a Roth IRA, or recharacterized."
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part IX Line 55 - actual distributions taken"

  - line: "56"
    description: "Excess accumulation (RMD shortfall)"
    formula: "max(0, Line 54 - Line 55)"
    irsRef: "Form 5329 Instructions, Part IX, Line 56"
    inputs:
      - "Form 5329 Line 54"
      - "Form 5329 Line 55"
    notes: "If actual distributions equal or exceed the RMD, there is no shortfall and no penalty applies."
    edgeCases:
      - "Actual distributions exceeding the RMD result in zero shortfall"
      - "Partial distributions reduce the shortfall but do not eliminate the penalty"
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part IX Line 56 - shortfall is zero when actual distributions meet or exceed RMD"

  - line: "57"
    description: "Additional tax on excess accumulations"
    formula: "Line 56 × 25% if the shortfall was not corrected within the correction window, or Line 56 × 10% if the shortfall was corrected within the correction window as defined in IRC section 4974(d)"
    irsRef: "Form 5329 Instructions, Part IX, Line 57; IRC section 4974; SECURE 2.0 Act section 302"
    inputs:
      - "Form 5329 Line 56"
      - "Whether the shortfall was corrected within the correction window"
    notes: "SECURE 2.0 Act section 302 reduced the excise tax from 50% to 25% effective for tax years beginning after December 29, 2022. The rate is further reduced to 10% when the taxpayer takes the missed RMD distribution by the end of the correction window, which generally runs through the end of the second taxable year beginning after the year the tax was imposed. For the reduced 10% rate to apply, the taxpayer must also file Form 5329 and pay the reduced tax. This amount is included on Schedule 2 (Form 1040), Line 8."
    edgeCases:
      - "Zero shortfall results in zero tax regardless of the rate"
      - "Correcting the shortfall within the correction window reduces the rate from 25% to 10%"
      - "Filing Form 5329 is required even when requesting the reduced 10% rate"
      - "The 50% rate applied for tax years before 2023; the engine uses the 25%/10% rates for 2025"
    testRef: "tests/engine/forms/form-5329.test.ts::Form 5329 Part IX Line 57 - 25% default penalty on excess accumulations"
