form: "Form 8919 final 2026 physical candidate"
fullName: "Uncollected Social Security and Medicare Tax on Wages final annual physical source contract"
taxYear: 2026
reference: "https://www.irs.gov/pub/irs-pdf/f8919.pdf"
revision: "Created 5/14/26"
postedAt: "2026-11-20"
retrievedAt: "2026-11-20T22:45:29Z"
notes: |
  The regular and annual archive IRS PDFs match. Page two contains the annual
  instructions. The form prints the $184,500 Social Security wage base on
  line 7 and gives the same cap for RRTA compensation on line 8. Line 6 sends
  wages to Form 1040 line 1g and Form 8959 line 3 when required. Line 13 sends
  tax to Schedule 2 line 16b. These references identify the annual source.
  The internal review projection uses reconciled original firm records and the
  existing calculation. Independent review and public export qualification
  remain pending.
lines:
  - line: "revision"
    description: "Pin the official final annual blank"
    formula: "Require SHA-256 b7bfa1eb7b4b1893acdcc6399103e8cc0388e4dd64c9522e586adccdba0b42dc, 85924 bytes, two 612 by 792 point pages, and the 2026 PDF title."
    testRef: "tests/pdf/form-8919-2026-candidate.test.ts::pins the exact final annual source"
  - line: "physical-layout"
    description: "Confirm the official pages and their widget census"
    formula: "Preserve 35 text fields and five checkboxes on page one. Page two contains the instructions and has no widgets."
    testRef: "tests/pdf/form-8919-2026-candidate.test.ts::confirms the physical page and widget census"
  - line: "1-5"
    description: "Source-bound firm rows and reason codes"
    formula: >-
      Require the original 2026 firm list confirmed for the calculation's explicit
      account holder. Each unique firm supplies its name, documented federal
      identifier, reason A, C, G or H, actual Form 1099-MISC or 1099-NEC receipt
      status, and positive exact wages from column (f). If receipt is confirmed,
      bind the printed firm name and identifier to the original 1099. A or C supplies the actual
      IRS letter or correspondence date for (d); G supplies a timely actual Form
      SS-8 filing date with no IRS reply. For H the 2026 W-2 and original Form
      1099 records must match the same firm identifier and worker, and the
      confirmed reclassified wages must sum to the row's exact wages.
      Review output keeps taxpayer IDs and individual firm SSNs blank. Retain a
      separate Form 8919 for each group of up to five firms, with summary fields
      completed on only the first form.
    testRef: "tests/pdf/form-8919-2026-candidate.test.ts::projects six original firms and puts the summary on the first review form only"
  - line: "reason-a-nec-original"
    description: "Bind the single verified Reason A NEC to the physical review row"
    formula: >-
      When the return carries linked Form 1099-NEC Reason A evidence, replay
      the canonical wage reconciliation as of the supplied review date.
      Require exactly one Reason A firm row and one original NEC for the same
      owner, year, statement reference, payer name and EIN. Match column (d)
      to the IRS determination date and column (f) to the original Box 1a
      cents. Any separately supplied original wage amount must match those
      cents. Hold orphan original markers, unreceived determinations and
      conflicting review rows. Leave public export and filing unqualified.
    testRef: "tests/pdf/form-8919-2026-candidate.test.ts::binds the verified Reason A NEC to the physical review row"
  - line: "reason-h-nec-overlap"
    description: "Require independent classification of active NEC income"
    formula: >-
      The final 2026 instructions treat the Reason H amount as employee wages.
      When an original NEC supplies a positive portion of those wages, hold the
      review projection if an active NEC with positive nonemployee compensation
      cannot be distinguished by a different source year, recipient owner, or
      well-formed nonzero payer TIN. A missing year or owner does not prove
      separation. A missing, malformed or all-zero TIN cannot resolve an
      otherwise possible overlap.
      Preserve distinct NEC and withholding-only records without modifying
      amounts or reclassifying income.
    testRef: "tests/pdf/form-8919-2026-candidate.test.ts::holds Reason H review when active NEC compensation could overlap wages"
  - line: "reason-h-misc-overlap"
    description: "Require independent classification of active MISC other income"
    formula: >-
      When an original MISC supplies a positive portion of the Reason H wages,
      apply the same source year, recipient owner, and payer TIN checks to
      active MISC statements with positive Box 3 other income. A statement that
      reports only unrelated boxes such as rent, royalties or withholding can
      remain in the return.
    testRef: "tests/pdf/form-8919-2026-candidate.test.ts::holds Reason H review when active MISC other income could overlap wages"
  - line: "6-13"
    description: "Reconcile original wages and project calculated summary"
    formula: >-
      Sum original wages using Decimal at exact cents and require equality to both
      the validated 2026 input wage amount and line 6 of the 2026 calculation.
      Derive line 8 from known nonnegative W-2 Boxes 3 and 7 for the actual
      household owners and actual Form 4137 payroll. Hold unsupported RRTA combinations and a conflicting
      summary override. Fill lines 6 and 8 through 13 with the existing isolated
      2026 calculation, leaving the preprinted $184,500 untouched. Reject
      mismatched years, owners, original detail or template bytes.
    testRef: "tests/pdf/form-8919-2026-candidate.test.ts::rejects unbound or conflicting annual originals"
  - line: "closed-exports"
    description: "Keep the candidate outside public review and filing"
    formula: "The 2025 and 2026 review template registries reject these bytes. The internal field map has no public route or export registration."
    testRef: "tests/pdf/form-8919-2026-candidate.test.ts::keeps the physical candidate outside public exports"
