form: "Hosted-Subscription-Authoritative"
fullName: "Source-first authenticated current-subscription reconciliation plan"
taxYear: 2026
reference: "https://docs.stripe.com/webhooks#event-ordering; https://docs.stripe.com/api/subscriptions/retrieve"
notes: |
  Future typed-provider-stub tests only. No actual provider call or API-version
  upgrade. Preserve the pinned Stripe SDK and current finite plan mapping. The
  current snapshot is read explicitly, never invented from event timestamps.
lines:
  - line: "late-current"
    description: "An old snapshot reconciles to current state"
    formula: "Signed old active snapshot, explicitly stubbed current past-due subscription: apply past-due, preserve signed event ID/creation as audit only."
    testRef: "tests/apps/web/hosted-subscription-authoritative.test.ts::uses current state for a delayed active snapshot"
  - line: "same-second"
    description: "Same-second distinct events are not sorted by IDs"
    formula: "Distinct event IDs with equal created second and reverse lexical names each reconcile through current subscription; no timestamp or lexical skip."
    testRef: "tests/apps/web/hosted-subscription-authoritative.test.ts::reconciles distinct same-second event IDs"
  - line: "duplicate-load"
    description: "A durable duplicate performs no provider request"
    formula: "Existing event receipt yields duplicate outcome without current-state retrieval or entitlement write."
    testRef: "tests/apps/web/hosted-subscription-authoritative.test.ts::does not retrieve a durably processed duplicate"
  - line: "retrieval-error"
    description: "An unavailable provider cannot manufacture entitlement"
    formula: "Typed retrieval rejects or times out; no successful acknowledgment, durable receipt or state change; later actual-stub recovery succeeds."
    testRef: "tests/apps/web/hosted-subscription-authoritative.test.ts::keeps retrieval failures retryable (%s)"
  - line: "identity"
    description: "Contradictory retrieved identities reject"
    formula: "Independently vary subscription ID, customer, owner and mode from signed/current established source. No cross-owner reassignment or state/receipt commit."
    testRef: "tests/apps/web/hosted-subscription-authoritative.test.ts::rejects contradictory retrieved identity (%s)"
  - line: "unknown-plan"
    description: "Current metadata is validated, not inferred"
    formula: "Unknown/malformed current plan or unsupported price cannot silently reuse a paid plan or grant access; existing finite metadata rules remain enforced."
    testRef: "tests/apps/web/hosted-subscription-authoritative.test.ts::rejects unknown authoritative plan metadata (%s)"
  - line: "replacement"
    description: "A canceled old object cannot eclipse the active replacement"
    formula: "Old subscription current snapshot canceled, same customer has distinct current active subscription: commit only old event receipt, preserve replacement state and owner access."
    testRef: "tests/apps/web/hosted-subscription-authoritative.test.ts::does not eclipse an active replacement with canceled history"
  - line: "preconditions"
    description: "Authentication and mode gates precede retrieval"
    formula: "Changed signed bytes, stale signed delivery, mode mismatch, malformed creation time, future guard and self-host rejection retain old behavior with zero provider retrieval."
    testRef: "tests/apps/web/hosted-subscription-authoritative.test.ts::preserves pre-retrieval route guards (%s)"
  - line: "checked-out-client-error"
    description: "A checked-out client retains an error listener during provider I/O"
    formula: "Actual EventEmitter fixture emits a connection error during the awaited provider read. Reject reconciliation, discard the client, and remove the temporary listener on release; no process-level unhandled error or state commit."
    testRef: "tests/apps/web/hosted-subscription-authoritative.test.ts::discards a client lost while the provider callback is pending"
