form: "Form 8815"
fullName: "Exclusion of Interest From Series EE and I U.S. Savings Bonds Issued After1989"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-pdf/f8815.pdf"
notes: |
  Official2025 form contains its instructions and remains the current IRS endpoint;
  no final2026 physical form is qualified. Final indexed2026 thresholds are RevProc2025-32 section4.17. No filing readiness
  is conferred. Monetary arithmetic uses Decimal and completed lines round to dollars;
  ratios retain12decimal places, satisfying at-least-three-place instructions.
  Qualified bonds must be EE/I issued after1989 to an age24-or-older taxpayer
  (or qualified spouse ownership on a joint return), redeemed in the current year.
  Actual issue/redemption/owner birth dates, registration, face value and prior
  interest reporting are required for2026. Treasury31CFRPart321 Appendix(b)(2)(ii)
  permits age24 on the actual first-day-of-month issue date; a purchase-day date
  must not substitute for the assigned issue date. Unknown facts never become eligibility.
  Tuition/required fees and Coverdell/QTP contributions are coordinated once per
  return using distinct actual source records, not repeated once per redeemed bond.
  Known ineligible bonds/expenses yield zero benefit; malformed/contradictory facts
  reject. Legacy2025 aggregate inputs remain explicitly unverified.
  Line9 MAGI uses the official worksheet before the bond exclusion, with foreign
  net45+50, possession and employer-adoption exclusions added back, and applicable
  Pub915/IRA/PTC-SEHI/royalty-interest coordination completed by the federal caller.
  royaltyInterestAdjustment is the signed change in AGI from using the actual
  pre-exclusion royalty interest deduction; it may be negative.
businessRuleValidation:
  - rule: "reference-summary-packet"
    description: "Review-only packet must use corrected audited lines and actual source amounts."
    testRef: "tests/pdf/fill-form-8815.test.ts::buildForm8815ReferenceSummary keeps the packet artifact reference-only and limited to supported savings-bond outputs"
  - rule: "reference-audit-integrity"
    description: "Review summary requires exact-year official audited lines, rejects nonfinite/missing/duplicate/wrong-form or inconsistent totals, and uses calculated source amounts."
    testRef: "tests/pdf/fill-form-8815.test.ts::Form8815 reference rejects mismatched years incomplete audits and inconsistent totals"
  - rule: "reference-every-page-warning"
    description: "Every generated page retains the review-only notice, including overflow pages."
    testRef: "tests/pdf/fill-form-8815.test.ts::Form8815 source summary preserves worksheet amounts and every-page review warnings"
lines:
  - line: "1"
    description: "Eligible beneficiary/institution source facts"
    formula: "Actual taxpayer/spouse/claimed-dependent identity and qualified institution or plan; no invented name or address"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 reproduces the official beneficiary scholarship example"
  - line: "2"
    description: "Eligible expenses before beneficiary benefits"
    formula: "Sum qualified paid amounts minus direct-institution benefits, education-credit expenses and expenses used for tax-free ESA/QTP distributions"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 coordinates education costs once across multiple bonds"
  - line: "3"
    description: "Beneficiary nontaxable education benefits"
    formula: "Actual benefits covering line2 expenses, excluding direct-institution benefits already removed"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 reproduces the official beneficiary scholarship example"
  - line: "4"
    description: "Net qualified expenses"
    formula: "max(0,2-3)"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 reproduces the official beneficiary scholarship example"
  - line: "5"
    description: "Qualified redemption proceeds"
    formula: "Sum current-year eligible bond principal+interest"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 reproduces the official beneficiary scholarship example"
  - line: "6"
    description: "Current-year interest"
    formula: "Line6 worksheet8: eligible proceeds less paperEE face*50%, electronicEE/I face, and actual interest previously reported"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 derives current interest from face values and prior reporting"
  - line: "7"
    description: "Expense fraction"
    formula: "min(1,4/5), twelve decimal places; zero when proceeds0"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 reproduces the official beneficiary scholarship example"
  - line: "8"
    description: "Exclusion before phaseout"
    formula: "round(6*7)"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 reproduces the official beneficiary scholarship example"
  - line: "9"
    description: "Modified AGI"
    formula: "Actual completed official Line9 Worksheet; before bond exclusion, plus actual foreign/possession/adoption addbacks"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 uses independent2026 thresholds and exact phaseout boundaries"
  - line: "10"
    description: "Phaseout threshold"
    formula: "2026 MFJ152650;others101800.2025 MFJ149250;others99500. QSS uses other threshold; MFS ineligible"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 uses independent2026 thresholds and exact phaseout boundaries"
  - line: "11"
    description: "Excess MAGI"
    formula: "max(0,9-10)"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 uses independent2026 thresholds and exact phaseout boundaries"
  - line: "12"
    description: "Phaseout fraction"
    formula: "min(1,11/(MFJ30000;others15000)), twelve decimal places"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 uses independent2026 thresholds and exact phaseout boundaries"
  - line: "13"
    description: "Phaseout reduction"
    formula: "round(8*12)"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 uses independent2026 thresholds and exact phaseout boundaries"
  - line: "14"
    description: "Excludable savings bond interest"
    formula: "8-13, zero forMFS; flows ScheduleBline3"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 uses independent2026 thresholds and exact phaseout boundaries"
  - line: "6-worksheet-1"
    description: "Line6 worksheet1"
    formula: "5"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 derives current interest from face values and prior reporting"
  - line: "6-worksheet-2"
    description: "Line6 worksheet2"
    formula: "sum face of eligible paperEE"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 derives current interest from face values and prior reporting"
  - line: "6-worksheet-3"
    description: "Line6 worksheet3"
    formula: "round(worksheet2*0.5)"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 derives current interest from face values and prior reporting"
  - line: "6-worksheet-4"
    description: "Line6 worksheet4"
    formula: "sum face of eligible electronicEE andI"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 derives current interest from face values and prior reporting"
  - line: "6-worksheet-5"
    description: "Line6 worksheet5"
    formula: "worksheet3+worksheet4"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 derives current interest from face values and prior reporting"
  - line: "6-worksheet-6"
    description: "Line6 worksheet6"
    formula: "worksheet1-worksheet5"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 derives current interest from face values and prior reporting"
  - line: "6-worksheet-7"
    description: "Line6 worksheet7"
    formula: "actual previously reported interest"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 derives current interest from face values and prior reporting"
  - line: "6-worksheet-8"
    description: "Line6 worksheet8"
    formula: "worksheet6-worksheet7"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 derives current interest from face values and prior reporting"
  - line: "source-facts"
    description: "Actual source qualification"
    formula: "Require confirmed original monetary source fields and actual bond/education identities/dates/classification; preserve false source marker on reparsing"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 rejects missing original source facts and fabricated qualification"
  - line: "qualification"
    description: "Bond statutory qualification"
    formula: "EE/I; issued after1989; owner age>=24; qualified taxpayer/spouse registration; actual current-year redemption"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 distinguishes known ineligible ownership issue year and owner age"
  - line: "expense-coordination"
    description: "Unique expenses and actual benefit allocations"
    formula: "Distinct expense source IDs; no repeated per-bond expense aliases or duplicate bond source IDs; known benefit allocations do not exceed cost"
    irsRef: "Form8815 same numbered line and worksheet; IRC135; RevProc2025-32 section4.17"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 rejects duplicate sources and conflicting legacy expense aliases"
  - line: "statement-prior-interest-adjustment"
    description: "Actual previously taxed interest included in current statements"
    formula: "Confirmed actual adjustment, no greater than listed bond interest previously reported; caller subtracts it once from Schedule B gross interest and reconciles to current Box3"
    irsRef: "Form8815 Line6 Worksheet7 and ScheduleB interest instructions"
    testRef: "tests/engine/forms/form-8815-2026.test.ts::Form8815 requires actual current statement reconciliation"
