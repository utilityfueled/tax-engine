form: "Charitable filing-unit history"
fullName: "Original charitable carryovers after marriage, separation, remarriage or death"
taxYear: 2025
irsReference: "https://www.ecfr.gov/current/title-26/section-1.170A-10"
retrievedAt: "2026-10-26"
reviewStatus: "independent-review-pending"
notes: |
  Source-only implementation of Reg1.170A-10(d)(4)(i)-(iii) and (e).
  The original filed joint excess, each separate-return computation, actual
  intervening use and source references remain unchanged. This worksheet derives
  the amount available to the actual current filing unit; it does not calculate
  current income, a deduction, NOL ownership or a new carry vintage.
  The regulation's published1970 cash50 example is an allocation oracle only;
  its historical percentage rules do not replace current section170 categories.
  Separate source histories may aggregate for a current joint return without an
  invented allocation of a partial current deduction to the original owners.
  A later split following partial joint use of already allocated shares needs
  its distinct attribution method. The current regular/AMT deduction, floor,
  expiry and NOL methods retain their existing source-dependent boundaries.
lines:
  - line: "first-separate-year"
    description: "Allocate remaining joint excess using original separately computed excess"
    formula: "At the first separate filing year, remaining joint excess times each original spouse's separately computed excess after its original NOL reduction divided by both separate excesses. Published20,000 joint less3,000 and7,000 prior joint use leaves10,000; separate12,000/8,000 gives6,000/4,000. Never use the37,000/28,000 gift ratio or split the original20,000 before intervening joint use."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::derives the published first-separate-year allocation from original excesses"
  - line: "separate-use-and-reunion"
    description: "Preserve separately owned balances through later joint aggregation"
    formula: "After the first split, subtract each actual separate return's use and NOL reduction only from its owned share. A later joint return aggregates the surviving original balances. Derived6,000/4,000 less2,000/1,000 leaves7,000 together. Reordered source records do not change the result."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::preserves separate use before a later joint return without changing original years"
  - line: "remarriage-and-same-vintage"
    description: "Aggregate current spouses' sourced balances without duplicate consumption"
    formula: "A remarried person's original joint source is first allocated against the former spouse; only that person's remaining share joins the present spouse's own carry. Same contribution year/category/medium records aggregate before the ordinary percentage worksheet while retaining every original source identity. Derived6,000 plus2,000 is8,000, with a current5,000 capacity used once and3,000 pooled carry, not an invented owner closing allocation."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::aggregates actual remarried same-vintage sources once and retains their provenance"
  - line: "death"
    description: "Preserve the death-year exception and extinguish the deceased owner's later carry"
    formula: "A deceased owner's carry is available only on the actual death-year joint return or their actual final separate return. In later years preserve the deceased allocated amount as excluded provenance, not a carry of the survivor. Published10,000 with12,000/8,000 separate excesses leaves survivor4,000 and deceased6,000 excluded."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::retains the actual death-year joint balance and excludes the deceased share afterward"
  - line: "precision"
    description: "Keep source ratios and monetary precision before reporting"
    formula: "All source arithmetic uses Decimal. Retain exact numerator/denominator through allocation and actual-history subtraction; aggregate source ratios before converting to the downstream Decimal balance. Original monetary strings remain unchanged. No owner receives a fabricated residual cent or dollar. An optional recorded opening reconciles to the derived amount; it cannot replace it."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::retains exact allocation ratios and aggregates before downstream conversion"
  - line: "actual-timeline"
    description: "Require actual identities, filed years and all relevant history"
    formula: "Bind the current return to actual person names and identifier suffixes. Require unique person/return IDs, one filing unit per relevant person/year, original contribution-year return, every relevant intervening unit, known-zero use and source references, and actual death status. Unknown facts, duplicate identities, future death contradictions, missing years, use exceeding an owned balance and a conflicting current filing unit reject. Former-spouse years that cannot feed a later current joint balance are not invented."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::rejects missing conflicting or excessive actual history without changing originals"
  - line: "recurrent-partial-use"
    description: "Do not assign a joint deduction to previously allocated owners without a method"
    formula: "Known separately allocated balances can reunite. Zero joint use preserves their shares; full joint use exhausts them. Partial joint use retains only a joint pool; a later separation/death that needs its owner split rejects rather than inventing proportional or FIFO attribution. A current joint aggregate itself is determined."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::distinguishes determined reunited pools from recurrent partial-use attribution"
  - line: "unknown-schema"
    description: "Preserve missing source facts independently from explicit zero and false"
    formula: "Optional source records have no default amounts, death status, filing status, dates, identities or confirmations. Changed filing-unit mode is explicit and preserves a false unchanged-membership answer. Existing unchanged-return packets retain their original semantics."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::preserves unknown zero and false timeline facts during schema parsing"
  - line: "pooled-nol-boundary"
    description: "Pooled present-year categories do not erase distinct original excess sources"
    formula: "A same-year/category/medium joint pool retains each positive original source. Zero simultaneous NOL benefit leaves the aggregate unchanged. Positive benefit cannot be assigned to one synthetic pooled row if it contains multiple actual excess origins. A single-prior-vintage internal method likewise cannot treat a compound pool as one original. No NOL ownership or benefit formula is introduced here."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::preserves the multiple-original NOL boundary behind a joint category pool"
  - line: "review-binding"
    description: "Bind the entire original ownership packet and completed federal result before template access"
    formula: "An opaque local review token accepts only the complete original input or its exact permitted identifier redaction. Retained filing-history evidence requires its original attachment even after removal. Changed wages, balanced owner computations, missing histories, result allocations or forged/serialized tokens reject before PDF I/O. The historical2025 physical ScheduleA mapper retains source-derived prior line13; the ownership appendix preserves exact original ratios without identifiers."
    testRef: "tests/pdf/charitable-filing-unit-review.test.ts::binds actual filing history and the complete calculation before template access"
  - line: "guided-sources"
    description: "Collect actual filed units and original computations without an allowance override"
    formula: "The existing charitable-history collector accepts actual people, filed units, source years, separate original computations and each return's actual use. Preserve monetary strings, explicit zero/false and unknown values. An absent optional changed-unit opening stays absent because ownership is derived. Substantive edits revoke source and timeline confirmations; confirmation-only edits do not erase another confirmation. No current deduction, contribution base, allocation percent or owner closing balance is entered."
    testRef: "tests/guided-interview/guided-charitable-filing-unit.test.ts::preserves actual timeline sources and revokes both confirmations after edits"
  - line: "guided-canonical"
    description: "Use the actual guided filing history in the ordinary calculation"
    formula: "A complete original12,000/8,000 allocation with10,000 remaining yields6,000 for the current primary filer through the actual bridge and preview. Clearing required prior use or changing the household invalidates source completion; no invented empty history or monetary total restores it."
    testRef: "tests/guided-interview/guided-charitable-filing-unit.test.ts::passes actual guided ownership sources into the canonical deduction"
  - line: "known-death-binding"
    description: "Reconcile known actual current-owner death facts"
    formula: "A current taxpayer's independently supplied death date or explicit alive fact must agree with the original timeline. Undefined remains unknown; a former spouse's death does not become a current spouse fact. A death-year joint or final separate return remains available when both sources agree."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::reconciles known current owner death facts without inventing unknown dates"
  - line: "complete-joint-pools"
    description: "Retain all original carries feeding a relevant historical joint pool"
    formula: "Changed filing-unit sources expressly include all original carryovers feeding relevant joint histories, including a former owner's later-excluded balance. Same-year/category/medium originals remain distinct. If two owners' balances are partially used together, a later split with a remaining pool rejects unless a controlling allocation method is represented; saved per-original amounts cannot invent that method. Zero use and exhaustion before separation are determined."
    testRef: "tests/engine/forms/charitable-filing-unit-history.test.ts::retains excluded original sources and rejects cross-record partial joint attribution"
  - line: "guided-editor"
    description: "Reach and edit actual filing-unit records in the existing charity collector"
    formula: "Changed-unit selection reveals source people, filed returns, original separate computations and per-return history uses. Add/remove operations preserve unknown facts; death year and source IDs are never inferred. Editing any nested fact invalidates both confirmations. Switching methods retains hidden sources and requires explicit reconciliation."
    testRef: "tests/apps/web/charitable-filing-unit-interactions.test.tsx::edits actual charitable filing units without default identity or money"
  - line: "nonitemized-retained-source"
    description: "Retain ownership evidence when a prior gift is treated as paid without a current deduction"
    formula: "The percentage helper keeps original ownership histories: derived6000 opening on5000 base uses3000 and leaves3000, with no current170(p) deduction from old cash. The final positive25floor reaches prior cash, so nonitemization no longer bypasses its pending original-vintage method. An actual zero-base source preserves all6000 and the original owner ledger without floor attribution;2026 output remains closed."
    testRef: "tests/pdf/charitable-filing-unit-review.test.ts::retains original filing history through nonitemized public cash consumption"
  - line: "review-appendix"
    description: "Render original allocation provenance beside the physical ScheduleA"
    formula: "A private original-bound appendix displays original year/category/medium, source excess and reduction, exact ownership ratios, actual filed use, excluded balances and pooled current opening. It never assigns a current pooled closing amount to individual owners. Static person/source numbering replaces identifiers and private source references. Each page carries the review-only notice; exact long ratios wrap within the page."
    testRef: "tests/pdf/charitable-filing-unit-review.test.ts::renders original ownership ratios and physical prior deduction without identifiers"
  - line: "workspace-appendix"
    description: "Include the original filing-history appendix in the actual guided download"
    formula: "The real guided bridge, preview and workspace PDF prepare the private original context before redaction. The completed packet contains the source-derived6,000 ScheduleA prior deduction and ownership appendix; missing source confirmation blocks export."
    testRef: "tests/apps/web/workspace-charitable-filing-unit.test.ts::exports actual guided charitable filing history with the review packet"
  - line: "guided-death-conflict"
    description: "Surface a known household death conflict during source completion"
    formula: "The charitable source helper reads actual household death facts already collected by the personal section. A different timeline does not complete the deductions section or canonical bridge. Unknown household dates are not filled from the timeline."
    testRef: "tests/guided-interview/guided-charitable-filing-unit.test.ts::rejects a known household death conflict during source completion"
  - line: "independent-alternative-history"
    description: "Retain an AMT-only ownership packet independently from known-empty regular history"
    formula: "A known-empty regular history and independently sourced6,000 alternative opening remain distinct. With100,000 income, no old NOLs and itemized selection, regular charity is0 and alternative charity6,000 produces a signed negative6,000 adjustment. The original alternative timeline and complete result remain bound before template access even if its attachment is removed."
    testRef: "tests/pdf/charitable-filing-unit-review.test.ts::binds independent AMT-only filing history with an explicitly empty regular ledger"
  - line: "production-guided-history"
    description: "Preserve actual filed source edits through browser save and PDF download"
    formula: "Desktop and mobile use the production guide. Changing original2023 use from3,000 to3,001 in its total and actual filed record leaves9,999 joint excess, with12,000/20,000 share yielding5,999.4 and reported ScheduleA5,999. The optional recorded opening remains absent. Both source confirmations revoke, required missing use blocks preview, exact originals survive reload, and the actual review download includes the ownership appendix without personal identifiers."
    testRef: "apps/web/tests/charitable-filing-unit.spec.ts::preserves actual ownership history through edits reload and review download"
