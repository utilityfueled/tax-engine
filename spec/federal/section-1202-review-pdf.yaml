form: "Form 8949 and QSBS review mapping"
fullName: "Complete category pages and actual QSBS review amounts"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i8949"
notes: "Official 2025 Form8949 Parts I/II and instructions refreshed 2026-10-25; ScheduleD reporting of section1202 fund distributions and Form6251 line2h. Registered final2025 templates remain review-only. No2026 or filing qualification is enabled."
lines:
  - line: "8949-categories"
    description: "Every supported category and transaction"
    formula: "Partition actual transactions into A/B/D/E and source-qualified fund issuer adjustments into F. Use one category per part, at most eleven rows per page, and additional copies until all rows appear exactly once. Preserve original row amounts, dates, issuer description and adjustment codes."
    irsRef: "Form8949 instructions, Parts I/II and columns(a)-(h)"
    testRef: "tests/pdf/section-1202-review.test.ts::retains every category and overflow transaction in interactive continuation pages"
  - line: "8949-page-totals"
    description: "Totals for rows actually printed on each page"
    formula: "Sum only that page's proceeds, basis, adjustments and gain with Decimal; round each aggregate once to the nearest dollar. Never show full-category totals on a truncated page."
    irsRef: "Form8949 line2; ScheduleD totals from all Parts I/II"
    testRef: "tests/pdf/section-1202-review.test.ts::retains every category and overflow transaction in interactive continuation pages"
  - line: "8949-fields"
    description: "Editable values and appearances on every continuation"
    formula: "Keep the original first-copy field names; assign a distinct root to each continuation. Preserve the canonical AcroForm tree, widget parent links, values and nonempty appearances across save/reopen. Review-redacted identifiers stay blank on every copy."
    irsRef: "Form8949 taxpayer header and transaction columns"
    testRef: "tests/pdf/section-1202-review.test.ts::retains every category and overflow transaction in interactive continuation pages"
  - line: "fund-transfer"
    description: "Actual fund issuer exclusion and full distributions"
    formula: "A fund-only exclusion still includes8949BoxF in the review packet. Map its negative issuerQ adjustment to ScheduleD10 while retaining the full1099DIV2a amount onD13; transfer the computed total once."
    irsRef: "ScheduleD instructions, gain from Form1099DIV box2c"
    testRef: "tests/pdf/section-1202-review.test.ts::includes fund-only issuer rows and their ScheduleD10 transfer in the review packet"
  - line: "6251-2h"
    description: "Verified pre2010 exclusion preference"
    formula: "Prepare the source-qualified calculation from original complete identity before redaction; keep it only in an opaque local render context bound to the original complete source or its fully redacted copy. Require a unique matching rounded2h audit before mapping. Reject changed retained identifiers, omitted, stale, forged or invented amounts and contexts without reconstructing identifiers."
    irsRef: "Form6251 line2h;57(a)(7)"
    testRef: "tests/pdf/section-1202-review.test.ts::reconciles actual QSBS preference before exporting Form6251"
  - line: "gates"
    description: "Unknown sources and unqualified year remain closed"
    formula: "Reject missing original source eligibility and unsupported2026 export. These complete review pages do not qualify a filing export or independently reviewed calculation."
    irsRef: "Form8949/6251 registered2025 revisions;1202 source requirements"
    testRef: "tests/pdf/section-1202-review.test.ts::keeps missing-source and year qualification gates closed"
  - line: "browser-review"
    description: "Completed actual interview reaches the review download"
    formula: "At desktop and mobile widths, complete actual QSBS and capital-source facts produce the same500exclusion from1000.25gain, retain original1100.35proceeds and redact identifiers in the downloaded review packet. Filing qualification remains closed."
    irsRef: "Form8949 Q adjustment; ScheduleD transfer; review-only export policy"
    testRef: "apps/web/tests/qsbs-review-download.spec.ts::downloads validated QSBS amounts with redacted identifiers"
