form: "Guided self-employed health insurance"
fullName: "Actual plan, monthly payment and owner source collection"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i7206"
notes: "Collect source facts for Form7206; canonical business limits determine the deduction. A saved aggregate never establishes a plan, qualification, month or owner."
lines:
  - line: "actual-premiums"
    description: "Preserve exact original and allocated premium facts"
    formula: "Collect actual plan, source year, covered people, policy and business ownership, monthly employer eligibility, dated premiums and each person/payer share. Required amounts remain unknown until entered. Known zero and false survive; validation uses the pure source calculator before canonical income exists."
    irsRef: "Form7206 lines1-3 and Instructions plan establishment"
    testRef: "tests/guided-interview/guided-health-insurance-facts.test.ts::preserves actual health insurance facts and reconciles saved premiums"
  - line: "source-links"
    description: "Bind actual household and business sources"
    formula: "A plan can use only an actual selected business or W2 source with the same actual owner. Primary/spouse covered identities reconcile with household records. Changes to household, payroll, business, retirement, credits or income sources revoke confirmation; metadata-only edits do not."
    irsRef: "IRC162(l); Form7206 lines4-14"
    testRef: "tests/guided-interview/guided-health-insurance-facts.test.ts::binds health plans to actual household and business sources"
  - line: "guided-routing"
    description: "Forward sources once and reject unsupported aggregate claims"
    formula: "Forward the actual Form7206 source object. Do not also emit the saved aggregate as an independent deduction. Missing or contradictory sources block completion; calculating the deduction requires canonical owner/business income."
    irsRef: "Form7206 line14; Schedule1 line17"
    testRef: "tests/guided-interview/guided-health-insurance-facts.test.ts::requires actual health sources and forwards the source object once"
  - line: "source-controls"
    description: "Collect explicit monthly and payer answers"
    formula: "Controls start unknown, preserve original records, and invalidate confirmation after substantive edits. Known zero remains a supplied monetary amount. Adding a source never pre-fills qualification, reimbursement, eligibility or a deduction."
    irsRef: "Instructions7206 Limitations and Other coverage"
    testRef: "tests/apps/web/health-insurance-source-interactions.test.tsx::collects actual health plan payments without inferred amounts or eligibility"
  - line: "canonical-deduction"
    description: "Actual guided premiums reach the business-limited deduction once"
    formula: "The original 600.10 paid premium remains unchanged in the source ledger. With sufficient actual business income and known eligible months, Schedule1 line17 rounds to600 and AGI decreases600 relative to the identical return without premiums. Editing only source confirmation does not revoke another confirmed worksheet."
    irsRef: "Form7206 line14; Schedule1 line17; Form1040 rounding"
    testRef: "tests/guided-interview/guided-health-insurance-facts.test.ts::calculates the source-based health deduction once in the guided return"
  - line: "shareholder-route"
    description: "Expose actual health sources to shareholder wage households"
    formula: "A taxpayer selecting self-employed or shareholder health insurance can reach the adjustment worksheet even without ScheduleC income. A selected claim requires an actual worksheet; empty confirmed source lists establish none without inventing a zero plan."
    irsRef: "Instructions7206 more-than-two-percent S corporation shareholder"
    testRef: "tests/guided-interview/guided-health-insurance-facts.test.ts::routes shareholder health insurance to actual adjustment sources"
  - line: "source-review"
    description: "Keep original unknown and zero payments visible"
    formula: "Review displays actual owner/business paid source amounts before monthly eligibility, funding reductions, age caps and business income limits. Missing amount and owner remain explicitly unknown; a supplied zero displays zero."
    irsRef: "Form7206 lines1-14"
    testRef: "tests/apps/web/health-insurance-source-interactions.test.tsx::keeps unknown premium sources visible before deduction limits"
  - line: "household-age"
    description: "Reconcile premium age limits with actual household birth dates"
    formula: "Primary and spouse source identity and attained age must match actual household name and valid birth date in the selected year. Age is attained the day before the birthday. A matching claimed dependent must also reconcile actual identity and age; other qualifying people retain their separate actual source eligibility. Unknown or conflicting dates cannot raise the LTC cap."
    irsRef: "IRC213(d)(10) attained age before year close; Form7206 line2; Instructions7206 eligible persons"
    testRef: "tests/guided-interview/guided-health-insurance-facts.test.ts::reconciles health premium age limits to actual household birth dates"
  - line: "income-allocation-sources"
    description: "Preserve actual business deduction attribution without profit overrides"
    formula: "An optional confirmed source worksheet records each actual business owner and the allowed retirement and foreign amounts attributable to that business, plus other foreign exclusion. Missing amounts are not zero. Duplicate, missing or wrong-owner source links are rejected. Canonical calculations reconcile all amounts to allowed return deductions; intake never invents business income or derives an allocation from premium size."
    irsRef: "Form7206 lines9 and 12; Instructions7206 separate worksheets"
    testRef: "tests/guided-interview/guided-health-insurance-facts.test.ts::preserves actual business deduction allocations without supplying income overrides"
  - line: "income-allocation-controls"
    description: "Keep deduction allocation edits and confirmations distinct"
    formula: "Adding the optional allocation worksheet starts reference, owner, source and amounts unknown. Business selection supplies only the existing source identity. Actual zero stays zero; editing an amount clears both allocation and overall confirmation without deleting the source record."
    irsRef: "Form7206 lines9 and 12"
    testRef: "tests/apps/web/health-insurance-source-interactions.test.tsx::collects business deduction allocations without implied amounts"
