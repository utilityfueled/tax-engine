form: "Form 4972"
fullName: "Tax on Lump-Sum Distributions"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-pdf/f4972.pdf"
notes: |
  Internal single-participant, single-recipient worksheet. The participant's
  own qualified plan and a single qualifying death-beneficiary distribution
  with confirmed zero federal estate tax have separate original-source rules.
  Alternate payees, multiple distributions or recipients, earlier deaths,
  deferred NUA, positive estate tax and a beneficiary's actuarial annuity
  value need separate qualification. No current-year return or export
  registration is implied.
lines:
  - line: "1-5"
    description: "Eligibility and source reconciliation"
    formula: >-
      Require one current qualified plan distribution from the participant's own
      plan, born before January 2, 1936, five qualifying years of participation,
      entire required balance distributed, no partial or full rollover, no prior
      disqualifying election, and explicit confirmation from all related records
      that the other disqualifications do not apply. Use the original current
      source's determined Box 2a, Box 3, and confirmed zero Box 6. Box 3
      cannot exceed Box 2a and Box 2a cannot exceed Box 1. Require the actual
      Box 8a amount. A positive amount requires confirmation that it is the
      current actuarial value of an annuity contract included in the qualified
      lump sum and excluded from both Boxes 1 and 2a. A blank, an unknown
      amount or an unrelated Box 8a value cannot establish this method.
    testRef: "tests/engine/forms/form-4972.test.ts::requires actual eligibility and determined source amounts"
  - line: "1-5-beneficiary"
    description: "Eligibility for a single death-beneficiary distribution without death benefit exclusion or estate tax"
    formula: >-
      Require original Code 4 with A and an actual 2026 distribution made to
      the beneficiary because of the participant's death. Use the participant's
      own birth date before January 2, 1936, and confirmed death date on or
      after August 21, 1996, no earlier than birth or later than distribution.
      The participant's five-year condition in question 4 does not apply to
      the affirmative beneficiary answer to question 3. Question 5b uses the
      beneficiary's history for this participant. Require the entire required
      qualified plan balance, no rollover, no prior disqualifying beneficiary
      election, no other disqualification, one distribution and one recipient,
      and the same reconciled Boxes 1, 2a and 3 and confirmed zero Boxes 6 and
      8a. Require estate records confirming zero attributable federal estate
      tax. Lines 9 and 18 are zero for this limited route. Apply the same
      Part II and III formulas. The own-plan physical candidate does not
      project beneficiary answers.
    testRef: "tests/engine/forms/form-4972.test.ts::computes a beneficiary election on the first day without a death exclusion"
    testRefs:
      - "tests/engine/forms/form-4972.test.ts::holds a beneficiary election with incomplete or conflicting originals"
      - "tests/pdf/form-4972-2026-candidate.test.ts::holds the beneficiary method outside the own-plan physical map"
  - line: "6-7"
    description: "Twenty-percent capital gain election"
    formula: "Line 6 is Box 3 when Part II is elected and positive; line 7 is line 6 times 0.20."
    testRef: "tests/engine/forms/form-4972.test.ts::computes the separate Part II charge and ordinary pension remainder"
  - line: "8-12"
    description: "Adjusted total taxable amount"
    formula: >-
      For Part III, line 8 is Box 2a minus elected Part II Box 3, or all of Box
      2a without Part II. Line 9 is confirmed zero for these cohorts.
      Line 10 equals line 8. Line 11 is the confirmed Box 8a value and
      line 12 is the sum of lines 10 and 11.
    testRef: "tests/engine/forms/form-4972.test.ts::splits the combined election and computes the separate ten-year tax"
  - line: "13-17"
    description: "Minimum distribution allowance"
    formula: >-
      At line 12 of $70,000 or more, lines 13 through 16 are omitted and line
      17 equals line 12. Otherwise line 13 is the lesser of half of line 12 and
      $10,000. Line 14 is the positive excess over $20,000, line 15 is 20% of
      line 14, line 16 is line 13 minus line 15, and line 17 is line 12 minus
      line 16. Preserve cents before the rate calculation.
    testRef: "tests/engine/forms/form-4972.test.ts::applies the allowance boundaries before the tax rate for %s"
  - line: "18-29"
    description: "Ten-year separate tax"
    formula: >-
      Line 18 is confirmed zero, line 19 equals line 17, and zero line 11 means
      lines 20 through 22 and 26 through 28 are omitted. When line 11 is
      positive, line 20 divides line 11 by line 12 using Decimal precision
      with at least three fractional places of accuracy. Line 21 is the
      line 16 allowance times line 20, with a skipped allowance treated as
      zero. Line 22 is line 11 minus line 21. Line 23 is line 19 times 0.10.
      Line 24 uses the final 2026 Form 4972 fixed tax rate schedule for that
      amount and line 25 is line 24 times 10. When line 22 is present, line
      26 is line 22 times 0.10, line 27 uses the same schedule and line 28
      is line 27 times 10. Line 29 is line 25 minus any line 28. Do not add
      Box 8a to the capital gain election or ordinary pension transfer.
      The disabled own-plan physical candidate checks that the printed ratio
      and whole-dollar amounts reconcile before showing the adjustment.
    testRef: "tests/engine/forms/form-4972.test.ts::uses the printed rate table across every band boundary for %s"
    testRefs:
      - "tests/engine/forms/form-4972.test.ts::apportions the allowance to a confirmed annuity contract"
      - "tests/engine/forms/form-4972.test.ts::uses zero allowance at the adjusted total threshold"
      - "tests/engine/forms/form-4972.test.ts::retains precision for a recurring actuarial ratio"
      - "tests/engine/forms/form-4972.test.ts::keeps actuarial value out of the Part II pension transfer"
      - "tests/engine/forms/form-4972.test.ts::requires an actual qualified lump-sum annuity value in Box 8a"
  - line: "30"
    description: "Separate tax and proposed federal transfer"
    formula: >-
      When Part III is elected line 30 sums lines 7 and 29, treating absent
      Part II as zero. Part II alone transfers line 7 to Form 1040 line 16 and
      Box 2a less Box 3 to ordinary pension income. Either Part III election
      excludes this source from Form 1040 lines 5a and 5b. Keep the proposed
      transfer separate from the current federal calculator and exports until
      their source eligibility and interaction checks are qualified.
    testRef: "tests/engine/forms/form-4972.test.ts::splits the combined election and computes the separate ten-year tax"
