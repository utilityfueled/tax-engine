form: "Form4137 canonical owner payroll"
fullName: "Separate taxpayer tip sources and return routing"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-pdf/f4137.pdf"
notes: |
  Refreshed October25 against final2025 Form4137 instructions, Pub531,
  ScheduleSE lines8a-8d and Form8959 line2. Each spouse files a separate4137.
  Income includes unreported cash and noncash tips; payroll excludes actual
  employer-month cash tips below20 and noncash tips. Actual source facts remain
  distinct from legacy unverified2025 summaries. Final2026 qualification stays closed.
lines:
  - line: "owners"
    description: "Compute each owner's payroll tax before combining return totals"
    formula: "Bind each actual4137 to same-owner original W2 records. Sum separate line13 taxes on Schedule2line5 and unreported income on1040line1c. Do not apply the other spouse's wage-base usage."
    testRef: "tests/engine/federal-form4137-sources.test.ts::keeps each actual owner's tip tax and wage-base usage separate"
  - line: "payroll"
    description: "Use payroll tips rather than gross tip income in downstream tax"
    formula: "Form8959line2 sums both actual line6 amounts; ScheduleSEline8b uses only that owner's line10. Actual small-month and noncash income enters wages but not those payroll bases."
    testRef: "tests/engine/federal-form4137-sources.test.ts::routes only actual taxable tips to SE and Additional Medicare"
  - line: "2026-base"
    description: "Use the current indexed base without opening return readiness"
    formula: "Each actual owner uses184500 of2026 SocialSecurity base.184000 reported wages plus1000 tips leave500 taxable SocialSecurity tips,31SocialSecurity+15Medicare=46; separate spouse1000tips produce77."
    testRef: "tests/engine/federal-form4137-sources.test.ts::uses the actual 2026 wage base separately for each tip recipient"
  - line: "source"
    description: "Preserve unknown and contradictory payroll facts"
    formula: "Actual paths require known individual source owners, W2Boxes3/7, matching employer identities and source/return/constants years.2026 summaries require actual sources. A separate-owner representation cannot duplicate the legacy single record or combine with unowned Form8919 payroll."
    testRef: "tests/engine/federal-form4137-sources.test.ts::rejects unknown and contradictory tip source ownership"
  - line: "small"
    description: "Retain a zero-payroll-tax income source"
    formula: "Actual unreported tips below20 per employer month and actual noncash tips remain taxable income even when line13 iszero; source audit remains present."
    testRef: "tests/engine/federal-form4137-sources.test.ts::retains small cash and noncash income without payroll tax"
  - line: "review-copy"
    description: "Actual complete owner forms and continuation sources"
    formula: "Copy unique canonical audited lines2-13 and actual employer columns; select each owner's actual identity. Include source forms even when tax iszero. Preserve all employer rows through continuation pages. Refuse missing, nonfinite, duplicate or contradictory audit/source values."
    testRef: "tests/pdf/fill-form-4137-source.test.ts::prints both owners and all source rows without substituting tax totals"
  - line: "review-gate"
    description: "Source and audit consistency precede PDF construction"
    formula: "Actual source income and audited line values must match retained individual results and a fresh calculation using the actual owner W2 payroll sources. A contradictory employer amount, owner, year, wage base or intermediate line rejects rather than producing a plausible review copy."
    testRef: "tests/pdf/fill-form-4137-source.test.ts::rejects stale owner sources and altered intermediate audits"
  - line: "government-annotation"
    description: "Explain Medicare-only government tips beside the printed Social Security line"
    formula: "Actual government tips remain in line6 but reduce the amount compared on line10; print the instructed 1.45% tips annotation with the actual excluded amount."
    testRef: "tests/pdf/fill-form-4137-source.test.ts::prints the actual Medicare-only government tip annotation"
  - line: "optional-owner"
    description: "Preserve an explicitly absent optional spouse form"
    formula: "Count only present source-owner records. An optional spouse key with undefined is no additional source and must not prevent the actual primary form from being reviewed."
    testRef: "tests/pdf/fill-form-4137-source.test.ts::accepts a separate-owner object with an explicitly absent spouse"
  - line: "continuation-width"
    description: "Preserve full employer identities within continuation page bounds"
    formula: "Wrap actual names and identifiers without truncation; paginate wrapped rows before the bottom margin. Source text and totals remain unchanged."
    testRef: "tests/pdf/fill-form-4137-source.test.ts::wraps the full long employer identity on continuation pages"
