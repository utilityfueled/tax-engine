form: "Form 8801"
fullName: "Credit for Prior Year Minimum Tax — Individuals"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i8801"
sources:
  - "https://www.irs.gov/pub/irs-pdf/f8801.pdf (final2025; prior2024 computation)"
  - "https://www.irs.gov/pub/irs-dft/f8801--dft.pdf (draft2026 created May27; NOT filing qualification)"
  - "https://www.irs.gov/pub/irs-drop/rp-24-40.pdf (prior2025 AMT and capital gains indexing)"
  - "https://www.irs.gov/pub/irs-drop/rp-23-34.pdf (prior2024 indexing)"
notes: |
  Only individual filing statuses are supported. A tax2026 credit uses prior2025
  AMT rules, not the new current2026 phaseout. Every amount uses Decimal and IRS
  whole-dollar rounding. Final2026 instructions, form qualification and independent
  tax review remain required. The draft is calculation research, not filing evidence.
  Actual MTFTCE and MTCNOLD worksheets are supplied source facts; this module does
  not calculate those ancillary worksheets. Foreign-earned-income PartIII source
  amounts must explicitly confirm the required capital-gain-excess adjustments.
  Tax2026 requires actual source year, all applicable source amounts and known
  Form2555/1040NR/capital-gain applicability; omitted amounts are not assumed zero.
  Legacy tax2025 simple inputs remain unverified compatibility calculations. Positive
  legacy capital-gain amounts require actual worksheet inputs, never AMT-base stacking.
  Strict source fields: priorYear, sourceFactsConfirmed, priorYearForm6251Line1And2e,
  priorYearMinimumTaxCreditNOLDeduction, priorYearMinimumTaxForeignTaxCredit,
  priorYearForm6251Line10, priorYearUnallowedQualifiedElectricVehicleCredit,
  priorYearFiledForm2555, priorYearFiledForm1040NR, priorYearCapitalGainsRequired,
  plus actual priorYearAMT/exclusion adjustments/carryforward. Optional conditional
  fields preserve unknown: priorYearNetUSRealPropertyGain, priorYearForeignEarnedIncome
  {form2555Lines45And50, disallowedDeductions, capitalGainAdjustmentsConfirmed},
  priorYearCapitalGainsWorksheet {method, preferentialIncome, ordinaryIncomeForZeroRate,
  ordinaryIncomeForFifteenRate, section1250Gain, scheduleDTaxWorksheetLine10}.
businessRuleValidation:
  - rule: "original-source-presence"
    description: "Preserve missing actual facts and keep original defaultable amounts unverified across reparsing."
    testRef: "tests/models/form-8801-source-facts.test.ts::preserves unknown actual worksheet facts and original-source completeness"
  - rule: "source-facts"
    description: "Require source year, complete known facts and applicable worksheets; reject invalid or contradictory facts."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::rejects missing and contradictory actual source facts"
  - rule: "reference-summary-packet"
    description: "The summary is review-only, never an IRS filing form or a qualified2026 artifact."
    testRef: "tests/pdf/fill-form-8801.test.ts::buildForm8801ReferenceSummary keeps the packet artifact reference-only and limited to supported prior-year minimum-tax-credit outputs"
lines:
  - line: "1"
    description: "Prior-year Form 6251 taxable-income and NOL-source sum"
    formula: "Actual prior-year Form 6251 line 1 (line 1b for 2025) plus line 2e; never substitute current-year income."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::uses actual prior return lines and the 2025 tables for a 2026 credit"
  - line: "2"
    description: "Prior-year exclusion adjustments"
    formula: "Actual exclusion-only Form 6251 adjustments and preferences; signed amounts are retained."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::uses actual prior return lines and the 2025 tables for a 2026 credit"
  - line: "3"
    description: "Minimum tax credit net operating loss deduction"
    formula: "Actual separately computed MTCNOLD under section 172, taking account only of exclusion items; enter deduction as positive source amount."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::subtracts actual MTCNOLD and applies the nonresident real-property floor"
  - line: "4"
    description: "Exclusion-only alternative minimum taxable income"
    formula: "max(0, line1 + line2 - line3); MFS adds min(prior exemption, 25% * max(0, preliminary line4 - complete-phaseout threshold)). Prior2024 MFS threshold875950 cap66650; prior2025 threshold900350 cap68500."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::applies the MFS additional amount at its prior-year boundaries"
  - line: "5"
    description: "Prior-year exemption"
    formula: "Prior2024 S/HOH85700 MFJ/QSS133300 MFS66650; prior2025 S/HOH88100 MFJ/QSS137000 MFS68500."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::uses actual prior return lines and the 2025 tables for a 2026 credit"
  - line: "6"
    description: "Prior-year exemption phaseout threshold"
    formula: "Prior2024 S/HOH/MFS609350 MFJ/QSS1218700; prior2025 S/HOH/MFS626350 MFJ/QSS1252700."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::uses actual prior return lines and the 2025 tables for a 2026 credit"
  - line: "7"
    description: "Excess over phaseout threshold"
    formula: "max(0, line4 - line6)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::phases out the exemption and uses the prior-year AMT breakpoints"
  - line: "8"
    description: "Exemption reduction"
    formula: "RoundDollar(line7 * 0.25). The 2026 current-year 50% rule does not replace the prior2025 rule."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::phases out the exemption and uses the prior-year AMT breakpoints"
  - line: "9"
    description: "Allowed exemption"
    formula: "max(0, line5 - line8)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::phases out the exemption and uses the prior-year AMT breakpoints"
  - line: "10"
    description: "Taxable excess on exclusion items"
    formula: "max(0, line4 - line9); for actual prior Form1040-NR filers, at least min(actual net U.S. real-property gain, line4)."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::subtracts actual MTCNOLD and applies the nonresident real-property floor"
  - line: "11"
    description: "Tax on exclusion items before foreign tax credit"
    formula: "RoundDollar(26% first prior-year breakpoint + 28% excess); prior2024 breakpoint232600/MFS116300; prior2025 239100/MFS119550. If PartIII required, use line55. Form2555 uses actual Foreign Earned Income Tax Worksheet."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::computes the foreign earned income worksheet from actual excluded income"
  - line: "12"
    description: "Minimum tax foreign tax credit on exclusion items"
    formula: "Actual completed MTFTCE worksheet amount, not ordinary FTC or silently assumed zero; cannot exceed line11."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::subtracts actual MTFTCE before the prior Form6251 comparison tax"
  - line: "13"
    description: "Tentative minimum tax on exclusion items"
    formula: "line11 - line12"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::subtracts actual MTFTCE before the prior Form6251 comparison tax"
  - line: "14"
    description: "Prior-year comparison regular tax"
    formula: "Actual prior-year Form6251 line10, which is not simply Form1040 line16."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::subtracts actual MTFTCE before the prior Form6251 comparison tax"
  - line: "15"
    description: "Net minimum tax on exclusion items"
    formula: "max(0, line13 - line14)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::subtracts actual MTFTCE before the prior Form6251 comparison tax"
  - line: "16"
    description: "Prior-year alternative minimum tax"
    formula: "Actual prior-year Form6251 line11."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::retains a negative line18 to reduce existing carryforward"
  - line: "17"
    description: "Net minimum tax on exclusion items"
    formula: "Copy line15."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::retains a negative line18 to reduce existing carryforward"
  - line: "18"
    description: "Signed prior-year credit adjustment"
    formula: "line16 - line17; preserve negative amount before combining carryforward."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::retains a negative line18 to reduce existing carryforward"
  - line: "19"
    description: "Credit carryforward from prior return"
    formula: "Actual prior-year Form8801 line26."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::retains a negative line18 to reduce existing carryforward"
  - line: "20"
    description: "Unallowed legacy qualified electric vehicle credit"
    formula: "Actual prior-year section30(b)(3)(B) credit under pre-2009 law; this is not a modern clean vehicle credit."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::combines the actual legacy electric vehicle credit and after-credit limit"
  - line: "21"
    description: "Combined credit pool"
    formula: "line18 + line19 + line20; if zero or negative, no credit or carryforward and stop physical form."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::retains a negative line18 to reduce existing carryforward"
  - line: "22"
    description: "Current-year regular income tax minus allowable credits"
    formula: "Current Form1040 line16 + Schedule2 line1z minus Form1040 line19 and Schedule3 lines1 through6z excluding line6b MTC and line6k Form8912; floor0. Supplied as actual computed currentYearRegularTaxAfterCredits."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::combines the actual legacy electric vehicle credit and after-credit limit"
  - line: "23"
    description: "Current-year tentative minimum tax"
    formula: "Actual current Form6251 line9."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::combines the actual legacy electric vehicle credit and after-credit limit"
  - line: "24"
    description: "Current-year credit limitation"
    formula: "max(0, line22 - line23)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::combines the actual legacy electric vehicle credit and after-credit limit"
  - line: "25"
    description: "Allowed minimum tax credit"
    formula: "min(max(0,line21),line24), flows to Schedule3 line6b."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::combines the actual legacy electric vehicle credit and after-credit limit"
  - line: "26"
    description: "Carryforward to next year"
    formula: "max(0,line21) - line25; no invented expiration."
    testRef: "tests/engine/forms/form-8801-2026.test.ts::retains a negative line18 to reduce existing carryforward"
  - line: "27"
    description: "PartIII tax base"
    formula: "line10, or actual Foreign Earned Income Tax Worksheet line3"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "28"
    description: "Preferential-income worksheet source"
    formula: "Actual prior QD/CG Tax Worksheet line4 or ScheduleD Tax Worksheet line13, refigured for AMT where necessary"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "29"
    description: "Unrecaptured section1250 gain"
    formula: "Actual prior ScheduleD line19; skipped for qualified-dividends worksheet method"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "30"
    description: "Preferential and section1250 gain cap"
    formula: "QD method line28; ScheduleD method min(line28 + line29, actual ScheduleD Tax Worksheet line10)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "31"
    description: "Gain subject to preferential computation"
    formula: "min(line27,line30)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "32"
    description: "Ordinary AMT portion"
    formula: "line27 - line31"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "33"
    description: "Ordinary AMT tax"
    formula: "Prior-year 26%/28% tax on line32, rounded once"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "34"
    description: "Zero-rate threshold"
    formula: "Prior2024 S/MFS47025 MFJ/QSS94050 HOH63000; prior2025 S/MFS48350 MFJ/QSS96700 HOH64750"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "35"
    description: "Actual regular-tax ordinary income for zero-rate capacity"
    formula: "Prior QD/CG worksheet line5 or ScheduleD Tax Worksheet line14; not line32 AMT ordinary portion"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "36"
    description: "Zero-rate capacity"
    formula: "max(0,line34 - line35)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "37"
    description: "Preferential income limited by base"
    formula: "min(line27,line28)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "38"
    description: "Zero-rate capital gain"
    formula: "min(line36,line37)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "39"
    description: "Remaining preferential income"
    formula: "line37 - line38"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "40"
    description: "Fifteen-percent threshold"
    formula: "Prior2024 S518900 MFS291850 MFJ/QSS583750 HOH551350; prior2025 S533400 MFS300000 MFJ/QSS600050 HOH566700"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "41"
    description: "Copy zero-rate capacity"
    formula: "line36"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "42"
    description: "Actual regular-tax ordinary income for fifteen-percent capacity"
    formula: "Prior QD/CG worksheet line5 or ScheduleD Tax Worksheet line21, with applicable Form2555 adjustments"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "43"
    description: "Income consuming fifteen-percent capacity"
    formula: "line41 + line42"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "44"
    description: "Fifteen-percent capacity"
    formula: "max(0,line40 - line43)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "45"
    description: "Fifteen-percent gain"
    formula: "min(line39,line44)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "46"
    description: "Fifteen-percent tax"
    formula: "RoundDollar(line45 * 0.15)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "47"
    description: "Zero- and fifteen-percent gains"
    formula: "line38 + line45"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "48"
    description: "Twenty-percent gain"
    formula: "line37 - line47"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "49"
    description: "Twenty-percent tax"
    formula: "RoundDollar(line48 * 0.20)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "50"
    description: "Ordinary and preferential gain subtotal"
    formula: "line32 + line47 + line48; only applicable with section1250 gain"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "51"
    description: "Section1250 gain at maximum25%"
    formula: "line27 - line50"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "52"
    description: "Section1250 tax"
    formula: "RoundDollar(line51 * 0.25)"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "53"
    description: "Capital-gain method tax"
    formula: "line33 + line46 + line49 + line52"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "54"
    description: "All-income AMT comparison"
    formula: "Prior-year 26%/28% tax on line27"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
  - line: "55"
    description: "Maximum-rate method result"
    formula: "min(line53,line54); use on line11 or Foreign Earned Income Tax Worksheet line4"
    testRef: "tests/engine/forms/form-8801-2026.test.ts::follows every PartIII line using actual regular-tax worksheet sources"
