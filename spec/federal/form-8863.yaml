form: "Form 8863"
fullName: "Education Credits (American Opportunity and Lifetime Learning)"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i8863"
notes: |
  Applies 2025 final instructions and IRC25A, with the enacted 2026 employment-SSN
  requirement verified at https://www.irs.gov/tax-professionals/eitc-central/new-social-security-number-requirements-for-education-tax-credits.
  The 2026 draft https://www.irs.gov/pub/irs-dft/f8863--dft.pdf is line-layout evidence,
  never filing qualification. All monetary arithmetic uses Decimal. Printed lines
  round to dollars; phase-out factor retains Decimal precision (at least 3 places).
  One credit per student, actual paid net qualified expenses after assistance,
  refunds and other benefits. Unknown 2026 eligibility/source facts fail closed.
  Legacy 2025 omissions remain an unqualified compatibility preview; known
  ineligibility applies in either year. Final 2026 forms and independent review
  remain required. Schedule3-A public-benefit limitation is not qualified.
  Review PDF mapping copies the persisted calculation audit; it must not rerun
  credit calculations with omitted eligibility or liability facts. One Part III
  page is required per actual AOC or LLC student. Unknown eligibility answers,
  student identity and institutional information remain blank. An unallocated
  legacy LLC aggregate cannot be assigned to an AOC student. Review output is
  still unqualified and cannot substitute for a complete filing packet.
lines:
  - line: "eligibility"
    description: "Actual claimant and student eligibility"
    formula: "No credit for MFS, actually claimed dependent, or nonresident alien without joint resident election; AOC also requires no effective ban and required Form8862. 2026 primary OR joint spouse employment-valid timely SSN; dependent student timely employment-valid SSN. Actual identity prevents duplicate student credits."
    edgeCases:
      - "AOC requires fewer than4 prior claim years, no completed first4 years, half-time degree enrollment, no felony drug conviction, eligible school, substantiated adjusted expenses and1098T requirement or exception"
      - "LLC has no AOC age/year/degree/felony conditions; actual eligible courses and student identity still required"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::requires actual 2026 student facts and allows only one credit per student"
  - line: "1"
    description: "Total tentative AOC"
    formula: "Sum PartIII line30 for eligible students"
    testRef: "tests/engine/forms/form-8863.test.ts::Form 8863 Line 1 - AOC total for multiple students"
  - line: "2"
    description: "MAGI phase-out upper bound"
    formula: "180000 MFJ,90000 otherwise"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "3"
    description: "Education MAGI"
    formula: "AGI plus actual Form2555 income/housing exclusion and deduction, PuertoRico and Form4563 exclusions"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "4"
    description: "MAGI remaining phase-out range"
    formula: "max(0,line2-line3)"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "5"
    description: "Phase-out range"
    formula: "20000 MFJ,10000 otherwise"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "6"
    description: "Phase-out factor"
    formula: "min(1,line4/line5), retaining Decimal precision of at least three decimal places"
    testRef: "tests/engine/forms/form-8863.test.ts::Form 8863 Line 7 - AOC no phase-out under threshold"
  - line: "7"
    description: "AOC after phase-out"
    formula: "round(line1*line6)"
    testRef: "tests/engine/forms/form-8863.test.ts::Form 8863 Line 7 - AOC no phase-out under threshold"
  - line: "8"
    description: "Refundable AOC"
    formula: "If refundable eligible round(line7*0.40), otherwise0; Form1040line29"
    notes: "Nonjoint claimant with living parent cannot refund if under18, or age18 earned income less than half support, or full-time student age19–23 earned income less than half support. Equal half support qualifies. Actual claimant facts, not the dependent student's age."
    testRef: "tests/engine/forms/form-8863-2026.test.ts::uses claimant age and support facts for refundable AOC with exact half-support boundary"
  - line: "9"
    description: "Nonrefundable AOC before tax limit"
    formula: "line7-line8; preserve full AOC when refundable restriction applies"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::uses claimant age and support facts for refundable AOC with exact half-support boundary"
  - line: "10"
    description: "Eligible LLC adjusted expenses"
    formula: "Sum eligible PartIIIline31 actual separate student expenses"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::requires actual LLC students and applies 2026 dependent SSN rules"
  - line: "11"
    description: "LLC capped expenses"
    formula: "min(line10,10000)"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "12"
    description: "Tentative LLC"
    formula: "round(line11*0.20)"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "13"
    description: "LLC upper MAGI bound"
    formula: "Same asline2"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "14"
    description: "LLC MAGI"
    formula: "Same asline3"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "15"
    description: "LLC remaining range"
    formula: "max(0,line13-line14)"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "16"
    description: "LLC phase-out range"
    formula: "Same asline5"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "17"
    description: "LLC phase-out factor"
    formula: "min(1,line15/line16), at least3 decimal places"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "18"
    description: "LLC after phase-out"
    formula: "round(line12*line17)"
    testRef: "tests/engine/forms/form-8863.test.ts::Form 8863 Line 18 - LLC basic calculation"
  - line: "19"
    description: "Allowed nonrefundable education credits"
    formula: "min(line9+line18,max(0,Form1040line18-Schedule3lines1,2,6d,6l)); actual worksheet limit required2026; Schedule3line3"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "20-26"
    description: "Student identity, institution and eligibility facts"
    formula: "Actual student TIN/role, school records and eligibility answers; never infer from dollar amounts or fabricate addresses/EINs"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::requires actual 2026 student facts and allows only one credit per student"
  - line: "27-30"
    description: "Per-student AOC expense calculation"
    formula: "27=min(adjusted expenses,4000);28=max(0,27-2000);29=round(28*0.25);30=27 when28=0 otherwise2000+29"
    testRef: "tests/engine/forms/form-8863.test.ts::Form 8863 Line 30 - AOC expenses of $2,500 yield $2,125 (100% first $2K + 25% of $500)"
  - line: "31"
    description: "Per-student LLC expenses"
    formula: "Actual adjusted eligible expenses for a student not claimed for AOC"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::requires actual LLC students and applies 2026 dependent SSN rules"

  - line: "return-integration"
    description: "Use every actual student fact and MAGI addback on the return"
    formula: "Pass net student expenses and actual eligibility; educationMAGI=AGI+Form2555exclusion+housingdeduction+possessionexclusion; finalline19 uses actual prior-ranking credit limit"
    testRef: "tests/engine/federal-credit-integration.test.ts::forwards education claim history, actual MAGI addbacks and final tax limit"
  - line: "claimed-dependent-and-tin"
    description: "Actual dependent claim and timely student TIN"
    formula: "Both credits require timely student TIN;2026 dependent student additionally needs employment-valid SSN. Actually claimed dependent cannot claim education credit; merely claimable but unclaimed student may claim subject to other conditions."
    irsRef: "2025 Form8863 Table1 and WhoCanClaim dependent expenses; IRC25A(g)(3)"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::distinguishes an actual dependent claim and enforces timely LLC student TIN"
