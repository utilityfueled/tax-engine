form: "Form 8863"
fullName: "Education Credits (American Opportunity and Lifetime Learning)"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i8863"
notes: |
  Applies 2025 final instructions and IRC25A, with the enacted 2026 employment-SSN
  requirement verified at https://www.irs.gov/tax-professionals/eitc-central/new-social-security-number-requirements-for-education-tax-credits.
  Official 2026 Form 8863 confirms the prior-claim question. All monetary
  arithmetic uses Decimal. Printed lines
  round to dollars; phase-out factor retains Decimal precision (at least 3 places).
  One credit per student, actual paid net qualified expenses after assistance,
  refunds and other benefits. Unknown 2026 eligibility/source facts fail closed.
  Other legacy 2025 omissions remain an unqualified compatibility preview;
  known ineligibility applies in either year. 2026 mapping qualification and
  independent review remain required. Schedule3-A public-benefit limitation is not qualified.
  Review PDF mapping copies the persisted calculation audit; it must not rerun
  credit calculations with omitted eligibility or liability facts. One Part III
  page is required per actual AOC or LLC student. Unknown eligibility answers,
  student identity and institutional information remain blank. An unallocated
  legacy LLC aggregate cannot be assigned to an AOC student. Review output is
  still unqualified and cannot substitute for a complete filing packet.
lines:
  - line: "eligibility"
    description: "Actual claimant and student eligibility"
    formula: "No credit for MFS, actually claimed dependent, or nonresident alien without joint resident election; AOC also requires no effective ban and required Form8862. 2026 primary OR joint spouse employment-valid timely SSN; dependent student timely employment-valid SSN. Actual identity prevents duplicate student credits."
    edgeCases:
      - "For positive 2026 expenses, an employment-valid SSN issued by the return due date conflicts with a verified no timely TIN for the same student, even when the student TIN answer is omitted. Adult students without an affirmative employment-valid SSN answer must supply their own timely-TIN answer. Reconcile matched student, claimant and household facts before calculating or accepting a saved interview."
      - "A 2026 claimant's affirmative employment-valid SSN answer must also agree with that person's timely household TIN answer when a different person is the student."
      - "AOC requires fewer than4 prior claim years, no completed first4 years, half-time degree enrollment, no felony drug conviction, eligible school, substantiated adjusted expenses and1098T requirement or exception"
      - "LLC has no AOC age/year/degree/felony conditions; actual eligible courses and student identity still required"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::requires actual 2026 student facts and allows only one credit per student"
    testRefs:
      - "tests/engine/forms/form-8863-2026.test.ts::rejects contradictory 2026 student SSN and timely TIN answers"
      - "tests/engine/federal-education-distribution.test.ts::reconciles omitted 2026 student TIN with the actual household"
      - "tests/engine/federal-education-household-sources.test.ts::keeps the 2026 explicit student TIN requirement when the household has an answer"
      - "tests/engine/federal-education-household-sources.test.ts::holds a 2026 student SSN contradicted by household TIN without a claimant SSN answer"
      - "tests/engine/federal-education-distribution.test.ts::holds contradictory 2026 claimant TIN even when the other spouse is the student"
      - "tests/guided-interview/guided-aotc-student-history.test.ts::holds conflicting 2026 spouse student identity answers after reopen"
      - "tests/guided-interview/guided-aotc-student-history.test.ts::holds a conflicting 2026 spouse claimant TIN when the primary is the student"
  - line: "22-aotc-institution-ein"
    description: "Actual EINs on the institution records for an American Opportunity Credit"
    formula: "For the 2025 and 2026 rules, when aggregate Form 8863 line 7 is positive, require a nine-digit EIN on every supplied school record of each student with a positive tentative AOTC and reconcile any student summary EIN to one of those records. Complete 2025 school records can supply the EINs when the separate summary is absent. Form 1098-T exceptions do not supply an EIN. A zero line 7 or zero tentative student credit does not trigger the additional school-list requirement."
    irsRef: "26 USC 25A(g)(1)(B); https://uscode.house.gov/us/usc/119-120/t26/s25A/; final Forms 8863, lines 22a(4) and 22b(4); https://www.irs.gov/pub/irs-prior/f8863--2025.pdf; https://www.irs.gov/pub/irs-prior/f8863--2026.pdf"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::holds a missing EIN on a second supplied AOTC school"
  - line: "22-aotc-institution-ein-2025"
    description: "Honor complete 2025 school originals with or without a separate EIN summary"
    formula: "The required school EINs come from the actual Part III institution records. Validate every supplied record for an eligible positive claim. A separately supplied EIN must match one actual school."
    irsRef: "2025 Form 8863, lines 22a(4) and 22b(4); https://www.irs.gov/pub/irs-prior/f8863--2025.pdf; 2025 Instructions for Form 8863, Part III; https://www.irs.gov/instructions/i8863"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::validates supplied 2025 school EINs without requiring a duplicate summary"
  - line: "eligibility-household-ssn"
    description: "Reconcile actual claimant SSN facts across the 2026 return"
    formula: "When a 2026 return reports education expenses, compare each known Form 8863 claimant SSN answer with the same person's known employment-valid timely SSN answer in the taxpayer record. Reject contradictory answers for the primary taxpayer or joint spouse. One known answer supplies the fact when the other answer is unknown. On a joint return either spouse may satisfy the SSN requirement. Dependent student SSN facts remain separately required."
    irsRef: "https://www.irs.gov/tax-professionals/eitc-central/new-social-security-number-requirements-for-education-tax-credits"
    testRef: "tests/engine/federal-education-household-sources.test.ts::holds conflicting 2026 education and household SSN answers for the %s (%s, %s)"
  - line: "eligibility-adult-student-ssn"
    description: "Reconcile the SSN answer for an adult student with that adult's claimant facts"
    formula: "For a primary or joint-spouse student with positive expenses and a matched return identity, reject a known employment-valid timely SSN answer that conflicts with the same person's known claimant answer. In an otherwise eligible joint return a spouse student without an employment-valid SSN remains eligible with actual timely TIN facts."
    irsRef: "https://www.irs.gov/tax-professionals/eitc-central/new-social-security-number-requirements-for-education-tax-credits; https://www.irs.gov/pub/irs-dft/i8863--dft.pdf"
    testRef: "tests/engine/federal-education-household-sources.test.ts::holds a conflicting spouse student SSN but accepts the spouse with actual timely TIN facts"
  - line: "eligibility-adult-student-tin"
    description: "Reconcile known timely TIN answers for an adult student"
    formula: "When a 2026 student with positive expenses matches the primary or joint spouse identity, reject contradictory known timely TIN answers in the student and taxpayer records. Preserve unknown answers and the existing one-spouse SSN rule."
    testRef: "tests/engine/federal-education-household-sources.test.ts::holds conflicting 2026 timely TIN answers for the %s student (%s, %s)"
  - line: "eligibility-adult-student-tin-2025"
    description: "Resolve conflicting 2025 timely TIN answers for the same adult student"
    formula: "For positive 2025 AOC or LLC expenses, hold two known contradictory timely TIN answers for the student whose stated primary or joint-spouse role and TIN match the same person in the taxpayer record. A known negative taxpayer answer with an omitted student answer makes that matched student ineligible for 2025. Use the established fact only in the calculation copy and preserve the original student omission. Both-unknown and unmatched historical input, and all 2026 source requirements, retain their existing treatment."
    irsRef: "Form 8863 instructions, Table 1 and Who Cannot Claim a Credit; https://www.irs.gov/instructions/i8863"
    testRef: "tests/engine/federal-education-household-sources.test.ts::holds conflicting 2025 timely TIN answers for the %s student (%s, %s)"
  - line: "eligibility-adult-student-tin-unreported-2025"
    description: "Use a matching taxpayer's known ineligibility when the 2025 student answer is omitted"
    formula: "A matched primary or joint-spouse student's omitted timely TIN answer cannot qualify for AOC or LLC when that same taxpayer's known answer is negative. Match the 2025 identities after trimming surrounding whitespace and removing TIN hyphens. Keep the raw return input unchanged, and retain the old outcomes when the source records cannot be matched or both answers are unknown."
    testRef: "tests/engine/federal-education-household-sources.test.ts::uses a matched 2025 %s taxpayer's known negative TIN answer for both education credits"
  - line: "1"
    description: "Total tentative AOC"
    formula: "Sum PartIII line30 for eligible students"
    testRef: "tests/engine/forms/form-8863.test.ts::Form 8863 Line 1 - AOC total for multiple students"
  - line: "2"
    description: "MAGI phase-out upper bound"
    formula: "180000 MFJ,90000 otherwise"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "3"
    description: "Education MAGI"
    formula: "AGI plus actual Form2555 income/housing exclusion and deduction, PuertoRico and Form4563 exclusions"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "4"
    description: "MAGI remaining phase-out range"
    formula: "max(0,line2-line3)"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "5"
    description: "Phase-out range"
    formula: "20000 MFJ,10000 otherwise"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "6"
    description: "Phase-out factor"
    formula: "min(1,line4/line5), retaining Decimal precision of at least three decimal places"
    testRef: "tests/engine/forms/form-8863.test.ts::Form 8863 Line 7 - AOC no phase-out under threshold"
  - line: "7"
    description: "AOC after phase-out"
    formula: "round(line1*line6)"
    testRef: "tests/engine/forms/form-8863.test.ts::Form 8863 Line 7 - AOC no phase-out under threshold"
  - line: "8"
    description: "Refundable AOC"
    formula: "If refundable eligible round(line7*0.40), otherwise0; Form1040line29"
    notes: "Nonjoint claimant with living parent cannot refund if under18, or age18 earned income less than half support, or full-time student age19–23 earned income less than half support. Equal half support qualifies. Actual claimant facts, not the dependent student's age."
    testRef: "tests/engine/forms/form-8863-2026.test.ts::uses claimant age and support facts for refundable AOC with exact half-support boundary"
  - line: "8-claimant-birth-date"
    description: "Use the claimant's actual birth date to establish age for refundable AOC"
    formula: "If a federal return has positive AOC after phase-out, require a real claimant calendar birth date on or before the end of the tax year. Use the existing day-before-birthday age calculation. A return with no AOC after phase-out needs no birth-date check for this line."
    testRef: "tests/engine/federal-education-claim-history.test.ts::requires an actual claimant birth date for refundable AOC on a short-year return"
  - line: "9"
    description: "Nonrefundable AOC before tax limit"
    formula: "line7-line8; preserve full AOC when refundable restriction applies"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::uses claimant age and support facts for refundable AOC with exact half-support boundary"
  - line: "10"
    description: "Eligible LLC adjusted expenses"
    formula: "Sum eligible PartIIIline31 actual separate student expenses"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::requires actual LLC students and applies 2026 dependent SSN rules"
  - line: "11"
    description: "LLC capped expenses"
    formula: "min(line10,10000)"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "12"
    description: "Tentative LLC"
    formula: "round(line11*0.20)"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "13"
    description: "LLC upper MAGI bound"
    formula: "Same asline2"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "14"
    description: "LLC MAGI"
    formula: "Same asline3"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "15"
    description: "LLC remaining range"
    formula: "max(0,line13-line14)"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "16"
    description: "LLC phase-out range"
    formula: "Same asline5"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "17"
    description: "LLC phase-out factor"
    formula: "min(1,line15/line16), at least3 decimal places"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "18"
    description: "LLC after phase-out"
    formula: "round(line12*line17)"
    testRef: "tests/engine/forms/form-8863.test.ts::Form 8863 Line 18 - LLC basic calculation"
  - line: "19"
    description: "Allowed nonrefundable education credits"
    formula: "min(line9+line18,max(0,Form1040line18-Schedule3lines1,2,6d,6l)); actual worksheet limit required2026; Schedule3line3"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::audits every printed calculation and applies the actual nonrefundable limit"
  - line: "20-26"
    description: "Student identity, institution and eligibility facts"
    formula: "Actual student TIN/role, school records and eligibility answers; never infer from dollar amounts or fabricate addresses/EINs"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::requires actual 2026 student facts and allows only one credit per student"
  - line: "23-return-claim-history"
    description: "Require actual prior AOC claim history for a potentially eligible 2025 return"
    formula: >-
      Hold an otherwise eligible 2025 AOC student with positive rounded expenses
      and remaining income phase-out allowance until the actual number of prior
      years in which anyone claimed AOC for the student is known. Accept an
      explicit zero. Four or more prior years disqualify the student. If another
      known fact already prevents this AOC, the missing count does not withhold
      the return or an independently eligible Lifetime Learning Credit. Preserve
      unknown history as unknown in the Line 30 audit, distinct from zero.
    irsRef: >-
      26 U.S.C. §25A(b)(2)(A) (https://uscode.house.gov/us/usc/t26/s25A/).
      Final 2025 Form 8863 line 23 (https://www.irs.gov/pub/irs-prior/f8863--2025.pdf)
      and 2025 instructions (https://www.irs.gov/instructions/i8863#line23).
      Final 2026 Form 8863 line 23 retains the same question
      (https://www.irs.gov/pub/irs-pdf/f8863.pdf, Form 8863 (2026), created 4/28/26,
      verified 2026-11-19).
    testRef: "tests/engine/federal-education-claim-history.test.ts::holds a parsed 2025 claim when actual prior AOC history is unknown"
  - line: "27-30"
    description: "Per-student AOC expense calculation"
    formula: "27=min(adjusted expenses,4000);28=max(0,27-2000);29=round(28*0.25);30=27 when28=0 otherwise2000+29"
    testRef: "tests/engine/forms/form-8863.test.ts::Form 8863 Line 30 - AOC expenses of $2,500 yield $2,125 (100% first $2K + 25% of $500)"
  - line: "31"
    description: "Per-student LLC expenses"
    formula: "Actual adjusted eligible expenses for a student not claimed for AOC"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::requires actual LLC students and applies 2026 dependent SSN rules"

  - line: "return-integration"
    description: "Use every actual student fact and MAGI addback on the return"
    formula: "Pass net student expenses and actual eligibility; educationMAGI=AGI+Form2555exclusion+housingdeduction+possessionexclusion; finalline19 uses actual prior-ranking credit limit"
    testRef: "tests/engine/federal-credit-integration.test.ts::forwards education claim history, actual MAGI addbacks and final tax limit"
  - line: "claimed-dependent-and-tin"
    description: "Actual dependent claim and timely student TIN"
    formula: "Both credits require timely student TIN;2026 dependent student additionally needs employment-valid SSN. Actually claimed dependent cannot claim education credit; merely claimable but unclaimed student may claim subject to other conditions."
    irsRef: "2025 Form8863 Table1 and WhoCanClaim dependent expenses; IRC25A(g)(3)"
    testRef: "tests/engine/forms/form-8863-2026.test.ts::distinguishes an actual dependent claim and enforces timely LLC student TIN"
