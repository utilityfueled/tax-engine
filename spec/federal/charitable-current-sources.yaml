form: "Current charitable source validation"
fullName: "Actual current-year recipient qualification"
taxYear: 2025
irsReference: "https://www.irs.gov/publications/p526"
retrievedAt: "2026-10-25"
reviewStatus: "independent-review-pending"
lines:
  - line: "eligibility"
    description: "A known ineligible recipient creates no charitable deduction or carry"
    formula: "For both2025 and2026, actual qualifiedOrganization=false excludes the gift from all deduction/carry categories. Positive gifts with omitted qualification remain unknown and reject; recipient classification is actual, never inferred from a name. Preserve the original input record."
    testRef: "tests/engine/schedules/schedule-a-charity-source-facts.test.ts::preserves false and unknown current charity qualification in both years"
  - line: "date"
    description: "Current payment belongs to the actual return year"
    formula: "IRC170(a)(1): require a real calendar payment date in the return year before current charitable use; a prior contribution requires its actual carry source packet and cannot become a current gift. Reject malformed, impossible and different-year dates without mutation."
    testRef: "tests/engine/schedules/schedule-a-charity-source-facts.test.ts::rejects invalid and wrong-year donations before current deduction"
  - line: "guided"
    description: "Source intake collects the same actual qualification in either supported year"
    formula: "A2025 itemizer must answer recipient qualification just like a2026 itemizer; false remains false, missing stays pending.2026 standard-method sources separately require supporting-organization and donor-advised-fund answers."
    testRef: "tests/guided-interview/guided-required-facts.test.ts::requires actual charity qualification for 2025 without replacing false"
  - line: "nol-eligibility"
    description: "Known ineligible receipts do not enter the charitable NOL replay"
    formula: "Both actual and counterfactual current-public-cash sums use the same validated eligible current receipts. A known nonqualified gift remains in original input but creates no deduction, carry or nonexcess source amount. Unknown qualification still rejects."
    testRef: "tests/engine/federal-charitable-nol.test.ts::excludes known ineligible receipts from current charitable NOL coordination"
  - line: "current-category"
    description: "Current categories do not depend on supplying a prior ledger"
    formula: "Final2025 Pub526 Worksheet2: current private ordinary cash is capped at30percent and applicable remaining50percent capacity; current publiccash40000 and publiccapital30000 at base100000 allows40000cash+10000capital=50000, carry20000. A confirmed empty prior ledger cannot change valuation, current allowed amounts or aggregate carry."
    testRef: "tests/engine/schedules/schedule-a-charity-source-facts.test.ts::uses identical current category limits with no history or a confirmed empty history"
  - line: "property-value"
    description: "Actual ordinary property basis limits the charitable amount"
    formula: "IRC170(e)(1)(A) and Pub526 Giving Property That Has Increased in Value: ordinary or short-term property uses min(actual FMV, actual adjusted basis). Missing holding classification/basis stays unknown in either year. Public ordinary property FMV5000/basis1000 allows1000 before percentage limitations. Private foundation capital property separately requires actual qualified-appreciated-stock or basis-reduction facts."
    testRef: "tests/engine/schedules/schedule-a-charity-source-facts.test.ts::uses actual property basis and preserves unknown valuation facts in both years"
  - line: "current-order"
    description: "Final2025 current public cash is considered before property"
    formula: "Pub526 Worksheet2 lines13/17/30: publiccash130000, publiccapital80000, base200000 permits cash120000 and capital0; carry10000cash+80000capital=90000. Preserve exact sources and separate carry categories; the earlier property-first expectations did not follow this worksheet."
    testRef: "tests/edge-cases/charitable-agi-limits.test.ts::mixed cash and appreciated — stacked limits per IRC §170(b)(1)"
