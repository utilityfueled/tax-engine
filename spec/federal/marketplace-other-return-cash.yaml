    testRef: "tests/pdf/marketplace-other-return-cash-review.test.ts::prints gross cash refunds and other tax separately and rejects stale original context"
  - line: "workspace"
    description: "The completed source interview produces a review packet with original cash proof"
    formula: "Actual marriage childcash600 with othercredit1000 reaches6875 through full original guided sources; a complete independently confirmed payment packet is retained. Review notices, masked identifiers and existing partial packet/Form2210 disclosure remain."
    testRef: "tests/apps/web/workspace-marketplace-other-return-cash.test.ts::downloads completed actual other return sources without transferring its credit or repayment"
  - line: "isolated-2026"
    description: "Source semantics compose under isolated 2026 constants"
    formula: "The exact same current cash, completed other return and own-return reported-repayment proof retain16800 with full original advances24011.76; only the isolated test supplies2026 constants. Production calculation and form qualification gates remain unchanged."
    testRef: "tests/engine/federal-marketplace-other-return-cash-2026.test.ts::retains isolated2026 actual other return cash without changing year gates"
  - line: "browser"
    description: "Completed original cash and payment sources survive actual desktop/mobile download"
    formula: "Real production controls retain positive other-return credit, insurer receipt100, explicit empty reimbursements and independent other-return tax payments. Source edits revoke nested and outer confirmations; blank cash blocks advancement and survives reload. Complete actual prior-return/payment sources are reconfirmed, every eligible section is visited and the actual PDF is downloaded and reopened. The review remains partial with Form2210 suppressed; no current tax or deduction override is entered."
    testRef: "apps/web/tests/guided-marketplace-other-return-cash.spec.ts::retains separate other return cash evidence through actual download"
  - line: "physical-nonspecified-rounding"
    description: "Physical nonspecified Form7206 lines round the exact annual benchmark ratio"
    formula: "Twelve actual tax-family premiums1250 with benchmark groups1000/500 produce exact annual nonspecified cost5000. Add actual outside netcash0.5-minus1e-40 before reporting: physical7206lines1/3/14 each5000; exact outside0.5 instead reports5001. Keep the separate signed coordinated Schedule1 transfers3000/3001. Retain actual monthly numerator/denominator sources and aggregate ratios before rounding; do not assign a residual to an arbitrary month or change shared Decimal precision."
    testRef: "tests/pdf/marketplace-other-return-cash-review.test.ts::rounds physical nonspecified fields from exact annual source ratios"
