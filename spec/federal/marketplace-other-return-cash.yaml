    formula: "Edit the completed other credit, actual insurer receipt and reimbursement in the full shell; require source reconfirmation and preserve unknown versus zero through storage and reload. Cash300/month+child100/month+own12000 repayment retains16800; the other7000 tax payment is not a health expense."
    testRef: "tests/apps/web/marketplace-other-return-cash-interactions.test.tsx::edits actual insurer cash and reimbursements with independent confirmations"
  - line: "review"
    description: "Physical review separates original cash, reimbursement, outside advances and other tax"
