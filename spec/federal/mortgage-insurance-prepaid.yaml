lines:
  - line: "source-admission"
    description: "Actual originals reconcile to the same canonical loan and Form1098"
    formula: "Require current2026 source, confirmation, complete original premium inventory, actual Form1098 id/year/lender/account and worksheet loan id/account/owner/origination; actual individual primary ownership, acquisition use, qualified residence/security/obligation. Require original confirmation that this premium is properly allocable beyond tax-year end; do not infer this from the mortgage term alone. Require stated whole-month term and actual contract/payment/insurance/closing dates. Actual other-payer interest/points and interest deducted elsewhere, nonqualified use or category worksheet cannot contradict this unmixed original source. Unknown or excluded facts reject even for zero. In the outstanding original loan cohort, actual first_last lastBalance zero contradicts the claimed outstanding debt; actual highest_balance cannot be lower than actual current original Form1098 Box2 principal. Do not reinterpret lender average or monthly balances as a year-end balance."
    testRef: "tests/engine/forms/mortgage-insurance-prepaid.test.ts::rejects source and canonical parent mismatches"
  - line: "monthly-allocation"
    description: "Allocate actual prepaid premium without monthly rounding"
    formula: "N=min(actual stated mortgage term months,84); eligible months start with actual insurance-obtained month, fall within requested2026 and N; exact annual allocation=actual prepaid premium*months/N. FHA/private, cash or financed same rule. No deduction acceleration or guessed original term/date."
    testRef: "tests/engine/forms/mortgage-insurance-prepaid.test.ts::derives literal allocation through actual canonical parsed API: %s"
  - line: "no-double-use"
    description: "Original source allocation replaces, never adds to, supplied annual allocation"
    formula: "Manual route continues to require explicit premiumsAllocableToYear. Original-source route preserves absence; if annual amount is supplied, it must equal exact derived annual allocation. No reported Box5-to-prepaid inference, duplicate physical lender/account or loan/source use or silent override."
    testRef: "tests/engine/forms/mortgage-insurance-prepaid.test.ts::reconciles manual annual amount exactly without double counting"
  - line: "phaseout-rounding"
    description: "Aggregate exact allocations then apply existing AGI phaseout and final IRS rounding"
    formula: "Apply existing ScheduleA 10percent per complete/partial1000 AGI excess over100000,500/50000MFS; floor atzero. Do not round monthly quotient or individual source allocation; round final deductible aggregate once. A5.25premium/84*8=.50 yields1."
    testRef: "tests/engine/forms/mortgage-insurance-prepaid.test.ts::preserves cents and actual partial AGI step"
  - line: "historical-gates"
    description: "Preserve historical manual behavior, immutable input and incomplete2026 gates"
    formula: "2025 manual PMI remains expired; new current2026 original-source method rejects other years. No input mutation or rule-pack/filing promotion. Missing source facts never become zero."
    testRef: "tests/engine/forms/mortgage-insurance-prepaid.test.ts::preserves historical manual behavior and full2026 gate"
