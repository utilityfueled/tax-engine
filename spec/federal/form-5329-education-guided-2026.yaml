form: "Form 5329 Guided 2026 College Tuition IRA Source"
fullName: "2026 guided intake of a traditional IRA distribution and documented college tuition"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-prior/f5329--2026.pdf"
notes: "Section 72(t)(2)(E) and (7) and IRS Publication 970 chapter 8 govern exception 08. The final 2026 form supplies Part I. The annual instruction revision remains draft. This guided cohort covers one primary taxpayer on a nonjoint return and leaves calculation readiness, PDF availability, and filing gates in place."
lines:
  - line: "08-guided-source"
    description: "Compute the exception for tuition the IRA owner actually paid in 2026"
    formula: "Match one fully taxable ordinary traditional IRA Code 1 statement to its owner, actual 2026 receipt date before age 59 1/2, original payer, account and exact distribution amount. Require eligible college tuition for the owner, one posted nonrefunded tuition payment matching the college bill by student account and exact amount, and an actual payment date in the distribution year on or before today. Require confirmed zero tax-free assistance and no Coverdell, QTP or education-credit allocations for this limited cohort. Line 2 code 08 is the lesser of qualifying paid tuition and the taxable IRA distribution. Keep Line 1 and taxable IRA income intact and apply 10 percent to Line 3."
    sources:
      - "https://uscode.house.gov/us/usc/119-124/t26/s72/"
      - "https://www.irs.gov/publications/p970"
    testRef: "tests/guided-interview/guided-education-ira-2026.test.ts::projects matched 2026 paid tuition and calculates exact code 08 amounts"
    testRefs:
      - "tests/apps/web/retirement-education-interactions.test.tsx::requires a complete matched tuition worksheet and reopens it with exact source values"
  - line: "08-guided-holds"
    description: "Hold incomplete, stale, competing or uncoordinated source records"
    formula: "Hold unknown facts, nonzero aid, education credit, savings bond or education distribution source records requiring coordination, refunded or reimbursed tuition, other beneficiaries or expenses, rollover, other retirement worksheets, extra distributions, changed IRA sources and mismatched or noncurrent payments. The no-allocation cohort does not apply a reduction to qualified tuition program withdrawals or determine how education benefits are coordinated."
    testRef: "tests/guided-interview/guided-education-ira-2026.test.ts::holds missing, mismatched and competing Code 08 source facts"
    testRefs:
      - "tests/guided-interview/guided-education-ira-2026.test.ts::holds saved education benefit sources and a change of return year"
  - line: "08-medical-overlap"
    description: "Preserve separately qualifying medical expenses under Part I"
    formula: "The finite college tuition worksheet passes only the validated education amount. Leave omitted Line 1, manual medical, and supported medical values absent through input parsing so the engine can still derive them from Form 1099-R and Schedule A. Honor explicitly entered zero. Preserve code 99 when both qualified exceptions contribute to Line 2."
    testRef: "tests/guided-interview/guided-education-ira-2026.test.ts::preserves a separately qualifying medical exception and code 99"
  - line: "08-primary-owner"
    description: "Bind college tuition to the actual primary taxpayer"
    formula: "Store a tuition-specific fingerprint of the normalized primary taxpayer name and full tax identifier alongside the existing IRA source snapshot. Hold a changed or unknown owner, including a change without a birth date change, and hold a saved tuition worksheet without the owner binding pending new source review. Formatting-only name and tax identifier edits may preserve an otherwise identical binding. Preserve the existing first-home snapshot and review behavior."
    testRef: "tests/guided-interview/guided-education-ira-2026.test.ts::holds a saved tuition proof after the primary taxpayer changes with the same birth date"
