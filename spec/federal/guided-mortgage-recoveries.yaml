form: "Guided mortgage interest recovery sources"
taxYear: 2025
version: "1.0"
source: "https://www.irs.gov/publications/p936"
description: >-
  Collect original prior-year mortgage refunds and completed Pub525 tax-benefit
  worksheets separately from current-year interest. Original Form1098 Box4 is
  preserved. Actual linked recovery-only Form1099-MISC Box3 enters income once;
  no other income category or prior tax benefit is inferred.
lines:
  - line: "source-revisions"
    description: "Original annual MISC boxes and legacy unknowns"
    formula: "Preserve optional source identity and actual2025/2026 form revision. Require actual knownzero2026 tip/overtime amounts and false occupation-code presence for this recovery-only method. Positive compensation, year mismatch and multiple-state sources require separate methods; absent legacy fields remain unknown."
    irsRef: "Final April2025 and December2026 Form1099-MISC recipient source boxes"
    testRef: "tests/guided-interview/guided-mortgage-recoveries.test.ts::preserves actual MISC source revisions and requires the current year compensation facts"
  - line: "recovery"
    description: "Actual prior-year tax-benefit source"
    formula: "Original Box4 refund2000 and completed taxable recovery600 add600 to income; the separate same-year1000 refund reduces12000 current interest to11000. The current deduction election does not change recovery income."
    irsRef: "Pub936 Refunds of interest; Pub525 Recoveries and Mortgage interest refund"
    testRef: "tests/guided-interview/guided-mortgage-recoveries.test.ts::preserves prior recovery income separately from current interest under either deduction election"
  - line: "reported"
    description: "Once-only original Form1099-MISC reporting"
    formula: "Require actual payer, owner, year, account and every original relevant box. Recovery-only Box3 must equal the sum of actual linked already-included taxable amounts; withholding transfers once. Positive unrelated boxes, duplicates, missing amounts and unbound sources reject."
    irsRef: "2025 and2026 Form1099-MISC recipient instructions Boxes3/4/16-18; Pub525 Recoveries"
    testRef: "tests/guided-interview/guided-mortgage-recoveries.test.ts::conserves original recovery-only MISC income and withholding once"
  - line: "standalone"
    description: "Closed-loan original statements and lender records"
    formula: "A prior refund may have no current loan deduction. Preserve actual closed-loan Form1098 with knownzero current interest, principal, premiums, points and tax disbursements, or an explicitly identified lender refund record. Never fabricate present qualified-home or loan facts."
    irsRef: "Pub936 Refunds of interest; Form1098 Box4; Pub525 tax-benefit records"
    testRef: "tests/guided-interview/guided-mortgage-recoveries.test.ts::accepts actual closed-loan and lender recovery records without invented current loan facts"
  - line: "boundaries"
    description: "Unknown facts and allocation conservation"
    formula: "Require actual receipt year, earlier origin year, owner share, reviewed prior-return tax benefit and complete recovery ledger. Unknown differs from zero; refund/source/owner contradictions and unrepresented allocations reject while original cents remain exact."
    irsRef: "Pub525 Itemized deduction recoveries, capital-gain/AMT/credit and multiple-year conditions"
    testRef: "tests/guided-interview/guided-mortgage-recoveries.test.ts::rejects incomplete and contradictory recovery sources without replacing unknowns"
  - line: "controls"
    description: "Recovery sources remain reachable with standard deduction"
    formula: "Actual standard-deduction controls expose the separate recovery records; edits preserve original statement amounts and revoke source confirmation, while zero/false/cleared answers stay distinct."
    irsRef: "Pub936 prior-year recovery applies regardless of current deduction election"
    testRef: "tests/apps/web/mortgage-recovery-interactions.test.tsx::collects actual recovery sources under the standard deduction and preserves unknowns"
  - line: "persistence"
    description: "Private original recovery records survive reload"
    formula: "Desktop/mobile save exact recovery and original reporting records, restore cleared unknown answers and do not send private source references, identifiers or amounts in requests."
    irsRef: "Pub525 supporting records; local workspace privacy contract"
    testRef: "apps/web/tests/guided-mortgage-recoveries.spec.ts::preserves actual mortgage recovery sources across reload"
