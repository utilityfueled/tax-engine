form: "Guided vehicle refinancing sources"
fullName: "Actual original purchase and refinancing record collection"
taxYear: 2025
irsReference: "https://www.irs.gov/irb/2026-39_irb"
retrievedAt: "2026-10-25"
reviewStatus: "independent-review-pending"
notes: "T.D.10054 final1.163-16(d),(g), effective2026-11-09, applicable2025-2028. Intake preserves original statements; no year, filing or qualification gate is changed."
lines:
  - line: "actual-records"
    description: "Collect original purchase and every refinancing without defaulting facts"
    formula: "Collect actual packet year,VIN,reference; original loan/source/lender/account/date/principal/purchase costs/down payment; each refinance link,balance,new principal and date; actual current-year interest, qualifying interest deducted elsewhere and excluded qualifying interest for every loan; actual first-lien and related-lender answers. Blank,unknown,false and zero remain distinct. Parse currency with Decimal and validate the resulting source chain using the pure refinancing method, without inferred AGI."
    irsRef: "1.163-16(d)(2),(4),(5),(g);spec/federal/vehicle-refinancing.yaml"
    testRef: "tests/guided-interview/guided-vehicle-refinancing.test.ts::hands off actual refinancing sources with exact amounts and return year"
  - line: "source-review"
    description: "Invalidate confirmation after any source change and retain incomplete records"
    formula: "A source edit clears packet and enclosing deduction confirmation. Require explicit all-loans,original-borrower and ordinary principal-history confirmation. Preserve incomplete and explicitly ineligible records for correction; reject absent,mismatched or contradictory sources before calculation. Changing the refinanced answer never silently removes saved loan history."
    irsRef: "Actual source completeness and input contract;1.163-16(d)(4)-(5)"
    testRef: "tests/apps/web/vehicle-refinancing-interactions.test.tsx::collects actual refinancing records and clears confirmation on edits"
  - line: "source-boundaries"
    description: "Reject incomplete and stale source packets without changing original entries"
    formula: "Require exact current year and vehicle binding, source totals and latest lender binding, and known qualifying-portion exclusions. Ordinary refinancing uses actual earlier paid-off zero interest; unsupported changed borrower or nonordinary principal history remains explicit. No packet or nested confirmation is synthesized."
    irsRef: "1.163-16(d)(2),(4),(5),(g)"
    testRef: "tests/guided-interview/guided-vehicle-refinancing.test.ts::rejects missing unknown stale and contradictory refinancing facts"
