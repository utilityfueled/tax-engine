form: "PDF-Review-Policy"
fullName: "Visible review-only PDF output boundaries"
taxYear: 2025
reference: "docs/upgrade-2026-execution-brief.md"
notes: |
  This is an output policy, not a tax computation or form qualification.
  Every registered review template is stamped before it reaches a caller,
  including early-return paths. Every added page is stamped when finalized.
  Existing document Subject metadata never establishes a visible page notice.
  Unchanged template hashes, year and filing gates remain mandatory.
lines:
  - line: "mapped-write-batch"
    description: "One current field lookup pass for a bounded batch of mapped writes"
    formula: "Resolve names and types from the current form once at apply time; reject missing or wrong-type fields even for blank values before writes. Apply exact original text/currency/checkbox values in order, retain no cross-document index, and close the batch after application. Template, privacy and year gates remain unchanged."
    testRef: "tests/pdf/pdf-field-batch.test.ts::saves text, exact money and both checkbox states with one lookup pass"
  - line: "registered-template"
    description: "Review templates are visibly marked before mapping"
    formula: "Verify registered revision/year, load, visibly stamp every page, then return."
    testRef: "tests/pdf/review-template-notice.test.ts::marks every registered template before callers can return it: %s"
  - line: "appended-pages"
    description: "Pages added after the initial stamp remain review-only"
    formula: "Stamp each newly added page at finalization; repeated calls do not add duplicate notices to unchanged pages."
    testRef: "tests/pdf/review-template-notice.test.ts::marks appended pages and does not trust a matching metadata subject"
  - line: "unavailable-year"
    description: "Unavailable years cannot inspect a template path"
    formula: "Reject unsupported mapping years before filesystem reads."
    testRef: "tests/pdf/review-template-notice.test.ts::rejects an unavailable year before reading a template path"
  - line: "saved-pages"
    description: "Saved and merged pages retain one visible review notice"
    formula: "Replace only the dedicated review-notice drawing stream on each finalization; reload/copy and arbitrary Subject metadata never suppress the visible notice or duplicate it."
    testRef: "tests/pdf/review-template-notice.test.ts::replaces dedicated notice streams after saving and merging pages"
