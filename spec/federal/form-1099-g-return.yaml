form: "Form1099-G canonical return integration"
fullName: "Actual government payments through Schedule1 and Form1040"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p525"
sources:
  - "https://www.irs.gov/pub/irs-drop/rr-25-04.pdf"
  - "https://www.irs.gov/instructions/i1040sca"
notes: "Source calculation027a383; actual current-year repayments and nondeductible contribution recovery never reduce withholding. Prior-year refund tax benefit remains a separate source worksheet."
lines:
  - line: "7"
    description: "Actual unemployment after source reconciliation"
    formula: "Use source calculator taxableUnemployment; retain currentYearRepaid for physical Repaid annotation and program ending balances. Current repayments and shared contribution recovery apply once."
    testRef: "tests/engine/federal-government-source-integration.test.ts::routes actual repayment and contribution recovery without reducing withholding"
  - line: "8z"
    description: "Other government income separate from unemployment and self employment"
    formula: "Add source RTAA, nonbusiness taxable grants and2026state family-leave benefits once to other income; include them in canonical AGI and MAGI while preserving zero business earnings."
    testRef: "tests/engine/federal-government-source-integration.test.ts::routes actual other government income separately from unemployment and SE"
  - line: "1"
    description: "Historical refund tax benefit from actual Box2 sources"
    formula: "Reconcile both source aliases once, preserve actual Box3 tax year separately from refundExpenseTaxYear (the actual payment/deduction year), and require a completed tax-benefit worksheet for every source-qualified positive prior-year refund. Do not infer taxable or nontaxable treatment from the current-year deduction election."
    testRef: "tests/engine/federal-government-source-integration.test.ts::requires actual refund history and reconciles the source alias once"
  - line: "salt-current-recovery"
    description: "Same-year income-tax recovery"
    formula: "Reduce actual current-year state/local income-tax payments by source refund whose actual expense year is current, even when Box3 names an earlier state-return year before SALT and sales-tax election limits; reject refunds exceeding known current payments. Never include the same amount as prior-year taxable income."
    testRef: "tests/engine/federal-government-source-integration.test.ts::reduces current-year income taxes for actual same-year refunds"
  - line: "source-gates"
    description: "Preserve actual government-source completeness"
    formula: "Return integration invokes source validation; incomplete actual2026records and unsupported prior-year repayments cannot fall through to Box1 aggregates."
    testRef: "tests/engine/federal-government-source-integration.test.ts::does not bypass actual source facts in the full return"
  - line: "review"
    description: "Physical repayment and source-income review"
    formula: "Copy unique canonical Schedule1line7, actual Repaid amount and positive-repayment checkbox; retain named RTAA/grant/family components in8z audit and review description."
    testRef: "tests/engine/federal-government-source-integration.test.ts::prints the actual repayment alongside canonical unemployment"

  - line: "refund-expense-year"
    description: "Actual expense year governs the recovery treatment"
    formula: "Box3 identifies the state return year, not when the refunded tax was paid. Require refundExpenseTaxYear for verified positive refunds; preserve it independently and use its actual deduction history. Same-year expense recovery reduces current SALT; historical expense recovery uses that year's completed worksheet."
    testRef: "tests/engine/federal-government-source-integration.test.ts::distinguishes the actual refunded expense year from the state return year"
  - line: "historical-empty-source"
    description: "Preserve explicit unverified historical government aggregates"
    formula: "An empty or historical aggregate government list retains its actual2022–24 year and unverified status. Existing Box1/4 amounts and absent-box historical defaults remain compatible; actual-source fields outside2025/26 reject. The broader federal year gate is unchanged."
    testRef: "tests/engine/federal-government-source-integration.test.ts::preserves unverified historical government aggregates without broadening return-year gates"
