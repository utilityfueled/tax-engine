form: "Publication974 and Section172 coordination"
fullName: "Actual NOL recomputation in prescribed Marketplace health contexts"
taxYear: 2025
irsReference: "https://www.irs.gov/publications/p974"
notes: |
  Publication974 W/X and Simplified Steps1-3 require the return's actual income
  for each fixed health deduction. Section172(a)(2),(b)(2) and Regulation1.172-5
  independently require current-limit and modified-income computations. Recompute
  the actual NOL at each prescribed health step; do not invent a NOL entry in the
  list of special ordered deductions or retain an earlier step's NOL/carry result.
  Statutory income contexts refigure already enabled AGI-sensitive claims; the
  final actual return retains any completed Pub974 ordered claims as prescribed.
  Statutory AMT replays use the health amount fixed for that particular context,
  including its actual business attribution under Regulation1.199A-3(b)(1)(vi).
  Temporary QBI allocations and carry results are not retained on the final return.
  Final deduction plus allocated PTC must not exceed original premiums. The
  literals below are derived synthetic examples, not IRS published examples.
  Isolated2026 tests use partial constants; full-return readiness remains closed.
