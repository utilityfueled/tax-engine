form: "Form 4952"
fullName: "Investment Interest Expense Deduction"
taxYear: 2026
supportedTaxYears: [2025, 2026]
ruleVersion: "2026-form4952-source-audit-v1"
reviewStatus: "implementation-tested; independent human review pending"
irsReference: "https://www.irs.gov/pub/irs-pdf/f4952.pdf"
sources:
  - url: "https://www.irs.gov/pub/irs-pdf/f4952.pdf"
    revision: "Final 2026; created 2026-05-28; pages 1, 3 and 4"
    retrieved: "2026-10-25"
    sha256: "90b9fc0bd6778983521b61ed5c94cc5668e62af858e38e94a1a6fd4b631bfb6d"
  - url: "https://www.irs.gov/pub/irs-prior/f4952--2025.pdf"
    revision: "Final 2025; created 2025-05-28; pages 1, 3 and 4"
    retrieved: "2026-10-25"
notes: |
  Use the printed line identifiers, not the former simplified 4e/4f/4g/5 aliases.
  No indexed dollar limits apply. Monetary arithmetic uses Decimal. Sum source
  amounts before rounding each printed input line to the nearest whole dollar,
  with exactly 50 cents rounded up. Do not round individual transactions first.
  Line 4d includes all investment-property net gain, including capital gain
  distributions and capital loss carryovers. Line 4e removes the preferential
  net-capital-gain portion until the taxpayer actually elects it on line 4g.
  Historical input without the new source facts retains its old nonpreferential
  gain interpretation only as explicitly unverified 2025 preview evidence.
  New-year or confirmed-source calculation requires actual tax year, a source
  reference, all source amounts including known zeros and confirmed facts.
  A nonzero prior carryforward must identify the immediately prior tax year.
  Line 5 excludes miscellaneous itemized investment fees and passive deductions;
  a K-1 amount qualifies only if it is actually deductible on the return.
  2026 instructions make the post-2017 miscellaneous deduction exclusion permanent.
  Line 8 normally flows to Schedule A line 9; royalty, trade/business and at-risk
  allocations require their separate source coordination. No filing/export gate
  is opened by an available final blank form or an agent-reviewed mapping.
lines:
  - line: "source"
    description: "Actual source and prior-year provenance"
    formula: "Require explicit source amounts, matching sourceTaxYear and confirmation for 2026 or confirmed records; nonzero carry requires priorYearSourceTaxYear = taxYear - 1"
    irsRef: "Form 4952 lines 1-2 and Specific Instructions"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::requires actual current and prior year facts without filling unknown zeros"
  - line: "1"
    description: "Current investment interest expense"
    formula: "Round aggregate eligible current interest, including eligible K-1 investment interest, to whole dollars"
    irsRef: "Form 4952 page 3, line 1"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::records every printed line from independently derived source amounts"
  - line: "2"
    description: "Prior-year disallowed investment interest"
    formula: "Round actual immediately preceding year Form 4952 line 7 carryforward"
    irsRef: "Form 4952 line 2"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::requires actual current and prior year facts without filling unknown zeros"
  - line: "3"
    description: "Total investment interest expense"
    formula: "line1 + line2"
    irsRef: "Form 4952 line 3"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::records every printed line from independently derived source amounts"
  - line: "4a"
    description: "Gross investment income excluding disposition gains"
    formula: "Round aggregate investment income from actual sources, including qualified dividends; exclude disposition gains, business/passive amounts except specifically permitted recharacterizations"
    irsRef: "Form 4952 page 3, line 4a"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::preserves signed income and floors only where the printed form requires"
  - line: "4b"
    description: "Qualified dividends included on line 4a"
    formula: "Round actual included qualified dividends; nonnegative"
    irsRef: "Form 4952 page 3, line 4b"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::records every printed line from independently derived source amounts"
  - line: "4c"
    description: "Investment income excluding qualified dividends"
    formula: "line4a - line4b; do not invent a zero floor"
    irsRef: "Form 4952 line 4c"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::preserves signed income and floors only where the printed form requires"
  - line: "4d"
    description: "Net gain from disposition of investment property"
    formula: "Round max(0, actual total investment gains minus actual total investment losses and carryovers)"
    irsRef: "Form 4952 page 3, line 4d"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::records every printed line from independently derived source amounts"
  - line: "4e"
    description: "Preferential net capital gain included on line 4d"
    formula: "min(line4d, rounded max(0, investment net long-term gain minus investment net short-term loss))"
    irsRef: "Form 4952 page 3, line 4e"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::caps preferential net capital gain at total net gain"
  - line: "4f"
    description: "Nonpreferential gain"
    formula: "line4d - line4e"
    irsRef: "Form 4952 line 4f"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::records every printed line from independently derived source amounts"
  - line: "4g"
    description: "Actual election of preferential income"
    formula: "Round the taxpayer's actual election; require 0 <= election <= line4b + line4e"
    irsRef: "Form 4952 page 4, line 4g; IRC 163(d)(4)(B)"
    notes: "Election requires Schedule D Tax Worksheet; never subtract it from Form 1040 line 3a"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::rejects an election exceeding available preferential income"
  - line: "4e-Elec"
    description: "Actual optional election allocation"
    formula: "Default capital-gain allocation = min(line4g, line4e); explicit allocation must be between max(0,line4g-line4b) and min(line4g,line4e); elected qualified dividends = line4g - elected capital gain"
    irsRef: "Form 4952 page 4, line 4g Note"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::uses capital gains first unless an actual valid Elec allocation is provided"
  - line: "4h"
    description: "Investment income"
    formula: "line4c + line4f + line4g"
    irsRef: "Form 4952 line 4h"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::records every printed line from independently derived source amounts"
  - line: "5"
    description: "Investment expenses allowed on the return"
    formula: "Round confirmed deductible expenses directly related to investment income; exclude interest, passive deductions and miscellaneous itemized fees; K-1 reporting alone is insufficient"
    irsRef: "Form 4952 page 4, line 5"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::does not accept unconfirmed deductible investment expenses"
  - line: "6"
    description: "Net investment income"
    formula: "max(0, line4h - line5)"
    irsRef: "Form 4952 line 6"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::preserves signed income and floors only where the printed form requires"
  - line: "7"
    description: "Disallowed interest carried forward"
    formula: "max(0, line3 - line6)"
    irsRef: "Form 4952 line 7"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::records every printed line from independently derived source amounts"
  - line: "8"
    description: "Deductible investment interest"
    formula: "min(line3, line6)"
    irsRef: "Form 4952 line 8 and page 4 allocation instructions"
    testRef: "tests/engine/forms/form-4952-source-audit.test.ts::rounds aggregate source cents once before printed line arithmetic"
  - line: "review-pdf"
    description: "Audited historical review output"
    formula: "Require a matching-year audited calculation and every canonical printed line; copy amounts without recalculation, preserve actual Elec allocation and stamp review-only notice. Missing calculation never creates an identified official blank. Final2026 source availability does not enable export."
    testRef: "tests/pdf/form-4952-audit-source.test.ts::rejects a missing audited calculation before creating an identified blank"
