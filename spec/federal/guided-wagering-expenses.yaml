form: "Guided wagering source amounts"
fullName: "Actual otherwise deductible wagering expenses and Schedule A handoff"
taxYear: 2025
irsReference: "https://uscode.house.gov/us/usc/119-118/t26/s165/"
retrievedAt: "2026-10-25"
reviewStatus: "independent-review-pending"
lines:
  - line: "actual-expense-handoff"
    description: "Preserve actual wagering expenses separately from wagers and winnings"
    formula: "Collect only the actual otherwise deductible expenses incurred in carrying on wagering transactions, excluding wager losses and amounts deducted elsewhere. Leave blank unknown, preserve explicit zero and exact source cents, and forward the source amount once as scheduleA.gamblingExpenses when itemizing. Keep winnings as separate income for either deduction choice; do not infer expense eligibility from winnings or default missing expenses to zero."
    irsRef: "26 USC165(d), including its pre-2026 text and PL119-21 section70114 effective date; Schedule A General Instructions prohibiting amounts deducted elsewhere; https://www.irs.gov/instructions/i1040sca"
    testRef: "tests/guided-interview/guided-wagering-expenses.test.ts::preserves actual expenses zero unknown and the deduction election"
  - line: "source-validation-and-reconciliation"
    description: "Validate amounts and reconcile saved aggregates without double counting"
    formula: "Reject negative or malformed supplied expenses. An entered expense or loss requires actual separately reported winnings, including an explicit zero when known. A saved other-itemized total must equal actual investment interest plus wagering losses plus wagering expenses with Decimal. The reported-expense comparison includes each classified source once, not the saved total as well; it does not claim a deductible amount."
    irsRef: "Schedule A General Instructions and line16, actual records and winnings cap; 26 USC165(d)"
    testRef: "tests/guided-interview/guided-wagering-expenses.test.ts::validates and reconciles expenses before calculation"
  - line: "year-specific-core-handoff"
    description: "Let the existing year-specific engine apply the loss and expense limitation"
    formula: "Use the canonical source fields unchanged: 2025 deduction=min(winnings, losses+otherwise deductible expenses); 2026 deduction=min(winnings, 0.90*(losses+otherwise deductible expenses)), using the existing form-line rounding. PL119-21 section70114 applies after2025. This adapter does not calculate authoritative tax or bypass year/readiness gates."
    irsRef: "26 USC165(d)(1)-(2), amendment and effective-date notes; spec/federal/schedule-a-2026.yaml line16-wagering"
    testRef: "tests/guided-interview/guided-wagering-expenses.test.ts::hands actual amounts to the distinct year methods"
  - line: "editable-and-recoverable-facts"
    description: "Retain actual expenses through edits and local workspace reload"
    formula: "Expose the original amount with a clear exclusion for wagers, personal costs and amounts deducted elsewhere. Preserve blank, zero and cents through editing, saved state and review; changing deduction choice does not erase source facts. Keep local source facts out of network request bodies and URLs in the bounded synthetic browser test."
    irsRef: "Schedule A General Instructions and line16 recordkeeping; 26 USC165(d)"
    testRef: "tests/apps/web/wagering-expense-interactions.test.tsx::edits original wagering expenses without defaults or duplicate totals"
