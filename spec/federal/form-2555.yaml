form: "Form 2555"
fullName: "Foreign Earned Income"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i2555"
notes: |
  Calendar tax years 2025 and 2026. Final 2025 instructions and Notice 2025-16,
  Notice 2026-25 and IRC 911 support the calculations. The 2026 form/instructions
  remain drafts; this implementation does not qualify filing or release readiness.
  Actual Part IV USD source amounts, eligibility/elections, source routing and
  allocable deductions are required for 2026. No US-government wages, pensions,
  investment income, duplicate spouse housing, unqualified days or unverified
  income-source attribution may enter an eligible amount. Prepared business
  personal-service income must apply the 30%-of-net rule when capital is material;
  otherwise eligible gross personal-service income applies, with allocable expenses
  restored through line44. The calculation consumes confirmed source worksheets.
  Ratios retain twelve decimal places (the form requires at least three); money
  rounds to whole dollars. Annual and daily housing values are distinct published
  values, never annual/365 substitutes. No future notice election is assumed.
  Gross wages remain Form1040line1; only actual employment income not on W2 is
  added at1h. Negative net45 goes Schedule1line8d and housing50 goes24j.
  Prior housing carryover is allowed by IRC911(c)(4)(C) and Pub54 even when current
  housing expenses are zero; the physical-form skip instruction needs review.
  Multi-spouse separate Forms2555, physical qualification travel/residence attachments,
  and prior-year earned-income exclusion statement computations are not inferred.
