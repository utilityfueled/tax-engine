form: "Form 8824 final 2026 physical candidate"
fullName: "Final 2026 Like-Kind Exchanges form physical fields"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-prior/f8824--2026.pdf"
revision: "Created 10/30/26, IRS final index posted 11/03/2026"
retrievedAt: "2026-11-13"
reviewStatus: "independent-qualified-tax-review-pending"
notes: |
  The final annual instructions were posted on 11/10/2026 and are available at
  https://www.irs.gov/pub/irs-prior/i8824--2026.pdf. The isolated projection
  accepts a confirmed simultaneous exchange of long-term domestic investment
  land between unrelated parties, without debt, other property or recapture.
  Other exchanges, related-party reporting, special basis allocations and
  sections 1043, 1062 and QOF treatment require their own qualification.
lines:
  - line: "source"
    description: "Pin the final annual blank and instructions"
    formula: >-
      Require a 101694-byte blank with SHA-256
      7f9da3429cffd9469b8268665c376051abe0ed09be93445b607cf74229df5542,
      the 2026 form title and two pages. Record the final 218840-byte
      instruction SHA-256 f4f7efe4cf14ce01282032c5f5b9866f7f3f11367dfa73024e4ff21469cf5685.
    testRef: "tests/pdf/form-8824-2026-candidate.test.ts::pins the final blank and instructions revision"
  - line: "I–IV"
    description: "Bind every printed cell to its original page widget"
    formula: >-
      Identify both pages' names and identifying numbers, property and date
      fields, the related-party identity and address cells, the yes/no pairs and
      the three exception boxes, gain and basis fields, and the section 1043
      inputs. Preserve the exact page, rectangle, field type and checkbox state.
    testRef: "tests/pdf/form-8824-2026-candidate.test.ts::matches all official field and widget locations"
  - line: "19, 25a–25c, 26–28"
    description: "Preserve physically separate write-in and split fields"
    formula: >-
      Preserve the line 19 write-in area separately from the amount. Bind the
      three basis classifications, the two certificate-number cells divided by
      a printed dash, and both description rows for each divestiture property.
    testRef: "tests/pdf/form-8824-2026-candidate.test.ts::preserves the write-in, basis breakdown and split certificate cells"
  - line: "diagnostic"
    description: "Reopen a review-marked synthetic diagnostic"
    formula: >-
      Exercise two pages and separate nearby controls, retain exact diagnostic
      text and checkbox appearance values, remove active content, and leave all
      taxpayer and related-party identifiers blank.
    testRef: "tests/pdf/form-8824-2026-candidate.test.ts::reopens a marked diagnostic with separate fields and blank identifiers"
  - line: "I and III investment land specimen"
    description: "Project a confirmed simultaneous exchange of ordinary investment land"
    formula: >-
      Require actual descriptions and qualifying documentary records. Both
      transfers occur on the same day in 2026 and the relinquished land was
      acquired more than one year earlier. Use the actual receipt date for line 5
      under the timely receipt rule. Mark line 7 No. Apply exact Decimal cash
      and qualified expense amounts to lines 15 and 18, and calculate the other
      Part III amounts through line 25. Allow cash in one direction only and
      require a realized gain. Leave identity, Part II, other property fields,
      special basis allocations and Part IV blank. Require all printed arithmetic
      to reconcile after rounding the exact Decimal amounts to whole dollars.
    testRef: "tests/pdf/form-8824-2026-candidate.test.ts::projects confirmed simultaneous investment land exchanges on the final candidate"
  - line: "investment land evidence boundary"
    formula: "Reject missing source confirmations, an ambiguous or unsupported exchange chronology, extra fields, cash in both directions, an exact gain absent in whole dollars, or inconsistent printed whole-dollar arithmetic."
    testRef: "tests/pdf/form-8824-2026-candidate.test.ts::rejects unsupported investment land exchanges and unreconciled printed amounts"
  - line: "release"
    description: "Keep annual export unavailable"
    formula: "The final blank and its physical candidate map stay outside the public review and filing paths."
    testRef: "tests/pdf/form-8824-2026-candidate.test.ts::keeps annual review and filing exports unavailable"
