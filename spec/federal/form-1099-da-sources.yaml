form: "Form1099DA actual ordinary sources"
taxYear: "2025 and 2026 source contract; public2026 calculation remains closed"
irsReference: "https://www.irs.gov/pub/irs-prior/i1099da--2025.pdf"
sources:
  - url: "https://www.irs.gov/pub/irs-prior/f1099da--2025.pdf"
    retrieved: "2026-10-25"
    section: "Recipient instructions; boxes1a-1i,2-9,11a-12b,14-16"
  - url: "https://www.irs.gov/instructions/i1099da"
    retrieved: "2026-10-25"
    section: "2026 reporting, noncovered securities, actual basis and Box4"
  - url: "https://www.irs.gov/pub/irs-prior/f8949--2025.pdf"
    retrieved: "2026-10-25"
    section: "Actual source categories G/H/I/J/K/L and separate reporting"
  - url: "https://www.irs.gov/irb/2026-15_IRB#NOT-2026-20"
    retrieved: "2026-11-25"
    section: "Notice 2026-20 sections 4.02–4.05; adequate broker-custody lot identification"
notes: |
  The old model's comments calling the asset/basis/proceeds boxes6-12/G were
  not the final2025 form. Actual asset name is1b, dates1d/1e, proceeds1f,
  reported basis1g, market discount1h, wash loss1i, basis checkbox2 and
  withholding4. Broker reporting is distinct from the taxpayer's completed
  basis records: blank reported basis is null, never a default zero.
  This bounded source method supports individually identified ordinary capital
  purchases later sold/exchanged, with actual completed basis and zero other
  adjustments/selling costs. NFT/collectible, mining/staking/gift/inheritance,
  optional aggregate, QOF, ordinary-income, loss-restriction and market-discount
  sources retain explicit separate methods. Legacy2025 source-free arithmetic
  remains unverified; new source paths and2026 require actual facts.
lines:
  - line: "original-facts"
    description: "Retain actual original boxes and independent taxpayer basis"
    formula: "Preserve blank original1g/1d separately; require actual completed basis, dates, identity, year, owner and confirmation before conversion"
    irsRef: "2025 i1099DA General Instructions and final CopyB recipient1d/1g; 2026 i1099DA noncovered securities"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::preserves original missing basis separately from actual taxpayer records"
  - line: "ordinary-scope"
    description: "Reject incomplete or special source methods without deleting originals"
    formula: "Actual ordinary classification and all applicable source boxes must be known; explicit0/false remains valid"
    irsRef: "Final1099DA boxes1h,3b,5,6,11a and capital-asset determination under i8949"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::rejects unknown conflicting and unsupported actual digital sources"
  - line: "source-conservation"
    description: "Bind unique actual statement and transaction identities"
    formula: "Source year and taxpayer owner match return; no duplicated original statement or transaction, including an original already in1099B"
    irsRef: "Final1099DA filer/recipient/account identity; i8949 report each disposition once"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::binds unique original digital statements to actual owners and years"
  - line: "capital-normalization"
    description: "Use one idempotent source-preserving conversion for calculation and review"
    formula: "Append actualDA capital rows tagged1099-da, preserve existingB indices, consume DA from returned copy; never change original inputs or replace confirmedzero basis from legacy lots"
    irsRef: "Final2025 Form8949 G/H/J/K and ScheduleD transfer instructions"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::normalizes actual digital capital sources once without changing original evidence"
  - line: "25b"
    description: "Transfer original Box4 backup withholding once"
    formula: "Form1040line25b += sum original statement Box4; retain exact cents and reject duplicate statement copies"
    irsRef: "i1099DA Box4; i1040 Form1040line25b"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::routes actual digital withholding once through the canonical return"
  - line: "legacy-review"
    description: "Do not reconstruct unsupported lot-derived or phase2 review rows"
    formula: "Source-free legacy2025 arithmetic remains unverified; review requires actual ordinary sources or a separately prepared complete derived-source method"
    irsRef: "i8949 actual basis and source reporting; i1099DA noncovered information may be blank"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::keeps legacy sources unverified and rejects incomplete derived review contexts"
  - line: "known-facts"
    description: "Never discard supplied original special source facts in legacy compatibility"
    formula: "Any supplied new original/source field requires the complete actual contract; computed completeness markers alone do not manufacture facts"
    irsRef: "Final1099DA boxes1h,3b,5,6,9 and actual capital-asset qualification"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::never discards known new special facts through historical compatibility"
  - line: "2026"
    description: "Validate actual covered and noncovered2026 source reporting without enabling the return"
    formula: "Covered source requires actual reported basis; noncovered blank remains null with independent completed taxpayer records; public year gate unchanged"
    irsRef: "Current2026 i1099DA covered securities and voluntary noncovered basis reporting"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::requires actual2026 source boxes without inferring noncovered basis"
  - line: "basis-correction"
    description: "Correct a differing broker basis with code B"
    formula: "Instructions for Form8949 (2025) codes B and E, retrieved2026-10-31. Basis reported to the IRS, boxes G/J: proceeds10000, reported9000, actual6000 => column e9000, column g+3000, code B, gain4000; actual9500 => column g-500, gain500. Not reported, boxes H/K: column e actual6000, column g0, code B, gain4000. Unconfirmed or broker-sourced corrections reject."
    irsRef: "Instructions for Form8949 (2025) column f code B"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::corrects differing broker basis with code B"
  - line: "broker-custody-lot-correction-2026"
    description: "Use the adequately identified taxpayer lot for a covered 2026 ordinary sale"
    formula: "Require a broker-reported covered ordinary 2026 purchase and sale, a 2026 original Box 1d acquisition date, original short-term Box 6, reported Box 1g basis, positive units, proceeds and both bases, and no other adjustments. The named lot and its books record identify all disposed units in the same documented broker-custody account. The identification date must be in the relief period, on or after actual acquisition, and before the sale calendar date. Require confirmed taxpayer basis, custody and exact units, no conflicting broker instruction, and no Rev. Proc. 2024-28 dependency. The actual named lot is long-term. Preserve original facts. Report the actual acquisition date and term, original basis in column e, reported basis minus actual basis in column g, and code T plus B when basis differs. Sale10000, broker basis9000/short, taxpayer basis6000/long: Box J, code BT, adjustment3000, gain4000. Equal basis: code T and zero adjustment. Missing, late or conflicting facts, same-day identification and standing orders remain held. Public year and filing gates are unchanged."
    irsRef: "Notice 2026-20 sections 4.02–4.05; i1099DA (2026) Box 6; published i8949 codes B and T"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::corrects 2026 broker basis and term from a timely named customer lot"
  - line: "broker-custody-lot-no-reuse-2026"
    description: "Use one identified sale per broker, account, asset and named lot"
    formula: "Hold repeated use of a named lot for the same asset in the same broker-custody account, including across statements. Match a broker's valid original nine-digit TIN across formatting and name variants. Where this lot, account and asset match, missing or invalid broker TIN cannot establish different brokers. Multiple sales of one lot require a separate available-units ledger. Distinct lots, accounts, asset codes and proved distinct brokers are tracked independently. Keep freeform lot, account and record references in the original input; the calculation audit uses statement and row indices."
    irsRef: "Notice 2026-20 sections 4.02–4.05; identified disposed digital asset units"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::holds repeated use of a 2026 named lot for the same broker account and asset"
  - line: "broker-custody-exact-amounts-2026"
    description: "Preserve exact source amounts in the broker-custody lot correction"
    formula: "Require exact `reported basis - actual basis` and exact `proceeds - actual basis` after reconstructing Form 8949 columns d, e and g. Hold a correction if the supported operations drop source digits. The original statement gain, when present, reconciles to exact original proceeds minus reported basis."
    irsRef: "i8949 columns d, e, g and h; Notice 2026-20 section 4.05"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::holds a 2026 lot correction when Form 8949 arithmetic would lose source cents"
  - line: "broker-custody-exact-totals-2026"
    description: "Check Form 8949 totals when a broker-custody adjustment is present"
    formula: "When a qualified 2026 broker-custody adjustment is present, require the reported Box J column totals and Part II gain to equal exact sums of their individual rows, including ordinary rows. Hold totals that lose source digits even when the individual corrections are exact."
    irsRef: "i8949 Part II and columns d, e, g and h; Notice 2026-20 section 4.05"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::holds imprecise 2026 Form 8949 totals that include exact lot corrections"
  - line: "broker-custody-large-row-totals-2026"
    description: "Check exact Form 8949 totals for large mixed returns"
    formula: "Validate Box J and Part II exact totals without an argument-count limit. 130000 ordinary long-term rows with gain0.01 and one qualified $4000 broker-custody correction produce Part II gain5300."
    irsRef: "i8949 Part II and Notice 2026-20 section 4.05"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::checks exact 2026 Form 8949 totals with 130000 ordinary rows and a lot correction"
  - line: "selling-expenses"
    description: "Reduce gain for costs not on the form with code E"
    formula: "Gross proceeds10000, actual basis6000, expenses25 => column g-25, code E, gain3975. With the reported9000 correction: column g2975, code BE, gain3975. Costs need confirmation that Box1f does not already reflect them, because i1099DA requires brokers to reduce Box1f by transaction costs. Box3a concerns option premium, so it does not gate this. Original statement gain still reconciles to reported basis."
    irsRef: "Instructions for Form8949 (2025) column f code E; digital asset transaction costs"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::reduces gain for costs not on the form with code E"
  - line: "correction-boundaries"
    description: "Keep corrected rows out of methods that cannot read them"
    formula: "Pennsylvania rejects corrected rows and rows with costs. ScheduleD worksheets compare a corrected row's basis net of adjustments, because they hold actual basis and the row keeps reported basis. Code order is alphabetical, for example BW and BEW. Column g prints -0- for a code B row with no adjustment. Original capital records cannot set codes other than B, E or BE, and the federal path rejects any."
    irsRef: "Instructions for Form8949 (2025) column f and code B"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::keeps corrected rows out of methods that cannot read them"
  - line: "guided-corrections"
    description: "Carry both correction answers through the guide"
    formula: "Basis correction and costs-not-in-Box1f answers pass through unchanged and stay unknown when blank. A code B row with no adjustment prints -0- in column g."
    irsRef: "Instructions for Form8949 (2025) code B"
    testRef: "tests/guided-interview/guided-digital-asset-corrections.test.ts::passes both guided correction answers without defaulting them"
  - line: "zero-column-g"
    description: "Print -0- for a code B row with no adjustment"
    formula: "Box H row with reported95, actual90.24: column e 90.24, code B, column g -0-."
    irsRef: "Instructions for Form8949 (2025) code B, basis not reported"
    testRef: "tests/guided-interview/guided-digital-asset-corrections.test.ts::prints a zero column g for a code B row"
  - line: "schedule-d-worksheet"
    description: "Reconcile a corrected row to the actual basis worksheet"
    formula: "Reported95, actual90.24 with a gold coin row: net long-term110.25, unchanged by the correction. Costs5 with worksheet adjustment-5 give105.25. A different actual basis rejects."
    irsRef: "Schedule D worksheets; Instructions for Form8949 codes B and E"
    testRef: "tests/engine/schedules/schedule-d-digital-sources.test.ts::reconciles corrected digital rows to the actual basis worksheet"
  - line: "income-origin"
    description: "Treat payments and income-origin assets from their actual records"
    formula: "IRS virtual currency FAQs Q13-17 and Q25, Notice2014-21 and Rev.Rul.2023-14, retrieved2026-10-31. A payment for goods or services is an exchange with capital gain or loss. Mining, staking and airdrop assets use the amount included in income as basis, and the taxpayer must confirm that income was reported. A lot received in the return year ties to a receipt on this return by origin, asset, date and remaining units, trying each same-day receipt, and basis is units times the receipt value within1cent. A prior-year lot rests on the confirmation. Other origins still reject."
    irsRef: "https://www.irs.gov/individuals/international-taxpayers/frequently-asked-questions-on-virtual-currency-transactions"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::treats payments and income-origin assets from their actual records"
  - line: "gift-lots"
    description: "Apply the donor basis and value rule to gifts"
    formula: "Pub551: value below donor basis uses donor basis for gain and value for loss, with neither between. Donor10000, value8000: sold12000 basis10000 gain2000; sold9000 basis9000 and0; sold7000 basis8000 loss1000. The test uses the amount realized, so costs of500 on proceeds9000 give basis8500 and0, and proceeds8100 give basis8000 and loss400. A transfer from a spouse uses the spouse's basis with no value test. Value at least donor: donor5000, value8000, sold3000 loss2000. IRC1223(2) tacks only on the donor basis, so a value or no-gain basis uses the gift date. FAQ Q33: tacking also needs documented donor holding, or holding starts at the gift. Unconfirmed records and any other basis reject. Entered gift tax is part of donor basis."
    irsRef: "Pub551 Property Received as a Gift; IRC1015; IRC1223(2); virtual currency FAQ Q32-33"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::applies the donor basis and value rule to gifts"
  - line: "inherited-lots"
    description: "Report inherited lots as long-term"
    formula: "IRC1223(9): long-term whatever the dates show, and column b shows INHERITED. A short-term row and an unconfirmed basis reject."
    irsRef: "IRC1014; IRC1223(9); Instructions for Form8949 column b"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::reports inherited lots as long-term"
  - line: "confirmed-row-lots"
    description: "Keep confirmed rows from sharing a lot pool"
    formula: "A confirmed row carries its own basis and consumes no lot. A return rejects rather than reusing basis when a lot of the row's asset is also consumed by a swap, deposit, liquidation or unconfirmed statement. A row with no ticker is treated as possibly any lot. NFT rows use no lot pool."
    irsRef: "Rev.Proc.2024-28 unit identification; IRC1012"
    testRef: "tests/engine/forms/form-1099-da-sources.test.ts::rejects a confirmed row beside a lot-consuming source for the same asset"

