form: "AI-Evaluation-Executor"
fullName: "Approved synthetic provider measurement with exact spend bounds"
taxYear: 2026
reference: "docs/upgrade-2026-execution-brief.md; https://developers.openai.com/api/docs/guides/evaluation-best-practices; https://developers.openai.com/api/docs/guides/structured-outputs; https://ai.google.dev/gemini-api/docs/generate-content/structured-output"
notes: |
  This software does not grant live-service authorization or model promotion.
  An offline plan binds corpus, task bindings, prices, profiles, repetitions and
  limits. A separate explicit human approval reference must bind that exact plan.
  Capability probes and failed attempts consume the same exact Decimal budget.
  A durable dispatch record precedes each request. Unknown usage retains its full
  maximum and stops; resume never repeats a dispatched attempt. Only authoritative
  referenced usage reconciliation closes it. No silent retries or provider switches.
  Application validation comes from actual versioned schemas, not normalized JSON.
  Unsupported normalization remains a blocker; implemented bindings are revalidated from actual application output.
lines:
  - line: "authorization"
    description: "Plan and approval must match before every dispatch"
    formula: "Require explicit approval reference, plan digest, unexpired bounds and selected provider credentials; no provider request in planning mode."
    testRef: "tests/engine/provider-eval-runner.test.ts::requires exact current approval before any paid dispatch"
  - line: "exact-budget"
    description: "All paid attempts count toward one run budget"
    formula: "Known exact cost plus unknown maximum holds plus next maximum must not exceed approved USD; capability probes and failed schema results count."
    testRef: "tests/engine/provider-eval-runner.test.ts::bounds failed and repeated attempts with exact Decimal costs"
  - line: "uncertain-dispatch"
    description: "Transport ambiguity survives restart without duplicate spend"
    formula: "Persist dispatch before network; missing usage retains maximum, stops and requires referenced reconciliation; never replay the same attempt ID."
    testRef: "tests/engine/provider-eval-runner.test.ts::retains unknown usage and never repeats a dispatched request on resume"
  - line: "measurements"
    description: "Account capabilities are observed rather than assumed"
    formula: "Record actual model response, structured-output acceptance, requested effort, dated evidence and reported usage; unknown/unavailable stays nonpassing."
    testRef: "tests/engine/provider-eval-transport.test.ts::captures actual capability responses without inferring availability from configuration"
  - line: "bindings"
    description: "Normalization and application validation are separate evidence"
    formula: "Validate actual task output against its real schema and derive observations; expected answers or reviewer criteria are never sent."
    testRef: "tests/engine/provider-eval-runner.test.ts::keeps expected answers private and derives actual application observations"
  - line: "journal"
    description: "Local run persistence fails closed"
    formula: "Exclusive process lock and synced append-only hash chain; reject modified/torn history and concurrent execution."
    testRef: "tests/engine/provider-eval-journal.test.ts::rejects concurrent and damaged journals without discarding paid attempts"
  - line: "settled-resume"
    description: "Failed outputs retain known charges and completed repeats are not replayed"
    formula: "Each profile/case has exactly three separate attempts; a resume skips every durable dispatch, including failed outputs, and sums all known charges."
    testRef: "tests/engine/provider-eval-runner.test.ts::retains failed-output charges and resumes without additional requests"
  - line: "reconciliation"
    description: "An authoritative usage correction resolves cost uncertainty only"
    formula: "Reconcile a dispatched unknown-usage attempt once using actual usage and a durable reference; never invent its missing answer or reissue it."
    testRef: "tests/engine/provider-eval-runner.test.ts::resumes after referenced usage reconciliation without repeating the uncertain case"
  - line: "dispatch-order"
    description: "No paid request precedes durable accounting identity"
    formula: "A failed or ineffective append prevents dispatch; cancellation and expired capability evidence stop before the next request."
    testRef: "tests/engine/provider-eval-runner.test.ts::requires durable dispatch and current capability evidence before more calls"
  - line: "offline-cli"
    description: "Planning is offline and leaves approval visibly incomplete"
    formula: "Planning creates private exact-plan files without credentials or network; live mode requires all output paths and separate complete approval before dispatch."
    testRef: "tests/engine/provider-eval-cli.test.ts::creates a private unapproved offline plan and rejects incomplete execution"
  - line: "journal-identity"
    description: "Path aliases cannot create concurrent paid writers"
    formula: "Resolve the parent directory before taking the exclusive lock, reject multiply linked journals and sync the directory before any dispatch."
    testRef: "tests/engine/provider-eval-journal.test.ts::locks directory aliases and rejects multiply linked histories"
  - line: "held-out"
    description: "Diagnostic smoke runs preserve the declared held-out split"
    formula: "Smoke plans include development cases only; held-out execution requires the reviewed qualification purpose. Published cases are not represented as secret or uncontaminated."
    testRef: "tests/engine/provider-eval-runner.test.ts::reserves held-out cases for reviewed qualification plans"
  - line: "qualification-binding"
    description: "A paid qualification plan requires an implemented application binding"
    formula: "Human-reviewed fixtures alone cannot authorize a qualifying run against missing production schemas or unsupported normalization; finish and freeze those contracts first."
    testRef: "tests/engine/provider-eval-runner.test.ts::requires full independent corpus review even with complete application bindings"
  - line: "artifact-path-identity"
    description: "Reports cannot replace an input, journal or journal lock through an alias"
    formula: "Before any write, reject canonical symlink-parent/target, inode and conservative case-fold aliases among all artifacts and the reserved journal lock."
    testRef: "tests/engine/provider-eval-cli.test.ts::rejects canonical and inode output aliases before touching the journal"
  - line: "execution-policy"
    description: "Approval freezes the actual paid request contract"
    formula: "Hash resolved provider/model/effort profiles, all task limits/timeouts, actual prompt and transport constants and wire schema; changed same-ID configuration requires a new approval."
    testRef: "tests/engine/provider-eval-runner.test.ts::rejects same-ID model and request policy changes after planning"
  - line: "response-model"
    description: "Reported identity is explicit rather than inferred from an alias prefix"
    formula: "Use the same documented alias/snapshot allowlist as the independent scorer and freeze it into approval; an unexpected suffix fails the capability check while reported usage remains charged."
    testRef: "tests/engine/provider-eval-runner.test.ts::rejects undocumented model suffixes without discarding charged usage"
