form: "AI-Evaluation-Executor"
fullName: "Approved synthetic provider measurement with exact spend bounds"
taxYear: 2026
reference: "docs/upgrade-2026-execution-brief.md; https://developers.openai.com/api/docs/guides/evaluation-best-practices; https://developers.openai.com/api/docs/guides/structured-outputs; https://ai.google.dev/gemini-api/docs/generate-content/structured-output"
notes: |
  This software does not grant live-service authorization or model promotion.
  An offline plan binds corpus, task bindings, prices, profiles, repetitions and
  limits. A separate explicit human approval reference must bind that exact plan.
  Capability probes and failed attempts consume the same exact Decimal budget.
  A durable dispatch record precedes each request. Unknown usage retains its full
  maximum and stops, including when the response cannot establish the approved
  model. Resume never repeats a dispatched attempt. Only authoritative
  referenced usage reconciliation with a matching billed model closes it. No silent retries or provider switches.
  Application validation comes from actual versioned schemas, not normalized JSON.
  Unsupported normalization remains a blocker; implemented bindings are revalidated from actual application output.
lines:
  - line: "authorization"
    description: "Plan and approval must match before every dispatch"
    formula: "Require explicit approval reference, plan digest, unexpired bounds and selected provider credentials; no provider request in planning mode."
    testRef: "tests/engine/provider-eval-runner.test.ts::requires exact current approval before any paid dispatch"
  - line: "exact-budget"
    description: "All paid attempts count toward one run budget"
    formula: "Known exact cost plus unknown maximum holds plus next maximum must not exceed approved USD; capability probes and failed schema results count."
    testRef: "tests/engine/provider-eval-runner.test.ts::bounds failed and repeated attempts with exact Decimal costs"
  - line: "uncertain-dispatch"
    description: "Transport ambiguity survives restart without duplicate spend"
    formula: "Persist dispatch before network; missing usage retains maximum, stops and requires referenced reconciliation; never replay the same attempt ID."
    testRef: "tests/engine/provider-eval-runner.test.ts::retains unknown usage and never repeats a dispatched request on resume"
  - line: "openai-request-trace"
    description: "Future OpenAI attempts have a private trace before dispatch"
    formula: >-
      Bind the trace policy to the approved request contract. For each
      OpenAI attempt under that contract, generate a random UUID and record
      it durably before sending it as X-Client-Request-Id. Reject missing,
      malformed, repeated or out-of-scope traces in the journal. Preserve
      exact historical request contracts without attaching a retrospective
      identifier. A trace can help locate a timeout. Only authoritative
      usage evidence can release a reserve.
    source: "https://developers.openai.com/api/reference/overview#supplying-your-own-request-id-with-x-client-request-id"
    testRef: "tests/engine/provider-eval-runner.test.ts::journals an opaque OpenAI trace before each provider dispatch"
    testRefs:
      - "tests/engine/provider-eval-runner.test.ts::keeps historical traces absent and rejects a mismatched journal policy"
      - "tests/engine/provider-eval-transport.test.ts::sends a valid client trace only to OpenAI and retains a timeout as unknown"
  - line: "measurements"
    description: "Account capabilities are observed rather than assumed"
    formula: "Record actual model response, structured-output acceptance, requested effort, dated evidence and reported usage; unknown/unavailable stays nonpassing."
    testRef: "tests/engine/provider-eval-transport.test.ts::captures actual capability responses without inferring availability from configuration"
  - line: "bindings"
    description: "Normalization and application validation are separate evidence"
    formula: "Validate actual task output against its real schema and derive observations; expected answers or reviewer criteria are never sent."
    testRef: "tests/engine/provider-eval-runner.test.ts::keeps expected answers private and derives actual application observations"
  - line: "accuracy-version-binding"
    description: "Exact-field accuracy requires current application, prompt and schema versions"
    formula: >-
      Keep every required field of a stale-version measurement in the accuracy
      denominator and count no exact fields or critical-field success for that
      row, even if the payload matches the frozen values. Preserve current-version
      field-by-field scoring, known attempt cost, and repeat coverage requirements.
    testRef: "tests/engine/provider-model-eval.test.ts::counts stale %s evidence as zero exact fields without dropping required fields or cost"
    testRefs:
      - "tests/engine/provider-model-eval.test.ts::uses Decimal for exact cent comparisons beyond JavaScript's safe monetary range"
  - line: "observed-abstention"
    description: "Report only validated explicit abstentions"
    formula: >-
      Count an abstention only when current measurement versions and a
      qualified attempt produced a source-bound application result that
      explicitly abstains. Missing, invalid and stale results still fail
      applicable accuracy and completion checks but are not abstentions.
    testRef: "tests/engine/provider-model-eval.test.ts::counts only bound current outputs as observed abstentions"
  - line: "journal"
    description: "Local run persistence fails closed"
    formula: "Exclusive process lock and synced append-only hash chain; reject modified/torn history and concurrent execution."
    testRef: "tests/engine/provider-eval-journal.test.ts::rejects concurrent and damaged journals without discarding paid attempts"
  - line: "dispatch-plan-window"
    description: "Journaled dispatches belong to the exact plan window"
    formula: >-
      A plan must expire strictly after creation and at most seven days later.
      A dispatch may start at plan creation or later and must start strictly
      before expiry, comparing exact instants without truncating fractional
      seconds. Check the same window before issuing a request and when reading
      a journal, including a historical request contract. Compare approval
      validity at the same precision before dispatch. Keep the existing UTC
      format for plan and dispatch timestamps. An in-window attempt can still
      complete or be reconciled after plan expiry under existing settlement rules.
    testRef: "tests/engine/provider-eval-runner.test.ts::rejects durable dispatch outside the exact plan window"
    testRefs:
      - "tests/engine/provider-eval-runner.test.ts::requires a strictly positive exact plan duration"
      - "tests/engine/provider-eval-runner.test.ts::caps the exact plan duration at seven days"
      - "tests/engine/provider-eval-runner.test.ts::blocks a dispatch before exact plan creation after recording its run identity"
      - "tests/engine/provider-eval-runner.test.ts::retains reconciliation after plan expiry for an in-window dispatch"
  - line: "settled-resume"
    description: "Failed outputs retain known charges and completed repeats are not replayed"
    formula: "Each profile/case has exactly three separate attempts; a resume skips every durable dispatch, including failed outputs, and sums all known charges."
    testRef: "tests/engine/provider-eval-runner.test.ts::retains failed-output charges and resumes without additional requests"
  - line: "reconciliation"
    description: "An authoritative usage correction resolves cost uncertainty only"
    formula: >-
      Reconcile a dispatched unknown-usage attempt once using actual usage, a
      durable reference and the billed model documented by that evidence. The
      model must match the approved profile or its documented snapshot before
      the hold can be released. Never invent its missing answer or reissue it.
      Older reconciliation rows without a billed model and older result rows
      containing usage without a matching model remain readable. Their
      assumed-profile costs remain visible separately. Keep the full hold and
      exclude their usage from qualification until an authoritative, model-bound
      reconciliation is appended.
    testRef: "tests/engine/provider-eval-runner.test.ts::resumes after referenced usage reconciliation without repeating the uncertain case"
    testRefs:
      - "tests/engine/provider-eval-runner.test.ts::keeps a timed-out attempt held when reconciliation names a different billed model"
      - "tests/engine/provider-eval-runner.test.ts::keeps old reconciliation costs visible and awaits verified model evidence before resuming"
      - "tests/engine/provider-eval-runner.test.ts::keeps older result usage without matching identity held until verified reconciliation (%s)"
      - "tests/engine/provider-eval-cli.test.ts::requires the evidenced billed model for offline reconciliation"
  - line: "reconciliation-reference-uniqueness"
    description: "Bind each authoritative reconciliation reference to one dispatched attempt"
    formula: >-
      Trim surrounding whitespace from new opaque receipt and provider
      references before hashing and compare their digests case-sensitively.
      Treat blank provider references as absent when selecting a header or body
      fallback. Keep recorded journal digests as written. Reject a new
      verified receipt whose reference matches a verified receipt or provider
      response on a different attempt, including a capability probe. A response
      and receipt may identify the same attempt. Keep older journals with
      conflicting references readable. Preserve verified response usage and
      retain each conflicting reconciliation's full unresolved hold. Report
      implicated reconciliation costs separately as unverified and stop further
      dispatch.
    testRef: "tests/engine/provider-eval-runner.test.ts::refuses a reused reconciliation reference and resumes on distinct evidence"
    testRefs:
      - "tests/engine/provider-eval-runner.test.ts::retains every affected hold when a durable historical journal reuses a verified receipt"
      - "tests/engine/provider-eval-runner.test.ts::rejects receipts that reuse another response and accepts the same attempt's reference"
      - "tests/engine/provider-eval-runner.test.ts::preserves charges and holds when a historical receipt reuses a %s response"
      - "tests/engine/provider-eval-runner.test.ts::treats a blank provider reference as missing"
      - "tests/engine/provider-eval-transport.test.ts::normalizes provider references before choosing a fallback"
  - line: "reconciliation-collision-correction"
    description: "Correct one historical cross-attempt receipt collision using distinct authoritative evidence"
    formula: >-
      Require explicit selection of the prior model-bound reference on the
      same attempt. Append one correction linked to its normalized digest.
      Replay must prove that the prior receipt was dated on or after dispatch,
      matched the approved model, and collided with another attempt's evidence
      before the correction. The correction must use an unused normalized
      reference, a matching billed model, exact reported usage, and a timestamp
      at or after the targeted receipt. Allow an earlier legacy unverified
      receipt. Preserve all records and retain the prior reference in the
      collision index. Settle only the corrected attempt using the new usage,
      retain other unresolved holds and never treat cost as response evidence.
    testRef: "tests/engine/provider-eval-runner.test.ts::corrects a selected collision after an older unverified receipt"
    testRefs:
      - "tests/engine/provider-eval-runner.test.ts::keeps the other attempt held and rejects corrections without prior collision proof"
      - "tests/engine/provider-eval-cli.test.ts::appends one explicit receipt correction offline"
  - line: "reconciliation-time-order"
    description: "Release a usage reservation only with evidence recorded at or after dispatch"
    formula: >-
      Compare the exact dispatch and authoritative receipt instants, preserving
      submillisecond precision and accounting for the recorded UTC offsets.
      Reject new receipts recorded before dispatch. Keep historical journals
      with early receipts readable. Preserve verified charges on other
      dispatches and show the early receipt's cost as unverified while
      retaining the full hold and stopping further dispatch.
    testRef: "tests/engine/provider-eval-runner.test.ts::reconciles only at or after dispatch with exact fractional seconds and UTC offsets"
    testRefs:
      - "tests/engine/provider-eval-runner.test.ts::keeps a historical early receipt readable and holds further dispatch"
  - line: "dispatch-order"
    description: "No paid request precedes durable accounting identity"
    formula: "A failed or ineffective append prevents dispatch; cancellation and expired capability evidence stop before the next request."
    testRef: "tests/engine/provider-eval-runner.test.ts::requires durable dispatch and current capability evidence before more calls"
  - line: "dispatch-price-window"
    description: "Recheck the effective price after the dispatch write"
    formula: |
      Before calling transport, compare the approved model's active pricing
      after durable dispatch with the price used for its reservation. If the
      price has changed, append an immediate unsent record and stop with no
      provider request, charge or held usage for that attempt. Preserve the
      original reservation when the price is unchanged. A bare dispatch
      remains reserved if the unsent record cannot be persisted, and a resume
      does not repeat its attempt identifier.
    irsRef: "https://ai.google.dev/gemini-api/docs/pricing#gemini-3.8-flash"
    testRef: "tests/engine/provider-eval-runner.test.ts::checks the effective price after durable dispatch (%s)"
  - line: "dispatch-send-window"
    description: "Apply existing time limits immediately before transport"
    formula: |
      After durable dispatch, sample the clock once before calling transport.
      Use that instant for the exact approval and plan windows, documented
      model shutdown, applicable capability age and effective pricing. A
      window that closes during the write records the attempt as immediately
      unsent without consuming an additional request or provider cost.
      The default clock observes only whole milliseconds. Both expiry
      endpoints must reach the end of its current millisecond, with expiry
      exactly at the next millisecond admissible. Keep sampled lower bounds,
      exact injected-clock behavior and historical journal validation.
    testRef: "tests/engine/provider-eval-runner.test.ts::holds a durable attempt when its send window closes (%s)"
    testRefs:
      - "tests/engine/provider-eval-runner.test.ts::holds a durable case when capability evidence expires during its write"
      - "tests/engine/provider-eval-runner.test.ts::admits a durable send only within the default clock precision (%s)"
  - line: "offline-cli"
    description: "Planning is offline and leaves approval visibly incomplete"
    formula: "Planning creates private exact-plan files without credentials or network; live mode requires all output paths and separate complete approval before dispatch."
    testRef: "tests/engine/provider-eval-cli.test.ts::creates a private unapproved offline plan and rejects incomplete execution"
  - line: "journal-identity"
    description: "Path aliases cannot create concurrent paid writers"
    formula: "Resolve the parent directory before taking the exclusive lock, reject multiply linked journals and sync the directory before any dispatch."
    testRef: "tests/engine/provider-eval-journal.test.ts::locks directory aliases and rejects multiply linked histories"
  - line: "held-out"
    description: "Diagnostic smoke runs preserve the declared held-out split"
    formula: "Smoke plans include development cases only; held-out execution requires the reviewed qualification purpose. Published cases are not represented as secret or uncontaminated."
    testRef: "tests/engine/provider-eval-runner.test.ts::reserves held-out cases for reviewed qualification plans"
  - line: "qualification-binding"
    description: "A paid qualification plan requires an implemented application binding"
    formula: "Human-reviewed fixtures alone cannot authorize a qualifying run against missing production schemas or unsupported normalization; finish and freeze those contracts first."
    testRef: "tests/engine/provider-eval-runner.test.ts::requires full independent corpus review even with complete application bindings"
  - line: "qualification-review-timing"
    description: "Freeze the independent corpus review before planning or dispatch"
    formula: >-
      Require the canonical authors and valid independent review metadata for
      all frozen cases by plan creation. Reapply that same cutoff when opening
      an approved qualification run or resuming its held-out dispatches.
    testRef: "tests/engine/provider-eval-runner.test.ts::rejects qualification review after plan creation even with a matching approval digest"
  - line: "artifact-path-identity"
    description: "Reports cannot replace an input, journal or journal lock through an alias"
    formula: "Before any write, reject canonical symlink-parent/target, inode and conservative case-fold aliases among all artifacts and the reserved journal lock."
    testRef: "tests/engine/provider-eval-cli.test.ts::rejects canonical and inode output aliases before touching the journal"
  - line: "execution-policy"
    description: "Approval freezes the actual paid request contract"
    formula: "Hash resolved provider/model/effort profiles, all task limits/timeouts, actual prompt and transport constants and wire schema; changed same-ID configuration requires a new approval."
    testRef: "tests/engine/provider-eval-runner.test.ts::rejects same-ID model and request policy changes after planning"
  - line: "response-model"
    description: "Reported identity is explicit rather than inferred from an alias prefix"
    formula: >-
      Use the documented alias and snapshot allowlist frozen into approval.
      Reported usage settles only if the response establishes the approved
      model, including when the output fails or is refused. A missing or
      mismatched model keeps the maximum hold, blocks later requests and
      excludes the output from evaluation. Retain the hashed provider response
      reference for authoritative reconciliation.
    testRef: "tests/engine/provider-eval-runner.test.ts::holds live usage without matching model evidence and resumes without repeating it (%s)"
    testRefs:
      - "tests/engine/provider-eval-runner.test.ts::retains failed-output charges and resumes without additional requests"
      - "tests/engine/provider-eval-transport.test.ts::preserves a body-only provider reference when the response omits the model"
  - line: "exported-capability-accounting"
    description: "Account for capability requests once, outside individual task costs"
    formula: >-
      Export each sent probe once by profile with its exact maximum and, when
      settled, its actual and filing-season prices from journal usage. Report
      the maximum hold until the response or reconciliation is visible at the
      cutoff. Identify historical charges with unknown timing outside the
      settled amounts. Historical exports without probe accounting have unknown
      overhead. Report actual and filing-season
      task costs per accepted run without allocating the shared probe to tasks.
    testRef: "tests/engine/provider-eval-runner.test.ts::reports shared capability spend once alongside all case attempts"
    testRefs:
      - "tests/engine/provider-eval-runner.test.ts::retains unknown usage and never repeats a dispatched request on resume"
      - "tests/engine/provider-eval-runner.test.ts::holds a capability charge in reports preceding authoritative reconciliation"
      - "tests/engine/provider-eval-runner.test.ts::reports directly measured probe costs only after observing the response"
      - "tests/engine/provider-model-eval.test.ts::counts only dated response reviews that follow the measured result and meet the report cutoff"
  - line: "provider-result-observation-cutoff"
    description: "Report direct provider evidence once its result has been observed"
    formula: >-
      A dispatch clock reading must precede or equal the last pre-send reading.
      If pre-send sampling throws after durable dispatch, record that no
      request was sent and release that attempt's budget hold.
      Record the wall-clock observation time of every returned provider result,
      including case outcomes and failed or billed responses. If that clock
      throws or cannot establish a valid time on or after send, retain the exact known
      journal charge with an explicit unknown observation time and stop the
      execution. A dated report first sees capability status, case outputs,
      latency, response references and direct usage at the observation instant.
      Before then, a dispatched case has unknown actual and filing-season costs
      and its response is excluded from observed quality rates.
      Keep receipt-dated reconciliation independent of result observation and
      preserve existing behavior for historical records without the field.
    testRef: "tests/engine/provider-eval-runner.test.ts::reports probe availability and direct case usage only at or after observing each result"
    testRefs:
      - "tests/engine/provider-eval-runner.test.ts::stops before transport when the send clock precedes the durable dispatch"
      - "tests/engine/provider-eval-runner.test.ts::preserves known charges without dating a result when the clock regresses"
      - "tests/engine/provider-eval-runner.test.ts::releases the reservation when pre-send clock sampling throws"
      - "tests/engine/provider-eval-runner.test.ts::preserves authoritative probe and case charges when result clock sampling throws"
      - "tests/engine/provider-model-eval.test.ts::keeps unobserved responses and later receipts out of earlier reports"
