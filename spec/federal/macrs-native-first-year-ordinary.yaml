form: "MACRS-Native-First-Year-Ordinary"
fullName: "Actual native first-year ordinary Schedule C asset sources"
taxYear: 2025
references:
  - "https://www.irs.gov/publications/p946#en_US_2025_publink1000107544"
  - "https://www.irs.gov/instructions/i4562"
lines:
  - line: "native-route"
    description: "Native asset controls reach actual top-level Form4562 and Schedule C"
    formula: "For current-year full-calendar ordinary nonlisted/nonpassenger GDS200DB classes3/5/7/10, require actual gross basis, constant business use, full dates, complete source references, explicit zero179/bonus completed worksheet treatment, and confirmed original snapshots. Emit canonical top-level Form4562 and actual Schedule C attribution, not another expense scalar."
    testRef: "tests/apps/web/guided-macrs-assets.test.ts::routes documented ordinary assets through current Form4562 and Schedule C"
  - line: "unknown-source"
    description: "Raw unknowns, actual zero and stale original records"
    formula: "New drafts have no assumed amounts, dates, percentages, negative answers or original confirmations. Preserve invalid literals. Only an explicit confirmation captures a snapshot; rebuilds never rebase originals. A changed source, year, owner, business, row or competing activity requires re-review; exact no-op blur preserves source confirmation."
    testRef: "tests/apps/web/macrs-asset-details.test.tsx::real native entry captures originals explicitly and both confirmations can remain current"
  - line: "inventory"
    description: "Complete convention inventory and attribution before shortcuts"
    formula: "Require unique complete per-asset references, current owner/business/year snapshots, actual whole-inventory and no-other-activity records; deny competing rental/farm activity, unsupported history/listed/elections, partial or duplicate collections and stale saved outputs before zero/exclusion paths. Existing aggregate strict greater-than40percent calculation is unchanged."
    testRef: "tests/engine/schedules/schedule-c-depreciation-sources.test.ts::canonical source packet checks current owner activity year and every original before zero paths"
  - line: "saved-private"
    description: "Saved original facts and privacy boundaries"
    formula: "Persist complete/incomplete drafts under the existing per-workspace guided JSON and encrypted recovery. Missing old records remain absent/unqualified. Never add private asset/source records to the hosted shell contract; no final-form or2026/public readiness gate is opened."
    testRef: "tests/apps/web/macrs-native-saved-workspace.test.ts::preserves raw unknowns and actual zero in saved per-workspace facts"
  - line: "native-browser"
    description: "Actual local entry and reopen on desktop and mobile"
    formula: "Enter original assets through native controls without seeding asset proofs. Keep normal browser deadlines/retries, preserve exact no-op focus/blur, reject a changed original reference and retain original snapshots. This is an interview route check, not official-form qualification."
    testRef: "apps/web/tests/macrs-first-year-native.spec.ts::actual first-year assets survive native entry and local reopen"
