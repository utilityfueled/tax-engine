notes: |
  Whole-dollar lines follow the repository consistent IRS rounding election.
  Historical table amounts are independently checked against every published row.
  2026 remains an indexed statutory preview until final table/forms are available.
  ScheduleD special gains use ordinary rates through the24percent bracket, then
  actual25/28percent caps; they do not become0/15percent income.
  Skip23–43 when1=16; skip33–43 when1=32; skip35–40 for zero1250;
  skip41–43 for zero28percent gain. Unknown special-gain source worksheets
  and Form4952 source elections do not become verified source amounts.
