form: "Form 8880 final 2026 physical candidate"
fullName: "Final 2026 Credit for Qualified Retirement Savings Contributions physical field source contract"
taxYear: 2026
reference: "https://www.irs.gov/pub/irs-prior/f8880--2026.pdf"
revision: "Created 3/16/26; IRS final archive posted 2026-11-17 22:12:04"
notes: |
  Archived annual and current final PDFs matched byte for byte at retrieval.
  Final 2026 instructions and the fillable Credit Limit Worksheet are included
  on page 2 of the same PDF. The IRS about page links this combined product;
  there is no separate current i8880.pdf (HTTP 404). The internal projection
  reuses the canonical federal calculation. Annual review and filing stay closed.
lines:
  - line: "revision"
    description: "Pin the final combined annual form and instructions"
    formula: "Require 86366 bytes, SHA-256 a85be44f0743eb3c4df9cb7523b452553275fc6725e6cf9ad28b63c7354a4802, title 2026 Form 8880, two 611.976 by 791.968 point pages."
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::pins the final combined annual source"
  - line: "physical-locations"
    description: "Locate all 23 canonical fields and all page widgets"
    formula: >-
      Require two header fields, separate taxpayer/spouse cells for lines 1-6,
      lines 7-12 and three page-two Credit Limit Worksheet cells. All are text.
      Match fully qualified names, page references, rectangle and MaxLen metadata.
      Line 9 stores only one fractional digit after the printed x 0. prefix;
      preserve MaxLen 1, using 5, 2, 1 or 0 rather than a complete decimal string.
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::matches every canonical field and page widget to its printed location"
  - line: "annual-printed-references"
    description: "Record final printed annual facts without implementing calculations"
    formula: >-
      Lines 1-2 list 2026 contributions; line 3 adds them, line 4 covers certain
      distributions after 2023 through the return due date, line 5 is the positive
      difference or zero, and line 6 caps each column at 2000. Line 7 adds columns.
      Line 8 references Form 1040/1040-SR/1040-NR line 11a. Line 9 uses the printed
      status/rate table. Line 10 multiplies lines 7 and 9. Worksheet lines 1/2
      reference Form 1040 line 18 and Schedule 3 lines 1-3, 6d and 6l. Worksheet
      line 3 subtracts worksheet line 2 from line 1 and transfers to line 11;
      if zero or less, stop and do not file. Line 12 takes the smaller of lines
      10 and 11 and transfers to Schedule 3 line 4. Physical metadata only.
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::records the annual printed references and rate table"
  - line: "saved-diagnostics"
    description: "Reopen synthetic values with nonempty matching appearances"
    formula: >-
      Preserve every logical and effective widget text value, zero and distinct
      diagnostic whole amounts in both columns and worksheet cells; test every
      line 9 digit 5/2/1/0 with its native one-character constraint intact.
      Reject a complete 0.5 string in that native cell. Retain interactive fields
      and review notices on both pages; use only fictional header identifiers.
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::round-trips all diagnostic values and native rate digits with appearances"
  - line: "ordinary-code-d-projection"
    description: "Project one annual primary W-2 and the federal credit-limit worksheet"
    formula: >-
      Use one confirmed original 2026 employee Form W-2 for a single filer with
      no dependents. Reconcile its primary owner, employer EIN, Box 1 wages and
      current-year Box 12 Code D to the declared evidence. Use the ordinary 401(k)
      deferral amount after confirming the absence of catch-up, prior-year make-up,
      excess deferrals or competing contribution sources. Use complete 2026 Form
      8880 eligibility and testing-period facts with zero distributions and zero
      AGI restorations. Hold prior nonrefundable credits and require the ordinary
      standard-deduction return to reconcile to Box 1 wages and the Form 8880
      Line 8 amount. Project exact whole dollar primary-column and numbered
      amounts from the canonical result and leave column (b) blank. Use only the
      fractional digit of a positive printed rate on line 9. Use the Form 1040
      line 18 preview for worksheet line 1, explicit zero from Schedule 3 lines
      1–3, 6d and 6l for line 2, and their difference for line 3 and form line 11.
      Require positive line 12 and reconcile it to Schedule 3 line 4. Redact the
      SSN and mark both saved pages for review only. The missing annual tax table
      holds public dispatch and exports. The fixture uses the existing draft
      statutory-rate preview with a test-only rule-data mock.
    irsRef: "2026 Form 8880 face and integrated instructions. IRS 2026 W-2 instructions, Box 12 (https://www.irs.gov/instructions/iw2w3). IRS Notice 2025-67, §402(g) regular deferral limit (https://www.irs.gov/pub/irs-drop/n-25-67.pdf)."
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::projects an original Code D W-2 into the saved credit and worksheet"
  - line: "ordinary-roth-projection"
    description: "Project a confirmed regular Roth IRA contribution into the internal review PDF"
    formula: >-
      For the same single, wage-only 2026 return, require the referenced primary
      holder's timely regular Roth IRA contribution from the original record. Its
      positive whole-dollar amount must match both Form 8880 line 1 input and the
      confirmed ordinary IRA worksheet. Require sufficient eligible compensation,
      no other contribution sources or elections, zero AGI restorations, and the
      same reconciled W-2 and tax-limit scope as the Code D case. Write the
      canonical contribution on line 1a and zero on line 2a. Line 4a is either a
      confirmed zero or the separately bound ordinary 2024 or 2025 distribution below.
      Require a positive credit tied to Schedule 3 line 4, preserve
      the native line 9 digit and worksheet cells, and verify the saved PDF with
      an independent reader. The candidate stays review-only with public export held.
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::projects an original regular Roth IRA contribution into the saved credit and worksheet"
  - line: "ordinary-roth-source-holds"
    description: "Hold inconsistent or competing Roth IRA contribution sources"
    formula: >-
      Reject missing confirmation, wrong year or owner, amount mismatch between
      the statement and either worksheet, insufficient compensation, competing
      IRA or employer contributions, and a nonzero distribution reduction
      without the separately bound supported original. Do not project an estimate
      from a missing IRA worksheet.
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::holds incomplete and conflicting ordinary Roth IRA originals"
  - line: "4a prior-year ordinary original"
    description: "Materialize the supported historical reduction on the Roth candidate"
    formula: >-
      Use one exact matched 2024 or 2025 ordinary IRA original from the annual
      source packet. Require the canonical line 4a to match that amount and preserve
      current wage-only income. Keep whole-dollar field validation, the positive
      Schedule 3 transfer and all existing export holds. Do not write the
      historical statement or payment identifiers into the saved PDF.
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::reopens the matched %i distribution and reduced Roth credit"
  - line: "ordinary-roth-age-limit"
    description: "Use actual date of birth for the 2026 Roth IRA contribution limit"
    formula: >-
      The internal Roth projection uses the primary taxpayer birth date to
      determine whether the 7500 dollar annual amount increases by the 1100
      dollar age-50 catch-up. A saved age-50 worksheet override cannot affect the limit.
      Apply the canonical IRA worksheet rules and reject contributions over the
      actual age-based limit before rendering the form.
    irsRef: "IRS Notice 2025-67, sections 219(b)(5)(A) and (B)(ii) (https://www.irs.gov/pub/irs-drop/n-25-67.pdf)."
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::uses actual birth date for the Roth limit despite a saved age override"
  - line: "ordinary-source-holds"
    description: "Hold incomplete, nonmatching and outside-scope sources before rendering"
    formula: >-
      Reject missing facts and support for an incorrect tax year, taxpayer,
      employer, amount, contribution category or return type. Reject another W-2
      or statement with retirement distributions, amounts outside the ordinary
      whole-dollar method, external contribution overrides, positive prior credit,
      a zero credit outcome, or another blank form revision.
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::holds missing, conflicting and outside-scope originals"
  - line: "closed-exports"
    description: "Keep annual review and filing gates closed"
    formula: >-
      Candidate is frozen, disabled and independent-review-pending. Reject 2026
      bytes in the 2025 slot, historical bytes in the unqualified 2026 slot,
      mismatched years and 2026 review/filing exports; retain the historical pin.
    testRef: "tests/pdf/form-8880-2026-candidate.test.ts::keeps annual and historical export gates closed"
