form: "Section170 alternative-tax charitable carry adjustment"
fullName: "Current public-cash charitable carry with an independent positive ATNOL"
taxYear: 2025
irsReference: "https://www.ecfr.gov/current/title-26/section-1.55-1"
notes: |
  IRC56(a)(4),(d) substitutes the independent alternative NOL ledger; Reg1.55-1(a)
  otherwise retains170. For individuals, Reg1.55-1(b) fixes AGI-dependent amounts
  to regular-tax AGI. Do not substitute ATNOLD for regular NOLD in the charitable
  percentage limit or import a corporate simultaneous-equation method.
  IRC170(d)(1)(B), applied to the alternative loss ledger, reduces tentative
  charity carry only by the excess gift's increase in succeeding ATNOL carry.
  Recompute modified AMTI with the nonexcess source gift and the actual regular
  NOL deduction retained. Keep actual current AMTI, ATNOLD and absorption intact.
  Current and comparison ATNOL ledgers use the same actual source vintages,
  90-percent modified-income capacity and expiry. The examples below are derived
  statutory controls, not published IRS numeric examples or human qualification.
  The public-cash examples below extend through charitable-single-category-nol
  to actual single-category current property and other-recipient gifts. Both
  require separate empty prior regular/AMT charity histories and existing
  same-basis ordinary NOL sources. Prior/mixed
  charitable categories, special ATNOL sources and2026 standard-deduction170(p)
  coordination remain separate methods. Never infer an empty AMT history from
  regular zero, and never alter original receipts or accept computed-income overrides.
lines:
  - line: "history"
    description: "Bind separate actual prior charitable histories"
    formula: "Require sourceTaxYear=currentYear-1, actual reference, confirmed completeness and explicit separate empty priorRegularCarryovers/priorAlternativeCarryovers arrays. Unknown and nonempty histories reject; preserve them without inferred zeros."
    irsRef: "Reg1.55-1(a),(b); IRC56(d),170(d); i6251 Recordkeeping"
    testRef: "tests/engine/federal-alternative-charitable-nol.test.ts::requires independent prior charity histories and preserves unknown source facts"
  - line: "no-modification"
    description: "Use regular AGI with an independent positive alternative loss"
    formula: "2025wages100000/cash60000/regularNOL100000: regular claim32000, AGI68000, charity40800/tentative19200. ATNOL100000 and actual/modifiedAMTI59200 give claim/absorption53280 and carry46720. Removing19200 excess changes neither modifiedAMTI nor carry, so AMT charity remains19200 while regular charity is3840."
    irsRef: "IRC170(d)(1)(B),56(a)(4),(d); Reg1.55-1(b)"
    testRef: "tests/engine/federal-alternative-charitable-nol.test.ts::keeps regular AGI and independently calculates positive AMT charitable carry"
  - line: "capital-modification"
    description: "Coordinate positive ATNOL even without regular NOL carry"
    formula: "2025wages100000/capital loss3000/cash60000/no regularNOL: AGI97000,charity58200,tentative1800. ActualAMTI38800, modified40000; ATNOL100000 claim34920/absorb36000/carry64000. Nonexcesscash58200 gives modifiedAMTI41800/absorb37620/carry62380; reduce1800 by1620 to180. Current regular charity stays1800 and actual ATNOLD34920 is unchanged."
    irsRef: "IRC56(d)(1)(B)(ii),172(b)(2),170(d)(1)(B); Reg1.172-5(a)(2)(ii)"
    testRef: "tests/engine/federal-alternative-charitable-nol.test.ts::refigures only alternative carry absorption when no regular loss remains"
  - line: "expiry"
    description: "Measure succeeding carry rather than expired loss absorption"
    formula: "For the preceding capital-modification case with a2005 ATNOL expiring after2025, actual absorbed36000/expired64000 and comparison absorbed37620/expired62380 both leave zero succeeding carry. No170 reduction; alternative charity1800."
    irsRef: "IRC170(d)(1)(B),172(b)(1)(A) pre2018 expiry; IRC56(d)"
    testRef: "tests/engine/federal-alternative-charitable-nol.test.ts::does not reduce charity for an alternative loss that expires this year"
  - line: "2026-floor"
    description: "Remove eligible excess source cash before recomputing the modified floor"
    formula: "Isolated2026itemized wages100000/capital loss3000/cash60000: AGI97000, charity58200-485=57715,tentative2285. ActualAMTI39285/ATNOLD35357; modifiedAMTI40500/absorption36450/carry63550. Nonexcessgift57715 minus modified500floor gives57215deduction/42785AMTI/38507absorption/61493carry. Reduce tentative2285 by2057 to228. Full2026 readiness is unchanged."
    irsRef: "IRC170(b)(1)(I),170(d)(1)(C) before(B),56(d); i1040 whole-dollar rounding"
    testRef: "tests/engine/federal-alternative-charitable-nol.test.ts::reapplies the isolated2026 floor without replacing the actual AMT deduction"
  - line: "conservation"
    description: "Validate canonical amounts and carry conservation"
    formula: "Aggregate exact original qualified value and retain exact tentative source excess before rounding each completed carry worksheet amount; nonexcess=contributions-tentative; reduction=min(tentative,actualATNOLcarry-comparisonATNOLcarry); remaining=tentative-reduction. Reject nonfinite/negative tentative excess, noninteger canonical ATNOL carry, comparison exceeding actual carry, unsupported sources or changed current deduction."
    irsRef: "IRC170(d)(1)(B); Reg1.170A-10(d)(1); Form172 recordkeeping"
    testRef: "tests/engine/forms/alternative-charitable-net-operating-loss.test.ts::conserves the separate alternative carry and rejects invalid comparison amounts"
  - line: "intake"
    description: "Collect actual histories without confirmation defaults"
    formula: "Separate prior regular and AMT charitable lists begin unknown; explicitly record none or retain actual rows. Require prior year/reference/completeness and invalidate nested and outer source confirmations on substantive edits. A confirmation-only edit does not erase another confirmation."
    irsRef: "i6251 Recordkeeping; IRC170(d),56(d) source history"
    testRef: "tests/apps/web/guided-alternative-charitable-nol.test.ts::preserves separate charity histories and invalidates changed source confirmations"
  - line: "review"
    description: "Display source-bound regular and alternative computations separately"
    formula: "Reconcile actual and comparison AMT ledgers, canonical gift total, unique audits and both output carries before generating review. Show actual ATNOLD/absorbed/expired/carry separately from the charity-only comparison. Remove identifiers; retain one visible review notice per page."
    irsRef: "i6251 Recordkeeping; Form172 deduction statement; IRC170(d)(1)(B)"
    testRef: "tests/pdf/alternative-charitable-nol-review.test.ts::renders separately reconciled alternative charity carry without source identifiers"
  - line: "interactive-history"
    description: "Enter both histories through actual form controls"
    formula: "A newly added history begins unknown. The user separately records each empty ledger and its source year/reference/completeness before confirming it; adding or editing any retained history entry clears confirmations and preserves the unsupported facts."
    irsRef: "i6251 Recordkeeping; independent170(d) source history"
    testRef: "tests/apps/web/alternative-charitable-nol-interactions.test.tsx::collects independent charitable histories without defaulting either list"
  - line: "browser-history"
    description: "Persist explicitly entered histories privately across reload"
    formula: "Desktop and mobile production pages retain actual prior year/reference and both confirmed empty lists. A source change clears all dependent confirmations, missing history stays unknown, and no source reference or taxpayer identifier is posted to a service."
    irsRef: "i6251 Recordkeeping; application privacy and actual-source contract"
    testRef: "apps/web/tests/alternative-charitable-nol.spec.ts::preserves independently entered charitable histories"
