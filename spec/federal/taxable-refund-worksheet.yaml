form: "Taxable Refund Worksheet"
title: State and Local Income Tax Refund Worksheet
taxYear: 2025
reference: IRS Schedule 1 Instructions, Worksheet 1; IRC §111; Pub 525
purpose: |
  Determines how much of a prior-year state/local income tax refund is
  taxable income under the IRC §111 tax benefit rule. A refund is taxable
  only to the extent the prior-year SALT deduction produced a tax benefit.
  The SALT cap (IRC §164(b)(6), $10,000/$5,000 MFS) further limits the
  taxable portion because refunds attributable to taxes above the cap never
  reduced the prior-year deduction.

lines:
  - line: "origin_year"
    description: Explicit origin year controls the historical SALT limitation
    formula: require actual deduction priorTaxYear in 2018..2026 and priorTaxYear < receipt year; explicit refundExpenseTaxYear must match. Only historical unverified inputs may use Box3 as the former compatibility origin.
    reference: IRC 111; Publication 525 (2025), Recoveries for 2 or more years; IRC 164(b)(6)
    note: |
      Box3 state-return year and actual expense/deduction year are distinct.
      Verified source refunds retain both; payments and refunds in the same year
      reduce the current deduction under Publication525.
      Never assume the refund relates to the immediately preceding year. One
      worksheet supports one origin year. Mixed-year refunds require separate
      worksheets and are rejected until that orchestration is implemented.
      For 2018-2024 the limit is 10000 (5000 MFS). For 2025 the pre-MFS limit
      is max(10000, 40000 - 30% * max(0, priorYearSaltMagi - threshold)), where
      threshold is 500000 (250000 MFS); divide the result by two for MFS.
      For 2026 use 40400 and threshold 505000 (252500 MFS). Round to whole
      dollars after the MFS division. MAGI is required for 2025 and 2026.
      Positive refunds after itemization require actual historical income taxes
      and property taxes, including an explicit zero when none were paid. Missing
      cap facts reject instead of becoming zero. MAGI may be negative but must be
      finite; refund and deduction/payment amounts must be nonnegative.
      Sources refreshed 2026-10-24; independently reviewed expectations pending.
    testRef: "tests/engine/forms/taxable-refund-years.test.ts::Taxable refunds retain their origin year"

  - line: "1"
    description: Total state/local income tax refunds from Form(s) 1099-G Box 2
    formula: sum(form1099G[].stateLocalIncomeTaxRefund)
    reference: Form 1099-G Box 2
    testRef: "tests/engine/forms/taxable-refund-worksheet.test.ts::Taxable Refund Worksheet — basic tax benefit rule"

  - line: "3"
    description: Did taxpayer itemize on prior-year return?
    formula: input.priorYearItemized
    note: If no, none of the refund is taxable (result = 0, stop)
    testRef: "tests/engine/forms/taxable-refund-worksheet.test.ts::Taxable Refund Worksheet — basic tax benefit rule"

  - line: "6"
    description: Excess of itemized deductions over standard deduction
    formula: max(0, priorYearItemizedTotal - priorYearStandardDeduction)
    note: If zero or less, refund is not taxable (result = 0, stop)
    testRef: "tests/engine/forms/taxable-refund-worksheet.test.ts::Taxable Refund Worksheet — basic tax benefit rule"

  - line: "7"
    description: Tax benefit amount before SALT cap adjustment
    formula: min(Line 1, Line 6)
    testRef: "tests/engine/forms/taxable-refund-worksheet.test.ts::Taxable Refund Worksheet — basic tax benefit rule"

  - line: "sales_tax_alt_cap"
    description: Maximum taxable refund after comparing prior-year income-tax deduction to the alternative sales-tax deduction
    formula: max(0, min(priorYearStateLocalTaxesPaid, saltCapIfKnown) - min(priorYearAlternativeGeneralSalesTaxDeduction, saltCapIfKnown))
    note: |
      Per Pub. 525, the maximum state income tax refund includible in income is
      limited to the excess of the state/local income tax deduction chosen in
      the prior year over the general sales tax deduction that could have been
      chosen instead. When the alternative sales-tax amount is not provided,
      this cap is not applied.
    reference: Pub. 525, "State or local general sales taxes instead of state or local income taxes"
    testRef: "tests/engine/forms/taxable-refund-worksheet.test.ts::Taxable Refund Worksheet — sales-tax alternative cap"

  - line: "10"
    description: Excess of taxes paid over SALT cap
    formula: max(0, priorYearStateLocalTaxesPaid - saltCap)
    note: If zero or less, taxable refund = Line 7 (skip Lines 11-13)
    reference: IRC §164(b)(6)
    testRef: "tests/engine/forms/taxable-refund-worksheet.test.ts::Taxable Refund Worksheet — SALT cap interaction"

  - line: "11"
    description: Refund portion from above-cap taxes (not taxable)
    formula: min(Line 1, Line 10)
    testRef: "tests/engine/forms/taxable-refund-worksheet.test.ts::Taxable Refund Worksheet — SALT cap interaction"

  - line: "13"
    description: Taxable refund (with SALT cap adjustment)
    formula: min(Line 7, Line 1 - Line 11)
    note: Final taxable refund when SALT cap adjustment applies
    testRef: "tests/engine/forms/taxable-refund-worksheet.test.ts::Taxable Refund Worksheet — SALT cap interaction"

  - line: "MFS"
    description: MFS filing status uses $5,000 SALT cap instead of $10,000
    formula: saltCap = $5,000 when priorYearFilingStatus = married_filing_separately
    reference: IRC §164(b)(6)
    testRef: "tests/engine/forms/taxable-refund-worksheet.test.ts::Taxable Refund Worksheet — MFS filing status"

result:
  taxableRefund: min(Line 13 or Line 7 if no SALT cap adjustment needed, sales_tax_alt_cap when provided)
  flowsTo: Schedule 1 Line 1

edge_cases:
  - description: Taxpayer took standard deduction in prior year
    result: Refund is not taxable
    test: priorYearItemized = false → taxableRefund = 0

  - description: Itemized but barely above standard deduction
    result: Only the excess is potentially taxable
    test: itemized $15,000 with $14,600 standard → max taxable = $400

  - description: SALT cap fully protects the refund
    result: Refund is not taxable
    example: Paid $18,000 SALT, cap $10,000, refund $5,000 → excess over cap = $8,000 ≥ refund → taxable = 0

  - description: SALT cap partially protects the refund
    result: Only the portion that affected the deduction is taxable
    example: Paid $13,000 SALT, cap $10,000, refund $5,000 → excess $3,000 protected, $2,000 could affect deduction

  - description: MFS filing status uses $5,000 SALT cap
    result: Lower cap means less protection
    test: MFS with $8,000 SALT paid → only $3,000 excess protected

  - description: Alternative sales-tax deduction would have produced nearly the same benefit
    result: Taxable refund is capped at the excess of the chosen income-tax deduction over the sales-tax deduction that could have been claimed instead
    example: Income-tax deduction $10,000, alternative sales-tax deduction $9,000, refund $2,500 → max taxable refund $1,000

  - description: Multiple 1099-G forms from different states
    result: Box 2 amounts are aggregated
    test: Two 1099-Gs with $2,000 and $1,500 → total refund $3,500

  - description: Zero refund amount
    result: Trivially not taxable
    test: All 1099-G Box 2 = 0 → taxableRefund = 0

  - description: Itemized exactly equal to standard deduction
    result: No tax benefit from itemizing → refund not taxable
    test: itemized $14,600 with $14,600 standard → Line 6 = 0 → taxableRefund = 0
