form: "Form8815 return integration"
fullName: "Actual savings-bond statements, education costs and MAGI"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-pdf/f8815.pdf"
notes: "Final2025 instructions and independently indexed2026 thresholds. Production2026 remains incomplete and unqualified."
lines:
  - line: "source-year"
    description: "Pass actual tax year and source facts into Form8815"
    formula: "Use actual bond history and coordinated education facts; apply the return-year thresholds, never the module historical default"
    testRef: "tests/engine/federal-bond-source-integration.test.ts::uses actual source facts and the return year for bond exclusion"
  - line: "previous-interest"
    description: "Remove only actual prior interest included in current statements"
    formula: "ScheduleB interest = grossBox1 + grossBox3 minus confirmed priorYearInterestIncludedInCurrentStatements. Adjustment cannot exceed actual Box3 or prior reported interest in source histories. Apply current exclusion once and reject any verified exclusion above remaining Box3."
    irsRef: "ScheduleB instructions US savings bonds; Form8815 line6 worksheet"
    testRef: "tests/engine/federal-bond-source-integration.test.ts::reconciles previously reported interest once before the current exclusion"
  - line: "magi-source"
    description: "Apply actual territory and royalty worksheet adjustments"
    formula: "Pre-exclusionAGI plus actual studentloan deduction, net2555lines45and50, adoption exclusion, AmericanSamoa and PuertoRico exclusions, plus signed actual pre-exclusion royalty deduction adjustment. Verified facts require known finite values; territory exclusions cannot be negative."
    testRef: "tests/engine/federal-bond-source-integration.test.ts::uses actual territory and signed royalty MAGI adjustments"
