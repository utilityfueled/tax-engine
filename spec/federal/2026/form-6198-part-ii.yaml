form: "Form 6198 Part II ordinary partnership workpaper"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i6198"
references:
  - "https://www.irs.gov/pub/irs-pdf/f6198.pdf"
  - "https://www.irs.gov/instructions/i6198"
  - "https://www.irs.gov/instructions/i1065sk1"
  - "https://uscode.house.gov/us/usc/t26/s465"
lines:
  - line: "6-7-9-originals"
    description: "Bind the simplified method to the actual ordinary partnership activity"
    formula: >-
      Require a single matching current partnership statement for the same
      owner (name and tax ID suffix), tax year, activity name and EIN, with an original K-1 reference,
      opening adjusted basis workpaper and complete current Part II workpaper.
      Match the actual Box 1 loss and opening adjusted basis to the canonical
      input. Require explicit known amounts, including zero, for the opening
      adjusted basis on the first day of the year and Part II increases and
      decreases. Confirm one ordinary nonpassive activity with no prior
      at-risk losses, recapture or Part III method. Require known zero for
      the unsupported QBI and self-employment amounts. Hold
      competing sources or unsupported activity composition and never fill
      in missing evidence.
    testRef: "tests/engine/forms/form-6198-part-ii-2026.test.ts::requires actual same-owner K-1, basis and complete Part II records"
    testRefs:
      - "tests/engine/forms/form-6198-part-ii-2026.test.ts::holds duplicate original sources and standalone legacy calculation"
  - line: "outside-basis-first"
    description: "Separate the ordinary partnership outside-basis carry from the at-risk carry"
    formula: >-
      Apply the partnership outside-basis limitation before the at-risk
      limitation. If any Box 1 loss is limited at the basis step, require the
      actual current outside-basis workpaper reference and its basis available
      for losses. Reconcile the original amount to the independently computed
      basis available for losses, including verified zero. Apply the Part II
      amount at risk only to the admitted ordinary loss. Preserve basis-disallowed
      loss solely in the outside-basis carry; at-risk suspension comprises only
      basis-admitted loss that exceeds the amount at risk. An entirely basis-
      disallowed loss creates no at-risk suspension. A supplied current workpaper
      must reconcile even when the full loss passes the basis limitation.
    testRef: "tests/engine/forms/form-6198-part-ii-2026.test.ts::separates original outside-basis and at-risk suspended amounts"
    testRefs:
      - "tests/engine/forms/form-6198-part-ii-2026.test.ts::requires matching current outside-basis proof when any ordinary loss is basis-limited"
      - "tests/engine/forms/form-6198-part-ii-2026.test.ts::keeps an entirely basis-disallowed loss out of the at-risk carry"
  - line: "8-10a-10b-20-21"
    description: "Compute the current Form 6198 limit before the ordinary loss transfer"
    formula: >-
      Use exact Decimal amounts. Line 8 adds opening basis and increases.
      Line 10a subtracts decreases, including amounts in the opening basis
      for which the taxpayer is not at risk. Line 10b is the greater of zero
      or line 10a. Line 20 equals line 10b when the complete original Part II
      workpaper produces a nonnegative line 10a. Limit the already basis-allowed
      ordinary loss to line 20 and retain the difference as suspended at-risk
      loss. Carry the allowed nonpassive loss through Schedule E once. Actual
      line 10a of exactly zero yields zero on lines 10b, 20 and 21 and suspends
      the full loss. Section 465(e) recapture requires a negative amount at risk.
      Hold a negative line 10a for separate recapture or Part III review before
      using the printed line 10b floor. This calculation grants no 2026 filing,
      export or review-form qualification.
    testRef: "tests/engine/forms/form-6198-part-ii-2026.test.ts::transfers the source-backed Form 6198 limit through Schedule E and federal income"
    testRefs:
      - "tests/engine/forms/form-6198-part-ii-2026.test.ts::suspends the full ordinary loss when actual Part II capacity is exactly zero"
      - "tests/engine/forms/form-6198-part-ii-2026.test.ts::holds negative Part II capacity for separate review before the worksheet floor"
  - line: "legacy-source-scope"
    description: "Preserve historical and specialized methods without treating earlier fields as current Part II"
    formula: >-
      Preserve established historical calculations and distinct linked K-1
      source methods. When the regular 2026 loss lane receives distinct
      opening and prior at-risk amounts and a positive decrease, and the
      legacy basis amount also equals the reported opening basis, hold for
      original Part II evidence. An older at-risk balance cannot establish
      the first-day adjusted basis or prove the meaning of line 9. Remain
      compatible with legacy calculations outside that ambiguity. Never
      combine the new Part II source with legacy or manual inputs.
    testRef: "tests/engine/forms/form-6198-part-ii-2026.test.ts::holds the ambiguous regular 2026 legacy worksheet and preserves 2025"
