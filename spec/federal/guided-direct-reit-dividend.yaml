form: "Guided 1099-DIV direct REIT dividend source"
fullName: "Actual qualification facts for one 2026 Box 5 direct REIT distribution"
taxYear: 2026
irsReference: "https://www.ecfr.gov/current/title-26/section-1.199A-3"
lines:
  - line: "2026-direct-reit-source"
    description: "Collect and validate one direct REIT cash distribution"
    formula: "A positive 2026 Box 5 amount requires one confirmed original direct REIT distribution linked to the actual statement account and owner. Retain the reported amount, evidence reference and as-of date, issuer and security, acquisition, ex-dividend, payment and held-through or sale dates, actual diminished-risk days, and the amount subject to a related-payment obligation. Reject future observation and its dependent dates. Reconcile the reported amount with the original statement and let the shared engine resolver determine the eligible portion. Hold missing, mixed, RIC and partial-obligation sources in this bounded path. An explicit unaffected zero and earlier-year behavior remain available."
    irsRef: "26 CFR 1.199A-3(c)(2)(ii); 26 USC 246(c)(3) and (4); IRS Form 1099-DIV Box 5 instructions"
    testRef: "tests/guided-interview/guided-direct-reit-dividend.test.ts::requires confirmed originals and reconciles 2026 Box 5 without rewriting reported income"
  - line: "filing-unit-and-retention"
    description: "Keep a draft editable by its statement owner"
    formula: "Keep blank and false answers distinct from a confirmed zero; save and reopen the dated original facts. Changes to the facts, amount, payer, owner, source year or current return year revoke confirmation and preserve the retained evidence for review."
    irsRef: "26 CFR 1.199A-3(c)(2)(ii); 26 USC 246(c)(3) and (4)"
    testRef: "tests/guided-interview/guided-direct-reit-dividend.test.ts::retains actual zero and false on reopen and invalidates edited source evidence"
  - line: "statement-identity"
    description: "Reject a second copy of the same direct dividend event"
    formula: "Apply the shared statement identity check to all qualified direct dividend records on the return using an unambiguous actual account reference, owner, security and ex-dividend date. Reject masked references and short numeric suffixes. A stable private label can identify the account without entering a full account number. Ignore account formatting, evidence label and payer aliases when matching the same dividend. Separate actual accounts remain distinct."
    irsRef: "26 CFR 1.199A-3(c)(2); IRS Form 1099-DIV Box 5 instructions"
    testRef: "tests/guided-interview/guided-direct-reit-dividend.test.ts::requires an actual account and rejects aliases of the same dividend across statements"
