form: "Crypto Charitable Source Worksheet"
fullName: "Digital asset contributions before Schedule A percentage limits"
taxYear: 2026
irsReference: "https://www.irs.gov/individuals/international-taxpayers/frequently-asked-questions-on-digital-asset-transactions"
retrievedAt: "2026-10-25"
notes: "Q78/Q79; Pub526 property valuation and recipient categories; IRC170(b)(1)(I) 2026 floor. Calculation does not qualify Form8283 or substitute for actual substantiation."
lines:
  - line: "value"
    description: "Actual property value and holding period"
    formula: "For a qualified public charity, capital assets held more than one calendar year use FMV. Other property uses min(FMV,basis). Capital gain crypto to second-category foundations requires basis reduction but retains the20% category. Loss property is not capital-gain property. Known unqualified recipients receive zero. No realized capital loss is created. Validate actual dates/year and amounts."
    testRef: "tests/engine/federal-crypto-charity.test.ts::values gifts before limitations using actual property facts"
  - line: "source"
    description: "Missing current-year qualification remains unknown"
    formula: "2026 or source-confirmed gifts require actual recipient category, capital-asset status, full ownership gift with no goods/services, and completed substantiation/appraisal requirements. A known false qualified-organization answer produces no deduction."
    testRef: "tests/engine/federal-crypto-charity.test.ts::preserves unknown qualification and rejects incomplete current sources"
  - line: "limits"
    description: "One combined Schedule A category calculation"
    formula: "Combine crypto property with direct and K1 gifts before percentage limits; never add the tentative property value after ScheduleA. Preserve actual category carryforwards. Crypto is not cash for the nonitemizer deduction."
    testRef: "tests/engine/federal-crypto-charity.test.ts::applies shared percentage limits and the 2026 floor once"
  - line: "historical"
    description: "2025 current-contribution ordering"
    formula: "Use Pub526 Worksheet2 current-year categories before any 2026 floor. Cash limit60%, ordinary public property50% less cash, private ordinary30% limited by all public current gifts, public capital property30% and50% less public noncapital gifts, private capital20% with remaining50% and both30% ceilings. Historical carryover needs its actual source categories."
    testRef: "tests/engine/federal-crypto-charity.test.ts::uses the final 2025 category ordering without a 2026 floor"
