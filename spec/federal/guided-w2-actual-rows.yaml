form: "Guided-W2-Actual-Rows"
fullName: "Actual multistate W2 rows in shared interview paths"
taxYear: 2026
reference: "https://www.irs.gov/instructions/iw2w3"
notes: "Actual2025/2026 source transport; does not open federal2026 or filing gates."
lines:
  - line: "retain"
    description: "guided bridge retains actual source rows and local first-row facts"
    formula: "Retain actual complete source packet and optional local first-row original fields; no additional federal original or inferred zero."
    testRef: "tests/guided-interview/w2-actual-paths.test.ts::guided bridge retains actual source rows and local first-row facts"
  - line: "roundtrip"
    description: "guided saved multistate W2 produces one federal wage and exact SALT total"
    formula: "JSON reopen preserves source facts; one50000 wage and5000 federal withholding; actual state1535+1000 andlocal1875+1250 total5660."
    testRef: "tests/guided-interview/w2-actual-paths.test.ts::guided saved multistate W2 produces one federal wage and exact SALT total"
  - line: "edit"
    description: "guided W2 amount edit invalidates source confirmation without replacing originals"
    formula: "An original value change clears the confirmation while retaining raw rows and the previous original; no source auto-refresh."
    testRef: "tests/guided-interview/w2-actual-paths.test.ts::guided W2 amount edit invalidates source confirmation without replacing originals"
  - line: "owner"
    description: "guided owner edit invalidates W2 source confirmation and no-op retains it"
    formula: "A changed personal original invalidates confirmation; unchanged source values retain it."
    testRef: "tests/guided-interview/w2-actual-paths.test.ts::guided owner edit invalidates W2 source confirmation and no-op retains it"
  - line: "navigation"
    description: "guided multistate navigation requires complete confirmed actual rows"
    formula: "Multiple actual state rows use the source contract; absent or unknown confirmation remains incomplete."
    testRef: "tests/guided-interview/w2-actual-paths.test.ts::guided multistate navigation requires complete confirmed actual rows"
  - line: "confirm-only"
    description: "guided W2 confirmation context never makes unconfirmed facts calculation ready"
    formula: "A typed W2/owner-only source context may provide actual originals for explicit confirmation while the return bridge remains unavailable; it cannot supply an incomplete authoritative return. No tax-year guess or changed source facts."
    testRef: "tests/guided-interview/w2-actual-paths.test.ts::guided W2 confirmation context never makes unconfirmed facts calculation ready"
  - line: "unknown"
    description: "guided source-only incomplete W2 is retained for review"
    formula: "Retain a present source draft even when no federal amount has been entered; it must not disappear or become zero."
    testRef: "tests/guided-interview/w2-actual-paths.test.ts::guided source-only incomplete W2 is retained for review"
  - line: "panel"
    description: "shared W2 panel exposes and retains actual source collector"
    formula: "Render the existing collector in each real W2 card; actual row controls change the saved per-entry packet, preserving unknown and requiring explicit confirmation."
    testRef: "tests/apps/web/guided-w2-actual-panel.test.tsx::shared W2 panel exposes and retains actual source collector"
  - line: "unknown-box12"
    description: "guided actual W2 source context never fills unknown modeled Box12 codes with zero"
    formula: "Before parsing a source confirmation, require actual modeled original Box12 amounts W/D/E/F/G/H/S/AA/BB/EE/T; missing is unknown, not the historical legacy-schema zero default."
    testRef: "tests/guided-interview/w2-actual-paths.test.ts::guided actual W2 source context never fills unknown modeled Box12 codes with zero"
  - line: "positive-box12"
    description: "guided actual W2 retains a reported positive modeled Box12 amount"
    formula: "Retain actual123.45 codeD exactly; do not replace it with0 or deduct it again from reported federal Box1."
    testRef: "tests/guided-interview/w2-actual-paths.test.ts::guided actual W2 retains a reported positive modeled Box12 amount"
  - line: "box12-panel"
    description: "shared W2 packet collects actual modeled Box12 amounts without zero defaults"
    formula: "Expose actual modeled code amounts when collecting original-source rows; preserve blank as unknown and require actual edits to be confirmed."
    testRef: "tests/apps/web/guided-w2-actual-panel.test.tsx::shared W2 packet collects actual modeled Box12 amounts without zero defaults"
  - line: "unknown-box8"
    description: "Actual Box8 original must be known before source confirmation"
    formula: "A missing original allocated-tip amount remains unknown; require actual checked zero or reported amount, without inventing income."
    testRef: "tests/guided-interview/w2-actual-paths.test.ts::guided actual W2 packet requires a known allocated-tip original"
