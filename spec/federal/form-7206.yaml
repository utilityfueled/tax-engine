form: "Form 7206"
fullName: "Actual self-employed health insurance sources and per-business income limits"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i7206"
notes: |
  Refreshed 2026-10-25 against final 2025 Form7206 and instructions, IRC162(l),
  IRC213(d)(10), RevProc2024-40 section2.28 and RevProc2025-32 section4.27.
  This is a source-backed calculation; the final2026 physical form is not qualified.
  Actual monthly premium amounts replace uniform annual-month proration. The
  core receives canonical owner/business income and deductions from the return,
  never user profit overrides. Missing canonical context leaves calculation incomplete.
  Marketplace/PTC coordination requires the separate Pub974 calculation; clergy
  special rules likewise require their actual worksheet rather than guessed eligibility.
lines:
  - line: "source"
    description: "Conserve actual plans, premium records and covered persons"
    formula: "Require actual source year/reference/confirmation, all-plan completeness, owner/business links, plan qualifications, covered-person identities/relationships and original payment shares. Each original premium equals amounts paid by this owner or business plus others; person allocations sum to the owner/business amount. Source IDs are unique. Unknown is not zero."
    irsRef: "IRC162(l); Instructions7206 Purpose and Limitations"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::conserves actual premium sources and rejects unknown or contradictory facts"
  - line: "1"
    description: "Actual eligible medical dental vision and voluntary Medicare premiums"
    formula: "Sum actually paid qualified coverage for eligible persons and months. Subtract actual distinct public-safety-officer excluded payments and other tax-free funding. Exclude a month if the owner could participate in a subsidized medical plan at any time, including applicable spouse/dependent/child employers. Do not divide an annual total uniformly across months."
    irsRef: "Form7206 line1; Instructions7206 Other coverage"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::uses actual monthly costs and distinct funded amounts instead of annual proration"
  - line: "2"
    description: "Qualified long-term-care premiums with one annual cap per person"
    formula: "Apply the separate actual LTC employer-plan eligibility by month. Across all businesses, eligible premiums per person cannot exceed the selected year's attained-age cap. When several businesses compete for a cap, require an actual source allocation rather than choose a favorable business automatically."
    irsRef: "Form7206 line2; Instructions7206 More than one health plan and business; RP2024-40 section2.28; RP2025-32 section4.27"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::applies one actual person LTC limit across plans and requires competing business allocation"
  - line: "1-officer-source"
    description: "Reconcile excluded premiums to the actual retired officer"
    formula: "A positive public-safety-officer exclusion requires its actual primary or spouse pension owner, who may differ from the business owner or covered person. Apply the3000 annual exclusion boundary per actual officer rather than once per business or once per joint return."
    irsRef: "IRC402(l); Form7206 line1; Instructions7206 Limitations"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::attributes public safety exclusions to the actual retired officer instead of the business owner"
  - line: "3"
    description: "Eligible premiums for this owner and business"
    formula: "Line1 plus line2, grouping plans under the same actual owner/business without duplicating the business income limit."
    irsRef: "Form7206 lines3 and note above line1"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::groups same-business plans and separates owners and business limits"
  - line: "4"
    description: "Actual income from the business that established the plan"
    formula: "Use canonical source net profit and other eligible earned income, excluding SE-exempt CRP. If the optional SE method applies, use the actual source amount attributable from ScheduleSE4b. S-corporation sources skip to line11."
    irsRef: "Form7206 line4 and footnotes"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::uses canonical business allocation and actual foreign retirement and S corporation amounts"
  - line: "5"
    description: "Same owner's positive business income"
    formula: "Use canonical total positive C/F/K1 and other eligible SE-business source income, excluding losses and exempt CRP. Do not include the other spouse's income."
    irsRef: "Form7206 line5"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::groups same-business plans and separates owners and business limits"
  - line: "6"
    description: "Business share of positive owner income"
    formula: "Line4 divided by line5 using Decimal. A nonpositive source income has no earned-income limit; no favorable division by zero is substituted."
    irsRef: "Form7206 line6"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::uses canonical business allocation and actual foreign retirement and S corporation amounts"
  - line: "7"
    description: "Allocated deductible self-employment tax"
    formula: "Actual same-owner Schedule1 line15 multiplied by line6."
    irsRef: "Form7206 line7"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::uses canonical business allocation and actual foreign retirement and S corporation amounts"
  - line: "8"
    description: "Business income after allocated SE deduction"
    formula: "Line4 minus line7."
    irsRef: "Form7206 line8"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::uses canonical business allocation and actual foreign retirement and S corporation amounts"
  - line: "9"
    description: "Retirement deduction attributable to this business"
    formula: "Use actual allowed same-business Schedule1 line16 from canonical source allocation. Missing attribution is not zero."
    irsRef: "Form7206 line9"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::requires canonical income sources before reporting a deduction"
  - line: "10"
    description: "Income after retirement deduction"
    formula: "Line8 minus line9."
    irsRef: "Form7206 line10"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::uses canonical business allocation and actual foreign retirement and S corporation amounts"
  - line: "11"
    description: "Actual more-than-two-percent S corporation Medicare wages"
    formula: "Use the bound actual W2 Box5 source for the qualifying S corporation. Require the actual ownership, reimbursement and wage inclusion establishment conditions."
    irsRef: "Form7206 line11; Instructions7206 plan establishment"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::enforces actual partner and shareholder establishment without inferring wage inclusion"
  - line: "payer-establishment"
    description: "Separate actual personally paid and business-paid premium shares"
    formula: "For a partnership-held policy, the partner's actual after-tax paid share can qualify without guaranteed-payment income. A partnership-paid/reimbursed share requires actual guaranteed-payment inclusion. An individually held partner policy requires partnership payment/reimbursement and inclusion. An Scorp share requires corporate payment/reimbursement and actual Box1 inclusion under Notice2008-1 regardless of policy name. Each actual person/payer share reconciles to the original source."
    irsRef: "Instructions7206 plan establishment; Notice2008-1; IRS S corporation compensation and medical insurance issues"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::distinguishes partnership policy ownership and actual premium payers"
  - line: "12"
    description: "Actual attributable foreign income exclusion"
    formula: "Use the amount of Form2555 line45 attributable to line4 or line11; never the full household foreign exclusion by default."
    irsRef: "Form7206 line12"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::uses canonical business allocation and actual foreign retirement and S corporation amounts"
  - line: "13"
    description: "Available income limit"
    formula: "Line10 or line11 minus line12; floor the deduction's available limit at zero."
    irsRef: "Form7206 line13; IRC162(l)(2)(A)"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::groups same-business plans and separates owners and business limits"
  - line: "14"
    description: "Deduction with exact source cents preserved"
    formula: "For each actual owner/business, min(line3,max(0,line13)); sum once into Schedule1 line17. Do not reduce SE earnings. Retain eligible premium excess as a review amount, without automatically asserting ScheduleA qualification or double deducting allowed premiums."
    irsRef: "Form7206 line14; Instructions7206 Effects on itemized deductions and SE tax"
    testRef: "tests/engine/forms/form-7206-sources.test.ts::preserves exact large source amounts and known ineligibility without silent defaults"
