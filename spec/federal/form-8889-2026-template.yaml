form: "Form 8889 final 2026 physical candidate"
fullName: "Final 2026 Health Savings Accounts (HSAs) physical field source contract"
taxYear: 2026
reference: "https://www.irs.gov/pub/irs-prior/f8889--2026.pdf"
revision: "Created 4/30/26, IRS final index posted 11/18/2026"
retrievedAt: "2026-11-19T05:03:41Z"
notes: |
  The archived annual PDF and the current IRS final PDF matched byte for byte.
  The IRS current instructions endpoint served 2025 instructions at retrieval.
  The separately published 2026 instructions were a draft. The internal
  candidate uses only established calculation logic and the final printed
  form for the ordinary case below. The exact blank is required at render time.
  The public export and filing gates stay closed.
lines:
  - line: "revision"
    description: "Pin the official final annual source"
    formula: "Require SHA-256 e206d84f0ce3b2a4add7a97e5de8f873b11bd0a16e34e7cd98f9c4dcc87a178d, 70785 bytes, one letter-size page, annual PDF title and printed Created 4/30/26."
    testRef: "tests/pdf/form-8889-2026-candidate.test.ts::pins the exact final annual source"
  - line: "physical-locations"
    description: "Map every terminal field and page widget"
    formula: >-
      Require 27 unique fields with one page-one widget apiece. Match the
      fully qualified names, exact widget rectangle, type and original native
      on-state for the two header fields, 22 amount fields and three checkboxes.
      Self-only and family boxes use /1 and /2 respectively. The line 17a
      exception box uses /1. All three start at /Off.
    testRef: "tests/pdf/form-8889-2026-candidate.test.ts::matches every leaf and page widget to its printed location"
  - line: "annual-printed-references"
    description: "Record annual line 3 limits and the printed downstream destinations"
    formula: >-
      For the printed full-year, same-coverage case under age 55, line 3 lists
      $4,400 for self-only coverage and $8,750 for family coverage. Lines 16
      and 20 reference Schedule 1 line 8f. Line 17b references Schedule 2
      line 13c and line 21 references Schedule 2 line 13d.
    testRef: "tests/pdf/form-8889-2026-candidate.test.ts::records the final printed limits and transfer destinations"
  - line: "saved-diagnostics"
    description: "Reopen marked synthetic diagnostic specimens"
    formula: >-
      Retain every diagnostic text value with a nonempty appearance, including
      zero and whole-dollar amounts. Verify both coverage options and the
      line 17a exception in on and off states in field values and appearances.
      Use a fictional header and a redacted identifier. Retain the review
      notice on the page.
    testRef: "tests/pdf/form-8889-2026-candidate.test.ts::round-trips diagnostic amounts and checkbox states"
  - line: "1–13 ordinary contributions"
    description: "Bind the current confirmed owner, full-year eligibility, and actual contribution totals"
    formula: >-
      Require an explicit 2026 source confirmation for one owner under 55 at
      year-end and twelve eligible months of the same self-only or family
      coverage. The confirmation covers the ordinary case, including no Archer
      MSA, funding distribution, excess, testing-period recapture, or special
      allocation. Reconcile the actual owner contribution total with the
      worksheet and the employer total with current, attributed W-2 box 12
      code W. Hold over-limit totals and conflicting worksheet or support facts.
      Lines 3, 5, 6, and 8 use the printed annual limit; lines 9 and 11 use
      the employer total; line 12 subtracts line 11 from line 8; line 13 is
      the lesser of lines 2 and 12. Do not populate inapplicable line 7.
    irsRef: "https://www.irs.gov/pub/irs-prior/f8889--2026.pdf"
    testRef: "tests/pdf/form-8889-2026-candidate.test.ts::renders ordinary contributions and partly taxable distributions"
  - line: "14a–17b ordinary distributions"
    description: "Bind dated ordinary Form 1099-SA originals and qualified HSA payments"
    formula: >-
      Require explicitly attributed 2026 code 1 HSA originals with positive
      gross distributions and no special distribution facts. Reconcile the
      confirmed gross amount to Box 1 totals and the confirmed qualified HSA
      payments to the worksheet. Qualified payments are between zero and gross.
      Lines 14a and 14c equal gross, line 14b is zero, line 15 is the qualified
      amount, line 16 is their difference and line 17b is twenty percent of
      line 16. Line 17a is unchecked. Round computed amounts for display only.
      Leave identification and inapplicable Part III fields blank; mark the
      internal document for review. A blank with a different digest is rejected.
    irsRef: "https://www.irs.gov/pub/irs-prior/f8889--2026.pdf"
    testRef: "tests/pdf/form-8889-2026-candidate.test.ts::renders a fully qualified family distribution as an explicit zero"
  - line: "16 displayed reconciliation"
    description: "Reconcile the three displayed whole-dollar distribution amounts"
    formula: >-
      Keep the exact calculation from confirmed original cents. Round each
      computed amount for display as before. Reject the internal specimen when
      displayed line 16 differs from displayed line 14c less displayed line
      15, floored at zero. Accept coherent cents and whole-dollar originals.
      This validation does not change the exact calculation or transfer.
    irsRef: "https://www.irs.gov/pub/irs-prior/f8889--2026.pdf"
    testRef: "tests/pdf/form-8889-2026-candidate.test.ts::reconciles the displayed line 16 without changing exact HSA amounts"
  - line: "ordinary source stops"
    description: "Reject unknown, unsupported or conflicting facts before rendering"
    formula: >-
      Hold missing confirmations, missing contribution or qualified-payment
      amounts, owner or year mismatches, ineligible or changing coverage,
      nonordinary activities, incomplete distributions and the incorrect blank.
      An owner born after January 1 cannot meet actual January first-day
      eligibility even with a full-year confirmation.
    irsRef: "IRC 223(c)(1); Publication 969, Qualifying for an HSA Contribution, https://www.irs.gov/publications/p969"
    testRef: "tests/pdf/form-8889-2026-candidate.test.ts::rejects unknown and unsupported ordinary candidate facts"
  - line: "closed-exports"
    description: "Keep review and filing gates closed for 2026"
    formula: >-
      Require an independent review before qualifying the annual form.
      Reject the 2026 bytes in the historical 2025 slot, the 2025 bytes in the
      2026 slot, and mismatched input and calculation years; keep the existing
      2025 review pin and the 2026 review and filing gates in effect.
    testRef: "tests/pdf/form-8889-2026-candidate.test.ts::keeps the annual and historical export gates in effect"
