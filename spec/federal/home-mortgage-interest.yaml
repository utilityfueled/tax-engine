form: "Pub936 Table1"
fullName: "Home mortgage interest source worksheet"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p936"
notes: "Final2025 Publication936 and enacted permanent section163(h) debt limits. Source-backed calculation is not independent tax review or filing qualification. Historical aggregate preview remains explicitly unverified."
lines:
  - line: "source"
    description: "Bind each actual loan and preserve unknown Form1098 facts"
    formula: "Require matching source year/reference, all-home-debt confirmation and unique loan/source links; actual return-paid interest plus other-person-paid interest reconciles to Box1, actual current points plus other-person points to Box6. Box4 is prior-year recovery, not a current-interest reduction. No Box2 balance proxy on verified paths."
    irsRef: "Pub936 PartI; Form1098 boxes1-4/6; ScheduleA instructions8a-8c"
    testRef: "tests/engine/forms/home-mortgage-interest.test.ts::binds actual loan sources and rejects unknown or contradictory source amounts"
  - line: "average"
    description: "Use actual average-balance sources"
    formula: "Highest balance; lender average; sum actual monthly balances / actual qualified-home months; (first+last)/2 only with no extra borrowing/no more than one month prepayment/level payments; current-year interest / lowest annual rate only when secured all year and paid at least monthly. Mixed/refinanced category sources require an actual completed allocation worksheet."
    irsRef: "Pub936 Table1 instructions Average Mortgage Balance"
    testRef: "tests/engine/forms/home-mortgage-interest.test.ts::uses published average balance methods instead of Form1098 Box2"
  - line: "average-source-reconciliation"
    description: "Bind the interest-rate numerator to actual current-year interest"
    formula: "Numerator equals return-paid plus other-person-paid current-year interest, less each payer current-year refund, plus actual current-year interest prepaid by each payer in an earlier year. Prior-paid return share also enters the deductible-interest source once; other-person share never enters this return deduction. Unknown source allocations and contradictory numerators reject."
    irsRef: "Pub936 Interest paid divided by interest rate worksheet line1; Prepaid interest; More than one borrower"
    testRef: "tests/engine/forms/home-mortgage-interest.test.ts::reconciles the interest-rate numerator to actual payer and prepayment sources"
  - line: "1-6"
    description: "Grandfathered and older acquisition debt"
    formula: "1=average debt incurred on/before1987-10-13;2=average acquisition debt after1987-10-13 and before2017-12-16;3=1000000 (500000MFS);4=max(1,3);5=1+2;6=min(4,5). Actual qualifying binding-contract transition retains old acquisition classification."
    irsRef: "Pub936 Table1 lines1-6 and Home Acquisition Debt exceptions"
    testRef: "tests/engine/forms/home-mortgage-interest.test.ts::uses the actual December15 boundary and uncapped grandfathered debt"
  - line: "7-11"
    description: "New acquisition debt and combined qualified limit"
    formula: "If no new acquisition debt or6>=750000 (375000MFS),11=6;otherwise7=average newer acquisition debt;8=750000 (375000MFS);9=max(6,8);10=6+7;11=min(9,10)."
    irsRef: "Pub936 Table1 lines7-11; IRC163(h)(3)"
    testRef: "tests/engine/forms/home-mortgage-interest.test.ts::applies the combined loan limit and three decimal ratio to interest and points"
  - line: "12-16"
    description: "Deductible interest and separate non-home interest"
    formula: "12=sum qualified debt averages1+2+7;13=rounded actual interest attributable to those debts excluding points/PMI;14=min(1,11/12) rounded to3decimals;15=13*14 rounded to dollar;16=13-15. Do not invent allocation of disallowed interest to other schedules. Qualified source components reconcile to the same aggregate deduction."
    irsRef: "Pub936 Table1 lines12-16 and mixed-use source instructions"
    testRef: "tests/engine/forms/home-mortgage-interest.test.ts::applies the combined loan limit and three decimal ratio to interest and points"
  - line: "points"
    description: "Current-purchase, improvement, ratable and remaining points"
    formula: "Current-year full points require actual applicable FigureB tests and election; ratable points require cash method, secured home, term<=30years, comparable terms when>10years, principal<=250000 or points<=4/6 by15year boundary, and actual payments/term. Actual completed amortization sources retain prior balances and current allowed amount; no service fees. Apply Table1 ratio to allowed current points. Reported points enter8a; unreported/amortized prior points enter8c."
    irsRef: "Pub936 Points, FigureB, Deduction Allowed Ratably and Table1line13 instructions"
    testRef: "tests/engine/forms/home-mortgage-interest.test.ts::implements the published ratable points example and actual current purchase qualification"
  - line: "recovery"
    description: "Separate prior-year interest tax-benefit recovery"
    formula: "Each actual Box4 recovery reconciles by source and origin year; include only actual completed tax-benefit worksheet taxable amount on Schedule1line8z, subtracting an already-included amount only when bound to an actual1099MISC Box3 source without exceeding it. Same-year refund reduces current eligible interest; prior-year refund does not."
    irsRef: "Pub936 Refunds of interest; Pub525 Recoveries"
    testRef: "tests/engine/forms/home-mortgage-interest.test.ts::separates current-year refunds from actual prior-year taxable recoveries"
  - line: "8a-8e"
    description: "Canonical ScheduleA mortgage classification"
    formula: "8a=allowed interest and current points reported on1098;8b=allowed interest not reported;8c=allowed points not reported/current amortization;8e=8a+8b+8c+applicable PMI8d. Result retains interest-only and points separately without double counting."
    irsRef: "Final2025 ScheduleA8a-8e;2026 statutory PMI restoration"
    testRef: "tests/engine/forms/home-mortgage-interest.test.ts::routes actual reported and unreported amounts into canonical ScheduleA lines"
  - line: "review-pdf"
    description: "Copy and reconcile unique audited mortgage lines"
    formula: "The reference mapper copies unique8a/8b/8c/8d/8e/10 and reconciles with retained source calculation; no raw1098 point re-addition and no guessed unreported lender information."
    irsRef: "Final2025 ScheduleA8a-10"
    testRef: "tests/pdf/fill-schedule-a-mortgage-sources.test.ts::copies source-qualified mortgage audits and rejects tampered interest lines"
