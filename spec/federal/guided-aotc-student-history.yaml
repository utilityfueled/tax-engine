form: "Guided AOTC student claim history"
fullName: "American Opportunity Tax Credit prior claims by student"
reference: "https://www.irs.gov/instructions/i8863"
notes: |
  Form 8863, Student qualifications requirement 2 and Part III line 23, counts
  the student's distinct prior tax years claimed by anyone. The published
  Sharon and Wilbert examples show that a change of claimant does not reset
  the student's history. The 2026 draft instructions repeat this rule at
  https://www.irs.gov/pub/irs-dft/i8863--dft.pdf. This spec governs guided
  history and dependent student identity facts.
lines:
  - line: "dependent-student-tin-2025"
    description: "Reconcile explicit 2025 dependent AOTC and ODC timely TIN answers"
    formula: "For positive AOTC expenses and an actual same-dependent TIN on a 2025 return, hold a student's affirmative timely issuance answer when the active Credit for Other Dependents answer explicitly denies timely TIN eligibility. A timely ITIN or ATIN application can count as timely issuance for ODC, so a positive ODC answer can coexist with a negative AOTC answer. Keep exact zero, unanswered and unrelated facts unchanged. Do not expose identifiers in validation feedback."
    irsRef: "2025 Form 8863 instructions, Taxpayer identification number needed by due date of return; https://www.irs.gov/pub/irs-prior/i8863--2025.pdf#page=1; 2025 Schedule 8812 instructions, Dependent required to have a TIN; https://www.irs.gov/pub/irs-prior/i1040s8--2025.pdf#page=2"
    testRef: "tests/guided-interview/guided-aotc-student-history.test.ts::holds the same dependent's conflicting 2025 AOTC and ODC timely TIN answers after reopen"
  - line: "student-identity"
    description: "Reconfirm prior AOTC claim history when the student changes"
    formula: "Bind the prior-claim answer and student credit sources to the actual normalized student TIN. An edit that assigns an answered row to a different or newly identified student retains the old answers for review but requires a fresh claim-count selection and separate confirmation of that student's actual education sources. Retained expenses, institution and 1098-T evidence, timely identification, enrollment, completed education and conviction answers are not sufficient until reviewed for the identified student. A rejected or unconfirmed answer cannot supply a zero or a credit to Form 8863."
    testRef: "tests/guided-interview/guided-aotc-student-history.test.ts::blocks reuse of a different student's zero before federal calculation"
  - line: "saved-replay"
    description: "Preserve applicable and pending student history"
    formula: "Preserve the same student's answers across TIN formatting, unrelated edits, remaining-row shifts and saved-interview replay. A prior-claim or source review stays pending after replay. A replacement row for the same student that omits the existing source-review status inherits it. Changing a substantive student source revokes its explicit review; formatting a currency value or editing an independent claim count does not. When an older saved row already requires its claim history reviewed, also require review of its student sources. Retain the unversioned prefilled-zero and retirement-code checks and existing EIC source evidence. Explicitly reselect the count and confirm actual student sources to restore the ordinary Form 8863 path."
    testRef: "tests/guided-interview/guided-aotc-student-history.test.ts::preserves unchanged student facts and pending confirmations through saved replay"
  - line: "return-year"
    description: "Reconfirm AOTC sources when the selected return year changes"
    formula: "Part III claim count refers to years before this return, enrollment and net costs to this return's qualifying academic periods, and completed education and convictions to its own cutoff dates. After the selected tax year changes, keep each entered AOTC student's answers visible for review and require a fresh claim-count selection and confirmation of the actual sources for that year. Do not assume an intervening claim or reuse a confirmed answer from another selected year. The guided-input LLC return-year rule governs LLC rows. Preserve EIC and retirement entries."
    testRef: "tests/guided-interview/guided-aotc-student-history.test.ts::requires new AOTC evidence when the return year changes"
    testRefs:
      - "tests/apps/web/guided-aotc-student-history.test.tsx::requires current student sources in the real interview after identity or year edits"
  - line: "claimant-return-year"
    description: "Collect current-year AOTC-specific claimant answers after a selected-year change"
    formula: "Form 8863 eligibility depends on whether a prior-disallowance ban is in effect and whether Form 8862 is required and complete for the selected return. Refundability depends on actual claimant enrollment, earned income, support and parent-alive facts for that year when applicable. Clear the saved AOTC-only claimant answers and legacy refundable answer when the selected year changes, including when the user previously removed all AOTC rows. Require actual answers for the selected return where applicable. Preserve EIC and retirement entries."
    testRef: "tests/guided-interview/guided-aotc-student-history.test.ts::requires actual claimant AOTC answers for the changed return year"
  - line: "shared-claimant-return-year"
    description: "Collect shared Form 8863 claimant facts for the selected return year"
    formula: >-
      On a return-year change, reset saved claimant timely SSN and TIN, dependency claim and claimability, nonresident status and election, and education MAGI income exclusion. Apply the reset to AOTC-only interviews, including those with retained AOTC answers after the students are removed. Keep the selected return year and the student records for review. Hold guided federal calculation until the applicable facts are answered for the selected year. A same-year selection and a saved reopen preserve the current answers and pending review. The separate student-loan dependency review applies where there are no retained education credit sources.
    irsRef: "2025 Form 8863 instructions, Who Can Claim an Education Credit and Who Cannot Claim an Education Credit; https://www.irs.gov/pub/irs-prior/i8863--2025.pdf; 2026 draft Form 8863 instructions, TIN needed by due date of return; https://www.irs.gov/pub/irs-dft/i8863--dft.pdf"
    testRef: "tests/guided-interview/guided-aotc-student-history.test.ts::rechecks shared claim facts after an AOTC-only saved year change"
  - line: "saved-aotc-claimant-year"
    description: "Review unbound Form 8863 claimant facts for the selected tax year"
    formula: >-
      For positive entered AOTC student expenses, including on a return with LLC students, retain legacy claimant answers for review. Hold guided federal input until the user explicitly confirms the claimant facts for the selected tax year. A draft, backup, or server request without that confirmation does not establish the answer year. Save the year of the explicit confirmation and preserve it across ordinary reopen. Clear it when the tax year, substantive claimant answers, or the identity of the claimant or joint spouse changes. Identifier formatting alone preserves confirmation. Preserve zero and pending amounts. This is a guided questionnaire requirement and does not change direct canonical Form 8863 calculation or student loan dependency rules.
    testRef: "tests/guided-interview/guided-aotc-student-history.test.ts::requires explicit selected-year claimant review for a legacy positive AOTC draft"
    testRefs:
      - "tests/apps/web/guided-aotc-student-history.test.tsx::confirms the saved AOTC claimant answers for the visible tax year"
      - "tests/apps/web/workspace-filled-return.test.ts::calculates education using complete identity before redacting every student page"
      - "tests/guided-interview/guided-aotc-student-history.test.ts::does not reuse claimant review for a different taxpayer in the same year"
