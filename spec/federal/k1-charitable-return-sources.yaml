form: "K1 Charitable Return Sources"
fullName: "Original attached charitable statements through basis and return limitations"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1065sk1"
retrievedAt: "2026-10-26"
notes: |
  Actual 2025/2026 source handoff; existing legacy no-packet paths are not newly
  qualified. IRC702(a)(4)/(b),706(a),704(d),1366(a)/(b)/(d),170 and final partner /
  shareholder instructions preserve separately stated charity and basis-limited
  capital/ordinary character. The optional basis prerequisite is reused, never
  replaced with a taxpayer's final allowed-deduction entry. Reported A/E/F codes
  remain original semantic amounts; exact source results supply their permitted
  amounts before section170 percentage/floor/final-choice calculations.
  https://uscode.house.gov/us/usc/119-120/t26/s702/
  https://uscode.house.gov/us/usc/119-120/t26/s706/
  https://uscode.house.gov/us/usc/119-120/t26/s704/
  https://uscode.house.gov/us/usc/119-120/t26/s1366/
  https://uscode.house.gov/us/usc/119-120/t26/s170/
  https://www.irs.gov/instructions/i1120ssk
  https://www.irs.gov/instructions/i6198
  Section469 excludes charity from8582 but does not establish a465 exemption.
  Without an actual activity-assignment attachment, this source cohort requires
  actual simplified6198 capacity
  sufficient for every basis-allowed deduction plus the entire charity, including
  appreciation, with independent known-empty prior465 history. Therefore either
  activity classification leaves the same allowance. The optional source-bound
  current activity assignment in k1-charitable-at-risk.yaml reconciles every
  actual item and gift ID, then allocates a binding465 loss over deductions after
  basis while retaining all income. Independent prior465 history is still known
  empty; positive historical character/release is separate internal work.
  Special gain/179/4952 deductions, royalties and unrepresented activity methods
  remain separate. Positive prior ordinary basis release requires independent
  QBI-history work; original prior charitable/property basis can be retained.
  Actual recipient class, qualification, original stock holding dates, FMV/basis,
  Box13/12 A/E/F and direct source IDs must reconcile. No invented valuation,
  cash source, public recipient, prior history or affirmative confirmation.
  For170(p), current entity-year cash uses actual DAF/supporting answers and only
  the amount remaining after basis and any actual activity465 allocation.
  Reg1.702-1(a)(4) treats partnership-year contributions
  as paid by the partner, with the706 inclusion year; Reg1.1366-1(a)(1)/(2)(iii)
  likewise includes the separately stated corporation-year contribution in the
  shareholder year. This source-derived fiscal-year application is not a
  published170(p) worked example. Preserve the actual payment date and entity
  period. Prior basis-release cash has a distinct timing question and is not
  silently treated as current cash or legally ineligible.
  https://www.ecfr.gov/current/title-26/section-1.702-1
  https://www.ecfr.gov/current/title-26/section-1.1366-1
  RevRul2008-16 and Reg1.1366-2(a)(3)/1.704-1(d) establish later basis
  releases while preserving character. A positive release's first entry into
  section170 must be distinguished from amounts already admitted to a prior
  section170 ledger before assigning a carry year or the new170(d)(1)(C) floor.
  A positive2026 prior-basis release with an automatic/itemized choice preserves
  its original history and rejects this unresolved floor/carry-vintage method;
  zero release remains known zero and preserves basis suspension. The explicit
  property-only nonitemized source path in k1-prior-property-nonitemized-2026.yaml
  preserves original records before the return's otherwise-allowable carry
  proof. Nonitemization does not avoid the floor. The no-residual cohort has
  neither closing section170 carry nor a release-dependent floor carry; positive
  release carry remains pending the separate first-entry source method, even at
  a zero contribution base or when another current category absorbs the floor.
  That missing source binding is internal implementation work, not a claim that
  later availability lacks statutory authority. Prior cash retains its separate
  section170(p) timing boundary.
  https://www.ecfr.gov/current/title-26/section-1.1366-2
  https://www.ecfr.gov/current/title-26/section-1.704-1
  https://www.irs.gov/pub/irs-irbs/irb08-11.pdf
  General NOL charity-source coordination is specified separately in
  charitable-original-source-nol.yaml; this original handoff package cannot
  strip original source records to enter an unsupported replay.
  IRC731(a)(1) recognizes money distributed above partnership-interest basis;
  IRC1368(b)(2) similarly addresses excess stock distributions under its stated
  conditions. A positive calculated excess without the optional original
  cashDistribution holding/treatment attachment rejects before return handoff.
  The separate k1-cash-distribution-gain specification supports the bounded
  investment-only actual cash method. Zero excess without an attachment keeps
  its original behavior. Business/passive and other distribution methods remain
  separate work; no unsupported source is assigned an invented gain character.
  https://uscode.house.gov/us/usc/119-120/t26/s731/
  https://uscode.house.gov/us/usc/119-120/t26/s1368/
