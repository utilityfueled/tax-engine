form: "Form 2210 Schedule AI"
fullName: "Annualized income installment method for calendar-year individuals"
taxYear: 2025
supportedTaxYears: [2025, 2026]
irsReference: "https://www.irs.gov/instructions/i2210"
sourceRetrievedAt: "2026-10-31"
notes: |
  Form2210 (2025) page3 and Instructions for Form2210 (2025) Schedule AI. The 2026
  form is not final; only its wage base differs here, from SSA 184500.
  https://www.irs.gov/pub/irs-pdf/f2210.pdf https://www.irs.gov/instructions/i2210
  Bounded method. Period amounts are the taxpayer's actual cumulative figures.
  Lines 9, 16 and 18 are collected as reported amounts from period worksheets.
  Publication 505 describes separately annualizing the ordinary preferential
  inputs. Final 2025 Form 2210 instructions direct line 14 to the applicable
  return worksheet. This path requires confirmed ordinary period sources and
  canonical full-year agreement on each component. The separately confirmed
  special-rate source method retains signed28 worksheet totals and pre-loss1250
  sources before invoking the existing ScheduleD Tax Worksheet. Section1202 and
  investment-interest elections retain their separate method boundary.
  Column (d) covers the full year, so its AGI, taxable income, itemized deductions and
  tax after credits must reconcile to the completed return, in whole dollars and within
  $2 for tax after credits because the return rounds Schedule SE parts separately. A mismatch rejects, which also stops Schedule 1-A and other deductions with
  no line here. Schedule J, Form 8615 and Form 2555 require their separate tax
  methods. Two self-employed owners require separately confirmed actual owner
  worksheets and canonical per-owner reconciliation.
  The ordinary $400 test uses exact adjusted net earnings before whole-dollar
  reporting, following IRC1402(b), Schedule SE line4c and the Schedule AI line28
  instructions. Test each owner's own earnings on a separate Part II.
sources:
  - "https://www.irs.gov/pub/irs-pdf/f2210.pdf"
