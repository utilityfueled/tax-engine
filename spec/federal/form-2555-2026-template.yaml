form: "Form 2555 final 2026 physical candidate"
fullName: "Final 2026 Foreign Earned Income form physical fields"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-prior/f2555--2026.pdf"
revision: "Created 9/18/26, IRS final index posted 11/05/2026"
retrievedAt: "2026-11-13"
reviewStatus: "independent-qualified-tax-review-pending"
notes: |
  Final 2026 instructions: https://www.irs.gov/pub/irs-prior/i2555--2026.pdf.
  Parts I–III and all required eligibility statements remain unqualified for
  export. The narrow wage calculation below leaves those sections blank.
lines:
  - line: "source"
    description: "Pin the final annual blank"
    formula: "Require 151196 bytes, SHA-256 a88984fa3dd5b5846cc446032aaa2e0a6489d5efc8ac63f62632613c7e3d6b11, three pages and the 2026 form title."
    testRef: "tests/pdf/form-2555-2026-candidate.test.ts::pins the final blank and its revision"
  - line: "I–IV"
    description: "Bind original identification, eligibility, travel and receipts"
    formula: >-
      Identify each leaf by its printed purpose, page, rectangle and field type.
      Line 14 has two four-row blocks with four columns each. Line 18 has four
      six-column rows. Yes and no controls have separate leaf names and on states.
    testRef: "tests/pdf/form-2555-2026-candidate.test.ts::matches every field and widget to the official physical layout"
  - line: "V–IX"
    description: "Bind housing and exclusion calculation cells"
    formula: >-
      Lines 35 and 39 each have separate integer and fractional widgets. Preserve
      the printed decimal point, the 2026 annual exclusion and the published
      daily and annual housing base. Line 45 uses Schedule 1 line 8d and line 50
      uses Schedule 1 line 24j. The prior-year line 45 attachment notation
      has no dedicated widget and is outside this physical exercise.
    testRef: "tests/pdf/form-2555-2026-candidate.test.ts::records the printed factors, split ratios and transfers"
  - line: "diagnostic"
    description: "Exercise the saved form without taxpayer identifiers"
    formula: >-
      Write fictional amounts and eligibility details to distinct text and check
      boxes, exercise the boundaries of both travel tables, and preserve the
      original name and SSN fields blank. Reopen with appearances and notices.
    testRef: "tests/pdf/form-2555-2026-candidate.test.ts::reopens a marked diagnostic with distinct fields and blank identifiers"
  - line: "19–27, 37–45"
    description: "Project the confirmed full-year exclusion for one original W-2 without housing"
    formula: >-
      Bind one primary 2026 W-2 and its entire exact Box 1 amount to the
      canonical foreign-service allocation. Require all other Part IV receipts,
      housing, carryover, prior-service exclusion and allocable deductions to be
      confirmed zero in the return. Use the federal audit for 19–27 and 37–45.
      Line 37 is 132900, line 38 is 365, and line 39 is stored as 1 and 000.
      Check No for housing. Leave Parts VI and IX blank. Apply line 45 as a
      negative amount on Schedule 1 line 8d and verify both audited values agree.
      Leave identifiers and undocumented eligibility and attachment fields blank.
    testRef: "tests/pdf/form-2555-2026-candidate.test.ts::reopens a wage-only projection that matches the federal exclusion"
  - line: "wage-source"
    description: "Require the original wage allocation and a supported claim"
    formula: "Reject source conflicts, partial wage allocation, partial-year eligibility, housing claims and changed template bytes."
    testRef: "tests/pdf/form-2555-2026-candidate.test.ts::holds unsupported wage claims and changed originals"
  - line: "release"
    description: "Keep annual export unavailable"
    formula: "The blank and field map stay outside the public review and filing paths."
    testRef: "tests/pdf/form-2555-2026-candidate.test.ts::keeps all annual export gates closed"
