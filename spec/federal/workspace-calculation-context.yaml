form: "Workspace calculation context"
fullName: "Complete actual return facts reconciled with original workspace evidence"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i1040gi"
notes: "Document summaries and prose confirmation are source evidence, not a complete tax return. Existing year, scenario and export gates remain in force."
lines:
  - line: "complete-context"
    description: "Require a complete reviewed calculation context"
    formula: "A taxpayer identity plus sparse document boxes cannot establish standard-deduction, dependent or source qualification. Financial previews require the actual complete return input, explicit completeness confirmation and exact original-source bindings. Unknown context produces no financial estimate and does not mutate evidence."
    irsRef: "Form1040 required household, income, deduction and credit facts"
    testRef: "tests/engine/workspace-calculation-context.test.ts::keeps sparse evidence without calculating until complete actual facts are supplied"
  - line: "source-reconciliation"
    description: "Reconcile original document facts to actual calculation sources"
    formula: "Each selected source record binds once to the actual original input record and current year. Every provided original amount and classification must match; missing source boxes remain missing in evidence. Compare monetary values with Decimal, preserve zero, and reject duplicate, conflicting or unmapped source facts."
    irsRef: "Form1040 source recordkeeping and actual information-return amounts"
    testRef: "tests/engine/workspace-calculation-context.test.ts::rejects conflicting source amounts identities years and duplicate bindings"
  - line: "actual-positive-return"
    description: "Calculate from actual complete facts rather than summary defaults"
    formula: "Synthetic2025single wages50000 less actual eligible standard deduction15750 gives taxable income34250. The published34250-to34300tax-table row gives3875 tax; actual6000 withholding gives2125 refund. The preview uses the complete input unchanged."
    irsRef: "2025Form1040 TaxTable34250-34300single;2025standarddeduction15750"
    testRef: "tests/engine/workspace-calculation-context.test.ts::calculates an independently known return from complete facts without changing original evidence"
  - line: "pre-default-facts"
    description: "Require actual household and source answers before schema defaults"
    formula: "An absent dependent list or dependent eligibility answer is unknown. Required payroll boxes, including actual Box12W, must be supplied before schema parsing; positive HSA employer contributions require that owner's actual HSA worksheet. State reporting marked none cannot coexist with positive state wages or withholding."
    irsRef: "Form1040 dependent eligibility; FormW2 Boxes12W and15-17; Form8889 employer contributions"
    testRef: "tests/engine/workspace-calculation-context.test.ts::rejects unknown household and payroll facts before schema defaults"
  - line: "source-state"
    description: "Conserve source classification and required source worksheets"
    formula: "Known none, zero and false remain exact answers. Reject a contradictory state classification or HSA contribution without its actual owner worksheet; do not infer eligibility from a contribution amount."
    irsRef: "FormW2 Boxes12W and15-17; Form8889 actual eligibility"
    testRef: "tests/engine/workspace-calculation-context.test.ts::requires coherent state and HSA source facts while preserving explicit zero"
  - line: "non-wage-sources"
    description: "Preserve required nonwage source classifications"
    formula: "Retirement requires actual code, IRA status and taxable amount or the complete supported basis worksheet; Box5 alone does not establish the latter. Require actual SA account type and corrective earnings, SSA amounts and exclusions, government source completeness and student-loan qualification. Complete-return totals include the additional actual manual sources supplied in the context."
    irsRef: "Forms1099R/1099SA/SSA1099/1099G source instructions; Publication970 Chapter4"
    testRef: "tests/engine/workspace-calculation-context.test.ts::requires actual retirement classification and basis facts rather than a default taxable amount"
  - line: "all-return-source-facts"
    description: "Validate all income sources used by the complete return"
    formula: "Completeness is checked before defaults for selected uploads and additional actual manual records. Required state/local withholding, relevant Box12 amounts, foreign tax, dividend categories and retirement exclusion/exception facts remain individually required. A whole-return confirmation does not supply an omitted amount or answer."
    irsRef: "Form1040 complete actual income and withholding records; source information-return boxes and retirement worksheets"
    testRef: "tests/engine/workspace-calculation-context.test.ts::validates every actual income record including sources outside the selected uploads"
  - line: "preview-source-scope"
    description: "Keep additional source forms inside their validated calculation route"
    formula: "This document preview supports its established twelve source collections. Other information-return collections do not become qualified merely by entering a complete-context object. Preserve those records, reject an incomplete preview, and use their separately validated guided/canonical routes."
    irsRef: "Form1040 original-source completeness; existing scenario readiness boundaries"
    testRef: "tests/engine/workspace-calculation-context.test.ts::keeps unvalidated additional source collections outside the document preview boundary"
