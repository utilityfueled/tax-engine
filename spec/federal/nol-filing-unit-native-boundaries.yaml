form: "NOL filing-unit native source boundaries"
fullName: "Existing reviewed owner sources through actual controlled native components"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i172"
notes: |
  Test-only behavioral qualification of existing NetOperatingLossDetails and its
  real filing-unit children, using reviewed fictional original packets. Fresh
  Nov3 official i172 remains12/2024; Keeping records, Change in Marital Status
  and Change in Filing Status require actual original records and owner facts.
  Existing net-operating-loss-new-marriage/joint-pools specs control calculations.
  No tax formula, product code, old assertions or source amounts change. Exact
  decimals stay source strings until existing canonical computation. Missing
  facts/confirmations deny completion; no current allowance is entered by users.
  ReactDOM tests do not establish browser/PDF/human or2026 release qualification.
lines:
  - line: "reviewed-fixtures"
    description: "retains reviewed current owner and same-couple originals %s"
    formula: "Existing fictional newmarriage wages40000/60000 and regular50000/AMT20000 give regular24250/closing25750 and AMT20000/0; samecouple100000 wages gives AGI45200/carry30200. Native mount does not mutate actual filed originals or recompute a new source."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::retains reviewed current owner and same-couple originals %s"
  - line: "original-owner"
    description: "keeps actual original owner and return selections distinct %s"
    formula: "Clearing owner/return retains unknown undefined; selecting actual other person/return preserves explicit selection without changing loss amount or independent AMT records. Actual edits invalidate confirmation and deny current public source completion."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::keeps actual original owner and return selections distinct %s"
  - line: "original-computations"
    description: "adds and removes separate original computations without pooling owners"
    formula: "Native original separate computations retain actual owner, exact input and reference. Adding/removing a row never rewrites the original filed whole-dollar loss or unrelated rows; invalid sources cannot originate a current allowance."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::adds and removes separate original computations without pooling owners"
  - line: "filed-use"
    description: "retains unknown versus established zero in actual filed use %s"
    formula: "For claimedDeduction, modifiedAbsorption and attributeReduction, blank remains unknown and explicitly typed0 stays0. Original return and each owner amounts remain separate; source edits invalidate the independent confirmations."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::retains unknown versus established zero in actual filed use %s"
  - line: "filed-use-owners"
    description: "keeps filed owner use rows independent and preserves unknown history"
    formula: "Adding/removing actual filed-owner rows changes only that row; marking owner-use history unknown preserves the rest of the originating vintage and independent AMT records. No allowance is inferred from missing use facts."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::keeps filed owner use rows independent and preserves unknown history"
  - line: "marital-years"
    description: "keeps actual marital years and same-couple truth independent %s"
    formula: "Actual newmarriage false-before and samecouple true facts remain distinct. Removing/adding years does not generate missing dates or spouse identities. Mark unknown preserves unknown; clear spouse never defaults to the other actual person."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::keeps actual marital years and same-couple truth independent %s"
  - line: "current-documents"
    description: "retains actual owner document number and unknown assignment %s"
    formula: "One-based UI list number2 retains canonical index1.0 or nonnumeric input remains invalid; blank stays undefined. Owner selection is explicit primary/spouse/unknown; no owner/default is inferred. Raw reference edits invalidate confirmations."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::retains actual owner document number and unknown assignment %s"
  - line: "expense-splits"
    description: "retains exact raw expense splits and clears incompatible fields %s"
    formula: "Native current actualexpense primary100.25/spouse0 preserves exact raw strings and original references. Changing source group clears the previously selected field; values are retained and no wage-ratio or equal split is invented."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::retains exact raw expense splits and clears incompatible fields %s"
  - line: "empty-remount"
    description: "preserves explicit empty expenses versus removed unknown proof across remount"
    formula: "Explicit no joint expenses remains emptyarray; removing actual current proof makes it undefined and readding makes an incomplete object, not empty confirmed proof. JSON/remount does not fabricate omitted expense or document records."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::preserves explicit empty expenses versus removed unknown proof across remount"
  - line: "confirmation"
    description: "reconfirms only actual selected source confirmations after edits"
    formula: "Actual native source edits clear regular/AMT/current history confirmations. Explicit rechecking one confirmation does not check the other ledger. Saved raw source records remain unchanged except requested edits and confirmation invalidation."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::reconfirms only actual selected source confirmations after edits"
  - line: "timeline"
    description: "edits actual filing-unit people and years without refreshing original sources"
    formula: "Native originaltimeline owner/sourceID, year and return controls use actual retained people/return choices; adding/removing a blank source does not refresh other originals, infer a spouse or destroy independent AMT history."
    irsRef: "Form172 Keeping records; Change in Marital Status/Change in Filing Status; existing reviewed source contracts"
    testRef: "tests/apps/web/nol-filing-unit-native-boundaries.test.tsx::edits actual filing-unit people and years without refreshing original sources"
