form: "Guided ordinary digital-asset sources"
taxYear: "2025 review; actual2026 facts preserve the closed public year gate"
irsReference: "https://www.irs.gov/pub/irs-prior/i1099da--2025.pdf"
notes: |
  These controls collect actual Form1099DA statements, not ordinary1099B or
  transactions with no information statement. Original blank1d/1g remain
  separate from completed acquisition and basis records. Known zero and false
  require actual source answers. Source classification never supplies a missing
  amount, owner, source year, adjustment worksheet or filing qualification.
lines:
  - line: "actual-source"
    description: "Preserve original statement and completed taxpayer basis separately"
    formula: "Validate every original box and source identity before canonical DA normalization; retain exact source cents"
    irsRef: "Final2025 Form1099DA boxes1a through9 and taxpayer basis records"
    testRef: "tests/guided-interview/guided-digital-asset-sources.test.ts::binds original DA facts and exact taxpayer basis to the canonical return"
  - line: "unknown"
    description: "Do not infer basis zero source owner or special classification"
    formula: "Missing original facts and unsupported methods reject without deleting entered source values"
    irsRef: "i1099DA covered/noncovered reporting and Form8949 original acquisition and basis"
    testRef: "tests/guided-interview/guided-digital-asset-sources.test.ts::preserves missing and conflicting DA sources instead of fabricating facts"
  - line: "confirmation"
    description: "Invalidate confirmations after actual source or household changes"
    formula: "Retain all entered records; revoke statement and affected basis confirmations only for substantive edits"
    irsRef: "Actual recipient source reconciliation"
    testRef: "tests/guided-interview/guided-digital-asset-sources.test.ts::reconfirms edited DA sources without a metadata confirmation cycle"
  - line: "controls"
    description: "Collect real source records and preserve blank controls"
    formula: "Editable originals, independent basis, actual source confirmations and no network transmission"
    irsRef: "Final2025 Form1099DA recipient records"
    testRef: "tests/apps/web/digital-asset-source-interactions.test.tsx::collects original DA blanks and preserves unknown source answers"
  - line: "pa-source"
    description: "Collect separate actual Pennsylvania adjusted basis and investment purpose"
    formula: "PA80.24 basis and original100.49 proceeds retain exact20.25 before reported20; federal90.24 stays unchanged. Missing PA facts do not borrow federal basis."
    irsRef: "2025 PA ScheduleD columns(d)-(f) and PA-40 IN page4 rounding"
    testRef: "tests/guided-interview/guided-digital-asset-sources.test.ts::requires separate actual Pennsylvania digital basis without changing federal facts"
  - line: "long-term"
    description: "Bind actual long-term DA original source IDs beside other capital worksheets"
    formula: "Original B collectible100 plus ordinary DA10.25 gives110.25 net long gain and100 special gain; original IDs and source cents remain independently bound."
    irsRef: "ScheduleD source-bound ordinary digital and special-gain worksheets"
    testRef: "tests/guided-interview/guided-digital-asset-sources.test.ts::captures original long-term DA identities beside other capital sources"
  - line: "persistence"
    description: "Retain source cents and unknown original boxes through saved desktop and mobile entry"
    formula: "Original federal basis90.24 and independent PA basis80.24 remain separate after reload; substantive edits revoke confirmations, and missing completed basis suppresses the financial preview. Private source values stay local."
    irsRef: "Actual1099DA recipient and independent Pennsylvania acquisition records"
    testRef: "apps/web/tests/guided-digital-asset-sources.spec.ts::preserves original digital sources and independent state basis"
  - line: "copy-records"
    description: "Pass original digital records through the real investment panel capture action"
    formula: "Copy current investment records retains the long-term DA original identity and source cents alongside existing brokerage records, without changing the original entries."
    irsRef: "ScheduleD original source reconciliation"
    testRef: "tests/apps/web/digital-asset-source-interactions.test.tsx::copies original digital records through the investment section"
  - line: "state-withholding"
    description: "Include each actual matching-state DA statement withholding once in every preview path"
    formula: "Actual DA withholding0.10+0.20 and original W2 withholding0.40 total0.70 using Decimal. A different state's actual0.30 is not included; Pennsylvania and Ohio retain their dedicated source calculations."
    irsRef: "Form1099DA original state withholding and selected resident-state payment source reconciliation"
    testRef: "tests/guided-interview/guided-digital-asset-sources.test.ts::includes original digital withholding once in generic and dedicated state previews"
