form: "K1 Charitable At Risk"
fullName: "Actual activity deductions after basis and before charitable limits"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i6198"
retrievedAt: "2026-10-26"
notes: |
  IRC465(a)(2)/(d), Reg1.469-2T(d)(6)(iii)-(iv), and Pub925 Proration of
  deductions disallowed under at-risk limitation control this source-bound
  allocation. Basis-disallowed items are removed first. All activity income and
  gain remain reportable; only the loss exceeding actual at-risk capacity is
  apportioned among the remaining activity deductions. Each disallowed item is
  item deduction * activity disallowed loss / sum of activity deductions.
  The denominator is deductions, not the net loss after separately stated income.
  https://uscode.house.gov/us/usc/119-120/t26/s465/
  https://www.ecfr.gov/current/title-26/section-1.469-2T
  https://www.irs.gov/publications/p925
  This does not declare every charitable contribution subject to section465.
  An actual activity-assignment attachment must identify every original gift
  source and confirm that the reconciled original items belong to this activity.
  All eight original simplified Form6198 inputs remain required. Its line4 must
  equal the full qualified charitable amount after basis, including appreciation.
  The ordinary K1 amount is already net ordinary income/loss; separately reported
  income cannot be subtracted from it a second time. Form6198 PartI must agree
  with the separate ordinary, short-term, long-term, other-income and gift items.
  No computed allowance, loss fraction, charitable carry, or activity default is
  accepted from input. The existing source-complete nonbinding route remains
  valid without this additional attachment. Missing assignment cannot enter a
  binding method. Independent prior465 history must be known empty in this slice;
  positive historical at-risk character/release is separately queued internal work.
  Negative-risk recapture and unrepresented activity items retain their own
  source boundaries. Same actual regular/AMT treatment is required. Original
  current gifts and established2025 prior-basis releases preserve source identity;
  the2026 prior-basis floor-vintage question and year qualification gates remain.
  Charity passes to section170 only after this allocation and remains excluded
  from section469 and QBI. Ordinary and capital items keep their own character.
  Raw original capital items in an actual passive activity need their separate
  section469 portfolio-versus-activity character source. An activity465 assignment
  alone cannot supply it. The existing original passive-distribution attachment
  keeps its own established route; ordinary passive loss plus charity is admitted.
  Suspended465 gifts retain original source/category/payment and basis-origin
  facts in a separate output ledger, never a new five-year section170 carry.
