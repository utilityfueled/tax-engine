form: "K1 Charitable At Risk"
fullName: "Actual activity deductions after basis and before charitable limits"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i6198"
retrievedAt: "2026-10-28"
notes: |
  IRC465(a)(2)/(d), Reg1.469-2T(d)(6)(iii)-(iv), and Pub925 Proration of
  deductions disallowed under at-risk limitation control this source-bound
  allocation. Basis-disallowed items are removed first. All activity income and
  gain remain reportable; only the loss exceeding actual at-risk capacity is
  apportioned among the remaining activity deductions. Each disallowed item is
  item deduction * activity disallowed loss / sum of activity deductions.
  The denominator is deductions, not the net loss after separately stated income.
  https://uscode.house.gov/us/usc/119-120/t26/s465/
  https://www.ecfr.gov/current/title-26/section-1.469-2T
  https://www.irs.gov/publications/p925
  Corrected by k1-ordinary-gift-at-risk.yaml: final Reg1.702-1(a)(4),
  1.703-1(a)(2)(iv), IRC1363(b)(2) and Reg1.1366-1(a)(2)(iii) keep ordinary
  section170 gifts separate from the actual business/income-producing activity.
  An all-items checkbox or gift source ID does not establish activity nexus.
  The denominator excludes current basis-admitted ordinary gifts. Form6198 line4
  and activity gift IDs must likewise exclude them; actual historical activity
  sources retain their original recorded amounts, identity and years. Explicit
  zero/empty sources differ from absent. All eight original Form6198 inputs,
  source confirmations and actual ordinary/capital/income reconciliation remain.
  Basis still applies first. Ordinary gifts pass to section170 at their full
  qualified amount after basis, with no new465 suspension. They do not enter469
  or QBI. Actual capital and ordinary losses keep their activity character.
  This current correction does not establish prior170 use, a new first170 year,
  or the correctness of an old filed activity classification. Separate prior
  history methods retain their guards; positive old property residual remains
  subject to its admission/floor-vintage source proof. Production2026 stays closed.
  Raw original capital items in an actual passive activity need their separate
  section469 portfolio-versus-activity character source. An activity465 assignment
  alone cannot supply it. The existing original passive-distribution attachment
  keeps its own established route; ordinary passive loss plus charity is admitted.
  Recorded prior465 gifts retain original source/category/payment and basis-origin
  facts in their separate ledger; current ordinary gifts have zero new465 suspension.
