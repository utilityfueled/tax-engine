form: "Schedule 3"
fullName: "Additional Credits and Payments"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1040s3"

notes: |
  Schedule 3 collects nonrefundable credits (Part I) and other payments/
  refundable credits (Part II). Part I total goes to 1040 Line 20.
  Part II total goes to 1040 Line 31.

lines:
  - line: "1"
    description: "Foreign tax credit"
    formula: "Form 1116 or direct method (if ≤ $300 single / $600 MFJ)"
    irsRef: "Schedule 3 Instructions, Line 1; Form 1116"
    edgeCases:
      - "Direct method: if all foreign tax from 1099-DIV/INT, passive only, and ≤ $300/$600"
      - "Otherwise: Form 1116 limitation calculation"
    testRef: "tests/engine/schedules/schedule-3.test.ts::Schedule 3 Line 1 - foreign tax credit"

  - line: "2"
    description: "Child and dependent care credit"
    formula: "Form 2441 — percentage × qualified expenses"
    irsRef: "Schedule 3 Instructions, Line 2; Form 2441"
    notes: "Implemented via Form 2441 standalone module"
    testRef: "tests/engine/schedules/schedule-3.test.ts::Schedule 3 Line 2 - dependent care credit"

  - line: "3"
    description: "Education credits"
    formula: "Form 8863 — American Opportunity or Lifetime Learning Credit"
    irsRef: "Schedule 3 Instructions, Line 3; Form 8863"
    notes: "Implemented via Form 8863 standalone module"
    testRef: "tests/engine/schedules/schedule-3.test.ts::Schedule 3 Line 3 - education credits"

  - line: "4"
    description: "Retirement savings contributions credit"
    formula: "Form 8880 Line 12"
    irsRef: "Schedule 3 Instructions, Line 4; Form 8880"
    notes: "Saver's credit for eligible retirement contributions"
    testRef: "tests/engine/schedules/schedule-3.test.ts::Schedule 3 Line 4 - retirement savings credit flows into total nonrefundable credits"

  - line: "5a"
    description: "Residential clean energy credit"
    formula: "Form 5695 Part I — 30% of qualified expenses"
    irsRef: "Schedule 3 Instructions, Line 5a; Form 5695"
    notes: "Solar panels, wind turbines, geothermal, batteries, etc."
    testRef: "tests/engine/schedules/schedule-3.test.ts::Schedule 3 Line 5a - clean energy credit"

  - line: "5b"
    description: "Energy efficient home improvement credit"
    formula: "Form 5695 Part II — up to $3,200/year"
    irsRef: "Schedule 3 Instructions, Line 5b; Form 5695"
    testRef: "tests/engine/schedules/schedule-3.test.ts::Schedule 3 Line 5b - energy improvement credit"

  - line: "6b"
    description: "Credit for prior year minimum tax"
    formula: "Form 8801 Line 25"
    irsRef: "Schedule 3 Instructions, Line 6b; Form 8801"
    notes: "Nonrefundable credit for AMT paid in a prior year due to deferral (timing) items such as ISO exercises, depreciation, or depletion"
    testRef: "tests/engine/forms/form-8801.test.ts::Part II Line 25 - credit limited when available exceeds limitation"

  - line: "6d"
    description: "Credit for the elderly or the disabled"
    formula: "Schedule R Line 22"
    irsRef: "Schedule 3 Instructions, Line 6d; Schedule R"
    notes: "Nonrefundable credit for taxpayers age 65+ or permanently disabled"
    testRef: "tests/engine/forms/schedule-r.test.ts::Schedule R — Credit for the Elderly or the Disabled"

  - line: "8"
    description: "Total nonrefundable credits"
    formula: "Sum of Lines 1-5b and line 7"
    irsRef: "Schedule 3 Instructions, Line 8"
    notes: "Goes to Form 1040 Line 20"
    testRef: "tests/engine/schedules/schedule-3.test.ts::Schedule 3 Line 8 - total nonrefundable"

  # ── Part II: Other Payments and Refundable Credits ──────
  - line: "9"
    description: "Net premium tax credit"
    formula: "Form 8962 — ACA premium assistance"
    irsRef: "Schedule 3 Instructions, Line 9; Form 8962"
    testRef: "tests/engine/schedules/schedule-3.test.ts::Schedule 3 Line 9 - premium tax credit"

  - line: "11"
    description: "Excess Social Security tax withheld"
    formula: "For each taxpayer/spouse separately, sum min(employer total withheld, SSWageBase×employeeRate) across distinct employer EINs; credit=max(0,sum-cap). Add the two owners' credits. Cap remains exact cents; employer overcollection is excluded for employer correction/Form843."
    irsRef: "Schedule 3 Instructions, Line 11; IRS Form 1040 Instructions: 'credit for the amount withheld in excess of $10,918.20'"
    edgeCases:
      - "2025 max SS withholding: $176,100 × 6.2% = $10,918.20 (exact — do NOT round to $10,918)"
      - "Each employer withholds independently — can exceed if combined wages > base"
      - "Single employer at exact max ($10,918.20 withheld): excess = $0, not $0.20"
      - "2026 cap184500×0.062=11439.00; joint spouses each have their own cap; repeated same-owner EIN records are one employer"
      - "2026 joint missing owner and missing employer identity reject;2025 untagged historical preview retains unqualified primary attribution"
    testRef: "tests/engine/schedules/schedule-3.test.ts::Schedule 3 Line 11 - excess SS withholding"
  - line: "11-owner-employer"
    description: "Actual owner and employer attribution for excess withholding"
    formula: "Never combine spouses into one cap or refund single-employer overcollection; do not create distinct employers from duplicate EIN records"
    testRef: "tests/engine/schedules/schedule-3.test.ts::computes excess separately per owner and excludes employer overcollection"
  - line: "11-source-facts"
    description: "Missing2026 ownership and employer facts remain unknown"
    formula: "Actual joint owner and employer identity required; reject negative or nonfinite withholding"
    testRef: "tests/engine/schedules/schedule-3.test.ts::requires actual2026 owner and employer facts for excess withholding"
  - line: "11-legacy-unknown-employer"
    description: "Historical preview with an unknown employer identity"
    formula: "A legacy2025 record without employer EIN contributes no excess-withholding credit because distinct employment cannot be established. Do not fabricate an employer identity or crash an otherwise calculable historical preview. Strict2026 identity requirements still reject."
    irsRef: "Form1040 instructions, Schedule3line11: credit requires two or more employers; single-employer overcollection requires employer correction or Form843"
    testRef: "tests/engine/schedules/schedule-3.test.ts::preserves unknown historical employer identity without manufacturing excess credit"

  - line: "15"
    description: "Total other payments and refundable credits"
    formula: "Sum of Lines 9-14"
    irsRef: "Schedule 3 Instructions, Line 15"
    notes: "Goes to Form 1040 Line 31"
    testRef: "tests/engine/schedules/schedule-3.test.ts::Schedule 3 Line 15 - total refundable"

  # ── Edge Cases ──────────────────────────────────────────
  - line: "7-stacking"
    description: "Multiple nonrefundable credits stacking"
    formula: "Sum of FTC + dependent care + education + retirement savings credit + clean energy + improvement"
    irsRef: "Schedule 3 Instructions, Line 8"
    edgeCases:
      - "All six supported nonrefundable credit types sum correctly"
      - "Zero-value credits don't affect total"
    testRef: "tests/edge-cases/credit-stacking.test.ts::Schedule 3 - multiple nonrefundable credits stacking"

  - line: "pipeline"
    description: "Credits flow through federal pipeline to reduce tax"
    formula: "Each credit source module → Schedule 3 → Form 1040"
    irsRef: "Schedule 3 Instructions"
    edgeCases:
      - "FTC + education + energy credits all reduce total tax"
      - "ACA refundable credit flows through Line 9"
      - "Excess SS withholding from multiple employers flows through Line 11"
    testRef: "tests/edge-cases/credit-stacking.test.ts::Schedule 3 - credit stacking in federal pipeline"

  - line: "official-line-routing"
    description: "Preserve IRS credit/payment lines and direct Form1040 refundable credits"
    formula: "6a GBC; 6b priorAMT; 7 subtotal6; 8 totalnonref; 9 PTC; 10 extension payments; 11 excessSS; 14 subtotal13; 15 sums9-12+14. ACTC and refundableAOC belong only on1040lines28/29. Prior-year applied credits join estimated payments on1040line26."
    irsRef: "https://www.irs.gov/pub/irs-pdf/f1040s3.pdf and https://www.irs.gov/instructions/i1040gi"
    testRef: "tests/engine/schedule-3-official-routing.test.ts::Schedule 3 official credit and payment routing"

  - line: "11-estimated-tax"
    description: "Social Security overwithholding is withholding for Form2210"
    formula: "Add Schedule3line11 to Form1040line25d for Form2210withholding; do not subtract it as a refundable credit from the annual tax base. Extension payments are excluded from that credit base."
    irsRef: "https://www.irs.gov/instructions/i2210, Lines 3 and 6"
    testRef: "tests/engine/schedule-3-official-routing.test.ts::treats excess Social Security as withholding in Form2210"
