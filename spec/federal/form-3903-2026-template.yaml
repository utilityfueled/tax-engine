form: "Form 3903 final 2026 physical candidate"
fullName: "Final 2026 Form 3903 physical field source contract"
taxYear: 2026
reference: "https://www.irs.gov/pub/irs-pdf/f3903.pdf"
instructions: "https://www.irs.gov/pub/irs-pdf/i3903.pdf"
revision: "Created 9/17/26, IRS final index posted 11/06/2026"
retrievedAt: "2026-11-13T01:23:09Z"
notes: |
  Physical source only. The engine currently accepts military moving-expense
  facts and emits a reference summary. The 2026 printed certification includes
  qualifying intelligence-community assignment moves under P.L. 119-21
  section 70113. Neither additional eligibility nor expense calculations are
  enabled by this candidate. Review the final parent forms and separately
  qualify facts, calculations, security and output before use.
lines:
  - line: "revision"
    description: "Pin the final annual PDF"
    formula: "Require SHA-256 d1d0b934ba9b046509b33f1aa7617d619241c3334b476f233dfb8e04a9902373, 56424 bytes, one US Letter page, 2026 title and printed Created 9/17/26."
    testRef: "tests/pdf/form-3903-2026-candidate.test.ts::pins the exact final annual source"
  - line: "physical-locations"
    description: "Bind the seven text fields and three separate checkbox leaves"
    formula: "Pin each field name, type, rectangle and page, including both line 5 branches and each checkbox's own on-state."
    testRef: "tests/pdf/form-3903-2026-candidate.test.ts::maps every leaf to its exact annual physical location"
  - line: "printed-lines"
    description: "Record source semantics for the single certification and all five printed amounts"
    formula: >-
      The certification applies to active-duty permanent-change-of-station military
      moves and qualifying intelligence-community moves. Line 1 is qualifying
      household-goods transport and storage. Line 2 is qualifying travel and lodging
      excluding meals. Line 3 adds lines 1 and 2. Line 4 is government reimbursements
      for lines 1 and 2 excluded from W-2 box 1, normally reported in box 12 code P.
      If line 3 exceeds line 4, line 5 and Schedule 1 line 14 receive the difference.
      Otherwise line 5 has no deduction. Any positive excess of line 4 over line 3 is
      reportable on Form 1040, 1040-SR or 1040-NR line 1h. File a separate form per
      qualifying move, subject to the instructions for household moves to or from
      different locations. The 2026 standard moving mileage is 20.5 cents per mile
      before July 1 and 23.5 cents per mile from July 1.
    testRef: "tests/pdf/form-3903-2026-candidate.test.ts::records the printed branch destinations"
  - line: "saved-diagnostics"
    description: "Check both line 5 branches and checked and unchecked certification after save"
    formula: "Use fictional placements with a redacted identifier and one review notice. Check each widget value and appearance after reopening. Leave the line 5 amount blank on the No probe."
    testRef: "tests/pdf/form-3903-2026-candidate.test.ts::retains the diagnostic values and checkbox states after save"
  - line: "closed-exports"
    description: "Keep public review and filing disabled"
    formula: "The candidate has no route or export registration. The source is unapproved for both historical and 2026 review."
    testRef: "tests/pdf/form-3903-2026-candidate.test.ts::keeps every export gate closed"
