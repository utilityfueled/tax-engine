form: Hosted document opaque identities
schedule: Hosting privacy and local recovery boundary
taxYear: 2026
reference: apps/web/src/lib/hosted-privacy.ts
notes: |
  Deterministic aliases are pseudonyms, not authentication, secrecy or anonymity.
  Original local IDs, source facts, names, files, recovery format and dedupe remain unchanged.
  Preserve the eleven exact fixed public guided document IDs required by existing
  guided-prefix consumers, but give arbitrary guided-prefixed content no bypass.
  Ambiguous alias reads return null; selected alias deletion preflights all identities
  and rejects generically before any write if multiple retained originals match.
  Private answer fixtures use the existing public question-answer API so fact/question
  status and answer text are coherent. Local persisted snapshots follow the unchanged
  hydration contract (including optional blobStorageKey null); aliasing must not change it.
  Original source provenance and private metadata remain local. Server get/list
  normalization does not erase old rows or historical backups. No tax/filing gate changes.
  IDB tests use a bounded transaction/cursor fixture, not live browser durability proof.
