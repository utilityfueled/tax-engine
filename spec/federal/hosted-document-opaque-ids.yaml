  - line: "identity-contract"
    formula: |
      Noncanonical document IDs project to hdoc:v1: plus SHA256 byte pairs separated
      by colon over UTF8(JSON.stringify(["hosted-document-id",1,workspaceId,rawDocumentId])).
      Canonical inputs are idempotent. Eight independently derived literals are pinned
      before implementation. Duplicate input/output identities fail generically.
      Ordinary IDs still require existing opaque alphabet/max and direct-ID safety.
      Exact bounded name/size known-factory identity permits projection of valid local
      filenames with spaces/Unicode/private tokens. This compatibility classifier is
      not proof of trusted ingress; the safe output stands independently of it.
      Names nonempty<=1024, size safe/nonnegative integer, optional #N canonical integer>=2.
      Only fixed exact public guided IDs retain their public semantic prefix.
    testRef: "tests/apps/web/hosted-document-opaque-ids.test.ts::P24 opaque workspace/event/fact identity guards remain strict and unchanged"
