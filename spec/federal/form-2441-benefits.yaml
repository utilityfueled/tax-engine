form: "Form 2441 Part III"
fullName: "Dependent Care Benefits and Expense Coordination"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i2441"
notes: |
  Source refresh2026-10-25: final2025 instructions and f2441.pdf, Publication503,
  and amended IRC129(a)(2), https://uscode.house.gov/us/usc/119-118/t26/s129/.
  PublicLaw119-21 section70404 is effective for years after2025:7500/3750.
  Draft2026 i2441--dft.pdf corroborates the change but is not filing authority.
  This dedicated pure module supplies PartIII before the existing PartII credit.
  Unknown source facts are never zero. Explicit empty employee/self-employed
  arrays and known zero amounts are required. Eligible benefits may exist with
  no credit, including no qualifying persons, negative earned income or MFS.
  Benefit source IDs and owners are preserved for orchestrator reconciliation.
  Actual whole-dollar deduction allocations must match line24 and the source
  owner/schedule; the module never guesses among activities. Federal integration
  must match these IDs to actual activities and avoid deductions already taken.
  Money uses Decimal. Add actual source cents before rounding each form line
  to whole dollars, following the return's consistent whole-dollar convention.
  The same expense cannot support exclusion/deduction and current-year credit.
  Earned-income facts are actual completed PartIII worksheets: exclude line12
  benefits, subtract foreign exclusions and applicable SE adjustments, retain
  signed losses and actual monthly deemed income/combat-pay elections. This
  source contract does not guess those worksheet facts from household wages.
lines:
  - line: "source-contract"
    description: "Dedicated source facts preserve unknowns and actual owner attribution"
    formula: "Require confirmed source/earned-income/expense coordination and explicit employee/self-employed source arrays; reject duplicates, invalid amounts, unknown owners and allocations"
    irsRef: "Form2441 instructions PartIII; IRC129(b),(c),(e)(9)"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::preserves missing facts in the schema and requires actual zero source arrays"
  - line: "source-reported-amounts"
    description: "Actual W2 box10 and business deductions already reported remain distinct"
    formula: "Preserve missing W2 box10 as unknown; source benefitsReported must be bound to the actual box in federal orchestration. Require actual alreadyDeducted for each business source so allowed line24 can replace, rather than duplicate, an existing activity deduction."
    irsRef: "Form2441 instructions lines12,24; FormW2 box10"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::preserves actual reported W2 benefits and already deducted activity amounts"
  - line: "source-rounding"
    description: "Physical line rounding must not manufacture employee benefits from business sources"
    formula: "When business benefits exist, line23 must reconcile to rounded actual net employee benefits. Reject a grouping discrepancy instead of assigning a rounding dollar to an owner or wage source without evidence. Retain exact source cents."
    irsRef: "Form2441 lines12-15,22-26; Form1040 whole-dollar rounding convention"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::rejects source rounding that would manufacture employee benefits"
  - line: "12"
    description: "Current-year benefits not already included in wages"
    formula: "roundDollar(sum(employee reported benefits minus actual benefits already in Box1) + sum(actual self-employed benefits received))"
    irsRef: "Form2441 line12 and instructions"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::subtracts benefits already included in W2 wages exactly once"
  - line: "13"
    description: "Prior-year grace-period benefits actually used this year"
    formula: "roundDollar(sum(actual prior-year carryover used from all benefit sources))"
    irsRef: "Form2441 line13; Notice2005-42"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::keeps grace-period use separate from forfeiture and next-year carryforward"
  - line: "14"
    description: "Current employee-plan benefits forfeited or carried forward"
    formula: "roundDollar(sum(employee forfeited amounts plus employee amounts actually permitted to carry forward)); amounts must be included in line12, not future expected reimbursements"
    irsRef: "Form2441 instructions line14"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::matches the IRS 4950 reimbursed and 50 forfeited example"
  - line: "15"
    description: "Net dependent-care benefits"
    formula: "line12 + line13 - line14"
    irsRef: "Form2441 line15"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::keeps grace-period use separate from forfeiture and next-year carryforward"
  - line: "16"
    description: "Qualified expenses incurred this year regardless of payment date"
    formula: "roundDollar(actual qualifiedExpensesIncurred); never replace with paid expenses"
    irsRef: "Form2441 instructions line16"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::matches the IRS 2000 benefits and 900 incurred expenses example"
  - line: "17"
    description: "Benefits limited by incurred qualified expenses"
    formula: "min(line15,line16)"
    irsRef: "Form2441 line17"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::matches the IRS 2000 benefits and 900 incurred expenses example"
  - line: "18"
    description: "Taxpayer signed earned income for PartIII"
    formula: "roundDollar(actual taxpayer PartIII earned-income worksheet amount)"
    irsRef: "Form2441 instructions line18; IRC129(b)"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::retains signed separate earned incomes and applies a zero exclusion for a loss"
  - line: "19"
    description: "Spouse or repeated taxpayer earned income"
    formula: "MFJ: separate spouse amount except actual deceased-spouse election; MFS: spouse amount unless all three living-apart requirements are known true; others repeat line18"
    irsRef: "Form2441 instructions line19; Publication503 surviving and separated spouse rules"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::uses actual separate-return and surviving-spouse facts for the earned-income limit"
  - line: "20"
    description: "Allowed benefits before the plan and statutory caps"
    formula: "max(0,min(line17,line18,line19)); zero when exclusion eligibility is known false"
    irsRef: "Form2441 line20; IRC129(b),(c),(d),(e)"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::retains signed separate earned incomes and applies a zero exclusion for a loss"
  - line: "21"
    description: "Actual plan exclusion limited by tax-year law"
    formula: "min(roundDollar(actual planExclusionLimit),2025:5000 or2500;2026:7500 or3750); half cap only when MFS must use spouse earned income on line19"
    irsRef: "IRC129(a)(2); PublicLaw119-21 section70404; Form2441 line21"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::applies the year-specific statutory cap without assuming the employer increased its plan"
  - line: "22"
    description: "Benefits from actual sole-proprietorship or partnership sources"
    formula: "roundDollar(sum(self-employed received benefits plus prior grace-period benefits used))"
    irsRef: "Form2441 line22"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::separates business deductions employee exclusions and additional taxable wages"
  - line: "23"
    description: "Employee benefits after removing self-employed benefits"
    formula: "line15 - line22"
    irsRef: "Form2441 line23"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::separates business deductions employee exclusions and additional taxable wages"
  - line: "24"
    description: "Deductible benefits, attributed to actual business activities"
    formula: "min(line20,line21,line22); explicit source allocations must sum to this amount"
    irsRef: "Form2441 instructions line24; ScheduleC14, ScheduleE19/28 or ScheduleF15"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::requires exact owner and activity allocations for deductible business benefits"
  - line: "25"
    description: "Excluded employee benefits"
    formula: "max(0,min(line20,line21)-line24)"
    irsRef: "Form2441 line25"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::separates business deductions employee exclusions and additional taxable wages"
  - line: "26"
    description: "Additional taxable employee benefits"
    formula: "max(0,line23-line25); routes to1040line1e, without repeating benefits already included in W2wages"
    irsRef: "Form2441 line26 and instructions"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::subtracts benefits already included in W2 wages exactly once"
  - line: "27"
    description: "Credit expense cap from actual qualifying-person count"
    formula: "0 for no qualifying persons;3000 for one;6000 for two or more"
    irsRef: "Form2441 line27; IRC21(c)"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::supports benefits-only returns with known ineligibility and no qualifying persons"
  - line: "28"
    description: "Benefits already used for exclusion or deduction"
    formula: "line24 + line25"
    irsRef: "Form2441 line28"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::coordinates the credit expense cap without subtracting benefits twice"
  - line: "29"
    description: "Signed remaining credit expense cap"
    formula: "line27 - line28; zero or negative prohibits current-year expense credit"
    irsRef: "Form2441 line29;2026 draft instructions corroboration"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::the 7500 exclusion exhausts the 6000 current-year credit expense cap"
  - line: "30"
    description: "Actual current-year credit-eligible paid expenses"
    formula: "roundDollar(actual qualifiedExpensesPaidForCredit already excluding benefits in line28 and expenses claimed elsewhere); cannot exceed incurred expenses less line28"
    irsRef: "Form2441 line30 and instructions line2(d)"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::coordinates the credit expense cap without subtracting benefits twice"
  - line: "31"
    description: "Expense base passed to PartII line3"
    formula: "max(0,min(line29,line30)); PartII still applies its separate eligibility, earned-income and tax-liability limits"
    irsRef: "Form2441 line31"
    testRef: "tests/engine/forms/form-2441-benefits.test.ts::coordinates the credit expense cap without subtracting benefits twice"
