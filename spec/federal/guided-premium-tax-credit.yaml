form: "Guided Marketplace coverage sources"
fullName: "Actual Form1095-A statements and Form8962 household and monthly facts"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i8962"
notes: "Source collection only; canonical Form8962 computes modified AGI and the credit. Historical2025 and current2026 sources retain their actual year. Filing gates remain unchanged."
lines:
  - line: "original-policies"
    description: "Preserve every actual policy and source month before defaults"
    formula: "Require actual source year, Marketplace, policy number, monthly enrollment premium, original SLCSP and advance credit including known zero. Duplicate policies and months, wrong years and unknown amounts block; corrected statements replace the superseded source."
    testRef: "tests/guided-interview/guided-premium-tax-credit.test.ts::preserves original policy amounts and rejects unknown or duplicate source facts"
  - line: "monthly-reconciliation"
    description: "Reconcile the actual coverage-family worksheet to original statements"
    formula: "Every source month has one household reconciliation row; advance credit equals the exact sum of source advances, eligible premiums do not exceed original premiums, and corrected household SLCSP is an actual separate amount. Coverage, income-based SEP and applicable QSEHRA facts are explicit. No benchmark or eligibility is inferred."
    testRef: "tests/guided-interview/guided-premium-tax-credit.test.ts::reconciles monthly coverage without summing policy benchmarks or inferring eligibility"
  - line: "household"
    description: "Bind the actual tax family and dependency answers to the return"
    formula: "Require actual family size, poverty region, required-filing dependent MAGI, dependency and exception answers. Line1 excludes each filer who can be claimed as a dependent, using separate actual primary and joint-spouse answers; reconcile the claimed dependents and resulting family size. Zero-family allocation remains unsupported; no taxpayer MAGI override is emitted. Unsupported shared-policy allocation, alternative marriage and lawful-presence allocation worksheets remain explicit."
    testRef: "tests/guided-interview/guided-premium-tax-credit.test.ts::binds household sources and preserves ineligible answers without inventing exceptions"
  - line: "canonical-credit"
    description: "Calculate the actual source-based credit once"
    formula: "2025 single income30000, family1 contiguous FPL15060 gives whole percentage199, figure.0196, annual contribution588, annual premium/SLCSP6000, allowed PTC5412 and net credit1812 after3600 actual advances."
    testRef: "tests/guided-interview/guided-premium-tax-credit.test.ts::calculates the independent actual coverage credit in the guided return"
  - line: "source-edits"
    description: "Reconfirm source facts after household and income changes"
    formula: "Substantive household, income, adjustment and policy changes invalidate source confirmation while preserving original facts. Confirmation-only metadata changes do not create a confirmation cycle."
    testRef: "tests/guided-interview/guided-premium-tax-credit.test.ts::invalidates coverage confirmation after actual source changes without a confirmation cycle"
  - line: "controls"
    description: "Collect actual unknown zero and false through user controls"
    formula: "Opt-in policy and household source controls begin unknown, preserve explicit zero and false, and revoke confirmation on edits. Adding or removing rows never creates amount or eligibility facts."
    testRef: "tests/apps/web/premium-tax-credit-interactions.test.tsx::collects actual policy and coverage answers without inferred amounts"
  - line: "claimable-family"
    description: "Exclude each claimable filer from the actual tax family"
    formula: "Line1 equals unclaimable primary plus unclaimable joint spouse plus claimed dependents. Unknown primary/spouse dependency facts block. Zero-family or allocation cases need their separate supported method, never an invented family member."
    testRef: "tests/guided-interview/guided-premium-tax-credit.test.ts::excludes claimable filers from the actual tax family without inventing a member"
