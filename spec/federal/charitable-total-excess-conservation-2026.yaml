notes: |
  This explicit 2026 entry retains the failed proposed positive endpoint as the
  correct partial-attribution refusal. IRC172(a)(2)(A) deducts the entire actual
  pre2018 carry, separately from modified absorption under172(b)(2). The original
  proposed NOLD70000/AGI30000 oracle was wrong, not a demonstrated engine defect.
  No guard is weakened to force that result. The new runtime endpoint is generic
  and has a genuine2025 canonical consumer, specified in the2025 entry; this
  document makes no new positive2026 endpoint or physical/filing readiness claim.
  Primary-derived arithmetic is not a matching published example, independent
  human tax-law qualification or formal verification. Existing internal constants
  tests preserve their test-only seam and all production2026 gates.
lines:
  - line: "amended-floor-partial-refusal"
    description: "Keep partial multiple-origin attribution denied after the actual full pre2018 deduction"
    formula: "Wages100000; documented original2017NOL100000 and complete2018-2025 no-use history; directA20000/basis20000+C10500/basis5000.172(a)(2)(A) permits deduction100000, so AGI0/normalcharity0 and all30500 is excess. Modified contribution base100000 gives charity30500-floor500=30000; modified taxableincome70000/absorption70000/succeedingcarry30000. Removing all excess gives comparisoncarry0. Benefit30000<totalexcess30500, so no exact endpoint exists for these originals; retain the existing partial multiple-origin attribution refusal before canonical output. No invented per-origin split."
    testRef: "tests/engine/federal-charitable-determined-nol-2026.test.ts::retains2026 partial attribution when the amended floor prevents complete exhaustion"
