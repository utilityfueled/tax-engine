form: "Form8814 election sources"
fullName: "Actual child and parent eligibility before the elected income transfer"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i8814"
notes: "Sources retrieved2026-10-25: final2025 Form8814 instructions, IRC1(g)(5)/(7), RevProc2025-32 section3.03. Historical and candidate2026 limits are1350 and13500. Calculation preparation is not proof that a timely election was filed. Human review and final-form gates are unchanged."
lines:
  - line: "actual-source"
    description: "Require actual source year, child identity and affirmative election"
    formula: "Each elected child has a unique actual SSN, name, birth date, source reference and confirmed2025/2026 facts. Match an existing dependent by SSN when present, without requiring the elected child to be claimed as a dependent. Preserve missing income boxes as unknown through parsing; actual zero is valid."
    testRef: "tests/engine/forms/form-8814-election.test.ts::requires actual election sources and preserves missing income boxes"
  - line: "age-student"
    description: "Determine age and actual student qualification"
    formula: "Child is under19 at year end, or under24 with full-time school or qualifying school/government on-farm enrollment for parts of at least five distinct calendar months. January1 birthdays attain the next age on December31. Correspondence, online-only and on-the-job courses do not establish the student exception."
    testRef: "tests/engine/forms/form-8814-election.test.ts::checks January1 ages and five actual student months"
  - line: "child-return"
    description: "Check income, return and payment restrictions"
    formula: "Actual taxable interest plus ordinary dividends plus capital distributions is strictly above1350 and below13500 for2025/2026. Qualified dividends cannot exceed ordinary dividends. Actual other gross income, estimated payments, prior-year overpayment applied and federal withholding must each be zero; child must require a return and not file jointly. Planned timely filing is distinguished from a filed timely election; late or unknown does not qualify."
    testRef: "tests/engine/forms/form-8814-election.test.ts::rejects known ineligible income returns and payments without silently dropping a child"
  - line: "parent-selection"
    description: "Use the eligible parent or treated-as-parent return"
    formula: "Joint parents use their joint return. Married separate parents, separate remarried custodial/surviving parents and never-married parents living together all year compare actual taxable income excluding elected child income. Custodial unmarried parents use actual custody determination. A custodial married parent considered unmarried under7703 uses that actual determination, including a separate return; filing status alone cannot infer it. Remarriage substitutes the stepparent. A comparison requires strictly greater income, not a tie or inferred winner. Detailed instructions apply custody rules to never-married parents who did not live together all year."
    testRef: "tests/engine/forms/form-8814-election.test.ts::selects the actual eligible parent and compares complete taxable-income worksheets"
  - line: "canonical"
    description: "Validate the election before any parent income or AMT transfer"
    formula: "An invalid requested election rejects calculation before Form8814 aggregation and child bond preferences. A valid explicit election preserves the ordinary, preferential, exempt-metadata and AMT source paths exactly once. An income-only numerical worksheet does not establish election eligibility."
    testRef: "tests/engine/forms/form-8814-election.test.ts::checks canonical elections before income and AMT transfer in both years"
  - line: "parent-comparison-binding"
    description: "Reconcile the current parent's comparison against the same canonical return"
    formula: "Calculate taxable income with all child elections removed and require exact agreement with the actual current-parent worksheet. Do not accept a favorable stale scalar. For a claimed PTC dependent, transfer the excluded election excess back into dependent MAGI and derive taxpayer MAGI again; retain all original actual coverage facts. The other-parent amount remains its actual complete source worksheet."
    testRef: "tests/engine/forms/form-8814-election.test.ts::binds the parent comparison to canonical income and preserves PTC household sources"
  - line: "privacy"
    description: "Keep identity in source backup and remove it from review copies"
    formula: "Child SSN identifies duplicate or conflicting sources but never enters numeric audit descriptions. Existing render-copy redaction clears nested SSN while leaving original complete sources unchanged."
    testRef: "tests/engine/forms/form-8814-election.test.ts::keeps actual child identifiers out of audit and redacted review copies"
