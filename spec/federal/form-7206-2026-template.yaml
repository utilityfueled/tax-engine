form: "Form 7206 final 2026 physical candidate"
fullName: "Self-Employed Health Insurance Deduction final annual physical source contract"
taxYear: 2026
reference: "https://www.irs.gov/pub/irs-pdf/f7206.pdf"
revision: "Created 4/15/26"
retrievedAt: "2026-11-20T10:58:54Z"
notes: |
  Disabled physical candidate for the final annual form. Use one form per
  trade or business under which an insurance plan is established. Calculation
  and original-source eligibility are specified in form-7206.yaml. The
  instructions and parent form are separate qualification dependencies.
lines:
  - line: "revision"
    description: "Pin the final one-page annual PDF"
    formula: "Require SHA-256 863c82bd31b674d693653546a6479c34b8fa0b2e8a2a97a7a11d0d4f5030c9bb, 63429 bytes, a 611.976 by 791.968 point page, and the 2026 title."
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::pins the exact final annual source"
  - line: "physical-locations"
    description: "Bind the name, taxpayer ID and lines 1 through 14"
    formula: "Verify all 16 single-widget AcroForm text fields against their printed positions."
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::locates all annual fields on their printed rows"
  - line: "printed-transfers"
    description: "Pin the annual printed sources and destination"
    formula: >-
      Line 4 uses actual net profit and other earned income or Schedule SE
      Part I line 4b for the optional method. Line 5 adds positive net profits
      from Schedule C line 31, Schedule F line 34 or partnership Schedule K-1
      box 14 code A and other allocable income. Lines 7 and 9 use Schedule 1
      lines 15 and 16, respectively. Line 11 uses wages from Form W-2 box 5.
      Line 12 uses the attributable amount from Form 2555 line 45. Line 14
      is the lesser of lines 3 and 13 and transfers to Schedule 1 line 17.
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::records the printed sources and transfer"
  - line: "2"
    description: "Pin the final annual qualified long-term care brackets"
    formula: >-
      After monthly eligibility exclusions, sum the lesser of eligible
      premiums and the annual limit per covered person using age at year end.
      Caps are $500 through 40, $930 at 41 through 50, $1,860 at 51 through
      60, $4,960 at 61 through 70, and $6,200 at 71 and older.
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::renders literal line 2 limits at each age boundary"
  - line: "saved-diagnostic"
    description: "Verify separate business pages and their transfer"
    formula: >-
      Reopen the two diagnostic pages. Leave line 11 blank for the sole
      proprietor, and leave lines 4 through 10 blank for the S corporation.
      Save actual zero inputs and results as zero. Add the per-business line
      14 amounts once on Schedule 1 line 17 without pooling owners' limits.
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::keeps owner pages separate and saves blanks apart from zeros"
  - line: "ordinary-c-f-physical-review"
    description: "Project one original Schedule C medical plan with same-owner Schedule C and F profits"
    formula: >-
      Confirm the 2026 business sources and reconcile their documented positive
      Schedule C line 31 and cash Schedule F line 34 to calculations from the
      original return inputs. Require one owner and one qualified non-Marketplace
      medical plan established under Schedule C. Use original person, payment, and
      monthly employer-plan eligibility facts. Exclude paid premiums for months
      when subsidized employer coverage was available as printed on line 1.
      Use the canonical regular Schedule SE deduction. Line 4 uses Schedule C
      profit, line 5 includes both same-owner profits, and line 7 allocates the
      deductible half of SE tax using the line 6 ratio. Keep line 11 blank and
      leave taxpayer identifiers blank. Line 14 reconciles to Schedule 1 line 17.
      Save and reopen the pinned form with a visible review notice. This path
      holds other earnings and adjustments requiring separate allocations.
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::reopens the ordinary Schedule C and F source projection after excluding the subsidized month"
  - line: "ordinary-c-source-projection"
    description: "Render one confirmed medical plan under a sole Schedule C business"
    formula: >-
      Require an actual positive 2026 Schedule C profit and reconcile it to
      the confirmed line 31 source. When both the Schedule F input and its
      supporting source are absent, use the Schedule C profit on lines 4
      and 5 and show 100 percent on line 6. Use the full applicable canonical
      Schedule SE deduction on line 7. Apply the same original-payment,
      monthly eligibility, whole-dollar, and PDF validation as for the
      Schedule C and F case. Line 14 reconciles to Schedule 1 line 17.
    irsRef: "https://www.irs.gov/pub/irs-prior/f7206--2026.pdf"
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::reopens the sole Schedule C source projection with a 100 percent allocation"
  - line: "ordinary-c-f-source-controls"
    description: "Hold mismatched originals and unconfirmed coverage before projection"
    formula: >-
      Hold incorrect years, unsupported owners or plans, source profit amounts
      that differ from the canonical returns, unsupported income or adjustments,
      and a missing or unconfirmed original monthly employer-plan eligibility fact.
      If either a Schedule F return input or Schedule F supporting source is
      present, require both. Pin the original PDF hash before rendering.
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::holds mismatched ordinary 7206 originals and incomplete monthly facts"
    testRefs:
      - "tests/pdf/form-7206-2026-candidate.test.ts::holds Schedule F when its input or original is missing"
  - line: "ordinary-c-f-physical-precision"
    description: "Preserve the exact percentage and whole-dollar calculation on the printed lines"
    formula: >-
      Require an exact decimal line 6 percentage that fits the pinned PDF
      widget at its native nine-point font size. Verify the percentage against
      the original Schedule C profit and total positive Schedule C and F profit.
      Require all rendered dollar values to be whole dollars in the canonical
      calculation, including the allocated line 7 deduction. Hold repeating or
      oversized percentages and fractional dollar results for a separately
      reviewed presentation that keeps the printed lines reconciled.
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::keeps exact legible percentages and holds mixed whole-dollar calculations"
  - line: "ordinary-c-f-payroll-source"
    description: "Retain the effect of actual Social Security tips on the line 7 allocation"
    formula: >-
      When W-2 payroll is present, use known Boxes 3 and 7 in the canonical
      Schedule SE wage-base calculation. Keep a reported zero distinct from
      missing Box 7 and project the resulting same-owner allocation on line 7.
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::reconciles line 7 to the actual W-2 Social Security tip box near the wage cap"
  - line: "closed-exports"
    description: "Keep public review and filing disabled"
    formula: "The physical map has no route or export registration. Neither the 2025 nor the 2026 qualified template registry accepts these bytes."
    testRef: "tests/pdf/form-7206-2026-candidate.test.ts::keeps public exports closed"
