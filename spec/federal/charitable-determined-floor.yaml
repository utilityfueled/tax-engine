form: "Charitable Determined Floor"
fullName: "Actual current and prior charitable categories with determined current-year floor attribution"
taxYear: 2026
irsReference: "https://uscode.house.gov/us/usc/119-118/t26/s170/"
retrievedAt: "2026-10-26"
reviewStatus: "independent-review-pending"
notes: |
  Source derivation, not a published matching numeric example. Section170(b)(1)
  G/A/B/C/D percentage limits and the existing actual current-before-prior,
  public-before-other, FIFO and expiry method are calculated once before the
  floor. Sources also include final2025 Pub526 Carryovers and
  https://www.ecfr.gov/current/title-26/section-1.170A-10 . The amended2026
  rules apply only after2025. Section170(b)(1)(I) orders floor absorption
  D,C,B,E,A,G; specialized E is outside this ordinary source contract.
  Admit a positive category floor only when its pre-floor prior treated-paid
  amount is exactly zero. That makes every disallowed contribution in that
  category current-year, without inventing a priority within a category.
  A zero floor needs no vintage allocation. For B, the existing exact medium
  method must determine both the current allowance and carry; partial mixed
  cash/noncash attribution remains guarded. The prior-C treated-paid versus
  final deduction conflict under the amended B offset remains guarded.
  Section170(d)(1)(C) enlarges current-year excess by its determined floor
  only when a current-year percentage excess is carried under a listed rule.
  Surviving older balances alone do not create a new current floor carry.
  Original prior use and expiry are identical between the itemized and
  nonitemized candidates. The final actual deduction choice selects the carry;
  it does not alter original facts, create standard entitlement, or turn the
  section170(p) limit into a percentage carry. NOL replay, prior-basis2026 K1
  release, special receipts, and unresolved same-category floor attribution
  remain separate methods. No filing or2026 readiness gate opens.
