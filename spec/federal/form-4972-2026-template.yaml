form: "Form 4972 final 2026 physical candidate"
fullName: "Final 2026 Tax on Lump-Sum Distributions physical fields"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-pdf/f4972.pdf"
revision: "Created 11/6/26"
retrievedAt: "2026-11-13"
reviewStatus: "independent-qualified-tax-review-pending"
lines:
  - line: "source"
    description: "Pin the final annual form and bundled instructions"
    formula: "Require a 130957-byte, four-page 2026 PDF with SHA-256 2968f25a528882666de3dab99ed9cf48ea8841e0fdbf6f409a71a4b419d4aa99."
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::pins the final form and every original widget"
  - line: "I, II, III and instructions"
    description: "Record field types, page, geometry and checkbox state"
    formula: >-
      Preserve the 40 form widgets on page 1 and 18 instruction worksheet widgets
      on page 3. Keep both parts of the line 20 ratio and the two ratios on page 3
      separate from the surrounding monetary fields. Pages 2 and 4 have no widgets.
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::pins the final form and every original widget"
  - line: "1-30"
    description: "Project the confirmed single participant's own-plan election"
    formula: >-
      Use the finite Form 4972 calculator and preserve its elected parts and
      whole-dollar arithmetic. Mark 1 Yes, 2 No, 3 No, 4 Yes and 5a No. Leave
      5b, 9 and 18 blank for the participant's own distribution. Carry line 11
      zero when Part III applies. Leave line 20 and the other actuarial fields,
      instruction worksheets and both identity fields blank. Reject rounding
      that changes the branch or prevents the printed amounts from reconciling.
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::projects only the applicable cells of each election"
    testRefs:
      - "tests/pdf/form-4972-2026-candidate.test.ts::holds amounts that cannot reconcile in whole dollars"
      - "tests/pdf/form-4972-2026-candidate.test.ts::holds positive Box 8a outside the zero-value physical candidate"
  - line: "1-30-beneficiary"
    description: "Project the confirmed single death-beneficiary election"
    formula: >-
      Require the finite death-beneficiary worksheet, explicit confirmation
      that the recipient is not the participant for this distribution and
      the recipient's actual own-plan Form 4972 use after 1986. Mark 1 Yes,
      2 No, 3 Yes, 4 No and 5b No. Mark 5a from the separate own-plan history.
      That history cannot disqualify this death-beneficiary distribution.
      Leave 9 blank because the death-benefit exclusion is unavailable to
      this cohort. For Part III, show the confirmed zero attributable estate
      tax on line 18 and zero on line 11. Preserve election branches and
      whole-dollar reconciliation. Leave identity and instruction fields blank.
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::projects the confirmed beneficiary and separate own-plan answers"
    testRefs:
      - "tests/pdf/form-4972-2026-candidate.test.ts::holds beneficiary projection with incomplete physical answers"
      - "tests/pdf/form-4972-2026-candidate.test.ts::reopens the marked beneficiary specimen"
  - line: "diagnostic"
    description: "Reopen a marked synthetic specimen"
    formula: "Verify text and checkbox values and appearances, all inactive cells and the review notice on all four pages. Remove XFA, Reader rights and active actions."
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::reopens a marked specimen with blank identity and instruction fields"
  - line: "release"
    description: "Keep the candidate outside current-year exports"
    formula: "Require the annual review and filing gates to stay closed."
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::keeps annual review and filing exports unavailable"
