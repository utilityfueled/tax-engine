form: "Form 4972 final 2026 physical candidate"
fullName: "Final 2026 Tax on Lump-Sum Distributions physical fields"
taxYear: 2026
irsReference: "https://www.irs.gov/pub/irs-pdf/f4972.pdf"
revision: "Created 11/6/26"
retrievedAt: "2026-11-13"
reviewStatus: "independent-qualified-tax-review-pending"
lines:
  - line: "source"
    description: "Pin the final annual form and bundled instructions"
    formula: "Require a 130957-byte, four-page 2026 PDF with SHA-256 2968f25a528882666de3dab99ed9cf48ea8841e0fdbf6f409a71a4b419d4aa99."
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::pins the final form and every original widget"
  - line: "I, II, III and instructions"
    description: "Record field types, page, geometry and checkbox state"
    formula: >-
      Preserve the 40 form widgets on page 1 and 18 instruction worksheet widgets
      on page 3. Keep both parts of the line 20 ratio and the two ratios on page 3
      separate from the surrounding monetary fields. Pages 2 and 4 have no widgets.
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::pins the final form and every original widget"
  - line: "1-30"
    description: "Project the confirmed single participant's own-plan election"
    formula: >-
      Use the finite Form 4972 calculator and preserve its elected parts and
      whole-dollar arithmetic. Mark 1 Yes, 2 No, 3 No, 4 Yes and 5a No. Leave
      5b, 9 and 18 blank for the participant's own distribution. Leave the
      instruction worksheets and both identity fields blank. Reject rounding
      that changes the branch or prevents the printed amounts from reconciling.
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::projects only the applicable cells of each election"
    testRefs:
      - "tests/pdf/form-4972-2026-candidate.test.ts::holds amounts that cannot reconcile in whole dollars"
  - line: "6, 8 and NUA A-G"
    description: "Project the confirmed own-plan appreciation election"
    formula: >-
      For deferral leave the dotted-line annotations and worksheet blank.
      For inclusion with Part II, retain the worksheet A through G on page 3
      of the review specimen. Split C across the whole and fraction widgets
      with three through six fractional digits, preserving displayed line E.
      Mark the dotted line next to line 6 with NUA and E. For a combined
      election mark next to line 8 with NUA and F. For Part III only mark next
      to line 8 with NUA and the included Box 6. Require all shown amounts
      to reconcile at whole dollars and keep the annotations on the printed
      dotted lines beside the amounts, outside original widgets and text.
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::projects the elected own-plan appreciation and printed annotations"
    testRefs:
      - "tests/pdf/form-4972-2026-candidate.test.ts::holds a rounded appreciation election that changes the shown amounts"
      - "tests/pdf/form-4972-2026-candidate.test.ts::reopens the marked own-plan appreciation specimen"
  - line: "11, 20-22, 26-29"
    description: "Project a confirmed own-plan actuarial adjustment"
    formula: >-
      For Part III, show line 11 zero with 20 through 22 and 26 through 28
      blank when Box 8a is zero. Otherwise show line 11 and split the ratio of
      printed lines 11 and 12 into the whole and fraction widgets on line 20.
      Use the shortest precision from three through six places for which the
      shown line 16 times the displayed ratio rounds to the calculated line 21.
      If line 16 is blank at or above $70,000, use zero allowance. Require the
      displayed actuarial amounts and separate tax to reconcile in whole dollars.
      Leave all actuarial fields blank for a Part II only election.
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::projects the confirmed own-plan actuarial adjustment"
    testRefs:
      - "tests/pdf/form-4972-2026-candidate.test.ts::uses additional decimal places when the printed ratio would change the allowance"
      - "tests/pdf/form-4972-2026-candidate.test.ts::reopens the marked own-plan annuity specimen"
  - line: "1-30-beneficiary"
    description: "Project the confirmed single death-beneficiary election"
    formula: >-
      Require the finite death-beneficiary worksheet, explicit confirmation
      that the recipient is not the participant for this distribution and
      the recipient's actual own-plan Form 4972 use after 1986. Mark 1 Yes,
      2 No, 3 Yes, 4 No and 5b No. Mark 5a from the separate own-plan history.
      That history cannot disqualify this death-beneficiary distribution.
      Leave 9 blank because the death-benefit exclusion is unavailable to
      this cohort. For Part III alone, show the confirmed attributable estate
      tax on line 18 and zero on line 11. For both parts, use the original
      Box 3 to reconcile line 8. Show Death Benefit Worksheet A–C on page 3.
      Use the shortest displayed ratio from three through six fractional places
      that preserves the capital share of the rounded attributable estate tax.
      Require line 6 and the remainder on line 18 to reconcile to that allocation.
      Hold positive estate tax with Part II alone and any printed arithmetic
      mismatch. Leave identity and unused instruction fields blank.
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::projects the confirmed beneficiary and separate own-plan answers"
    testRefs:
      - "tests/pdf/form-4972-2026-candidate.test.ts::holds beneficiary projection with incomplete physical answers"
      - "tests/pdf/form-4972-2026-candidate.test.ts::reopens the marked beneficiary specimen"
      - "tests/pdf/form-4972-2026-candidate.test.ts::projects the confirmed beneficiary estate tax on a Part III only election"
      - "tests/pdf/form-4972-2026-candidate.test.ts::projects both beneficiary elections and the estate tax allocation worksheet"
      - "tests/pdf/form-4972-2026-candidate.test.ts::uses a longer estate allocation ratio only when required by the printed amounts"
      - "tests/pdf/form-4972-2026-candidate.test.ts::reopens the marked beneficiary estate allocation specimen"
  - line: "diagnostic"
    description: "Reopen a marked synthetic specimen"
    formula: "Verify text and checkbox values and appearances, all inactive cells and the review notice on all four pages. Remove XFA, Reader rights and active actions."
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::reopens a marked specimen with blank identity and instruction fields"
  - line: "release"
    description: "Keep the candidate outside current-year exports"
    formula: "Require the annual review and filing gates to stay closed."
    testRef: "tests/pdf/form-4972-2026-candidate.test.ts::keeps annual review and filing exports unavailable"
