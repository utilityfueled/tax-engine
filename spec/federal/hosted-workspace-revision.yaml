form: "Hosted workspace snapshot revision"
fullName: "Owner-scoped concurrent hosted workspace snapshot writes"
taxYear: 2026
notes: |
  A private hosted workspace GET and successful POST return an opaque strong
  ETag generated by the store, independent of client timestamps and payloads.
  They also return the same canonical quoted UUID as workspaceRevision in
  the authenticated JSON payload. HTTP compression can weaken or replace an
  entity validator without changing the application snapshot. Read the
  validated application revision independently; never turn a weak ETag into
  a strong If-Match precondition. For compatibility, an absent application
  field may use a valid strong ETag. A present malformed field fails closed
  and must not fall back to a different transport validator.
  Existing stored rows receive revisions without modifying their JSON. Only
  an explicit create request can insert. A snapshot update requires the
  exact revision associated with the user's captured base. The comparison
  and update run atomically under that owner/workspace. A stale revision or
  deleted row cannot authorize overwriting or re-inserting a workspace. The
  authenticated create path uses an insert-only precondition, retains owner
  quota admission, and cannot replace an existing row.

  Wait for a server-confirmed precondition failure before treating a failed
  request as having made no write. Keep ambiguous response outcomes separate.
  An older client without a precondition can still fetch a workspace and
  receives a reloadable conflict when saving. The full private local mirror
  can accompany a server revision only if bound to the authenticated owner and
  exact revision, and its canonical projected hosted shell agrees with the
  fetched one. Unbound legacy copies remain available for explicit local
  recovery. Legacy versionless responses cannot authorize a write on this
  server. Self-host behavior stays local. Quiesce old writers before a hosted
  rollout or rollback with mixed binary versions; an old instance can bypass
  this revision contract.
lines:
  - line: "representation-independent-revision"
    formula: "Preserve owner-scoped CAS across compression of GET and POST responses. Only a canonical application revision or legacy strong ETag can bind the private mirror and authorize the next write; malformed application revisions and weak-only responses cannot authorize it."
    testRef: "tests/apps/web/hosted-workspace-revision.test.ts::preserves the application revision when compression weakens GET and POST entity validators"
  - line: "snapshot-write-preconditions"
    formula: "No precondition -> 428; wrong or missing associated row -> 412; update matching version installs a fresh server version. Token comparisons are owner scoped. Stale attempts never reconcile document blobs or modify metadata."
    testRef: "tests/apps/web/hosted-workspace-revision.test.ts::permits only one sibling write even when both snapshots have the same client timestamp"
  - line: "explicit-create"
    formula: "Only explicit create can insert; never use insert as an update fallback. Deleting and re-creating the same workspace ID does not revive its old revision."
    testRef: "tests/apps/web/hosted-workspace-revision.test.ts::requires explicit creation and never revives a deleted workspace from a stale save"
  - line: "bound-browser-reopen"
    formula: "Only an owner-and-revision-bound browser mirror whose canonical sanitized shell agrees with the owner's actual hosted snapshot may accompany a freshly loaded ETag. Keep unbound local records outside hosted reads."
    testRef: "tests/apps/web/hosted-workspace-revision.test.ts::retains an equal private browser mirror without pairing a stale mirror to a fresh revision"
  - line: "authoritative-conflict"
    formula: "Recognize only explicit hosted precondition failures as confirmed no-write. Ambiguous transport failure remains distinct from that case."
    testRef: "tests/apps/web/hosted-workspace-revision.test.ts::distinguishes server-confirmed no-write from transport ambiguity"
  - line: "stale-upload-original-cleanup"
    formula: "On a server-confirmed no-write conflict, clean up only the new original IDs in that rejected batch. Preserve prior originals. For reset after a confirmed mutation, clean up only original IDs in the reset snapshot so a later upload cannot lose its bytes."
    testRef: "tests/apps/web/hosted-workspace-ingestion-shell.test.ts::removes only new originals on a confirmed hosted write conflict"
  - line: "delete-original-cleanup"
    formula: "Conditionally delete using any confirmed captured revision. On success, remove only private originals from the verified matching owner snapshot. Preserve unidentified originals if no authenticated revision could be loaded."
    testRef: "tests/apps/web/hosted-workspace-revision.test.ts::keeps originals if the authenticated snapshot cannot be loaded for deletion"
  - line: "local-storage-failure"
    formula: "Return the new confirmed server revision even when this browser cannot store the private mirror."
    testRef: "tests/apps/web/hosted-workspace-revision.test.ts::preserves the confirmed server revision after browser storage failure"
  - line: "snapshot-cors"
    formula: "Expose ETag and permit workspace precondition headers only on the trusted-origin workspace item route."
    testRef: "tests/apps/web/security-cors-middleware.test.ts::limits workspace snapshot revision CORS headers to trusted requests on the item route"
  - line: "guided-draft-account-and-revision"
    formula: "Bind private hosted guided inputs to the authenticated account, workspace and base revision. A stale browser draft or generic local draft cannot enter a current hosted snapshot. After a successful local mutation, copy the matching draft to the new revision without replacing edits already saved there."
    testRef: "tests/apps/web/hosted-workspace-browser-state.test.ts::isolates guided facts by owner and revision and advances only matching private drafts"
  - line: "guided-draft-removal"
    formula: "Remove only the guided browser draft bound to the confirmed revision. Preserve other account and later drafts, including local recovery."
    testRef: "tests/apps/web/hosted-workspace-browser-state.test.ts::clears only the confirmed account and revision"
  - line: "private-hosted-recovery"
    formula: "Read a full hosted backup from its verified private workspace snapshot and matching owner-scoped guided draft, using the existing encrypted recovery format. Ignore generic local workspace answers on this path."
    testRef: "tests/apps/web/hosted-workspace-browser-state.test.ts::restores the selected hosted snapshot and its actual guided answers without unowned data"
  - line: "missing-private-interview-recovery"
    formula: "A later hosted shell update cannot restore omitted private answers. Refuse a complete backup when any answered interview question or fact is missing its answer text."
    testRef: "tests/apps/web/hosted-workspace-browser-state.test.ts::rejects a complete backup of a shell missing an answered private interview item"
