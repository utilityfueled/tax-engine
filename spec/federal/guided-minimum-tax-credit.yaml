form: "Guided Form8801 sources"
fullName: "Actual prior-year minimum-tax-credit source worksheets"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i8801"
notes: "Current-year regular tax, tentative minimum tax, allowed credit and carryforward are canonical calculated amounts, never interview overrides. Changed joint membership or separated-spouse allocation needs its separate source method."
lines:
  - line: "source-year-and-identity"
    description: "Bind prior sources to actual taxpayer continuity"
    formula: "Require the actual supported worksheet year, immediately preceding source year, source reference, prior filing status, current household identity and confirmed unchanged taxpayer membership. Do not infer a split of prior joint credits or merge separate returns. Missing source facts remain unknown."
    irsRef: "Form8801 PartI prior-year Form6251 sources and PartII prior credit carryforward"
    testRef: "tests/guided-interview/guided-minimum-tax-credit.test.ts::binds actual prior-year sources and taxpayer continuity"
  - line: "original-amounts"
    description: "Preserve actual signed sources and explicit zeros"
    formula: "Collect actual prior6251 income/NOL-source sum, exclusion items, MTCNOLD, MTFTCE, prior6251 lines10 and11, prior8801 line26 and unallowed legacy vehicle credit. Income and exclusion adjustments can be signed; other sources must be finite and nonnegative. Do not manufacture absent original amounts through schema defaults."
    irsRef: "Form8801 lines1-3,12,14,16,19,20"
    testRef: "tests/guided-interview/guided-minimum-tax-credit.test.ts::preserves signed original amounts and rejects missing defaults"
  - line: "special-worksheets"
    description: "Collect applicable capital-gain, foreign-income and nonresident sources"
    formula: "Actual prior2555,1040NR and capital-gain applicability are separate known facts. Conditional worksheets retain original sources and reject contradictory retained values. QD worksheets use one consistent ordinary-income source; ScheduleD requires actual gain cap and1250 amount. Foreign/capital combinations require completed source adjustments."
    irsRef: "Form8801 line10, Foreign Earned Income Tax Worksheet and PartIII"
    testRef: "tests/guided-interview/guided-minimum-tax-credit.test.ts::retains and validates actual special worksheet branches"
  - line: "canonical-credit"
    description: "Calculate credit and carryforward from the actual return"
    formula: "Synthetic2025 single50000 wages has3875 tax and zero currentTMT. Actual prior-year AMT1000 plus carry200, with no exclusion-only AMT, gives1200 credit and2675 total tax. A larger actual carry is limited by current regular tax and preserves the unused balance."
    irsRef: "Form8801 lines18-26;2025 Tax Table34250-34300 single"
    testRef: "tests/guided-interview/guided-minimum-tax-credit.test.ts::calculates the actual credit and retained carryforward canonically"
  - line: "confirmation"
    description: "Recheck sources after substantive household or credit changes"
    formula: "Preserve prior-return records when actual household or worksheet facts change, revoke source confirmation and retain confirmation-only edits without cycles."
    irsRef: "Form8801 prior-return source and current-year credit limitation"
    testRef: "tests/guided-interview/guided-minimum-tax-credit.test.ts::revokes confirmation without erasing the original worksheet"
  - line: "interactive"
    description: "Enter actual sources without defaults or network transmission"
    formula: "Real controls preserve unknown, false and zero; exact signed and large decimal amounts; conditional worksheet details; and explicit removal. Actual source changes revoke confirmation."
    irsRef: "Form8801 source worksheets"
    testRef: "tests/apps/web/minimum-tax-credit-interactions.test.tsx::collects prior-return worksheets without inventing facts"
