form: "Schedule SE"
fullName: "Self-Employment Tax"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1040sse"
notes: |
  Refreshed final 2025 form and instructions on 2026-10-25. Each spouse computes
  a separate Schedule SE. Only that person's losses and wages affect their SE
  tax. K-1 Box14 codeA already contains applicable guaranteed payments; never
  add Box4 again. Verified 2026 source paths require actual ownership, payroll
  Boxes3/7 and actual adjusted K-1 SE amounts/type. Historical missing-source
  calculations are explicitly unverified. Optional methods, CRP exclusions,
  church/ministry exemptions and community-property adjustments need their
  applicable source worksheets before those scenarios can be qualified.
lines:
  - line: "1a"
    description: "Farm earnings"
    formula: "This person's Schedule F line34 plus adjusted farming K-1 Box14A"
    testRef: "tests/engine/schedules/schedule-se.test.ts::Schedule SE Line 1a - uses Schedule F net farm profit when farm input is present"
  - line: "1b"
    description: "Excluded CRP payments"
    formula: "Actual qualifying CRP payments; this regular-method slice has none"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::audits the official regular-method lines and includes W2 tips"
  - line: "2"
    description: "Nonfarm earnings"
    formula: "This person's Schedule C line31 plus adjusted nonfarm K-1 Box14A and other actual nonfarm business profit"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::uses K1 Box14A once and requires adjusted source facts for 2026"
  - line: "3"
    description: "Combined net profit"
    formula: "Lines1a minus1b plus2 for the same person"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::does not offset one spouse profit with the other spouse loss"
  - line: "4a"
    description: "Net earnings adjustment"
    formula: "If line3 is positive, round(line3 times0.9235); otherwise retain signed line3"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::audits the official regular-method lines and includes W2 tips"
  - line: "4b"
    description: "Optional-method earnings"
    formula: "Actual lines15 plus17; zero in this supported regular-method slice"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::audits the official regular-method lines and includes W2 tips"
  - line: "4c"
    description: "Adjusted earnings and filing threshold"
    formula: "4a plus4b; stop if below400 unless applicable church-employee exception"
    testRef: "tests/engine/schedules/schedule-se.test.ts::$433 SE income: SE tax applies (post-multiplier exactly $400)"
  - line: "5a-5b"
    description: "Church employee earnings"
    formula: "Actual church employee income times0.9235 with100 minimum; outside this regular business slice"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::audits the official regular-method lines and includes W2 tips"
  - line: "6"
    description: "Earnings subject to SE tax"
    formula: "4c plus5b; zero after the instructed stop when below400"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::audits the official regular-method lines and includes W2 tips"
  - line: "7"
    description: "Annual Social Security wage limit"
    formula: "Year-specific statutory Social Security wage base"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::keeps each spouse Social Security wage base separate"
  - line: "8a"
    description: "This person's Social Security wages and tips"
    formula: "Sum of this person's W2 Boxes3 and7 plus applicable Tier1 RRTA compensation"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::audits the official regular-method lines and includes W2 tips"
  - line: "8b-8d"
    description: "Additional covered wages"
    formula: "8b is this person's Form4137line10;8c Form8919line10;8d=8a+8b+8c"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::keeps unreported payroll sources with their actual owner"
  - line: "9"
    description: "Remaining wage base"
    formula: "max(0,line7-line8d)"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::keeps each spouse Social Security wage base separate"
  - line: "10"
    description: "Social Security tax"
    formula: "round(min(line6,line9) times0.124)"
    testRef: "tests/utils/tax-math.test.ts::SE tax - social security capped at wage base"
  - line: "11"
    description: "Medicare tax"
    formula: "round(line6 times0.029)"
    testRef: "tests/utils/tax-math.test.ts::SE tax - medicare no cap"
  - line: "12"
    description: "Self-employment tax"
    formula: "Line10 plus11, combined across separately computed spouse forms for Schedule2line4"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::keeps each spouse Social Security wage base separate"
  - line: "13"
    description: "Deductible half"
    formula: "round(each person's line12 times0.5); sum actual separate deductions for Schedule1line15"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::does not offset one spouse profit with the other spouse loss"
  - line: "source-integrity"
    description: "Unknown source ownership and payroll boxes stay unknown"
    formula: "Require actual owner on relevant joint-return sources, including positive NEC receipts, and actual Boxes3/7 in2026; reject conflicting owners; historical aggregate fallback remains unverified"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::preserves unknown source facts and rejects incomplete 2026 attribution"
  - line: "review-mapping"
    description: "Separate audited review forms"
    formula: "Copy each person's official lines to a complete two-page review form; use actual proprietor identity and reject contradictory results"
    testRef: "tests/pdf/fill-schedule-se-source.test.ts::renders separate complete audited forms for both spouses"
  - line: "payroll-owner-integration"
    description: "No silent loss of wage-base sources"
    formula: "An actually owned Form4137/8919 cannot silently omit an unowned joint-return W2; 2026 requires actual payroll Boxes3/7 even without a business source"
    testRef: "tests/engine/schedules/schedule-se-source.test.ts::rejects unknown wage ownership when calculating actually owned unreported payroll"
