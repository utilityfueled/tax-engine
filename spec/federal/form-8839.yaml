form: "Form 8839"
fullName: "Qualified Adoption Expenses"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i8839"
notes: |
  Reviewed for implementation 2026-10-25; independent tax review remains pending.
  2025 final Form 8839 and instructions supply line formulas; 2026 indexed amounts
  come from Rev. Proc. 2025-32 section 3.01, https://www.irs.gov/irb/2025-45_IRB.
  https://www.irs.gov/credits-deductions/individuals/adoption-credit confirms 2026
  maximum 17670, refundable cap 5120 and MAGI phaseout 265080 through 305080.
  2025 values are 17280, 5000 and 259190 through 299190. Each child has separate
  lifetime limits for credit and employer exclusion; expenses cannot be used for both.
  Aggregate eligible expense records per child, then round each form monetary input to
  the nearest dollar before percentage multiplication; do not round each expense record.
  2026 requires confirmed eligibility, finality year (null if not final), unreimbursed
  expenses by payment year, and actual tax-liability limit. US not-final claims prior-year
  expenses; US final-this-year claims previous and current years; already-final claims
  current year. Foreign final-this-year claims all eligible prior/current expenses,
  but foreign not-final gets no current credit or employer exclusion. Special-needs
  full credit is only for a US child with a state/tribal determination finalized this year.
  The priorYearCreditsClaimed field means prior Form 8839 line 3 plus line 6, not just
  the credit used against tax. Employer prior usage similarly means prior lines 20+24.
  Foreign prior-year benefit exclusion requires the historical worksheet; nonzero prior
  foreign benefits are explicitly unsupported until that historical calculation exists.
  Schedule 3-A federal-public-benefit rules/final forms are a separate 2026 readiness gate;
  these arithmetic results do not authorize filing or assume that eligibility.
  IRS 2026-10 guidance on 2025 carryforward refunds instructs filers to keep completing
  2025 Form 8839 under its published instructions. Its systemic account adjustment is
  separate. For 2026, actual corrected carryforward balances must be confirmed from
  the amended carryforward worksheet/notice, never inferred from the refund total:
  https://www.irs.gov/faqs/questions-and-answers-about-adoption-tax-credit-carryforward

lines:
  - line: "1"
    description: "Eligible child and finality facts"
    formula: "Confirm eligible child, adoption type, actual finality year and allowed expense years; MFS ordinary claim is ineligible"
    testRef: "tests/engine/forms/form-8839.test.ts::2026 uses actual finality and payment years"
  - line: "2"
    description: "Maximum credit per child"
    formula: "2025 17280; 2026 17670; separate from the employer-exclusion maximum"
    testRef: "tests/engine/forms/form-8839.test.ts::2026 splits refundable credit per child after phaseout"
  - line: "3"
    description: "Previously consumed credit limit"
    formula: "Prior Form 8839 line 3 plus line 6 for the same child"
    testRef: "tests/engine/forms/form-8839.test.ts::prior usage reduces the lifetime cap before current expenses"
  - line: "4"
    description: "Remaining lifetime credit limit"
    formula: "max(0, line 2 - line 3), separately per child"
    testRef: "tests/engine/forms/form-8839.test.ts::prior usage reduces the lifetime cap before current expenses"
  - line: "5"
    description: "Expenses eligible this year"
    formula: "Unreimbursed qualified expenses from eligible payment years; US special-needs finalized this year uses line 4"
    testRef: "tests/engine/forms/form-8839.test.ts::2026 uses actual finality and payment years"
  - line: "6"
    description: "Current credit before income phaseout"
    formula: "min(line 4, line 5) per child; no cross-child offset"
    testRef: "tests/engine/forms/form-8839.test.ts::prior usage reduces the lifetime cap before current expenses"
  - line: "7"
    description: "Credit modified AGI"
    formula: "AGI plus section 911 exclusions/deductions and sections 931/933 possession exclusion"
    testRef: "tests/engine/forms/form-8839.test.ts::Form 8839 Line 6 - MAGI includes foreign earned income exclusions"
  - line: "8"
    description: "MAGI over indexed threshold"
    formula: "max(0, MAGI - year threshold)"
    testRef: "tests/engine/forms/form-8839.test.ts::2026 splits refundable credit per child after phaseout"
  - line: "9"
    description: "Income phaseout fraction"
    formula: "min(1, line 8 / 40000), round to three decimal places (IRS permits at least three)"
    testRef: "tests/engine/forms/form-8839.test.ts::Form 8839 Line 9 - partial phase-out fraction rounded to 3 decimal places"
  - line: "10"
    description: "Phaseout reduction per child"
    formula: "roundDollar(line 6 * line 9), per child before aggregation"
    testRef: "tests/engine/forms/form-8839.test.ts::2026 splits refundable credit per child after phaseout"
  - line: "11a"
    description: "Current allowed credit per child"
    formula: "max(0, line 6 - line 10) rounded to dollars"
    testRef: "tests/engine/forms/form-8839.test.ts::2026 splits refundable credit per child after phaseout"
  - line: "11b"
    description: "Refundable amount per child"
    formula: "min(line 11a, year refundable cap), 5000 in 2025 or 5120 in 2026"
    testRef: "tests/engine/forms/form-8839.test.ts::2026 splits refundable credit per child after phaseout"
  - line: "11c"
    description: "Total refundable amount"
    formula: "sum per-child line 11b"
    testRef: "tests/engine/forms/form-8839.test.ts::2026 splits refundable credit per child after phaseout"
  - line: "12"
    description: "Total current allowed credit"
    formula: "sum per-child line 11a"
    testRef: "tests/engine/forms/form-8839.test.ts::2026 splits refundable credit per child after phaseout"
  - line: "13"
    description: "Refundable adoption credit"
    formula: "line 11c, flows to Form 1040 line 30 subject to separate year eligibility/readiness gates"
    testRef: "tests/engine/forms/form-8839.test.ts::2026 splits refundable credit per child after phaseout"
  - line: "14"
    description: "Current nonrefundable credit"
    formula: "max(0, line 12 - line 13)"
    testRef: "tests/engine/forms/form-8839.test.ts::carryforwards stay nonrefundable and use oldest eligible vintage first"
  - line: "15"
    description: "Prior nonrefundable carryforward"
    formula: "sum confirmed corrected balances with origin year within preceding five tax years"
    testRef: "tests/engine/forms/form-8839.test.ts::carryforwards stay nonrefundable and use oldest eligible vintage first"
  - line: "16"
    description: "Available nonrefundable credit"
    formula: "line 14 + line 15"
    testRef: "tests/engine/forms/form-8839.test.ts::carryforwards stay nonrefundable and use oldest eligible vintage first"
  - line: "17"
    description: "Actual tax-liability limit"
    formula: "max(0, Form 1040 line 18 less credits listed in IRS Credit Limit Worksheet); supplied by orchestrator"
    testRef: "tests/engine/forms/form-8839.test.ts::carryforwards stay nonrefundable and use oldest eligible vintage first"
  - line: "18"
    description: "Nonrefundable adoption credit and carryforward"
    formula: "min(line 16, line 17); consume oldest carryforward first then current nonrefundable credit; unused last-year vintage expires, other balances retain origin year"
    testRef: "tests/engine/forms/form-8839.test.ts::carryforwards stay nonrefundable and use oldest eligible vintage first"
  - line: "19"
    description: "Maximum exclusion per child"
    formula: "Same indexed dollar maximum as line 2; independently available on distinct expenses"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "20"
    description: "Previously consumed exclusion limit"
    formula: "Prior Form 8839 lines 20 plus 24 for same child"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "21"
    description: "Remaining exclusion limit"
    formula: "max(0, line 19 - line 20)"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "22"
    description: "Current employer benefits"
    formula: "Actual qualified-plan benefits, not taxpayer's unreimbursed expense amount"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "23"
    description: "Total current benefits"
    formula: "sum line 22"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "24"
    description: "Benefits within per-child lifetime limit"
    formula: "min(line 21, line 22); qualified-plan US special-needs final this year uses line 21; foreign not final zero"
    testRef: "tests/engine/forms/form-8839.test.ts::special needs employer exclusion can create negative taxable benefits"
  - line: "25"
    description: "Exclusion modified AGI"
    formula: "AGI excluding adoption benefit adjustment, plus employer benefits and section 911/931/933 amounts; caller supplies exclusionMagi when benefits exist"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "26"
    description: "Exclusion MAGI excess"
    formula: "max(0, line 25 - year threshold)"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "27"
    description: "Exclusion phaseout fraction"
    formula: "min(1, line 26 / 40000), rounded to three decimal places"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "28"
    description: "Exclusion phaseout reduction"
    formula: "roundDollar(line 24 * line 27) per child"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "29"
    description: "Allowed exclusion per child"
    formula: "max(0, line 24 - line 28)"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "30"
    description: "Total allowed employer exclusion"
    formula: "sum line 29"
    testRef: "tests/engine/forms/form-8839.test.ts::credit and employer exclusion have separate lifetime limits"
  - line: "31"
    description: "Taxable employer benefit adjustment"
    formula: "line 23 - line 30; may be negative for qualified-plan special-needs adoption; ineligible MFS or foreign not-final benefits remain taxable"
    testRef: "tests/engine/forms/form-8839.test.ts::special needs employer exclusion can create negative taxable benefits"

exportValidation:
  description: "2025 review-only mapping takes monetary lines directly from the engine audit, including refund, carryforward, credit limit and signed benefits; never reimplements tax arithmetic or silently truncates more than three children."
  testRef: "tests/pdf/fill-form-8839.test.ts::maps audited refundable nonrefundable carryforward and signed benefits without recalculation"
