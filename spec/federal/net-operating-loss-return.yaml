form: "Section172 canonical return worksheets"
fullName: "Actual NOL deduction and separately refigured carryover income"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i172"
notes: |
  IRC172(a)(2) computes the current limit before172,199A and250. Section172(b)(2)
  and Regulation1.172-5 require a separate modified-income computation for each
  loss year, retaining only earlier permitted NOL deductions. Income and AGI-based
  deductions are recomputed from the original return sources; source income is
  never replaced with a taxpayer-supplied taxable-income scalar. Capital losses
  in excess of gains,1202 exclusions and151 deductions are removed in the modified
  computation. Final Schedule1 deducts the allowed regular NOL once, before the
  actual passive,IRA,SSA,bond,loan and itemized-deduction computations.
  The following literal examples are independently derived synthetic cases,
  not published IRS numerical examples. Separate AMT and1411 facts are required;
  a confirmed empty AMT ledger is different from missing information.
lines:
  - line: "capital-1202-netting"
    description: "Restore excluded capital gain before limiting modified capital losses"
    formula: "Modified capital income=max(0,ScheduleD net capital income+1202 exclusion). Its change from actual1040 capital income is counted once. With1000gross gain,700loss and500exclusion, actual−200 becomes300: total addback500, not700. With4000loss instead, actual−3000 becomes0: total addback3000, not3500."
    irsRef: "IRC172(b)(2)(A),172(d)(2)(A)/(B); Form172 modified taxable income; derived combined statutory examples, not published IRS numeric oracles"
    testRef: "tests/engine/federal-nol-return.test.ts::nets restored1202 gain before disallowing the remaining modified capital loss"
  - line: "loan-refigure"
    description: "Recompute the actual qualified student-loan deduction in all three contexts"
    formula: "Wages94000 less3000capital loss gives91000MAGI and1500loan deduction,73750limit; modified94000MAGI gives1000loan/77250limit. Claim59000; absorb61800; final loan2500 and AGI29500."
    irsRef: "Form172PartIIline6; IRC221; Reg1.172-5"
    testRef: "tests/engine/federal-nol-return.test.ts::refigures source-qualified student loan interest for current and modified income"
  - line: "foreign-source-boundary"
    description: "Do not omit an NOL from a foreign-tax hypothetical or infer foreign allocation"
    formula: "General1116 activity with actual NOL requires its foreign-source loss allocation; deduction-year carry requires coupled replay. Actual904(j) remains a separate supported direct-election branch."
    irsRef: "Form1116 instructions Net operating loss; IRC904; Form172 refigured deductions"
    testRef: "tests/engine/federal-nol-return.test.ts::requires the missing foreign loss allocation before a general credit"
  - line: "review-statement"
    description: "Retain the current limit and both carry ledgers in a review-only statement"
    formula: "Regular65000claim/67400absorption/32600carry and separateATNOL87300claim/90000absorption/10000carry remain distinct. Modified regular income100000−15750=84250, times80%=67400. Form6251 prints2e65000 and parenthesized2f87300; the negative internal audit remains-87300. Include the calculation statement and6251 review even with zeroAMT."
    irsRef: "Form172 instructions NOLdeduction statement; Form6251lines2e/2f"
    testRef: "tests/pdf/net-operating-loss-review.test.ts::retains both actual carry ledgers and maps the parenthesized ATNOL once"
  - line: "review-source-conservation"
    description: "Reject a stale or incomplete carry statement before generating the packet"
    formula: "Actual source years/original loss/opening balances/history and canonical claim/AMT/audit totals must reconcile. Form-dollar AMTI compares after whole-dollar rounding while original income cents remain intact. Retained contexts are not an independent replay of every upstream source. Print no private source references or identifiers."
    irsRef: "Form172 instructions recordkeeping and statement; Form6251line2f"
    testRef: "tests/pdf/net-operating-loss-review.test.ts::rejects changed sources and inconsistent retained carry calculations"
  - line: "fifo-replay"
    description: "Recompute earlier deductions on the modified basis before each later vintage"
    formula: "Wages118750 less3000capital loss and15750standard deduction gives100000actual limit income; modified income103000. Two100000vintages claim80000/0 and absorb82400/0, retaining17600/100000."
    irsRef: "IRC172(b)(2); Reg1.172-5(a)(2)(i),(ii)"
    testRef: "tests/engine/federal-nol-return.test.ts::replays the actual earlier vintage deduction on the modified income basis"
  - line: "niit-origin-fraction"
    description: "Use the originating investment fraction of the claimed regular deduction"
    formula: "Wages250000 plus100000interest less3000capital loss and100000NOL gives247000AGI. Actual originating1411loss30000/originalNOL100000 gives30000negative line7; NII67000 and excessMAGI47000 produce1786NIIT."
    irsRef: "Form8960line7; Reg1.1411-4(h)"
    testRef: "tests/engine/federal-nol-return.test.ts::transfers the actual originating investment fraction without using carry absorption"
  - line: "source-boundaries"
    description: "Do not infer independent AMT or investment carry facts"
    formula: "Missing AMT history, unknown originating1411loss, contradictory legacy aggregate and actual AMT-basis differences reject; explicit empty AMT history remains distinct from missing facts."
    irsRef: "Form6251line2f; Form8960line7; IRC172(b)(2)"
    testRef: "tests/engine/federal-nol-return.test.ts::requires independent consistent carry sources and investment origins"
  - line: "coupled-carry-boundaries"
    description: "Keep other unresolved carry calculations explicit"
    formula: "A charitable carry whose reduction enlarged NOL carry requires170(d)(1)(B) reconciliation. Negative modifiedAGI and new EBL require the current-year original loss worksheet. Current COD attribute reduction requires regular/AMT vintage allocation. None is silently appended to the verified existing ledgers."
    irsRef: "Form172PartI/PartIIline26; IRC170(d)(1)(B),108(b),172; Reg1.170A-10(d)"
    testRef: "tests/engine/federal-nol-return.test.ts::rejects unresolved charity and current loss carry interactions"
  - line: "ira-refigure"
    description: "Refigure IRA deduction after the capital-loss modification"
    formula: "Wages88000 less3000capital loss gives85000IRA MAGI and2800IRA deduction,66450limit income. Modified income removes the capital loss, giving88000MAGI/700IRA/71550limit. Claim53160; absorb57240; carry42760. Final IRA7000 and AGI24840."
    irsRef: "IRC172(a)(2),(b)(2),(d)(2); Reg1.172-5(a)(2)(ii); Form172 PartII line6; Pub590-A IRA worksheet"
    testRef: "tests/engine/federal-nol-return.test.ts::refigures actual IRA income for the claim modified carry and final return"
  - line: "ssa-refigure"
    description: "Refigure taxable benefits in each canonical NOL context"
    formula: "Wages25000 less3000capital loss plus20000benefits gives3500taxableSS and9750limit. Modified income gives5350taxableSS and14600limit. Claim7800; absorb11680; final taxableSS0 and AGI14200."
    irsRef: "Form172 PartII line6; IRC86(b)(2); Publication915"
    testRef: "tests/engine/federal-nol-return.test.ts::refigures taxable Social Security rather than retaining the no-NOL amount"
  - line: "passive-refigure"
    description: "Recompute the rental allowance before later income worksheets"
    formula: "Wages125000 less3000capital loss and40000active rental loss gives14000allowed and92250limit. Modified income gives12500allowed and96750limit. Claim73800; absorb77400; final25000allowed and AGI23200."
    irsRef: "Form172 PartII line6; Form8582 line6 modifications"
    testRef: "tests/engine/federal-nol-return.test.ts::refigures the passive rental allowance before carrying an actual NOL"
  - line: "medical-refigure"
    description: "Recompute the medical floor using each actual income context"
    formula: "Wages100000 less3000capital loss and30000medical expense gives22725itemized and74275limit. Modified income gives22500itemized and77500limit. Claim59420; absorb62000; finalAGI37580 and27181medical deduction."
    irsRef: "Form172 PartII line7; IRC213(a); Reg1.172-5(a)(2)(ii)"
    testRef: "tests/engine/federal-nol-return.test.ts::refigures the medical floor without treating the claimed NOL as carry absorption"
  - line: "amt-regular-addback"
    description: "Restore the actual regular deduction before a separately calculated ATNOLD"
    formula: "Signed regular taxable income20000 with standard15750, regularNOL60000 and actualATNOLD10000 yields AMTI85750. Printed2e is60000 and2f is-10000. Unknown ATNOLD paired with a supplied regular deduction rejects."
    irsRef: "IRC56(a)(4),(d); Form6251lines2e/2f"
    testRef: "tests/engine/forms/form-6251-nol.test.ts::restores regular NOL and subtracts only the separately established alternative deduction"
