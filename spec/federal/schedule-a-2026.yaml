form: "Schedule A 2026 law transitions"
fullName: "Year-aware charitable and wagering deductions"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p505"
retrievedAt: "2026-10-24"
reviewStatus: "independent-review-pending"
lines:
  - line: "legacy-audit"
    description: "2026 charitable worksheets do not alter legacy audit identity"
    formula: "Emit the nonitemizer charitable worksheet audit for a completed 2026 candidate. Preserve 2025 Schedule A and SALT worksheet identifiers."
    testRef: "tests/edge-cases/schedule-a-edge-cases.test.ts::audit lines identify Schedule A and its SALT worksheet separately"
  - line: "legacy-wagering-precision"
    description: "2025 preserves its preexisting precise source comparison"
    formula: "For 2025 retain Decimal min(losses, winnings) before downstream form rounding; the 2026 90% worksheet and its whole-dollar result must not alter legacy source precision."
    testRef: "tests/edge-cases/form-w2g-edge-cases.test.ts::Form W-2G - losses $0.01 over winnings are capped with cent precision"
  - line: "direct-tax-categories"
    description: "Preserve state/local income, real estate and personal property tax categories"
    formula: "Add validated additional state/local income tax payments to line 5a before sales-tax comparison. Add separately supplied qualified real estate tax payments to line 5b; personal property taxes stay on line 5c. Each additional amount excludes values already reported on source forms and rejects negative amounts. Applicable for 2025 and 2026."
    irsRef: "https://www.irs.gov/instructions/i1040sca, lines 5a-5c"
    testRef: "tests/engine/federal-salt-facts.test.ts::Direct SALT facts retain categories"
  - line: "5b-property-tax-year"
    description: "Keep mortgage-sourced real estate taxes in their actual year"
    formula: "Apply the Schedule A line 5b year check to each positive Form 1098 property tax amount before adding separate qualified payments, rounding or applying the SALT cap. Reject an explicit year different from the return year, including when the mismatch is less than a dollar or the deduction would already be capped. Preserve the amount from matching-year or existing undated sources."
    irsRef: "IRC §164(a), https://uscode.house.gov/us/usc/t26/s164/; IRS Pub. 530, Deductible Real Estate Taxes and Escrow accounts, https://www.irs.gov/publications/p530"
    testRef: "tests/engine/schedules/schedule-a-property-tax-year.test.ts::holds positive property tax from other-year mortgage statements on the 2026 Schedule A worksheet"
    testRefs:
      - "tests/engine/schedules/schedule-a-property-tax-year.test.ts::keeps matching and legacy undated mortgage amounts on the 2026 worksheet up to and beyond the SALT cap"
  - line: "5e-salt-phase-down-precision"
    description: "Calculate the phased-down SALT limit before rounding Schedule A line 5e"
    formula: >-
      Subtract 30% of positive MAGI above $505,000 ($252,500 for MFS) from
      $40,400. Apply the $10,000 floor, then halve for MFS. Preserve the exact
      Decimal cap through comparison with actual SALT paid. Round the lesser
      amount to whole dollars when reporting Schedule A line 5e.
    irsRef: "IRC 164(b)(6)-(7); IRC 6102(c); Treasury Regulations 301.6102-1(c); draft 2026 Schedule A line 5e"
    testRef: "tests/engine/federal-salt-facts.test.ts::rounds line 5e after the exact 2026 phase-down for $status"
  - line: "8d-mortgage-insurance"
    description: "Restored qualified mortgage insurance deduction"
    formula: "Use explicitly allocated current-year premiums for qualified providers, acquisition debt and qualified residences under contracts issued after 2006. Reduce the combined eligible amount by 10% for each $1,000 or fraction of AGI over $100,000 (MFS $500 over $50,000), floored at zero. Preserve 2025 zero deduction."
    notes: "Box 5 alone is insufficient. Missing qualification or allocation rejects; prepaid allocations must reflect IRC 163(h)(5)(F), including no unamortized balance on early satisfaction and VA/RHS exception. This calculator accepts an explicitly substantiated allocation rather than inventing one."
    irsRef: "IRC 163(h)(3)(E), (F)(i)(III), (5)(E)-(F); https://www.irs.gov/publications/p505"
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::2026 mortgage insurance"
  - line: "16-wagering"
    description: "Wagering losses and qualifying wagering expenses"
    formula: "2026: min(winnings, 90% * (wagering losses + otherwise deductible expenses incurred carrying on wagering transactions)); round dollars. 2025 retains 100% limited to winnings. Negative inputs reject."
    irsRef: "IRC 165(d), https://uscode.house.gov/us/usc/119-120/t26/s165/"
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::2026 wagering deduction"
  - line: "1040-nonitemizer-charity"
    description: "Current cash contributions with standard deduction"
    formula: |
      2026 candidate = min(1000 [2000 MFJ], 60% of max(0, AGI), eligible current-year
      cash contributions). Required explicit recipient qualification under
      170(b)(1)(A); supporting organizations, donor-advised funds and private
      foundations excluded. No carryover, noncash gifts, or 0.5% floor.
      Automatic selection compares the standard deduction plus this candidate
      with itemized deductions. The selected nonitemizing path can receive this
      below-AGI deduction. Retain the worksheet candidate on a 2026 itemized
      election when the required eligibility answers are complete. If a qualified
      cash receipt lacks a supporting-organization or donor-advised-fund answer,
      allow an explicit itemized election with a zero candidate and omit the
      uncalculated comparison audit. Common donation source validation still
      applies. The 2025 candidate is zero. Other 2026 elections require actual
      eligibility answers for all qualified cash receipts.
    irsRef: "IRC 170(p), 63(b); https://uscode.house.gov/us/usc/119-134/t26/s170/; IRS IR-2026-135, https://www.irs.gov/newsroom/irs-reminder-permanent-charitable-contribution-deduction-begins-for-returns-filed-next-year-for-taxpayers-who-do-not-itemize"
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::2026 nonitemizer charitable deduction"
    testRefs:
      - "tests/guided-interview/guided-current-charitable-receipt-categories.test.ts::keeps nonitemizer recipient answers unknown for explicitly itemized cash gifts"
  - line: "11-14-itemized-charity"
    description: "2026 itemized contributions use the category worksheet"
    formula: "Route current direct and reported K-1 contributions through the 2026 category/floor worksheet. Preserve category and tax year on new carryforward entries. Historical aggregate or vintage carryovers reject pending supported reviewed transition treatment. The nonitemizer candidate remains independent of this floor."
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::2026 itemized charitable integration"
  - line: "charitable-qualification"
    description: "Known recipient, property type and basis facts"
    formula: "For positive 2026 gifts require actual recipient/public-versus-second-category classification; public recipient known ineligible gives no deduction. Noncash requires actual long-term status, and ordinary property deduction is min(FMV,basis). Private-foundation capital gain FMV route requires actual qualified-appreciated-stock confirmation; known false uses min(FMV,basis) in the capital20% category and unknown stock classification rejects."
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::2026 charitable qualification facts"
  - line: "private-stock-classification"
    description: "Actual private-foundation appreciated-stock exception"
    formula: "For a2026long-term appreciated-stock gift to a second-category private foundation, unknown qualified-appreciated-stock status rejects; true permits FMV; false requires min(FMV,actual basis), retaining the20% capital category. Never turn unknown into a negative qualification answer."
    irsRef: "Publication526 Capital Gain Property, Contributions to private nonoperating foundations; IRC170(e)(5)"
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::requires qualified-stock evidence for private-foundation capital gain FMV gifts"
