form: "Schedule A 2026 law transitions"
fullName: "Year-aware charitable and wagering deductions"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p505"
retrievedAt: "2026-10-24"
reviewStatus: "independent-review-pending"
lines:
  - line: "direct-tax-categories"
    description: "Preserve state/local income, real estate and personal property tax categories"
    formula: "Add validated additional state/local income tax payments to line 5a before sales-tax comparison. Add separately supplied qualified real estate tax payments to line 5b; personal property taxes stay on line 5c. Each additional amount excludes values already reported on source forms and rejects negative amounts. Applicable for 2025 and 2026."
    irsRef: "https://www.irs.gov/instructions/i1040sca, lines 5a-5c"
    testRef: "tests/engine/federal-salt-facts.test.ts::Direct SALT facts retain categories"
  - line: "8d-mortgage-insurance"
    description: "Restored qualified mortgage insurance deduction"
    formula: "Use explicitly allocated current-year premiums for qualified providers, acquisition debt and qualified residences under contracts issued after 2006. Reduce the combined eligible amount by 10% for each $1,000 or fraction of AGI over $100,000 (MFS $500 over $50,000), floored at zero. Preserve 2025 zero deduction."
    notes: "Box 5 alone is insufficient. Missing qualification or allocation rejects; prepaid allocations must reflect IRC 163(h)(5)(F), including no unamortized balance on early satisfaction and VA/RHS exception. This calculator accepts an explicitly substantiated allocation rather than inventing one."
    irsRef: "IRC 163(h)(3)(E), (F)(i)(III), (5)(E)-(F); https://www.irs.gov/publications/p505"
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::2026 mortgage insurance"
  - line: "16-wagering"
    description: "Wagering losses and qualifying wagering expenses"
    formula: "2026: min(winnings, 90% * (wagering losses + otherwise deductible expenses incurred carrying on wagering transactions)); round dollars. 2025 retains 100% limited to winnings. Negative inputs reject."
    irsRef: "IRC 165(d), https://uscode.house.gov/us/usc/119-120/t26/s165/"
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::2026 wagering deduction"
  - line: "1040-nonitemizer-charity"
    description: "Current cash contributions with standard deduction"
    formula: |
      2026 candidate = min(1000 [2000 MFJ], 60% of max(0, AGI), eligible current-year
      cash contributions). Required explicit recipient qualification under
      170(b)(1)(A); supporting organizations, donor-advised funds and private
      foundations excluded. No carryover, noncash gifts, or 0.5% floor.
      Standard deduction plus this candidate is compared with itemized deductions.
      Only the selected standard path receives this below-AGI deduction.
      2025 candidate is zero. Unknown eligibility, wrong-year dates or negative
      donation amounts reject rather than infer eligibility.
    irsRef: "IRC 170(p), 63(b), https://uscode.house.gov/us/usc/119-120/t26/s170/"
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::2026 nonitemizer charitable deduction"
  - line: "11-14-itemized-charity"
    description: "2026 itemized contributions use the category worksheet"
    formula: "Route current direct and reported K-1 contributions through the 2026 category/floor worksheet. Preserve category and tax year on new carryforward entries. Historical aggregate or vintage carryovers reject pending supported reviewed transition treatment. The nonitemizer candidate remains independent of this floor."
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::2026 itemized charitable integration"
  - line: "charitable-qualification"
    description: "Known recipient, property type and basis facts"
    formula: "For positive 2026 gifts require actual recipient/public-versus-second-category classification; public recipient known ineligible gives no deduction. Noncash requires actual long-term status, and ordinary property deduction is min(FMV,basis). Private-foundation capital gain FMV route requires qualified appreciated stock; other valuation branches reject for separate qualification."
    testRef: "tests/engine/schedules/schedule-a-2026.test.ts::2026 charitable qualification facts"
