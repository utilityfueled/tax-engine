notes: |
  Test-only evidence validation; no change to production AES-GCM/PBKDF2 or recovery.
  A random base64 ciphertext may contain a short plaintext-looking token by chance.
  The envelope has exactly eight canonical JSON fields: fixed public algorithm/version
  fields and three canonical base64 binary fields (salt16/iv12/ciphertext+tag).
  No arbitrary plaintext field or unknown key is admitted. Authenticated plaintext
  must equal the actual pre-backup workspace, raw guided answers/mode and originals.
  Zero user or provider credentials; these controls use only fictional local returns.
