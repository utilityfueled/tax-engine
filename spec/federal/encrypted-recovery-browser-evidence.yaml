form: Encrypted recovery browser evidence
schedule: Local recovery test infrastructure
taxYear: 2026
reference: apps/web/src/lib/workspace-recovery.ts
notes: |
  Evidence validation and cross-tab saved-record preservation. No change to
  production AES-GCM/PBKDF2 or the backup format.
  A random base64 ciphertext may contain a short plaintext-looking token by chance.
  The envelope has exactly eight canonical JSON fields: fixed public algorithm/version
  fields and three canonical base64 binary fields (salt16/iv12/ciphertext+tag).
  No arbitrary plaintext field or unknown key is admitted. Authenticated plaintext
  must equal the actual pre-backup workspace, raw guided answers/mode and originals.
  Zero user or provider credentials; these controls use only fictional local returns.
lines:
  - line: "saved-artifact"
    formula: "A valid authenticated archive is not rejected solely because random ciphertext contains a short marker; validation never returns ciphertext or decoded private payload."
    testRef: "tests/apps/web/encrypted-recovery-review.test.ts::accepts authenticated ciphertext with a deterministic short-marker coincidence"
  - line: "canonical-envelope"
    formula: "Exact8-key canonical JSON, literal format/version/algorithms/600000iterations and canonical16byte salt/12byte IV/minimum16byte GCMtag; unknown, duplicate, extra, plaintext or invalid encoding denied."
    testRef: "tests/apps/web/encrypted-recovery-review.test.ts::rejects extra or disguised plaintext and noncanonical encryption parameters"
  - line: "authenticated-originals"
    formula: "Independent Node AES256GCM decrypt with format:1 AAD must authenticate and exactly match actual workspace/guided originals plus each source identity/name/type/mtime/size/hash/bytes."
    testRef: "tests/apps/web/encrypted-recovery-review.test.ts::rejects validly encrypted changed originals and missing or duplicate files"
  - line: "authentication"
    formula: "Wrong password, changed salt/IV/cipher/tag/AAD and malformed cleartext deny with bounded safe error, no payload/ciphertext forwarded."
    testRef: "tests/apps/web/encrypted-recovery-review.test.ts::rejects authentication and payload failures without returning private material"
  - line: "browser-preservation"
    formula: "Complete native upload/reopen/wrong-password/restore/delete/PDF/privacy/year journey remains; only randomized-text substring assertions become canonical authenticated source comparison. Original case count/deadline/requests/retries unchanged."
    testRef: "tests/apps/web/encrypted-recovery-review.test.ts::checks actual production export and import preserve the complete source packet"
  - line: "self-host-release-archive"
    formula: "On the re-upgraded image, snapshot the synthetic workspace, exact scoped guided answers and preference, and sole original PDF metadata from browser storage before backup. Independently authenticate the actual download and match it to that snapshot and the generated PDF bytes before deleting the original return. Preserve the browser's wrong-password, tamper, restore, and deletion checks."
    testRef: "tests/runtime/postgres-recovery-source-contract.test.ts::authenticates the self-host download against originals before deleting the source"
  - line: "cross-tab-save"
    formula: "After an encrypted restore in one tab, a tab with an older storage cache can save a different return without replacing the restored return, original documents, scoped guided answers, or unrecognized saved fields. Both tabs read the new saved return list from browser storage."
    testRef: "tests/apps/web/workspace-recovery.test.ts::preserves a restored return when another tab saves an unrelated return"
  - line: "cross-tab-deletion"
    formula: "Deleting a return in one tab removes its entry, scoped guided data, and recovery marker. Saving a different return from a previously opened tab must preserve that deletion and keep its old data out of durable storage."
    testRef: "tests/apps/web/workspace-recovery.test.ts::does not bring back a deleted return when a previously opened tab saves another"
