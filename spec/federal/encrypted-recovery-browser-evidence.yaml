form: Encrypted recovery browser evidence
schedule: Local recovery test infrastructure
taxYear: 2026
reference: apps/web/src/lib/workspace-recovery.ts
notes: |
  Evidence validation and cross-tab saved-record preservation. No change to
  production AES-GCM/PBKDF2 or the backup format.
  A random base64 ciphertext may contain a short plaintext-looking token by chance.
  The envelope has exactly eight canonical JSON fields: fixed public algorithm/version
  fields and three canonical base64 binary fields (salt16/iv12/ciphertext+tag).
  No arbitrary plaintext field or unknown key is admitted. Authenticated plaintext
  must equal the actual pre-backup workspace, raw guided answers/mode and originals.
  Zero user or provider credentials; these controls use only fictional local returns.
lines:
  - line: "stale-guided-editor"
    description: "Reject edits from a guided tab after a local return is deleted or reset"
    formula: "Check the current browser return before saving guided facts, guided-mode preference or the guided projection. Reject missing or reset sources before writing and merge a valid projection into the currently saved documents. Do not recreate a removed return or revive its removed facts."
    testRef: "apps/web/tests/workspace-upload.spec.ts::a stale guided editor cannot recreate deleted return facts"
  - line: "stale-guided-reset"
    formula: "A local reset preserves the return identity but invalidates an already open guided editor's source generation. Stale year and projection saves cannot reattach the removed original or answers."
    testRef: "apps/web/tests/workspace-upload.spec.ts::a stale guided editor cannot revive reset return data"
  - line: "guided-sync-current-documents"
    formula: "A still-current guided editor merges into the latest local return and preserves an original uploaded in another tab after the editor opened."
    testRef: "apps/web/tests/workspace-upload.spec.ts::guided sync keeps originals added in another tab"
  - line: "saved-artifact"
    formula: "A valid authenticated archive is not rejected solely because random ciphertext contains a short marker; validation never returns ciphertext or decoded private payload."
    testRef: "tests/apps/web/encrypted-recovery-review.test.ts::accepts authenticated ciphertext with a deterministic short-marker coincidence"
  - line: "canonical-envelope"
    formula: "Exact8-key canonical JSON, literal format/version/algorithms/600000iterations and canonical16byte salt/12byte IV/minimum16byte GCMtag; unknown, duplicate, extra, plaintext or invalid encoding denied."
    testRef: "tests/apps/web/encrypted-recovery-review.test.ts::rejects extra or disguised plaintext and noncanonical encryption parameters"
  - line: "authenticated-originals"
    formula: "Independent Node AES256GCM decrypt with format:1 AAD must authenticate and exactly match actual workspace/guided originals plus each source identity/name/type/mtime/size/hash/bytes."
    testRef: "tests/apps/web/encrypted-recovery-review.test.ts::rejects validly encrypted changed originals and missing or duplicate files"
  - line: "authentication"
    formula: "Wrong password, changed salt/IV/cipher/tag/AAD and malformed cleartext deny with bounded safe error, no payload/ciphertext forwarded."
    testRef: "tests/apps/web/encrypted-recovery-review.test.ts::rejects authentication and payload failures without returning private material"
  - line: "browser-preservation"
    formula: "Complete native upload/reopen/wrong-password/restore/delete/PDF/privacy/year journey remains; only randomized-text substring assertions become canonical authenticated source comparison. Original case count/deadline/requests/retries unchanged."
    testRef: "tests/apps/web/encrypted-recovery-review.test.ts::checks actual production export and import preserve the complete source packet"
  - line: "self-host-release-archive"
    formula: "On the re-upgraded image, snapshot the synthetic workspace, exact scoped guided answers and preference, and sole original PDF metadata from browser storage before backup. Independently authenticate the actual download and match it to that snapshot and the generated PDF bytes before deleting the original return. Preserve the browser's wrong-password, tamper, restore, and deletion checks."
    testRef: "tests/runtime/postgres-recovery-source-contract.test.ts::authenticates the self-host download against originals before deleting the source"
  - line: "local-upload-durability"
    formula: "A local browser upload publishes new document metadata and reports success only after every original is committed in one durable transaction. If original storage is unavailable, leave existing metadata and files intact. A retry after storage recovers may attach the same selection."
    testRef: "apps/web/tests/workspace-upload.spec.ts::keeps local upload metadata unchanged when the original cannot be stored"
  - line: "local-upload-metadata-failure"
    formula: "If writing local return metadata fails after originals commit, remove only the uncommitted upload's original files and keep existing files and answers. Never announce success for a failed metadata write."
    testRef: "apps/web/tests/workspace-upload.spec.ts::removes only pending original files when local upload metadata cannot be stored"
  - line: "local-original-removal-metadata-failure"
    formula: "If removing a local document's metadata fails, abort the IndexedDB deletion and keep both originals and the exact saved return. A later retry may delete the selected original only."
    testRef: "apps/web/tests/workspace-upload.spec.ts::preserves the selected original when local removal metadata cannot be stored"
  - line: "local-original-removal-transaction-abort"
    formula: "If IndexedDB aborts after the local metadata write, restore the prior document metadata without undoing a later saved change to another return. Never report successful deletion until the original deletion commits."
    testRef: "apps/web/tests/workspace-upload.spec.ts::restores local document metadata when its original deletion aborts"
  - line: "local-reset-metadata-failure"
    formula: "When a local reset cannot publish the cleared return, keep its exact saved metadata, scoped guided answers, display preference, recovery marker and original PDF. A successful retry clears answers, preference and originals while retaining the return and its recovery marker."
    testRef: "apps/web/tests/workspace-recovery.spec.ts::keeps saved facts and originals when local reset cannot publish"
  - line: "local-delete-guided-failure"
    formula: "Failure to clear scoped local guided answers aborts whole-return deletion and restores only already changed metadata. A later retry removes the return, its original and its scoped keys."
    testRef: "apps/web/tests/workspace-recovery.spec.ts::keeps saved facts and originals when local deletion cannot clear guided answers"
  - line: "local-delete-transaction-abort"
    formula: "An abort after staging whole-return deletion restores its original and scoped saved metadata while retaining a later unrelated saved value. The retry deletes only the selected return."
    testRef: "apps/web/tests/workspace-recovery.spec.ts::restores scoped saved data when local return deletion aborts"
  - line: "stale-local-document-year"
    formula: "An already open document-year editor can update only the same saved document in an existing local return. After another tab deletes that return, the year edit fails without recreating the workspace or its source metadata."
    testRef: "apps/web/tests/workspace-upload.spec.ts::a stale document-year editor cannot recreate a deleted local return"
  - line: "stale-local-advanced-answer"
    formula: "An advanced answer from a tab opened before local return deletion cannot create a replacement return or report success."
    testRef: "apps/web/tests/workspace-upload.spec.ts::a stale advanced answer cannot recreate a deleted return"
  - line: "stale-local-advanced-reopen"
    formula: "An advanced reopen action from before reset cannot change the cleared return or report success. Reloading still shows the cleared state."
    testRef: "apps/web/tests/workspace-upload.spec.ts::a stale advanced question cannot be reopened after reset"
  - line: "cross-tab-save"
    formula: "After an encrypted restore in one tab, a tab with an older storage cache can save a different return without replacing the restored return, original documents, scoped guided answers, or unrecognized saved fields. Both tabs read the new saved return list from browser storage."
    testRef: "tests/apps/web/workspace-recovery.test.ts::preserves a restored return when another tab saves an unrelated return"
  - line: "cross-tab-deletion"
    formula: "Deleting a return in one tab removes its entry, scoped guided data, and recovery marker. Saving a different return from a previously opened tab must preserve that deletion and keep its old data out of durable storage."
    testRef: "tests/apps/web/workspace-recovery.test.ts::does not bring back a deleted return when a previously opened tab saves another"
  - line: "cross-tab-original-read"
    formula: "After an original is committed in IndexedDB, subsequent reads follow current durable ownership. An IndexedDB deletion in a different tab makes the bytes unavailable to the original uploader and its hosted alias. Keep the memory-only fallback for uploads that never committed."
    testRef: "tests/apps/web/hosted-document-opaque-ids.test.ts::does not read a durable original deleted by another tab"
  - line: "cross-tab-restored-original-read"
    formula: "Encrypted recovery also commits originals without retaining a second readable cache copy. A durable deletion makes the restored original unavailable to the importing tab."
    testRef: "tests/apps/web/hosted-document-opaque-ids.test.ts::does not read an encrypted-recovery original deleted from durable storage"
  - line: "cross-tab-original-browser"
    formula: "After a second tab deletes a return, an already open W-2 review cannot reopen its original from the uploading tab's memory."
    testRef: "apps/web/tests/workspace-recovery.spec.ts::cannot reopen an original after another tab deletes the return"
