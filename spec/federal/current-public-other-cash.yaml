  - line: "canonical-selection"
    description: "Choose actual carry after the deduction method and exclude private cash from170p"
    formula: "Base10000/G4000/B3000 gives ScheduleA11 and14=5950, current private carry1050 under either selection. Prior deduction is0. Only actual public cash is eligible for current170p. Explicit nonitemization does not create standard entitlement."
    testRef: "tests/engine/federal-current-public-other-cash.test.ts::selects public and other-recipient cash carry after the actual deduction election"
  - line: "guided-categories"
