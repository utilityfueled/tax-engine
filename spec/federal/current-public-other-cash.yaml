  - line: "historical-and-mixed-boundary"
    description: "Retain historical2025 capacity and the separate special-property source method"
    formula: "Base100000/G40000/B30000 allows50000 and carries20000 in2025, versus59500 and10500 current itemized carry in2026. The2026 B10%-offset and floor must not change2025. Actual current ordinary public property1 with G40000/B30000 gives Bcarry10501; changing that receipt to tangible long-term property requires its distinct source method."
    testRef: "tests/engine/forms/current-public-other-cash.test.ts::retains historical cash capacity and the separate mixed-property method"
