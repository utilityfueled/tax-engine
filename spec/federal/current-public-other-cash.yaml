  - line: "actual-source-boundary"
    description: "Require actual category and receipt reconciliation without inventing prior history"
    formula: "Missing category, stale source amount or prior history rejects. Known nonqualified private cash is excluded. Changing a cash receipt to property without reconciling the actual category amounts rejects. At base10000.49/G4000.11/B3000.99, exact Bcapacity2000.184 and floor50.00245 yield itemized Bcarry1050.80845 or nonitemized1050.80845. At G40000/B20000 no floor-only carry; B20000.01 adds500.01 under either selection."
