form: "Current Public Other Cash"
fullName: "2026 current public and other-recipient cash carry candidates"
taxYear: 2026
irsReference: "https://uscode.house.gov/us/usc/119-120/t26/s170/"
retrievedAt: "2026-10-25"
reviewStatus: "independent-review-pending"
notes: |
  Corrected2026 carry premise: nonitemized-allowable-charitable-carry.yaml
  applies IRC63(e)(1) and170(d)(1)(C) before actual deduction selection.
  Prior no-floor-selection expectations remain historical evidence only.
  This current-only source method requires actual confirmed empty prior history,
  public cash G and cash B to qualified second-category organizations only.
  Actual recipientCategory uses the shared classification resolver. Qualifying
  operating foundations belong to A/G; private nonoperating foundations and
  other qualified thirty-percent recipients use B for cash. Ambiguous legacy
  true and crypto other-qualified remain unknown. Current ordinary A/C/D and
  noncash B source coordination is specified in current-charitable-receipt-categories.yaml;
  pass-through sources and NOL methods remain separate here.
  Under current170B(i)/(ii), with no A/C/D, B is min(actual B cash,30% base,
  max(0,50% base minus allowed G plus min(G,10% base))). This revised offset
  applies after2025 and is not applied to historical2025. I applies the floor
  to B before G. d1C permits current-category floor carry only when current
  percentage excess exists; the allowable carry is independent of selection.
  No other-recipient cash is included in the current170(p) deduction. Reg1.170A-10
  supports the separate percentage carry method in nonitemized years.
  Numerical controls are statutory derivations, not published IRS examples.
lines:
