    description: "Keep current public and other-recipient cash limits, floor and carries separate"
    formula: "Base100000/G40000/B30000 gives before-floor G40000/B20000, total59500, Bcarry10500 under either selection. At G60000/B1000, B allowance0 and G floor500 yield itemized Gcarry500/Bcarry1000, with the same G500/B1000 nonitemized. At G0/B100000, B allowance30000 gives70500 Bcarry under either selection."
