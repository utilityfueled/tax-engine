form: "Form 5329 HSA Owner Sources"
fullName: "Separate taxpayer Part VII sources, excise tax and absorbed excess deduction"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i5329"
retrievedAt: "2026-10-25"
sourceInstructions: "https://www.irs.gov/pub/irs-prior/i1099sa--2025.pdf, page2 Boxes1/2: Box1 includes Box2 earnings; https://www.irs.gov/instructions/i8889, line14b"
notes: "Joint returns require separate forms. This source path supports Part VII for each actual Form8889 owner; other parts require their own source ownership. Current-law arithmetic is not filing qualification."
lines:
  - line: "42"
    description: "Actual prior-year carry for the same taxpayer"
    formula: "Prior-year line48 only when that owner's actual prior-year line49 is positive; otherwise zero. Require correct current/prior source years and actual amounts including zero."
    testRef: "tests/engine/federal-hsa-excess-owner.test.ts::keeps actual prior tax and missing source facts distinct"
  - line: "43-46"
    description: "Same-owner room and taxable distributions reduce prior excess"
    formula: "43=max(0,8889line12-8889line2);44=8889line16;45=43+44;46=max(0,42-45). Never use a spouse's room or distributions."
    testRef: "tests/engine/federal-hsa-excess-owner.test.ts::keeps spouse room and account values separate"
  - line: "47"
    description: "Current excess with actual same-owner corrections"
    formula: "max(0,8889line2-8889line12)+max(0,8889line11-8889line8), less same-owner supported timely returned principal (1099SA Box1 minus included Box2 earnings) and confirmed section301.9100-2 principal, floored at zero; correction earnings remain income. Form8889line14b excludes gross Box1 including earnings. Preserve an omitted Form8889line14a so actual source Box1 can populate it; a source-confirmed code2 correction requires actual Box2, including explicit zero."
    testRef: "tests/engine/federal-hsa-excess-owner.test.ts::applies only the same owner's actual correction and reports its earnings"
  - line: "48-49"
    description: "Separate carry and account-value caps"
    formula: "48=46+47;49=roundDollar(0.06*min(48,actual same-owner year-end HSA value)); add only separate taxes on Schedule2line8 and retain each carry separately."
    testRef: "tests/engine/federal-hsa-excess-owner.test.ts::keeps spouse room and account values separate"
  - line: "8889-13"
    description: "Absorbed prior excess becomes a same-owner deduction"
    formula: "Add min(5329line43,max(0,line42-line44)) to the same owner's original8889line13 before AGI; do not claim room belonging to another person."
    testRef: "tests/engine/federal-hsa-excess-owner.test.ts::deducts absorbed prior excess before adjusted gross income"
  - line: "source-conflict"
    description: "No aggregate override or missing-owner source can erase exposure"
    formula: "Reject contradictory aggregate HSA5329 amounts, missing facts for a material owner's exposure, wrong years, absent source owner or unsupported relief; actual-source joint data cannot use one aggregate5329. A supported returned-excess gross distribution must remain included in8889line14a and excluded by14b, with known nonnegative Box2 no greater than Box1."
    testRef: "tests/engine/federal-hsa-excess-owner.test.ts::rejects ambiguous aggregate or incomplete owner sources"
  - line: "employer-income"
    description: "Actual excess employer contributions included in income once"
    formula: "Under i8889 Excess Employer Contributions, add employer excess not already included in actual W2 wages to Schedule1line8z; require the actual already-in-wages amount and do not retain an income exclusion for returned principal."
    testRef: "tests/engine/federal-hsa-excess-owner.test.ts::reconciles excess employer contributions with actual W2 income"
  - line: "review-pages"
    description: "Individual identities and audited Part VII pages"
    formula: "Copy each owner's reconciled42–49 audits to a separate physical5329, with actual individual name and SSN; retain a zero-tax required form when prior excess is absorbed."
    testRef: "tests/pdf/form-5329-hsa-owner.test.ts::prints separate owner forms and rejects altered source results"
