form: "Form2555 source binding"
fullName: "Actual owner and income-source conservation for foreign earned income"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i2555"
notes: "PartsI/IV and the prior-year statement represent one taxpayer's actual foreign services and receipts. This resolver does not determine residence eligibility or replace the existing exclusion calculation. Historical2025 source-free previews remain unverified."
lines:
  - line: "owner-and-original-source"
    description: "Bind actual foreign-income amounts to one taxpayer and original income sources"
    formula: "Require actual owner, source year, source reference, completeness and one-owner confirmation. Canonical W2 indices bind original employer name/EIN/year/owner. ScheduleC binds the actual business name/owner and canonical gross income sources. Unknown or changed source facts reject; multiple taxpayers need separate forms."
    irsRef: "Form2555 PartI and instructions PartsIV/VII; married taxpayers file separate forms"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::binds actual owner year and canonical source identity"
  - line: "current-and-prior-conservation"
    description: "Keep current services and prior-year receipts separate and already included"
    formula: "Exact current rows reconcile each classified incomeSources amount and the actual PartIV business/partnership categories. Exact prior rows reconcile actual prior-year income received; current plus prior portions may not exceed the same original W2 wages or ScheduleC gross income. Prior exclusion cannot remove income absent from the return. Duplicate or aliased source IDs reject."
    irsRef: "Form2555 PartIV and instructions Income earned in prior year"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::conserves exact current and prior receipts without duplicate income"
  - line: "business-context"
    description: "Resolve business receipts from the canonical ScheduleC source"
    formula: "Use actual grossReceipts when present, otherwise the same included NEC sum used by ScheduleC; subtract returns/allowances and COGS and add actual other income to establish the gross-income bound. Require actual source snapshots of all four amounts, including zero, and reconcile them to canonical inputs before using the bound. Match actual business owner and identity. Do not accept caller profit or net-income overrides."
    irsRef: "Form2555 line20 and ScheduleC lines1-7"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::binds business amounts to actual canonical receipts"
  - line: "employment-outside-w2"
    description: "Preserve actual separately reported foreign employment"
    formula: "Original non-W2 employment sources require distinct source identifiers, actual year/owner/payer/reference and explicit confirmation that they are absent from W2. Their current amounts reconcile only foreignEmploymentIncomeNotOnW2, which the canonical return adds once to1040line1h. Prior non-W2, K1 and other positive mappings retain explicit unsupported source methods."
    irsRef: "Form2555 PartIV; Form1040line1h; prior-year foreign-income statement"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::requires actual separate employment and rejects unsupported mappings"
  - line: "unknown-and-legacy"
    description: "Do not turn absent source ownership or amounts into verified facts"
    formula: "An actual source route requires all source amounts including zero, complete mapping and known owner. Strict2026 rejects absent mapping. Historical2025 omitted mapping remains explicitly unverified and does not manufacture a source owner or ledger. All monetary conservation uses Decimal."
    irsRef: "Form2555 source records and income included in gross income"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::preserves unknown legacy sources and rejects incomplete actual records"
  - line: "canonical-handoff"
    description: "Validate source binding before calculating the exclusion"
    formula: "Synthetic2025 single160000 wages with actual120000 foreign wages retains gross wages160000, excludes120000 once, producesAGI40000 and taxable24250, and uses foreign stacking tax5820. Changing owner/year/source wages rejects; actual separate foreign employment produces the same income once."
    irsRef: "Form1040lines1a/1h; Schedule1line8d; Foreign Earned Income Tax Worksheet"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::validates actual sources before canonical exclusion and tax stacking"
  - line: "joint-source-boundary"
    description: "Bind a spouse claim to the actual joint spouse without reallocating household income"
    formula: "A single spouse Form2555 may bind that spouse's original W2 on a joint return. A primary W2, absent spouse or nonjoint status cannot establish the same source. Actual2026 source rows retain their original year and identity."
    irsRef: "Form2555 PartI and instructions Married couples"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::supports one actual spouse source and rejects household substitution"
  - line: "source-integrity"
    description: "Validate complete source identities and amount boundaries before arithmetic"
    formula: "Known zero is valid. Missing, blank, negative or nonfinite source amounts, source references and category amounts reject; separately named foreign employment cannot duplicate the same receipt reference. Prior received income must reconcile before any exclusion."
    irsRef: "Form2555 PartIV and income earned in prior year statement"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::rejects missing and contradictory original receipt facts"
  - line: "partnership-services"
    description: "Bind active-partner foreign income to its Schedule K-1"
    formula: "Form2555 line20b. A row scheduleK1:i must match that statement's owner, year, partnership name and EIN, and its current plus prior receipts cannot exceed Box14 code A, which reports earnings from active service. The partner must confirm performing the services and answer whether capital was a material income-producing factor. Form2555 still requires self-employment classification."
    irsRef: "Instructions for Form2555 line20, retrieved2026-11-01; Reg1.911-3(b)(2)"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::binds active-partner income to its Schedule K-1"
  - line: "qbi-foreign-profit"
    description: "Remove foreign business profit from QBI"
    formula: "QBI excludes income not effectively connected with a U.S. trade or business, whether or not the income is excluded. Schedule C foreign profit is net profit times foreign receipts over gross income, the Pub54 ratio, floored at0, with no entry. A K-1 row enters the profit from those services inside its QBI, up to its receipts, and zero with positive K-1 QBI needs confirmation that the statement already omits it. The reduction comes before the deductions that lower QBI, and only the U.S. share of the self-employment tax deduction lowers QBI, so all-foreign profit gives QBI0 and no loss, and foreign earnings take no share of that deduction, so a domestic source carries all of it. The entry cannot exceed the K-1 QBI. Net profit100000, half foreign: QBI46467, deduction9293. All foreign: deduction0. K-1 or Schedule C W-2 wages or UBIA with a positive reduction reject, because they would need apportioning. Schedule1-A business tips with foreign Schedule C profit reject."
    irsRef: "Instructions for Form8995 Income not effectively connected; IRC199A(c)(3)(A)(i); Pub54 Items Related to Excluded Income"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::removes foreign business profit from QBI"
  - line: "se-deduction-allocation"
    description: "Allocate the self-employment tax deduction to excluded income"
    formula: "Pub54: the deduction is allocable by the foreign earned income exclusion over foreign earned income. The foreign share is deductibleHalf times foreign net profit over net earnings before the 0.9235 factor, capped at1. Schedule C uses the computed foreign profit and a partnership its receipts, capped at the earnings Schedule SE reads for that K-1. A joint return with an unowned self-employment source rejects. Multiplying by the ratio gives the minimum allocable deduction, rounded to the nearest dollar at line44. An entry below it rejects and names the amount. Housing exclusion is left out of the numerator, because Pub54 does not name it. Deductible half5652, foreign70000 of80000, all excluded: minimum4946."
    irsRef: "Pub54 Items Related to Excluded Income and How To Report Deductions; Instructions for Form2555 Part VIII"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::requires the allocable self-employment deduction"
  - line: "business-capital-limit"
    description: "Limit earned income from a business where capital is material"
    formula: "Instructions for Form2555 line20 cover an unincorporated business. A reasonable allowance is earned income, up to 30 percent of net profit after the self-employment deduction. A business whose income is all foreign: net profit100000, SE deduction about7065, limit27880. Earned income above the allowance or the limit rejects, a mixed U.S. and foreign business rejects, and all the profit leaves QBI, even at earned income0. The limit follows the Form2555 instructions, after the self-employment deduction. Reg1.911-3(b)(2) says net profits and Pub54 Example3 takes30 percent of54147 with no such step, so a filer at Pub54's figure rejects, which is the stricter reading. A net loss rejects by name, though Pub54 Example4 allows the allowance, because loss treatment in QBI is unsettled."
    irsRef: "Reg1.911-3(b)(2); Instructions for Form2555 line20; Pub54 How To Report Deductions Example3, retrieved2026-11-01"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::limits business earned income where capital is material"
  - line: "allocable-deduction-floor"
    description: "Charge allocable business expenses and self-employment tax to the exclusion"
    formula: "Pub54 How To Report Deductions: Schedule C expenses times the exclusion over gross income, the Example3 fraction, plus the foreign share of the self-employment deduction times the exclusion over foreign earned income. The self-employment deduction is allocated using FEIE over total foreign earned income, as instructed in PartVIII; do not replace the denominator with capital net profit. Exclusion27880, gross200000, expenses100000, all foreign, FEI27880:13940 plus7065 is21005. In a service business with foreign gross50000 of200000 and actual foreign expenses25000, foreign profit25000 yields foreign SEdeduction1766.25; all50000FEI excluded gives combined26766.25, reported26766."
    irsRef: "Pub54 How To Report Deductions Examples3 and5, retrieved2026-11-01"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::charges allocable business expenses and self-employment tax to the exclusion"
  - line: "partnership-capital-limit"
    description: "Limit earned income where capital is material"
    formula: "Reg1.911-3(b)(2) and Form2555 line20. A partner enters a confirmed reasonable allowance for the services, and receipts cannot exceed it. They also cannot exceed 30 percent of the partner's share of net profits, ordinary income plus guaranteed payments, after the employer-equivalent self-employment tax deduction for that K-1. Ordinary income54147: deduction3825, limit15096. Receipts15097 reject. Pub54 Example3 shows 30 percent of net income with no self-employment deduction, which would give16244; the instructions are followed and the difference is a reviewer question. All the foreign profit stays outside QBI, so the entry may exceed receipts here, up to the K-1 QBI. Schedule C with capital uses the separately source-bound actual business profit and current services allowance described below, rather than treating only the earned allowance as the full foreign profit."
    irsRef: "Reg1.911-3(b)(2); Instructions for Form2555 line20; Pub54 How To Report Deductions Example3, retrieved2026-11-01"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::limits earned income where capital is material"


  - line: "actual-business-expense-allocation"
    description: "Preserve actual foreign expenses and pro rata mixed-source exclusions"
    formula: "Reg1.911-6(a) and (d)Example2 require actual foreign expenses, not a guessed foreign gross ratio. For a mixed Schedule C with positive expenses collect actual foreign business expenses, original reference and confirmation; require0<=foreignExpenses<=totalExpenses and nonnegative foreign net profit. All-foreign or zero-total-expense sources derive their determined actual expenses. Foreign QBI profit is actual foreign gross less actual foreign expenses. Source exclusion is total FEIE times that source earned income over total FEI; business expense disallowance is foreign expenses times source exclusion over source foreign gross. Actual foreign self-employment deduction uses FEIE/totalFEI, without substituting capital net profit or capping the deduction at FEIE. Round the combined disallowance to the nearest dollar at line44, and compare it to the actual rounded reported line44; exact3354.65 and whole-dollar3355 both report3355, while3354.49 reports3354 and rejects. Missing capital classification remains unknown and rejects."
    irsRef: "26CFR1.911-6(a),(d)Examples1,2; Form2555 instructions PartVIII; Pub54 HowToReportDeductions Examples3,4; retrieved2026-11-01"
    testRef: "tests/engine/forms/form-2555-actual-expense-allocation.test.ts::preserves actual foreign expenses and pro rata mixed sources"

  - line: "zero-receipt-expense-control"
    description: "Reject actual foreign business expenses above actual foreign receipts even when another source supplies foreign earned income"
    formula: "A noncapital Schedule C row with zero current and prior foreign receipts and positive confirmed foreignBusinessExpenses requires its separate foreign-business-loss method and rejects the current route. Retain the row facts for validation; do not silently skip the contradiction because the foreign income is zero."
    testRef: "tests/engine/forms/form-2555-actual-expense-allocation.test.ts::rejects positive foreign expenses on a zero foreign receipt source"

  - line: "signed-worksheet-source"
    description: "Bind signed Form2555 amounts used by Schedule1 and credit MAGI worksheets"
    formula: "Legacy unbound exclusions stay nonnegative. Negative45 requires the actual confirmed Form2555 result, unique finite43,44,45,50auditlines, actual prior statement amount,43-44+prior=45, matching resultaliases and exact45+50. Schedule8812line2b, Form8839line7 and Form8962Worksheet1-1line3 copy signed45+50. Never clamp tozero."
    irsRef: "2025Schedule8812line2b; Instructions8839line7; Instructions8962Worksheet1-1line3; Pub54Example4; retrieved2026-11-01"
    testRef: "tests/engine/forms/form-2555-actual-expense-allocation.test.ts::binds signed worksheet sources and rejects altered or unbound negatives"
