form: "Form2555 source binding"
fullName: "Actual owner and income-source conservation for foreign earned income"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i2555"
notes: "PartsI/IV and the prior-year statement represent one taxpayer's actual foreign services and receipts. This resolver does not determine residence eligibility or replace the existing exclusion calculation. Historical2025 source-free previews remain unverified."
lines:
  - line: "owner-and-original-source"
    description: "Bind actual foreign-income amounts to one taxpayer and original income sources"
    formula: "Require actual owner, source year, source reference, completeness and one-owner confirmation. Canonical W2 indices bind original employer name/EIN/year/owner. ScheduleC binds the actual business name/owner and canonical gross income sources. Unknown or changed source facts reject; multiple taxpayers need separate forms."
    irsRef: "Form2555 PartI and instructions PartsIV/VII; married taxpayers file separate forms"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::binds actual owner year and canonical source identity"
  - line: "current-and-prior-conservation"
    description: "Keep current services and prior-year receipts separate and already included"
    formula: "Exact current rows reconcile each classified incomeSources amount and the actual PartIV business/partnership categories. Exact prior rows reconcile actual prior-year income received; current plus prior portions may not exceed the same original W2 wages or ScheduleC gross income. Prior exclusion cannot remove income absent from the return. Duplicate or aliased source IDs reject."
    irsRef: "Form2555 PartIV and instructions Income earned in prior year"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::conserves exact current and prior receipts without duplicate income"
  - line: "business-context"
    description: "Resolve business receipts from the canonical ScheduleC source"
    formula: "Use actual grossReceipts when present, otherwise the same included NEC sum used by ScheduleC; subtract returns/allowances and COGS and add actual other income to establish the gross-income bound. Require actual source snapshots of all four amounts, including zero, and reconcile them to canonical inputs before using the bound. Match actual business owner and identity. Do not accept caller profit or net-income overrides."
    irsRef: "Form2555 line20 and ScheduleC lines1-7"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::binds business amounts to actual canonical receipts"
  - line: "employment-outside-w2"
    description: "Preserve actual separately reported foreign employment"
    formula: "Original non-W2 employment sources require distinct source identifiers, actual year/owner/payer/reference and explicit confirmation that they are absent from W2. Their current amounts reconcile only foreignEmploymentIncomeNotOnW2, which the canonical return adds once to1040line1h. Prior non-W2, K1 and other positive mappings retain explicit unsupported source methods."
    irsRef: "Form2555 PartIV; Form1040line1h; prior-year foreign-income statement"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::requires actual separate employment and rejects unsupported mappings"
  - line: "unknown-and-legacy"
    description: "Do not turn absent source ownership or amounts into verified facts"
    formula: "An actual source route requires all source amounts including zero, complete mapping and known owner. Strict2026 rejects absent mapping. Historical2025 omitted mapping remains explicitly unverified and does not manufacture a source owner or ledger. All monetary conservation uses Decimal."
    irsRef: "Form2555 source records and income included in gross income"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::preserves unknown legacy sources and rejects incomplete actual records"
  - line: "canonical-handoff"
    description: "Validate source binding before calculating the exclusion"
    formula: "Synthetic2025 single160000 wages with actual120000 foreign wages retains gross wages160000, excludes120000 once, producesAGI40000 and taxable24250, and uses foreign stacking tax5820. Changing owner/year/source wages rejects; actual separate foreign employment produces the same income once."
    irsRef: "Form1040lines1a/1h; Schedule1line8d; Foreign Earned Income Tax Worksheet"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::validates actual sources before canonical exclusion and tax stacking"
  - line: "joint-source-boundary"
    description: "Bind a spouse claim to the actual joint spouse without reallocating household income"
    formula: "A single spouse Form2555 may bind that spouse's original W2 on a joint return. A primary W2, absent spouse or nonjoint status cannot establish the same source. Actual2026 source rows retain their original year and identity."
    irsRef: "Form2555 PartI and instructions Married couples"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::supports one actual spouse source and rejects household substitution"
  - line: "source-integrity"
    description: "Validate complete source identities and amount boundaries before arithmetic"
    formula: "Known zero is valid. Missing, blank, negative or nonfinite source amounts, source references and category amounts reject; separately named foreign employment cannot duplicate the same receipt reference. Prior received income must reconcile before any exclusion."
    irsRef: "Form2555 PartIV and income earned in prior year statement"
    testRef: "tests/engine/forms/form-2555-source-binding.test.ts::rejects missing and contradictory original receipt facts"
