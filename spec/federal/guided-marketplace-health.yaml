form: "Guided Marketplace health insurance sources"
fullName: "Actual policy, premium and person links for the Pub974 health deduction"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p974"
notes: "Source intake for2025 and2026; canonical business income and the applicable Pub974 method determine deductions. No profit, MAGI or final credit override. Form7206 instructions distinguish employer eligibility from actual PTC eligibility."
lines:
  - line: "policy-links"
    description: "Bind each actual health plan to its original Marketplace policies"
    formula: "Use unique original form1095A indices, actual matching source years and confirmed coverage-family membership. Actual original monthly premiums and advances equal linked dated payments, with no omitted source months or inferred amounts."
    testRef: "tests/guided-interview/guided-marketplace-health.test.ts::binds actual policy months without inventing premium sources"
  - line: "premium-shares"
    description: "Preserve gross premium, paid amounts and advance credit separately"
    formula: "Original gross premium equals owner/business paid plus other-person paid plus actual advance credit. Person paid shares and person advances separately reconcile; missing advance is unknown and explicit zero is valid. Unsupported outside-payer and distinct funding allocation remains explicit."
    testRef: "tests/guided-interview/guided-marketplace-health.test.ts::conserves actual person advances and retains unknown versus zero"
  - line: "employer-offer"
    description: "Distinguish employer-plan deduction ineligibility from actual PTC exceptions"
    formula: "If subsidized employer eligibility coexists with actual eligible PTC coverage, require actual unaffordability or minimum-value exception, no enrollment, and the source reference. Do not infer an exception from receiving advance credit."
    testRef: "tests/guided-interview/guided-marketplace-health.test.ts::requires actual employer offer evidence and preserves known ineligibility"
  - line: "canonical"
    description: "Transfer original sources into the actual coordinated return once"
    formula: "2025 profit50000 gives SE deduction3533, W16=2400 and X25=975. Maximum3375 leads to health deduction2344, final AGI44123, credit3494 and repayment106. Source-only validation produces no proposed business profit or deduction."
    testRef: "tests/guided-interview/guided-marketplace-health.test.ts::calculates the actual guided Marketplace deduction and credit once"
  - line: "controls"
    description: "Collect actual links and separate advance amounts through user controls"
    formula: "Selecting existing policies preserves original identity. New payment/person advance and employer-exception fields start unknown, preserve zero and false, and revoke confirmation after edits. Removing a policy retains unresolved saved links for reconciliation."
    testRef: "tests/apps/web/marketplace-health-interactions.test.tsx::collects policy links and actual advances without creating eligibility"
  - line: "source-boundaries"
    description: "Preserve actual timing and funding boundaries"
    formula: "Wrong payment years, duplicate policy links, positive outside-payer or distinct excluded funding and QSEHRA coordination require their actual separate methods. Known employer enrollment contradicts credit-eligible coverage even if a different employer answer says otherwise."
    testRef: "tests/guided-interview/guided-marketplace-health.test.ts::keeps policy timing and unsupported funding boundaries explicit"
  - line: "multiple-policies"
    description: "Keep actual policy identities and years across one health plan"
    formula: "Combine only linked original monthly premium and advance amounts, never their benchmark premiums. Preserve original policy IDs and current-year records through the2025 and2026 handoff."
    testRef: "tests/guided-interview/guided-marketplace-health.test.ts::preserves actual multiple-policy and2026 source identities"
