form: "AI-Evaluation-Application"
fullName: "Actual application evaluation and deterministic context preflight"
taxYear: 2026
reference: "docs/upgrade-2026-execution-brief.md; https://developers.openai.com/api/docs/guides/structured-outputs"
notes: |
  Frozen synthetic request context is authored independently from golden outputs.
  It does not establish a real tax-engine receipt, provider availability or human
  qualification. Provider schema/grounding metrics use the actual application
  payload. Deterministic preflight outcomes are separate from paid model runs.
lines:
  - line: "actual-wire"
    description: "Send and validate the actual task schema"
    formula: "No applicationOutput string or model-authored normalized sidecar is requested; actual output supplies source facts and citations."
    testRef: "tests/engine/provider-eval-application.test.ts::uses actual task JSON and derives observations without a sidecar"
  - line: "scorer"
    description: "Recompute application validity and normalized observations"
    formula: "Reparse actual payload using the current task schema and frozen source context; claimed flags or fields cannot establish a passing result."
    testRef: "tests/engine/provider-eval-application.test.ts::refuses forged passing flags and normalized fields without valid actual output"
  - line: "synthetic-context"
    description: "Source and audit context remains distinct from golden answers"
    formula: "Transmit explicit fixture request context and requested field names only, never expected values or human review criteria; wrong-year context rejects before dispatch."
    testRef: "tests/engine/provider-eval-application.test.ts::keeps authored request context independent from expected answers"
  - line: "preflight"
    description: "Missing or conflicting verified context does not create a provider measurement"
    formula: "Persist deterministic preflight reason separately; no transport, usage, schema validity or provider quality result is invented."
    testRef: "tests/engine/provider-eval-application.test.ts::records deterministic preflight separately without any paid request"
  - line: "privacy-cost"
    description: "Failed application output preserves known costs without unsafe content"
    formula: "Source/schema/privacy failures remain nonpassing; unsafe output is discarded and reported usage remains billable."
    testRef: "tests/engine/provider-eval-application.test.ts::retains real usage when application grounding fails"
  - line: "draft-contract"
    description: "Every frozen draft has an explicit compatible request boundary"
    formula: "All eight task shapes and declared source values validate against actual contracts; missing-context cases remain deterministic, all human reviews remain pending. This is a software cross-check, not independent oracle review."
    testRef: "tests/engine/provider-eval-application.test.ts::checks every draft against its application contract without simulating a provider review"
  - line: "preflight-replay"
    description: "Deterministic outcomes cannot bypass context or repeat identity"
    formula: "Revalidate preflight reasons against the frozen input, reject duplicate/mixed paid outcomes and preserve zero-dispatch replay."
    testRef: "tests/engine/provider-eval-application.test.ts::rejects forged preflight evidence and resumes without fabricated measurements"
  - line: "corpus-provenance"
    description: "Measured and deterministic results bind to the actual current request corpus"
    formula: "Recompute the complete corpus and individual fixture digest including request context and expected contract, excluding human review metadata; stale or missing bindings cannot count as qualification. Plan digest remains correlation, not proof of live authorization."
    testRef: "tests/engine/provider-eval-application.test.ts::rejects stale corpus and changed request context for model and preflight results"
  - line: "reported-model"
    description: "The actual responding model must match the final attempted profile"
    formula: "Use one explicit documented alias/snapshot allowlist in dispatch and scoring; reject missing, other-model or guessed-suffix identity, including incorrect identity after Sol High escalation. Preserve known billed attempt costs without qualifying the result."
    testRef: "tests/engine/provider-eval-application.test.ts::requires the final attempted model identity while retaining incurred costs"
