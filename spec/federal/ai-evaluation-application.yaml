form: "AI-Evaluation-Application"
fullName: "Actual application evaluation and deterministic context preflight"
taxYear: 2026
reference: "docs/upgrade-2026-execution-brief.md; https://developers.openai.com/api/docs/guides/structured-outputs"
notes: |
  Frozen synthetic request context is authored independently from golden outputs.
  It does not establish a real tax-engine receipt, provider availability or human
  qualification. Provider schema/grounding metrics use the actual application
  payload. Deterministic preflight outcomes are separate from paid model runs.
lines:
  - line: "actual-wire"
    description: "Send and validate the actual task schema"
    formula: "No applicationOutput string or model-authored normalized sidecar is requested; actual output supplies source facts and citations."
    testRef: "tests/engine/provider-eval-application.test.ts::uses actual task JSON and derives observations without a sidecar"
  - line: "scorer"
    description: "Recompute application validity and normalized observations"
    formula: "Reparse actual payload using the current task schema and frozen source context; claimed flags or fields cannot establish a passing result."
    testRef: "tests/engine/provider-eval-application.test.ts::refuses forged passing flags and normalized fields without valid actual output"
  - line: "scorer-token-budget"
    description: "Apply the frozen task token ceilings to every evaluated attempt"
    formula: >-
      Each attempt for a fixture, including an explicit Sol High escalation,
      must fit the fixture task's input and total output ceilings. A distinct
      complex-reconciliation fixture uses its own task ceilings. A structurally
      valid payload from an over-budget chain cannot count toward completion,
      schema validity, critical-field accuracy, or eligibility for promotion
      review. Retain the exact cost of reported, priceable tokens from every
      billed attempt. Unknown or inconsistent usage cannot establish a pass.
    testRef: "tests/engine/provider-model-eval.test.ts::blocks an over-budget held-out attempt while retaining exact cost"
    testRefs:
      - "tests/engine/provider-model-eval.test.ts::applies the same fixture budget to the initial and Sol High attempts"
  - line: "synthetic-context"
    description: "Source and audit context remains distinct from golden answers"
    formula: "Transmit explicit fixture request context and requested field names only, never expected values or human review criteria; wrong-year context rejects before dispatch."
    testRef: "tests/engine/provider-eval-application.test.ts::keeps authored request context independent from expected answers"
  - line: "preflight"
    description: "Missing or conflicting verified context does not create a provider measurement"
    formula: "Persist deterministic preflight reason separately; no transport, usage, schema validity or provider quality result is invented."
    testRef: "tests/engine/provider-eval-application.test.ts::records deterministic preflight separately without any paid request"
  - line: "privacy-cost"
    description: "Failed application output preserves known costs without unsafe content"
    formula: "Source/schema/privacy failures remain nonpassing; unsafe output is discarded and reported usage remains billable."
    testRef: "tests/engine/provider-eval-application.test.ts::retains real usage when application grounding fails"
  - line: "draft-contract"
    description: "Every frozen draft has an explicit compatible request boundary"
    formula: "All eight task shapes and declared source values validate against actual contracts; missing-context cases remain deterministic, all human reviews remain pending. This is a software cross-check, not independent oracle review."
    testRef: "tests/engine/provider-eval-application.test.ts::checks every draft against its application contract without simulating a provider review"
  - line: "preflight-replay"
    description: "Deterministic outcomes cannot bypass context or repeat identity"
    formula: "Revalidate preflight reasons against the frozen input, reject duplicate/mixed paid outcomes and preserve zero-dispatch replay."
    testRef: "tests/engine/provider-eval-application.test.ts::rejects forged preflight evidence and resumes without fabricated measurements"
  - line: "corpus-provenance"
    description: "Measured and deterministic results bind to the actual current request corpus"
    formula: "Recompute the corpus and fixture digests including request context and the expected contract, excluding human review metadata. Reject stale or missing bindings. A tax-explanation result using the prior prompt cannot qualify even when the output schema is unchanged. A plan digest correlates evidence without establishing live authorization."
    testRef: "tests/engine/provider-eval-application.test.ts::rejects stale corpus and changed request context for model and preflight results"
  - line: "reported-model"
    description: "The actual responding model must match the final attempted profile"
    formula: "Use one explicit documented alias/snapshot allowlist in dispatch and scoring; reject missing, other-model or guessed-suffix identity, including incorrect identity after Sol High escalation. Preserve known billed attempt costs without qualifying the result."
    testRef: "tests/engine/provider-eval-application.test.ts::requires the final attempted model identity while retaining incurred costs"
  - line: "report-cutoff"
    description: "Score dated evidence as of the inclusive report instant"
    formula: >-
      Validate the entire input before applying the requested report timestamp,
      or the current instant by default. Include deterministic preflights and
      capability checks only when their recorded timestamps are at or before
      that instant. Exclude the entire measurement if any recorded attempt
      starts later. Apply the same evidence set to counts, scores, costs,
      response references and baseline comparisons. An independent fixture
      review must be at or before the preflight or attempt. A capability
      interval must be positive and at most 30 days. An attempt must be at or
      after the capability check and strictly before its expiry. Compare full
      timestamp precision and interpret date-only fixture reviews as UTC
      midnight. Do not infer completion or response-review timestamps from
      attempt starts.
    testRef: "tests/engine/provider-model-eval.test.ts::applies one inclusive reporting cutoff to dated evidence and baseline comparisons"
    testRefs:
      - "tests/engine/provider-model-eval.test.ts::keeps submillisecond case reviews and capability windows in event order"
      - "tests/engine/provider-model-eval.test.ts::enforces positive capability windows up to exactly 30 days"
  - line: "response-review-cutoff"
    description: "Independent response review is usable as of its actual timestamp"
    formula: >-
      Retain legacy undated response reviews for inspection. Count accepted or
      complete qualification evidence only when the independent human review has
      an explicit timestamp at or before the report cutoff and at or after both
      the final attempt start and the first attempt start plus measured logical
      latency, including fractional milliseconds. Preserve known costs and
      conservative safety flags for undated, premature or later reviews.
    testRef: "tests/engine/provider-model-eval.test.ts::counts only dated response reviews that follow the measured result and meet the report cutoff"
  - line: "attempt-timing"
    description: "Qualification latency spans the logical task and any escalation"
    formula: >-
      The second attempt cannot start before the first. Measured elapsed time
      must cover at least the span between attempt starts, including reported
      submillisecond precision. Equal start stamps are allowed at the recorded
      precision. Exclude incoherent measurements from latency percentiles and
      promotion eligibility while preserving exact incurred costs for every
      attempt. Keep the predeclared P50 and P95 thresholds.
    testRef: "tests/engine/provider-model-eval.test.ts::blocks a full held-out cohort with understated escalation latency while retaining exact costs"
    testRefs:
      - "tests/engine/provider-model-eval.test.ts::checks escalation chronology at submillisecond precision"
  - line: "comparison-evidence-coherence"
    description: "Require a coherent qualification comparison with distinct private response references"
    formula: >-
      For each candidate and both baseline comparisons, all qualification
      model and deterministic preflight rows for that task must share one
      exact plan digest. Each claimed completed provider measurement must
      carry a distinct opaque SHA-256 reference to the provider response;
      duplicate references anywhere in the qualification report as of its cutoff
      cannot count toward a candidate's eligibility. Report cost and
      diagnostics for incomplete or conflicting evidence. Digests correlate
      records. Authorization, authentic provider history and independent
      human review require external evidence. A fully measured baseline may
      contribute to the quality comparison when its only rejected responses
      otherwise meet every acceptance criterion and an independent human
      explicitly marked their quality as unacceptable. Keep these responses
      rejected in baseline metrics and diagnostics. Preserve every other
      baseline and candidate gate, including grounding, independent review,
      safety, exact fields, appropriate answer or abstention, usage and coverage.
    testRef: "tests/engine/provider-model-eval.test.ts::blocks mixed plans and missing or reused provider responses without dropping spend"
    testRefs:
      - "tests/engine/provider-model-eval.test.ts::qualifies a measured quality gain against both cheaper baselines"
      - "tests/engine/provider-model-eval.test.ts::requires grounded independent baseline reviews and candidate acceptance for the quality comparison"
