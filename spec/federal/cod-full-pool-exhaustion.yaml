form: "COD complete current-tax NOL pool exhaustion"
fullName: "Exact complete independent section108 pools with no surviving loss attribute"
taxYear: 2025
irsReference: "https://uscode.house.gov/us/usc/119-118/t26/s108/"
sources:
  - url: "https://uscode.house.gov/us/usc/119-118/t26/s108/"
    section: "108(b)(2)(A), (b)(3)(A), (b)(4): current-year tax first, then dollar-for-dollar NOL attribute reduction"
    retrieved: "2026-11-06"
  - url: "https://www.govinfo.gov/content/pkg/CFR-2025-title26-vol2/pdf/CFR-2025-title26-vol2-sec1-108-7.pdf"
    section: "1.108-7(a)-(b): ordered attribute reduction after taking carryovers into account for current tax"
