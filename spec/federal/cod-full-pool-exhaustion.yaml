  - url: "https://www.irs.gov/publications/p4681"
    section: "All other tax attributes item1: carryover to2025 after taxable-income use, earliest loss first, never below zero"
    retrieved: "2026-11-06"
  - url: "https://uscode.house.gov/us/usc/119-118/t26/s172/"
    section: "172(a)(2), (b)(2), (d)(2): separate current deduction and modified-income carry absorption"
    retrieved: "2026-11-06"
  - url: "https://uscode.house.gov/us/usc/119-118/t26/s1017/"
