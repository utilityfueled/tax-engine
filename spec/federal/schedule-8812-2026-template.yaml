  - line: "physical-locations"
    description: "Bind every original leaf to its annual physical cell"
    formula: "Require a bijection for all 41 leaf widgets, 35 text and six checkboxes, including the nested line 6 count, the two line 16b cells, and the reserved read-only line 15. Verify full names, field types, pages, rectangles and the native on-state of each button."
