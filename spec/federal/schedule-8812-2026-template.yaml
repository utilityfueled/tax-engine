  - line: "annual-printed-references"
    description: "Record the revised 2026 lines 1 and 22 without creating a calculation mapping"
    formula: "Line 1 points to Form 1040, 1040-SR or 1040-NR line 11b rather than 11a. Line 22 retains Schedule 1 line 15 and points to Schedule 2 lines 16c and 17c rather than lines 5, 6 and 13. Printed maximum child credit $2200, refundable amount per child $1700 and other-dependent credit $500 remain the observed amounts. Rev. Proc. 2025-32 section 2.05 corroborates the first two."
    testRef: "tests/pdf/schedule-8812-2026-candidate.test.ts::records the annual printed transfer references and amounts"
  - line: "saved-diagnostics"
    description: "Save and reopen two fictional physical probes"
    formula: "Verify every writable leaf, all six on and off checkbox appearances, the unfilled reserved line, and the review notice on each page after saving and reopening. Probe cells independently without interpreting any sample as a taxpayer calculation."
    testRef: "tests/pdf/schedule-8812-2026-candidate.test.ts::retains diagnostic values and both states of every checkbox after save"
  - line: "closed-exports"
    description: "Keep public review and filing disabled"
    formula: "The versioned candidate is separate from the qualified review and filing packs. The 2026 physical source fails the 2025 hash allowlist and public 2026 review and filing requests remain denied."
    testRef: "tests/pdf/schedule-8812-2026-candidate.test.ts::keeps every export gate closed"
  - line: "wage-only-projection"
    description: "Fill the disabled financial specimen from a confirmed wage-only annual source packet"
    formula: "Require a confirmed 2026 Form 1040, one or two source-reviewed qualifying children, no other dependents, confirmed absence of foreign or possession adjustments, no Worksheet B or Puerto Rico method, a confirmed Worksheet A line 5, and complete matching original W-2 Box 1 and Code Q. Verify that line 11b equals actual taxable Box 1 wages. Use the 2026 Schedule 8812 calculator and actual Code Q once. Compare exact and displayed-dollar calculation paths, refusing discrepancies in the phaseout, ACTC income threshold, or transferred credits. Respect the printed line 12, 16a and 19 stops. Keep identity, reserved line 15 and Part II-B blank."
    irsRef: "https://www.irs.gov/pub/irs-prior/f1040s8--2026.pdf; https://www.irs.gov/pub/irs-dft/i1040s8--dft.pdf; https://www.irs.gov/pub/irs-efile/ty26-1040-ats-scenario-14.pdf"
    testRef: "tests/pdf/schedule-8812-2026-candidate.test.ts::Final 2026 Schedule 8812 wage-only specimen"
