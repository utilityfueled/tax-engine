form: "AI-Provider-Refresh"
fullName: "Dated public provider sources and retired-model execution boundaries"
taxYear: 2026
reference: "https://developers.openai.com/api/docs/pricing; https://developers.openai.com/api/docs/deprecations; https://ai.google.dev/gemini-api/docs/pricing; https://ai.google.dev/gemini-api/docs/deprecations; https://aistudio.google.com/api-reference/generate-content; https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta"
notes: |
  Public model documentation is not evidence of actual account access, retention
  settings, quality or availability. Preserve the requested baseline even when
  retired; do not silently substitute or weaken qualification gates. Published
  shutdown dates have no stated hour, so new requests stop from 00:00 UTC that day.
  Historical usage remains priced; January projections for a retired model are
  explicitly hypothetical. The known December 11, 2026 GPT-5 Mini shutdown
  applies to both alias and its documented August 7, 2025 snapshot.
  The ProtoJSON serialization rules permit omitting zero-valued counters
  without explicit field presence. See https://protobuf.dev/programming-guides/json/#presence-and-default-values.
lines:
  - line: "public-facts"
    description: "Refresh documentation without inventing account capability results"
    formula: "Record official model IDs, endpoint/schema/effort documentation and lifecycle sources as retrieved October 25, 2026; every actual account availability remains unverified."
    testRef: "tests/engine/ai-provider-refresh.test.ts::keeps public capabilities separate from actual account evidence"
  - line: "retired-plan"
    description: "A retired baseline cannot start a new approved request plan"
    formula: "Reject plans created on or after the published shutdown date while preserving the existing pre-shutdown baseline and its historical price."
    testRef: "tests/engine/ai-provider-refresh.test.ts::rejects a retired baseline plan without replacing the requested model"
  - line: "retired-dispatch"
    description: "An active run stops when its model reaches shutdown"
    formula: "Check the actual dispatch date before every durable paid dispatch, including a run crossing midnight; keep completed capability usage and do not dispatch the next case."
    testRef: "tests/engine/ai-provider-refresh.test.ts::stops at the shutdown boundary while retaining earlier charges"
  - line: "retired-measurement"
    description: "Imported records cannot qualify a post-shutdown request"
    formula: "A post-shutdown measurement remains nonqualifying while known recorded attempt cost is retained; pre-shutdown records remain separately eligible for ordinary review."
    testRef: "tests/engine/ai-provider-refresh.test.ts::retains historical cost but rejects post-shutdown quality evidence"
  - line: "dated-costs"
    description: "Current and filing-season prices remain exact and explicitly dated"
    formula: "Preserve October 24 effective prices and the announced January 1 Gemini rate change; refresh retrieval date only and label retired-baseline January cost as historical-price projection."
    testRef: "tests/engine/ai-provider-refresh.test.ts::preserves exact effective prices and labels retired January projections"
  - line: "unsupported-region"
    description: "A price source URL is not the provider identity"
    formula: "Reject unconfigured Google regional charges for both current and legacy Flash models using the explicit price provider, even when their documentation URLs differ."
    testRef: "tests/engine/ai-provider-refresh.test.ts::rejects unpriced Google regional usage regardless of the source URL"
  - line: "hosted-provider-hold"
    description: "Bound the authorized hosted hold before dispatch"
    formula: "Price the full input and output ceilings using the most expensive supported input token treatment and regional uplift. Hold the rounded retail ceiling while settling only actual usage. For 24,000 input and 8,192 output Sol tokens the upper bound is $0.222112 or 23 cents."
    testRef: "tests/apps/web/ai-task-adapter.test.ts::reserves the highest priced Sol usage before dispatch"
  - line: "application-dispatch-price-cutoff"
    description: "Use the price in effect when the application dispatches a provider request"
    formula: >-
      Price the bound before awaiting the ledger reservation. Once the
      reservation is ready, recheck the selected model's effective price
      immediately before dispatch. If the price changed while waiting, release
      the hold as undispatched and return the deterministic fallback. Apply
      the recorded price only when the dispatch still uses the same price
      period. A new attempt admitted under the new price uses that price.
      A cancellation during hold release propagates after the release.
    testRef: "tests/apps/web/ai-task-adapter.test.ts::releases the Gemini hold if reservation crosses the price cutoff"
    testRefs:
      - "tests/apps/web/ai-task-adapter.test.ts::propagates cancellation during the cutoff hold release"
  - line: "hosted-escalation-hold"
    description: "Reserve both potential attempts when escalation is explicitly approved"
    formula: "Add the independent Sol High hold for 24,000 input and 16,384 output tokens, including supported cache writes and regional uplift. Its $0.312224 upper bound rounds to 32 cents, for 33 cents including a one-cent first attempt."
    testRef: "tests/apps/web/hosted-ai-task-accounting.test.ts::requires explicit approval for escalation and reserves both possible attempts upfront"
  - line: "hosted-escalation-remaining-hold"
    description: "Check the remaining authorized spend before starting Sol High"
    formula: "Under the owner lock, add the first rejected attempt's exact known provider cost to the second task's full cost bound at its dispatch-time price. If their sum exceeds the existing hold, finalize the first attempt alone, release unused credits, and return deterministic fallback without inserting or dispatching another attempt. Preserve any first-attempt overrun for reconciliation. Concurrent or repeated escalation requests on the same finalized single rejection return the same fallback. If their sum fits, permit the approved escalation and round the combined actual cost once at final settlement."
    testRef: "tests/apps/web/hosted-ai-ledger.test.ts::bounds Sol High dispatch against the exact remaining authorized hold ($caseName)"
  - line: "provider-attempt-reference"
    description: "Keep arbitrary provider metadata outside hosted accounting"
    formula: "For OpenAI prefer its request header to the body response identifier. Retain only bounded opaque values in the documented example formats, with a direct identifier check. Ignore malformed optional metadata without losing known usage or rejecting the response. Do not trust an OpenAI-specific header on other providers."
    testRef: "tests/apps/web/ai-task-adapter.test.ts::uses only a safe provider identifier without losing known usage"
  - line: "provider-failure-reference"
    description: "Keep reconciliation metadata free of arbitrary upstream strings"
    formula: "On OpenAI HTTP errors retain a bounded request identifier from the documented response header. Leave the identifier absent if the value is unsafe. Continue holding unknown usage."
    testRef: "tests/apps/web/ai-task-adapter.test.ts::holds unknown usage without retaining arbitrary error response headers"
  - line: "openai-usage-total"
    description: "Reconcile reported OpenAI token totals and service tier"
    formula: >-
      Require valid input and output counts. If reported, total_tokens must be
      a nonnegative safe integer and equal the exact sum of input and output
      counts. Cached and reasoning tokens are already included in their
      respective counts. When supplied, the reasoning counter must be a
      nonnegative safe integer no greater than the output count, as described in
      https://developers.openai.com/api/reference/resources/responses/methods/create.
      An absent total or reasoning detail preserves existing pricing. Malformed
      or contradictory token counts leave usage unknown, with no accepted output,
      settlement or retry in either transport. Retain the existing provider
      response reference for reconciliation. Accept an omitted service_tier
      or an explicit default. Any other supplied value, including an empty
      string, leaves usage unknown under the same rules.
    testRef: "tests/apps/web/ai-task-adapter.test.ts::reconciles reported OpenAI totals before settling usage"
    testRefs:
      - "tests/engine/provider-eval-transport.test.ts::reconciles reported OpenAI totals before returning evaluation usage"
      - "tests/apps/web/ai-task-adapter.test.ts::holds OpenAI usage for an unpriced reported service tier"
      - "tests/engine/provider-eval-transport.test.ts::holds OpenAI evaluation usage for an unpriced reported service tier"
  - line: "visible-output-usage"
    description: "Reconcile completed generated text with the reported output tokens"
    formula: >-
      When a response completes with nonblank generated text, its reported
      counts cannot establish zero tokens for that text. For OpenAI, hold
      the usage when the output count is zero or the reported reasoning
      count equals the full output count. For Gemini, reasoning tokens are
      reported separately and cannot substitute for a positive candidate
      count. An omitted OpenAI reasoning count with positive output is not
      contradictory. In either transport, leave contradictory usage unknown
      without settling or retrying and retain the available provider reference
      for reconciliation. Preserve known usage for refusals, prompt blocks,
      and responses with no generated text.
    irsRef: "https://developers.openai.com/api/reference/resources/responses/methods/create; https://aistudio.google.com/api-reference/generate-content"
    testRef: "tests/apps/web/ai-task-adapter.test.ts::holds completed provider text with provably zero visible output tokens"
    testRefs:
      - "tests/engine/provider-eval-transport.test.ts::holds completed evaluation text with provably zero visible output tokens"
      - "tests/apps/web/ai-task-adapter.test.ts::preserves consistent usage when reported visible output is permitted"
      - "tests/engine/provider-eval-transport.test.ts::preserves consistent evaluation usage when reported visible output is permitted"
  - line: "gemini-rejected-usage"
    description: "Settle reported usage when Gemini omits candidate content"
    formula: "For one Gemini candidate, allow absent content when usage is complete and valid. Accept only normal completion with valid structured and grounded text. Settle known rejected usage once without another provider dispatch. At November 2026 rates, 1,000 input tokens with 200 cached reads and 100 candidate plus 900 thought tokens cost $0.004365 and one retail cent."
    testRef: "tests/apps/web/ai-task-adapter.test.ts::settles exact Gemini usage for rejected or missing candidate content"
  - line: "gemini-unknown-usage"
    description: "Retain the hold when rejected Gemini usage is missing or invalid"
    formula: "Missing or malformed required usage remains unknown even when the candidate has a terminal finish reason. Keep the hold for reconciliation without another provider dispatch."
    testRef: "tests/apps/web/ai-task-adapter.test.ts::keeps missing or malformed Gemini usage unknown after one dispatch"
  - line: "pricing-utc-day"
    description: "Rate selection uses a reproducible UTC day"
    formula: "Interpret an actual YYYY-MM-DD calendar date as a UTC date. Require an explicit UTC designator or numeric offset for a timestamp, then convert the instant to UTC before selecting the effective rate. Reject ambiguous local timestamps, invalid days and rollover times before calculating cost."
    testRef: "tests/packages/engine/ai-task-registry.test.ts::requires an actual calendar date and explicit timestamp offset for pricing"
  - line: "gemini-pricing-reconciliation"
    description: "Validate the reported Gemini pricing treatment and token total"
    formula: "Support absent, standard and unspecified serviceTier in usageMetadata. Hold any other supplied tier or nonzero toolUsePromptTokenCount for reconciliation. When totalTokenCount is supplied, require the exact sum of prompt, tool-use prompt, thought and candidate tokens. Cached tokens are already part of the prompt and are not counted again. Keep the required counts strict."
    testRef: "tests/apps/web/ai-task-adapter.test.ts::reconciles reported Gemini tier and totals before settling usage"
  - line: "gemini-prompt-block-usage"
    description: "Settle known usage on a documented Gemini prompt rejection"
    formula: "Allow absent or empty candidates with a recognized promptFeedback.blockReason and complete supported usage in the same response. Settle as rejected when the candidate token count is explicitly zero or omitted with a reported total equal to prompt tokens plus any reported thought tokens. An absent or unspecified block reason, an unknown reason, a contradictory candidate or incomplete usage still requires reconciliation."
    testRef: "tests/apps/web/ai-task-adapter.test.ts::settles reported usage on a documented Gemini prompt block"
  - line: "gemini-evaluation-usage"
    description: "Apply the same Gemini billing checks in provider evaluations"
    formula: "Retain known rejected token usage for a documented prompt block, including a candidate counter omitted with a reported total that establishes zero candidate tokens. Treat unsupported or contradictory pricing metadata as unknown and never produce a successful evaluation response from that usage."
    testRef: "tests/engine/provider-eval-transport.test.ts::applies Gemini billing checks to blocked evaluation responses"
  - line: "cancel-before-dispatch"
    description: "Distinguish cancellation during reservation from ambiguous provider usage"
    formula: "Check cancellation again after the reservation and immediately before invoking the provider transport. Explicitly close an attempt when the transport was never invoked. Preserve the unknown-usage hold if cancellation follows the transport invocation."
    testRef: "tests/apps/web/ai-task-adapter.test.ts::records an undispatched cancellation after reservation without invoking transport"
  - line: "cancel-during-escalation-refusal"
    description: "Propagate cancellation when insufficient credits preclude a second attempt"
    formula: "If the request aborts during an escalation refusal, propagate the abort with no cancellation write for the attempt that was never registered and no provider dispatch."
    testRef: "tests/apps/web/ai-task-adapter.test.ts::propagates cancellation during an escalation refusal without writing an undispatched attempt"
  - line: "undispatched-hold"
    description: "Release unused credits without inventing provider usage"
    formula: "Under the owner lock, cancel a never-dispatched first attempt with zero exact provider cost and zero retail debit. If the authorized second attempt was never dispatched, retain the first reported cost and settle that charge once. Leave other owners, disputed provider usage and final replay outcomes intact."
    testRef: "tests/apps/web/hosted-ai-ledger.test.ts::releases an undispatched hold while preserving any exact first attempt cost"
  - line: "undispatched-migration"
    description: "Record cancellation after an additive schema migration"
    formula: "Keep the historical attempt states and all recorded usage. Add an optional timestamp for confirmed undispatched rejection. Its database check requires zero cost with no usage, pricing or provider reference and forbids marking a known successful attempt."
    testRef: "tests/apps/web/hosted-ai-ledger.test.ts::adds the undispatched marker without changing historical settled attempts"
  - line: "hosted-reconciliation-receipt"
    description: "Use each authoritative usage record for one dispatched attempt"
    formula: "Use an attempt-specific provider usage record reference. Ignore surrounding whitespace and serialize new claims on that reference across owners. Reject reuse by another attempt without adding a debit or releasing its hold. Permit idempotent replay of the original settlement and retain all historical charges."
    testRef: "tests/apps/web/hosted-ai-ledger.test.ts::settles an authoritative usage reference only once across concurrent owners"
  - line: "rollout-observation-binding"
    description: "Require reviewed results for the active candidate and stage before expansion"
    formula: "Before advancing from 5% or 25%, match the reviewed observation to the active task, profile, qualification report hash, stage, and rollout revision. A rollback and restart creates a new rollout revision. Keep the existing passing and zero observed safety failure requirements and preserve immediate rollback."
    testRef: "tests/apps/web/ai-rollout.test.ts::requires observations of the currently qualified rollout candidate"
