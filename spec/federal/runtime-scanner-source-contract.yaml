form: "Runtime-Scanner-Source-Contract"
fullName: "Pinned runtime image software inventory and vulnerability scanning"
taxYear: 2026
reference: "https://github.com/anchore/syft/releases/tag/v1.57.1; https://github.com/anchore/grype/releases/tag/v0.121.3; https://oss.anchore.com/docs/guides/vulnerability/database/"
notes: |
  Operational source contract. Syft 1.57.1 and Grype 0.121.3 are the
  November 9 maintenance releases with embedded dependency security fixes.
  Scanner changes retain the existing image source binding, evidence
  collection, and vulnerability severity policy.
lines:
  - line: "scanner-pins"
    formula: "The container job explicitly pins Syft v1.57.1 and Grype v0.121.3 and verifies the actual tool versions recorded in the evidence."
    testRef: "tests/runtime/runtime-scanner-source-contract.test.ts::pins and checks the exact patched Syft and Grype versions"
  - line: "scanner-source-and-threshold"
    formula: "Produce both SBOM formats from the immutable candidate. Bind the CycloneDX container identity and revision to the checked image config, bind the Grype source to the verified Syft source, and require the same verified input and inventory bytes after scanning. Reject ambiguous metadata, retain every reported match, and continue failing on critical findings."
    testRef: "tests/runtime/runtime-scanner-source-contract.test.ts::retains the immutable image binding and critical vulnerability policy"
  - line: "scanner-native-architecture"
    description: "Use one scanner binding for both native release workflows"
    formula: >-
      The AMD64 and native ARM64 workflows use the same pinned Syft and Grype actions and byte-binding verifier.
      Supply the expected architecture explicitly from each workflow. Require the inspected candidate, Syft
      metadata, config, selected OCI index entry, independent archive receipts and Grype source to agree with
      that architecture. ARM64 accepts absent, empty or v8 OCI variants; AMD64 accepts only absent or empty.
      Preserve the immutable candidate and revision, both SBOM formats, the existing binding receipt schema,
      the critical-finding gate, and evidence retention even when scanning fails.
    testRef: "tests/runtime/runtime-scanner-source-contract.test.ts::binds native ARM64 inventories and scan using the real verifier"
  - line: "archive-info-diagnostics"
    formula: "An owned native fresh-store info failure remains unverified and preserves its actual nonzero status before any image load. Retain only the first 8192 stderr bytes with explicit truncation and a generated-scratch placeholder; drain excess without retaining it. Capture successful info warnings too, but reject malformed or nonempty store metadata with all original immutable-image, native, capacity, import and cleanup gates unchanged."
    testRef: "tests/runtime/container-archive-diagnostics.test.ts::retains bounded owned info failure diagnostics without loading the archive"
  - line: "archive-short-owned-runroot"
    formula: "Use one exclusively created canonical /tmp directory with a fixed short generated basename, actual current owner and mode0700. The complete native Podman runroot must be at most50 characters regardless of RUNNER_TEMP or TMPDIR length; reject before export if not. Preserve the same exclusive root for all archive/store/temp data and remove only its unchanged device/inode/owner/mode identity. A foreign or symlink root or changed cleanup identity is never traversed/deleted and cannot yield verified import. All original diagnostics/native/source/capacity/import gates remain mandatory."
    testRef: "tests/runtime/container-archive-diagnostics.test.ts::uses a short exclusively owned runroot despite long runner and temporary paths"
  - line: "archive-capacity-boundary"
    formula: "Before export, require available bytes of at least (layer count + 2) times image bytes plus the one GiB margin on the owned scratch filesystem. One KiB below the exact required floor stops before any export or load. Mocked archive scenarios use explicit filesystem capacity, while each native scan checks the real scratch filesystem."
    testRef: "tests/runtime/container-archive-diagnostics.test.ts::holds archive export below the required scratch capacity"
  - line: "archive-loaded-image-diagnostics"
    formula: "Preserve the exact single loaded image ID, complete normalized image signature and unchanged archive hash gates. Record only fixed boolean or null outcomes and a fixed map of signature field equality, never config values, environment values, image names or command output. A failed ID check must not inspect another image; a signature mismatch must remain failed and retain its exact field comparisons. These diagnostics establish no cause beyond the actually observed predicate."
    testRef: "tests/runtime/container-archive-diagnostics.test.ts::retains exact signature mismatch predicates without exposing config values"
  - line: "image-identity-chain"
    formula: "Distinguish an immutable OCI index or manifest target digest from the selected native image config digest. Hash the exact exported target, uniquely select the explicitly required linux/amd64 or linux/arm64 platform, verify every selected manifest/config/layer descriptor and retain the chain. The standalone identity helper defaults to amd64; ARM64 requires an explicit architecture argument. ARM64 accepts only absent, empty or v8 OCI variant; AMD64 accepts only absent or empty variant. Require the imported config ID and every original signature field, unchanged archive bytes, source revision, and native platform. Independently rehash the retained target/manifest and Syft config before scanning; preserve original userInput and CycloneDX target identity. Missing, duplicate, foreign-platform, mismatched or ambiguous chains fail closed; equal RootFS alone never qualifies."
    testRef: "tests/runtime/container-image-identity.test.ts::verifies an OCI index and its distinct native config without conflating their digests"
  - line: "archive-native-platform"
    formula: "Derive only Linux x86_64 to amd64 or Linux aarch64 to arm64 from uname, and require the local Docker daemon, inspected candidate, exported config, uniquely selected OCI manifest, fresh local Podman host and imported signature to agree. No caller architecture override or emulation fallback is accepted. Record the derived platform in both receipts; preserve AMD64 invocation, exact source/image binding, capacity, independent empty vfs store and unchanged owned cleanup."
    testRef: "tests/runtime/container-archive-diagnostics.test.ts::verifies a native ARM64 archive in a fresh independent store"
  - line: "archive-config-variant"
    formula: "Apply the architecture variant allowlist to the resolved image config in every legacy Docker, direct OCI manifest and indexed OCI archive, as well as the selected index descriptor. ARM64 permits absent, empty or v8; AMD64 permits absent or empty. A v8 index descriptor never authorizes a v9 config, and an unsupported config variant produces no verified receipt. Preserve the default AMD64 selection and exact source, digest and cleanup gates."
    testRef: "tests/runtime/container-image-identity.test.ts::rejects a v9 config even when its ARM64 index descriptor declares v8"
