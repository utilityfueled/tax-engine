form: "Runtime-Scanner-Source-Contract"
fullName: "Pinned runtime image software inventory and vulnerability scanning"
taxYear: 2026
reference: "https://github.com/anchore/syft/releases/tag/v1.57.1; https://github.com/anchore/grype/releases/tag/v0.121.3; https://oss.anchore.com/docs/guides/vulnerability/database/"
notes: |
  Operational source contract. Syft 1.57.1 and Grype 0.121.3 are the
  November 9 maintenance releases with embedded dependency security fixes.
  Scanner changes retain the existing image source binding, evidence
  collection, and vulnerability severity policy.
lines:
  - line: "scanner-pins"
    formula: "The container job explicitly pins Syft v1.57.1 and Grype v0.121.3 and verifies the actual tool versions recorded in the evidence."
    testRef: "tests/runtime/runtime-scanner-source-contract.test.ts::pins and checks the exact patched Syft and Grype versions"
  - line: "scanner-source-and-threshold"
    formula: "Produce both SBOM formats from the immutable candidate. Bind the CycloneDX container identity and revision to the checked image config, bind the Grype source to the verified Syft source, and require the same verified input and inventory bytes after scanning. Reject ambiguous metadata, retain every reported match, and continue failing on critical findings."
    testRef: "tests/runtime/runtime-scanner-source-contract.test.ts::retains the immutable image binding and critical vulnerability policy"
  - line: "archive-info-diagnostics"
    formula: "An owned native fresh-store info failure remains unverified and preserves its actual nonzero status before any image load. Retain only the first 8192 stderr bytes with explicit truncation and a generated-scratch placeholder; drain excess without retaining it. Capture successful info warnings too, but reject malformed or nonempty store metadata with all original immutable-image, native, capacity, import and cleanup gates unchanged."
    testRef: "tests/runtime/container-archive-diagnostics.test.ts::retains bounded owned info failure diagnostics without loading the archive"
  - line: "archive-short-owned-runroot"
    formula: "Use one exclusively created canonical /tmp directory with a fixed short generated basename, actual current owner and mode0700. The complete native Podman runroot must be at most50 characters regardless of RUNNER_TEMP or TMPDIR length; reject before export if not. Preserve the same exclusive root for all archive/store/temp data and remove only its unchanged device/inode/owner/mode identity. A foreign or symlink root or changed cleanup identity is never traversed/deleted and cannot yield verified import. All original diagnostics/native/source/capacity/import gates remain mandatory."
    testRef: "tests/runtime/container-archive-diagnostics.test.ts::uses a short exclusively owned runroot despite long runner and temporary paths"
  - line: "archive-loaded-image-diagnostics"
    formula: "Preserve the exact single loaded image ID, complete normalized image signature and unchanged archive hash gates. Record only fixed boolean or null outcomes and a fixed map of signature field equality, never config values, environment values, image names or command output. A failed ID check must not inspect another image; a signature mismatch must remain failed and retain its exact field comparisons. These diagnostics establish no cause beyond the actually observed predicate."
    testRef: "tests/runtime/container-archive-diagnostics.test.ts::retains exact signature mismatch predicates without exposing config values"
