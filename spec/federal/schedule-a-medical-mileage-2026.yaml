lines:
  - line: "1"
    description: "Add the standard medical mileage and parking and tolls once"
    formula: >
      For one confirmed vehicle used for essential transportation for the
      single taxpayer's own qualified care, sum documented eligible miles
      paid or incurred January through June at 0.205 and July through December
      at 0.235. Add separately retained eligible parking and tolls once.
      Add the result to explicitly known other eligible unreimbursed medical
      expenses, which exclude the mileage claim and its parking and tolls.
      Preserve Decimal precision, keep private references out of the audit
      and retain both mileage periods.
    testRef: "tests/engine/schedules/schedule-a-medical-mileage-2026.test.ts::applies both rate periods and eligible parking and tolls before the medical floor"
  - line: "1-source"
    description: "Confirm eligible and nonoverlapping actual expenses"
    formula: >
      Require a current dated original ledger with one eligible mileage
      subtotal per date, positive mileage and explicit parking and tolls,
      including known zero. Keep the separate other medical amount in the
      same source packet and reject nonzero legacy aggregates or overrides.
      Require confirmation the trips were primarily for
      and essential to qualifying care of the taxpayer, expense payments
      and reimbursement status are complete, and neither actual vehicle
      expenses nor costs included in another tax benefit are repeated. Reject
      cross-year, missing or conflicting amounts. Other patient, mixed
      reimbursement, actual cost, and physical output methods are separate.
    testRef: "tests/engine/schedules/schedule-a-medical-mileage-2026.test.ts::rejects unknown eligibility contradictory sources and mismatched years"
  - line: "4"
    description: "Apply the medical expense threshold to the combined Line 1"
    formula: >
      Apply the existing 7.5 percent AGI floor once to the combined
      medical expenses. Preserve legacy medical totals and full-year gates.
    testRef: "tests/engine/schedules/schedule-a-medical-mileage-2026.test.ts::keeps known zero distinct and preserves the historical and full year gates"
  - line: "1-guided"
    description: "Retain actual medical mileage, known zero and affirmative eligibility"
    formula: >
      In the single 2026 itemized interview, capture a private source reference,
      actual dated mileage, eligible parking and tolls, other eligible medical
      expenses and explicit confirmation of each eligibility statement. Changes
      to the amounts, dates or reference require confirmation again. Preserve
      unknown values and disallow overlapping positive medical aggregates.
      Switching to the standard deduction retains the saved source and does not
      claim it. An incompatible year or filing status blocks an itemized claim.
      Give the canonical Schedule A calculation the original data and leave the
      year and public export gates closed.
    testRef: "tests/apps/web/guided-medical-mileage.test.tsx::keeps actual zeros and dates and clears confirmation when a source value changes"
