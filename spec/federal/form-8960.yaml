form: "Form 8960"
fullName: "Net Investment Income Tax"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i8960"
notes: "The former no-cross-netting quotation was not supported by the official instructions and is removed. Current line5a uses the signed return amount. Specialty-source worksheets remain separately bounded; no filing qualification is implied."
lines:
  - line: "1"
    description: "Taxable interest"
    formula: "Actual taxable interest after properly allocable source adjustments."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "2"
    description: "Ordinary dividends"
    formula: "Actual ordinary dividends, including qualified dividends."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "3"
    description: "Annuities"
    formula: "Actual nonqualified taxable annuity income subject to section1411; qualified retirement distributions are excluded."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "4a"
    description: "Business rental royalty and pass-through income"
    formula: "Actual return income potentially subject to NIIT before non-section1411 adjustments."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "4b"
    description: "Non-section1411 business adjustment"
    formula: "Signed adjustment removing actual excluded business income or losses; no inferred passive classification."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "4c"
    description: "Combined business income"
    formula: "Line4a+line4b."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "5a"
    description: "Net gain or loss from dispositions"
    formula: "Signed Form1040line7a plus Schedule1line4. Short-term and long-term amounts net under ScheduleD; the permitted capital loss deduction remains negative."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "5b"
    description: "Excluded disposition adjustment"
    formula: "Negative excluded gains and positive excluded losses from the actual completed disposition worksheet."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "5c"
    description: "Partnership and S-corporation disposition adjustment"
    formula: "Actual signed section1411(c)(4) adjustment; not inferred from gross sale amounts."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "5d"
    description: "Combined disposition income"
    formula: "Lines5a+5b+5c."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "6"
    description: "CFC and PFIC investment adjustment"
    formula: "Actual signed adjustment from the applicable completed worksheet; no inferred foreign-entity facts."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "7"
    description: "Other investment modifications"
    formula: "Actual signed modifications not already included on another line."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "8"
    description: "Total investment income"
    formula: "Lines1+2+3+4c+5d+6+7; preserve a signed total here."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "9a"
    description: "Investment interest expense"
    formula: "Actual allowed ScheduleAline9 interest, not interest already deducted on line4a; subject to total actual itemized allowance."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "9b"
    description: "Allocable taxes"
    formula: "Actual allowed taxes allocated to investment income using a documented reasonable method. No assumed pro-rata allocation or sales-tax deduction."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "9c"
    description: "Allowed miscellaneous investment expenses"
    formula: "Only actual deductions still allowed for regular tax; disallowed section67 miscellaneous expenses cannot enter."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "9d"
    description: "Investment expense total"
    formula: "Lines9a+9b+9c. Historical aggregate-only direct callers retain their total without fabricated component audits."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "10"
    description: "Additional modifications"
    formula: "Actual properly allocable deductions not already deducted; TIPS ordinary loss follows the supported itemized-source route."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "11"
    description: "Total deductions"
    formula: "Lines9d+10."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "12"
    description: "Net investment income"
    formula: "max(0,line8-line11)."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "13"
    description: "Modified adjusted gross income"
    formula: "Actual AGI plus Form2555line42 minus line44 deductions specifically allocable to that FEIE, plus actual CFC/PFIC MAGI adjustment. Housing exclusion/deduction are not added back by this worksheet."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "14"
    description: "Filing-status threshold"
    formula: "Single/HoH200000;MFJ/QSS250000;MFS125000."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "15"
    description: "MAGI excess"
    formula: "max(0,line13-line14)."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "16"
    description: "Taxable base"
    formula: "min(line12,line15)."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "17"
    description: "Individual NIIT"
    formula: "Round line16*0.038 to whole dollars; Schedule2line12."
    testRef: "tests/engine/forms/form-8960-official-lines.test.ts::records the official individual lines without reassigning their meanings"
  - line: "signed-return-capital"
    description: "Permitted capital losses and opposing categories reduce NIIT"
    formula: "Use the actual signed Form1040 capital gain/loss, not independently positive ST/LT buckets."
    testRef: "tests/engine/federal-niit-source.test.ts::nets opposing capital categories and retains the permitted capital loss"
  - line: "review-copy"
    description: "Copy each supported audited physical line and actual MAGI"
    formula: "Require unique finite audit values matching retained result; never reconstruct MAGI from a zero-floored excess."
    testRef: "tests/pdf/fill-form-8960-source.test.ts::copies actual below-threshold MAGI and official source lines"
  - line: "attachment"
    description: "Required form at zero NIIT"
    formula: "Attach when actual MAGI exceeds filing-status threshold even if NIIT rounds to zero or NII is zero."
    testRef: "tests/pdf/fill-form-8960-source.test.ts::retains the required zero-tax form in the review packet"
  - line: "10-tips"
    description: "Properly allocable ordinary loss on inflation-indexed debt"
    formula: "When itemizing, deduct min(actual allowable ordinary loss, final allowed itemized deductions) under Regulations1.1411-4(f)(5)/(7); otherwise zero. Do not deduct the source carry or offset other obligations twice."
    irsRef: "https://www.ecfr.gov/current/title-26/section-1.1411-4; Form8960 instructions line10"
    testRef: "tests/engine/federal-oid-source-integration.test.ts::deducts actual TIPS loss for NIIT only when itemized"
  - line: "10-tips-section68"
    description: "Current-year section68 deduction coordination"
    formula: "Retain source loss separately and cap the NIIT itemized deduction at the return's actual post-section68 itemized allowance; no proportional reduction is invented."
    testRef: "tests/engine/federal-tips-2026.test.ts::limits the TIPS NIIT deduction to actual post-section68 itemized deductions"
  - line: "foreign-magi"
    description: "Section911 excludes housing from the NIIT addback"
    formula: "AGI+Form2555line42-actual line44 FEIE-allocable deduction; positive mixed housing/FEIE deductions require an actual allocation, bounded by the source total."
    testRef: "tests/engine/federal-niit-source.test.ts::adds back only actual FEIE and its allocable deductions for NIIT"
  - line: "actual-disposition-adjustments"
    description: "Actual completed disposition worksheet"
    formula: "For represented nonzero Form4797 sources require actual year/reference/confirmation and regular capital/ordinary amounts that reconcile to the return; retain signed5b/5c without inferring investment classification."
    testRef: "tests/engine/federal-niit-source.test.ts::requires actual business-disposition adjustments and reconciles both return components"
  - line: "actual-itemized-allocation"
    description: "Aggregate limit of actual itemized NIIT deductions"
    formula: "Allow actual ScheduleAline9 investment interest and TIPS ordinary loss only when itemizing and only within the combined final itemized allowance. If both require section68 allocation, require a completed actual allocation; do not independently double-use the cap."
    testRef: "tests/engine/federal-niit-source.test.ts::deducts allowed investment interest once and rejects contradictory source allocations"
  - line: "combined-section68-allocation"
    description: "Multiple investment deductions share one actual itemized limit"
    formula: "Require a completed source allocation if investment interest and TIPS ordinary loss together exceed post-section68 itemized deductions; their sum cannot reuse that allowance."
    testRef: "tests/engine/federal-tips-2026.test.ts::requires a reconciled allocation when multiple investment deductions share the reduced allowance"
  - line: "review-equations"
    description: "Retained audit equations must reconcile before mapping"
    formula: "Validate signed source subtotals, combined deductions and zero floors using exact Decimal audited values; refuse inconsistent intermediate lines."
    testRef: "tests/pdf/fill-form-8960-source.test.ts::rejects an inconsistent intermediate deduction audit"
  - line: "offsetting-disposition-sources"
    description: "Offsetting business sales do not establish identical investment classifications"
    formula: "Require the actual adjustment worksheet when nonzero reported business source gains/losses offset in aggregate; a zero regular subtotal does not establish zero excluded adjustment."
    testRef: "tests/engine/federal-niit-source.test.ts::preserves the source gate when business gains and losses offset"
