notes: |
  Intake for the already specified finite taxable-corporate full cash sale method;
  no new election or calculation. Copy actual original Ordinary=true, noncovered
  status, security, issue/maturity, full-disposition and original-reference facts.
  Preserve unknown answers; absence of INT/OID arrays is not known absence.
  Explicit known-no-original statements may establish an empty collection only
  after the user checks actual records. Complete current originals and explicit
  same-discount-not-elsewhere confirmation bind the once-only method.
  Canonical snapshots are generated only after the explicit source confirmation;
  changed row, statement, debt, election, history or INT/OID originals invalidate
  that confirmation. Original capital/basis/statement confirmations still apply.
  PA positive market-discount guard, final forms, human review, hosted privacy and
  annual filing gates remain unchanged.
