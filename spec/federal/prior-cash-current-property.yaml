    formula: "Base100000/currentG0/priorG49500/A5000 leaves currentA500 equal to the floor; itemized currentA carry5000 and nonitemized4500. PriorG49500.01 leaves499.99, so reject instead of assigning the remaining.01 floor to prior cash. Missing identity/history/basis, changed receipt totals, other prior categories and NOL sources reject."
