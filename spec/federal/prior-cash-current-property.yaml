    description: "Use actual prior G before current A and apply the floor entirely to current A"
    formula: "Base100000/currentG10000/priorG20000/currentA30000 gives before-floor G30000/A20000; current cash10000/property19500/prior20000; current A carry10500 itemized or10000 nonitemized. No percentage excess means no floor-only carry."
