form: "Prior Cash Current Property"
fullName: "2026 actual prior public cash with current property absorbing the entire floor"
taxYear: 2026
irsReference: "https://uscode.house.gov/us/usc/119-120/t26/s170/"
retrievedAt: "2026-10-25"
reviewStatus: "independent-review-pending"
notes: |
  Bounded statutory derivation under section 170(G)(i)/(iii), I(v)/(vi),
  d(1)(C) and Reg. 1.170A-10. Current G precedes original FIFO G carry. All current A
  values are per-receipt min(FMV,basis), and actual prior categories are G
  only. Aggregate G=min(current+eligible prior G,.60B); current A is limited
  to max(0,.50B-G), satisfying the reciprocal G ceiling less A. This route
  requires allowed current A to absorb the entire .005B floor (or B=0).
  No part of that floor is assigned to current or prior G. A percentage
  excess allows the current A floor amount to retain its current origin;
  without percentage excess, the current floor amount does not carry.
  Nonitemization retains only percentage excess and original unused prior
  balances. It does not create carry from the170(p) cap or grant a standard
  deduction. Prior G use/expiry remains separate from its actual deduction.
  Positive-base G capacity cannot bind while A absorbs a positive floor;
  zero-base and expired-source cases retain actual vintage conservation.
  A floor reaching G, other prior categories, special receipts and NOL
  sources require separate methods. No source or filing gate is opened.
  Sources also include https://www.ecfr.gov/current/title-26/section-1.170A-10
  and final 2025 Pub. 526 carryover ordering; the 2026 floor controls are
  statutory derivations, not published IRS worked examples.
  The canonical handoff now uses charitable-determined-floor.yaml, which
  derives this same result from the shared actual percentage ledger and
  proves that every floor-hit category contains only current allowance.
  This standalone original helper remains covered by its unchanged literals.
