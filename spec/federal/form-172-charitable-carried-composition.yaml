  - line: "zero-benefit-cod"
    description: "Apply existing after-tax current-loss-first COD only after zero charitable comparisons"
    formula: "Actual old regular100000/use0 plus new14000, oldAMT100000/use7650/remaining92350 plus new0, both charitable comparisons0. Actual insolvency-excluded personal debt5000 reduces newregular14000 to9000 first (closing109000), and oldAMT92350 to87350. Original losses, current deductions, charity2000/0 stay unchanged. This zero-benefit control is unchanged. The separately specified sufficient-capacity composition admits positive benefit and distinct modified absorption only when each actual reduction fits both original modified vectors."
    testRef: "tests/engine/federal-form-172-charitable-carried-composition.test.ts::composes zero-benefit charitable histories with current-loss-first COD"
  - line: "cod-guided-originals"
    description: "Reach the bounded COD composition through the existing actual source collectors"
    formula: "Actual debt and insolvency originals, old loss histories and current business/charity sources are preserved by the unmocked guide. It derives109000 regular/87350AMT after-tax carry; no entered carry or allocation."
    testRef: "tests/guided-interview/guided-form-172-charitable-carried-composition.test.ts::retains actual debt sources beside old and current charitable histories"
  - line: "cod-private-review"
    description: "Bind debt reduction and charitable comparison independently in review output"
    formula: "Original charity and COD contexts retain actual old/new use and5000 reduction; balanced changed old/current COD attribution rejects before output. No source identifiers appear in the redacted review."
    testRef: "tests/pdf/form-172-charitable-carried-composition-review.test.ts::binds zero-benefit charitable and COD contexts before review output"
  - line: "source-choice-closure"
    description: "Include actual empty charitable histories and prior-only sources without an invented old-loss reset"
    formula: "Same10k income with currentA1000 and explicitly empty regular/AMT charity histories gives newregular11000 plus old100000, independentATNOLD8100/closing91900. Removing actual current gift instead retains priorC5000/500, gives newregular13000 plus old100000 and independentATNOLD8550/closing91450. Both routes retain the original old-loss sources."
    testRef: "tests/engine/federal-form-172-charitable-carried-composition.test.ts::closes current-only and prior-only actual charitable source choices"
