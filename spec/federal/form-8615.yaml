# Form 8615 — Tax for Certain Children Who Have Unearned Income
# IRS Reference: 2025 Form 8615 (https://www.irs.gov/pub/irs-prior/f8615--2025.pdf), Instructions and IRC Section 1(g)
# Rev. Proc. 2024-40 Section 2.02 (2025 inflation adjustments)

form: "8615"
title: "Tax for Certain Children Who Have Unearned Income"
tax_year: 2025
description: >
  Computes the kiddie tax for children under 19 (or under 24 if full-time students)
  whose unearned income exceeds the threshold. Net unearned income above the
  threshold is taxed at the parent's marginal rate instead of the child's rate.

businessRuleValidation:
  - rule: "reference-summary-packet"
    description: "Inventory support counts this form as business-rule validated only when regression coverage proves the emitted packet artifact stays labeled as a non-filing reference summary and only surfaces the supported Form 8615 line outputs that drive the Form 1040 Line 16 kiddie-tax replacement."
    testRef: "tests/pdf/fill-form-8615.test.ts::buildForm8615ReferenceSummary keeps the packet artifact reference-only and limited to supported kiddie-tax outputs"

applicability:
  description: >
    The child must file Form 8615 if ALL of the following are true:
    (1) The child had more than $2,700 of unearned income (2025).
    (2) The child is required to file a tax return.
    (3) The child was under age 19 at end of year, OR under 24 and a full-time student.
    (4) At least one of the child's parents was alive at end of year.
    (5) The child does not file a joint return.
  irs_reference: "Form 8615 Instructions, Who Must File"
  threshold: 2700
  age_limit_general: 19
  age_limit_student: 24

lines:
  - line: "1"
    description: "Child's unearned income"
    formula: "Sum of child's investment income: interest, dividends, capital gains, rents, royalties, and other unearned income"
    irs_reference: "Form 8615 Instructions, Line 1"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 1 - child's unearned income flows from input"

  - line: "2"
    description: "Threshold deduction"
    formula: >
      If child did NOT itemize deductions: $2,700 (2025).
      If child DID itemize deductions: max($2,700, $1,350 plus the deductible portion
      of Schedule A directly connected with producing the unearned income on line 1).
      The itemizing child must supply that portion explicitly, including zero when applicable.
      Apply the corresponding year's thresholds.
    notes: >
      On the federal return, the child's itemization fact must agree with the selected
      deduction method. The stated directly connected deductible amount must not
      exceed allowed Schedule A line 17. Reject inconsistent amounts instead of
      reducing them to the limit. An itemizing child with positive qualified
      dividends or net long-term capital gain requires the separately classified
      deductions used by the preferential-income worksheets for lines 5 and 14
      when the form continues past line 5.
    irs_reference: "2025 Form 8615 Instructions, Line 2 and Eleanor example (https://www.irs.gov/pub/irs-prior/i8615--2025.pdf); IRC §1(g)(4)(A)(ii); Rev. Proc. 2024-40 §2.02"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 2 - reproduces the IRS Eleanor example"

  - line: "3"
    description: "Net unearned income"
    formula: "Record Line 1 minus Line 2, including a negative result. Stop if zero or less. Report semantic net unearned income as zero when stopped here."
    irs_reference: "Form 8615 Instructions, Line 3"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 3 - net unearned income is unearned minus threshold"

  - line: "4"
    description: "Child's taxable income"
    formula: "From child's Form 1040 Line 15"
    irs_reference: "Form 8615 Instructions, Line 4"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 4 - child's taxable income from Form 1040"

  - line: "5"
    description: "Net unearned income taxed at parent's rate"
    formula: "min(Line 3, Line 4). If zero or less, stop before the parental tax or preferential-income worksheets. Leave the child's normal Form 1040 tax in place."
    irs_reference: "Form 8615 Instructions, Line 5"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 5 - net unearned income capped at child's taxable income"

  - line: "6"
    description: "Parent's taxable income"
    formula: "max(0, parent's taxable income from Form 1040 Line 15)"
    irs_reference: "Form 8615 Instructions, Line 6"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 6 - floors parent's taxable income before computing the sibling allocation"

  - line: "7"
    description: "Net unearned income of other Form 8615 children"
    formula: "Sum of Line 5 amounts from all other children of the same parent who file Form 8615. Leave blank if none."
    irs_reference: "Form 8615 Instructions, Line 7"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 7 - leaves sibling net unearned income blank when none"

  - line: "8"
    description: "Combined income for parental tax calculation"
    formula: "Line 5 + Line 6 + Line 7"
    irs_reference: "Form 8615 Instructions, Line 8"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Lines 7–13 - records and allocates parental tax among siblings"

  - line: "9"
    description: "Tax on combined income at parent's rates"
    formula: "Tax on Line 8 using the parent's filing status and the applicable tax table or worksheet."
    notes: "Child preferential-income worksheet qualification is separate."
    irs_reference: "Form 8615 Instructions, Line 9"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 9 - tax on combined income uses parent's rates"

  - line: "10"
    description: "Tax on parent's taxable income"
    formula: >
      IRS Line 10 uses the parent's Form 1040 Line 16 with the form's required exclusions.
      The supported calculation recomputes the parent's tax from Line 6, filing status
      and reported preferential components.
    irs_reference: "Form 8615 Instructions, Line 10"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 10 - tax on parent's income alone"

  - line: "11"
    description: "Allocable parental tax"
    formula: "Line 9 minus Line 10. The supported tax computation floors the difference at zero."
    irs_reference: "Form 8615 Instructions, Line 11"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 11 - allocable parental tax is the marginal increase"

  - line: "12a"
    description: "Total net unearned income of all children"
    formula: "Line 5 + Line 7. Skip if Line 7 is blank."
    irs_reference: "Form 8615 Instructions, Lines 12a and 12b"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Lines 7–13 - records and allocates parental tax among siblings"

  - line: "12b"
    description: "Child's share of total net unearned income"
    formula: >
      Line 5 divided by Line 12a. Skip if Line 7 is blank. Report the Decimal ratio
      at calculation precision, with at least three decimal places in the reference summary.
    irs_reference: "2025 Form 8615, Line 12b; Form 8615 Instructions, Lines 12a and 12b"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Lines 7–13 - records and allocates parental tax among siblings"

  - line: "13"
    description: "Child's share of allocable parental tax"
    formula: >
      Copy Line 11 if Line 7 is blank. Otherwise, apply the Line 12b share by
      multiplying Line 11 by Line 5 and dividing by Line 12a before rounding
      the resulting allocation to the nearest whole dollar.
    irs_reference: "Form 8615 Instructions, Line 13"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 13 - single child gets full allocable parental tax"

  - line: "14"
    description: "Child's taxable income at child's own rate"
    formula: "Line 4 minus Line 5. Use zero when those amounts are equal."
    irs_reference: "Form 8615 Instructions, Line 14"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 14 - remainder taxed at child's own rate"

  - line: "15"
    description: "Tax on child's remaining income at child's own rate"
    formula: "Tax computed on Line 14 using the child's filing status and the applicable tax table or worksheet."
    notes: "The IRS requires the Line 5 Worksheet to determine preferential amounts included on Line 14. This worksheet is outside the audit-row correction."
    irs_reference: "Form 8615 Instructions, Line 15"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 15 - tax on child's remaining income at child's rate"

  - line: "16"
    description: "Tentative tax"
    formula: "Line 13 + Line 15"
    irs_reference: "Form 8615 Instructions, Line 16"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 18 - final tax is the greater of tentative and child-rate tax"

  - line: "17"
    description: "Tax on child's taxable income at child's own rate"
    formula: >
      Tax computed on Line 4 using the child's filing status with the child's
      full qualified dividends and capital gains.
    irs_reference: "Form 8615 Instructions, Line 17"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 17 - tax at child's own rate on full taxable income"

  - line: "18"
    description: "Tax for Form 8615"
    formula: "max(Line 16, Line 17)"
    irs_reference: "Form 8615 Instructions, Line 18; IRC §1(g)(1)"
    testRef: "tests/engine/forms/form-8615.test.ts::Form 8615 Line 18 - final tax is the greater of tentative and child-rate tax"

  - line: "packet"
    description: "Draft packet inclusion rule for supported Form 8615 kiddie-tax outputs"
    formula: "When Form 8615 applies, include a non-filing reference-summary PDF in the packet that lists the supported Form 8615 line outputs used to replace Form 1040 Line 16 tax."
    irs_reference: "Form 8615 Instructions, Lines 1-18; Form 1040 Instructions, Line 16"
    notes: "The draft packet contains a reference summary. Display sibling allocation lines 12a and 12b when present, with line 12b as a ratio with at least three decimal places."
    testRef: "tests/pdf/fill-form-8615.test.ts::fillReturn includes a Form 8615 reference summary when kiddie tax applies"

edge_cases:
  - description: "Net unearned income zero or negative"
    rule: "If Line 1 <= Line 2, Form 8615 does not apply; return zero."

  - description: "Itemizing child's directly connected deductions increase the threshold"
    rule: "Use the Line 2 itemizer formula with the applicable year's amounts."

  - description: "Net unearned income exceeds child's taxable income"
    rule: "Line 5 is capped at Line 4."

  - description: "Multiple siblings filing Form 8615"
    rule: >
      The allocable parental tax on Line 11 is split proportionally among all
      children based on each child's Line 5 relative to the combined Line 12a.

  - description: "Parent has qualified dividends or capital gains"
    rule: >
      Lines 9 and 10 use the applicable tax worksheet when the parent has
      qualified dividends or net long-term capital gains.

  - description: "Child has qualified dividends allocated between Lines 5 and 14"
    rule: >
      Use the applicable IRS Line 5 Worksheet to determine each portion.
      Qualification of this worksheet is outside the audit-row correction.

  - description: "Child's own rate is higher than parent-rate computation"
    rule: >
      Line 18 = max(Line 16, Line 17). In rare cases the child's own-rate tax
      may exceed the Form 8615 tentative tax.
