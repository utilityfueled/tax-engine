form: "Repaid earlier-year income"
fullName: "Repayment of unemployment compensation included in an earlier year"
taxYear: 2025
supportedTaxYears: [2025, 2026]
irsReference: "https://www.irs.gov/publications/p525"
notes: |
  Publication 525 (2025) Repayments, Repayment over $3,000, Methods 1 and 2, and
  Repayment of unemployment compensation, retrieved 2026-10-31. IRC1341.
  https://www.irs.gov/publications/p525
  $3,000 or less: not deductible, because miscellaneous itemized deductions are gone.
  Over $3,000: deduct on Schedule A line16, or claim Schedule 3 line13b, whichever
  gives less tax. The credit is the earlier tax shown less that tax refigured
  without the repaid income. Each repayment row is tested against $3,000 alone.
  The earlier-return amounts are actual entered figures. This method does not
  recalculate an earlier year. A tie uses the deduction.
  Bounded to Form1099G repayments. Marketplace worksheets and every state path reject.
  Not settled here: whether Form2210 refundable credits include this credit. The
  federal comparison assumes they do not.
lines:
  - line: "threshold"
    description: "Test both sides of the $3,000 threshold"
    formula: "Repaid3000 has no deduction or credit and keeps base tax. Repaid3000.01 enters the comparison."
    irsRef: "Pub525 Repayment over $3,000"
    testRef: "tests/engine/forms/claim-of-right.test.ts::tests both sides of the three thousand dollar threshold"
  - line: "credit-wins"
    description: "Choose the credit when it gives less tax"
    formula: "Single wages120000, itemized20000, repaid5000: base taxable100000 tax16914. Method1 taxable95000 tax15820. Credit1100 gives15814, so method credit, Schedule3 13b1100 and total tax stays16914."
    irsRef: "Pub525 Method 2 steps1-4"
    testRef: "tests/engine/forms/claim-of-right.test.ts::chooses the method that gives less tax"
  - line: "deduction-wins"
    description: "Choose the deduction when it gives less tax"
    formula: "Same return, credit1000 gives15914 against Method1 15820, so method deduction and Schedule A line16 5000. A nonitemizer's deduction has no effect, so any positive credit wins."
    irsRef: "Pub525 Method 1; Schedule A line16"
    testRef: "tests/engine/forms/claim-of-right.test.ts::chooses the method that gives less tax"
  - line: "unknown"
    description: "Reject missing or conflicting earlier-return facts"
    formula: "Unconfirmed records, a blank or negative amount, the same or later year, refigured tax above the earlier tax, or no records reject. Entered zero credit stays zero. Marketplace and state paths reject."
    irsRef: "Original-source contract"
    testRef: "tests/engine/forms/claim-of-right.test.ts::rejects missing or conflicting earlier return facts"
  - line: "guide"
    description: "Collect earlier-return facts only when a repayment is entered"
    formula: "A positive earlier-year repayment needs the earlier year, both tax amounts, a reference and confirmation. Blank stays unknown and zero stays zero. Zero repayment needs none."
    irsRef: "Pub525 Method 2 steps2 and3"
    testRef: "tests/guided-interview/guided-claim-of-right.test.ts::collects earlier return facts only for a positive repayment"

