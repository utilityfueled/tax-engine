form: Verified AI legacy-source admission
fullName: "Keep historical source assumptions out of a confirmed calculation explanation"
taxYear: 2025
irsReference: "https://www.irs.gov/pub/irs-prior/i1099r--2025.pdf"
sources:
  - "https://www.irs.gov/pub/irs-prior/i8606--2025.pdf"
  - "https://www.irs.gov/pub/irs-prior/p575--2025.pdf"
  - "https://www.irs.gov/publications/p936"
notes: Prospective software source-admission contract only. Preserve historical engine previews and existing validated tax methods. A server-calculated receipt verifies arithmetic and scope, not actual-world truth or filing readiness.
lines:
  - line: "source-preview-separation"
    description: A confirmed explanation must not silently discard the historical mortgage source qualification or treat unknown retirement taxability as a complete source.
    formula: Before a confirmed receipt, reject an itemized positive mortgage deduction computed from an explicitly unverified historical balance preview, and a positive retirement packet with unresolved actual distribution code and taxability. Preserve engine previews without modifying their arithmetic.
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies a confirmed receipt for unresolved %s sources"
  - line: "actual-post"
    description: The real authenticated confirmed explanation handler rejects the same incomplete sources before provider or accounting dispatch.
    formula: Return 400 private no-store; no transport or reservation is attempted. Known supported source-resolved methods remain eligible for their existing calculation paths.
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies unresolved sources at the actual confirmed explanation POST"
  - line: "preserved-methods"
    description: "Preserve source-determined retirement methods and source-unselected mortgage previews"
    formula: "No historical amounts or year branches change. Actual Box2a, supported Simplified/Roth/rollover/exchange and applicable Form8606 sources remain eligible; ignore zero distributions and unselected historical mortgage previews."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::preserves known retirement methods and unselected or zero mortgage previews"
  - line: "applicable-basis"
    description: "An IRA gross fallback needs actual matching zero basis or a calculated applicable owner worksheet"
    formula: "A different owner or an empty unrelated Form8606 cannot certify an unresolved distribution. Require actual recognized code on unresolved distributions; do not duplicate the existing tax method resolver."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::requires actual applicable IRA basis instead of an unrelated owner worksheet"
  - line: "original-basis-presence"
    description: "Raw original manual basis amounts must be present before canonical defaults"
    formula: "The transient handler retains original source presence through server audit admission; no omitted basis amount becomes a known zero. Applicable calculated owner worksheet covers original distributions after the existing Form8606 dollar rounding."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects missing original basis fields rather than schema-defaulted zeros"
  - line: "distribution-classification"
    description: "Known taxable amount does not determine an absent distribution classification"
    formula: "Positive Form1099R distributions require an actual recognized Box7 code before producing a confirmed context. A missing code leaves current-year versus prior-year and account classification unknown even when Box2a is known. Zero and no-activity rows do not need invented codes."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects missing distribution classification even when Box2a is known"
  - line: "worksheet-method-identity"
    description: "Roth-only coverage cannot certify an actual traditional IRA distribution"
    formula: "Use the existing retirement resolver's IRA kind to bind traditional gross to calculated Form8606 PartI/II distribution components and Roth gross to PartIII components. One method's amount cannot fill another method's missing source."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects a Roth-only worksheet used to certify traditional IRA gross"
  - line: "actual-raw-originals"
    description: "The real confirmed POST preserves original presence through defaulting"
    formula: "Known complete manual8606 and strict actual owner packet return200 without provider calls; deleting an original basis field returns400 before accounting. Raw original source values remain private and unpersisted."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::binds raw originals at actual POST without blocking complete owner methods"
  - line: "conversion-method-identity"
    description: "A conversion-only worksheet cannot certify an actual ordinary early IRA distribution"
    formula: "Bind calculated conversion gross to the existing resolver's actual per-owner conversion amount, independently from ordinary traditional distributions. A worksheet cannot change actual distribution classification or suppress early-distribution tax."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects a conversion-only worksheet used to certify ordinary traditional IRA gross"
  - line: "effective-worksheet-source"
    description: "An effective manual worksheet must reconcile all actual owner distributions, including known Box2a originals"
    formula: "When the engine applies a manual Form8606 to a current positive IRA distribution, independently require complete applicable original basis and exact ordinary/Roth/conversion original totals; a known printed amount cannot waive source admission for an overriding worksheet."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects an inconsistent manual worksheet overriding a known original IRA amount"
  - line: "2025-box7-combinations"
    description: "Actual positive 2025 retirement sources must use the official Table1 Box7 combination before a confirmed receipt"
    formula: "Use only the 2025 Instructions for Forms1099R and5498 Table1 source-code syntax. Maximum two distinct recognized codes; numeric pairs only18,28,48 in either order. P may pair only1,2,4,B,J, never7. All other pairs must be explicitly listed in the table, with Y first and followed only4,7,K; Y cannot stand alone. This classification check neither calculates income nor establishes age/account/source truth. Preserve every existing method guard and historical numeric preview; do not apply the2025 table to2026 engine assertions."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects an invalid actual Box7 combination before certifying its excluded income"
  - line: "2025-table1-census"
    description: "All listed source-code companions and the mandatory Y-first QCD syntax remain bounded to2025"
    formula: "Pairs in either order are18,1B,1D,1K,1L,1M,1P,28,2B,2D,2K,2L,2M,2P,3D,48,4A,4B,4D,4G,4H,4K,4L,4M,4P,6W,7A,7B,7D,7K,7L,7M,8B,8J,8K,BG,BL,BM,BP,BU,CD,GK,JP,JS. QCD pairs are Y4,Y7,YK only; unpaired Y is incomplete. All other recognized single codes retain existing tax-method validation. No amount or year calculation changes."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::binds the complete 2025 Table1 combination syntax without treating it as taxability proof"
  - line: "2025-combination-preservation"
    description: "Preserve valid prior-year sources and determined ordinary current sources"
    formula: "Actual P alone and P paired with1,2,4,B,J retain the original prior-year classification in both listed orderings. Actual7 andG with determined positive Box2a preserve the original current-year amount; Table1 syntax does not independently assert rollover exemption."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::preserves actual permitted prior-year pairs and ordinary current-year originals"
  - line: "2025-combination-private-post"
    description: "The actual same-origin authenticated handler cannot dispatch the invalid-code omission"
    formula: "Return400 private no-store before accounting or provider dispatch; no original taxpayer identifiers, payer or invalid code text is exposed in the response."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies an invalid actual Box7 combination at the authenticated POST before dispatch"
