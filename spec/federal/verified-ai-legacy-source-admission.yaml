form: Verified AI legacy-source admission
fullName: "Keep historical source assumptions out of a confirmed calculation explanation"
taxYear: 2025
irsReference: "https://www.irs.gov/pub/irs-prior/i1099r--2025.pdf"
sources:
  - "https://www.irs.gov/pub/irs-prior/f1065sk1--2024.pdf"
  - "https://www.irs.gov/pub/irs-prior/f1120ssk--2024.pdf"
  - "https://www.irs.gov/instructions/i1065sk1"
  - "https://www.irs.gov/instructions/i1120ssk"
  - "https://www.irs.gov/pub/irs-prior/fw2g--2023.pdf"
  - "https://www.irs.gov/pub/irs-prior/iw2g--2021.pdf"
  - "https://www.irs.gov/pub/irs-prior/i8606--2025.pdf"
  - "https://www.irs.gov/pub/irs-prior/p575--2025.pdf"
  - "https://www.irs.gov/publications/p936"
notes: Prospective software source-admission contract only. Preserve historical engine previews and existing validated tax methods. A server-calculated receipt verifies arithmetic and scope, not actual-world truth or filing readiness.
lines:
  - line: "source-preview-separation"
    description: A confirmed explanation must not silently discard the historical mortgage source qualification or treat unknown retirement taxability as a complete source.
    formula: Before a confirmed receipt, reject an itemized positive mortgage deduction computed from an explicitly unverified historical balance preview, and a positive retirement packet with unresolved actual distribution code and taxability. Preserve engine previews without modifying their arithmetic.
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies a confirmed receipt for unresolved %s sources"
  - line: "actual-post"
    description: The real authenticated confirmed explanation handler rejects the same incomplete sources before provider or accounting dispatch.
    formula: Return 400 private no-store; no transport or reservation is attempted. Known supported source-resolved methods remain eligible for their existing calculation paths.
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies unresolved sources at the actual confirmed explanation POST"
  - line: "preserved-methods"
    description: "Preserve source-determined retirement methods and source-unselected mortgage previews"
    formula: "No historical amounts or year branches change. Actual Box2a, supported Simplified/Roth/rollover/exchange and applicable Form8606 sources remain eligible; ignore zero distributions and unselected historical mortgage previews."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::preserves known retirement methods and unselected or zero mortgage previews"
  - line: "applicable-basis"
    description: "An IRA gross fallback needs actual matching zero basis or a calculated applicable owner worksheet"
    formula: "A different owner or an empty unrelated Form8606 cannot certify an unresolved distribution. Require actual recognized code on unresolved distributions; do not duplicate the existing tax method resolver."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::requires actual applicable IRA basis instead of an unrelated owner worksheet"
  - line: "original-basis-presence"
    description: "Raw original manual basis amounts must be present before canonical defaults"
    formula: "The transient handler retains original source presence through server audit admission; no omitted basis amount becomes a known zero. Applicable calculated owner worksheet covers original distributions after the existing Form8606 dollar rounding."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects missing original basis fields rather than schema-defaulted zeros"
  - line: "distribution-classification"
    description: "Known taxable amount does not determine an absent distribution classification"
    formula: "Positive Form1099R distributions require an actual recognized Box7 code before producing a confirmed context. A missing code leaves current-year versus prior-year and account classification unknown even when Box2a is known. Zero and no-activity rows do not need invented codes."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects missing distribution classification even when Box2a is known"
  - line: "worksheet-method-identity"
    description: "Roth-only coverage cannot certify an actual traditional IRA distribution"
    formula: "Use the existing retirement resolver's IRA kind to bind traditional gross to calculated Form8606 PartI/II distribution components and Roth gross to PartIII components. One method's amount cannot fill another method's missing source."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects a Roth-only worksheet used to certify traditional IRA gross"
  - line: "actual-raw-originals"
    description: "The real confirmed POST preserves original presence through defaulting"
    formula: "Known complete manual8606 and strict actual owner packet return200 without provider calls; deleting an original basis field returns400 before accounting. Raw original source values remain private and unpersisted."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::binds raw originals at actual POST without blocking complete owner methods"
  - line: "conversion-method-identity"
    description: "A conversion-only worksheet cannot certify an actual ordinary early IRA distribution"
    formula: "Bind calculated conversion gross to the existing resolver's actual per-owner conversion amount, independently from ordinary traditional distributions. A worksheet cannot change actual distribution classification or suppress early-distribution tax."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects a conversion-only worksheet used to certify ordinary traditional IRA gross"
  - line: "effective-worksheet-source"
    description: "An effective manual worksheet must reconcile all actual owner distributions, including known Box2a originals"
    formula: "When the engine applies a manual Form8606 to a current positive IRA distribution, independently require complete applicable original basis and exact ordinary/Roth/conversion original totals; a known printed amount cannot waive source admission for an overriding worksheet."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects an inconsistent manual worksheet overriding a known original IRA amount"
  - line: "2025-box7-combinations"
    description: "Actual positive 2025 retirement sources must use the official Table1 Box7 combination before a confirmed receipt"
    formula: "Use only the 2025 Instructions for Forms1099R and5498 Table1 source-code syntax. Maximum two distinct recognized codes; numeric pairs only18,28,48 in either order. P may pair only1,2,4,B,J, never7. All other pairs must be explicitly listed in the table, with Y first and followed only4,7,K; Y cannot stand alone. This classification check neither calculates income nor establishes age/account/source truth. Preserve every existing method guard and historical numeric preview; do not apply the2025 table to2026 engine assertions."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::rejects an invalid actual Box7 combination before certifying its excluded income"
  - line: "2025-table1-census"
    description: "All listed source-code companions and the mandatory Y-first QCD syntax remain bounded to2025"
    formula: "Pairs in either order are18,1B,1D,1K,1L,1M,1P,28,2B,2D,2K,2L,2M,2P,3D,48,4A,4B,4D,4G,4H,4K,4L,4M,4P,6W,7A,7B,7D,7K,7L,7M,8B,8J,8K,BG,BL,BM,BP,BU,CD,GK,JP,JS. QCD pairs are Y4,Y7,YK only; unpaired Y is incomplete. All other recognized single codes retain existing tax-method validation. No amount or year calculation changes."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::binds the complete 2025 Table1 combination syntax without treating it as taxability proof"
  - line: "2025-combination-preservation"
    description: "Preserve valid prior-year sources and determined ordinary current sources"
    formula: "Actual P alone and P paired with1,2,4,B,J retain the original prior-year classification in both listed orderings. Actual7 andG with determined positive Box2a preserve the original current-year amount; Table1 syntax does not independently assert rollover exemption."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::preserves actual permitted prior-year pairs and ordinary current-year originals"
  - line: "2025-combination-private-post"
    description: "The actual same-origin authenticated handler cannot dispatch the invalid-code omission"
    formula: "Return400 private no-store before accounting or provider dispatch; no original taxpayer identifiers, payer or invalid code text is exposed in the response."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies an invalid actual Box7 combination at the authenticated POST before dispatch"

  - line: "actual-original-year"
    description: "An explicitly supplied positive retirement original year must match the confirmed return year"
    formula: "For Form1099R, reject a supplied original taxYear that differs from taxpayer.taxYear before confirmed explanation admission. Preserve unknown omitted years, matching originals and matching/missing-year zero gross; preserve historical canonical previews. Code P refers to a prior taxable year relative to the actual original and cannot silently retarget a different original year to this return. No cross-year correction method is inferred."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies an explicit mismatched retirement original %s at confirmed POST"
  - line: "original-year-controls"
    description: "Preserve matching, missing-year and no-activity behavior without source-year inference"
    formula: "Keep the existing matching2025 and missing-original-year source admission, prior-year CodeP calculation, and zero-gross preliminary paths unchanged. Only actually supplied contradictory original years are denied, including withholding-only originals."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::preserves matching missing and zero retirement original-year controls"

  - line: "direct-original-year"
    description: "Known direct-income original years cannot contradict a confirmed return"
    formula: "Inspect only the actual taxYear property on W2,1099INT,1099DIV,1099R,1099MISC,1099NEC,1099OID and1099K originals. Any explicitly supplied year must equal the confirmed taxpayer year, including zero-gross/positive-withholding sources. Omitted year stays unknown and matching originals preserve their existing methods. Do not recursively inspect carry vintages, historical worksheet years or refundExpenseTaxYear."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies a known mismatched %s direct-income original at confirmed POST"
  - line: "withholding-only-year"
    description: "A zero-gross original may still affect current payments"
    formula: "Reject an explicitly mismatched direct-original year before accounting even when gross income is zero and federal withholding is positive. Canonical historical preview remains unchanged."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies a withholding-only mismatched %s original before confirmed accounting"
  - line: "direct-year-preservation"
    description: "Missing years remain unknown rather than being inferred or rejected by a recursive date scanner"
    formula: "Preserve matching and omitted original-year cases on the existing direct-income forms and the narrowly added MISC/NEC originals; the guard does not amend or allocate any original to a different return."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::preserves matching and missing direct-original years"

  - line: "misc-nec-calendar-contradiction"
    description: "Known MISC and NEC calendar originals cannot certify a different return year"
    formula: "For confirmed explanations, reject known past/future taxYear on actual MISC other income or MISC/NEC withholding-only originals before provider dispatch or accounting. Preserve canonical historical arithmetic and every existing positive NEC receipt/source gate. This does not infer an original year or recursively inspect source histories. Responses remain private no-store and reveal no source identities."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies a known mismatched MISC or withholding-only NEC original %s before confirmed accounting"
  - line: "misc-nec-year-preservation"
    description: "Matching and omitted original years preserve the established methods"
    formula: "For MISC other income and MISC/NEC withholding-only originals, matching2025 and omitted year remain admitted when existing source gates pass. Missing year is not assigned2025. Preserve the incomplete2026 annual rejection even when all current original years match2026."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::preserves matched and missing MISC and withholding-only NEC years without opening2026"

  - line: "oid-k-calendar-contradiction"
    description: "Known calendar-year OID and payment-settlement originals cannot certify another return year"
    formula: "For confirmed explanations, inspect actual taxYear on Form1099OID and Form1099K alongside existing direct calendar originals. Reject known past/future years, including income-only, withholding-only and zero-impact originals, before accounting or provider dispatch. Preserve canonical historical arithmetic and every existing verified source-method gate. The original calendar year is distinct from continuous-use form revision and prior carry/worksheet histories."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies a known mismatched OID or K calendar original %s before confirmed accounting"
  - line: "oid-k-calendar-preservation"
    description: "Unknown remains unknown and matching original years conserve the existing income and payments"
    formula: "Matching2025 and omitted calendar years preserve actual existing OID and payment-settlement income and withholding calculations; no year is inferred and no source is rewritten. A known conflicting duplicate remains denied in either order. Incomplete2026 annual facts stay unavailable even when originals match2026. Responses remain private no-store without original identity disclosure."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::preserves matching and missing OID and K originals with income and withholding conservation"
  - line: "oid-k-zero-and-conflict"
    description: "Zero impact and ordering cannot erase a known calendar contradiction"
    formula: "Reject a known wrong calendar year even for zero income/withholding; reject a mixture of matching and conflicting actual originals in either order. Never allocate, merge away or rewrite a contradictory original."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies zero-impact OID and K year contradictions and conflicting duplicate years in either order"

  - line: "benefits-education-marketplace-calendar"
    description: "Known actual SSA benefit, student-interest and Marketplace statement calendar years must match a confirmed return"
    formula: "Inspect only actual sourceTaxYear on FormSSA1099 and taxYear on Form1098E and Form1095A. Reject a known past/future original year before confirmed accounting or dispatch, including benefits, withholding, deductions, advance-credit repayment and zero-impact rows. The original statement year is distinct from benefit lump-sum history, loan vintage, carry vintages, refund expense years and other legitimate prior-year worksheet sources. Preserve canonical preliminary arithmetic; do not infer a missing year or amend any source."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies a known mismatched benefits education or Marketplace original %s before confirmed accounting"
  - line: "benefits-education-marketplace-preservation"
    description: "Matching and missing direct calendar years retain existing source-method and annual gates"
    formula: "Preserve matching2025 and omitted original years for existing SSA benefits/withholding, student-interest and Marketplace methods. Conserve canonical income, deductions, payments and credit repayment exactly once. Missing remains unknown; incomplete2026 annual facts remain unavailable even with matching originals. Denials stay generic private no-store with zero provider/accounting calls."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::preserves matched and missing benefits education and Marketplace years with amount conservation"
  - line: "benefits-education-marketplace-zero-and-conflict"
    description: "Zero impact or duplicate ordering cannot erase an actually supplied contradictory statement year"
    formula: "Reject known wrong-year zero-amount originals and matching/conflicting duplicates in either order; only declared typed source-year fields are read. Noninteger or string original years remain schema errors, never coerced into an omitted year. Existing source completeness and privacy gates are unchanged."
    testRef: "tests/apps/web/verified-ai-legacy-source-admission.test.ts::denies zero-impact conflicting and malformed benefits education and Marketplace source years"

  - line: "w2g-calendar-year-retained"
    description: "Retain an actually supplied W2G calendar year across the legacy union branch"
    formula: "The original For calendar year header is distinct from the continuous-use form revision and Box2 date won. Preserve optional integer taxYear without supplying an absent year; the strict 2026 source variant retains its exact literal and complete source requirements."
    testRef: "tests/apps/web/verified-ai-w2g-year.test.ts::retains supplied W2G calendar years without fabricating missing originals"
  - line: "w2g-confirmed-year"
    description: "Known inconsistent W2G originals cannot certify a confirmed current explanation"
    formula: "Reject an explicitly supplied W2G calendar taxYear differing from taxpayer.taxYear before confirmed explanation dispatch, including zero income and withholding-only rows. Preserve historical canonical arithmetic and all other source gates. No date-won-to-payment-year inference and no K1 fiscal-year comparison."
    testRef: "tests/apps/web/verified-ai-w2g-year.test.ts::rejects known W2G year contradictions while retaining historical arithmetic"
  - line: "w2g-private-post"
    description: "The actual authenticated handler rejects calendar contradictions privately before provider or accounting"
    formula: "Actual confirmed POST returns400 private no-store for past or future W2G calendar originals, irrespective of amount. No original payer or taxpayer identity is exposed; no source mutation."
    testRef: "tests/apps/web/verified-ai-w2g-year.test.ts::denies contradictory W2G originals at actual authenticated POST before dispatch"
  - line: "w2g-duplicate-year"
    description: "A matching-year duplicate cannot conceal a known contradictory calendar source"
    formula: "Inspect every actual W2G original in either order, without deduping or altering historical numeric results."
    testRef: "tests/apps/web/verified-ai-w2g-year.test.ts::rejects conflicting duplicate W2G years in either order"
  - line: "w2g-year-compatibility"
    description: "Matching and absent historical calendar originals preserve their existing preview and confirmed behavior"
    formula: "Known2025 and omitted years retain historical winnings and withholding arithmetic; omitted year remains unknown rather than a default2025. Other source-method guards still apply."
    testRef: "tests/apps/web/verified-ai-w2g-year.test.ts::preserves matching and missing W2G years without changing amounts or identity privacy"
  - line: "w2g-strict-scope"
    description: "Retaining a legacy year never relaxes the separate strict2026 source or full-return qualification gate"
    formula: "A supplied strict sourceId still requires the complete exact2026 original, including actual winning date, primary owner, payer identity and supported wager. No new2025 source-complete method or2026 annual return qualification is created."
    testRef: "tests/apps/web/verified-ai-w2g-year.test.ts::preserves strict W2G source completeness and unavailable 2026 qualification"

  - line: "future-k1-original"
    description: "A known future original partnership or S-corporation K1 year cannot support an earlier calendar-year explanation"
    formula: "Reject only an actually supplied top-level scheduleK1.taxYear greater than taxpayer.taxYear before verified admission. Whether the original header identifies the beginning year or an already mapped ending year, a future original period cannot end within an earlier selected calendar year. This rejects even zero or withholding-only rows without changing historical canonical arithmetic."
    testRef: "tests/apps/web/verified-ai-k1-future-year.test.ts::rejects future K1 original years privately before authenticated dispatch"
  - line: "k1-fiscal-preservation"
    description: "Earlier original K1 headers can legitimately represent a fiscal period ending in the selected return year"
    formula: "Do not require K1 taxYear equality. Preserve earlier, current and absent original header years, existing missing-year compatibility, underlying source guards and numeric previews. No end date, calendar-year classification or fiscal eligibility is inferred from a prior header; this is not a general fiscal-period method."
    testRef: "tests/apps/web/verified-ai-k1-future-year.test.ts::preserves prior matching and unknown K1 header years without inventing fiscal dates"
  - line: "future-k1-duplicate"
    description: "Another source cannot conceal a known future original K1 header"
    formula: "Inspect each top-level actual K1 in both orders; a current or prior row does not erase a future contradiction. Do not scan prior basis, suspended loss, election, history or unrelated pass-through objects recursively."
    testRef: "tests/apps/web/verified-ai-k1-future-year.test.ts::rejects conflicting future K1 duplicates in either order while preserving actual history"
  - line: "future-k1-scope"
    description: "Future source denial cannot enable unsupported2026 annual facts or alter unknown-year parsing"
    formula: "Retain the integer optional original-year schema and existing historical calculation methods. Current2026 source years still encounter unchanged annual qualification gates. No Form1041 source-year inference, source repair, new taxes or filing activation."
    testRef: "tests/apps/web/verified-ai-k1-future-year.test.ts::preserves known-year schema and unavailable 2026 qualification"
