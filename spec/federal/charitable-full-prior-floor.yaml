    formula: "Joint original1000 with original separate excess400/600 and joint intervening use500 allocates200 to the current individual; actual later individual original300 makes priorC500. Both fully treated with no percentage carry, but their actual filing-unit sources still reject floor attribution."
    testRef: "tests/engine/forms/charitable-full-prior-floor.test.ts::rejects otherwise complete changed-unit sources at the prior floor boundary"
  - line: "canonical-proof"
    description: "Require the same original source ledger through selected treatment"
    formula: "Reclassifying full-prior proof as current-category-only, changed source digest, row identity/year/treated amount/deductible amount/floor or invented current carry rejects; actual production2026 constants remain unavailable."
    testRef: "tests/engine/federal-charitable-full-prior-floor.test.ts::rejects altered full-prior proof while keeping production2026 closed"
