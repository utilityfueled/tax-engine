form: "Form1099-B withholding"
fullName: "Original brokerage withholding and open-short-sale reporting"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i1099b"
notes: "Refreshed2026 instructions and archived2025 i1099b--2025.pdf, Box4 and Short sales/Backup withholding; final2025 i1040gi line25b. Original statement amounts remain Decimal. This does not implement a QOF, special gain or short-sale gain method."
lines:
  - line: "statement-source"
    description: "Preserve original withholding and source identity"
    formula: "Missing Box4 stays unknown. Each supplied amount is finite and nonnegative. A positive credit requires the actual original statement ID, source year, broker and taxpayer owner; spouse ownership requires the actual joint spouse. A repeated statement ID cannot repeat its withholding across gain rows."
    irsRef: "Form1099-B Box4; substitute recipient statements; Form1040 line25b"
    testRef: "tests/engine/forms/form-1099-b-withholding.test.ts::binds actual brokerage withholding to unique original sources"
  - line: "25b"
    description: "Include brokerage federal withholding once"
    formula: "Sum original Form1099-B Box4 amounts once per statement with Decimal and include that sum once in Form1040 line25b, regardless of the number of capital transactions. It does not alter proceeds, basis or taxable gain."
    irsRef: "Form1040 line25b and Form1099-B Box4"
    testRef: "tests/engine/forms/form-1099-b-withholding.test.ts::routes original brokerage withholding once to federal payments"
  - line: "open-short-sale"
    description: "Report withholding before a short sale closes"
    formula: "An actual current-year short sale still open at year end can have positive Box4 and an actual Box1a description with other numbered boxes blank. It carries no invented sale, proceeds, basis or gain. Its actual opened date, still-open status and original blank boxes must be confirmed; a later closed-sale statement must not repeat that prior-year withholding."
    irsRef: "Form1099-B Short sales of securities, Backup withholding,2025 and2026 instructions"
    testRef: "tests/engine/forms/form-1099-b-withholding.test.ts::retains open-short-sale withholding without fabricating a capital transaction"
  - line: "guided-source"
    description: "Forward original brokerage payment sources"
    formula: "Positive guided Box4 requires its actual statement ID, source year and owner. Duplicate IDs reject before calculation. The open-short record retains its actual description/date/status with no invented gain. Clearing Box4 preserves unknown and blocks the preview."
    irsRef: "Form1099-B Box4 and Short sales/Backup withholding"
    testRef: "tests/guided-interview/guided-brokerage-withholding.test.ts::forwards actual statement withholding once and retains open-short sources"
  - line: "guided-controls"
    description: "Collect withholding without floating-point conversions"
    formula: "Actual source ID/year and Box4 are entered separately from transactions. Large exact cents survive controls and bridge; clearing or removing source details leaves unknown. A withholding-only source keeps its record rather than creating fake proceeds and basis."
    irsRef: "Source integrity"
    testRef: "tests/apps/web/brokerage-withholding-interactions.test.tsx::collects exact withholding and actual open-short-sale sources"
  - line: "document-completeness"
    description: "Require known withholding in all preview sources"
    formula: "The complete-return document context requires actual known Box4 on every brokerage source, including unselected records; absence cannot become zero. Selected transaction evidence stays unchanged and actual payment sources are reconciled before preview."
    irsRef: "Form1040 line25b; original-source integrity"
    testRef: "tests/engine/workspace-calculation-context.test.ts::requires known Box4 for every actual brokerage preview source"
