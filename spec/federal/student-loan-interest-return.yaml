form: "Student Loan MAGI Worksheet"
fullName: "Canonical return integration of actual student-loan sources"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p970"
notes: "Publication970 chapter4 Worksheet4-1 and No Double Benefit. Actual source validation precedes deduction; final income includes taxable Social Security, Treasury/OID interest, education earnings and source recoveries. This is calculation integration, not professional review or filing qualification."
lines:
  - line: "sources"
    description: "Use actual borrower and loan records instead of dropping the source claim"
    formula: "Validate actual source year, lender/form links, borrower ownership, eligibility and nonoverlapping assistance using the source helper. Preserve source cents; supply one completed deduction to Schedule1line21. Positive2026 claims require actual source facts. Known ineligibility gives zero."
    irsRef: "Pub970 chapter4 Can You Claim the Deduction; IRC221"
    testRef: "tests/engine/federal-student-loan-sources.test.ts::routes actual loan sources once and preserves eligibility and unknown distinctions"
  - line: "magi"
    description: "Use canonical complete income and the actual foreign and possession addbacks"
    formula: "MAGI=final income before student-loan deduction minus all other Schedule1 adjustments plus Form2555 net excluded income, housing deduction and actual PR/AS exclusions. Use final taxable savings-bond interest and final allowed passive losses. SSA and bond/passive worksheets exclude or add back student-loan deduction, so their ordinary calculations do not depend on its tentative amount."
    irsRef: "Pub970 Worksheet4-1 lines2-9; Pub915 Worksheet1; Form8815/8582 MAGI"
    testRef: "tests/engine/federal-student-loan-sources.test.ts::uses all return income and actual possession addbacks for the phaseout"
  - line: "passive"
    description: "Calculate the deduction after the allowed rental loss"
    formula: "Actual final Form8582 suspension increases canonical MAGI before the student-loan phaseout; the disallowed rental loss cannot create a loan-interest deduction. No second source deduction enters AGI."
    irsRef: "Pub970 Worksheet4-1; Form8582 modified AGI instructions"
    testRef: "tests/engine/federal-student-loan-sources.test.ts::uses the final allowed passive loss rather than the unallowed rental loss"
  - line: "social-security"
    description: "Include actual taxable benefits while retaining the final excluded deduction in the benefit audit"
    formula: "Taxable Social Security is calculated without subtracting student-loan interest. Include the resulting taxable benefits in loan MAGI, then retain the completed deduction as an excluded-source audit input without changing benefits. 80000 wages plus8500taxable benefits gives88500MAGI and1917deduction."
    irsRef: "Pub970 Worksheet4-1; Form1040 Social Security Benefits Worksheet line6"
    testRef: "tests/engine/federal-student-loan-sources.test.ts::includes taxable benefits before the phaseout and retains the completed excluded deduction"
  - line: "savings-bond"
    description: "Use the allowed savings-bond exclusion before calculating student-loan MAGI"
    formula: "Form8815MAGI adds back student-loan interest; the bond exclusion can therefore be calculated before the deduction. 97000wages plus4000bond interest yields101000bondMAGI,3600bond exclusion,97400loanMAGI and433loan deduction."
    irsRef: "Pub970 Worksheet4-1; Form8815 modified AGI worksheet"
    testRef: "tests/engine/federal-student-loan-sources.test.ts::uses the allowed savings-bond exclusion before the loan deduction"
  - line: "529"
    description: "Coordinate actual loan expense identities with education-distribution earnings"
    formula: "Forward the calculated per-expense529 interest vector unchanged. Subtract only excluded earnings used for the linked loan's interest, not basis-funded payments or an unrelated borrower's expense. Remove the temporary unsupported handoff gate only when actual loan sources reconcile."
    irsRef: "Pub970 No Double Benefit; IRC221(e)(6)"
    testRef: "tests/engine/federal-student-loan-sources.test.ts::preserves basis-funded interest while coordinating actual529 excluded earnings"
  - line: "coupled-nol"
    description: "Preserve the unresolved NOL limitation boundary"
    formula: "A positive actual source-qualified loan claim with positive prior NOL needs the coupled NOL/deduction source worksheet; do not silently use pre-NOL MAGI as final. Historical unverified previews remain unqualified."
    irsRef: "IRC172(a)(2); Pub970 Worksheet4-1; Pub536"
    testRef: "tests/engine/federal-student-loan-sources.test.ts::refuses a material actual loan and NOL claim without coupled source computation"
