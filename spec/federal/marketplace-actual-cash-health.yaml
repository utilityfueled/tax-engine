  - line: "ordinary-controls"
    description: "The full interview exposes original payments and source reconfirmation"
    formula: "The original policy, payment and person fields remain editable before Continue. Changing consumed sources revokes health and Marketplace confirmations; actual no-advance benchmark confirmations remain independent. Reconfirmation retains gross1875, cash450 and other-person1425."
