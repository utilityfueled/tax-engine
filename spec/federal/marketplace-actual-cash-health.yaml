    formula: "Original ordinary1250/shared1875 and actual450 cash produce final AGI279665 from business300000 less SE14935 and health5400. A separately sourced benchmark change does not replace the cash; actual confirmation and unknown MEC controls persist through reload. Private source identifiers remain local."
    testRef: "apps/web/tests/guided-marketplace-actual-cash.spec.ts::preserves actual payments independently of policy allocation after edits and reload"
