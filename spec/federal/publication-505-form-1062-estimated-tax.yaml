form: "Publication 505 (2026) section 1062 estimated tax adjustment"
fullName: "One confirmed farmland election adjustment to Worksheets 2-1 and 2-9"
taxYear: 2026
reference: "https://www.irs.gov/forms-pubs/clarification-for-calculation-of-estimated-tax-payments-when-making-an-election-under-section-1062a"
sources:
  - "https://www.irs.gov/publications/p505"
  - "https://www.irs.gov/pub/irs-drop/n-26-03.pdf"
  - "https://www.irs.gov/instructions/i1062"
  - "https://www.irs.gov/pub/irs-efile/ty26-1040-ats-scenario-13.pdf"
revision: "IRS correction to Publication 505 (2026) and Notice 2026-3 section 4.02, retrieved 2026-11-13"
notes: |
  The IRS correction supplements the printed 2026 worksheets. Publication 505
  itself will not be republished for this clarification. This adapter computes
  only their section 1062 additions for one confirmed calendar-year 2026
  individual election and one elected sale. Use the existing Form 1062 and
  Schedule A calculation with the supported direct-sale, domestic partnership
  or S corporation facts. The caller confirms the properly made election and
  full-year determinations. This method does not compute estimated payments,
  change prior-year safe harbors, establish a penalty waiver, calculate
  Form 2210 or 2210-F, follow a later installment, or permit filing or export.
  Multiple transactions with staggered recognition need separate authority and
  a method to attribute the combined tax difference among elected sales.
lines:
  - line: "source"
    description: "Recompute the full-year Form 1062 for one confirmed elected sale"
    formula: "Require a confirmed 2026 calendar year, one Form 1062 sale input and a single original sale identity. Replay Form 1062 and confirm the sale and annual tax determinations through its validators. Bind the period tax-income record to the same original sale identity and calendar year. Do not emit original identities, attachments or statement references in the result. Reject multiple elected sales and elections or recognition records from other years."
    testRef: "tests/engine/forms/publication-505-form-1062-estimated-tax.test.ts::requires one validated 2026 election and the same sale's income record"
  - line: "2-1 11b"
    description: "Add the deferred share alongside the otherwise allowable line 11b items"
    formula: "Return the exact addition 0.75 times the computed full-year Form 1062 line 14; the remaining 25% is not part of this adjustment. Worksheet 2-1 line 11c subtracts its complete line 11b from line 11a with a zero floor. Return the addition only, without rounding, a second subtraction, or any withholding or previous-year amounts."
    testRef: "tests/engine/forms/publication-505-form-1062-estimated-tax.test.ts::adds exactly 75 percent of full-year liability to Worksheet 2-1 line 11b"
  - line: "2-9 periods"
    description: "Use the actual four cumulative Worksheet 2-9 income confirmations"
    formula: "Require a confirmed Boolean for each calendar-year period beginning January 1 and ending March 31, May 31, August 31 or December 31, keyed by those exact dates. False can precede true; once true it cannot become false, and the full-year period must include the income. Reject inclusion in a period that ended before the confirmed sale date. A sale date within a period does not establish income inclusion in that period."
    testRef: "tests/engine/forms/publication-505-form-1062-estimated-tax.test.ts::requires explicit known inclusion for all four cumulative periods"
  - line: "2-9 20"
    description: "Apply the same full-year reduction to each included income period"
    formula: "For each applicable column return the same positive addition to line 20 as for Worksheet 2-1 line 11b. Return zero in columns without the sale income. Worksheet 2-9 line 21 subtracts its complete line 20 from line 19 with a zero floor. Do not annualize, apportion, cap against a period's tax, apply the applicable percentage, or calculate a payment in this adjustment. IRS TY2026 ATS Scenario 13 (PDF pp. 30-31) supplies Form 1062 line 14 of $13,621; $10,215.75 and the explicitly confirmed period flags are derived and synthetic respectively. The ATS example does not provide either Publication 505 worksheet."
    testRef: "tests/engine/forms/publication-505-form-1062-estimated-tax.test.ts::reuses the exact ATS-based reduction in every confirmed period without annualizing"
