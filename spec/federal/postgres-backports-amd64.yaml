form: "PostgreSQL-Backports-AMD64"
taxYear: 2025
status: "opt-in-infrastructure-verification-contract"
reference: "Pinned existing PostgreSQL libxml2/gosu source manifests; GitHub standard hosted Linux runner documentation"
notes: |
  Infrastructure only. No tax calculation, default Compose, ordinary CI, publication,
  promotion, risk acceptance, generic ABI approval or authored vulnerability reproduction.
  Three manual-only native hosted jobs have a combined maximum270 minutes and zero retries.
lines:
  - line: "host-and-source"
    description: "Admit only the same exact source on a standard public native hosted runner"
    formula: "Require manual dispatch on default branch of a public nonfork repository, GitHub-hosted Linux x64 runner, Linux amd64 local Unix Docker daemon, full matching source SHA, unchanged tracked source and no running containers. Never use emulation, remote daemon or paid fallback."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::rejects private fork remote emulated or mismatched execution"
  - line: "capacity-and-time"
    description: "Preserve explicit scratch and cleanup reserves"
    formula: "Package budget20GiB, runtime12GiB, independent8GiB includes2GiB untouched reserve; require capacity on workspace and Docker filesystems and recheck2GiB reserve before each ordinary command. Finite command close grace stays inside monotonic deadlines. Job ceilings165+90+15=270minutes include outer cleanup and artifact upload allowances. Stop on inadequate capacity without deleting unrelated data."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::requires actual capacity and preserves cleanup time"
  - line: "public-inputs"
    description: "Fetch and verify only exact reviewed public inputs"
    formula: "Use exact existing recipe/source pins plus nativeAMD Go SDK, checksum-pinned Linux scanner tools and fresh official Grype DB listing. HTTPS allowlisted hosts, bounded streamed bytes, SHA256/length verification, no alias files, no private ARM exports and no runtime network during package/gosu compilation."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::rejects stale database altered inputs and unapproved download hosts"
  - line: "native-binary"
    description: "Verify actual AMD ELF and compiler metadata"
    formula: "Require ELF64 little-endian machine62 static gosu plus exact Go1.27.4, linux/amd64, CGO0 and frozen two-module metadata. ARM binary or metadata substitution rejects independently of accurate artifact hashes."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::rejects ARM binaries dynamic headers and mismatched AMD metadata"
  - line: "immutable-handoff"
    description: "Bind cross-job archives to exact source and actual image config"
    formula: "Internal allowlisted manifest has unique leaf names, exact lengths/hashes, source/run/attempt identities, candidate image IDs and no release claims. Docker archive config SHA matches image ID and linux/amd64 metadata. Missing, duplicated, aliased, traversing, changed or extra files reject before load. Fresh third job cannot already contain candidate."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::rejects changed aliased escaping or foreign handoff artifacts"
  - line: "runtime-and-cleanup"
    description: "Keep synthetic functional facts and operation custody separate from approval"
    formula: "Require named/numeric identity groups HOME exec/PID1 ordinaryTERM, synthetic PostgreSQL SCRAM NUMERIC38,8 XML bytea restart dump restore stopped-volume rollback, same-AMD consumer hashes, full notices, and owned normal cleanup. Before removal require stopped state, matching label, OOMKilled explicitly false, and integer exit0 through125; retain ordinary42 but reject unknown, negative and signal-form134/139 exits. Retain unknown or failed cleanup; never force-remove a running resource or touch resources with different labels."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::cleans only verified owned stopped resources and retains failures"
  - line: "publication-and-scan"
    description: "Publish only verified public evidence and unfiltered archive-bound scan"
    formula: "Always export a fixed public allowlist and failure summary; no credentials dumps contexts source caches maintained patch copies probes or rawruntime logs. Independent native job verifies archive ID actual gosu/provider/notices and binds fresh SBOM/rawscan to exact archive/source/config/layers. Scanner completion is distinct from security acceptance; all release risk and genericABI claims stayfalse."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::publishes an explicit allowlist and never upgrades retained findings"
  - line: "mid-cleanup-uncertainty"
    description: "Uncertainty discovered during cleanup blocks every later command"
    formula: "A global command and daemon guard prevents further execution after any owned child becomes unconfirmed, including while normal stop is already in progress. Retain the failed cleanup receipt; do not continue to another container or any volume/image inspection/removal."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::stops all later daemon commands when closure becomes uncertain during cleanup"
  - line: "local-reap-not-daemon-proof"
    description: "A terminated CLI's local exit does not establish daemon operation closure"
    formula: "Explicit bounded termination or any signal-form failure leaves operation custody uncertain even if the local CLI was reaped, including SIGHUP. No subsequent command is allowed. Ordinary confirmed numeric nonzero workload exits retain their ordinary failure semantics."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::retains daemon uncertainty after an explicitly terminated local child was reaped"
  - line: "all-signal-closure"
    description: "Signal-form exits cannot bypass the global custody hold"
    formula: "An actual benign local SIGHUP child sets uncertainty and prevents the next child from starting. A confirmed numeric exit9 preserves ordinary nonzero failure semantics. Apply the hold to every signal-form exit rather than an enumerated subset."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::holds any actual signal exit while retaining numeric failure semantics"
  - line: "raw-scanner-suppressions"
    description: "Verify effective Grype configuration and retain all raw matcher evidence"
    formula: "Set match-upstream-kernel-headers and include-matcher-suppressions true with ignore empty. Reject actual raw descriptor.configuration if ignore is nonempty or either flag is missing/false. Preserve the full original raw JSON including any ignoredMatches and distinguish their counts; completion never accepts risk."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::publishes an explicit allowlist and never upgrades retained findings"
  - line: "explicit-image-cleanup"
    description: "Remove each verified owned image without implicitly pruning its ancestors"
    formula: "Every controller candidate/import image removal uses --no-prune without force. Runtime cleanup first admits at most64 exact Parent-chain nodes above its immutable imported base using a prebuild all-image-ID snapshot. Every intermediate must be new, Linux/AMD64, untagged, without digest or container references; absent CLI operation labels are allowed only through this exact ancestry custody, while present foreign labels reject. Reinspect identity, parent, operation and references before child-first explicit removal; stop at the imported base and preserve its ancestors. Missing, cyclic, preexisting, foreign, referenced, changed or unknown ancestry holds cleanup with no later image command. The imported base remains present after candidate removal and is then independently inspected for exact identity and ownership before its explicit removal. Preserve foreign ancestors. Missing images, daemon errors, foreign labels and removal conflicts remain cleanup failures; no missing-image exception or relaxed exit code admission. Retain all normal container closure and global uncertainty gates."
    testRef: "tests/scripts/postgres-backports-amd64.test.ts::closes new legacy intermediate chains without touching foreign ancestors"
