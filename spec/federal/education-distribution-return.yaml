form: "Education distribution return coordination"
fullName: "Form1099Q actual year, recipient and Form8863 coordination"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p970"
retrievedAt: "2026-10-25"
notes: "Publication970 chapters6/7 no-double-benefit and recipient income rules. Actual source module is independently specified in form-1099-q-source.yaml. This is calculation integration, not filing qualification."
lines:
  - line: "year"
    description: "Return-year source handoff"
    formula: "Pass actual return taxYear to1099Q;2026 requires actual ledger and statement source facts, never the historical2025 fallback."
    testRef: "tests/engine/federal-education-distribution.test.ts::uses actual return year for the2026 K12 cap and preserves unknown sources"
  - line: "recipient"
    description: "Only actual return recipients affect income and additional tax"
    formula: "Own primary/spouse earnings enter Schedule1line8z once and own recipient additionalTax enters Schedule2; other recipients stay in source result only. A spouse source requires an actual joint-return spouse."
    testRef: "tests/engine/federal-education-distribution.test.ts::routes the published credit-coordination example once for actual return recipients"
  - line: "credit-input"
    description: "Actual credit student binding"
    formula: "Pass complete actual Form8863 input or an explicit empty credit list; positive credit allocations must bind one actual student's expense source."
    testRef: "tests/engine/federal-education-distribution.test.ts::rejects a source credit allocation without an actual claimed student"
  - line: "credit-result"
    description: "Reconcile final allowed credit"
    formula: "When a credit allocation causes taxable education earnings, require that actual linked student's eligible AOC or LLC has a positive allowed return benefit after phaseout and tax limit; no automatic expense reassignment."
    testRef: "tests/engine/federal-education-distribution.test.ts::rejects a taxed allocation when the actual linked credit is zero"
  - line: "credit-result-outside-recipient"
    description: "Validate a claimed credit that affects another recipient's education earnings"
    formula: "Credit-caused taxable earnings include every actual linked beneficiary source for final credit coordination, including an outside recipient. Require the linked allowed credit without assigning that recipient's income or additional tax to this return."
    testRef: "tests/engine/federal-education-distribution.test.ts::validates an outside recipient's credit allocation without moving their income onto this return"
  - line: "student-eligibility"
    description: "Do not substitute another student's allowed credit"
    formula: "Retain per-student eligible LLC expenses, like per-student AOC tentative credit, and validate the source-linked student even when another student's credit is positive."
    testRef: "tests/engine/federal-education-distribution.test.ts::does not use another LLC student to validate an ineligible allocation"
  - line: "loan-coordination"
    description: "No silent double student-loan benefit"
    formula: "A calculated own-borrower excluded-earnings reduction with a positive legacy student-loan claim requires the actual loan-interest source worksheet; retain known amounts until that source can reconcile the exclusion once."
    testRef: "tests/engine/federal-education-distribution.test.ts::requires actual loan sources when529 excluded earnings overlap a loan-interest claim"
  - line: "part2-source-conflict"
    description: "Legacy additional-tax totals cannot duplicate actual source results"
    formula: "With verified education distributions, positive legacy aggregate Form5329 PartII amounts must be reconciled into the actual recipient sources; never add both as independent taxable distributions."
    testRef: "tests/engine/federal-education-distribution.test.ts::refuses ambiguous legacy PartII totals alongside actual education sources"
