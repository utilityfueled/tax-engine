form: "Independent standalone flatten structural review"
fullName: "Narrow deleted-widget cleanup and preservation of existing PDF structures"
taxYear: 2026
reference: "https://pdf-lib.js.org/docs/api/classes/pdfform#flatten"
notes: |
  Independent source-first controls of frozen product155376fc, not author changes.
  Explicit flatten removes only references invalidated by that operation. Save
  defaults remain interactive and preserve unsigned signature structure. Existing
  missing/orphan ambiguity, linked annotations, retained tags/ParentTree mappings
  and references outside structure K must not be silently sanitized. Legal indirect
  name-valued dictionary entries must resolve before widget/OBJR classification;
  PDF dictionaries permit indirect values (Adobe PDF Reference section3.2.9).
  Strict saved-byte reader visits trailer plus every xref/object-stream object.
  No cryptographic signing, signed-document flatten approval, PDF/UA, tax or
  production readiness qualification is claimed. All authored six paths immutable.
