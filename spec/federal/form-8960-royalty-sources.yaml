    description: "Keep MISC and K1 portfolio royalties after the excluded business adjustment"
    formula: "At wages200000, MISC7000.75 plus K1royalties3000.25 gives royalties10001. With active ordinary5000, line4a15001 less adjustment5000 gives line4c10001 and NIIT380. With passive ordinary5000, adjustment0 gives line4c15001 and NIIT570. Partnership and S corporation royalty character remains independent of ordinary activity character."
    testRef: "tests/engine/federal-niit-royalty.test.ts::retains MISC and K1 royalties independently of ordinary activity character"
  - line: "4c-passive-loss"
    description: "Do not offset portfolio royalties with suspended passive activity losses"
    formula: "Wages200000, royalty12000 and ordinary passive loss10000 gives AGI212000, suspended loss10000, line4c12000 and NIIT456. Both entity types preserve the same portfolio income; actual permitted passive income6000 and loss2000 instead contribute4000 once alongside royalty10000, giving NIIT532."
    testRef: "tests/engine/federal-niit-royalty.test.ts::retains royalties separately from suspended and allowed passive losses"
  - line: "13-17-threshold"
