notes: |
  Final 2025 instructions lines 4a/4b include the completed Schedule 1 line 5
  and exclude only excepted business income. Portfolio royalties are investment
  income under section 1411(c)(1)(A)(i); they do not become excluded merely
  because they are outside the section 469 passive pool. Schedule E Part I
  retains original MISC box 2 and K1 royalty amounts. This package transfers
  those represented amounts exactly once into Form 8960 line 4c while retaining
  the existing passive loss allowance and active-business adjustment.
  This does not implement unrepresented royalty expenses, direct business
  classification, personal-property rentals or passive/SE overlapping methods.
  Synthetic literal calculations below are independently derived controls,
  not published IRS examples or independent human qualification. Full 2026
  readiness and final form qualification remain closed.
lines:
