form: "Current Charitable Candidates"
fullName: "2026 source-complete current public cash and final deduction selection"
taxYear: 2026
irsReference: "https://uscode.house.gov/us/usc/119-120/t26/s170/"
retrievedAt: "2026-10-25"
reviewStatus: "independent-review-pending"
notes: |
  IRC170(G)(i)/(ii),I,d(1)(C) andp define distinct current-only itemized and
  nonitemized results. A confirmed empty actual prior ledger removes the
  current-versus-prior floor-attribution question; it must not be inferred
  from omission. Reg1.170A-10(a)(2) preserves percentage carry in standard
  years, while170(p) disregards the itemized floor and prior carry for the
  current deduction. This method supports only actual ordinary public cash,
  no positive prior vintages or NOL sources. It retains both candidates and
  selects the matching carry only after the final canonical deduction choice.
  Current ordinary public property is separately source-bound under
  current-charitable-public-property.yaml. Positive prior itemized, other
  mixed-category and loss methods remain separate.
  Numerical cases are literal statutory derivations, not published IRS examples.
lines:
  - line: "two-current-candidates"
    description: "Compute exact current-only candidates from one original source set"
    formula: "For base10000.49/current9000.99, G capacity6000.294; itemized floor50.00245; exact itemized deduction5950.29155 and carry3050.69845; nonitemized percentage carry3000.696. No early dollar rounding or cap-created nonitemizer carry. At current6000 with base10000, no percentage excess means floor50 is not carried; at6000.01 itemized carry is50.01."
    testRef: "tests/engine/forms/current-charitable-candidates.test.ts::retains both exact current cash carry candidates without prior attribution"
  - line: "actual-empty-history"
    description: "Require an actual reconciled empty history rather than assume no carry"
    formula: "Validate actual return identity, year, history confirmation and explicit empty vintages. Reject positive prior sources, missing/changed identity, mixed current categories, pass-through discrepancies and NOL sources without converting them into zero."
    testRef: "tests/engine/forms/current-charitable-candidates.test.ts::requires actual empty prior history and original ordinary public cash sources"
  - line: "final-selection"
    description: "Bind final carry to the actual selected deduction method"
    formula: "For base10000/current9000 with confirmed empty history, itemized charity5950/carry3050 remains the candidate; automatic standard selects current170(p)1000 and carry3000. Explicit itemized retains carry3050 and no170(p). At base100000/current90000, automatic itemization selects charity59500/carry30500. No standard entitlement is manufactured."
    testRef: "tests/engine/federal-current-charitable-candidates.test.ts::selects the correct carry after the final automatic or explicit deduction choice"
  - line: "source-preservation"
    description: "Keep unsupported prior and unknown source methods closed"
    formula: "Actual empty source packets cannot change current-only itemized arithmetic relative to the same complete current receipts. Missing history and positive prior itemized histories still reject; original inputs stay unchanged. Canonical selected carry follows the actual deduction while preview taxable income and state federal AGI retain their correct bases."
    testRef: "tests/engine/federal-current-charitable-candidates.test.ts::preserves current source arithmetic and rejects an unimplemented prior floor method"
  - line: "guided-and-export-boundaries"
    description: "Preserve actual guided sources and the closed calculation and export boundaries"
    formula: "The existing actual charity collector forwards confirmed empty history and exact current cash into the itemized candidate. Revoked confirmation rejects. Unmocked canonical 2026 calculation, guided preview and PDF export remain unavailable; this calculation method does not qualify a future-year filing artifact."
    testRef: "tests/guided-interview/guided-current-charitable-candidates.test.ts::preserves actual current candidates without opening year or export gates"
