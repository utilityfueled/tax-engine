form: "Guided Form2555 sources"
fullName: "Actual foreign earned income and qualification sources"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i2555"
notes: "Original source money remains exact Decimal. The canonical return binds actual income once and calculates exclusions, housing limits and stacking tax. One-owner W2, separate employment and personal-service ScheduleC sources are supported; distinct missing methods remain explicit."
lines:
  - line: "qualification"
    description: "Collect actual tax-home and completed residence or presence evidence"
    formula: "Require actual owner, year, household identity, source reference, foreign tax-home dates and known citizenship/residence and service qualifications. Physical presence uses a completed twelve-month period and at least330 nonoverlapping full foreign days. Bona fide residence uses actual qualification and an uninterrupted period containing a full calendar year, with treaty eligibility for resident aliens. Current-year qualifying days reconcile to the dated tax-home/test intersection. Known ineligibility is preserved; missing is not false."
    irsRef: "Form2555 Who Qualifies; PartsI-III; lines16 and31"
    testRef: "tests/guided-interview/guided-foreign-income.test.ts::validates actual completed qualification periods and known ineligibility"
  - line: "sources"
    description: "Bind original owner-specific income without duplicate wages or a profit override"
    formula: "Map exact original W2 source indices/year/owner/employer, actual ScheduleC receipts or separately identified foreign employment. Original PartIV, current and prior receipts conserve independently. Use the same core source resolver. Pending AI values cannot become confirmed source facts. Positive capital-material business, K1, unsupported other or two-owner methods remain explicit."
    irsRef: "Form2555 PartIV and lines19-26; income earned in prior year"
    testRef: "tests/guided-interview/guided-foreign-income.test.ts::binds original foreign receipts with exact zero and unknown handling"
  - line: "housing-and-history"
    description: "Preserve actual housing and prior-year worksheets"
    formula: "Collect qualified housing costs, original notice locations/days, qualification and no-duplicate-allocation evidence, deductions allocable to excluded income and actual prior housing or income sources. Positive prior amounts require actual prior year, worksheet references and source confirmations. Do not derive an arbitrary housing limit or infer absent zero amounts."
    irsRef: "Form2555 lines28-36,44-50 and prior-year income statement"
    testRef: "tests/guided-interview/guided-foreign-income.test.ts::preserves housing and prior-income sources without inferred amounts"
  - line: "canonical"
    description: "Calculate full-return foreign exclusions from actual sources"
    formula: "Actual2025 single160000 W2 wages with120000 foreign eligible wages has40000 AGI,24250 taxable income and5820 stacking tax. Separate foreign employment enters gross income once. The guide does not supply calculated exclusion, taxable income or tax. Actual2026 source validation does not open the incomplete2026 full-return gate."
    irsRef: "Form2555 lines42-45 and Form1040 Foreign Earned Income Tax Worksheet"
    testRef: "tests/guided-interview/guided-foreign-income.test.ts::calculates actual foreign income once through the canonical return"
  - line: "confirmation"
    description: "Recheck actual sources after related edits"
    formula: "Substantive household, wage, business and deduction changes revoke confirmation while retaining original foreign records. Confirmation-only edits do not cycle. Selecting foreign work routes to adjustments even without a domestic W2."
    irsRef: "Form2555 source and qualifying-period requirements"
    testRef: "tests/guided-interview/guided-foreign-income.test.ts::routes foreign work and revokes stale source confirmation"
  - line: "interactive"
    description: "Collect exact sources with local controls"
    formula: "Actual controls retain unknown, false, zero, cents, original source links, dates and prior worksheets; edits revoke confirmation and explicit removal is available. No taxpayer source is transmitted by these controls."
    irsRef: "Form2555 original source requirements"
    testRef: "tests/apps/web/foreign-income-interactions.test.tsx::collects actual foreign sources and qualification without defaults"
  - line: "foreign-geography"
    description: "Keep country qualification distinct from a typed place name"
    formula: "Require actual foreign-country qualification. U.S. places, territories, Antarctica and international waters cannot be confirmed as qualifying foreign countries. Cuba periods require known permitted travel; known ineligibility retains original income and zero qualifying days. Missing geography qualification remains unknown."
    irsRef: "Form2555 Foreign country and Travel to Cuba; Pub54 chapter4"
    testRef: "tests/guided-interview/guided-foreign-income.test.ts::requires actual eligible foreign geography and travel facts"
  - line: "business-source-completeness"
    description: "Require the full actual source ledger before binding business receipts"
    formula: "A guided ScheduleC mapping requires actual manual receipts including zero, all entered NEC compensation, owner/business identity, returns, cost of goods sold and other income. No incomplete ledger can fall back to an apparently complete NEC subtotal. Personal-service classifications and source cents reconcile independently."
    irsRef: "Form2555 line20 and actual ScheduleC income sources"
    testRef: "tests/guided-interview/guided-foreign-income.test.ts::binds complete personal-service business sources without an income override"
  - line: "household-residence"
    description: "Reconcile represented household alien status with the exclusion claimant"
    formula: "A primary taxpayer cannot simultaneously be an actual U.S. citizen and have a known nonresident-alien household answer. A known nonresident primary taxpayer claiming the physical-presence rule as an elected resident requires an actual joint return and resident-joint election. U.S. residency months are not interpreted as physical travel days."
    irsRef: "Form2555 Who Qualifies and Physical Presence Test resident-spouse election note"
    testRef: "tests/guided-interview/guided-foreign-income.test.ts::reconciles actual household alien status without reinterpreting residency months"
  - line: "partial-saved-section"
    description: "Reopen an actual foreign source without fabricating legacy adjustment totals"
    formula: "A saved adjustments object that contains only its actual foreign worksheet must render. Absent legacy scalar amounts remain blank; source edits preserve the worksheet and revoke only source confirmation."
    irsRef: "Source preservation; no deduction or income inference"
    testRef: "tests/apps/web/foreign-income-interactions.test.tsx::reopens a partial saved adjustment section with unknown legacy amounts"
