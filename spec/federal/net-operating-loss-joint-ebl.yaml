  - line: "source-qualified-owner"
    description: "Bind actual qualified histories to the correct original component and owner"
    formula: "Each regular EBL original has its actual complete qualified opening history and owner. Missing, duplicated, stale or other-owner character cannot qualify an ordinary source or the other spouse's source. Known-zero qualified amounts remain recorded facts, not permission to assign partial tax carry."
    irsRef: "Reg1.199A-3(b)(1)(iv)(C); Form8995 Tracking Losses; Reg1.172-7"
    testRef: "tests/engine/forms/net-operating-loss-joint-ebl.test.ts::binds original qualified character and owner before current aggregation"
  - line: "multiple-qualified-originals"
    description: "Retain each461 origin's actual qualified character in a fully used pool"
    formula: "If both actual2021 originals are461 losses, Jane's qualified30000 less5000 history gives25000 opening while Alex's qualified10000 less1250 gives8750. Full85000 tax consumption releases33750 qualified loss, closes both suspended balances and separately carries33750 negative QBI. Original and qualified-history array order cannot change source identities or amounts."
