    formula: "For this determined joint EBL composition, bind the actual preceding-year joint Form8995 line16 or ScheduleC(Form8995-A) line6 to the original return ID and both actual owners. The prior and current returns must contain the same married couple; changing their primary/spouse order does not change the couple. Actual source amount and confirmation are required, including recorded zero. A complete prior-return no-carry record admits only exact zero. Suspended EBL qualified history cannot establish ordinary priorQBI carry. Missing legacy priorYear.qbiLossCarryforward stays missing and must not default to zero."
