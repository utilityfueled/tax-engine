    formula: "Actual2021 EBL50000 and actual2023 ordinary35000, with wages100000 and standard31500, give54800 total claim and absorption: older EBL50000 then ordinary4800. EBL qualified suspension closes0 while negative QBI25000 carries separately; ordinary30200 remains and actual original1411fraction1/4 gives1200. Reversing source order preserves every result."
