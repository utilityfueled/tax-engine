    description: "Compose the original ordinary prior carry without changing suspended EBL history"
    formula: "With full85000 tax use and25000 released qualified EBL, actual ordinary prior0 leaves25000 ordinary QBI carry; actual prior7000 leaves32000. Qualified EBL suspension still closes0, and regular85000/AMT20000 NOL remain unchanged. With actual additional K1QBI100000, net QBI is68000 after25000 released EBL and7000 prior ordinary loss, giving13600 deduction and266400 AMTI. No current EBL use plus prior7000 preserves25000 qualified EBL suspension and7000 ordinary QBI carry."
