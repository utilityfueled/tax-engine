form: "Section172 joint pool with determined461 character"
fullName: "Actual EBL and ordinary carry components with uniquely determined current use"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i172"
notes: |
  Reg1.172-7(b),(e),(f) provides current same-couple incoming pooling, while
  Reg1.199A-3(b)(1)(iv),(v) preserves actual originating qualified461 character.
  Current deduction and modified absorption are separate quantities. A component
  vector is resolved separately within its actual loss-year pool after existing
  statutory oldest-year ordering and expiry. It is determined only when its
  loss-year total is zero, equals all available amounts,
  or has exactly one positive available original. No owner priority or current
  allocation is an input. Every positive source must be known, validated and
  conserved. Source-only validation can retain an incomplete aggregate; a completed
  tax/QBI/output result must resolve every necessary component vector.
  Original EBL qualified opening/history and account-holder identity stay bound
  to the actual original source. Regular and AMT originals remain independent.
  Different original1411 fractions retain their separate existing method. A
  partial multi-positive same-year EBL pool remains guarded even if QBI is known
  zero. Determined partial use of a different-year pool remains available.
  Released negative QBI and still-suspended qualified EBL are different carries.
  Wages-only controls have no other current QBI. Their actual ordinary prior
  QBI carry is explicitly recorded: zero in the original controls, with7000
  in the named positive-prior and saved-guide controls below.
  Current joint COD and future partial owner allocation remain separate methods.
  These literals are independently derived arithmetic controls, not a published
  matching example or human qualification. No2026 readiness gate is changed.
lines:
  - line: "fully-consumed"
    description: "Compose actual ordinary and EBL originals after full current consumption"
    formula: "Actual2021 EBL60000 less filed10000 gives50000; qualified30000 less filed5000 gives25000. Actual2021 ordinary40000 less5000 gives35000. Joint wages200000 and standard31500 give sufficient80percent capacity to deduct and absorb85000. Qualified current deduction25000; each NOL source and qualified EBL suspension closes0; Form8995 line16 separately carries negative QBI25000; AGI115000. Ordinary original1411fraction10000/40000 gives8750, separate from qualified EBL character. With an additional original current K1 income/QBI100000 and actual zero SE, the25000 released qualified loss leaves75000 QBI and15000 deduction; AGI215000, AMTI265000 after independent20000 ATNOLD."
    irsRef: "Reg1.172-7(b),(e),(f); IRC172(a),(b); Reg1.199A-3(b)(1)(iv),(v); Reg1.1411-4(h)"
    testRef: "tests/engine/federal-net-operating-loss-joint-ebl.test.ts::composes fully consumed actual EBL and ordinary sources once"
  - line: "independent-vectors"
    description: "Resolve actual claim and modified absorption independently"
    formula: "At signed regular limit and modified income minus1500, both amounts0 preserve actual2021 EBL50000/ordinary35000 source openings and25000 qualified opening. Zero actual deduction with positive partial modified absorption still rejects unresolved closing character; it is not zero use. Full modified consumption with zero deduction has0 current qualified deduction and no remaining qualified EBL suspension and no new current negative QBI carry."
    irsRef: "IRC172(a),(b)(2); Reg1.172-5; Reg1.199A-3(b)(1)(v)"
    testRef: "tests/engine/forms/net-operating-loss-joint-ebl.test.ts::keeps deduction absorption and closing component proofs independent"
  - line: "single-positive"
    description: "Keep a known-zero source while the other source uniquely determines partial use"
    formula: "Actual2021 EBL opening50000 and actual2021 ordinary opening0 (original40000 fully used in filed2022) with limit and modified income18500 give14800 current use,35200 remaining,7400 qualified use at fixed1/2, and17600 still-suspended qualified EBL. Wages-only actual current return separately carries negative QBI7400 on Form8995 line16. Conversely, actual EBL60000 and its qualified30000 fully used historically leave ordinary35000: current14800 use leaves20200 ordinary carry and zero current qualified deduction or qualified EBL suspension. The original with known-zero opening remains in the ledger; source order has no effect."
    irsRef: "IRC172(a),(b)(2); Reg1.199A-3(b)(1)(iv),(v); original-source conservation"
    testRef: "tests/engine/forms/net-operating-loss-joint-ebl.test.ts::retains known-zero originals without inventing a partial source priority"
  - line: "independent-alternative"
    description: "Use separate actual AMT source components and90percent capacities"
