form: "Hosted-Billing-Mode-Binding"
fullName: "Configured Stripe mode binds outbound keys and signed inbound events"
taxYear: 2026
reference: "https://docs.stripe.com/keys; https://docs.stripe.com/api/authentication; https://docs.stripe.com/api/events/object; https://docs.stripe.com/webhooks"
notes: |
  Source-first security correction. API keys select test/live resource namespaces;
  a configured label alone does not. Webhook whsec secrets are separate and do
  not encode mode. Preserve all old raw-signature, retry, future-clock, exact-cent,
  idempotency, auth, redirect, AI-qualification and privacy controls. No real key,
  Stripe request, account modification or staging qualification is used by tests.
lines:
  - line: "configured-key-mode"
    description: "A configured server key must establish the chosen mode before outbound calls"
    formula: "Classify documented sk/rk test/live prefixes with a nonempty suffix; block incompatible and unclassified nonempty keys for all hosted NODE_ENV values before the existing API/custom callbacks. Keep test default and do not guess suffix length or alphabet."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::blocks incompatible keys before each outbound SDK operation (%s)"
  - line: "custom-adapter-boundary"
    description: "Explicit conflicting configured facts cannot bypass a supplied adapter"
    formula: "Apply the configured-key guard to subscription, top-up and portal before custom session callbacks; preserve absent-key nonproduction adapters and self-host bypass."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::blocks incompatible keys before each custom session adapter (%s)"
  - line: "matching-key-operations"
    description: "Matching account-level secret/restricted keys retain existing operations"
    formula: "Both sk/rk test/live pairs reach default client API methods once with the original synthetic key; no real network."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::permits matching secret and restricted keys for each outbound SDK operation (%s)"
  - line: "unknown-key-contract"
    description: "Other key forms do not provide supported mode evidence"
    formula: "Reject configured unknown/publishable/empty-suffix/org keys for the finite adapter rather than infer their mode or claim those forms globally invalid."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::blocks unclassified configured keys without leaking their values (%s)"
  - line: "development-preservation"
    description: "No broadened missing-configuration behavior"
    formula: "Missing-key nonproduction custom adapters and existing development preview fallbacks remain; hosted production missing key remains blocked. Self-host remains independent of configured Stripe facts."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::preserves absent-key development adapters and self-host bypass (%s)"
  - line: "signed-event-mode"
    description: "An authenticated event has explicit matching mode"
    formula: "After SDK verification and event shape/time validation require boolean event.livemode equal selected mode. Correct false is known test mode; do not truthiness-default or infer from whsec."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::rejects opposite signed event mode before all state writes (%s)"
  - line: "signed-event-missing"
    description: "Missing is not known false"
    formula: "Reject missing, null, number and string livemode before any persistent or in-memory effect; custom constructEvent cannot escape this contract."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::rejects absent or malformed signed event mode (%j)"
  - line: "matching-events"
    description: "Signature-only webhook does not require an API key"
    formula: "With only a signing secret, matching test/live subscription and credit events retain exact original paid1500 and credited1000 cents, owner and timestamp."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::accepts matching signed events without requiring an outbound API key (%s)"
  - line: "webhook-config-conflict"
    description: "Configured wrong-mode key is not ignored by inbound processing"
    formula: "Even a matching signed event cannot make a conflicting configured server key acceptable. Do not require subscription price configuration merely to verify a webhook."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::rejects configured key conflicts on signed deliveries (%s)"
  - line: "signature-replay-preserved"
    description: "Mode checks do not authenticate payloads or disable prior guards"
    formula: "Retain SDK 300-second tolerance, raw byte integrity, original creation timestamp validation, fresh-signature old retry and idempotent persistence sequence. No actual provider qualification is inferred."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::preserves signed retry and raw-byte authentication with explicit event mode"
  - line: "custom-event-boundary"
    description: "No dependency-specific event-mode exemption"
    formula: "The same signed event boolean contract applies when constructEvent is supplied; all failed events leave state unchanged."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::enforces explicit matching mode for supplied event constructors"
  - line: "private-errors"
    description: "Do not leak configured credentials or mutate supplied facts"
    formula: "Generic errors and diagnostics contain no key, payload, token or private recipient; caller environment remains unchanged."
    testRef: "tests/apps/web/hosted-billing-mode-binding.test.ts::keeps conflicting key failures private and caller facts unchanged"
