form: "Form2555 source rounding"
fullName: "Reconcile exact source dollars before completing rounded Form2555 lines"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i2555"
notes: "The return uses the IRS whole-dollar reporting convention. Source records retain cents. Following Form1040 instructions to include cents when adding amounts for a line, source totals and the employer fraction use exact amounts before the target display line is rounded. Applying that principle to subtraction and ratios is an explicit implementation interpretation, with source and display amounts separately audited; displayed components may differ from a displayed total by one dollar. Original amounts are not overwritten."
lines:
  - line: "24-26"
    description: "Conserve original receipts before computing printed income"
    formula: "Validate exact raw PartIV gross minus section119 against raw foreignEarnedIncome. Preserve cents when summing amounts for22g and24 and computing net26; round each target line once.100.40 wages plus100.40 business gives raw200.80 and displayed24/26=201. Never require exact source totals to equal a sum of individually rounded components."
    irsRef: "Form2555 lines24-26; Form1040 instructions Rounding Off to Whole Dollars"
    testRef: "tests/engine/forms/form-2555-rounding.test.ts::derives printed income from reconciled original PartIV amounts"
  - line: "34-35"
    description: "Keep printed employment and business portions conserved"
    formula: "Reconcile raw employer-provided income to actual raw employment sources and bound it by raw net foreign income. Compute the fraction from the exact source numerator/denominator to12 decimal places and cap at1. Display34 rounds the actual employer amount; all-employer source equality produces fraction1 without modifying source amounts or inventing self-employment. Housing tax amounts continue to round at the specified target lines."
    irsRef: "Form2555 lines27,34,35 and employer-provided amounts"
    testRef: "tests/engine/forms/form-2555-rounding.test.ts::preserves all-employment and mixed-source shares after whole-dollar rounding"
  - line: "exact-source-mismatch"
    description: "Do not hide source contradictions within a rounded dollar"
    formula: "A one-cent disagreement in raw PartIV, incomeSource mapping or employer-provided source totals rejects even if all values round to the same dollar. Section119 source exclusion cannot exceed actual noncash meals/lodging before rounding."
    irsRef: "Form2555 PartIV and income-source records"
    testRef: "tests/engine/forms/form-2555-rounding.test.ts::rejects source disagreements hidden by rounding"
