form: "Guided Form 8911 personal EV charging port"
fullName: "Actual source facts for 2026 personal-use EV charging ports"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i8911"
lines:
  - line: "2026-personal-charging-port"
    description: "Record one original-use personal charging port through Credits"
    formula: "Collect the actual invoice, ready-and-available record and census-tract location record references. Require the actual owner in the filing unit, one new electric car or truck charging port, original use beginning with that owner, ongoing installation and exclusive personal use at the owner's main home in one of the 50 states or D.C., and owner-incurred invoice costs and a confirmed location match. Send only source facts to the engine. Incomplete, unsupported and unconfirmed sources are held."
    irsRef: "26 USC 30C(c); Form 8911 and Schedule A instructions"
    testRef: "tests/guided-interview/guided-personal-ev-charger-8911.test.ts::passes one actual personal charging port from Credits to the federal input"
  - line: "actual-date-tract-and-cost"
    description: "Preserve the observed date, exact source cost and 2020 census GEOID"
    formula: "Require a real, observed 2026 placed-in-service date, a full 11-digit GEOID and three entered nonnegative amounts in dollars and cents. Retain leading GEOID zeros and explicit zero offsets. Total invoice offsets cannot exceed gross cost. Preserve the date when service began after June 30 so the engine can apply the termination date. The engine resolves tract eligibility from authoritative IRS data."
    irsRef: "26 USC 30C(c)(3) and (i); Form 8911 Schedule A instructions and Notice 2024-20, Appendix B"
    testRef: "tests/guided-interview/guided-personal-ev-charger-8911.test.ts::holds incomplete and unsupported records while preserving known facts"
  - line: "owner-and-retention"
    description: "Retain original entries and require new confirmation after changes"
    formula: "Save the exact entered draft. Material source edits, actual owner identity changes, return year changes or filing-unit changes revoke source confirmation. Unrelated personal edits do not revoke charging port confirmation. Existing returns without this source remain unchanged."
    irsRef: "26 USC 30C(c); Form 8911 Schedule A instructions"
    testRef: "tests/guided-interview/guided-personal-ev-charger-8911.test.ts::retains actual records on reopen and revokes stale owner or year confirmation"
  - line: "separate-personal-port-originals"
    description: "Retain each independently invoiced port and its records through save and reopen"
    formula: |
      Extend the existing single-port worksheet with optional records for
      separately invoiced ports. Require distinct actual port and invoice
      references and an affirmative confirmation that all costs and reductions
      are traceable separately, without shared costs. Capture each port's own
      service date and Census evidence. Hold unknown, repeated or shared source
      records. Material changes to an original port record revoke its
      confirmation and require fresh review of whether the costs are
      independent. Actual owner or year changes require fresh review. Retain
      all original source facts and the established single-port shape.
    irsRef: "IRC 30C(b)(2) and (i); IRS Form 8911 Item A; IRS Publication 6027, https://www.irs.gov/pub/irs-access/p6027_accessible.pdf"
    testRef: "tests/guided-interview/guided-personal-ev-charger-8911.test.ts::reopens separately invoiced ports with independent costs and service dates"
    testRefs:
      - "tests/guided-interview/guided-personal-ev-charger-8911.test.ts::requires fresh confirmation after editing an additional port or its owner"
