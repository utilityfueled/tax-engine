form: "Guided Schedule 1-A actual sources"
fullName: "Additional deduction source collection and household reconciliation"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i1040gi"
notes: "Original source amounts do not establish deductions. Canonical return calculation binds reported compensation, business profit and allowed deductions."
lines:
  - line: "source-links"
    description: "Bind employee and business claims to actual reported sources"
    formula: "Keep owner, occupation, actual qualification answers and original reported amounts. Employee total qualified Form4137 column1(c) is distinct from unreported line4 income. Each W2 or NEC reference is its actual filtered input index; business profits and allocable deductions are supplied only by canonical calculation."
    irsRef: "Schedule1-A lines4a-5/14; actual2026 W2 TP/TT and NEC1b/1d source reporting"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::binds actual employee business and overtime records without profit overrides"
  - line: "vehicle-senior"
    description: "Use actual loan and household eligibility facts"
    formula: "Retain exact original loan interest and amounts deducted elsewhere, borrower/lender/account/date/VIN/vehicle qualification, actual household SSN eligibility, and actual senior death facts. Exclusion amounts reconcile to other supplied household source records; knownfalse is retained and unknown never becomesfalse."
    irsRef: "Schedule1-A PartI, PartIV and PartV"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::preserves actual loan and senior facts and rejects unknown or conflicting sources"
  - line: "2026-reporting"
    description: "Require actual new-year reporting facts"
    formula: "Actual2026 employee tips/overtime bind to the original source year, W2TP/TT and tipped occupation codes; business tips bind to NECcashTips and actual TTOC. Every linked source must preserve its original year, including2025. Actual2025 statement totals are not bounded by Box1 after payroll exclusions; overtime gross compensation adds only an actual confirmed excluded-payroll amount to Box1. Historical2025 transition statements cannot stand in for2026 reporting. Reporting permits any two codes when more occupations exist, so the independently confirmed actual occupation is not inferred from or restricted to those two codes. Explicit0 remains actual and no original amount is counted twice."
    irsRef: "2026 General Instructions FormsW2/W3;2026 Instructions Forms1099MISC/NEC"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::requires actual year-specific reported tips and overtime"
  - line: "source-controls"
    description: "Collect actual deduction records without implicit qualification"
    formula: "Add/remove actual employee, business, overtime, vehicle and senior records; every source amount and qualification starts unknown. Edits revoke source confirmation; explicit zero and false remain visible. Cross-document source edits revoke confirmation while confirmation-only changes do not create cycles."
    irsRef: "Schedule1-A source recordkeeping and actual household eligibility"
    testRef: "tests/apps/web/schedule-1-a-source-interactions.test.tsx::collects actual additional deduction records and preserves unknown answers"
  - line: "source-routing"
    description: "Forward the confirmed worksheet once and invalidate changed evidence"
    formula: "The opt-in guided section forwards actual Schedule1-A and Form4137 facts once, using original document years. Household, compensation, business and deduction evidence changes require source reconfirmation; money retains exact decimals."
    irsRef: "Schedule1-A PartsI-VI; Form4137 income and payroll routing"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::routes the confirmed worksheet and invalidates substantive source changes"
  - line: "original-compensation-fields"
    description: "Preserve original compensation year and separately reported amounts"
    formula: "Keep actual W2 Box8/TP/TT/TTOC and NEC cash-tip/overtime/TTOC source fields without inserting zero or the return year. Supplied years must match the return; unknown remains unknown, explicit zero survives and malformed source values block calculation. Original code arrays remain distinct from a confirmed absent code."
    irsRef: "2026 W2/W3 instructions Box12TP/TT/Box14b and2026 NEC instructions Boxes1b-1d"
    testRef: "tests/guided-interview/guided-compensation-reporting.test.ts::preserves actual reporting years tips overtime and unknown fields"
  - line: "reporting-controls"
    description: "Collect original year and reporting fields with explicit unknown states"
    formula: "Source controls edit actual years, amounts and reported codes. Clearing an amount or code does not create zero or a no-code assertion; confirming no reported code is an explicit action."
    irsRef: "Actual2026 information-return source recordkeeping"
    testRef: "tests/apps/web/compensation-reporting-interactions.test.tsx::collects original compensation reporting without copying the selected year"
  - line: "direct-tip-report"
    description: "Support actual Form4137-only tip deductions without a fabricated W2"
    formula: "The explicit direct Form4137 method links the actual owner/employer ledger and qualified column1(c) amount. Employer-reported qualified tips must be zero. No W2, TP or alternative employer statement is invented when all applicable tips are directly reported on Form4137."
    irsRef: "1040 Instructions Schedule1-A line4b and qualified tips reported directly on Form4137"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::supports actual Form4137-only sources without an employer report"
  - line: "canonical-deduction"
    description: "Calculate the linked deduction once without changing its source income"
    formula: "The actual employee source contributes the greater of its qualified employer report and Form4137 column1(c); qualified business tips and overtime are added subject to their source limits. Schedule1-A leaves AGI and payroll tax unchanged, and the canonical business-tip deduction reduces QBI once."
    irsRef: "Schedule1-A lines4-14; section199A qualified business income exclusion for section224 tips"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::calculates the guided deduction without duplicating income or business adjustments"
