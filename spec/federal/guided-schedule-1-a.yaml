form: "Guided Schedule 1-A actual sources"
fullName: "Additional deduction source collection and household reconciliation"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i1040gi"
notes: "Original source amounts do not establish deductions. Canonical return calculation binds reported compensation, business profit and allowed deductions."
lines:
  - line: "source-links"
    description: "Bind employee and business claims to actual reported sources"
    formula: "Keep owner, occupation, actual qualification answers and original reported amounts. Employee total qualified Form4137 column1(c) is distinct from unreported line4 income. Each W2 or NEC reference is its actual filtered input index; business profits and allocable deductions are supplied only by canonical calculation."
    irsRef: "Schedule1-A lines4a-5/14; actual2026 W2 TP/TT and NEC1b/1d source reporting"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::binds actual employee business and overtime records without profit overrides"
  - line: "vehicle-senior"
    description: "Use actual loan and household eligibility facts"
    formula: "Retain exact original loan interest and amounts deducted elsewhere, borrower/lender/account/date/VIN/vehicle qualification, actual household SSN eligibility, and actual senior death facts. Exclusion amounts reconcile to other supplied household source records; knownfalse is retained and unknown never becomesfalse."
    irsRef: "Schedule1-A PartI, PartIV and PartV"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::preserves actual loan and senior facts and rejects unknown or conflicting sources"
  - line: "2026-vehicle-interest-statement"
    description: "Reconcile optional 2026 Form 1098-VLI Copy B with actual borrower payments"
    formula: "Preserve the actual statement calendar year, payer of record, verified lender and masked account reference, Box 2d VIN, Box 3a origination, confirmed blank Box 3b, exact Box 1 and Box 5 amounts, and actual Boxes 6 and 7. The independent payment records must show that Box 1 less direct payments by others and reimbursements of the borrower's payments equals the recorded unreimbursed borrower interest, in exact cents. Use the business-interest deduction only for the share of that same borrower-paid Box 1 interest already deducted. The guided statement path requires the current uncorrected 2026 Copy B, original lender and loan, both qualification boxes checked and corroborated, and zero outside nonqualifying interest. Positive Box 5 requires independently reviewed cash or same-loan interest credit evidence. Independently documented manual interest remains available without a statement, including below the issuer reporting threshold."
    irsRef: "https://www.irs.gov/pub/irs-pdf/f1098vli.pdf; https://www.irs.gov/instructions/i1098vli"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::routes actual 2026 Copy B and reconciles exact borrower payments"
  - line: "vehicle-interest-statement-controls"
    description: "Collect and reconfirm the original statement independently of the manual record"
    formula: "Adding Copy B is explicit. Payer attribution and payment amounts start unknown, including zero and the absence of a Box 3b date. The taxpayer compares the shared lender, masked account reference, VIN and origination date against both the loan records and Copy B, and explicitly confirms the current statement and allocation. Material changes require reconfirmation. Saved partial and exceptional facts survive replay. Collect no TIN or full loan account number in this source panel."
    irsRef: "2026 Form 1098-VLI Copy B and issuer instructions for payer of record and payments by third parties"
    testRef: "tests/apps/web/schedule-1-a-source-interactions.test.tsx::collects and reconfirms actual 2026 Copy B without overwriting loan records"
  - line: "2026-vehicle-interest-cash-refund"
    description: "Reconcile cash received for previously undeducted 2025 loan interest"
    formula: "The cash path requires a confirmed 2026 cash refund equal to Box 5 in exact cents for the matched loan purchased and originated in 2025. Confirm that the same borrower paid and bore the recovered 2025 interest and received the cash refund. Retain independent references to the cash receipt, the 2025 lender payment evidence and the filed federal return history, including any amendment. A 2025 lender portal or annual statement may substantiate lender payment evidence. Require actual zero prior deductions of the recovered interest on Schedule 1-A, business schedules and any other deduction or carryforward. This refund has no prior tax benefit and does not change the independent Box 1 reconciliation. Mixed refunds, third-party payments of recovered interest, missing return history, and deductions greater than zero require separate review. Any separate interest on the refund is handled independently as interest income."
    irsRef: "https://www.irs.gov/instructions/i1098vli; https://www.irs.gov/pub/irs-drop/n-25-57.pdf"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::routes documented Box 5 cash only when all prior deductions were zero"
  - line: "vehicle-interest-cash-refund-controls"
    description: "Retain and reconfirm the Box 5 draft"
    formula: "Show the cash review for positive Box 5 and retain an existing draft for reconciliation. Leave method, years, receipt, filed history, and all deduction amounts unknown until supplied. Keep entered amounts and source references when another field changes, while requiring the affected source confirmations again. Use references without full account or taxpayer ID numbers."
    irsRef: "2026 Form 1098-VLI Box 5 and Notice 2025-57 Section 3"
    testRef: "tests/apps/web/schedule-1-a-source-interactions.test.tsx::retains positive Box 5 evidence and requires reconfirmation after edits"
  - line: "2026-vehicle-interest-same-loan-credit"
    description: "Reconcile previously undeducted 2025 interest credited to 2026 interest on the same loan"
    formula: "Require the lender to use the borrower's own recovered funds to actually satisfy accrued 2026 interest on the same qualifying 2025 loan. Require exact equality to positive Box 5, explicit zero cash and other-payer amounts, and the common payment, receipt and filed return history confirmations. Separately enter current borrower interest excluding the credit. Its exact sum with the credit must equal total unreimbursed borrower interest already in Box 1. Require confirmation that the credit is included exactly once. Hold bookkeeping-only or future-interest credits, credits against principal, mixed cash, other payers, missing evidence and prior deduction or carryforward."
    irsRef: "Instructions for Form 1098-VLI reimbursement example; Form 1098-VLI Copy B Box 5; 26 CFR 1.163-16(c)(2)"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::reconciles a documented Box 5 credit included in the same loan's Box 1 interest"
  - line: "vehicle-interest-same-loan-credit-controls"
    description: "Keep cash and credit recovery evidence independently editable"
    formula: "Changing recovery method keeps entered facts and clears affected confirmations. A saved cash amount or receipt does not supply zero cash or credit evidence. Editing current interest or the credit revokes allocation and source confirmation; the filed 2025 return review is separate."
    irsRef: "2026 Form 1098-VLI issuer example of prior interest credited to current interest"
    testRef: "tests/apps/web/schedule-1-a-source-interactions.test.tsx::keeps cash and loan credit evidence separate through method switches"
  - line: "vehicle-interest-same-loan-credit-reducer"
    description: "Recheck affected proof after batched same-loan credit updates"
    formula: "Method or payment evidence changes clear the relevant nested confirmations on batched worksheet edits, even when updated amounts still reconcile. Removing previously reviewed credit evidence requires fresh confirmation of any retained Copy B. Source owner changes clear borrower qualification even when the statement is removed in the same update. A different borrower or loan identity requires fresh confirmation of the filed-return history. Confirmation-only actions can reestablish current documentation without changing saved amounts."
    irsRef: "2026 Form 1098-VLI Copy B and issuer instructions for a current-year interest credit"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::revokes stale Box 5 confirmations on batched credit edits"
  - line: "vehicle-interest-borrower-identity"
    description: "Reconfirm lender and prior-return records after borrower identity changes"
    formula: "Compare the actual primary and spouse identities separately when About You changes. Replacing or removing a borrower invalidates the affected borrower qualification, Copy B and any attached cash refund or credit payment and prior-return confirmations. Keep the reviewed amounts and source references in the draft. Edits to unrelated facts or a different borrower's identity do not invalidate a loan's own document confirmations."
    irsRef: "2026 Form 1098-VLI Instructions for Payer of Record and Box 5"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::rechecks vehicle records when the actual borrower changes"
  - line: "2026-reporting"
    description: "Require actual new-year reporting facts"
    formula: "Actual2026 employee tips/overtime bind to the original source year, W2TP/TT and tipped occupation codes; business tips bind to NECcashTips and actual TTOC. Every linked source must preserve its original year, including2025. Actual2025 statement totals are not bounded by Box1 after payroll exclusions; overtime gross compensation adds only an actual confirmed excluded-payroll amount to Box1. Historical2025 transition statements cannot stand in for2026 reporting. Reporting permits any two codes when more occupations exist, so the independently confirmed actual occupation is not inferred from or restricted to those two codes. Explicit0 remains actual and no original amount is counted twice."
    irsRef: "2026 General Instructions FormsW2/W3;2026 Instructions Forms1099MISC/NEC"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::requires actual year-specific reported tips and overtime"
  - line: "source-controls"
    description: "Collect actual deduction records without implicit qualification"
    formula: "Add/remove actual employee, business, overtime, vehicle and senior records; every source amount and qualification starts unknown. Edits revoke source confirmation; explicit zero and false remain visible. Cross-document source edits revoke confirmation while confirmation-only changes do not create cycles."
    irsRef: "Schedule1-A source recordkeeping and actual household eligibility"
    testRef: "tests/apps/web/schedule-1-a-source-interactions.test.tsx::collects actual additional deduction records and preserves unknown answers"
  - line: "source-routing"
    description: "Forward the confirmed worksheet once and invalidate changed evidence"
    formula: "The opt-in guided section forwards actual Schedule1-A and Form4137 facts once, using original document years. Household, compensation, business and deduction evidence changes require source reconfirmation; money retains exact decimals."
    irsRef: "Schedule1-A PartsI-VI; Form4137 income and payroll routing"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::routes the confirmed worksheet and invalidates substantive source changes"
  - line: "original-compensation-fields"
    description: "Preserve original compensation year and separately reported amounts"
    formula: "Keep actual W2 Box8/TP/TT/TTOC and NEC cash-tip/overtime/TTOC source fields without inserting zero or the return year. Supplied years must match the return; unknown remains unknown, explicit zero survives and malformed source values block calculation. Original code arrays remain distinct from a confirmed absent code."
    irsRef: "2026 W2/W3 instructions Box12TP/TT/Box14b and2026 NEC instructions Boxes1b-1d"
    testRef: "tests/guided-interview/guided-compensation-reporting.test.ts::preserves actual reporting years tips overtime and unknown fields"
  - line: "reporting-controls"
    description: "Collect original year and reporting fields with explicit unknown states"
    formula: "Source controls edit actual years, amounts and reported codes. Clearing an amount or code does not create zero or a no-code assertion; confirming no reported code is an explicit action."
    irsRef: "Actual2026 information-return source recordkeeping"
    testRef: "tests/apps/web/compensation-reporting-interactions.test.tsx::collects original compensation reporting without copying the selected year"
  - line: "direct-tip-report"
    description: "Support actual Form4137-only tip deductions without a fabricated W2"
    formula: "The explicit direct Form4137 method links the actual owner/employer ledger and qualified column1(c) amount. Employer-reported qualified tips must be zero. No W2, TP or alternative employer statement is invented when all applicable tips are directly reported on Form4137."
    irsRef: "1040 Instructions Schedule1-A line4b and qualified tips reported directly on Form4137"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::supports actual Form4137-only sources without an employer report"
  - line: "canonical-deduction"
    description: "Calculate the linked deduction once without changing its source income"
    formula: "The actual employee source contributes the greater of its qualified employer report and Form4137 column1(c); qualified business tips and overtime are added subject to their source limits. Schedule1-A leaves AGI and payroll tax unchanged, and the canonical business-tip deduction reduces QBI once."
    irsRef: "Schedule1-A lines4-14; section199A qualified business income exclusion for section224 tips"
    testRef: "tests/guided-interview/guided-schedule-1-a-facts.test.ts::calculates the guided deduction without duplicating income or business adjustments"
