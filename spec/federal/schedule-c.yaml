form: "Schedule C"
fullName: "Profit or Loss From Business (Sole Proprietorship)"
taxYear: 2025
irsReference: "https://www.irs.gov/instructions/i1040sc"
reviewPdfMapping:
  source: "https://www.irs.gov/pub/irs-pdf/f1040sc.pdf"
  retrieved: "2026-10-25"
  status: "review-only; not qualified for filing"
  testRef: "tests/pdf/fill-schedule-c.test.ts::copies official income lines and refuses inconsistent Schedule C data"

notes: |
  Schedule C reports income and expenses from a sole proprietorship or
  single-member LLC. Net profit flows to Form 1040 Line 8 and Schedule SE.
  Income-line positions refreshed against the final 2025 IRS form on 2026-10-25.
  Explicit gross receipts already include applicable source documents; they are
  not added a second time. Actual line 6 other income is separate from receipts.

lines:
  - line: "1"
    description: "Gross receipts or sales"
    formula: "Sum of 1099-NEC Box 1 + 1099-MISC Box 7 (pre-2020) + other business income"
    irsRef: "Schedule C Instructions, Line 1"
    inputs:
      - "1099-NEC Box 1"
      - "Other business income (cash, barter, etc.)"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C Line 1 - gross receipts from 1099-NEC"

  - line: "2"
    description: "Returns and allowances"
    formula: "Refunds, rebates, etc. deducted from gross receipts"
    irsRef: "Schedule C Instructions, Line 2"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C Line 2 - returns and allowances"

  - line: "3"
    description: "Net receipts"
    formula: "Line 1 minus line 2"
    irsRef: "2025 Schedule C, line 3"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C income follows official lines 3 through 7"

  - line: "4"
    description: "Cost of goods sold (from Line 42)"
    formula: "For businesses that sell products: beginning inventory + purchases - ending inventory"
    irsRef: "Schedule C Instructions, Line 4"
    notes: "Most service businesses have $0 COGS"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C Line 4 - COGS"

  - line: "5"
    description: "Gross profit"
    formula: "Line 3 minus line 4"
    irsRef: "Schedule C Instructions, Line 5"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C Line 5 - gross profit"

  - line: "6"
    description: "Other business income"
    formula: "Actual separately classified other business income, including applicable fuel credits or refunds"
    irsRef: "2025 Schedule C, line 6"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C income follows official lines 3 through 7"

  - line: "7"
    description: "Gross income"
    formula: "Line 5 plus line 6"
    irsRef: "Schedule C Instructions, Line 7"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C Line 7 - gross profit equals gross income for services"

  - line: "return-integration"
    description: "Route other business income through profit and self-employment tax"
    formula: "Line 6 increases line 7 and line 31 once; line 31 enters Schedule 1 line 3 and Schedule SE line 2"
    irsRef: "2025 Schedule C, lines 6, 7, 29 and 31"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C other income reaches the federal return once"

  - line: "review-source-facts"
    description: "Preserve unknown proprietor and checkbox facts in review copy"
    formula: "Use actual proprietor ownership, principalBusinessActivity, accounting method, participation, allInvestmentAtRisk and otherExpenseDescription; preserve omitted facts and leave unknown fields blank"
    irsRef: "2025 Schedule C header and line 32"
    testRef: "tests/pdf/fill-schedule-c.test.ts::uses the actual spouse proprietor and preserves unknown checkbox facts"

  # ── Expenses ─────────────────────────────────────────────
  - line: "8"
    description: "Advertising"
    formula: "Business advertising and marketing expenses"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - advertising"

  - line: "9"
    description: "Car and truck expenses"
    formula: "Business use of vehicle (standard mileage or actual expenses)"
    irsRef: "Schedule C Instructions, Line 9"
    edgeCases:
      - "Standard mileage rate: $0.70/mile for 2025"
      - "Must keep mileage log"
      - "Cannot use standard rate if used MACRS or Section 179 on vehicle"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - car and truck"

  - line: "11"
    description: "Contract labor"
    formula: "Payments to independent contractors (reported on 1099-NEC if ≥$600)"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - contract labor"

  - line: "13"
    description: "Depreciation and section 179 expense deduction"
    formula: "Use Form 4562 Line 22 when the supported Form 4562 summary slice is present; otherwise use the validated manual Schedule C depreciation amount"
    irsRef: "Schedule C Instructions, Line 13; Form 4562"
    inputs:
      - "Form 4562 Line 22"
      - "Validated manual Schedule C depreciation amount"
    notes: "This supported slice prefers the dedicated Form 4562 summary result so depreciation and section 179 expense deductions remain auditable instead of being hidden inside Schedule C other expenses."
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C Line 13 - Form 4562 total deduction flows through the depreciation line"

  - line: "15"
    description: "Insurance (other than health)"
    formula: "Business insurance premiums"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - insurance"

  - line: "17"
    description: "Legal and professional services"
    formula: "Attorney, accountant, and other professional fees"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - legal and professional"

  - line: "18"
    description: "Office expense"
    formula: "Office supplies and small equipment"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - office expense"

  - line: "22"
    description: "Supplies"
    formula: "Materials and supplies consumed during the year"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - supplies"

  - line: "24a"
    description: "Travel"
    formula: "Business travel expenses (transportation, lodging)"
    irsRef: "Schedule C Instructions, Line 24a"
    notes: "Meals are separate (Line 24b at 50%)"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - travel"

  - line: "24b"
    description: "Deductible meals"
    formula: "Business meals at 50% deduction rate"
    irsRef: "Schedule C Instructions, Line 24b"
    notes: "50% limitation applies to most business meals"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - meals at 50% deduction"

  - line: "25"
    description: "Utilities"
    formula: "Business utility expenses"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - utilities"

  - line: "27b"
    description: "Other expenses (from Line 48)"
    formula: "Actual other business expenses listed on Part V line 48"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C expenses - other"

  - line: "28"
    description: "Total expenses before home office"
    formula: "Sum of implemented expense lines, including Line 13 depreciation and section 179 expense deduction, Lines 8, 9, 11, 15, 17, 18, 22, 24a, 24b, 25, and 27"
    irsRef: "Schedule C Instructions, Line 28"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C Line 28 - total expenses"

  - line: "29"
    description: "Tentative profit or loss"
    formula: "Line 7 - Line 28"
    irsRef: "Schedule C Instructions, Line 29"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C Line 29 - tentative profit"

  - line: "30"
    description: "Business use of home deduction (Form 8829)"
    formula: "Simplified method: $5/sq ft × up to 300 sq ft = max $1,500. Or actual method via Form 8829."
    irsRef: "Schedule C Instructions, Line 30; Form 8829"
    edgeCases:
      - "Simplified method: max $1,500, cannot create a loss"
      - "Actual method: proportional share of rent/mortgage interest, utilities, insurance, repairs"
      - "Deduction limited to net income from business (cannot create loss)"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C Line 30 - home office deduction simplified method"

  - line: "31"
    description: "Net profit or loss"
    formula: "Line 29 - Line 30. If profit, enters 1040 Line 8 and Schedule SE. If loss, at-risk rules may apply."
    irsRef: "Schedule C Instructions, Line 31"
    edgeCases:
      - "Net loss may be limited by at-risk rules (Form 6198)"
      - "Hobby loss rules: must have profit motive"
      - "SE tax only applies to net profit (losses reduce other income but not SE)"
    testRef: "tests/engine/schedules/schedule-c.test.ts::Schedule C Line 31 - net profit or loss"
