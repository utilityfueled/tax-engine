form: "Schedule 1-A actual source boundaries"
fullName: "Actual identity, source and death-date reconciliation"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i1040gi"
notes: "Actual source claims preserve unknowns; historical unverified 2025 preview is distinct from new source qualification."
lines:
  - line: "senior-death-date"
    description: "Determine actual age at death for an enhanced senior deduction"
    formula: "Use the actual date of birth and the earlier of the return year end or actual death date. Age is attained the day before a birthday. A taxpayer born February14,1960 who dies February12,2025 is not65; death on February13 qualifies. Known null means alive; missing death status remains unknown for2026 or actual source claims. Dates must be real and consistent with the return year and birth date."
    irsRef: "Form1040 Instructions Schedule1-A PartV Death of a taxpayer and its published February14 birthday example"
    testRef: "tests/engine/schedules/schedule-1-a-sources.test.ts::uses actual senior death dates and preserves unknown status"
  - line: "senior-canonical"
    description: "Use household death facts in the canonical return"
    formula: "The actual standardDeductionFacts primary/spouse death date also governs Schedule1-A senior eligibility. No second guessed alive flag or age override is accepted; denied senior deductions do not reduce AGI or payroll tax."
    irsRef: "Form1040 Instructions Schedule1-A PartV and line36"
    testRef: "tests/engine/schedules/schedule-1-a-sources.test.ts::binds senior eligibility to the canonical household death record"
  - line: "linked-source-contract"
    description: "Preserve actual compensation, business and vehicle source identities"
    formula: "Retain exact employee W2 and per-owner Form4137 employer links, actual reporting method/reference and original employer-reported tips (Box1 wages are not a tip-total proxy), overtime compensation source and actual payroll compensation excluded from Box1, business information-return allocations and actual vehicle borrower/loan references. Business net profit and allocable deductions remain unknown until canonical calculation supplies them."
    irsRef: "Schedule1-A PartII line4/5, PartIII line14 and PartIV line22; Form1040 Instructions source reporting and net-income limitation"
    testRef: "tests/engine/schedules/schedule-1-a-linked-sources.test.ts::preserves actual linked Schedule1-A sources without inferred business amounts"
  - line: "canonical-source-guard"
    description: "Require canonical verification for actual compensation claims"
    formula: "A supplied actual source worksheet must match the return year and be complete and confirmed. Employee tips, business tips and overtime with actual source metadata cannot calculate until canonical source binding verifies the supplied links. Missing business values cannot become zero. Actual vehicle source metadata requires a matching-year borrower and loan reference; known borrower ineligibility yields zero, while missing qualification remains unknown. Legacy unverified source-free2025 behavior remains distinct."
    irsRef: "Form1040 Instructions qualified reporting, reasonable business deduction allocation and source recordkeeping"
    testRef: "tests/engine/schedules/schedule-1-a-linked-sources.test.ts::rejects unverified linked deductions and missing canonical business values"
