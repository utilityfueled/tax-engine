form: "Schedule 1-A actual source boundaries"
fullName: "Actual identity, source and death-date reconciliation"
taxYear: 2026
irsReference: "https://www.irs.gov/instructions/i1040gi"
notes: "Actual source claims preserve unknowns; historical unverified 2025 preview is distinct from new source qualification."
lines:
  - line: "senior-death-date"
    description: "Determine actual age at death for an enhanced senior deduction"
    formula: "Use the actual date of birth and the earlier of the return year end or actual death date. Age is attained the day before a birthday. A taxpayer born February14,1960 who dies February12,2025 is not65; death on February13 qualifies. Known null means alive; missing death status remains unknown for2026 or actual source claims. Dates must be real and consistent with the return year and birth date."
    irsRef: "Form1040 Instructions Schedule1-A PartV Death of a taxpayer and its published February14 birthday example"
    testRef: "tests/engine/schedules/schedule-1-a-sources.test.ts::uses actual senior death dates and preserves unknown status"
  - line: "senior-canonical"
    description: "Use household death facts in the canonical return"
    formula: "The actual standardDeductionFacts primary/spouse death date also governs Schedule1-A senior eligibility. No second guessed alive flag or age override is accepted; denied senior deductions do not reduce AGI or payroll tax."
    irsRef: "Form1040 Instructions Schedule1-A PartV and line36"
    testRef: "tests/engine/schedules/schedule-1-a-sources.test.ts::binds senior eligibility to the canonical household death record"
  - line: "linked-source-contract"
    description: "Preserve actual compensation, business and vehicle source identities"
    formula: "Retain exact employee W2 and per-owner Form4137 employer links, actual reporting method/reference and original employer-reported tips (Box1 wages are not a tip-total proxy), overtime compensation source and actual payroll compensation excluded from Box1, business information-return allocations and actual vehicle borrower/loan references. Business net profit and allocable deductions remain unknown until canonical calculation supplies them."
    irsRef: "Schedule1-A PartII line4/5, PartIII line14 and PartIV line22; Form1040 Instructions source reporting and net-income limitation"
    testRef: "tests/engine/schedules/schedule-1-a-linked-sources.test.ts::preserves actual linked Schedule1-A sources without inferred business amounts"
  - line: "canonical-source-guard"
    description: "Require canonical verification for actual compensation claims"
    formula: "A supplied actual source worksheet must match the return year and be complete and confirmed. Employee tips, business tips and overtime with actual source metadata cannot calculate until canonical source binding verifies the supplied links. Missing business values cannot become zero. Actual vehicle source metadata requires a matching-year borrower and loan reference; known borrower ineligibility yields zero, while missing qualification remains unknown. Legacy unverified source-free2025 behavior remains distinct."
    irsRef: "Form1040 Instructions qualified reporting, reasonable business deduction allocation and source recordkeeping"
    testRef: "tests/engine/schedules/schedule-1-a-linked-sources.test.ts::rejects unverified linked deductions and missing canonical business values"
  - line: "form-1098-vli"
    description: "Reconcile a 2026 Form 1098-VLI to actual interest paid by the borrower"
    formula: |
      Bind a confirmed uncorrected Copy B for tax year 2026 to the ordinary
      original loan using the payer of record, lender, account reference,
      box 2d VIN and box 3a loan origination date. Require both boxes 6 and 7
      checked and consistent with the actual loan facts for this slice.
      Supply explicit nonnegative cent amounts for box 1, direct third-party
      payments included in box 1 and third-party reimbursements of borrower
      payments that are still included in box 1. Exclude refunds already
      netted by the lender. Box 1 minus those two distinct amounts must equal
      the confirmed unreimbursed interest the borrower actually paid in the
      return year. Confirm that any C/E/F allocation is part of that same
      borrower-paid amount. Existing Schedule 1-A rules subtract that
      business allocation before the cap and MAGI phaseout. Reconcile
      statement amounts exactly before applying any form rounding. Descriptive
      boxes 2a–2c and box 4 principal stay on the original statement.
    irsRef: "https://www.irs.gov/pub/irs-pdf/f1098vli.pdf#page=3; https://www.irs.gov/instructions/i1098vli"
    testRef: "tests/engine/schedules/schedule-1-a-sources.test.ts::reconciles current 1098-VLI interest before applying the existing vehicle deduction"
  - line: "vehicle-loan-account-identity"
    description: "Hold repeated actual vehicle-loan accounts for review"
    formula: |
      In a 2026 actual-source worksheet, the same lender and account reference
      identify one loan. Compare lender names without case differences or
      repeated whitespace between words, and account references without case or
      whitespace. Hold repeated loan identities for review even when the VIN,
      borrower or source reference differs. Distinct accounts at one lender and
      identical account references at distinct lenders are separate loan
      identities. Keep existing record validation and historical calculation paths.
    irsRef: "https://www.irs.gov/instructions/i1098vli (Account Number; Box 2d Vehicle Identification Number)"
    testRef: "tests/engine/schedules/schedule-1-a-sources.test.ts::holds a repeated actual vehicle loan account despite changed borrower and VIN"
  - line: "form-1098-vli-limit"
    description: "Hold lender statements requiring another source or tax method"
    formula: |
      Require a confirmed blank box 3b for the original-lender slice. Box 3b
      would be the lender's acquisition date, not the taxpayer's purchase.
      A positive box 5 requires one of the supported recovery proofs below.
      Hold mixed refunds, credits against principal and unresolved recoveries.
      Do not net box 5 against box 1. Box 1 already excludes interest on
      non-SPVL indebtedness.
      Hold any separate positive nonqualifying interest on this statement
      path until its basis is reconciled. Hold corrected, assigned or
      refinanced loans and conflicting, incomplete or mismatched records.
      Continue the independently confirmed payment-record path without this
      optional form. The lender reporting threshold does not gate deduction
      eligibility. Do not log the form's private identifiers in the tax audit.
    irsRef: "https://www.irs.gov/pub/irs-pdf/f1098vli.pdf#page=4; https://www.irs.gov/instructions/i1098vli"
    testRef: "tests/engine/schedules/schedule-1-a-sources.test.ts::holds mismatched or exceptional 1098-VLI facts without disturbing manual payment records"
  - line: "form-1098-vli-box-5-cash-refund"
    description: "Verify a cash recovery of 2025 interest that was never deducted"
    formula: |
      For the same matched payer, lender and loan purchased and originated in
      2025, confirm actual cash received in 2026 for a 2025 overpayment and
      reconcile the exact cash amount to positive box 5. Explicitly confirm
      that the borrower made and bore the recovered payment and received the
      refund of that same payment. Require references
      to the cash refund, the original 2025 payment records and the complete
      2025 filed-return history, including whether any amendments were filed
      and reviewed. A 2025 lender statement or portal payment record can
      substantiate the original payment. Confirm that the recovered interest
      was never deducted on Schedule 1-A, Schedules C/E/F or through any other
      route, including any deduction carried to another year. Require explicit
      zero on all three deduction amounts. A cash refund meeting this proof
      adds no recovery income and leaves box 1 reconciliation intact. A credit
      applied to current interest appears in both boxes 1 and 5 and needs
      separate reconciliation. Hold missing or contradictory proof, including
      proof supplied with zero box 5, and any recovered amount with a prior
      deduction. Retain documentary references without adding them to audit
      lines or changing the incomplete 2026 federal return gate.
    irsRef: "https://www.irs.gov/pub/irs-pdf/f1098vli.pdf#page=4; https://www.irs.gov/instructions/i1098vli; https://www.irs.gov/pub/irs-pdf/f1040s1a.pdf#page=2; https://www.irs.gov/irb/2025-45_IRB; https://uscode.house.gov/us/usc/t26/s111/"
    testRef: "tests/engine/schedules/schedule-1-a-sources.test.ts::accepts only documented 1098-VLI cash refunds of interest never deducted"
  - line: "form-1098-vli-box-5-current-interest-credit"
    description: "Reconcile recovered 2025 interest credited to 2026 interest on the same loan"
    formula: |
      Bind the overpayment and lender application records to the same payer
      and original vehicle loan purchased and originated in 2025. The
      borrower made and bore the 2025 payment, and the lender applied the
      entire 2026 recovery solely to satisfy the borrower's accrued 2026
      interest on that loan. Require positive box 5 equal to the documented current interest
      credit in exact cents, zero cash refund, zero direct third-party
      Box 1 payments and zero reimbursement. Confirm that Box 1 already
      includes the credit. Current borrower interest excluding the credit plus
      the credit must equal the confirmed borrower interest in exact cents.
      Use that reconciled Box 1 base once. Apply the existing business
      allocation, cap, phaseout and rounding rules. Confirm the complete
      filed 2025 return history, including amendments, and true zero prior
      deductions or carryforwards on the recovered amount. There is no
      separate taxable recovery for the supported zero-benefit case. Hold
      any mixed, principal, third-party or prior-benefit case. Keep the
      incomplete 2026 federal return and final output qualification gates.
    irsRef: "https://www.irs.gov/instructions/i1098vli; https://www.irs.gov/pub/irs-pdf/f1098vli.pdf#page=4; https://uscode.house.gov/us/usc/t26/s111/; https://www.irs.gov/irb/2026-39_irb (26 CFR 1.163-16(c)(2))"
    testRef: "tests/engine/schedules/schedule-1-a-sources.test.ts::reconciles 1098-VLI interest credits once as borrower-paid current interest"
