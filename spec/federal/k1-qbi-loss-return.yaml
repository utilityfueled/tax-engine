notes: |
  Reg1.199A-3(b)(1)(iv), T.D.9899 Example1 and i8995 suspended-loss
  worksheets control this actual-source path. Current basis and at-risk
  allowances come from ScheduleE's existing calculations; passive allowance
  comes from the original-index canonical8582 row. Original loss ratios stay
  exact through each source computation. Each reported transfer rounds once.
  Prior qualified loss is separate from current QBI and carries its fixed
  originating character. Source histories are not current deduction inputs.
  Unsupported mixed-origin positive461 allocation remains an explicit method
  boundary; no unprovided cross-activity allocation is assumed.
