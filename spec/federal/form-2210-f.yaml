lines:
  - line: "required-payment"
    description: "Use two-thirds of current tax or prior tax"
    formula: "Line3 30000, withholding5000, prior18000: line7 20010, line11 18000. Payments by January15 8000: line12 13000, line13 5000. No prior return: line11 20010, line13 7010."
    irsRef: "Form2210-F lines1-13"
    testRef: "tests/engine/forms/form-2210-f.test.ts::figures the required payment and underpayment"
  - line: "exact-payment-sources"
    description: "Reconcile dated payments and preserve their precision on line 12"
    formula: "The exact amount of all dated estimates and applied credits must match the Form 1040 line 26 source total. On line 12 sum withholding and payments through January 15 exactly before return rounding. Preserve the entered effective dates and explicit zero. Later payments retain their existing treatment."
    irsRef: "Form 2210-F line 12 and Instructions for Form 2210-F (https://www.irs.gov/pub/irs-pdf/i2210f.pdf)"
    testRef: "tests/engine/forms/form-2210-f.test.ts::matches and reports exact 2026 farmer payment sources through January 15"
  - line: "penalty"
    description: "Count days from January15"
    formula: "Line13 5000 paid2026-03-20: 64 days, exact61.37, penalty61. Paid2026-03-03: 47 days, penalty45. Unpaid: 90 days, exact86.30, penalty86."
    irsRef: "Form2210-F lines14-16"
    testRef: "tests/engine/forms/form-2210-f.test.ts::counts days from January 15 to payment or April 15"
  - line: "exceptions"
    description: "Apply each exception on both sides"
    formula: "Line6 below1000, line9 below1000, line8 at least line11, and full-year no prior tax owe nothing. Filed and paid2026-03-02 owes nothing; 2026-03-03 owes the penalty. Line9 exactly1000 is not excepted."
    irsRef: "Instructions for Form2210-F, Exceptions to the Penalty"
    testRef: "tests/engine/forms/form-2210-f.test.ts::applies each exception on both sides"
  - line: "unknown"
    description: "Reject unknown or unsupported facts"
    formula: "Reject an unconfirmed two-thirds test, an underpayment needing several late payments, or positive exposure without a published rate."
    irsRef: "Original-source contract"
    testRef: "tests/engine/forms/form-2210-f.test.ts::rejects unknown farmer facts and unsupported payments"
  - line: "waiver"
    description: "Record a waiver request without treating it as granted"
    formula: "Partial 30 on penalty86 reports56 with penaltyBeforeWaiver86. Full reports0. A reason and statement reference are required, and a partial amount cannot exceed the penalty. Form2210 is required and box A or B is marked."
    irsRef: "Instructions for Form2210, Waiver of Penalty"
    testRef: "tests/engine/forms/form-2210-f.test.ts::records waiver requests without treating them as granted"
  - line: "guide"
    description: "Collect farmer and waiver facts without defaults"
    formula: "Farmers confirm the two-thirds test. Waivers need a kind, reason and statement reference. Blank stays unknown."
    irsRef: "Form2210-F Part I"
    testRef: "tests/guided-interview/guided-estimated-tax-schedule-ai.test.ts::collects farmer and waiver facts without defaults"
  - line: "year-2026"
    description: "Apply the March 1 exception and the published 8% rate for tax year 2026"
    formula: "A 2026 return filed and paid by March 1, 2027 owes no penalty. Otherwise apply line13 times days since January 15 times 0.08 divided by 365 through April 15 at most. Joint status changes with line10 below line7 require the form."
    irsRef: "IRC6654(i); IRC6621(b)(2)(B); Rev. Rul. 2026-25; draft 2026 Form 2210-F lines 14–16"
    testRef: "tests/engine/forms/form-2210-f.test.ts::applies the 2027 rate after the 2026 farmer filing exception"
  - line: "return-flow"
    description: "Carry a waiver request through Form 1040"
    formula: "A partial request lowers line38 and amount owed by the requested amount, and a full request reports0. penaltyBeforeWaiver is retained, Form2210 is required and readiness stays partial."
    irsRef: "Instructions for Form2210, Waiver of Penalty"
    testRef: "tests/engine/federal-form-2210-waiver.test.ts::carries a waiver request through Form 1040 without treating it as granted"
  - line: "full-payment-total-tax"
    description: "Test a claimed full payment against total tax due"
    formula: "Payments through the claimed date plus withholding must reach Form1040 line24 less refundable credits, including taxes outside Form2210 line2. The return rounds to whole dollars, so payments must reach the smaller of the exact and rounded balance."
    irsRef: "Form2210-F instructions: file and pay the tax due by March2"
    testRef: "tests/engine/federal-form-2210-waiver.test.ts::tests a claimed full payment against total tax due"

