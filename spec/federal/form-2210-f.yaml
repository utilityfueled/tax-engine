form: "Form 2210-F and estimated-tax waiver requests"
fullName: "Underpayment of estimated tax by farmers and fishers, and waiver requests"
taxYear: 2025
supportedTaxYears: [2025, 2026]
irsReference: "https://www.irs.gov/pub/irs-pdf/i2210f.pdf"
sourceRetrievedAt: "2026-10-31"
notes: |
  Form 2210-F (2025), Instructions for Form 2210-F (2025) and Instructions for Form 2210
  (2025), Waiver of Penalty. https://www.irs.gov/pub/irs-pdf/f2210f.pdf
  Applies when at least two-thirds of gross income for either year is from farming or
  fishing, confirmed as a fact. Line7 uses the printed 0.667. Line11 is the smaller of
  line7 and line10, with no 110% rule. A missing or short prior return uses line7.
  One due date: January15. Days run from that date to the payment date or April15.
  Filing and paying by March2 2026 (March1 2027) removes the penalty.
  The form has one payment date, so an underpayment needing two late payments rejects
  rather than choosing a method. 2026 needs an unpublished rate and rejects when a
  penalty would accrue. No Form 2210-F PDF map exists.
  Waivers: a retirement, disability, casualty, disaster or unusual-circumstance reason
  and a statement reference are required. A full request (Form 2210 box A) reports no
  penalty. A partial request (box B, or Form 2210-F box A) subtracts the requested
  amount. The IRS decides, so the packet warns that this is only a request.
  Federally declared disasters stay rejected, because the IRS applies that relief itself.
  The same source gates as Form 2210 apply. The March date needs payments that reach the
  tax, and any claimed full-payment date must reach total tax due on the return. A prior year with no liability but not resident all year uses line7.
  Not modeled: section1062 farmland elections and Form 4136 fuel credits on line4.
sources:
  - "https://www.irs.gov/pub/irs-pdf/f2210f.pdf"
  - "https://www.irs.gov/pub/irs-pdf/i2210f.pdf"
  - "https://www.irs.gov/instructions/i2210"
