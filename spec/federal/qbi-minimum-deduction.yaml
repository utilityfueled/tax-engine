form: "Section 199A(i) minimum deduction"
fullName: "2026 minimum deduction for active qualified business income"
taxYear: 2026
irsReference: "https://uscode.house.gov/us/usc/119-120/t26/s199A/"
retrievedAt: "2026-10-24"
reviewStatus: "independent-review-pending"
lines:
  - line: "active-threshold"
    description: "Aggregate actual active qualified business income"
    formula: "Use known material participation under section 469(h), before any elective section 199A aggregation. Sum qualified income and losses only from active qualified trades/businesses. Apply the applicable SSTB percentage before evaluating a detailed return. A safe-harbor rental qualification alone does not establish material participation. Do not round a $999.99 source into the $1,000 threshold. Prior-year QBI loss requires an explicit active portion when minimum eligibility can affect the result."
    testRef: "tests/engine/forms/qbi-minimum-deduction.test.ts::2026 active QBI minimum"
  - line: "deduction"
    description: "Minimum replaces the ordinary subsection (a) deduction"
    formula: "When aggregate active QBI is at least $1,000, deduction = max(ordinary section 199A(a) deduction, $400), even when the usual taxable-income or wage/basis limit would be smaller. Otherwise preserve ordinary deduction. 2025 has no minimum. Do not substitute REIT dividends for active QBI. Missing material participation is unknown, and rejects if it can affect the minimum."
    testRef: "tests/engine/forms/qbi-minimum-deduction.test.ts::2026 active QBI minimum"
  - line: "federal-integration"
    description: "Pass actual activity and carryover facts through both computation paths"
    formula: "Forward tax year and qbiMateriallyParticipated from Schedule C/F, rental and K-1 facts. Preserve positive, negative and zero amounts. Compute the 2026 minimum even with zero taxable income before QBI. Carry aggregate active losses explicitly instead of inferring them from total carryovers."
    testRef: "tests/engine/federal-qbi-2026.test.ts::2026 QBI minimum integration"
