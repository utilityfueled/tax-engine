form: "Form 8863 final 2026 physical candidate"
fullName: "Education Credits final annual physical source contract"
taxYear: 2026
reference: "https://www.irs.gov/pub/irs-prior/f8863--2026.pdf"
revision: "Created 4/28/26, IRS final index posted 11/17/2026"
retrievedAt: "2026-11-19T05:03:31Z"
notes: |
  Disabled physical candidate for the final annual form. The printed warning
  requires an SSN valid for employment and issued before the return due date,
  including extensions. One Part III is required per student. The final
  annual instructions and parent form are separate qualification dependencies.
lines:
  - line: "revision"
    description: "Pin the final two-page annual PDF"
    formula: "Require SHA-256 290771de5dbbbede2de9e7cb2ba8a7d51a08aa10e89b4ed74cfdbdb631af167f, 107826 bytes, two US Letter pages and the 2026 title."
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::pins the final annual PDF"
  - line: "physical-locations"
    description: "Bind all 77 AcroForm leaves to printed locations"
    formula: >-
      Verify page, type, rectangle and checkbox on-state for each leaf.
      Distinguish the split SSNs, split decimal factors, nine individual
      EIN digits per institution, and independent Yes and No boxes.
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::locates every annual field on its printed page"
  - line: "printed-transfers"
    description: "Pin the printed references between Parts I, II, III and the parent return"
    formula: >-
      Line 1 sums line 30 across students. Line 10 sums line 31 across
      students. Lines 3 and 14 normally receive Form 1040 or 1040-SR line 11a.
      Line 8 transfers to parent line 29. Lines 9 and 18 feed the Credit Limit
      Worksheet. Line 19 receives worksheet line 7 and transfers to Schedule
      3 line 3. Each student uses either lines 27 through 30 or line 31.
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::records the printed transfers"
  - line: "saved-diagnostic"
    description: "Exercise the saved annual fields with synthetic placements"
    formula: "Reopen both switch positions for each checkbox and check nonempty appearances and stored values for all text leaves."
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::retains diagnostic values and appearances after save"
  - line: "private-aotc-transfer-review"
    description: "Verify the printed whole-dollar transfers for one primary AOTC student"
    formula: >-
      Require a canonical 2026 single return with one primary AOTC student,
      one matching actual institution and explicit current and prior Form
      1098-T receipt answers. Accept only the ordinary current-year receipt
      method without LLC, foreign or possession adjustments. Require confirmed
      actual Form 1040 line 11a and Credit Limit Worksheet remaining tax, and
      the prepared Form 8863 amounts, bound to the current canonical return
      by its SHA-256. Workpaper and prepared amounts must already be
      nonnegative whole dollars. Recalculate under Form 8863 and require exact agreement
      for line 8 to Form 1040 or 1040-SR line 29 and line 19 to Schedule 3
      line 3. Expose the annual revision identity, printed labels and amounts
      only. Keep the source workpapers, taxpayer and institution identifiers,
      and public review and filing exports out of the projection.
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::verifies exact private AOTC transfers from current original workpapers"
  - line: "held-aotc-transfer-review"
    description: "Hold stale, incomplete or incompatible evidence"
    formula: >-
      Decline fractional workpaper or prepared amounts without rounding,
      changed canonical facts, changed amounts, missing confirmation,
      mismatched claimant or institution records, an exhausted prior claim
      history, and non-2026 evidence.
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::holds stale, incomplete, or mismatched AOTC transfer evidence"
  - line: "private-joint-spouse-aotc-transfer-review"
    description: "Verify the transfers for a documented joint-return student spouse"
    formula: >-
      Apply the same one-student, one-current-Form-1098-T original-workpaper
      contract to a married filing jointly return where the student is the
      listed spouse. Match Part III lines 20 and 21 to that spouse by role,
      name and timely TIN. At least one spouse must have the independently
      confirmed, timely employment-valid SSN. Reconcile claimant and student
      SSN and TIN answers to the return, including the case in which the
      other spouse qualifies and the student has a timely TIN. Use the
      $180,000 threshold and $20,000 phase-out band for line 6. The joint
      return does not take the under-24 restriction on line 7. Apply the
      existing whole-dollar transfers and actual Credit Limit Worksheet
      amount. Keep both spouses' identifiers out of the saved review PDF.
    sources:
      - "https://www.irs.gov/pub/irs-prior/f8863--2026.pdf"
      - "https://www.irs.gov/pub/irs-dft/i8863--dft.pdf (2026 draft, identification requirement and lines 7, 20 and 21)"
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::reopens verified joint student-spouse AOTC transfers without identity fields"
    testRefs:
      - "tests/pdf/form-8863-2026-candidate.test.ts::holds contradictory or unverified joint student-spouse evidence"
  - line: "private-joint-primary-aotc-transfer-review"
    description: "Verify the documented primary student on a joint return"
    formula: >-
      Apply the joint one-student original workpaper contract when the primary
      spouse is the student. Confirm that spouse's return identity and timely
      TIN. Reconcile the student SSN answer to the primary claimant answer.
      Either spouse may establish the timely employment-valid SSN requirement.
      Keep the same joint phase-out, refundable calculation and redaction.
    irsRef: "2026 draft Form 8863 instructions, identification requirements and lines 7, 20 and 21 (https://www.irs.gov/pub/irs-dft/i8863--dft.pdf)"
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::reopens verified joint primary AOTC transfers without identity fields"
    testRefs:
      - "tests/pdf/form-8863-2026-candidate.test.ts::holds contradictory primary student SSN evidence and shared household TINs on a joint return"
  - line: "private-student-return-name"
    description: "Verify line 20 identity without printing it in the private transfer review"
    formula: "Require the positive primary AOTC student's name to match the actual return name by spelling and punctuation, ignoring differences in case and whitespace. Hold a blank or mismatched name even when current workpapers match the canonical input hash. Leave line 20 and all other identity widgets blank on the private PDF."
    irsRef: "Final 2026 Form 8863, Part III line 20 (https://www.irs.gov/pub/irs-prior/f8863--2026.pdf#page=2)"
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::verifies the return name and leaves the line 20 identity blank in the review"
  - line: "exact-printed-aotc-factor"
    description: "Bind the original printed line 6 to the exact calculated factor"
    formula: >-
      Require the actual Form 8863 line 6 in its printed decimal format, with
      1.000 for a full factor and at least three decimal places otherwise.
      This private method compares it by Decimal equality to calculator line 6
      before verifying line 8 and line 19. The final form permits rounding to
      three or more places. Other rounded representations are outside this
      method and are held even if the two reported transfer amounts agree.
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::binds transfers to the exact reported line 6 factor"
  - line: "private-physical-aotc-transfers"
    description: "Reopen the confirmed AOTC transfer amounts on the pinned final 2026 Form 8863"
    formula: >-
      Run the existing exact original-bound AOTC projection. On the pinned
      final 2026 blank, set only line 8 and line 19 to the corresponding
      whole-dollar amounts. Leave all other widgets blank or unchecked and
      place the review notice on both pages.
      The proof remains private and unavailable to public review and filing.
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::reopens only the verified private lines 8 and 19 on the pinned final PDF"
  - line: "held-private-physical-aotc-transfers"
    description: "Preserve a known zero while holding unsupported physical sources"
    formula: >-
      Write a confirmed zero to the applicable transfer field. Reject changed
      template bytes, stale canonical sources or changed amounts before rendering.
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::preserves a confirmed zero and holds Form 8863 PDF template or source drift"
  - line: "closed-exports"
    description: "Keep public review and filing disabled"
    formula: "The physical map has no route or export registration. Neither the 2025 nor the 2026 qualified template registry accepts these bytes."
    testRef: "tests/pdf/form-8863-2026-candidate.test.ts::keeps public exports closed"
