form: "Guided actual tip income"
fullName: "Per-owner Form4137 employer and reporting-year sources"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p531"
notes: "Source income and payroll tax remain separate from the Schedule1-A deduction. Unknown amounts and owner identities are never inferred."
lines:
  - line: "source-ledger"
    description: "Retain original annual and employer-month tip facts"
    formula: "Collect actual owner, source year/reference, completeness and reporting-year confirmation, employer identity, W2 links, cash and charge tips received and reported, allocated tips, noncash income and actual months below20. Preserve exact source cents and explicit0. The Pub531 example adds18 of income and0 payroll tips."
    irsRef: "Pub531 Blue Ocean Restaurant example; Form4137 lines1-13"
    testRef: "tests/guided-interview/guided-tip-income-facts.test.ts::preserves actual monthly tip sources and separate noncash income"
  - line: "payroll-links"
    description: "Reconcile the actual employer and owner to source payroll"
    formula: "Only actual entered W2 records receive canonical formW2:index identities. A blank placeholder does not shift these source IDs. Every actual owner, EIN, name, Box3, Box7 and supplied Box8 reconciles to the same owner's tip ledger; missing or mismatched facts block."
    irsRef: "Form4137 column1(d), line8 and reporting-year instructions"
    testRef: "tests/guided-interview/guided-tip-income-facts.test.ts::binds tip sources to actual canonical employer and owner records"
  - line: "unknown-boundaries"
    description: "Keep missing source facts distinct from zero or known ineligibility"
    formula: "Missing money, year, reporting treatment, eligibility or source confirmation cannot establish a deduction or favorable payroll exception. Duplicate owner worksheets reject. Actual spouse sources require a joint household. RRTA-covered tips retain their explicit employer-reporting boundary."
    irsRef: "Pub531 Tips not subject to social security and Medicare taxes; Form4137 instructions"
    testRef: "tests/guided-interview/guided-tip-income-facts.test.ts::rejects missing tip facts while accepting explicit zero and false"
  - line: "guided-interaction"
    description: "Collect source tip records with explicit confirmation"
    formula: "Actual owner, year, employer links, monthly exceptions and original cents are entered directly. Adding or changing a source revokes confirmation; clearing an amount restores unknown, and removing records never retains a hidden monetary total."
    irsRef: "Pub531 daily tip record and reporting instructions"
    testRef: "tests/apps/web/tip-income-source-interactions.test.tsx::collects actual tip records and revokes confirmation on source edits"
  - line: "guided-routing"
    description: "Make actual tip payroll collection reachable and preserve saved facts"
    formula: "The selected additional-deductions route is distinct from AGI adjustments. Original sources pass once to per-owner Form4137; missing source facts block preview. Substantive household or payroll changes revoke confirmation without deleting sources; metadata-only confirmation does not cycle."
    irsRef: "Form4137 income/payroll treatment and Schedule1-A additional deductions"
    testRef: "tests/guided-interview/guided-tip-income-facts.test.ts::routes actual tip sources and invalidates changed payroll without deleting facts"
  - line: "box8-source"
    description: "Preserve original allocated tips and source confirmation"
    formula: "Entered W2 Box8 remains exact and optional; a missing original is never zero. Validate every supplied amount, and do not reconcile payroll using unconfirmed document suggestions."
    irsRef: "Form4137 allocated tips and recordkeeping instructions"
    testRef: "tests/guided-interview/guided-tip-income-facts.test.ts::preserves actual Box8 and rejects pending payroll suggestions"
