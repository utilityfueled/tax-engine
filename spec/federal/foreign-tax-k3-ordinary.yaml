notes: |
  Source admission only, not a new tax formula. One2025 calendar-year primary single continuing
  domestic nonPTP partnership, qualifiedK3 passive interest wholly foreign in one
  actual foreign country. No other partnership/trust or INT/DIV originals in this
  finite method. Require actual K1/K3/beginningbasis references and explicit zero
  allocated foreign deductions/interest/otherexpenses/taxreductions/redeterminations,
  all otherK1 boxes and all suspension/basis-change history. Fresh partnerbasis must
  allow every cent. Preserve all annual eligibility/paid/noaccrual/owner/source,
  separate actual regular/AMT ledgers and AMT election/priorcapacity validation.
  Require actual entity-paid2025 dates and USD-reported PartIII section4 line1
  amounts matching tax, with original conversion/source reference; no inferred
  personal payment date, currency/rate or FX calculation. This calendar paid
  cohort is finite, not a universal fiscal-year partnership rule.
  Neither a bareK1 nor missing/false/blank/unknown facts establishes zero or proof.
  New2026 admission, other entities, spouse/joint, losses, domestic/foreign mixes,
  preferential income and expense allocations remain unsupported. Existing direct
  credit and ordinary bank methods retain their original behavior and all final
  forms/privacy/review-only export/readiness gates. UI records sources, not tax math.
  Fixture originals explicitly report W2 federalWithheld12000 in both canonical and
  guided paths. Tax12555 less withholding12000 is555, below the Form2210 current-year
  withholding exception threshold1000; estimated-tax penalty0 and full amountOwed555.
  Prior-year history remains unknown; do not infer a prior-year safe harbor. This
  changes synthetic fixture facts and assertions only, not any production formula.
