  - line: "manual-nonpublishing-workflow"
    description: "Keep the experiment separately opt-in with original source admission and no image publication"
    formula: "Manual public default-branch first-attempt exact-source workflow, pinned read-only actions, unchanged native/time limits and artifact policy. Retain original inert sandbox controls plus experiment controls; original runner/recipe are untouched."
    testRef: "tests/scripts/glibc-xfd-experiment.test.mjs::separate manual workflow preserves original admission and bounded nonpublishing execution"
