  - line: "authenticated-derived-context"
    description: "Retain authenticated original preparation and explicitly bind the experimental input additions"
    formula: "After original authenticated preparation, reject recipe/input drift or foreign files; retain original recipe/ledger/receipts and add only pinned patch/before/after files. New effective script has its own pin and explicit nonrelease provenance."
    testRef: "tests/scripts/glibc-xfd-experiment.test.mjs::real exclusive prepared context retains original provenance and adds exact bounded input ledger"
  - line: "strict-original-holds"
    description: "Retain original failure history and all unrelated suite, allocator and ABI gates"
    formula: "Original failed run44148810935 and ten XPASS remain holds. Never suppress FAIL, XPASS, UNRESOLVED or ERROR; require named candidate allocator regression and exact ABI evidence. No human security acceptance or runtime/six-consumer/release qualification is inferred."
    testRef: "tests/scripts/glibc-xfd-experiment.test.mjs::original suite oracle still rejects every unwanted status and missing named candidate regression"
  - line: "resource-inheritance"
    description: "Preserve original command, security, custody, deadline and cleanup semantics"
    formula: "Exact runner inverse permits only experiment source-hook and honest status/hash-field substitutions. Retain350minute job/340controller including20cleanup,40GiB initial workspace+daemon/2GiB reserve, native AMD64/no-network owned package container, original argument-filtered seccomp and normal owned cleanup."
