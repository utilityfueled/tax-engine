notes: |
  The current unforgeable resident-credit context compares every expected
  projection field by hashing both normalized serialized values solely for
  equality. Compare their same TextEncoder UTF-8 bytes instead. Preserve the
  exact stable Decimal conversion, omitted undefined object children, ordered
  arrays, JSON escaping, byte lengths and byte equality. Do not introduce a
  global cache, caller-supplied proof, tax formula or timing policy change.
  A source build also compares the complete fresh federal result with the caller's
  supplied federal result using these same normalized UTF-8 bytes; only that
  throwaway two-hash comparison changes. Keep the independent fresh federal
  calculation in the same error position and keep smaller identity hashes.
  The stored facts digest check, source commitment, semantic receipt identities,
  residency commitment, payment commitment and public result remain unchanged.
