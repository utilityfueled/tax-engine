form: "Node26-Runtime-Source-Contract"
fullName: "Node 26 runtime pins and reproducible Linux bootstrap"
taxYear: 2026
reference: "https://nodejs.org/en/blog/release/v26.13.1; https://nodejs.org/en/blog/vulnerability/november-2026-security-releases; https://raw.githubusercontent.com/nodejs/docker-node/1274f3ee37d4d0e59d308ea25b83d9e21e4db862/26/trixie-slim/Dockerfile; https://registry.npmjs.org/pnpm/10.34.8; https://security-tracker.debian.org/tracker/DSA-6613-1"
notes: |
  Operational source contract, not tax eligibility or a filing/readiness change.
  Node24.22.1/Undici7.30.1 Request(FormData) cancellation produced unhandled
  enqueue-after-close failures through unchanged upload and historical APIs.
  Official Node26.13.0/Undici8.12.2 ran unchanged33+130 with no unhandled errors.
  This local comparison does not establish Linux image, full suite or deployment.
  Exact development, CI and image baseline is 26.13.1. Hosted engines select 26.x;
  Vercel can use different minor/patch versions in build and function runtime.
  Node25+ no longer bundles Corepack. Bootstrap only existing pnpm10.34.8 from
  published SHA512-verified tarball with lifecycle scripts disabled. Keep lock,
  TS5.9.3, Decimal10.6.0, pdf-lib1.17.1 and Node24 compatibility types unchanged.
  The Node26 package preserved historical lock d199e2344fa6cf61402330f216e3f7ccf6bc9b5e7a568670b29a9fe27dc8c23f.
  Subsequent separately reviewed Vercel Functions dependency commit1fef5041 adds
  only its web importer and17 package/snapshot entries, retaining every old entry.
  The Vercel Functions lock hash was 268026058217dd84aee4e9b1c691fa1bac7d3049e6cb68d7fd16ef3af7a76dea.
  The separately reviewed Next.js 16.4.6 successor 651fa206 updates only
  the Next family and peer references. Its historical lock SHA-256 is
  64cccb8d87c0bfb6422210ecf5b4c12e6a1ef468976d7d68a466e5e5a744c4a2.
  The separately reviewed Nodemailer 10.4.1 successor 3d6a8e3a changes
  only the Nodemailer web importer, package and snapshot entries. Its
  lock SHA-256 was 2553ee4f90ed1ec557e633f9b10e588198f8a5c49b833fa0f6b3ad0133345393.
  The separately reviewed PDF font dependency commit 11efa4a1 adds fontkit
  2.0.4 and its type definitions to the root importer, and adds 11 package
  and snapshot entries while preserving all previous entries. Bind current
  lock SHA-256 4a30d16012713f30ef5a88f71dd4b52923448452b97fc7290ac9f505ed8e1376.
  Future dependency changes require their own source review and exact successor.
  The November 11 Node security update includes high-severity HTTP/2 and TLS
  fixes and upgrades bundled Undici to 8.12.4. The November 12 image refresh pins
  official index e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
  in both stages, CI preload and same-architecture smoke proof. The official
  index resolves to Linux AMD64 and ARM64 images whose configurations both
  declare Node 26.13.1.
  This source pin is not a qualified build, scanner result or risk acceptance.
  Official trixie recipe installs libatomic1; both actual architectures still
  require native linkage, package/layer proof, recovery and fresh scan evidence.
  Both image stages start with the older Debian zlib1g package. Apply the
  exact DSA-6613-1 update before application commands in both stages. The
  four architecture packages are content-addressed by Debian Snapshot and
  their sizes and SHA-256 hashes come from the signed security repository.
lines:
  - line: "package-roots"
    formula: "Root and web engines >=26.13.1 <27; package manager10.34.8 and all application/type pins remain unchanged."
    testRef: "tests/runtime/node26-runtime-source-contract.test.ts::declares Node 26 at both deployable package roots without changing retained pins"
  - line: "development-ci"
    formula: "Both runtime-manager files pin 26.13.1. The main CI, reusable unit shard and Web workflows inherit .node-version at every Node setup step."
    testRef: "tests/runtime/node26-runtime-source-contract.test.ts::pins local and inherited CI Node versions consistently"
  - line: "immutable-image"
    formula: "Both Docker stages and CI preload use the same 26.13.1-trixie-slim OCI index; no architecture-specific substitution."
    testRef: "tests/runtime/node26-runtime-source-contract.test.ts::binds both image stages and CI preload to the reviewed multiarch index"
  - line: "pnpm-bootstrap"
    formula: "No corepack-enable assumption; fetch existing10.34.8 tarball, verify published SHA512 before global local-tarball install; ignore lifecycle scripts."
    testRef: "tests/runtime/node26-runtime-source-contract.test.ts::verifies the pinned pnpm archive before installing without lifecycle scripts"
  - line: "runtime-proof"
    formula: "Actual runner must report exact Node 26.13.1 and Undici 8.12.4, retain libatomic1 and original non-root/layer/full-package/apt-removal proof. Only zlib1g may change version, from the observed base version to the exact DSA update."
    testRef: "tests/runtime/node26-runtime-source-contract.test.ts::retains source guards for actual runtime identity and Linux dependency proof"
  - line: "mount-attack-surface"
    source: "https://security-tracker.debian.org/tracker/CVE-2026-76642"
    formula: "Purge only the optional mount package in addition to the two APT packages, using normal dpkg dependency handling. The actual immutable base must allow an unforced dry run. Confirm mount and umount are absent from the runner and preserve all other package records, including libmount1 and required core libraries. Remaining util-linux findings stay open."
    testRef: "tests/runtime/node26-runtime-source-contract.test.ts::removes the unused mount executables without weakening package proof"
  - line: "infocmp-attack-surface"
    sources:
      - "https://security-tracker.debian.org/tracker/CVE-2025-69720"
      - "https://manpages.debian.org/trixie/dpkg/dpkg.1.en.html"
    formula: "Remove the unused infocmp executable only in the final app image and keep a single exact dpkg exclusion for its installation path. Prove the path is absent, retain installed ncurses-bin, ncurses-base and libtinfo6 package records, and query the xterm terminfo database with tput during smoke. All ncurses package findings remain in the scan and require separate disposition."
    testRef: "tests/runtime/node26-runtime-source-contract.test.ts::excludes only infocmp while retaining terminal metadata and tools"
  - line: "debian-zlib-update"
    formula: "Both Docker stages install only zlib1g 1:1.3.dfsg+really1.3.1-1+deb13u1 using exact SHA-256 and size for the base's amd64, arm64, ppc64el and s390x package archives. Install using dpkg and verify the resulting package version and status."
    testRef: "tests/runtime/node26-runtime-source-contract.test.ts::installs the exact Debian zlib fix in both image stages"
  - line: "frozen-dependencies"
    sources:
      - "https://github.com/nodemailer/nodemailer/security/advisories/GHSA-3q53-mvfw-q9v8"
      - "https://github.com/nodemailer/nodemailer/security/advisories/GHSA-2g53-87p2-4qq8"
      - "https://registry.npmjs.org/fontkit/2.0.4"
    formula: "Preserve the historical runtime lock evidence and bind the reviewed PDF font dependency successor to its exact frozen lock hash. Reject arbitrary lock drift."
    testRef: "tests/runtime/node26-runtime-source-contract.test.ts::preserves the reviewed dependency lock exactly"
  - line: "operational-docs"
    formula: "Current setup documentation names 26.13.1/26; historical Node 24 and 26.13.0 evidence remains unchanged."
    testRef: "tests/runtime/node26-runtime-source-contract.test.ts::updates active operational prerequisites without rewriting historical receipts"
