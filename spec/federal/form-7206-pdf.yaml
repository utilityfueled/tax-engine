form: "Form 7206 physical review map"
fullName: "Separate actual-business health insurance review forms"
taxYear: 2025
irsReference: "https://www.irs.gov/pub/irs-pdf/f7206.pdf"
notes: "Final 2025 template created October 2, 2025; SHA256 822203c9bbd958e651e243bbf6353c4c8e78abbde412e06caf6db5f88fe68ee1. Source and widget inspection do not establish independent filing qualification."
lines:
  - line: "identity"
    description: "Actual return name and TIN"
    formula: "Use the actual names shown on the return and its primary TIN. An identifier cleared by the review pipeline remains blank; business owner and source remain explicit in the appendix."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::preserves cleared review identifiers and closed year gates"
  - line: "1"
    description: "Eligible medical premiums"
    formula: "Copy the unique owner/business line 1 audit."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "2"
    description: "Eligible LTC premiums"
    formula: "Copy the unique owner/business line 2 audit after per-person annual caps."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "3"
    description: "Total eligible premiums"
    formula: "Copy the unique owner/business line 3 audit."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "4"
    description: "Actual business income"
    formula: "Copy owner/business line 4 for self-employed or partnership sources; leave blank for S corporations."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "5"
    description: "Same-owner positive business income"
    formula: "Copy line 5; exclude the other owner and loss businesses from this persisted denominator."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "6"
    description: "Business income share"
    formula: "Copy the audited line 6 ratio as a percentage displayed to six decimal places. The appendix preserves the exact Decimal ratio; display rounding does not recalculate line 7."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "7"
    description: "Allocated SE deduction"
    formula: "Copy the persisted line 7 audit, without recomputing from the rounded displayed ratio."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "8"
    description: "Income after SE deduction"
    formula: "Copy signed line 8."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "9"
    description: "Attributed retirement deduction"
    formula: "Copy actual line 9 including known zero."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "10"
    description: "Income after retirement"
    formula: "Copy signed line 10."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "11"
    description: "S corporation Medicare wages"
    formula: "Copy line 11 for the actual shareholder business; leave blank for other business kinds."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "12"
    description: "Attributed foreign exclusion"
    formula: "Copy actual line 12 including known zero."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "13"
    description: "Available income limit"
    formula: "Copy line 13."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "14"
    description: "Business deduction"
    formula: "Copy each actual line14 rounded for the physical form. Ordinary non-Marketplace transfers sum per-business rounded amounts. Pub974 specified-premium coordination retains nonspecified amounts on the physical forms and transfers its separately audited combined return amount once."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "source-review"
    description: "Original source statement"
    formula: "Keep each business source, actual paid and excluded premium shares, source date/month, LTC age/cap and exact calculated cents in a separately labeled review appendix. All pages retain a review-only notice. No source or calculation is invented from a legacy premium total."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::preserves original cents and source facts in a paginated review appendix"
  - line: "packet"
    description: "Separate business forms"
    formula: "Attach one completed physical 2025 Form 7206 per actual business, retaining interactive fields unless flatten is explicitly selected. Unknown, conflicting or incomplete audits reject export; 2026 and filing export gates remain closed."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::attaches a separate actual form for each business without duplicating legacy summaries"
  - line: "marketplace-simplified"
    description: "Separate nonspecified physical lines and actual specified-premium calculation"
    formula: "For the supported2025 Simplified method, preserve actual nonspecified Form7206 lines; show actual business Step3 lines1,6,7 and return-level lines7-11, W/X/Y/Z source audits, Step2 credit and final Form8962 credit in a separate review appendix. Monetary worksheet display rounds to cents with an explicit label; the audit retains full precision and original amounts remain unchanged. Do not fabricate a final specified deduction for each business or duplicate the return transfer."
    irsRef: "https://www.irs.gov/publications/p974; Nonspecified Premiums, Simplified Calculation Method Steps3-4 and more than one trade or business"
    testRef: "tests/pdf/form7206-marketplace-review.test.ts::keeps nonspecified physical lines separate from the actual Pub974 return deduction"
  - line: "marketplace-ordinary"
    description: "Final no-credit method uses actual ordinary forms"
    formula: "When final Step2 cannot take PTC, copy the completed ordinary Form7206 lines and reconcile their aggregate rounded transfer. Label attempted historical or ordered worksheets as interim rather than the final deduction or repayment source."
    irsRef: "https://www.irs.gov/publications/p974; Simplified Calculation Method Step2 Cannot take the PTC"
    testRef: "tests/pdf/form7206-marketplace-review.test.ts::uses the final ordinary worksheet after an actual no-credit result"
  - line: "marketplace-source-reconciliation"
    description: "Export checks actual premium source and unique persisted audits"
    formula: "Require matching source year, method, original policy links, paid/APTC/person/month conservation, actual business identities and all unique business/aggregate/historical calculation audits; exact Decimal amounts and the final Schedule1 transfer must reconcile before output. Never calculate from redacted identifiers or infer a missing worksheet."
    irsRef: "https://www.irs.gov/publications/p974; Specified Premiums, WorksheetsW/X/Y/Z and Simplified Calculation Method"
    testRef: "tests/pdf/form7206-marketplace-review.test.ts::rejects altered Marketplace sources methods and missing or conflicting audits"
  - line: "marketplace-packet"
    description: "Complete review packet preserves interaction privacy and year gates"
    formula: "Attach the actual Form7206 plus paginated source/calculation appendix; retain16 canonical fields and matching widget appearances, visible review notices and blank redacted TIN. Actual2026 output remains unavailable."
    irsRef: "Form7206(2025), final revision October2,2025; Pub974(2025)"
    testRef: "tests/pdf/form7206-marketplace-review.test.ts::attaches the complete reviewed Marketplace packet with cleared identifiers"
  - line: "marketplace-source-cents"
    description: "Original cents and actual printed-dollar PTC"
    formula: "Keep source premiums in cents while checking credit conservation at the canonical printed-dollar boundary;5999.88 enrollment can support6000 printed credit without inventing12c of original premiums."
    irsRef: "Pub974(2025) Simplified Method; Form8962 whole-dollar amounts"
    testRef: "tests/pdf/form7206-marketplace-review.test.ts::retains original premium cents with the printed whole-dollar full credit"
  - line: "marketplace-separate-businesses"
    description: "Separate source calculations and shared return amount"
    formula: "Each physical form and business Step3 source rows bind its actual business. Step3lines8-11 remain one return-level amount; repeated reference appendices cannot become additional claims."
    irsRef: "Pub974(2025) Simplified Step3 More than one trade or business"
    testRef: "tests/pdf/form7206-marketplace-review.test.ts::keeps separate business sources under one combined transfer"
  - line: "marketplace-ordered-audits"
    description: "Actual ordered deductions and revised historical limits"
    formula: "Keep actual completed ordered source claims and their Y/Z limits with the corresponding final credit and combined health transfer; preserve the distinction between an interim claim basis and final MAGI."
    irsRef: "Pub974(2025) Special Instructions for Self-Employed Individuals Who Claim Certain Deductions/Exclusions"
    testRef: "tests/pdf/form7206-marketplace-review.test.ts::preserves actual ordered IRA and loan worksheets in the review appendix"
  - line: "marketplace-current-business-sources"
    description: "Bind review income limits to current actual business and payroll sources"
    formula: "Independently recalculate the scoped Schedule C/F, dependent-care adjustment, crypto business, owner SE and foreign exclusion prerequisites from the supplied source records, then use the canonical Form7206 business binder. Reject stale profits, denominator businesses, payroll limits, duplicate owner SE records and owner contradictions before emitting physical or Pub974 pages. Identifier redaction must not trigger a whole-return recalculation."
    irsRef: "Form7206(2025) lines4-13; Pub974(2025) Nonspecified Premiums and Simplified Calculation Method"
    testRef: "tests/pdf/form7206-marketplace-review.test.ts::rejects stale business and payroll context instead of trusting persisted amounts"
  - line: "ordinary-current-business-sources"
    description: "Ordinary business income is bound before physical export"
    formula: "The same source recalculation rejects stale ScheduleC profit or shareholder W2 Medicare wages in ordinary forms, preserving the actual per-business income limit and owner."
    irsRef: "Form7206(2025) lines4-14"
    testRef: "tests/pdf/fill-form-7206.test.ts::rejects stale ordinary business and shareholder wage sources"
