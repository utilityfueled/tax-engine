    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "7"
    description: "Allocated SE deduction"
    formula: "Copy the persisted line 7 audit, without recomputing from the rounded displayed ratio."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "8"
    description: "Income after SE deduction"
    formula: "Copy signed line 8."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "9"
    description: "Attributed retirement deduction"
    formula: "Copy actual line 9 including known zero."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
