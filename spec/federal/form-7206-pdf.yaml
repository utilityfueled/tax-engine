    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "6"
    description: "Business income share"
    formula: "Copy the audited line 6 ratio as a percentage displayed to six decimal places. The appendix preserves the exact Decimal ratio; display rounding does not recalculate line 7."
