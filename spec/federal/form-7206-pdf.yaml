  - line: "10"
    description: "Income after retirement"
    formula: "Copy signed line 10."
    irsRef: "Form7206 (2025) lines1-14 and Instructions more than one plan and business"
    testRef: "tests/pdf/fill-form-7206.test.ts::copies every applicable actual business line into the registered physical form"
  - line: "11"
    description: "S corporation Medicare wages"
    formula: "Copy line 11 for the actual shareholder business; leave blank for other business kinds."
