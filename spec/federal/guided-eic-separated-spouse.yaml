form: "Guided EIC separated-spouse sources"
fullName: "Actual Rule 3 separation and qualifying-child records"
taxYear: 2026
irsReference: "https://www.irs.gov/publications/p596"
notes: |
  Refreshed 2026-10-26: IRC32(d)(2)(B), Pub596 Rules3/8/9 and final2025
  i1040gi EIC Step3 distinguish actual qualifying-child presence from the
  subsection(b) timely valid-SSN child count. Final2025 ScheduleEIC line2
  expressly permits an actual blank identifier for the self-only route.
  The guide preserves original household identities, original months, actual
  full-year period and each independent separation alternative. It never asks
  for an eligibility, MAGI or credit override. Use the shared facts-only source
  validator; no fictional financial context is constructed for validation.
  Unknown answers remain unknown; all candidate children and actual other
  eligible claimants need complete records, including explicitly known empty
  lists. Source edits revoke confirmation. The existing competing-claim,
  married-child and special-period method boundaries remain explicit.
  Actual blank child IDs are permitted only in the confirmed bound EIC source
  route with timely valid SSN false and no CTC/ODC claim. A missing record or
  unknown answer cannot waive identification requirements elsewhere.
  Historical saved fields remain intact. No new student restriction, formula,
  filing qualification or public2026 readiness is introduced.
lines:
