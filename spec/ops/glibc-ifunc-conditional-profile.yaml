form: "glibc-IFUNC-Conditional-Profile"
taxYear: 2025
status: "private-source-proposal-not-qualified"
reference: "https://deb.debian.org/debian/pool/main/g/glibc/glibc_2.44-1.dsc"
notes: |
  Local two-hunk adaptation from authenticated Debian2.44-1 to exact2.36-9+deb12u14.
  No claim of an upstream correcting-commit cherry-pick. Six other XPASS remain a hard hold.
lines:
  - line: "four-conditional-only"
    description: "Retain all original test bodies and only scope four LLD expectations"
    formula: "Only configured with-lld=no clears four IFUNC expectations; yes/unset/unknown retain them. Exact source before/after hashes and inverse retain every other byte, all test registrations/static variants/tunables and all six Debian expected-failure annotations. Keep the original strict FAIL/XPASS/UNRESOLVED/ERROR gate."
    testRef: "tests/scripts/glibc-ifunc-experiment.test.mjs::four-only source correction preserves all assertions and six strict holds"
  - line: "exact-context-before-mutation"
    description: "Admit only exact reviewed XFD intermediate recipe and fresh additive inputs"
    formula: "Validate original XFD recipe and all authenticated existing input hashes, exactly pinned five new source inputs and fresh destinations before mutation; retain prior recipes/ledgers and bind the final derived recipe digest in the returned manifest. All existing actions/security/resource/deadline/CVE/ABI gates retain exact original inverse."
    testRef: "tests/scripts/glibc-ifunc-experiment.test.mjs::prepared context binds exact new inputs and effective recipe without replacing authority"
  - line: "per-flavour-source-export"
    description: "Retain configuration/linker evidence even when build or strict gate fails"
    formula: "One EXIT-trap hook before original artifact ledger, preserving original nonzero exit, exports baseline/candidate per-flavour config.make/configparms/config.log bytes and hashes. Record literal with-lld/LD and overrides; never eval Make or shell. Resolve only supported single linker token, hash canonical ELF and bounded --version under shared6second budget. Missing/unsafe/failed identities are explicit unavailable; never infer qualified success. Source read custody checks reject symlink/hardlink/drift and source bytes stay unchanged. Export failure holds an otherwise successful recipe."
    testRef: "tests/scripts/glibc-ifunc-export.py::ExportControls"
  - line: "literal-make-admission"
    description: "Fail closed on unsupported Make syntax; never infer effective linker execution"
    formula: "Admit plain assignments only. Relevant LD and with-lld values must be literal; reject prefixed/target-specific/indirect assignments, conditionals, define/eval/functions and physical continuations. Admit only the exact variant-bound Debian expected-failure include with the pinned original file bytes; all other includes are unavailable. Retain literal config.make values, literal configparms overrides, merged configuration values and an explicit no-Make-evaluation/no-historical-execution disclaimer. The exact target template and Debian-generated configparms syntax are retained positive controls; actual7bea config.make/config.log files are now exported; config.make contains no LD and config.log carries the Autoconf literal LD."
    testRef: "tests/scripts/glibc-ifunc-export.py::ExportControls"
  - line: "six-fixed-case-diagnostics"
    description: "Retain existing six-case outputs without running or reclassifying tests"
    formula: "For every discovered flavour export only six fixed case names times .out/.test-result; regular single-link source custody and byte/inode checks before/after capture and final recheck; perform the new I/O after all original linker observations so their shared deadline is unchanged. Per-out1MiB, per-result64KiB and aggregate16MiB caps; unavailable/missing/oversize are explicit and no partial/truncated input is represented as complete. Preserve current qualification result, strict status gates, workload commands, budgets, profiles and zero reruns; metadata never infers test execution. Existing artifact ledger binds every captured file."
    testRef: "tests/scripts/glibc-ifunc-export.py::DiagnosticControls"
  - line: "autoconf-literal-configured-linker"
    description: "Observe configured linker from the actual target config.log output variable"
    formula: "Require exactly one standard Autoconf cache/output/confdefs section sequence. Read only single physical-line literal LD from output variables and yes/no libc_cv_with_lld from cache; cross-check exact config.make with-lld and any optional LD. Reject duplicate/missing/malformed/unknown relevant values, multiline/CR/continuation, prefixed or executable/indirect syntax; never evaluate shell or Make. Keep literal configparms overrides and exact admitted include custody. New source-location admission never creates missing export-time ELF/version evidence or historical linker execution. Saved actual7bea offline checks prove parsing only; six captured XPASS remain a strict failure."
    testRef: "tests/scripts/glibc-ifunc-export.py::ConfigLogControls"
