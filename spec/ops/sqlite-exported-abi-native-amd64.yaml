form: "SQLite-Exported-ABI-Native-AMD64"
taxYear: 2025
lines:
  - line: "artifact-source-git-custody"
    description: "Retain original artifact-source Git objects for the exact tools recipe check"
    formula: "The exact current adapter commit checkout retains history with fetch-depth zero and persist-credentials false, so the separately selected historical artifact commit can be verified by original git-show recipe equality. Missing source objects remain failure."
    testRef: "tests/scripts/sqlite-exported-abi-artifact.test.mjs::retains artifact-source Git history without persisted credentials"
  - line: "closed-public-artifact"
    description: "Bind one closed original SQLite package artifact before any package decoding"
    formula: "Exact public nonfork utilityfueled/tax-engine repository, original fixed workflow ID/path, dispatch attempt one, completed run/source and matching artifact id/name/digest/size; token only on fixed GitHub API, one bounded private authenticated-response redirect and no URL output. All pair and original failure gates remain."
    testRef: "tests/scripts/sqlite-exported-abi-artifact.test.mjs::requires exact closed workflow run source and immutable artifact metadata"
  - line: "public-projection"
    description: "Publish only fixed bounded projections while retaining raw ABI data privately"
    formula: "No raw command output or package/debug payload upload. Publish exact fixed result/hash/count metadata after normal controller closure; explicit rawIndependentAbiReviewAvailable false, generic approval/runtime/release/risk false. Missing or nonzero ABI commands remain failure."
    testRef: "tests/scripts/sqlite-exported-abi-artifact.test.mjs::never publishes raw ABI or arbitrary command text"
  - line: "new-tool-materialization"
    description: "Materialize only the exact source tools recipe and independently bind installed tool bytes"
    formula: "Exact original Git blob/native base plus authenticated version-pinned .deb member equality; no SQLite compilation or historical image-identity claim."
    testRef: "tests/scripts/sqlite-exported-abi-native-amd64.test.mjs::preserves original tool recipe and appends only tool verification"
  - line: "owned-pid1-tools"
    description: "Use original supervision and normal owned cleanup for every fixed tool"
    formula: "Read-only network-none no-capability containers with exact image/label/mount custody; every nonzero or unknown closure holds, no force or retry."
    testRef: "tests/scripts/sqlite-exported-abi-native-amd64.test.mjs::runs fixed tools only in new owned hardened containers"
  - line: "missing-pair-hold"
    description: "Do not build tools when the corresponding candidate or debug data is absent"
    formula: "The unchanged package decoder must pass before materialization; inherited native admission/supervision/capacity/cleanup remain exact."
    testRef: "tests/scripts/sqlite-exported-abi-native-amd64.test.mjs::refuses missing pairs before native materialization"
